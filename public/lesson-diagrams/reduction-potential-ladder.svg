<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img" aria-labelledby="t d"><title id="t">The reduction-potential ladder: electrons fall, never climb</title><desc id="d">An ordered ladder of standard reduction potentials from fluorine at plus 2.87 volts at the top down to lithium at minus 3.04 volts at the bottom, listing permanganate, dichromate, oxygen, ferric iron, copper, the hydrogen reference at zero, NAD plus, iron, zinc and lithium with a note on each. An arrow up the side records that electrons flow spontaneously from a lower couple to a higher one. A panel below gives the cell potential and free energy relations and notes that scaling a half-reaction does not scale its potential.</desc><defs><marker id="m2768" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="900" height="660" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">The reduction-potential ladder: electrons fall, never climb</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">A couple higher on the ladder oxidises anything below it. That one rule predicts every spontaneous pairing.</text><rect x="176" y="108" width="664" height="30" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="196.0" y="129.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:15px">F₂ → 2F⁻</text><text x="430.0" y="129.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:15px">+2.87 V</text><text x="452.0" y="129.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">strongest common oxidant</text><rect x="176" y="143" width="664" height="30" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="196.0" y="164.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:15px">MnO₄⁻ → Mn²⁺</text><text x="430.0" y="164.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:15px">+1.51 V</text><text x="452.0" y="164.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">acidic permanganate</text><rect x="176" y="178" width="664" height="30" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="196.0" y="199.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:15px">Cr₂O₇²⁻ → 2Cr³⁺</text><text x="430.0" y="199.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:15px">+1.33 V</text><text x="452.0" y="199.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">oxidises 1° and 2° alcohols</text><rect x="176" y="213" width="664" height="30" rx="6" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="196.0" y="234.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:15px">O₂ → 2H₂O</text><text x="430.0" y="234.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:15px">+1.23 V</text><text x="452.0" y="234.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">terminal acceptor at Complex IV</text><rect x="176" y="248" width="664" height="30" rx="6" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="196.0" y="269.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:15px">Fe³⁺ → Fe²⁺</text><text x="430.0" y="269.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:15px">+0.77 V</text><text x="452.0" y="269.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">cytochromes</text><rect x="176" y="283" width="664" height="30" rx="6" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="196.0" y="304.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:15px">Cu²⁺ → Cu</text><text x="430.0" y="304.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:15px">+0.34 V</text><text x="452.0" y="304.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">cathode in a Daniell cell</text><rect x="176" y="318" width="664" height="30" rx="6" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="196.0" y="339.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:15px">2H⁺ → H₂</text><text x="430.0" y="339.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:15px"> 0.00 V</text><text x="452.0" y="339.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">reference electrode, by definition</text><rect x="176" y="353" width="664" height="30" rx="6" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="196.0" y="374.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:15px">NAD⁺ → NADH</text><text x="430.0" y="374.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:15px">−0.32 V</text><text x="452.0" y="374.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">carries electrons to Complex I</text><rect x="176" y="388" width="664" height="30" rx="6" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="196.0" y="409.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:15px">Fe²⁺ → Fe</text><text x="430.0" y="409.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:15px">−0.44 V</text><rect x="176" y="423" width="664" height="30" rx="6" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="196.0" y="444.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:15px">Zn²⁺ → Zn</text><text x="430.0" y="444.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:15px">−0.76 V</text><text x="452.0" y="444.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">anode in a Daniell cell</text><rect x="176" y="458" width="664" height="30" rx="6" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="196.0" y="479.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:15px">Li⁺ → Li</text><text x="430.0" y="479.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:15px">−3.04 V</text><text x="452.0" y="479.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">strongest common reductant</text><line x1="112" y1="469" x2="112" y2="120" stroke="#18364a" stroke-width="3" marker-end="url(#m2768)"/><text x="76.0" y="250.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">electrons flow</text><text x="76.0" y="267.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">spontaneously</text><text x="76.0" y="284.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">from a lower</text><text x="76.0" y="301.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">couple to a</text><text x="76.0" y="318.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">higher one</text><rect x="60" y="507" width="780" height="138" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="450.0" y="535.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">Reading the ladder quantitatively</text><text x="230.0" y="565.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">E°cell = E°cathode − E°anode</text><text x="560.0" y="565.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">ΔG° = −nFE°cell</text><text x="760.0" y="565.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">F = 96,485 C/mol</text><text x="450.0" y="593.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">E°cell &gt; 0   ↔   ΔG° &lt; 0   ↔   K &gt; 1</text><text x="450.0" y="619.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Potential is intensive: doubling a half-reaction doubles n but leaves E° unchanged.</text></svg>