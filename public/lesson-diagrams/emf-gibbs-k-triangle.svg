<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="t d"><title id="t">E°cell, ΔG° and K are one fact in three languages</title><desc id="d">A triangle linking standard cell potential, standard free energy change and the equilibrium constant. The edge from potential to free energy carries delta G equals minus nFE; the edge from free energy to K carries delta G equals minus RT ln K; the edge from potential back to K carries E equals 0.0592 over n times log K at 298 kelvin. A table below shows the three quantities moving together: positive potential with negative free energy and K above one is spontaneous, the reverse is not, and all three at their neutral values means equilibrium. A note records that potential is intensive while free energy is extensive.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="900" height="620" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">E°cell, ΔG° and K are one fact in three languages</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Know any one of them and the other two follow. The only thing to get right is the sign.</text><circle cx="450.0" cy="122.0" r="54" fill="#e4edf3" stroke="#245574" stroke-width="2.5"/><text x="450.0" y="120.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:22px">E°cell</text><text x="450.0" y="142.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">volts</text><circle cx="339.1487483155919" cy="314.0" r="54" fill="#f5e6e8" stroke="#a8324a" stroke-width="2.5"/><text x="339.1" y="312.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:22px">ΔG°</text><text x="339.1" y="334.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">joules per mole</text><circle cx="560.8512516844081" cy="314.00000000000006" r="54" fill="#e5ece3" stroke="#5b7a64" stroke-width="2.5"/><text x="560.9" y="312.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:22px">K</text><text x="560.9" y="334.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">unitless</text><line x1="423.0" y1="168.7653718043597" x2="366.1487483155919" y2="267.2346281956403" stroke="#18364a" stroke-width="2"/><text x="276.6" y="214.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">ΔG° = −nFE°cell</text><line x1="393.1487483155919" y1="314.0" x2="506.8512516844081" y2="314.00000000000006" stroke="#18364a" stroke-width="2"/><text x="450.0" y="350.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">ΔG° = −RT ln K</text><line x1="477.0" y1="168.7653718043597" x2="533.8512516844081" y2="267.23462819564037" stroke="#18364a" stroke-width="2"/><text x="627.4" y="214.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">E°cell = (0.0592/n) log K</text><text x="450.0" y="396.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">F = 96,485 C/mol   ·   at 298 K</text><rect x="60" y="420" width="780" height="180" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="450.0" y="448.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">The three always move together</text><text x="206.0" y="476.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">E°cell</text><text x="396.0" y="476.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">ΔG°</text><text x="568.0" y="476.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">K</text><text x="752.0" y="476.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">meaning</text><text x="206.0" y="504.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">&gt; 0</text><text x="396.0" y="504.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">&lt; 0</text><text x="568.0" y="504.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">&gt; 1</text><text x="752.0" y="504.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:14px">spontaneous as written</text><text x="206.0" y="530.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:16px">= 0</text><text x="396.0" y="530.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:16px">= 0</text><text x="568.0" y="530.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:16px">= 1</text><text x="752.0" y="530.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">at equilibrium</text><text x="206.0" y="556.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">&lt; 0</text><text x="396.0" y="556.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">&gt; 0</text><text x="568.0" y="556.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">&lt; 1</text><text x="752.0" y="556.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:14px">reverse is spontaneous</text><text x="450.0" y="586.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">E°cell is intensive — scaling a half-reaction leaves it alone. ΔG° is extensive and scales with n.</text></svg>