<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc"><title id="title">Recycling, degradation and secretion</title><desc id="desc">A plasma-membrane receptor is internalized to an early endosome. It can recycle while cargo proceeds to a late endosome and lysosome. A separate ER Golgi secretory route releases lumenal cargo outside.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245574"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#18364a;font-size:19px}.h{font-size:27px;font-weight:700}.sub{font-size:22px;font-weight:700}.s{font-size:16px}.tiny{font-size:14px}</style><rect width="900" height="760" rx="20" fill="#fbf7ef"/><text x="32" y="43" class="h" text-anchor="start">Different destinations, preserved orientation</text><text x="32" y="77" class="s" text-anchor="start">Arrows indicate cargo routes; organelles are not to scale.</text><path d="M32 144H868" fill="none" stroke="#245574" stroke-width="3"/><path d="M32 154H868" fill="none" stroke="#245574" stroke-width="3"/><text x="40" y="108" class="s" text-anchor="start">EXTRACELLULAR</text><text x="40" y="188" class="" text-anchor="start">CYTOSOL</text><path d="M200 173V130L184 116M200 130L216 116" fill="none" stroke="#245574" stroke-width="3"/><circle cx="200" cy="106" r="10" fill="#bdd0dc" stroke="#245574" stroke-width="2"/><path d="M200 185V225" fill="none" stroke="#245574" stroke-width="3" marker-end="url(#arrow)"/><circle cx="200" cy="260" r="28" fill="white" stroke="#245574" stroke-width="2"/><circle cx="200" cy="252" r="8" fill="#bdd0dc" stroke="#245574" stroke-width="2"/><text x="247" y="267" class="s" text-anchor="start">Coated uptake</text><path d="M200 295V335" fill="none" stroke="#245574" stroke-width="3" marker-end="url(#arrow)"/><rect x="120" y="348" width="160" height="85" rx="38" fill="#e5eef2" stroke="#245574" stroke-width="2"/><text x="200" y="383" class="" text-anchor="middle">Early</text><text x="200" y="409" class="" text-anchor="middle">endosome</text><circle cx="153" cy="390" r="7" fill="#bdd0dc" stroke="#245574" stroke-width="2"/><path d="M125 365Q62 330 70 240Q70 210 112 163" fill="none" stroke="#245574" stroke-width="3" marker-end="url(#arrow)"/><text x="42" y="310" class="s" text-anchor="start">Recycle</text><path d="M285 391H355" fill="none" stroke="#245574" stroke-width="3" marker-end="url(#arrow)"/><rect x="366" y="348" width="165" height="85" rx="38" fill="#e5eef2" stroke="#245574" stroke-width="2"/><text x="449" y="381" class="" text-anchor="middle">Late</text><text x="449" y="408" class="" text-anchor="middle">endosome</text><circle cx="390" cy="420" r="5" fill="white" stroke="#245574" stroke-width="2"/><circle cx="417" cy="420" r="5" fill="white" stroke="#245574" stroke-width="2"/><circle cx="445" cy="420" r="5" fill="white" stroke="#245574" stroke-width="2"/><path d="M535 391H597" fill="none" stroke="#245574" stroke-width="3" marker-end="url(#arrow)"/><circle cx="678" cy="392" r="69" fill="#bdd0dc" stroke="#245574" stroke-width="2"/><text x="678" y="386" class="" text-anchor="middle">Lysosome</text><text x="678" y="414" class="s" text-anchor="middle">Degradation</text><path d="M32 484H868" fill="none" stroke="#245574" stroke-width="3"/><text x="40" y="520" class="sub" text-anchor="start">Secretory route</text><path d="M70 568Q100 548 145 568Q180 583 210 568" fill="none" stroke="#245574" stroke-width="3"/><path d="M70 590Q100 570 145 590Q180 605 210 590" fill="none" stroke="#245574" stroke-width="3"/><path d="M70 612Q100 592 145 612Q180 627 210 612" fill="none" stroke="#245574" stroke-width="3"/><text x="140" y="649" class="" text-anchor="middle">ER</text><path d="M226 589H306" fill="none" stroke="#245574" stroke-width="3" marker-end="url(#arrow)"/><rect x="330" y="555" width="100" height="13" rx="7" fill="#bdd0dc" stroke="#245574" stroke-width="2"/><rect x="338" y="576" width="100" height="13" rx="7" fill="#bdd0dc" stroke="#245574" stroke-width="2"/><rect x="346" y="597" width="100" height="13" rx="7" fill="#bdd0dc" stroke="#245574" stroke-width="2"/><text x="390" y="649" class="" text-anchor="middle">Golgi</text><path d="M456 589H528" fill="none" stroke="#245574" stroke-width="3" marker-end="url(#arrow)"/><circle cx="578" cy="589" r="34" fill="white" stroke="#245574" stroke-width="2"/><circle cx="578" cy="589" r="8" fill="#bdd0dc" stroke="#245574" stroke-width="2"/><text x="578" y="649" class="s" text-anchor="middle">Secretory vesicle</text><path d="M620 589Q813 590 813 455V170" fill="none" stroke="#245574" stroke-width="3" marker-end="url(#arrow)"/><text x="800" y="248" class="s" text-anchor="middle">Fusion</text><circle cx="813" cy="112" r="8" fill="#bdd0dc" stroke="#245574" stroke-width="2"/><text x="40" y="704" class="s" text-anchor="start">Luminal cargo becomes extracellular when a vesicle fuses with the surface.</text><text x="40" y="734" class="s" text-anchor="start">Receptors can recycle while ligands take a different route; LDL is one example.</text></svg>