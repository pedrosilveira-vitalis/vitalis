<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="t d"><title id="t">Exercise vs. hemorrhage: same sympathetic surge, different outcomes</title><desc id="d">A table comparing aerobic exercise and significant hemorrhage. Both: sympathetic activity up, heart rate up, renal blood flow down. Cardiac output: up four- to fivefold in exercise, down in hemorrhage. Preload up vs down. Total peripheral resistance down vs up. Systolic pressure up vs down. Pulse pressure widens vs narrows. Skin blood flow up (cooling) vs down (pallor). RAAS and ADH mild vs strong. Arterial PCO2 roughly constant during moderate exercise vs falling with compensatory hyperventilation in shock.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="680" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Exercise vs. hemorrhage: same sympathetic surge, different outcomes</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Direction of change from rest (↑ increase, ↓ decrease, ~ little change). Hemorrhage column assumes a significant bleed.</text><text x="60.0" y="120.0" class="" text-anchor="start" style="font-weight:700;font-size:17px">Variable</text><text x="560.0" y="120.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:17px">Aerobic exercise</text><text x="830.0" y="120.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:17px">Hemorrhage</text><rect x="40" y="139" width="920" height="40" rx="4" fill="#f6f3ec" stroke="#6d716f" stroke-width="0"/><text x="60.0" y="167.0" class="" text-anchor="start" style="font-size:16px">Sympathetic activity</text><text x="560.0" y="170.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:24px">↑</text><text x="830.0" y="170.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:24px">↑</text><rect x="40" y="186" width="920" height="40" rx="4" fill="#fbf7ef" stroke="#6d716f" stroke-width="0"/><text x="60.0" y="214.0" class="" text-anchor="start" style="font-size:16px">Heart rate</text><text x="560.0" y="217.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:24px">↑</text><text x="830.0" y="217.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:24px">↑</text><rect x="40" y="233" width="920" height="40" rx="4" fill="#f6f3ec" stroke="#6d716f" stroke-width="0"/><text x="60.0" y="261.0" class="" text-anchor="start" style="font-size:16px">Preload / venous return</text><text x="560.0" y="261.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:16px">↑ (muscle pump)</text><text x="830.0" y="264.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:24px">↓↓</text><rect x="40" y="280" width="920" height="40" rx="4" fill="#fbf7ef" stroke="#6d716f" stroke-width="0"/><text x="60.0" y="308.0" class="" text-anchor="start" style="font-size:16px">Cardiac output</text><text x="560.0" y="308.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:16px">↑ 4–5×</text><text x="830.0" y="311.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:24px">↓</text><rect x="40" y="327" width="920" height="40" rx="4" fill="#f6f3ec" stroke="#6d716f" stroke-width="0"/><text x="60.0" y="355.0" class="" text-anchor="start" style="font-size:16px">Total peripheral resistance</text><text x="560.0" y="355.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:16px">↓ (muscle vasodilation)</text><text x="830.0" y="355.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:16px">↑ (vasoconstriction)</text><rect x="40" y="374" width="920" height="40" rx="4" fill="#fbf7ef" stroke="#6d716f" stroke-width="0"/><text x="60.0" y="402.0" class="" text-anchor="start" style="font-size:16px">Systolic pressure</text><text x="560.0" y="405.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:24px">↑</text><text x="830.0" y="405.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:24px">↓</text><rect x="40" y="421" width="920" height="40" rx="4" fill="#f6f3ec" stroke="#6d716f" stroke-width="0"/><text x="60.0" y="449.0" class="" text-anchor="start" style="font-size:16px">Pulse pressure</text><text x="560.0" y="449.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:16px">widens</text><text x="830.0" y="449.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:16px">narrows</text><rect x="40" y="468" width="920" height="40" rx="4" fill="#fbf7ef" stroke="#6d716f" stroke-width="0"/><text x="60.0" y="496.0" class="" text-anchor="start" style="font-size:16px">Skin blood flow</text><text x="560.0" y="496.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:16px">↑ (heat loss)</text><text x="830.0" y="496.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:16px">↓ (cool, pale)</text><rect x="40" y="515" width="920" height="40" rx="4" fill="#f6f3ec" stroke="#6d716f" stroke-width="0"/><text x="60.0" y="543.0" class="" text-anchor="start" style="font-size:16px">RAAS / ADH</text><text x="560.0" y="543.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:700;font-size:16px">mild</text><text x="830.0" y="543.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:16px">strong</text><rect x="40" y="562" width="920" height="40" rx="4" fill="#fbf7ef" stroke="#6d716f" stroke-width="0"/><text x="60.0" y="590.0" class="" text-anchor="start" style="font-size:16px">Arterial PCO₂</text><text x="560.0" y="590.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:700;font-size:16px">~ (moderate exercise)</text><text x="830.0" y="590.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:16px">↓ (compensates lactic acidosis)</text><text x="500.0" y="660.0" class="" text-anchor="middle" style="font-weight:700;font-size:15px">Why opposite CO? Exercise raises preload and lowers afterload; hemorrhage removes preload.</text></svg>