<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">DNA chemistry and organization</title><desc id="desc">A pentose has five carbons but its ring contains four carbons and one oxygen. Carbon 5 lies outside. Complementary DNA strands run antiparallel. AT has two hydrogen bonds and GC has three; stability also depends on stacking and solution conditions. A nucleosome core has two each of H2A H2B H3 H4 and around 147 base pairs.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#aa3653;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">DNA: follow atoms, strands and packaging</text><rect x="24" y="60" width="752" height="217" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="94" class="h" text-anchor="start">1  Five carbons ≠ five carbons in the ring</text><path d="M190 130 L262 179" class="bond" /><path d="M262 179 L235 241" class="bond" /><path d="M235 241 L145 241" class="bond" /><path d="M145 241 L118 179" class="bond" /><path d="M118 179 L190 130" class="bond" /><rect x="171" y="117" width="38" height="25" fill="white"/><text x="190" y="135" class="s" text-anchor="middle">O</text><rect x="243" y="166" width="38" height="25" fill="white"/><text x="262" y="184" class="s" text-anchor="middle">C1′</text><rect x="216" y="228" width="38" height="25" fill="white"/><text x="235" y="246" class="s" text-anchor="middle">C2′</text><rect x="126" y="228" width="38" height="25" fill="white"/><text x="145" y="246" class="s" text-anchor="middle">C3′</text><rect x="99" y="166" width="38" height="25" fill="white"/><text x="118" y="184" class="s" text-anchor="middle">C4′</text><path d="M118 179 L75 133" class="bond" /><text x="63" y="124" class="s" text-anchor="start">C5′</text><path d="M262 179 L329 179" class="bond" /><text x="341" y="184" class="s" text-anchor="start">Base attaches at C1′</text><text x="365" y="220" class="s" text-anchor="start">DNA: C2′ has H</text><text x="365" y="249" class="s" text-anchor="start">RNA: C2′ has OH</text><rect x="24" y="293" width="752" height="171" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="327" class="h" text-anchor="start">2  Complementary strands are antiparallel</text><text x="220" y="365" class="t" text-anchor="middle">A</text><text x="220" y="413" class="t" text-anchor="middle">T</text><path d="M220 375 L220 392" class="bond" /><text x="320" y="365" class="t" text-anchor="middle">T</text><text x="320" y="413" class="t" text-anchor="middle">A</text><path d="M320 375 L320 392" class="bond" /><text x="420" y="365" class="t" text-anchor="middle">G</text><text x="420" y="413" class="t" text-anchor="middle">C</text><path d="M420 375 L420 392" class="bond" /><text x="520" y="365" class="t" text-anchor="middle">C</text><text x="520" y="413" class="t" text-anchor="middle">G</text><path d="M520 375 L520 392" class="bond" /><text x="115" y="365" class="t" text-anchor="start">5′</text><text x="630" y="365" class="t" text-anchor="start">3′</text><text x="115" y="413" class="t" text-anchor="start">3′</text><text x="630" y="413" class="t" text-anchor="start">5′</text><text x="55" y="445" class="s" text-anchor="start">Shown aligned: 5′-ATGC-3′ paired with 3′-TACG-5′.</text><rect x="24" y="480" width="752" height="100" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="514" class="h" text-anchor="start">3  Pairing is not the entire stability calculation</text><text x="55" y="552" class="s" text-anchor="start">A–T: 2 H-bonds; G–C: 3. Stacking, salt and sequence also matter.</text><rect x="24" y="596" width="752" height="120" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="630" class="h" text-anchor="start">4  Nucleosome core</text><text x="55" y="665" class="t" text-anchor="start">2 × (H2A + H2B + H3 + H4) = 8 histone proteins</text><text x="55" y="695" class="s" text-anchor="start">About 147 bp wrap around the core; linker histone H1 is separate.</text></svg>