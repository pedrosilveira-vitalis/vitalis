<svg xmlns="http://www.w3.org/2000/svg" width="920" height="836" viewBox="0 0 920 836" role="img" aria-labelledby="t d"><title id="t">Series shares the current; parallel shares the voltage</title><desc id="d">Top left: a series loop in which one current passes through both resistors, so the resistances add and the larger resistor takes the larger share of the voltage and dissipates the more power. Top right: a parallel pair across the same battery, where the voltage is common, the currents add, the equivalent resistance is smaller than either branch, and the smaller resistor now dissipates the more power. Middle: the worked twelve volt circuit with six ohms in series with four and twelve ohms in parallel, reduced step by step to an equivalent of nine ohms, a total current of one and a third amps, four volts across the parallel pair, and sixteen watts in total. Bottom: the two Kirchhoff rules as conservation of charge at a junction and conservation of energy around a loop.</desc><defs><marker id="m2940" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker><marker id="m7576" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="836" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Series shares the current; parallel shares the voltage</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Everything else — which resistor drops more volts, which one gets hot — follows from that</text><rect x="40" y="126" width="404" height="268" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="242.0" y="154.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">Series: one current, shared voltage</text><rect x="90" y="190" width="300" height="130" rx="0" fill="none" stroke="#6d716f" stroke-width="2"/><rect x="150" y="182" width="56" height="17" rx="3" fill="#e4edf3" stroke="#245574" stroke-width="2"/><rect x="274" y="182" width="56" height="17" rx="3" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="178.0" y="174.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">R₁</text><text x="302.0" y="174.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">R₂</text><line x1="76" y1="236" x2="104" y2="236" stroke="#18364a" stroke-width="3"/><line x1="82" y1="246" x2="98" y2="246" stroke="#18364a" stroke-width="1.6"/><text x="66.0" y="240.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:16px">ε</text><line x1="200" y1="338" x2="280" y2="338" stroke="#245574" stroke-width="2" marker-end="url(#m2940)"/><text x="242.0" y="362.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">the same I everywhere</text><text x="242.0" y="276.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">R = R₁ + R₂</text><text x="242.0" y="302.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">Vᵢ = IRᵢ • P = I²R</text><text x="242.0" y="384.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">the BIGGER resistor gets more volts and more watts</text><rect x="460" y="126" width="420" height="268" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="670.0" y="154.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">Parallel: one voltage, shared current</text><rect x="530" y="184" width="280" height="102" rx="0" fill="none" stroke="#6d716f" stroke-width="2"/><line x1="670" y1="184" x2="670" y2="286" stroke="#6d716f" stroke-width="2"/><rect x="642" y="212" width="56" height="17" rx="3" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><rect x="782" y="212" width="56" height="17" rx="3" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="670.0" y="204.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">R₁</text><text x="810.0" y="204.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">R₂</text><line x1="516" y1="230" x2="544" y2="230" stroke="#18364a" stroke-width="3"/><line x1="522" y1="240" x2="538" y2="240" stroke="#18364a" stroke-width="1.6"/><text x="506.0" y="234.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:16px">ε</text><text x="670.0" y="314.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">1/R = 1/R₁ + 1/R₂</text><text x="670.0" y="340.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">Iᵢ = V/Rᵢ • P = V²/R</text><text x="670.0" y="364.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">R is always SMALLER than either branch</text><text x="670.0" y="384.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">now the SMALLER resistor gets more current and more watts</text><rect x="40" y="412" width="840" height="228" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="460.0" y="440.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">Reduce, solve, then work backwards</text><text x="300.0" y="474.0" class="" text-anchor="end" style="fill:#6d716f;font-size:14px">12 V across</text><text x="320.0" y="474.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:15px">6 Ω  +  (4 Ω ∥ 12 Ω)</text><text x="300.0" y="502.0" class="" text-anchor="end" style="fill:#6d716f;font-size:14px">4 ∥ 12</text><text x="320.0" y="502.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:15px">= 48/16 = 3 Ω</text><text x="300.0" y="530.0" class="" text-anchor="end" style="fill:#6d716f;font-size:14px">total</text><text x="320.0" y="530.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:15px">6 + 3 = 9 Ω</text><text x="300.0" y="558.0" class="" text-anchor="end" style="fill:#6d716f;font-size:14px">I from the battery</text><text x="320.0" y="558.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:15px">12/9 = 1.33 A</text><rect x="560" y="460" width="296" height="160" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="708.0" y="484.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">back-substitute</text><text x="708.0" y="508.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">V across the pair = 1.33 × 3 = 4 V</text><text x="708.0" y="532.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">I₄ = 4/4 = 1 A   •   I₁₂ = 4/12 = 0.33 A</text><text x="708.0" y="558.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">they add back to 1.33 A</text><text x="708.0" y="588.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">P total = εI = 12 × 1.33 = 16 W</text><text x="708.0" y="610.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">always check the currents at the junction</text><rect x="40" y="658" width="404" height="158" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="242.0" y="686.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">Junction rule = charge is conserved</text><circle cx="242" cy="744" r="7" fill="#18364a" stroke="#18364a" stroke-width="2"/><line x1="150" y1="720" x2="232" y2="740" stroke="#245574" stroke-width="2" marker-end="url(#m2940)"/><line x1="150" y1="772" x2="232" y2="750" stroke="#245574" stroke-width="2" marker-end="url(#m2940)"/><line x1="252" y1="740" x2="338" y2="720" stroke="#a8324a" stroke-width="2" marker-end="url(#m7576)"/><line x1="252" y1="750" x2="338" y2="772" stroke="#a8324a" stroke-width="2" marker-end="url(#m7576)"/><text x="140.0" y="714.0" class="" text-anchor="end" style="fill:#245574;font-weight:bold;font-size:14px">3 A</text><text x="140.0" y="782.0" class="" text-anchor="end" style="fill:#245574;font-weight:bold;font-size:14px">5 A</text><text x="348.0" y="714.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:14px">I₃</text><text x="348.0" y="782.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:14px">2 A</text><text x="242.0" y="806.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">in = out, so I₃ = 8 − 2 = 6 A</text><rect x="466" y="658" width="414" height="158" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="673.0" y="686.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">Loop rule = energy is conserved</text><text x="673.0" y="716.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">ΣΔV = 0 around any closed loop</text><text x="673.0" y="744.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">rises across the battery must equal</text><text x="673.0" y="764.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">the IR drops around the rest of the loop</text><text x="673.0" y="794.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">a negative answer just means your assumed</text><text x="673.0" y="812.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">current direction was backwards</text></svg>