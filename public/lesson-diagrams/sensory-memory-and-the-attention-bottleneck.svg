<svg xmlns="http://www.w3.org/2000/svg" width="920" height="876" viewBox="0 0 920 876" role="img" aria-labelledby="t d"><title id="t">You see far more than you can report</title><desc id="d">Top left: Sperling&#x27;s grid of twelve letters flashed for fifty milliseconds, with whole report recovering only four or five while a tone cueing a single row recovers three of its four, implying that about nine of the twelve were briefly available. Top right: the number of letters still recoverable plotted against the delay before the cue, falling from about nine at no delay to the whole-report level of four or five by one second — the fading of the icon, not a limit on how much was seen. Middle: the three filter models placed on the same processing stream, with Broadbent&#x27;s filter before meaning is extracted, Treisman&#x27;s attenuator turning unattended channels down rather than off, and the late-selection bottleneck after full semantic analysis. Bottom: the durations of the sensory registers side by side, and the failures that follow when attention is elsewhere.</desc><defs><marker id="m6338" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#987740"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="876" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">You see far more than you can report</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Sensory memory is wide and brief; attention decides the sliver that survives</text><rect x="40" y="156" width="420" height="274" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="250.0" y="184.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">Sperling: whole report against partial report</text><rect x="110" y="206" width="30" height="28" rx="4" fill="#faf6ee" stroke="#6d716f" stroke-width="1.8"/><text x="125.0" y="226.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:14px">X</text><rect x="146" y="206" width="30" height="28" rx="4" fill="#faf6ee" stroke="#6d716f" stroke-width="1.8"/><text x="161.0" y="226.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:14px">X</text><rect x="182" y="206" width="30" height="28" rx="4" fill="#faf6ee" stroke="#6d716f" stroke-width="1.8"/><text x="197.0" y="226.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:14px">X</text><rect x="218" y="206" width="30" height="28" rx="4" fill="#faf6ee" stroke="#6d716f" stroke-width="1.8"/><text x="233.0" y="226.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:14px">X</text><rect x="110" y="240" width="30" height="28" rx="4" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="125.0" y="260.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">X</text><rect x="146" y="240" width="30" height="28" rx="4" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="161.0" y="260.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">X</text><rect x="182" y="240" width="30" height="28" rx="4" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="197.0" y="260.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">X</text><rect x="218" y="240" width="30" height="28" rx="4" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="233.0" y="260.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">X</text><rect x="110" y="274" width="30" height="28" rx="4" fill="#faf6ee" stroke="#6d716f" stroke-width="1.8"/><text x="125.0" y="294.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:14px">X</text><rect x="146" y="274" width="30" height="28" rx="4" fill="#faf6ee" stroke="#6d716f" stroke-width="1.8"/><text x="161.0" y="294.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:14px">X</text><rect x="182" y="274" width="30" height="28" rx="4" fill="#faf6ee" stroke="#6d716f" stroke-width="1.8"/><text x="197.0" y="294.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:14px">X</text><rect x="218" y="274" width="30" height="28" rx="4" fill="#faf6ee" stroke="#6d716f" stroke-width="1.8"/><text x="233.0" y="294.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:14px">X</text><text x="182.0" y="196.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">50 ms flash</text><line x1="262" y1="254" x2="294" y2="254" stroke="#987740" stroke-width="2" marker-end="url(#m6338)"/><text x="278.0" y="242.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">tone</text><rect x="306" y="206" width="132" height="46" rx="8" fill="#e9e4da" stroke="#6d716f" stroke-width="2"/><text x="372.0" y="226.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:12px">whole report</text><text x="372.0" y="244.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">4–5 of 12</text><rect x="306" y="262" width="132" height="46" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="372.0" y="282.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">partial report</text><text x="372.0" y="300.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">3 of 4 ⇒ ≈9 of 12</text><text x="250.0" y="352.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">the limit is not how much was seen</text><text x="250.0" y="376.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">but how fast the image fades while you report it</text><text x="250.0" y="404.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">the store is pre-categorical: raw form, not yet &quot;letters&quot;</text><rect x="480" y="156" width="400" height="274" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="680.0" y="184.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">Why the cue has to come at once</text><line x1="548" y1="340" x2="838" y2="340" stroke="#18364a" stroke-width="2"/><line x1="548" y1="206" x2="548" y2="340" stroke="#18364a" stroke-width="2"/><text x="693.0" y="384.0" class="" text-anchor="middle" style="font-size:17px">delay before the cue (s)</text><text x="504" y="273.0" text-anchor="middle" transform="rotate(-90 504 273.0)" style="font-size:17px">letters available</text><line x1="548.0" y1="340.0" x2="548.0" y2="346.0" stroke="#18364a" stroke-width="2"/><text x="548.0" y="362.0" class="" text-anchor="middle" style="font-size:14px">0</text><line x1="679.8181818181818" y1="340.0" x2="679.8181818181818" y2="346.0" stroke="#18364a" stroke-width="2"/><text x="679.8" y="362.0" class="" text-anchor="middle" style="font-size:14px">0.5</text><line x1="811.6363636363636" y1="340.0" x2="811.6363636363636" y2="346.0" stroke="#18364a" stroke-width="2"/><text x="811.6" y="362.0" class="" text-anchor="middle" style="font-size:14px">1</text><line x1="542.0" y1="273.0" x2="548.0" y2="273.0" stroke="#18364a" stroke-width="2"/><text x="538.0" y="278.0" class="" text-anchor="end" style="font-size:14px">5</text><line x1="542.0" y1="219.39999999999998" x2="548.0" y2="219.39999999999998" stroke="#18364a" stroke-width="2"/><text x="538.0" y="224.4" class="" text-anchor="end" style="font-size:14px">9</text><path d="M548.0 219.4 L550.6 221.3 L553.3 223.1 L555.9 224.8 L558.5 226.5 L561.2 228.1 L563.8 229.7 L566.5 231.2 L569.1 232.7 L571.7 234.2 L574.4 235.6 L577.0 236.9 L579.6 238.3 L582.3 239.5 L584.9 240.8 L587.5 242.0 L590.2 243.1 L592.8 244.3 L595.5 245.3 L598.1 246.4 L600.7 247.4 L603.4 248.4 L606.0 249.4 L608.6 250.3 L611.3 251.2 L613.9 252.1 L616.5 252.9 L619.2 253.8 L621.8 254.6 L624.5 255.3 L627.1 256.1 L629.7 256.8 L632.4 257.5 L635.0 258.2 L637.6 258.9 L640.3 259.5 L642.9 260.1 L645.5 260.7 L648.2 261.3 L650.8 261.9 L653.5 262.4 L656.1 263.0 L658.7 263.5 L661.4 264.0 L664.0 264.5 L666.6 264.9 L669.3 265.4 L671.9 265.8 L674.5 266.2 L677.2 266.7 L679.8 267.1 L682.5 267.4 L685.1 267.8 L687.7 268.2 L690.4 268.5 L693.0 268.9 L695.6 269.2 L698.3 269.5 L700.9 269.9 L703.5 270.2 L706.2 270.5 L708.8 270.7 L711.5 271.0 L714.1 271.3 L716.7 271.5 L719.4 271.8 L722.0 272.0 L724.6 272.3 L727.3 272.5 L729.9 272.7 L732.5 272.9 L735.2 273.1 L737.8 273.3 L740.5 273.5 L743.1 273.7 L745.7 273.9 L748.4 274.1 L751.0 274.3 L753.6 274.4 L756.3 274.6 L758.9 274.8 L761.5 274.9 L764.2 275.1 L766.8 275.2 L769.5 275.3 L772.1 275.5 L774.7 275.6 L777.4 275.7 L780.0 275.8 L782.6 276.0 L785.3 276.1 L787.9 276.2 L790.5 276.3 L793.2 276.4 L795.8 276.5 L798.5 276.6 L801.1 276.7 L803.7 276.8 L806.4 276.9 L809.0 277.0 L811.6 277.1 L814.3 277.1 L816.9 277.2 L819.5 277.3 L822.2 277.4 L824.8 277.4 L827.5 277.5 L830.1 277.6 L832.7 277.6 L835.4 277.7 L838.0 277.8" stroke="#987740" stroke-width="2.8" fill="none"/><circle cx="548.0" cy="219.39999999999998" r="5" fill="#18364a" stroke="#18364a" stroke-width="2"/><text x="558.0" y="211.4" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">≈ 9 available</text><text x="803.6" y="265.7" class="" text-anchor="end" style="fill:#6d716f;font-size:12px">back to whole-report level</text><text x="680.0" y="414.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">iconic ≈ 250–500 ms • echoic ≈ 3–4 s • haptic ≈ 2 s</text><rect x="40" y="446" width="840" height="212" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="460.0" y="474.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">Where does the bottleneck sit?</text><line x1="120" y1="560" x2="800" y2="560" stroke="#6d716f" stroke-width="3"/><circle cx="120" cy="560" r="6" fill="#18364a" stroke="#18364a" stroke-width="2"/><text x="120.0" y="586.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">sensory</text><text x="120.0" y="602.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">input</text><circle cx="360" cy="560" r="6" fill="#18364a" stroke="#18364a" stroke-width="2"/><text x="360.0" y="586.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">physical</text><text x="360.0" y="602.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">features</text><circle cx="580" cy="560" r="6" fill="#18364a" stroke="#18364a" stroke-width="2"/><text x="580.0" y="586.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">meaning</text><text x="580.0" y="602.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">extracted</text><circle cx="800" cy="560" r="6" fill="#18364a" stroke="#18364a" stroke-width="2"/><text x="800.0" y="586.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">awareness,</text><text x="800.0" y="602.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">response</text><line x1="300" y1="540" x2="300" y2="554" stroke="#245574" stroke-width="3" stroke-dasharray="6 5"/><text x="300.0" y="530.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">Broadbent</text><text x="300.0" y="494.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">filter: unattended</text><text x="300.0" y="510.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">channels blocked</text><line x1="440" y1="540" x2="440" y2="554" stroke="#987740" stroke-width="3" stroke-dasharray="6 5"/><text x="440.0" y="530.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">Treisman</text><text x="440.0" y="494.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">attenuator: turned</text><text x="440.0" y="510.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">down, not off</text><line x1="680" y1="540" x2="680" y2="554" stroke="#a8324a" stroke-width="3" stroke-dasharray="6 5"/><text x="680.0" y="530.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">Deutsch–Norman</text><text x="680.0" y="494.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">late: everything</text><text x="680.0" y="510.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">analysed first</text><text x="460.0" y="626.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">Lavie: the bottleneck slides — early when the task is demanding, late when it is easy</text><text x="460.0" y="648.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">your own name getting through is the evidence against a hard early filter</text><rect x="40" y="674" width="840" height="174" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="460.0" y="702.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">What happens to what you do not attend to</text><rect x="62" y="720" width="196" height="104" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="160.0" y="746.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">inattentional blindness</text><text x="160.0" y="776.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">the gorilla walks through</text><text x="160.0" y="794.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">and you never see it</text><rect x="268" y="720" width="196" height="104" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="366.0" y="746.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">change blindness</text><text x="366.0" y="776.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">a large change across a cut</text><text x="366.0" y="794.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">goes unregistered</text><rect x="474" y="720" width="196" height="104" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="572.0" y="746.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">psychological refractory period</text><text x="572.0" y="776.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">two responses in quick succession:</text><text x="572.0" y="794.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">the second always waits</text><rect x="680" y="720" width="196" height="104" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="778.0" y="746.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">vigilance decrement</text><text x="778.0" y="776.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">watch for a rare signal long enough</text><text x="778.0" y="794.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">and you start missing it</text></svg>