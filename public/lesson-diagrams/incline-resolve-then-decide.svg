<svg xmlns="http://www.w3.org/2000/svg" width="920" height="780" viewBox="0 0 920 780" role="img" aria-labelledby="t d"><title id="t">Inclines and friction: resolve, then decide</title><desc id="d">Left: an incline showing weight resolved into mg sine theta down the slope and mg cosine theta into the surface, with the normal force equal to mg cosine theta and friction acting up the slope. Right: a decision ladder comparing tangent theta with the coefficient of static friction, giving a stationary block with static friction equal to mg sine theta when tangent theta is at most mu_s, and a sliding block with acceleration g times sine theta minus mu_k cosine theta otherwise. Bottom: four cases showing the normal force on a flat surface, when pushed at an angle, when pulled at an angle, and on an incline.</desc><defs><marker id="m3134" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#987740"/></marker><marker id="m4927" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b7a64"/></marker><marker id="m5694" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker><marker id="m5928" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker><marker id="m8185" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="780" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Inclines and friction: resolve, then decide</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">N is whatever the perpendicular balance requires — it equals mg only on a flat surface</text><rect x="40" y="112" width="452" height="356" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="266.0" y="142.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">Resolve gravity along the tilted axes</text><path d="M86 420 L452 420 L452 212 Z" stroke="#6d716f" stroke-width="2" fill="#efede8"/><path d="M284.7 274.9 L225.6 308.5 L239.4 332.8 L298.6 299.2 Z" stroke="#18364a" stroke-width="2" fill="#e8ecef"/><line x1="262.0827255909591" y1="303.82825753024537" x2="262.0827255909591" y2="411.82825753024537" stroke="#a8324a" stroke-width="3" marker-end="url(#m8185)"/><text x="272.1" y="407.8" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:16px">mg</text><line x1="262.0827255909591" y1="303.82825753024537" x2="196.00755218371978" y2="341.37917575075295" stroke="#987740" stroke-width="3" marker-end="url(#m3134)"/><text x="159.1" y="367.3" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">mg sin θ</text><line x1="262.0827255909591" y1="303.82825753024537" x2="297.6572796945979" y2="366.42579023184055" stroke="#245574" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#m5928)"/><text x="356.6" y="385.6" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">mg cos θ</text><line x1="262.0827255909591" y1="303.82825753024537" x2="226.50817148732034" y2="241.23072482865018" stroke="#245574" stroke-width="3" marker-end="url(#m5928)"/><text x="214.6" y="230.8" class="" text-anchor="end" style="fill:#245574;font-weight:bold;font-size:17px">N</text><line x1="262.0827255909591" y1="303.82825753024537" x2="328.15789899819845" y2="266.2773393097378" stroke="#5b7a64" stroke-width="3" marker-end="url(#m4927)"/><text x="338.9" y="251.3" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:17px">f</text><text x="126.0" y="408.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:18px">θ</text><text x="266.0" y="446.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">⊥ balance: N = mg cos θ   •   along the slope: mg sin θ drives it down</text><rect x="508" y="112" width="372" height="356" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="694.0" y="142.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:17px">Then decide: does it slide?</text><rect x="530" y="158" width="328" height="58" rx="9" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="694.0" y="182.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">mg sin θ   vs   μₛ mg cos θ</text><text x="694.0" y="204.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">mg cancels  ⇒  compare tan θ with μₛ</text><line x1="620" y1="216" x2="600" y2="248" stroke="#18364a" stroke-width="2.5" marker-end="url(#m5694)"/><line x1="768" y1="216" x2="788" y2="248" stroke="#18364a" stroke-width="2.5" marker-end="url(#m5694)"/><rect x="524" y="252" width="170" height="112" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="609.0" y="278.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">tan θ ≤ μₛ</text><text x="609.0" y="302.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">stays put</text><text x="609.0" y="328.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">fₛ = mg sin θ</text><text x="609.0" y="350.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">(not μₛN)</text><rect x="700" y="252" width="170" height="112" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="785.0" y="278.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">tan θ &gt; μₛ</text><text x="785.0" y="302.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">slides</text><text x="785.0" y="328.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">a = g(sin θ</text><text x="785.0" y="348.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">− μₖ cos θ)</text><text x="694.0" y="392.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">θᴄ = arctan(μₛ)  is the angle of repose</text><text x="694.0" y="420.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">a carries no m: same slope, same acceleration,</text><text x="694.0" y="440.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">whatever the mass</text><text x="60.0" y="506.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:17px">The normal force is never assumed — it comes from the perpendicular balance</text><rect x="40" y="528" width="200" height="116" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="140.0" y="558.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">flat surface</text><text x="140.0" y="592.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">N = mg</text><text x="140.0" y="620.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">nothing else vertical</text><rect x="253" y="528" width="200" height="116" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="353.0" y="558.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">push at angle θ</text><text x="353.0" y="592.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">N = mg + F sin θ</text><text x="353.0" y="620.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">friction goes up</text><rect x="466" y="528" width="200" height="116" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="566.0" y="558.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">pull at angle θ</text><text x="566.0" y="592.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">N = mg − F sin θ</text><text x="566.0" y="620.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">friction goes down</text><rect x="679" y="528" width="200" height="116" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="779.0" y="558.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">incline θ</text><text x="779.0" y="592.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">N = mg cos θ</text><text x="779.0" y="620.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">friction goes down</text><text x="460.0" y="684.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">fₛ adjusts up to μₛN; fₖ = μₖN is fixed and opposes the velocity</text><text x="460.0" y="712.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Neither depends on contact area, and fₖ does not depend on speed</text><text x="460.0" y="744.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">μₖ ≤ μₛ for a given pair of surfaces</text></svg>