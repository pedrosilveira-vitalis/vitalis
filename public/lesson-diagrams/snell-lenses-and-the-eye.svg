<svg xmlns="http://www.w3.org/2000/svg" width="920" height="840" viewBox="0 0 920 840" role="img" aria-labelledby="t d"><title id="t">Bend toward the normal going in, away coming out</title><desc id="d">Top left: a ray crossing from air into water, bending toward the normal, with Snell&#x27;s law and the critical angle condition for the reverse direction. Top right: a converging lens with a parallel ray through the far focus and a ray straight through the centre, meeting at a real inverted image, with the thin lens equation. Bottom left: the sign conventions for lenses and mirrors. Bottom right: myopia, where light focuses in front of the retina and needs a diverging lens, against hyperopia, where it focuses behind and needs a converging lens.</desc><defs><marker id="m5398" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="840" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Bend toward the normal going in, away coming out</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">n₁sinθ₁ = n₂sinθ₂, and past the critical angle nothing gets out at all</text><rect x="40" y="112" width="416" height="318" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="248.0" y="142.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">Refraction at an interface</text><line x1="76" y1="252" x2="420" y2="252" stroke="#18364a" stroke-width="3"/><rect x="76" y="252" width="344" height="62" rx="0" fill="#e4edf3" stroke="#245574" stroke-width="0"/><line x1="236" y1="186" x2="236" y2="322" stroke="#6d716f" stroke-width="1.5" stroke-dasharray="6 5"/><text x="244.0" y="192.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">normal</text><line x1="152" y1="190" x2="230" y2="248" stroke="#18364a" stroke-width="2.5" marker-end="url(#m5398)"/><line x1="240" y1="256" x2="276" y2="314" stroke="#18364a" stroke-width="2.5" marker-end="url(#m5398)"/><text x="192.0" y="232.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">θ₁</text><text x="250.0" y="292.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">θ₂</text><text x="96.0" y="236.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:bold;font-size:13px">n₁ = 1.00  (air)</text><text x="96.0" y="276.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:13px">n₂ = 1.33  (water)</text><text x="400.0" y="236.0" class="" text-anchor="end" style="fill:#6d716f;font-size:12px">slower below ⇒</text><text x="400.0" y="276.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:12px">bent toward the normal</text><rect x="62" y="334" width="372" height="82" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="248.0" y="358.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">Going the other way, there is a limit</text><text x="248.0" y="382.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">sin θ_c = n₂/n₁   (only when n₁ &gt; n₂)</text><text x="248.0" y="404.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">glass–air 42°  •  water–air 49°  •  diamond–air 24°</text><rect x="472" y="112" width="408" height="318" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="676.0" y="142.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">Two rays locate the image</text><line x1="508" y1="258" x2="862" y2="258" stroke="#6d716f" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M700 200 Q716 258 700 316 Q684 258 700 200 Z" stroke="#5b7a64" stroke-width="2.5" fill="#e5ece3"/><circle cx="650" cy="258" r="3.5" fill="#18364a" stroke="#18364a" stroke-width="2"/><text x="650.0" y="278.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">F</text><circle cx="750" cy="258" r="3.5" fill="#18364a" stroke="#18364a" stroke-width="2"/><text x="750.0" y="278.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">F</text><line x1="580" y1="258" x2="580" y2="218" stroke="#18364a" stroke-width="2.5" marker-end="url(#m5398)"/><text x="570.0" y="210.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:13px">object</text><line x1="580" y1="218" x2="700" y2="218" stroke="#a8324a" stroke-width="2"/><line x1="700" y1="218" x2="786" y2="287" stroke="#a8324a" stroke-width="2"/><line x1="580" y1="218" x2="786" y2="287" stroke="#245574" stroke-width="2"/><line x1="786" y1="258" x2="786" y2="287" stroke="#18364a" stroke-width="2.5" marker-end="url(#m5398)"/><text x="800.0" y="284.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">real, inverted</text><text x="676.0" y="372.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">1/dₒ + 1/dᵢ = 1/f   •   m = −dᵢ/dₒ</text><text x="676.0" y="398.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">object inside f ⇒ virtual, upright, enlarged: a magnifier</text><text x="676.0" y="420.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">P = 1/f in dioptres, and lenses in contact add their P</text><rect x="40" y="450" width="416" height="214" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="248.0" y="478.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:17px">Signs, once and consistently</text><text x="74.0" y="506.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:15px">f &gt; 0</text><text x="154.0" y="506.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">converging lens, concave mirror</text><text x="74.0" y="536.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:15px">f &lt; 0</text><text x="154.0" y="536.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">diverging lens, convex mirror</text><text x="74.0" y="566.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:15px">dᵢ &gt; 0</text><text x="154.0" y="566.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">real image — far side of a lens, front of a mirror</text><text x="74.0" y="596.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:15px">dᵢ &lt; 0</text><text x="154.0" y="596.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">virtual image — same side as the object</text><text x="74.0" y="626.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:15px">m &lt; 0</text><text x="154.0" y="626.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">inverted;  |m| &gt; 1 enlarged</text><text x="248.0" y="650.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">Angles are always measured from the normal, never the surface</text><rect x="472" y="450" width="408" height="214" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="676.0" y="478.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">Where the focus lands</text><circle cx="580" cy="536" r="36" fill="#ffffff" stroke="#6d716f" stroke-width="2"/><path d="M606 512 A36 36 0 0 1 606 560" stroke="#a8324a" stroke-width="3" fill="none"/><line x1="504" y1="520" x2="544" y2="526" stroke="#18364a" stroke-width="2"/><line x1="504" y1="552" x2="544" y2="546" stroke="#18364a" stroke-width="2"/><line x1="544" y1="526" x2="588" y2="536" stroke="#18364a" stroke-width="2"/><line x1="544" y1="546" x2="588" y2="536" stroke="#18364a" stroke-width="2"/><circle cx="588" cy="536" r="4" fill="#245574" stroke="#245574" stroke-width="2"/><text x="580.0" y="594.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">myopia: eye too long</text><text x="580.0" y="614.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">needs a diverging lens</text><circle cx="782" cy="536" r="36" fill="#ffffff" stroke="#6d716f" stroke-width="2"/><path d="M808 512 A36 36 0 0 1 808 560" stroke="#a8324a" stroke-width="3" fill="none"/><line x1="706" y1="520" x2="746" y2="526" stroke="#18364a" stroke-width="2"/><line x1="706" y1="552" x2="746" y2="546" stroke="#18364a" stroke-width="2"/><line x1="746" y1="526" x2="830" y2="536" stroke="#18364a" stroke-width="2"/><line x1="746" y1="546" x2="830" y2="536" stroke="#18364a" stroke-width="2"/><circle cx="830" cy="536" r="4" fill="#987740" stroke="#987740" stroke-width="2"/><text x="782.0" y="594.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">hyperopia: eye too short</text><text x="782.0" y="614.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">needs a converging lens</text><text x="676.0" y="648.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">cornea ≈ 40–44 D of the eye&#x27;s ≈ 60 D; the lens accommodates</text><text x="460.0" y="702.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">Frequency never changes at a boundary; λ and v do, with λ = λ₀/n</text><text x="460.0" y="734.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Violet bends more than red: higher n at shorter wavelength — that is dispersion</text><text x="460.0" y="764.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Total internal reflection runs the endoscope and makes the diamond sparkle</text><text x="460.0" y="794.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">A flat mirror: virtual, upright, same size, as far behind as the object is in front</text></svg>