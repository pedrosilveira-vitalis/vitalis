<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc"><title id="title">Energy coupling in intestinal glucose uptake</title><desc id="desc">An enterocyte takes up glucose with sodium through apical SGLT1. A basolateral sodium potassium ATPase maintains sodium gradient while glucose exits through GLUT2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245574"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#18364a;font-size:19px}.h{font-size:27px;font-weight:700}.sub{font-size:22px;font-weight:700}.s{font-size:16px}.tiny{font-size:14px}</style><rect width="900" height="760" rx="20" fill="#fbf7ef"/><text x="32" y="43" class="h" text-anchor="start">Trace the energy through an enterocyte</text><text x="32" y="78" class="s" text-anchor="start">ATP → Na⁺ gradient → coupled glucose uptake</text><rect x="230" y="145" width="420" height="480" rx="34" fill="#e5eef2" stroke="#245574" stroke-width="2"/><text x="440" y="182" class="sub" text-anchor="middle">ENTEROCYTE</text><text x="110" y="130" class="sub" text-anchor="middle">Lumen</text><text x="768" y="130" class="sub" text-anchor="middle">Interstitial fluid</text><path d="M230 190h-25q-15 10 0 20h25" fill="none" stroke="#245574" stroke-width="3"/><path d="M230 230h-25q-15 10 0 20h25" fill="none" stroke="#245574" stroke-width="3"/><path d="M230 460h-25q-15 10 0 20h25" fill="none" stroke="#245574" stroke-width="3"/><path d="M230 500h-25q-15 10 0 20h25" fill="none" stroke="#245574" stroke-width="3"/><path d="M230 540h-25q-15 10 0 20h25" fill="none" stroke="#245574" stroke-width="3"/><rect x="207" y="278" width="46" height="97" rx="12" fill="#bdd0dc" stroke="#245574" stroke-width="2"/><text x="95" y="252" class="sub" text-anchor="middle">SGLT1</text><text x="90" y="301" class="" text-anchor="middle">2 Na⁺</text><text x="90" y="345" class="" text-anchor="middle">1 glucose</text><path d="M145 300H330" fill="none" stroke="#245574" stroke-width="3" marker-end="url(#arrow)"/><path d="M145 345H330" fill="none" stroke="#245574" stroke-width="3" marker-end="url(#arrow)"/><text x="270" y="399" class="s" text-anchor="start">Na⁺ downhill drives</text><text x="270" y="423" class="s" text-anchor="start">glucose uptake uphill</text><rect x="628" y="231" width="45" height="145" rx="12" fill="#bdd0dc" stroke="#245574" stroke-width="2"/><text x="650" y="208" class="sub" text-anchor="middle">Na⁺/K⁺ pump</text><path d="M535 263H782" fill="none" stroke="#245574" stroke-width="3" marker-end="url(#arrow)"/><text x="746" y="250" class="s" text-anchor="middle">3 Na⁺ out</text><path d="M780 336H536" fill="none" stroke="#245574" stroke-width="3" marker-end="url(#arrow)"/><text x="747" y="320" class="s" text-anchor="middle">2 K⁺ in</text><text x="410" y="242" class="sub" text-anchor="start">ATP</text><path d="M450 252L584 280" fill="none" stroke="#245574" stroke-width="3" marker-end="url(#arrow)"/><text x="446" y="311" class="s" text-anchor="start">ADP + Pi</text><rect x="628" y="490" width="45" height="88" rx="12" fill="#bdd0dc" stroke="#245574" stroke-width="2"/><text x="650" y="472" class="sub" text-anchor="middle">GLUT2</text><path d="M492 533H790" fill="none" stroke="#245574" stroke-width="3" marker-end="url(#arrow)"/><text x="493" y="562" class="s" text-anchor="start">Glucose down its gradient</text><text x="265" y="610" class="s" text-anchor="start">Low intracellular Na⁺ supports SGLT1</text><text x="40" y="675" class="sub" text-anchor="start">The pump uses ATP. SGLT1 uses stored gradient energy.</text><text x="40" y="708" class="s" text-anchor="start">GLUT2 does not directly consume ATP. Directions shown are typical after absorption.</text><text x="40" y="737" class="s" text-anchor="start">Schematic compartment layout; microvilli face the lumen, not the bloodstream.</text></svg>