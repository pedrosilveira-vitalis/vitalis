<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">Inhibitor models and kinetic consequences</title><desc id="desc">A table compares competitive E binding with unchanged Vmax, noncompetitive equal E and ES binding, uncompetitive ES-only binding, and mixed unequal binding. A separate note explains reversible versus irreversible activity loss.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#245574;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">Inhibitor models: binding and consequences</text><rect x="24" y="60" width="752" height="338" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="96" class="h" text-anchor="start">1  Standard reversible models</text><text x="48" y="140" class="s" text-anchor="start">Model</text><text x="244" y="140" class="s" text-anchor="start">Binds</text><text x="494" y="140" class="s" text-anchor="start">Km,app</text><text x="628" y="140" class="s" text-anchor="start">Vmax,app</text><path d="M45 155 L755 155" class="bond" stroke="#ded5c8" stroke-width="1"/><text x="48" y="191" class="s" text-anchor="start">Competitive</text><text x="244" y="191" class="s" text-anchor="start">E only</text><text x="494" y="191" class="s" text-anchor="start">↑</text><text x="628" y="191" class="s" text-anchor="start">same</text><path d="M45 206 L755 206" class="bond" stroke="#ded5c8" stroke-width="1"/><text x="48" y="242" class="s" text-anchor="start">Pure noncomp.</text><text x="244" y="242" class="s" text-anchor="start">E and ES equally</text><text x="494" y="242" class="s" text-anchor="start">same</text><text x="628" y="242" class="s" text-anchor="start">↓</text><path d="M45 257 L755 257" class="bond" stroke="#ded5c8" stroke-width="1"/><text x="48" y="293" class="s" text-anchor="start">Uncompetitive</text><text x="244" y="293" class="s" text-anchor="start">ES only</text><text x="494" y="293" class="s" text-anchor="start">↓</text><text x="628" y="293" class="s" text-anchor="start">↓</text><path d="M45 308 L755 308" class="bond" stroke="#ded5c8" stroke-width="1"/><text x="48" y="344" class="s" text-anchor="start">Mixed</text><text x="244" y="344" class="s" text-anchor="start">E and ES unequally</text><text x="494" y="344" class="s" text-anchor="start">↑ or ↓</text><text x="628" y="344" class="s" text-anchor="start">↓</text><path d="M45 359 L755 359" class="bond" stroke="#ded5c8" stroke-width="1"/><rect x="24" y="414" width="752" height="138" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="451" class="h" text-anchor="start">2  Check the sign of −1/Km</text><text x="65" y="493" class="t" text-anchor="start">If Km decreases, −1/Km becomes more negative.</text><text x="65" y="529" class="s" text-anchor="start">Uncompetitive lines shift up and left, with equal slope.</text><rect x="24" y="568" width="752" height="148" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="605" class="h" text-anchor="start">3  Reversible does not mean permanently trapped</text><text x="65" y="644" class="t" text-anchor="start">EI and ESI complexes can release reversible inhibitors.</text><text x="65" y="683" class="t" text-anchor="start">Loss of active enzyme can mimic a lower-Vmax pattern.</text></svg>