<svg xmlns="http://www.w3.org/2000/svg" width="920" height="900" viewBox="0 0 920 900" role="img" aria-labelledby="t d"><title id="t">Who is teaching you, and what kind of lesson is it?</title><desc id="d">Top: the agents ranked by when they dominate. Family first and deepest, because primary socialization happens while the child has no alternative frame of reference; peers at their peak in adolescence, when identity is the developmental task; school, media, work and religion overlapping throughout. Middle: Mead&#x27;s three stages, which are tested as a sequence and are easy to confuse — imitation before role-taking, role-taking before grasping that all the roles interlock. Bottom: the four types of socialization named in the exam&#x27;s vocabulary, separated by one question — are you learning a role you do not yet hold, adding one, replacing your identity, or leaving a role behind.</desc><defs><marker id="m6652" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="900" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Who is teaching you, and what kind of lesson is it?</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">The agent changes with age; the type of socialization changes with the role</text><rect x="40" y="180" width="840" height="212" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">When each agent dominates</text><line x1="150" y1="362" x2="850" y2="362" stroke="#6d716f" stroke-width="1.6"/><line x1="150" y1="356" x2="150" y2="368" stroke="#6d716f" stroke-width="1.4"/><text x="150.0" y="384.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">birth</text><line x1="310" y1="356" x2="310" y2="368" stroke="#6d716f" stroke-width="1.4"/><text x="310.0" y="384.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">school age</text><line x1="480" y1="356" x2="480" y2="368" stroke="#6d716f" stroke-width="1.4"/><text x="480.0" y="384.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">adolescence</text><line x1="660" y1="356" x2="660" y2="368" stroke="#6d716f" stroke-width="1.4"/><text x="660.0" y="384.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">adulthood</text><line x1="850" y1="356" x2="850" y2="368" stroke="#6d716f" stroke-width="1.4"/><text x="850.0" y="384.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">later life</text><rect x="150" y="232" width="700" height="20" rx="4" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.4"/><text x="158.0" y="247.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:9px">FAMILY</text><text x="142.0" y="247.0" class="" text-anchor="end" style="fill:#6d716f;font-size:8px"></text><text x="842.0" y="247.0" class="" text-anchor="end" style="fill:#6d716f;font-size:8px">primary socialization — language, values, class, attachment</text><rect x="270" y="258" width="340" height="20" rx="4" fill="#f1eadc" stroke="#987740" stroke-width="1.4"/><text x="278.0" y="273.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:9px">PEERS</text><text x="142.0" y="273.0" class="" text-anchor="end" style="fill:#6d716f;font-size:8px"></text><text x="602.0" y="273.0" class="" text-anchor="end" style="fill:#6d716f;font-size:8px">peaks in adolescence; identity is negotiated here</text><rect x="300" y="284" width="270" height="20" rx="4" fill="#e4edf3" stroke="#245574" stroke-width="1.4"/><text x="308.0" y="299.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:9px">SCHOOL</text><text x="142.0" y="299.0" class="" text-anchor="end" style="fill:#6d716f;font-size:8px"></text><text x="562.0" y="299.0" class="" text-anchor="end" style="fill:#6d716f;font-size:8px">and its hidden curriculum: authority, time, competition</text><rect x="210" y="310" width="640" height="20" rx="4" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.4"/><text x="218.0" y="325.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:9px">MEDIA</text><text x="142.0" y="325.0" class="" text-anchor="end" style="fill:#6d716f;font-size:8px"></text><text x="842.0" y="325.0" class="" text-anchor="end" style="fill:#6d716f;font-size:8px">representation, modelling, cultivation</text><rect x="630" y="336" width="220" height="20" rx="4" fill="#efede8" stroke="#6d716f" stroke-width="1.4"/><text x="638.0" y="351.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:bold;font-size:9px">WORK</text><text x="142.0" y="351.0" class="" text-anchor="end" style="fill:#6d716f;font-size:8px"></text><text x="842.0" y="351.0" class="" text-anchor="end" style="fill:#6d716f;font-size:8px">occupational socialization</text><rect x="40" y="408" width="840" height="166" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="436.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">Mead&#x27;s three stages, in order</text><rect x="68" y="456" width="262" height="100" rx="9" fill="#efede8" stroke="#6d716f" stroke-width="1.8"/><text x="199.0" y="478.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:12px">PREPARATORY</text><text x="199.0" y="494.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">under about 2</text><text x="199.0" y="512.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">imitation without understanding —</text><text x="199.0" y="525.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">copying the act, not the role</text><rect x="344" y="456" width="262" height="100" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="475.0" y="478.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">PLAY</text><text x="475.0" y="494.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">about 2 to 6</text><text x="475.0" y="512.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">takes ONE role at a time:</text><text x="475.0" y="525.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">playing doctor, playing parent</text><rect x="620" y="456" width="262" height="100" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="751.0" y="478.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">GAME</text><text x="751.0" y="494.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">about 7 and up</text><text x="751.0" y="512.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">holds SEVERAL roles at once and</text><text x="751.0" y="525.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">sees how they interlock — the</text><text x="751.0" y="538.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">generalized other</text><line x1="336" y1="506" x2="354" y2="506" stroke="#6d716f" stroke-width="2.5" marker-end="url(#m6652)"/><line x1="612" y1="506" x2="630" y2="506" stroke="#6d716f" stroke-width="2.5" marker-end="url(#m6652)"/><rect x="40" y="590" width="840" height="290" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="460.0" y="618.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">Four types, told apart by one question</text><text x="460.0" y="640.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">what is happening to the role you hold?</text><rect x="56" y="660" width="200" height="194" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="156.0" y="684.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">ANTICIPATORY</text><text x="156.0" y="704.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:8.5px">rehearsing a role you do NOT yet hold</text><line x1="80" y1="716" x2="232" y2="716" stroke="#245574" stroke-width="1" stroke-dasharray="6 5"/><text x="156.0" y="738.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:8.5px">the pre-med who already talks like</text><text x="156.0" y="755.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:8.5px">a clinician; reading about parenthood</text><text x="156.0" y="772.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:8.5px">before the child arrives</text><text x="156.0" y="806.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:8.5px">it SMOOTHS the transition</text><rect x="261" y="660" width="200" height="194" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="361.0" y="684.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">DEVELOPMENTAL</text><text x="361.0" y="704.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:8.5px">ADDING a role as life moves on</text><line x1="285" y1="716" x2="437" y2="716" stroke="#5b7a64" stroke-width="1" stroke-dasharray="6 5"/><text x="361.0" y="738.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:8.5px">student, then worker, then spouse,</text><text x="361.0" y="755.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:8.5px">then parent, then retiree</text><text x="361.0" y="789.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:8.5px">each brings new expectations and</text><text x="361.0" y="806.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:8.5px">a new reference group</text><rect x="466" y="660" width="200" height="194" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="566.0" y="684.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">RESOCIALIZATION</text><text x="566.0" y="704.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:8.5px">REPLACING the identity you had</text><line x1="490" y1="716" x2="642" y2="716" stroke="#a8324a" stroke-width="1" stroke-dasharray="6 5"/><text x="566.0" y="738.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:8.5px">boot camp, prison, a religious order</text><text x="566.0" y="755.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:8.5px">— Goffman&#x27;s total institutions</text><text x="566.0" y="789.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:8.5px">mortification of the self first,</text><text x="566.0" y="806.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:8.5px">then a new identity built</text><rect x="671" y="660" width="200" height="194" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="771.0" y="684.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:11px">ROLE EXIT</text><text x="771.0" y="704.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:8.5px">LEAVING a role that defined you</text><line x1="695" y1="716" x2="847" y2="716" stroke="#987740" stroke-width="1" stroke-dasharray="6 5"/><text x="771.0" y="738.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:8.5px">retirement, widowhood, leaving a</text><text x="771.0" y="755.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:8.5px">profession or a faith (Ebaugh)</text><text x="771.0" y="789.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:8.5px">the hard part is rebuilding identity</text><text x="771.0" y="806.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:8.5px">once the role is gone</text></svg>