<svg xmlns="http://www.w3.org/2000/svg" width="920" height="918" viewBox="0 0 920 918" role="img" aria-labelledby="t d"><title id="t">Two chemical senses, two touch pathways, one gate</title><desc id="d">Top: taste splits by mechanism, not by region of the tongue — sweet, bitter and umami run through G protein receptors and gustducin, salt comes straight through a sodium channel, sour through a proton channel. Smell is the one modality that reaches cortex without a thalamic relay, which is why an odour can summon a memory before you have named it. Middle: the two ascending somatosensory pathways, distinguished entirely by where they cross. Fine touch, vibration and position sense climb the same side of the cord and cross in the medulla; pain and temperature cross within a level or two of entering. Hemisect the cord and you get the split deficit that carries Brown-Séquard&#x27;s name. Bottom: the gate, which is why rubbing a bruise helps.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="918" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Two chemical senses, two touch pathways, one gate</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">The spinal cord is where the exam lives: what crosses, and where</text><rect x="40" y="170" width="840" height="212" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="198.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">The chemical senses</text><rect x="70" y="218" width="390" height="142" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="265.0" y="242.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">TASTE — split by mechanism</text><text x="258.0" y="266.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:11px">sweet · bitter · umami</text><text x="272.0" y="266.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">T1R/T2R → gustducin → PLCβ2</text><text x="258.0" y="288.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:11px">salty</text><text x="272.0" y="288.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">Na⁺ straight through ENaC</text><text x="258.0" y="310.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:11px">sour</text><text x="272.0" y="310.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">H⁺ through OTOP1</text><text x="265.0" y="340.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">CN VII front · CN IX back · CN X epiglottis → NTS</text><rect x="488" y="218" width="362" height="142" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="669.0" y="242.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">SMELL — the one that skips the thalamus</text><text x="669.0" y="268.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">GPCR → G-olf → cAMP → CNG channel</text><text x="669.0" y="288.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">one receptor per neuron; combinatorial code</text><text x="669.0" y="312.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">bulb → piriform cortex · amygdala · entorhinal</text><text x="669.0" y="340.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">ammonia and menthol are trigeminal, not olfactory</text><rect x="40" y="398" width="840" height="300" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="426.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">Where it crosses is the whole question</text><rect x="380" y="452" width="160" height="210" rx="16" fill="#efe9df" stroke="#6d716f" stroke-width="2.2"/><text x="460.0" y="446.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">spinal cord → medulla → thalamus</text><line x1="380" y1="556" x2="540" y2="556" stroke="#6d716f" stroke-width="1.4" stroke-dasharray="6 5"/><text x="548.0" y="560.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10px">medulla</text><path d="M420 650 L420 560 L470 520 L500 470" stroke="#245574" stroke-width="3" fill="none"/><circle cx="420" cy="650" r="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="300.0" y="572.0" class="" text-anchor="end" style="fill:#245574;font-weight:bold;font-size:13px">DCML</text><text x="300.0" y="592.0" class="" text-anchor="end" style="fill:#18364a;font-size:11px">fine touch · vibration</text><text x="300.0" y="608.0" class="" text-anchor="end" style="fill:#18364a;font-size:11px">proprioception</text><text x="300.0" y="632.0" class="" text-anchor="end" style="fill:#245574;font-weight:bold;font-size:11px">ascends the SAME side,</text><text x="300.0" y="648.0" class="" text-anchor="end" style="fill:#245574;font-weight:bold;font-size:11px">crosses in the MEDULLA</text><text x="300.0" y="668.0" class="" text-anchor="end" style="fill:#6d716f;font-size:10px">both end in VPL → S1</text><path d="M500 650 L440 630 L440 470" stroke="#a8324a" stroke-width="3" fill="none"/><circle cx="500" cy="650" r="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="620.0" y="572.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:13px">SPINOTHALAMIC</text><text x="620.0" y="592.0" class="" text-anchor="start" style="fill:#18364a;font-size:11px">pain · temperature</text><text x="620.0" y="608.0" class="" text-anchor="start" style="fill:#18364a;font-size:11px">crude touch</text><text x="620.0" y="632.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:11px">crosses AT ENTRY,</text><text x="620.0" y="648.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:11px">within a level or two</text><text x="460.0" y="684.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">hemisection → ipsilateral loss of touch and position, contralateral loss of pain and temperature · Brown-Séquard</text><rect x="40" y="714" width="840" height="174" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="460.0" y="742.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">The gate in the dorsal horn</text><rect x="70" y="762" width="360" height="106" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="250.0" y="786.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">BIG FIBRES (Aβ, touch)</text><text x="250.0" y="808.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">EXCITE the inhibitory interneuron</text><text x="250.0" y="830.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">gate CLOSES — less pain through</text><text x="250.0" y="854.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">rubbing a bruise; TENS; spinal stimulators</text><rect x="490" y="762" width="360" height="106" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="670.0" y="786.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">SMALL FIBRES (Aδ, C — pain)</text><text x="670.0" y="808.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">INHIBIT that same interneuron</text><text x="670.0" y="830.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">gate OPENS — pain gets through</text><text x="670.0" y="854.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">from above, PAG and raphe can close it again</text></svg>