<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="t d"><title id="t">Three attack plans, one per question type</title><desc id="d">Three columns, one per question type, each with five steps and a verification question. Foundations of Comprehension: classify the stem, locate the passage text before reading any choice, predict an answer in your own words, eliminate anything that contradicts the passage or is too extreme, out of scope or a distortion, then verify by re-reading the supporting sentence; the answer comes from a specific passage location; the check is whether the choice represents what the passage says without adding, removing or twisting anything. Reasoning Within the Text: classify the stem, map the argument structure by naming the claim, the evidence and the role of the referenced element, predict the structural relationship, eliminate choices that name the wrong function, reverse the direction of support, or state an assumption the argument does not actually need, then verify by tracing the logical chain and, for assumption questions, by negating the choice to confirm the argument collapses; the answer comes from the relationships between parts; the check is whether the choice describes the role correctly. Reasoning Beyond the Text: classify the stem, extract the author&#x27;s governing principle before even reading the new information, apply that framework to the new material, predict the author&#x27;s response, eliminate anything contradicting the author&#x27;s position, importing values the author never endorsed, or matching only on surface topic, then verify by asking whether the author would recognise the choice as their own; the answer comes from the author&#x27;s framework applied outward; the check is whether it stays inside what the author actually committed to. A footer notes the timing that fits a real section, about 45 to 60 seconds for Foundations and 60 to 90 for the other two, and that past about 90 seconds you should choose, flag and move on.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="680" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Three attack plans, one per question type</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Same five moves each time — but where the answer comes from changes completely.</text><rect x="30" y="104" width="306" height="448" rx="14" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="183.0" y="134.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:18px">FOUNDATIONS</text><rect x="44" y="148" width="278" height="54" rx="7" fill="#ffffff" stroke="#5b7a64" stroke-width="1.5"/><text x="183.0" y="165.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">the answer comes from</text><text x="183.0" y="181.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">a specific passage location</text><text x="60.0" y="218.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">1. Classify the stem</text><text x="60.0" y="245.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">2. LOCATE the text — before</text><text x="60.0" y="260.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">any choice</text><text x="60.0" y="287.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">3. Predict in your own words</text><text x="60.0" y="314.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">4. Cut: contradicts · too</text><text x="60.0" y="329.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">extreme · out of scope ·</text><text x="60.0" y="344.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">distortion</text><text x="60.0" y="371.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">5. Re-read the supporting</text><text x="60.0" y="386.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">sentence</text><rect x="44" y="470" width="278" height="70" rx="7" fill="#ffffff" stroke="#5b7a64" stroke-width="1.5"/><text x="183.0" y="490.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:11px">verify</text><text x="183.0" y="506.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">Does it say what the passage says</text><text x="183.0" y="520.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">— nothing added, removed or</text><text x="183.0" y="534.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">twisted?</text><rect x="352" y="104" width="306" height="448" rx="14" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="505.0" y="134.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:18px">WITHIN</text><rect x="366" y="148" width="278" height="54" rx="7" fill="#ffffff" stroke="#245574" stroke-width="1.5"/><text x="505.0" y="165.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">the answer comes from</text><text x="505.0" y="181.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">relationships between the</text><text x="505.0" y="195.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">parts</text><text x="382.0" y="218.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">1. Classify the stem</text><text x="382.0" y="245.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">2. Map it: claim · evidence ·</text><text x="382.0" y="260.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">role of the element</text><text x="382.0" y="287.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">3. Predict the relationship</text><text x="382.0" y="314.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">4. Cut: wrong function ·</text><text x="382.0" y="329.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">reversed direction ·</text><text x="382.0" y="344.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">assumption not actually needed</text><text x="382.0" y="371.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">5. Trace the chain; negate the</text><text x="382.0" y="386.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">assumption</text><rect x="366" y="470" width="278" height="70" rx="7" fill="#ffffff" stroke="#245574" stroke-width="1.5"/><text x="505.0" y="490.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:11px">verify</text><text x="505.0" y="506.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">Does it describe the ROLE</text><text x="505.0" y="520.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">correctly — not just the content?</text><rect x="674" y="104" width="306" height="448" rx="14" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="827.0" y="134.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:18px">BEYOND</text><rect x="688" y="148" width="278" height="54" rx="7" fill="#ffffff" stroke="#a8324a" stroke-width="1.5"/><text x="827.0" y="165.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">the answer comes from</text><text x="827.0" y="181.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">the author&#x27;s framework,</text><text x="827.0" y="195.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">applied outward</text><text x="704.0" y="218.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">1. Classify the stem</text><text x="704.0" y="245.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">2. Extract the principle FIRST</text><text x="704.0" y="272.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">3. Apply it to the new</text><text x="704.0" y="287.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">material, then predict</text><text x="704.0" y="314.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">4. Cut: contradicts author ·</text><text x="704.0" y="329.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">imports foreign values ·</text><text x="704.0" y="344.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">surface-only match</text><text x="704.0" y="371.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">5. Ask if the author would</text><text x="704.0" y="386.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">recognise it</text><rect x="688" y="470" width="278" height="70" rx="7" fill="#ffffff" stroke="#a8324a" stroke-width="1.5"/><text x="827.0" y="490.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:11px">verify</text><text x="827.0" y="506.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">Does it stay inside what the</text><text x="827.0" y="520.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">author actually committed to?</text><rect x="30" y="572" width="940" height="88" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="500.0" y="602.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:15px">Timing that actually fits</text><text x="500.0" y="625.0" class="" text-anchor="middle" style="font-size:13px">~10 min per passage: about 4 reading, leaving ~6 min for 5–7 questions. Foundations ≈ 45–60 s; Within</text><text x="500.0" y="643.0" class="" text-anchor="middle" style="font-size:13px">and Beyond ≈ 60–90 s. Past ~90 seconds on one question: choose, flag, move on.</text></svg>