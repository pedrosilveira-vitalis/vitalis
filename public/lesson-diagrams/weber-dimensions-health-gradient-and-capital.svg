<svg xmlns="http://www.w3.org/2000/svg" width="920" height="962" viewBox="0 0 920 962" role="img" aria-labelledby="t d"><title id="t">Three dimensions that need not move together</title><desc id="d">Top: class, status and party as three independent axes, with the cases where they come apart — which is exactly what vignettes are built from. The professor and the executive, the old family with the name but not the money, the union with the votes but neither. When they disagree for one person that is status inconsistency, and it carries its own psychological cost. Bottom left: the social gradient in health, the single most important stratification finding for this exam, because it runs the whole length of the hierarchy rather than appearing only at the bottom. Bottom right: the four pathways by which position gets under the skin, and the forms of capital that keep position where it is.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="962" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Three dimensions that need not move together</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Weber&#x27;s point was that one number cannot locate a person in a hierarchy</text><rect x="40" y="180" width="840" height="300" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">Class · Status · Party</text><rect x="70" y="228" width="250" height="150" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="195.0" y="254.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">CLASS</text><text x="195.0" y="274.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">ECONOMIC</text><text x="195.0" y="300.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">what you own and what</text><text x="195.0" y="315.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">you can sell in the market</text><text x="195.0" y="348.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:9px">property and acquisition classes</text><rect x="340" y="228" width="250" height="150" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="465.0" y="254.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">STATUS</text><text x="465.0" y="274.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">PRESTIGE</text><text x="465.0" y="300.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">the honour a group commands;</text><text x="465.0" y="315.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">shared lifestyle and boundaries</text><text x="465.0" y="348.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:9px">defended by social closure</text><rect x="610" y="228" width="250" height="150" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="735.0" y="254.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">PARTY</text><text x="735.0" y="274.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">POWER</text><text x="735.0" y="300.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">organised to get its way</text><text x="735.0" y="315.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">against resistance</text><text x="735.0" y="348.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:9px">unions, lobbies, parties</text><text x="460.0" y="402.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">WHEN THEY DISAGREE FOR ONE PERSON: STATUS INCONSISTENCY</text><rect x="70" y="420" width="250" height="44" rx="7" fill="#efede8" stroke="#6d716f" stroke-width="1.4"/><text x="195.0" y="438.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">the professor</text><text x="195.0" y="454.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">low class, high status</text><rect x="340" y="420" width="250" height="44" rx="7" fill="#efede8" stroke="#6d716f" stroke-width="1.4"/><text x="465.0" y="438.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">the old family</text><text x="465.0" y="454.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">no money left, name intact</text><rect x="610" y="420" width="250" height="44" rx="7" fill="#efede8" stroke="#6d716f" stroke-width="1.4"/><text x="735.0" y="438.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">the union</text><text x="735.0" y="454.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">neither — but it has the votes</text><rect x="40" y="496" width="410" height="452" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="245.0" y="524.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">The social gradient in health</text><text x="245.0" y="544.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">Whitehall: all employed, none poor</text><line x1="96" y1="716" x2="396" y2="716" stroke="#18364a" stroke-width="2"/><line x1="96" y1="566" x2="96" y2="716" stroke="#18364a" stroke-width="2"/><text x="246.0" y="760.0" class="" text-anchor="middle" style="font-size:17px">employment grade</text><text x="52" y="641.0" text-anchor="middle" transform="rotate(-90 52 641.0)" style="font-size:17px">mortality</text><path d="M126.0 592.2 L193.5 626.0 L261.0 656.0 L328.5 678.5 L373.5 689.8" stroke="#a8324a" stroke-width="3" fill="none"/><circle cx="126.0" cy="592.25" r="5" fill="#a8324a" stroke="#a8324a" stroke-width="2"/><circle cx="373.5" cy="689.75" r="5" fill="#a8324a" stroke="#a8324a" stroke-width="2"/><text x="130.0" y="582.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:9px">lowest grade</text><text x="380.0" y="706.0" class="" text-anchor="end" style="fill:#5b7a64;font-weight:bold;font-size:9px">highest grade</text><text x="245.0" y="784.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">every step up lowers mortality</text><text x="245.0" y="800.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">so it is not just absolute deprivation —</text><text x="245.0" y="816.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">relative position has its own effect</text><rect x="64" y="826" width="362" height="108" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="245.0" y="848.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:9.5px">WHICH IS WHY RELATIVE POVERTY MATTERS</text><text x="245.0" y="868.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:8.5px">ABSOLUTE poverty: below a fixed line — the World</text><text x="245.0" y="884.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:8.5px">Bank&#x27;s international line is now $3.00 a day</text><text x="245.0" y="900.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:8.5px">RELATIVE poverty: far below your own society&#x27;s norm;</text><text x="245.0" y="916.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:8.5px">shame and exclusion register physiologically</text><rect x="470" y="496" width="410" height="452" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="675.0" y="524.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">How position gets under the skin</text><rect x="494" y="546" width="362" height="39" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="560.0" y="563.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:10px">MATERIAL</text><text x="690.0" y="563.0" class="" text-anchor="start" style="fill:#6d716f;font-size:8.5px">food, housing, safety, time</text><rect x="494" y="591" width="362" height="52" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="560.0" y="608.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:10px">PSYCHOSOCIAL</text><text x="690.0" y="608.0" class="" text-anchor="start" style="fill:#6d716f;font-size:8.5px">chronic stress, low control → HPA axis</text><text x="690.0" y="621.0" class="" text-anchor="start" style="fill:#6d716f;font-size:8.5px">→ cortisol → allostatic load</text><rect x="494" y="649" width="362" height="52" rx="7" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="560.0" y="666.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:10px">BEHAVIOURAL</text><text x="690.0" y="666.0" class="" text-anchor="start" style="fill:#6d716f;font-size:8.5px">smoking, diet, exercise — themselves</text><text x="690.0" y="679.0" class="" text-anchor="start" style="fill:#6d716f;font-size:8.5px">shaped by stress and environment</text><rect x="494" y="707" width="362" height="39" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="560.0" y="724.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:10px">ACCESS</text><text x="690.0" y="724.0" class="" text-anchor="start" style="fill:#6d716f;font-size:8.5px">insurance, transport, time off, distrust</text><rect x="494" y="752" width="362" height="39" rx="7" fill="#efede8" stroke="#6d716f" stroke-width="1.5"/><text x="560.0" y="769.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:bold;font-size:10px">EXPOSURE</text><text x="690.0" y="769.0" class="" text-anchor="start" style="fill:#6d716f;font-size:8.5px">highways, plants, pollution</text><text x="675.0" y="800.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">AND WHAT KEEPS IT IN PLACE</text><rect x="494" y="816" width="362" height="28" rx="6" fill="#e8ecef" stroke="#18364a" stroke-width="1.4"/><text x="510.0" y="834.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:9px">ECONOMIC CAPITAL</text><text x="840.0" y="834.0" class="" text-anchor="end" style="fill:#6d716f;font-size:8.5px">money and property</text><rect x="494" y="847" width="362" height="28" rx="6" fill="#e8ecef" stroke="#18364a" stroke-width="1.4"/><text x="510.0" y="865.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:9px">CULTURAL CAPITAL</text><text x="840.0" y="865.0" class="" text-anchor="end" style="fill:#6d716f;font-size:8.5px">embodied, objectified, credentialed</text><rect x="494" y="878" width="362" height="28" rx="6" fill="#e8ecef" stroke="#18364a" stroke-width="1.4"/><text x="510.0" y="896.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:9px">SOCIAL CAPITAL</text><text x="840.0" y="896.0" class="" text-anchor="end" style="fill:#6d716f;font-size:8.5px">who you know, and who vouches</text><rect x="494" y="909" width="362" height="28" rx="6" fill="#e8ecef" stroke="#18364a" stroke-width="1.4"/><text x="510.0" y="927.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:9px">HABITUS</text><text x="840.0" y="927.0" class="" text-anchor="end" style="fill:#6d716f;font-size:8.5px">what you think is realistic for you</text></svg>