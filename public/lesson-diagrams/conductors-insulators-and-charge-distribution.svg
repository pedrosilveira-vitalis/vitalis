<svg xmlns="http://www.w3.org/2000/svg" width="920" height="812" viewBox="0 0 920 812" role="img" aria-labelledby="t d"><title id="t">In a conductor at rest, the charge runs to the surface</title><desc id="d">Top left: a solid conductor with all its excess charge on the outer surface, zero field inside and the field lines leaving at right angles, with charge piling up at a sharp point. Top right: a neutral shell around a charge plus Q, showing minus Q induced on the inner surface and plus Q on the outer one; grounding the shell drains the outer charge and kills the field outside. Middle: conductor against insulator — free carriers that migrate versus bound charges that only polarise in place, with the charge staying where it was rubbed. Bottom: field against radius for a conducting sphere and a uniformly charged insulating sphere, identical outside and completely different inside, plus the membrane as a capacitor whose thin, low-dielectric hydrophobic core carries about a microfarad per square centimetre.</desc><defs><marker id="m7645" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="812" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">In a conductor at rest, the charge runs to the surface</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">E = 0 inside • excess charge on the outer surface • the whole body at one potential</text><rect x="40" y="118" width="404" height="272" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="242.0" y="146.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">Solid conductor in equilibrium</text><path d="M160 300 Q140 212 236 196 Q330 182 356 236 Q376 288 300 322 Q220 352 160 300 Z" stroke="#245574" stroke-width="2.5" fill="#e4edf3"/><text x="320.0" y="263.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">+</text><text x="301.8" y="295.5" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">+</text><text x="258.0" y="309.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">+</text><text x="214.2" y="295.5" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">+</text><text x="196.0" y="263.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">+</text><text x="214.2" y="230.5" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">+</text><text x="258.0" y="217.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">+</text><text x="301.8" y="230.5" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">+</text><text x="258.0" y="254.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:20px">E = 0</text><text x="258.0" y="278.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">V constant</text><line x1="352" y1="232" x2="404" y2="216" stroke="#245574" stroke-width="1.8" marker-end="url(#m7645)"/><text x="380.0" y="196.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">⊥ to the surface</text><text x="242.0" y="358.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">charge crowds where the surface curves sharply</text><rect x="460" y="118" width="420" height="272" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="670.0" y="146.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">A charge inside a shell</text><circle cx="620" cy="258" r="76" fill="#e9e4da" stroke="#6d716f" stroke-width="2"/><circle cx="620" cy="258" r="52" fill="#faf6ee" stroke="#6d716f" stroke-width="2"/><circle cx="620" cy="258" r="11" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="620.0" y="264.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">+Q</text><text x="590.0" y="315.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:19px">−</text><text x="560.0" y="263.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:19px">−</text><text x="590.0" y="211.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:19px">−</text><text x="663.0" y="188.5" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">+</text><text x="706.0" y="263.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">+</text><text x="663.0" y="337.5" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">+</text><text x="620.0" y="354.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">inner −Q  •  outer +Q</text><rect x="720" y="196" width="148" height="128" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="794.0" y="220.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">ground it</text><line x1="738" y1="232" x2="850" y2="232" stroke="#5b7a64" stroke-width="1.4" stroke-dasharray="6 5"/><text x="794.0" y="254.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">inner −Q stays</text><text x="794.0" y="276.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">outer charge drains</text><text x="794.0" y="302.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">no field outside</text><text x="670.0" y="380.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">outside, you cannot tell where in the cavity the charge sits</text><rect x="40" y="410" width="840" height="150" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="438.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">Free carriers move; bound charges only lean</text><rect x="80" y="456" width="370" height="86" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="265.0" y="480.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">CONDUCTOR</text><text x="265.0" y="504.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">carriers migrate — charge spreads over the</text><text x="265.0" y="524.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">surface and the inside goes field-free</text><rect x="470" y="456" width="370" height="86" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="655.0" y="480.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">INSULATOR (dielectric)</text><text x="655.0" y="504.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">charges stay in their molecules and only</text><text x="655.0" y="524.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">polarise — rubbed charge stays put</text><rect x="40" y="578" width="460" height="218" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="270.0" y="606.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">Same outside, opposite inside</text><line x1="110" y1="742" x2="410" y2="742" stroke="#18364a" stroke-width="2"/><line x1="110" y1="630" x2="110" y2="742" stroke="#18364a" stroke-width="2"/><text x="260.0" y="786.0" class="" text-anchor="middle" style="font-size:17px">distance from centre (R = 1)</text><text x="66" y="686.0" text-anchor="middle" transform="rotate(-90 66 686.0)" style="font-size:17px">E</text><line x1="203.75" y1="742.0" x2="203.75" y2="748.0" stroke="#18364a" stroke-width="2"/><text x="203.8" y="764.0" class="" text-anchor="middle" style="font-size:14px">1</text><line x1="297.5" y1="742.0" x2="297.5" y2="748.0" stroke="#18364a" stroke-width="2"/><text x="297.5" y="764.0" class="" text-anchor="middle" style="font-size:14px">2</text><line x1="391.25" y1="742.0" x2="391.25" y2="748.0" stroke="#18364a" stroke-width="2"/><text x="391.2" y="764.0" class="" text-anchor="middle" style="font-size:14px">3</text><path d="M203.8 652.4 L207.5 659.2 L211.2 665.2 L215.0 670.6 L218.8 675.4 L222.5 679.8 L226.2 683.7 L230.0 687.3 L233.8 690.6 L237.5 693.6 L241.2 696.3 L245.0 698.8 L248.8 701.1 L252.5 703.2 L256.2 705.2 L260.0 707.0 L263.8 708.7 L267.5 710.3 L271.2 711.7 L275.0 713.1 L278.8 714.3 L282.5 715.5 L286.2 716.6 L290.0 717.7 L293.8 718.7 L297.5 719.6 L301.2 720.5 L305.0 721.3 L308.8 722.1 L312.5 722.8 L316.2 723.5 L320.0 724.1 L323.8 724.8 L327.5 725.4 L331.2 725.9 L335.0 726.4 L338.8 727.0 L342.5 727.4 L346.2 727.9 L350.0 728.3 L353.8 728.7 L357.5 729.1 L361.2 729.5 L365.0 729.9 L368.8 730.2 L372.5 730.6 L376.2 730.9 L380.0 731.2 L383.8 731.5 L387.5 731.8 L391.2 732.0 L395.0 732.3 L398.8 732.6 L402.5 732.8 L406.2 733.0 L410.0 733.2" stroke="#18364a" stroke-width="2.6" fill="none"/><path d="M113.8 742.0 L117.5 742.0 L121.2 742.0 L125.0 742.0 L128.8 742.0 L132.5 742.0 L136.2 742.0 L140.0 742.0 L143.8 742.0 L147.5 742.0 L151.2 742.0 L155.0 742.0 L158.8 742.0 L162.5 742.0 L166.2 742.0 L170.0 742.0 L173.8 742.0 L177.5 742.0 L181.2 742.0 L185.0 742.0 L188.8 742.0 L192.5 742.0 L196.2 742.0 L200.0 742.0 L203.8 742.0" stroke="#245574" stroke-width="3" fill="none"/><path d="M113.8 738.4 L117.5 734.8 L121.2 731.2 L125.0 727.7 L128.8 724.1 L132.5 720.5 L136.2 716.9 L140.0 713.3 L143.8 709.7 L147.5 706.2 L151.2 702.6 L155.0 699.0 L158.8 695.4 L162.5 691.8 L166.2 688.2 L170.0 684.7 L173.8 681.1 L177.5 677.5 L181.2 673.9 L185.0 670.3 L188.8 666.7 L192.5 663.2 L196.2 659.6 L200.0 656.0 L203.8 652.4" stroke="#a8324a" stroke-width="2.6" fill="none"/><text x="209.4" y="638.1" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:12px">insulating sphere</text><text x="144.1" y="734.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:12px">conducting sphere: E = 0</text><text x="277.4" y="703.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">kQ/r² for both</text><rect x="516" y="578" width="364" height="218" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="698.0" y="606.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">The membrane capacitor</text><rect x="556" y="630" width="284" height="16" rx="3" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><rect x="556" y="646" width="284" height="26" rx="0" fill="#e9e4da" stroke="#6d716f" stroke-width="1.5"/><rect x="556" y="672" width="284" height="16" rx="3" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="698.0" y="664.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">hydrophobic core: κ ≈ 2–3</text><text x="698.0" y="710.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">the conducting fluids are the plates;</text><text x="698.0" y="730.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">the thin low-κ core is the dielectric</text><text x="698.0" y="762.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">C/A ≈ 1 µF/cm²  •  E ≈ 10⁷ V/m</text><text x="698.0" y="786.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">water&#x27;s κ ≈ 80 screens charge within about 1 nm</text></svg>