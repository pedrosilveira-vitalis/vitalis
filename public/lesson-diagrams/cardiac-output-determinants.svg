<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="t d"><title id="t">How preload and contractility change stroke volume</title><desc id="d">Left: Frank-Starling curves of stroke volume against end-diastolic volume for a normal heart, a heart with increased contractility (higher curve) and a failing heart (lower curve). Right: left-ventricular pressure-volume loops; increased contractility steepens the end-systolic line, lowers end-systolic volume and widens the loop.</desc><defs><marker id="m4871" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="640" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">How preload and contractility change stroke volume</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Schematic curves for teaching; values are illustrative, not patient data.</text><line x1="90" y1="500" x2="450" y2="500" stroke="#18364a" stroke-width="2"/><line x1="90" y1="120" x2="90" y2="500" stroke="#18364a" stroke-width="2"/><text x="270.0" y="544.0" class="" text-anchor="middle" style="font-size:17px">End-diastolic volume (preload)</text><text x="46" y="310.0" text-anchor="middle" transform="rotate(-90 46 310.0)" style="font-size:17px">Stroke volume</text><path d="M90.0 500.0 L108.0 446.6 L126.0 401.1 L144.0 362.4 L162.0 329.4 L180.0 301.2 L198.0 277.2 L216.0 256.8 L234.0 239.4 L252.0 224.5 L270.0 211.9 L288.0 201.1 L306.0 191.9 L324.0 184.1 L342.0 177.4 L360.0 171.7 L378.0 166.9 L396.0 162.8 L414.0 159.3 L432.0 156.3 L450.0 153.7" stroke="#a8324a" stroke-width="3" fill="none"/><path d="M90.0 500.0 L108.0 466.6 L126.0 437.4 L144.0 411.6 L162.0 389.1 L180.0 369.2 L198.0 351.8 L216.0 336.5 L234.0 323.1 L252.0 311.3 L270.0 301.0 L288.0 291.9 L306.0 283.9 L324.0 276.9 L342.0 270.7 L360.0 265.3 L378.0 260.6 L396.0 256.4 L414.0 252.8 L432.0 249.5 L450.0 246.7" stroke="#245574" stroke-width="3" fill="none"/><path d="M90.0 500.0 L108.0 483.4 L126.0 468.5 L144.0 455.1 L162.0 443.2 L180.0 432.5 L198.0 422.9 L216.0 414.3 L234.0 406.6 L252.0 399.7 L270.0 393.5 L288.0 388.0 L306.0 383.0 L324.0 378.6 L342.0 374.6 L360.0 371.1 L378.0 367.9 L396.0 365.0 L414.0 362.4 L432.0 360.1 L450.0 358.1" stroke="#6d716f" stroke-width="3" fill="none" stroke-dasharray="8 6"/><text x="313.2" y="131.4" class="" text-anchor="middle" style="fill:#a8324a;font-size:16px">↑ contractility</text><text x="378.0" y="211.2" class="" text-anchor="middle" style="fill:#245574;font-size:16px">normal</text><text x="370.8" y="325.2" class="" text-anchor="middle" style="fill:#6d716f;font-size:16px">heart failure</text><line x1="180.0" y1="348.0" x2="270.0" y2="291.0" stroke="#18364a" stroke-width="2" marker-end="url(#m4871)"/><text x="270.0" y="590.0" class="" text-anchor="middle" style="font-size:15px">Preload change = move along a curve. Inotropy</text><text x="270.0" y="610.0" class="" text-anchor="middle" style="font-size:15px">change = move to a different curve.</text><line x1="590" y1="500" x2="950" y2="500" stroke="#18364a" stroke-width="2"/><line x1="590" y1="120" x2="590" y2="500" stroke="#18364a" stroke-width="2"/><text x="770.0" y="544.0" class="" text-anchor="middle" style="font-size:17px">LV volume (mL)</text><text x="546" y="310.0" text-anchor="middle" transform="rotate(-90 546 310.0)" style="font-size:17px">LV pressure (mmHg)</text><line x1="680.0" y1="500.0" x2="680.0" y2="506.0" stroke="#18364a" stroke-width="2"/><text x="680.0" y="522.0" class="" text-anchor="middle" style="font-size:14px">40</text><line x1="770.0" y1="500.0" x2="770.0" y2="506.0" stroke="#18364a" stroke-width="2"/><text x="770.0" y="522.0" class="" text-anchor="middle" style="font-size:14px">80</text><line x1="860.0"