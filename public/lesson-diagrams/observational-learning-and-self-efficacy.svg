<svg xmlns="http://www.w3.org/2000/svg" width="920" height="860" viewBox="0 0 920 860" role="img" aria-labelledby="t d"><title id="t">Learning and performing are two different things</title><desc id="d">Top: the four processes of observational learning as a chain — attention, retention, reproduction and motivation — with the thing that breaks each one written underneath, and the note that the chain is only as strong as its weakest link. Middle left: the 1965 Bobo doll follow-up, where children who saw the model punished imitated less on their own, but imitated just as much as everyone else once they were offered a reward — showing that all three groups had learned equally and only motivation differed. Middle right: the four sources of self-efficacy in order of strength, from doing it yourself through watching someone like you, being told you can, and how your body feels. Bottom: reciprocal determinism as a triangle of person, behaviour and environment, each arrow running both ways.</desc><defs><marker id="m2011" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker><marker id="m209" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="860" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Learning and performing are two different things</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Watch, remember, be able to do it, and want to — all four, or nothing shows</text><rect x="40" y="150" width="840" height="182" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="178.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">All four, in order</text><rect x="62" y="198" width="180" height="86" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="152.0" y="224.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">ATTENTION</text><text x="152.0" y="248.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">did you notice it?</text><text x="152.0" y="270.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:11px">a dull or confusing model</text><line x1="246" y1="241" x2="264" y2="241" stroke="#6d716f" stroke-width="2" marker-end="url(#m2011)"/><rect x="268" y="198" width="180" height="86" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="358.0" y="224.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">RETENTION</text><text x="358.0" y="248.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">can you still recall it?</text><text x="358.0" y="270.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:11px">no rehearsal, no coding</text><line x1="452" y1="241" x2="470" y2="241" stroke="#6d716f" stroke-width="2" marker-end="url(#m2011)"/><rect x="474" y="198" width="180" height="86" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="564.0" y="224.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">REPRODUCTION</text><text x="564.0" y="248.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">can your body do it?</text><text x="564.0" y="270.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:11px">the sub-skills are missing</text><line x1="658" y1="241" x2="676" y2="241" stroke="#6d716f" stroke-width="2" marker-end="url(#m2011)"/><rect x="680" y="198" width="180" height="86" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="770.0" y="224.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">MOTIVATION</text><text x="770.0" y="248.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">do you want to?</text><text x="770.0" y="270.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:11px">you saw the model punished</text><text x="460.0" y="312.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">break any one link and nothing appears — and only the last one is about wanting to</text><rect x="40" y="348" width="440" height="266" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="260.0" y="376.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">Bobo, 1965: learned or merely performed?</text><line x1="118" y1="504" x2="418" y2="504" stroke="#18364a" stroke-width="2"/><line x1="118" y1="392" x2="118" y2="504" stroke="#18364a" stroke-width="2"/><text x="268.0" y="548.0" class="" text-anchor="middle" style="font-size:17px"></text><text x="74" y="448.0" text-anchor="middle" transform="rotate(-90 74 448.0)" style="font-size:17px">imitation shown</text><rect x="120.0" y="414.4" width="44" height="89.60000000000002" rx="3" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><rect x="172.0" y="411.47826086956525" width="44" height="92.52173913043475" rx="3" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="168.0" y="522.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">model</text><text x="168.0" y="537.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">rewarded</text><rect x="220.0" y="466.9913043478261" width="44" height="37.00869565217391" rx="3" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><rect x="272.0" y="413.4260869565217" width="44" height="90.57391304347829" rx="3" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="268.0" y="522.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">model</text><text x="268.0" y="537.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">punished</text><rect x="320.0" y="431.9304347826087" width="44" height="72.0695652173913" rx="3" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><rect x="372.0" y="412.45217391304345" width="44" height="91.54782608695655" rx="3" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="368.0" y="522.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">no</text><text x="368.0" y="537.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">consequence</text><line x1="126" y1="546" x2="162" y2="546" stroke="#a8324a" stroke-width="3"/><text x="172.0" y="551.0" class="" text-anchor="start" style="font-size:15px">left to themselves</text><line x1="126" y1="572" x2="162" y2="572" stroke="#5b7a64" stroke-width="3"/><text x="172.0" y="577.0" class="" text-anchor="start" style="font-size:15px">offered a reward to copy it</text><text x="260.0" y="606.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">once paid, every group performed alike — they had all learned it</text><rect x="500" y="348" width="380" height="266" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="690.0" y="376.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">Where self-efficacy comes from</text><rect x="530" y="404" width="300" height="22" rx="5" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="536.0" y="420.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:13px">mastery experience</text><text x="536.0" y="440.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">you did it yourself</text><rect x="530" y="452" width="225" height="22" rx="5" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="536.0" y="468.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:13px">vicarious experience</text><text x="536.0" y="488.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">someone like you did it</text><rect x="530" y="500" width="150" height="22" rx="5" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="536.0" y="516.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:13px">verbal persuasion</text><text x="536.0" y="536.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">someone credible says you can</text><rect x="530" y="548" width="90" height="22" rx="5" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="536.0" y="564.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:13px">bodily state</text><text x="536.0" y="584.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">calm reads as able; anxiety does not</text><text x="690.0" y="598.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">domain-specific: not the same thing as self-esteem</text><rect x="40" y="630" width="840" height="200" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="658.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">Reciprocal determinism: every arrow runs both ways</text><rect x="368" y="680" width="184" height="42" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="460.0" y="706.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">PERSON</text><rect x="218" y="766" width="184" height="42" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="310.0" y="792.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">BEHAVIOUR</text><rect x="518" y="766" width="184" height="42" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="610.0" y="792.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">ENVIRONMENT</text><text x="460.0" y="672.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">beliefs, expectations, self-efficacy</text><text x="310.0" y="828.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">what you actually do</text><text x="610.0" y="828.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">setting, others, contingencies</text><line x1="410" y1="728" x2="340" y2="758" stroke="#18364a" stroke-width="1.8" marker-end="url(#m209)"/><line x1="340" y1="758" x2="410" y2="728" stroke="#18364a" stroke-width="1.8" marker-end="url(#m209)"/><line x1="510" y1="728" x2="580" y2="758" stroke="#18364a" stroke-width="1.8" marker-end="url(#m209)"/><line x1="580" y1="758" x2="510" y2="728" stroke="#18364a" stroke-width="1.8" marker-end="url(#m209)"/><line x1="402" y1="786" x2="518" y2="786" stroke="#18364a" stroke-width="1.8" marker-end="url(#m209)"/><line x1="518" y1="786" x2="402" y2="786" stroke="#18364a" stroke-width="1.8" marker-end="url(#m209)"/></svg>