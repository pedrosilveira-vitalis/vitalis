<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="850" viewBox="0 0 1180 850" role="img" aria-labelledby="t d"><title id="t">Fastest is not the same as most stable</title><desc id="d">An energy against reaction coordinate plot shows one set of reactants at 50 branching into two routes. The kinetic route climbs a low barrier to 76 and falls to a shallow product at 36. The thermodynamic route climbs a higher barrier to 93 and falls to a deeper product at 17. So the kinetic product has the smaller activation energy and forms faster, while the thermodynamic product is the more stable of the two. Panels beside the plot set out which product you get under which conditions. Under kinetic control, with low temperature, short reaction time and irreversible conditions, the products cannot interconvert, the system is trapped where it landed first, and the product is the one over the lower barrier. Under thermodynamic control, with higher temperature, long reaction time and reversible conditions, the products can interconvert through the reactant, the system equilibrates, and the product is the more stable one. The deciding factor is whether the barrier back out of the kinetic well can be crossed in the time and at the temperature of the experiment. A worked case follows: hydrogen bromide added to 1,3-butadiene. At minus 80 degrees the 1,2 addition product dominates, which is the kinetic product because the proton adds to give an allylic cation that is captured fastest at the nearer carbon. At 40 degrees the 1,4 addition product dominates, which is the thermodynamic product because its double bond is internal and more substituted, and therefore more stable; neither product is conjugated. Footers note that a catalyst lowers both barriers and so speeds the approach to equilibrium without changing which product is the more stable one or where the equilibrium lies, and that enzymes work the other way, using exquisite transition state selectivity to hold a reaction under kinetic control and deliver one stereoisomer or regioisomer that simple equilibration would not favour.</desc><defs><marker id="m4001" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker><marker id="m7535" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1180" height="850" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Fastest is not the same as most stable</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">When a reaction can give two products, the conditions decide which one you isolate — and the two answers are different compounds.</text><line x1="64" y1="472" x2="624" y2="472" stroke="#18364a" stroke-width="2"/><line x1="64" y1="142" x2="64" y2="472" stroke="#18364a" stroke-width="2"/><text x="344.0" y="516.0" class="" text-anchor="middle" style="font-size:17px">reaction coordinate</text><text x="20" y="307.0" text-anchor="middle" transform="rotate(-90 20 307.0)" style="font-size:17px">free energy</text><path d="M64.0 314.9 L65.9 314.9 L67.7 314.9 L69.6 314.9 L71.5 314.9 L73.3 314.9 L75.2 314.9 L77.1 314.9 L78.9 314.9 L80.8 314.9 L82.7 314.9 L84.5 314.9 L86.4 314.9 L88.3 314.9 L90.1 314.9 L92.0 314.9 L93.9 314.9 L95.7 314.9 L97.6 314.9 L99.5 314.9 L101.3 314.9 L103.2 314.9 L105.1 314.9 L106.9 314.9 L108.8 314.9 L110.7 314.9 L112.5 314.9 L114.4 314.9 L116.3 314.9 L118.1 314.9 L120.0 314.9 L121.9 314.9 L123.7 314.9 L125.6 314.9 L127.5 314.9 L129.3 314.9 L131.2 314.9 L133.1 314.9 L134.9 314.9 L136.8 314.9 L138.7 314.9 L140.5 314.9 L142.4 314.9 L144.3 314.9 L146.1 314.9 L148.0 314.9 L149.9 314.9 L151.7 314.9 L153.6 314.9 L155.5 314.9 L157.3 314.9 L159.2 314.9 L161.1 314.9 L162.9 314.9 L164.8 314.9 L166.7