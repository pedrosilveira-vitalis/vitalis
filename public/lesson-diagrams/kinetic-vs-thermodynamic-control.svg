61.6 339.8 L463.5 343.5 L465.3 347.1 L467.2 350.7 L469.1 354.2 L470.9 357.7 L472.8 361.1 L474.7 364.5 L476.5 367.7 L478.4 370.9 L480.3 374.0 L482.1 377.1 L484.0 380.0 L485.9 382.9 L487.7 385.7 L489.6 388.3 L491.5 390.9 L493.3 393.4 L495.2 395.8 L497.1 398.0 L498.9 400.2 L500.8 402.2 L502.7 404.2 L504.5 406.0 L506.4 407.7 L508.3 409.3 L510.1 410.8 L512.0 412.1 L513.9 413.3 L515.7 414.4 L517.6 415.4 L519.5 416.2 L521.3 416.9 L523.2 417.5 L525.1 418.0 L526.9 418.3 L528.8 418.5 L530.7 418.6 L532.5 418.6 L534.4 418.6 L536.3 418.6 L538.1 418.6 L540.0 418.6 L541.9 418.6 L543.7 418.6 L545.6 418.6 L547.5 418.6 L549.3 418.6 L551.2 418.6 L553.1 418.6 L554.9 418.6 L556.8 418.6 L558.7 418.6 L560.5 418.6 L562.4 418.6 L564.3 418.6 L566.1 418.6 L568.0 418.6 L569.9 418.6 L571.7 418.6 L573.6 418.6 L575.5 418.6 L577.3 418.6 L579.2 418.6 L581.1 418.6 L582.9 418.6 L584.8 418.6 L586.7 418.6 L588.5 418.6 L590.4 418.6 L592.3 418.6 L594.1 418.6 L596.0 418.6 L597.9 418.6 L599.7 418.6 L601.6 418.6 L603.5 418.6 L605.3 418.6 L607.2 418.6 L609.1 418.6 L610.9 418.6 L612.8 418.6 L614.7 418.6 L616.5 418.6 L618.4 418.6 L620.3 418.6 L622.1 418.6 L624.0 418.6" stroke="#a8324a" stroke-width="3" fill="none"/><text x="115.3" y="340.9" class="" text-anchor="middle" style="fill:#6d716f;font-size:11.5px">reactants</text><text x="460.7" y="342.9" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12px">KINETIC · forms faster</text><text x="460.7" y="402.6" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">THERMODYNAMIC · more stable</text><text x="387.3" y="171.7" class="" text-anchor="start" style="fill:#a8324a;font-weight:700;font-size:11px">Eₐ thermodynamic — higher</text><line x1="292.6666666666667" y1="314.8571428571429" x2="292.6666666666667" y2="233.14285714285714" stroke="#245574" stroke-width="2" marker-end="url(#m7535)"/><text x="302.7" y="274.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:11px">Eₐ kinetic — lower</text><line x1="199.33333333333334" y1="314.8571428571429" x2="199.33333333333334" y2="179.71428571428572" stroke="#a8324a" stroke-width="2" marker-end="url(#m4001)"/><rect x="648" y="142" width="504" height="166" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="900.0" y="170.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:13px">KINETIC CONTROL</text><text x="672.0" y="198.0" class="" text-anchor="start" style="fill:#18364a;font-weight:400;font-size:11.5px">low temperature · short time · irreversible</text><text x="672.0" y="222.0" class="" text-anchor="start" style="fill:#18364a;font-weight:400;font-size:11.5px">the products cannot interconvert, so the system</text><text x="672.0" y="246.0" class="" text-anchor="start" style="fill:#18364a;font-weight:400;font-size:11.5px">is trapped wherever it landed first</text><text x="672.0" y="270.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:11.5px">→ you get the product over the LOWER barrier</text><rect x="648" y="322" width="504" height="166" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="900.0" y="350.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:13px">THERMODYNAMIC CONTROL</text><text x="672.0" y="378.0" class="" text-anchor="start" style="fill:#18364a;font-weight:400;font-size:11.5px">higher temperature · long time · reversible</text><text x="672.0" y="402.0" class="" text-anchor="start" style="fill:#18364a;font-weight:400;font-size:11.5px">the products can interconvert back through the</text><text x="672.0" y="426.0" class="" text-anchor="start" style="fill:#18364a;font-weight:400;font-size:11.5px">reactant, so the system equilibrates</text><text x="672.0" y="450.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:11.5px">→ you get the MORE STABLE product</text><rect x="648" y="504" width="504" height="110" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="900.0" y="534.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">The switch is one question</text><text x="900.0" y="555.0" class="" text-anchor="middle" style="font-size:12px">Can the system climb back OUT of the kinetic well in the time and</text><text x="900.0" y="572.0" class="" text-anchor="middle" style="font-size:12px">at the temperature of the experiment? If yes, thermodynamics wins.</text><text x="900.0" y="589.0" class="" text-anchor="middle" style="font-size:12px">If no, whatever formed first is what you isolate.</text><rect x="24" y="536" width="600" height="180" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="324.0" y="564.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:13px">THE WORKED CASE — HBr + 1,3-BUTADIENE</text><text x="46.0" y="594.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">−80 °C</text><text x="124.0" y="594.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">1,2-addition</text><text x="602.0" y="594.0" class="" text-anchor="end" style="fill:#245574;font-weight:700;font-size:11.5px">KINETIC</text><text x="124.0" y="614.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">the allylic cation is captured fastest at the nearer carbon</text><text x="46.0" y="646.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">40 °C</text><text x="124.0" y="646.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">1,4-addition</text><text x="602.0" y="646.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:700;font-size:11.5px">THERMODYNAMIC</text><text x="124.0" y="666.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">its double bond is internal and more substituted</text><text x="324.0" y="700.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:11.5px">Neither product is conjugated — the 1,4 product wins on substitution, not conjugation.</text><rect x="24" y="740" width="1128" height="92" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="588.0" y="770.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13.5px">Where a catalyst fits — and where an enzyme goes further</text><text x="588.0" y="791.5" class="" text-anchor="middle" style="font-size:12px">A catalyst lowers BOTH barriers, so it speeds the approach to equilibrium without changing which product is the more stable or where the equilibrium</text><text x="588.0" y="808.5" class="" text-anchor="middle" style="font-size:12px">lies. An enzyme exploits the opposite end: by stabilising one transition state and not the others it holds a reaction under kinetic control,</text><text x="588.0" y="825.5" class="" text-anchor="middle" style="font-size:12px">delivering a single stereoisomer or regioisomer that plain equilibration would never favour.</text></svg>