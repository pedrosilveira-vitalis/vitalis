<svg xmlns="http://www.w3.org/2000/svg" width="920" height="972" viewBox="0 0 920 972" role="img" aria-labelledby="t d"><title id="t">Not biology, but biological in its effects</title><desc id="d">Top: the chain the exam wants you to be able to run in both directions. Race is a social category, not a genetic one — there is more variation inside any racial group than between groups — yet it has been used to allocate housing, schooling, work and care for generations, and those allocations leave marks that are entirely physical. The weathering hypothesis is the hinge: chronic exposure to disadvantage and discrimination accelerates biological ageing, which is why a college-educated Black woman can have worse birth outcomes than a white woman with less schooling. Bottom left: the three levels at which racism operates, which is the single most common classification question. Bottom right: prejudice against discrimination, and where the other terms sit.</desc><defs><marker id="m8241" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="972" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Not biology, but biological in its effects</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Race has no genetic basis and still shows up in telomeres and birth weights</text><rect x="40" y="180" width="840" height="296" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">From a category with no biology to effects that are entirely biological</text><rect x="60" y="232" width="192" height="92" rx="9" fill="#efede8" stroke="#6d716f" stroke-width="1.8"/><text x="156.0" y="258.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:10.5px">A SOCIAL CATEGORY</text><text x="156.0" y="280.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">assigned by appearance,</text><text x="156.0" y="295.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">redrawn by law and era</text><rect x="265" y="232" width="192" height="92" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="361.0" y="258.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10.5px">USED TO ALLOCATE</text><text x="361.0" y="280.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">housing, schooling, work,</text><text x="361.0" y="295.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">policing, credit, care</text><rect x="470" y="232" width="192" height="92" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="566.0" y="258.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">CHRONIC STRESS</text><text x="566.0" y="280.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">and chronic exposure —</text><text x="566.0" y="295.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">pollution, violence, scarcity</text><rect x="675" y="232" width="192" height="92" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="771.0" y="258.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">BIOLOGY CHANGES</text><text x="771.0" y="280.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">allostatic load, cortisol,</text><text x="771.0" y="295.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">shortened telomeres</text><line x1="256" y1="278" x2="266" y2="278" stroke="#6d716f" stroke-width="1.6" marker-end="url(#m8241)"/><line x1="461" y1="278" x2="471" y2="278" stroke="#6d716f" stroke-width="1.6" marker-end="url(#m8241)"/><line x1="666" y1="278" x2="676" y2="278" stroke="#6d716f" stroke-width="1.6" marker-end="url(#m8241)"/><rect x="70" y="340" width="780" height="58" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="460.0" y="362.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">THE EVIDENCE THAT RULES OUT A PURELY ECONOMIC EXPLANATION</text><text x="460.0" y="382.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">college-educated Black women have worse birth outcomes than white women with less education</text><text x="460.0" y="424.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">and the trap to avoid: a few conditions track ANCESTRY, not race</text><text x="460.0" y="444.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">sickle cell trait follows malaria-endemic ancestry; Tay-Sachs follows specific founder populations</text><text x="460.0" y="462.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">neither makes race a biological category — using race as a proxy for genotype is a methodological error</text><rect x="40" y="492" width="410" height="456" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="245.0" y="520.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">Three levels, one question type</text><rect x="64" y="544" width="362" height="76" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="245.0" y="566.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">INDIVIDUAL</text><text x="245.0" y="582.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">one person&#x27;s beliefs and acts</text><text x="245.0" y="600.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">a clinician spends less time with</text><text x="245.0" y="614.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">certain patients</text><rect x="64" y="630" width="362" height="90" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="245.0" y="652.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">INSTITUTIONAL</text><text x="245.0" y="668.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">a policy inside one institution</text><text x="245.0" y="686.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">a rule that is neutral on its face and</text><text x="245.0" y="700.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">unequal in its results — no racist</text><text x="245.0" y="714.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">actor is required</text><rect x="64" y="730" width="362" height="90" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="245.0" y="752.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">STRUCTURAL</text><text x="245.0" y="768.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">all the institutions together</text><text x="245.0" y="786.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">housing, schooling, credit, policing</text><text x="245.0" y="800.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">and medicine compounding across</text><text x="245.0" y="814.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">generations</text><rect x="64" y="834" width="362" height="86" rx="9" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="245.0" y="856.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">AND THE CONTEMPORARY FORM</text><text x="245.0" y="876.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">COLOURBLIND RACISM</text><text x="245.0" y="894.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">denies that race still matters and reads</text><text x="245.0" y="908.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">the resulting inequality as culture or merit</text><rect x="470" y="492" width="410" height="456" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="675.0" y="520.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">Attitude, act, and the rest</text><rect x="494" y="542" width="176" height="76" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="582.0" y="566.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">PREJUDICE</text><text x="582.0" y="586.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">an ATTITUDE</text><text x="582.0" y="604.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">held, not acted on</text><rect x="680" y="542" width="176" height="76" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="768.0" y="566.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11.5px">DISCRIMINATION</text><text x="768.0" y="586.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">an ACT</text><text x="768.0" y="604.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">differential treatment</text><rect x="494" y="634" width="362" height="56" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="675.0" y="654.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">IMPLICIT BIAS</text><text x="675.0" y="669.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">prejudice the holder is unaware of; shows</text><text x="675.0" y="682.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">up in timed tasks and in clinical decisions</text><rect x="494" y="695" width="362" height="56" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="675.0" y="715.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">STEREOTYPE THREAT</text><text x="675.0" y="730.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">fear of confirming the stereotype,</text><text x="675.0" y="743.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">which then degrades performance</text><rect x="494" y="756" width="362" height="56" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="675.0" y="776.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">CODE-SWITCHING</text><text x="675.0" y="791.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">adjusting speech and manner to fit</text><text x="675.0" y="804.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">the dominant setting; it costs effort</text><rect x="494" y="817" width="362" height="56" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="675.0" y="837.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">GLASS CEILING</text><text x="675.0" y="852.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">an unseen barrier to the top, justified</text><text x="675.0" y="865.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">in vague terms like “executive presence”</text><rect x="494" y="878" width="362" height="56" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="675.0" y="898.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">INTERSECTIONALITY</text><text x="675.0" y="913.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">identities combine into positions that</text><text x="675.0" y="926.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">neither axis explains on its own</text></svg>