<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680" role="img" aria-labelledby="t d"><title id="t">Counting electrons, in a plating bath and in a mitochondrion</title><desc id="d">Two parallel chains. On the left, electrolysis: current times time gives charge in coulombs, divided by the Faraday constant gives moles of electrons, divided by the electrons per ion gives moles of metal, times the molar mass gives grams, worked through for copper plating at 2 amps for 30 minutes to give 1.18 grams. On the right, the electron transport chain: NADH at minus 0.32 volts hands two electrons to oxygen at plus 0.82 volts, a 1.14 volt drop worth 220 kilojoules per mole, which pumps ten protons, and at about four protons per ATP once transport costs are included yields roughly 2.5 ATP.</desc><defs><marker id="m7186" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker><marker id="m9444" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="900" height="680" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Counting electrons, in a plating bath and in a mitochondrion</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Charge becomes moles of electrons; moles of electrons become whatever they are spent on.</text><text x="252.0" y="108.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:21px">Electrolysis</text><text x="252.0" y="130.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">spend charge, get metal</text><rect x="76" y="158" width="352" height="62" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="110.0" y="184.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:18px">I × t</text><text x="414.0" y="182.0" class="" text-anchor="end" style="fill:#6d716f;font-size:13px">charge</text><text x="252.0" y="206.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">2.00 A × 1800 s = 3600 C</text><line x1="252" y1="220" x2="252" y2="234" stroke="#245574" stroke-width="2.5" marker-end="url(#m9444)"/><rect x="76" y="240" width="352" height="62" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="110.0" y="266.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:18px">÷ F</text><text x="414.0" y="264.0" class="" text-anchor="end" style="fill:#6d716f;font-size:13px">moles of e⁻</text><text x="252.0" y="288.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">3600 / 96,500 = 0.0373 mol</text><line x1="252" y1="302" x2="252" y2="316" stroke="#245574" stroke-width="2.5" marker-end="url(#m9444)"/><rect x="76" y="322" width="352" height="62" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="110.0" y="348.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:18px">÷ n</text><text x="414.0" y="346.0" class="" text-anchor="end" style="fill:#6d716f;font-size:13px">moles of Cu</text><text x="252.0" y="370.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">0.0373 / 2 = 0.0187 mol</text><line x1="252" y1="384" x2="252" y2="398" stroke="#245574" stroke-width="2.5" marker-end="url(#m9444)"/><rect x="76" y="404" width="352" height="62" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="110.0" y="430.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:18px">× M</text><text x="414.0" y="428.0" class="" text-anchor="end" style="fill:#6d716f;font-size:13px">grams plated</text><text x="252.0" y="452.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">0.0187 × 63.5 = 1.18 g</text><text x="252.0" y="492.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">m = I t M / (n F)</text><text x="650.0" y="108.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:21px">Electron transport chain</text><text x="650.0" y="130.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">spend electrons, get a gradient</text><rect x="474" y="158" width="352" height="62" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="508.0" y="184.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:18px">ΔE°′</text><text x="812.0" y="182.0" class="" text-anchor="end" style="fill:#6d716f;font-size:13px">NADH → O₂</text><text x="650.0" y="206.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">+0.82 − (−0.32) = 1.14 V</text><line x1="650" y1="220" x2="650" y2="234" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m7186)"/><rect x="474" y="240" width="352" height="62" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="508.0" y="266.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:18px">−nFΔE</text><text x="812.0" y="264.0" class="" text-anchor="end" style="fill:#6d716f;font-size:13px">free energy</text><text x="650.0" y="288.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">−2 × 96,500 × 1.14 ≈ −220 kJ</text><line x1="650" y1="302" x2="650" y2="316" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m7186)"/><rect x="474" y="322" width="352" height="62" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="508.0" y="348.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:18px">pumped</text><text x="812.0" y="346.0" class="" text-anchor="end" style="fill:#6d716f;font-size:13px">Complexes I, III, IV</text><text x="650.0" y="370.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">4 + 4 + 2 = 10 H⁺</text><line x1="650" y1="384" x2="650" y2="398" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m7186)"/><rect x="474" y="404" width="352" height="62" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="508.0" y="430.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:18px">÷ 4 H⁺</text><text x="812.0" y="428.0" class="" text-anchor="end" style="fill:#6d716f;font-size:13px">3 for synthase, 1 for transport</text><text x="650.0" y="452.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">10 / 4 ≈ 2.5 ATP per NADH</text><text x="650.0" y="492.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">ΔG°′ = −nFΔE°′</text><rect x="60" y="520" width="780" height="142" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="450.0" y="548.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:18px">One electrode rule, two kinds of cell</text><text x="450.0" y="574.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">Oxidation is at the anode and reduction at the cathode in every cell. Only the sign of the electrode changes.</text><text x="258.0" y="606.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">galvanic: anode −, cathode +</text><text x="646.0" y="606.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">electrolytic: anode +, cathode −</text><text x="450.0" y="638.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">The ETC is galvanic, not electrolytic: nothing outside the mitochondrion drives it. The electron drop pays for the pumping.</text></svg>