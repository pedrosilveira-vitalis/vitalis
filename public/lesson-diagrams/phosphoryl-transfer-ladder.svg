<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="780" viewBox="0 0 1160 780" role="img" aria-labelledby="t d"><title id="t">The phosphoryl transfer ladder</title><desc id="d">A vertical ladder ranks phosphorylated compounds by the standard free energy of hydrolysis, most negative at the top. Phosphoenolpyruvate is at minus 61.9 kilojoules per mole, 1,3-bisphosphoglycerate at minus 49.3, creatine phosphate at minus 43.1, ATP to ADP plus inorganic phosphate at minus 30.5, AMP to adenosine plus phosphate at minus 14.2 and glucose-6-phosphate at minus 13.8. A bracket marks that phosphoryl groups transfer spontaneously downward, from a compound higher on the ladder to one lower down, never upward on its own. ATP is highlighted in the middle, with a note that this is the whole point: everything above it can recharge ATP from ADP, and ATP can in turn phosphorylate everything below it, so ATP can accept energy from catabolism and spend it on biosynthesis without being either the strongest or the weakest donor. Worked examples on the right. First, glycolysis recharging ATP: phosphoenolpyruvate at minus 61.9 donates to ADP, and because making ATP costs plus 30.5 the net is minus 31.4 kilojoules per mole, which is why pyruvate kinase is effectively irreversible. Second, hexokinase spending ATP: phosphorylating glucose costs plus 13.8 on its own, ATP hydrolysis gives minus 30.5, and the coupled reaction is minus 16.7, so it runs. A panel states the requirement for coupling: a shared intermediate that mechanically links the two reactions, which in hexokinase means the phosphoryl group passes directly from ATP to glucose inside the active site with no free phosphate released; two reactions merely sharing a beaker are not coupled and the energy simply dissipates as heat. A second panel covers the irreversible variant, hydrolysis of ATP all the way to AMP plus pyrophosphate at minus 45.6, followed by pyrophosphatase cleaving the pyrophosphate at a further minus 19.2, which spends two high-energy bonds and pulls the reaction to completion; this is the strategy used in DNA and RNA synthesis, in aminoacyl-tRNA formation and in fatty acid activation. A footer notes that the figure of minus 30.5 is a standard-state value, that inside a cell the high ATP to ADP ratio makes the real figure closer to minus 50 to minus 60 kilojoules per mole, and that the cell maintains that ratio precisely to keep the driving force large.</desc><defs><marker id="m8280" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1160" height="780" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">The phosphoryl transfer ladder</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">ATP sits deliberately in the middle. That position — not a uniquely strong bond — is what makes it a currency.</text><rect x="40" y="150" width="470" height="62" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="62.0" y="176.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">phosphoenolpyruvate (PEP)</text><text x="488.0" y="176.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:700;font-size:15px">-61.9</text><text x="62.0" y="196.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">glycolysis: recharges ATP</text><text x="488.0" y="196.0" class="" text-anchor="end" style="fill:#6d716f;font-size:9.5px">kJ/mol</text><rect x="40" y="226" width="470" height="62" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="62.0" y="252.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">1,3-bisphosphoglycerate</text><text x="488.0" y="252.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:700;font-size:15px">-49.3</text><text x="62.0" y="272.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">glycolysis: recharges ATP</text><text x="488.0" y="272.0" class="" text-anchor="end" style="fill:#6d716f;font-size:9.5px">kJ/mol</text><rect x="40" y="302" width="470" height="62" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="62.0" y="328.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">creatine phosphate</text><text x="488.0" y="328.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:700;font-size:15px">-43.1</text><text x="62.0" y="348.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">muscle&#x27;s instant ATP buffer</text><text x="488.0" y="348.0" class="" text-anchor="end" style="fill:#6d716f;font-size:9.5px">kJ/mol</text><rect x="40" y="378" width="470" height="62" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="3"/><text x="62.0" y="404.0" class="" text-anchor="start" style="fill:#987740;font-weight:700;font-size:12.5px">ATP → ADP + Pᵢ</text><text x="488.0" y="404.0" class="" text-anchor="end" style="fill:#987740;font-weight:700;font-size:15px">-30.5</text><text x="62.0" y="424.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">the currency</text><text x="488.0" y="424.0" class="" text-anchor="end" style="fill:#6d716f;font-size:9.5px">kJ/mol</text><rect x="40" y="454" width="470" height="62" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="62.0" y="480.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">AMP → adenosine + Pᵢ</text><text x="488.0" y="480.0" class="" text-anchor="end" style="fill:#5b7a64;font-weight:700;font-size:15px">-14.2</text><text x="488.0" y="500.0" class="" text-anchor="end" style="fill:#6d716f;font-size:9.5px">kJ/mol</text><rect x="40" y="530" width="470" height="62" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="62.0" y="556.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">glucose-6-phosphate</text><text x="488.0" y="556.0" class="" text-anchor="end" style="fill:#5b7a64;font-weight:700;font-size:15px">-13.8</text><text x="62.0" y="576.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">ATP pays to make this</text><text x="488.0" y="576.0" class="" text-anchor="end" style="fill:#6d716f;font-size:9.5px">kJ/mol</text><line x1="524" y1="166" x2="524" y2="576" stroke="#245574" stroke-width="2.5" marker-end="url(#m8280)"/><text x="572.0" y="300.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:11px">phosphoryl</text><text x="572.0" y="314.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:11px">groups transfer</text><text x="572.0" y="328.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:11px">spontaneously</text><text x="572.0" y="342.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:11px">DOWN the ladder</text><text x="572.0" y="356.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:11px">— never up on</text><text x="572.0" y="370.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:11px">their own</text><rect x="40" y="620" width="470" height="118" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="275.0" y="650.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:13px">Why ATP is in the middle on purpose</text><text x="275.0" y="671.0" class="" text-anchor="middle" style="font-size:12px">Everything above it can recharge ATP from ADP; ATP can</text><text x="275.0" y="688.0" class="" text-anchor="middle" style="font-size:12px">phosphorylate everything below it. A currency has to be</text><text x="275.0" y="705.0" class="" text-anchor="middle" style="font-size:12px">able to take payment and make payment — which means it</text><text x="275.0" y="722.0" class="" text-anchor="middle" style="font-size:12px">must be neither the strongest donor nor the weakest.</text><rect x="620" y="150" width="516" height="150" rx="11" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="878.0" y="176.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:13px">Recharging ATP — pyruvate kinase</text><text x="648.0" y="206.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">PEP + H₂O → pyruvate + Pᵢ</text><text x="1110.0" y="206.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:12px">−61.9</text><text x="648.0" y="228.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">ADP + Pᵢ → ATP + H₂O</text><text x="1110.0" y="228.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:12px">+30.5</text><line x1="648" y1="240" x2="1110" y2="240" stroke="#9aa7b4" stroke-width="1"/><text x="648.0" y="262.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12px">net: PEP + ADP → pyruvate + ATP</text><text x="1110.0" y="262.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:700;font-size:13px">−31.4</text><text x="878.0" y="286.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">effectively irreversible — a control point</text><rect x="620" y="316" width="516" height="150" rx="11" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="878.0" y="342.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:13px">Spending ATP — hexokinase</text><text x="648.0" y="372.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">glucose + Pᵢ → glucose-6-P</text><text x="1110.0" y="372.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:12px">+13.8</text><text x="648.0" y="394.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">ATP + H₂O → ADP + Pᵢ</text><text x="1110.0" y="394.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:12px">−30.5</text><line x1="648" y1="406" x2="1110" y2="406" stroke="#9aa7b4" stroke-width="1"/><text x="648.0" y="428.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12px">net: glucose + ATP → glucose-6-P + ADP</text><text x="1110.0" y="428.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:700;font-size:13px">−16.7</text><text x="878.0" y="452.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">the Pᵢ is never free — it goes straight across</text><rect x="620" y="482" width="516" height="110" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="878.0" y="512.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">Coupling needs a shared intermediate</text><text x="878.0" y="533.0" class="" text-anchor="middle" style="font-size:12px">In hexokinase the phosphoryl group passes directly from ATP to</text><text x="878.0" y="550.0" class="" text-anchor="middle" style="font-size:12px">glucose inside the active site. Two reactions sharing a beaker</text><text x="878.0" y="567.0" class="" text-anchor="middle" style="font-size:12px">are not coupled — the energy just leaves as heat.</text><rect x="620" y="606" width="516" height="132" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="878.0" y="636.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">The irreversible version: spend two bonds</text><text x="878.0" y="657.0" class="" text-anchor="middle" style="font-size:12px">ATP + H₂O → AMP + PPᵢ ΔG°′ = −45.6, then pyrophosphatase: PPᵢ</text><text x="878.0" y="674.0" class="" text-anchor="middle" style="font-size:12px">+ H₂O → 2 Pᵢ ΔG°′ = −19.2. Destroying the PPᵢ pulls the</text><text x="878.0" y="691.0" class="" text-anchor="middle" style="font-size:12px">reaction to completion. Used in DNA and RNA synthesis,</text><text x="878.0" y="708.0" class="" text-anchor="middle" style="font-size:12px">aminoacyl-tRNA formation and fatty acid activation.</text></svg>