<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Efferent pathways: neurons, transmitters and receptors</title><desc id="d">Five rows. Parasympathetic: long preganglionic fiber, ACh on nicotinic receptors in a ganglion near the organ, short postganglionic fiber releasing ACh on muscarinic receptors. Sympathetic: short preganglionic fiber to a chain or prevertebral ganglion, ACh on nicotinic receptors, long postganglionic fiber releasing norepinephrine on alpha or beta receptors. Sympathetic to sweat glands: same but the postganglionic fiber releases ACh on muscarinic receptors. Adrenal medulla: preganglionic fiber releases ACh on nicotinic receptors of chromaffin cells, which secrete epinephrine (about 80 percent) and norepinephrine into blood. Somatic: a single motor neuron releases ACh on nicotinic receptors of skeletal muscle.</desc><defs><marker id="m1331" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker><marker id="m3987" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b7a64"/></marker><marker id="m5615" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#987740"/></marker><marker id="m6321" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="620" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Efferent pathways: neurons, transmitters and receptors</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Every autonomic ganglion uses ACh on nicotinic receptors; the postganglionic transmitter and receptor differ.</text><text x="30.0" y="104.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:700;font-size:16px">Parasympathetic</text><rect x="126" y="116" width="22" height="28" rx="4" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><line x1="150" y1="130" x2="552" y2="130" stroke="#5b7a64" stroke-width="4"/><circle cx="150" cy="130" r="7" fill="#5b7a64" stroke="#5b7a64" stroke-width="2"/><line x1="548" y1="130" x2="560" y2="130" stroke="#5b7a64" stroke-width="2" marker-end="url(#m3987)"/><text x="395.0" y="118.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:14px">ACh → N</text><circle cx="580" cy="130" r="18" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><line x1="600" y1="130" x2="712" y2="130" stroke="#5b7a64" stroke-width="4"/><circle cx="600" cy="130" r="7" fill="#5b7a64" stroke="#5b7a64" stroke-width="2"/><line x1="708" y1="130" x2="720" y2="130" stroke="#5b7a64" stroke-width="2" marker-end="url(#m3987)"/><text x="700.0" y="118.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:14px">ACh → M</text><rect x="740" y="108" width="235" height="44" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="857.0" y="135.0" class="" text-anchor="middle" style="font-size:15px">Organ</text><text x="30.0" y="199.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:16px">Sympathetic</text><rect x="126" y="211" width="22" height="28" rx="4" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><line x1="150" y1="225" x2="322" y2="225" stroke="#245574" stroke-width="4"/><circle cx="150" cy="225" r="7" fill="#245574" stroke="#245574" stroke-width="2"/><line x1="318" y1="225" x2="330" y2="225" stroke="#245574" stroke-width="2" marker-end="url(#m6321)"/><text x="280.0" y="213.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:14px">ACh → N</text><circle cx="350" cy="225" r="18" fill="#e4edf3" stroke="#245574" stroke-width="2"/><line x1="370" y1="225" x2="712" y2="225" stroke="#245574" stroke-width="4"/><circle cx="370" cy="225" r="7" fill="#245574" stroke="#245574" stroke-width="2"/><line x1="708" y1="225" x2="720" y2="225" stroke="#245574" stroke-width="2" marker-end="url(#m6321)"/><text x="585.0" y="213.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:14px">NE → α / β</text><rect x="740" y="203" width="235" height="44" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="857.0" y="230.0" class="" text-anchor="middle" style="font-size:15px">Organ</text><text x="30.0" y="294.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:16px">Sympathetic → sweat</text><rect x="126" y="306" width="22" height="28" rx="4" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><line x1="150" y1="320" x2="322" y2="320" stroke="#245574" stroke-width="4"/><circle cx="150" cy="320" r="7" fill="#245574" stroke="#245574" stroke-width="2"/><line x1="318" y1="320" x2="330" y2="320" stroke="#245574" stroke-width="2" marker-end="url(#m6321)"/><text x="280.0" y="308.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:14px">ACh → N</text><circle cx="350" cy="320" r="18" fill="#e4edf3" stroke="#245574" stroke-width="2"/><line x1="370" y1="320" x2="712" y2="320" stroke="#245574" stroke-width="4"/><circle cx="370" cy="320" r="7" fill="#245574" stroke="#245574" stroke-width="2"/><line x1="708" y1="320" x2="720" y2="320" stroke="#245574" stroke-width="2" marker-end="url(#m6321)"/><text x="585.0" y="308.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:14px">ACh → M</text><rect x="740" y="298" width="235" height="44" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="857.0" y="325.0" class="" text-anchor="middle" style="font-size:15px">Sweat gland</text><text x="30.0" y="389.0" class="" text-anchor="start" style="fill:#987740;font-weight:700;font-size:16px">Adrenal medulla</text><rect x="126" y="401" width="22" height="28" rx="4" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><line x1="150" y1="415" x2="552" y2="415" stroke="#987740" stroke-width="4"/><circle cx="150" cy="415" r="7" fill="#987740" stroke="#987740" stroke-width="2"/><line x1="548" y1="415" x2="560" y2="415" stroke="#987740" stroke-width="2" marker-end="url(#m5615)"/><text x="395.0" y="403.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:14px">ACh → N</text><rect x="565" y="393" width="410" height="44" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="770.0" y="420.0" class="" text-anchor="middle" style="font-size:14px">Chromaffin cells → Epi (~80%) + NE into blood</text><text x="30.0" y="484.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:700;font-size:16px">Somatic</text><rect x="126" y="496" width="22" height="28" rx="4" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><line x1="150" y1="510" x2="712" y2="510" stroke="#6d716f" stroke-width="4"/><circle cx="150" cy="510" r="7" fill="#6d716f" stroke="#6d716f" stroke-width="2"/><line x1="708" y1="510" x2="720" y2="510" stroke="#6d716f" stroke-width="2" marker-end="url(#m1331)"/><text x="475.0" y="498.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:700;font-size:14px">ACh → N (NMJ)</text><rect x="740" y="488" width="235" height="44" rx="8" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="857.0" y="515.0" class="" text-anchor="middle" style="font-size:15px">Skeletal muscle</text><text x="137.0" y="550.0" class="" text-anchor="middle" style="font-size:1px"></text><text x="500.0" y="600.0" class="" text-anchor="middle" style="font-size:15px">Box at left = CNS.  N = nicotinic (ion channel).  M = muscarinic (GPCR).  α/β = adrenergic (GPCR).  Circles = ganglia.</text></svg>