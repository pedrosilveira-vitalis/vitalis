<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">Distinguishing levels of gene regulation</title><desc id="desc">DNA is transcribed into RNA which is translated into protein. Transcriptional repression lowers RNA production. RNA destabilization reduces RNA lifetime. Translation inhibition can reduce protein output without lowering the measured RNA level. Correlation of a histone mark is not proof of causation.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#aa3653;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">Gene regulation: measure the step that changed</text><rect x="24" y="60" width="752" height="140" rx="16" fill="white" stroke="#d9d2c6"/><rect x="75" y="97" width="90" height="45" rx="10" fill="#e4eef1"/><text x="120" y="126" class="t" text-anchor="middle">DNA</text><rect x="345" y="97" width="90" height="45" rx="10" fill="#e4eef1"/><text x="390" y="126" class="t" text-anchor="middle">mRNA</text><rect x="640" y="97" width="90" height="45" rx="10" fill="#e4eef1"/><text x="685" y="126" class="t" text-anchor="middle">Protein</text><path d="M165 120 L345 120" class="bond" /><text x="255" y="105" class="s" text-anchor="middle">transcription</text><text x="330" y="126" class="t" text-anchor="start">→</text><path d="M435 120 L640 120" class="bond" /><text x="537" y="105" class="s" text-anchor="middle">translation</text><text x="620" y="126" class="t" text-anchor="start">→</text><text x="55" y="177" class="t" text-anchor="start">RNA abundance reflects BOTH production and removal.</text><rect x="24" y="216" width="752" height="134" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="251" class="h" text-anchor="start">1  Promoter / chromatin regulation</text><text x="55" y="291" class="t" text-anchor="start">Changes the rate of RNA production.</text><text x="55" y="324" class="s" text-anchor="start">A histone mark alone does not prove activation or repression.</text><rect x="24" y="366" width="752" height="134" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="401" class="h" text-anchor="start">2  RNA destabilization</text><text x="55" y="441" class="t" text-anchor="start">Increases RNA removal → often less mRNA and less protein.</text><text x="55" y="474" class="s" text-anchor="start">Mammalian miRNAs commonly produce this sustained effect.</text><rect x="24" y="516" width="752" height="134" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="551" class="h" text-anchor="start">3  Translation inhibition</text><text x="55" y="591" class="t" text-anchor="start">Less protein output can occur with unchanged measured mRNA.</text><text x="55" y="624" class="s" text-anchor="start">That observation does not mean miRNAs never promote decay.</text><text x="44" y="688" class="t" text-anchor="start">Use time courses and perturbations to test causal explanations.</text><text x="44" y="716" class="s" text-anchor="start">Not shown: protein turnover also changes steady-state protein abundance.</text></svg>