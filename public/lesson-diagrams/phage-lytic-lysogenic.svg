<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="t d"><title id="t">Bacteriophage lytic and lysogenic cycles</title><desc id="d">A shared start: attachment of phage tail fibers to a receptor, then injection of phage DNA. Left branch, lytic cycle: early genes take over the cell and replicate phage DNA; late genes make heads and tails; virions assemble; holin and endolysin lyse the cell, releasing about 100 to 200 phage after roughly 20 to 30 minutes for T4. Right branch, lysogenic cycle: lambda DNA circularizes and integrase inserts it at the att site as a prophage; the CI repressor keeps lytic genes off; the lysogen divides normally, copying the prophage; lysogenic conversion can give the host new genes such as diphtheria or cholera toxin. An arrow labelled induction leads from lysogeny to the lytic cycle: DNA damage activates RecA, which triggers CI self-cleavage, the prophage excises and lytic growth begins.</desc><defs><marker id="m2947" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#987740"/></marker><marker id="m6857" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker><marker id="m8508" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="640" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Bacteriophage lytic and lysogenic cycles</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">A temperate phage such as lambda can take either path after injecting its DNA.</text><rect x="350" y="96" width="300" height="70" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="500.0" y="126.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:15px">Attachment → injection</text><text x="500.0" y="149.0" class="" text-anchor="middle" style="font-size:13px">tail fibers bind receptor; DNA enters,</text><text x="500.0" y="167.0" class="" text-anchor="middle" style="font-size:13px">capsid stays out</text><line x1="430" y1="166" x2="230" y2="214" stroke="#245574" stroke-width="2.5" marker-end="url(#m6857)"/><line x1="570" y1="166" x2="770" y2="214" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m8508)"/><text x="80.0" y="206.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:16px">LYTIC</text><text x="920.0" y="206.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:700;font-size:16px">LYSOGENIC</text><rect x="80" y="220" width="300" height="66" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="230.0" y="250.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:15px">Early genes</text><text x="230.0" y="273.0" class="" text-anchor="middle" style="font-size:13px">take over host, copy phage DNA</text><line x1="230" y1="286" x2="230" y2="308" stroke="#245574" stroke-width="2.5" marker-end="url(#m6857)"/><rect x="80" y="310" width="300" height="66" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="230.0" y="340.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:15px">Late genes</text><text x="230.0" y="363.0" class="" text-anchor="middle" style="font-size:13px">capsid heads, tails, lysis proteins</text><line x1="230" y1="376" x2="230" y2="398" stroke="#245574" stroke-width="2.5" marker-end="url(#m6857)"/><rect x="80" y="400" width="300" height="66" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="230.0" y="430.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:15px">Assembly</text><text x="230.0" y="453.0" class="" text-anchor="middle" style="font-size:13px">DNA packaged into heads</text><line x1="230" y1="466" x2="230" y2="488" stroke="#245574" stroke-width="2.5" marker-end="url(#m6857)"/><rect x="80" y="490" width="300" height="66" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="230.0" y="520.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:15px">Lysis</text><text x="230.0" y="543.0" class="" text-anchor="middle" style="font-size:13px">holin + endolysin; ~100–200 phage released</text><rect x="620" y="220" width="300" height="66" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="770.0" y="250.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:15px">Integration</text><text x="770.0" y="273.0" class="" text-anchor="middle" style="font-size:13px">integrase inserts DNA at att → prophage</text><line x1="770" y1="286" x2="770" y2="308" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m8508)"/><rect x="620" y="310" width="300" height="66" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="770.0" y="340.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:15px">Repression</text><text x="770.0" y="363.0" class="" text-anchor="middle" style="font-size:13px">CI repressor silences lytic genes</text><line x1="770" y1="376" x2="770" y2="398" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m8508)"/><rect x="620" y="400" width="300" height="66" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="770.0" y="430.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:15px">Lysogen divides</text><text x="770.0" y="453.0" class="" text-anchor="middle" style="font-size:13px">prophage copied with chromosome</text><rect x="620" y="490" width="300" height="66" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="770.0" y="520.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:15px">Lysogenic conversion</text><text x="770.0" y="543.0" class="" text-anchor="middle" style="font-size:13px">e.g., diphtheria, cholera toxin genes</text><line x1="620" y1="268" x2="384" y2="268" stroke="#987740" stroke-width="3" marker-end="url(#m2947)"/><rect x="395" y="300" width="210" height="110" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="500.0" y="330.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:14px">Induction</text><text x="500.0" y="352.0" class="" text-anchor="middle" style="font-size:12px">UV / DNA damage activates</text><text x="500.0" y="369.0" class="" text-anchor="middle" style="font-size:12px">RecA → CI repressor</text><text x="500.0" y="386.0" class="" text-anchor="middle" style="font-size:12px">self-cleaves → prophage</text><text x="500.0" y="403.0" class="" text-anchor="middle" style="font-size:12px">excises</text><line x1="500" y1="300" x2="500" y2="272" stroke="#987740" stroke-width="2"/><text x="500.0" y="600.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">Burst time for T4 ≈ 20–30 min. A lysogen is immune to superinfection by the same phage (CI repressor).</text></svg>