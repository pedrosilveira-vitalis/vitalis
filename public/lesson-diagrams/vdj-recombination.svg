<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="t d"><title id="t">V(D)J recombination: building a heavy-chain gene</title><desc id="d">Four rows show the human heavy-chain locus on chromosome 14. Row 1, germline: about 40 functional V segments, about 25 D segments, 6 J segments, then constant genes C-mu, C-delta, C-gamma, C-epsilon, C-alpha. Row 2: RAG1 and RAG2 join one D to one J, deleting the DNA between them. Row 3: one V is joined to the DJ, forming a VDJ exon; TdT adds N-nucleotides at the junctions, which become the highly variable CDR3. Row 4: the VDJ exon is transcribed with C-mu (and C-delta by alternative splicing) giving IgM and IgD. A side box tallies diversity: 40 times 25 times 6 is about 6,000 heavy-chain combinations; kappa 40 times 5 is about 200 and lambda about 120 light-chain combinations; pairing gives about 2 million; junctional diversity and later somatic hypermutation add far more.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="640" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">V(D)J recombination: building a heavy-chain gene</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Germline DNA is cut and rejoined in developing B cells (RAG1/RAG2), D to J first, then V to DJ.</text><text x="40.0" y="130.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:14px">1  Germline (all B cells)</text><text x="40.0" y="230.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:14px">2  D–J joining</text><text x="40.0" y="330.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:14px">3  V–DJ joining</text><text x="40.0" y="430.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:14px">4  Transcript → μ (and δ) chain</text><line x1="40" y1="155" x2="730" y2="155" stroke="#6d716f" stroke-width="2"/><rect x="50" y="140" width="34" height="30" rx="4" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="67.0" y="160.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12px">V</text><rect x="92" y="140" width="34" height="30" rx="4" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="109.0" y="160.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12px">V</text><rect x="134" y="140" width="34" height="30" rx="4" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="151.0" y="160.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12px">V</text><rect x="176" y="140" width="34" height="30" rx="4" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="193.0" y="160.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12px">V</text><text x="110.0" y="190.0" class="" text-anchor="middle" style="fill:#245574;font-size:12px">~40 functional V</text><rect x="290" y="140" width="26" height="30" rx="4" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="303.0" y="160.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:12px">D</text><rect x="324" y="140" width="26" height="30" rx="4" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="337.0" y="160.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:12px">D</text><rect x="358" y="140" width="26" height="30" rx="4" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="371.0" y="160.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:12px">D</text><text x="330.0" y="190.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:12px">~25 D</text><text x="480.0" y="190.0" class="" text-anchor="middle" style="fill:#987740;font-size:12px">6 J</text><text x="640.0" y="190.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:12px">constant genes</text><rect x="430" y="140" width="16" height="30" rx="4" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="438.0" y="160.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:12px">J</text><rect x="450" y="140" width="16" height="30" rx="4" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="458.0" y="160.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:12px">J</text><rect x="470" y="140" width="16" height="30" rx="4" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="478.0" y="160.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:12px">J</text><rect x="490" y="140" width="16" height="30" rx="4" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="498.0" y="160.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:12px">J</text><rect x="510" y="140" width="16" height="30" rx="4" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="518.0" y="160.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:12px">J</text><rect x="530" y="140" width="16" height="30" rx="4" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="538.0" y="160.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:12px">J</text><rect x="548" y="140" width="30" height="30" rx="4" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="563.0" y="160.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">Cμ</text><rect x="584" y="140" width="30" height="30" rx="4" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="599.0" y="160.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">Cδ</text><rect x="620" y="140" width="30" height="30" rx="4" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="635.0" y="160.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">Cγ</text><rect x="656" y="140" width="30" height="30" rx="4" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="671.0" y="160.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">Cε</text><rect x="692" y="140" width="30" height="30" rx="4" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="707.0" y="160.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">Cα</text><line x1="40" y1="255" x2="730" y2="255" stroke="#6d716f" stroke-width="2"/><rect x="50" y="240" width="34" height="30" rx="4" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="67.0" y="260.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12px">V</text><rect x="92" y="240" width="34" height="30" rx="4" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="109.0" y="260.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12px">V</text><rect x="134" y="240" width="34" height="30" rx="4" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="151.0" y="260.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12px">V</text><rect x="176" y="240" width="34" height="30" rx="4" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="193.0" y="260.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12px">V</text><rect x="330" y="240" width="26" height="30" rx="4" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="343.0" y="260.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:12px">D</text><rect x="356" y="240" width="18" height="30" rx="4" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="365.0" y="260.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:12px">J</text><rect x="548" y="240" width="30" height="30" rx="4" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="563.0" y="260.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">Cμ</text><rect x="584" y="240" width="30" height="30" rx="4" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="599.0" y="260.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">Cδ</text><rect x="620" y="240" width="30" height="30" rx="4" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="635.0" y="260.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">Cγ</text><rect x="656" y="240" width="30" height="30" rx="4" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="671.0" y="260.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">Cε</text><rect x="692" y="240" width="30" height="30" rx="4" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="707.0" y="260.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">Cα</text><text x="345.0" y="290.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">DNA between the chosen D and J is deleted</text><line x1="40" y1="355" x2="730" y2="355" stroke="#6d716f" stroke-width="2"/><rect x="300" y="340" width="34" height="30" rx="4" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="317.0" y="360.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12px">V</text><rect x="334" y="340" width="26" height="30" rx="4" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="347.0" y="360.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:12px">D</text><rect x="360" y="340" width="18" height="30" rx="4" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="369.0" y="360.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:12px">J</text><circle cx="334" cy="334" r="5" fill="#a8324a" stroke="#a8324a" stroke-width="1"/><circle cx="360" cy="334" r="5" fill="#a8324a" stroke="#a8324a" stroke-width="1"/><text x="347.0" y="324.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">N-nucleotides (TdT) → CDR3</text><rect x="548" y="340" width="30" height="30" rx="4" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="563.0" y="360.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">Cμ</text><rect x="584" y="340" width="30" height="30" rx="4" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="599.0" y="360.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">Cδ</text><rect x="620" y="340" width="30" height="30" rx="4" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="635.0" y="360.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">Cγ</text><rect x="656" y="340" width="30" height="30" rx="4" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="671.0" y="360.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">Cε</text><rect x="692" y="340" width="30" height="30" rx="4" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="707.0" y="360.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">Cα</text><text x="330.0" y="390.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">DNA between the chosen V and DJ is deleted</text><rect x="300" y="440" width="34" height="30" rx="4" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="317.0" y="460.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12px">V</text><rect x="334" y="440" width="26" height="30" rx="4" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="347.0" y="460.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:12px">D</text><rect x="360" y="440" width="18" height="30" rx="4" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="369.0" y="460.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:12px">J</text><rect x="378" y="440" width="40" height="30" rx="4" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="398.0" y="460.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">Cμ</text><text x="430.0" y="460.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">→ IgM heavy chain (Cδ by alternative splicing → IgD)</text><text x="50.0" y="460.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:700;font-size:12px">mRNA</text><rect x="760" y="120" width="210" height="330" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="865.0" y="150.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:16px">Counting diversity</text><text x="775.0" y="170.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">Heavy: 40 V × 25 D × 6 J</text><text x="775.0" y="188.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">≈ 6,000</text><text x="775.0" y="220.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">Light: κ 40 × 5 ≈ 200; λ</text><text x="775.0" y="238.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">≈ 120</text><text x="775.0" y="270.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">H × L pairing ≈ 2 × 10⁶</text><text x="775.0" y="302.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">+ junctional (N/P</text><text x="775.0" y="320.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">nucleotides): largest</text><text x="775.0" y="338.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">boost, centred on CDR3</text><text x="775.0" y="370.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">+ somatic hypermutation</text><text x="775.0" y="388.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">after antigen (AID)</text><rect x="40" y="510" width="930" height="90" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="505.0" y="540.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:15px">Key distinctions</text><text x="505.0" y="563.0" class="" text-anchor="middle" style="font-size:13px">RAG1/2: V(D)J joining, before antigen (no RAG → SCID). AID: class switching and somatic hypermutation, after antigen. Class switching</text><text x="505.0" y="581.0" class="" text-anchor="middle" style="font-size:13px">swaps the C gene and keeps the same VDJ, so specificity is unchanged.</text></svg>