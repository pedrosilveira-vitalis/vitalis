<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="t d"><title id="t">Four voices, and the words that give them away</title><desc id="d">Four voice cards with their giveaway phrases. A, the author: evaluative words with no source attached, verdict language such as this shows or what this means is, explicit disagreement such as this account is inadequate, and summary signals such as ultimately or in sum. S, a cited source: according to X, X argues, in X&#x27;s view, quotation marks, or a proper name with a past-tense verb. O, an opposing view: critics argue, opponents claim, the conventional wisdom holds, one might object that, and concessive openers such as although or admittedly. H, a hypothetical: suppose, imagine, consider, assume for the sake of argument, had X occurred, in a world where. Below, a worked excerpt tagged line by line: the dominant view held that city life was alienating, tagged O; a position articulated by Georg Simmel, tagged S; this account has proven influential, tagged A as a neutral acknowledgement; yet it rests on an impoverished conception, tagged A and marked as the pivot; more recent ethnographic work reveals rich local attachment, tagged S and used in support of the author; and the city is a genuinely social world, tagged A as the thesis. A footer warns that the longest-explained view is often the one being refuted, that a single however can reverse everything before it, and that in nested attribution, X argues the Romantics believed Y tells you nothing about what the author believes.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="680" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Four voices, and the words that give them away</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Tag every paragraph: A (author), S (cited source), O (opposing view), H (hypothetical).</text><rect x="30" y="104" width="222" height="196" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><circle cx="66" cy="140" r="22" fill="#ffffff" stroke="#a8324a" stroke-width="2.5"/><text x="66.0" y="148.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:24px">A</text><text x="98.0" y="148.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:14px">the author</text><text x="141.0" y="190.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">evaluative words with no</text><text x="141.0" y="205.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">source</text><text x="141.0" y="228.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">this shows · what this</text><text x="141.0" y="243.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">means is</text><text x="141.0" y="266.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">this account is inadequate</text><text x="141.0" y="289.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">ultimately · in sum</text><rect x="272" y="104" width="222" height="196" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><circle cx="308" cy="140" r="22" fill="#ffffff" stroke="#245574" stroke-width="2.5"/><text x="308.0" y="148.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:24px">S</text><text x="340.0" y="148.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:14px">a cited source</text><text x="383.0" y="190.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">according to X · X argues</text><text x="383.0" y="213.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">in X&#x27;s view · X contends</text><text x="383.0" y="236.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">quotation marks</text><text x="383.0" y="259.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">proper name + past tense</text><rect x="514" y="104" width="222" height="196" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><circle cx="550" cy="140" r="22" fill="#ffffff" stroke="#987740" stroke-width="2.5"/><text x="550.0" y="148.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:24px">O</text><text x="582.0" y="148.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:14px">an opposing view</text><text x="625.0" y="190.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">critics argue · opponents</text><text x="625.0" y="205.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">claim</text><text x="625.0" y="228.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">the conventional wisdom</text><text x="625.0" y="243.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">holds</text><text x="625.0" y="266.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">one might object that</text><text x="625.0" y="289.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">although · admittedly</text><rect x="756" y="104" width="222" height="196" rx="12" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><circle cx="792" cy="140" r="22" fill="#ffffff" stroke="#5b7a64" stroke-width="2.5"/><text x="792.0" y="148.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:24px">H</text><text x="824.0" y="148.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:14px">a hypothetical</text><text x="867.0" y="190.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">suppose · imagine ·</text><text x="867.0" y="205.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">consider</text><text x="867.0" y="228.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">assume for the sake of</text><text x="867.0" y="243.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">argument</text><text x="867.0" y="266.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">had X occurred</text><text x="867.0" y="289.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">in a world where</text><text x="30.0" y="342.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:16px">Tagging a real excerpt</text><rect x="30" y="362" width="34" height="34" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="47.0" y="385.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:15px">O</text><text x="78.0" y="385.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">The dominant view held that city life was inherently alienating…</text><rect x="30" y="406" width="34" height="34" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="47.0" y="429.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:15px">S</text><text x="78.0" y="429.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">…a position articulated by Georg Simmel, who argued the city compels a blasé attitude.</text><rect x="30" y="450" width="34" height="34" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="47.0" y="473.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:15px">A</text><text x="78.0" y="473.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">This account has proven enormously influential.   (acknowledging, not agreeing)</text><rect x="30" y="494" width="34" height="34" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="47.0" y="517.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:15px">A</text><text x="78.0" y="517.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">Yet it rests on an impoverished conception of urban experience.   ← THE PIVOT</text><rect x="30" y="538" width="34" height="34" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="47.0" y="561.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:15px">S</text><text x="78.0" y="561.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">More recent ethnographic work reveals rich networks of local attachment.   (supporting the author)</text><rect x="30" y="582" width="34" height="34" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="47.0" y="605.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:15px">A</text><text x="78.0" y="605.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">The city is, for many, a genuinely social world.   ← THE THESIS</text><text x="500.0" y="648.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:13px">The view explained at greatest length is often the one being refuted. One &quot;however&quot; can reverse everything before it.</text><text x="500.0" y="668.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:13px">Nested: &quot;X argues the Romantics believed Y&quot; tells you nothing about what the author believes.</text></svg>