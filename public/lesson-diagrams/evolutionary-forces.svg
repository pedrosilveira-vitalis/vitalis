<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-labelledby="title desc"><title id="title">Drift, migration and inbreeding</title><desc id="desc">Illustrative allele copies show a random bottleneck changing A frequency from 0.5 to 0.75. Migration combines 80 percent residents at p=0.9 and 20 percent migrants at p=0.3 to give p=0.78. Inbreeding changes genotype proportions without changing allele frequency.</desc><rect width="960" height="820" rx="22" fill="#fbf7ef"/><style>text{font-family:Arial,sans-serif;fill:#18364a;font-size:20px}.title{font-size:28px;font-weight:700}.head{font-size:23px;font-weight:700}.small{font-size:17px}.mono{font-family:monospace;font-size:23px}.white{fill:white}</style><text x="32" y="44" class="title" text-anchor="start">Three processes. Three different calculations.</text><rect x="24" y="75" width="912" height="222" rx="10" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="42" y="111" class="head" text-anchor="start">1 · Drift: a chance sample changes allele frequency</text><circle cx="60" cy="155" r="12" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="95" cy="155" r="12" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="130" cy="155" r="12" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="165" cy="155" r="12" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="200" cy="155" r="12" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="235" cy="155" r="12" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="270" cy="155" r="12" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="305" cy="155" r="12" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="340" cy="155" r="12" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="375" cy="155" r="12" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="60" cy="197" r="12" fill="#fff" stroke="#245574" stroke-width="2"/><circle cx="95" cy="197" r="12" fill="#fff" stroke="#245574" stroke-width="2"/><circle cx="130" cy="197" r="12" fill="#fff" stroke="#245574" stroke-width="2"/><circle cx="165" cy="197" r="12" fill="#fff" stroke="#245574" stroke-width="2"/><circle cx="200" cy="197" r="12" fill="#fff" stroke="#245574" stroke-width="2"/><circle cx="235" cy="197" r="12" fill="#fff" stroke="#245574" stroke-width="2"/><circle cx="270" cy="197" r="12" fill="#fff" stroke="#245574" stroke-width="2"/><circle cx="305" cy="197" r="12" fill="#fff" stroke="#245574" stroke-width="2"/><circle cx="340" cy="197" r="12" fill="#fff" stroke="#245574" stroke-width="2"/><circle cx="375" cy="197" r="12" fill="#fff" stroke="#245574" stroke-width="2"/><path d="M420 176 L530 176" stroke="#245574" stroke-width="2" fill="none"/><path d="M520 170 L530 176 L520 182" fill="none" stroke="#245574" stroke-width="2"/><circle cx="585" cy="177" r="17" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="643" cy="177" r="17" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="701" cy="177" r="17" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="759" cy="177" r="17" fill="#fff" stroke="#245574" stroke-width="2"/><text x="45" y="246" class="small" text-anchor="start">20 copies: 10 A + 10 a</text><text x="45" y="274" class="head" text-anchor="start">p(A) = 0.50</text><text x="560" y="246" class="small" text-anchor="start">4 sampled copies: 3 A + 1 a</text><text x="560" y="274" class="head" text-anchor="start">p(A) = 0.75</text><rect x="24" y="316" width="912" height="216" rx="10" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="42" y="352" class="head" text-anchor="start">2 · Migration: weight each source by its contribution</text><text x="45" y="389" class="" text-anchor="start">80% residents at p = 0.90</text><text x="480" y="389" class="" text-anchor="start">20% migrants at p = 0.30</text><rect x="45" y="409" width="310.5" height="36" rx="0" fill="#245574" stroke="#bdd0dc" stroke-width="2"/><rect x="355.5" y="409" width="34.49999999999999" height="36" rx="0" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><rect x="480" y="409" width="103.5" height="36" rx="0" fill="#245574" stroke="#bdd0dc" stroke-width="2"/><rect x="583.5" y="409" width="241.49999999999997" height="36" rx="0" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="45" y="489" class="head" text-anchor="start">p(new) = (0.80 × 0.90) + (0.20 × 0.30) = 0.78</text><rect x="24" y="552" width="912" height="210" rx="10" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="42" y="589" class="head" text-anchor="start">3 · Inbreeding alone: same p, more homozygotes</text><text x="45" y="643" class="" text-anchor="start">F = 0</text><rect x="225" y="619" width="162.5" height="40" rx="0" fill="#245574" stroke="#bdd0dc" stroke-width="2"/><text x="306.25" y="645" class="white" text-anchor="middle">AA 0.25</text><rect x="387.5" y="619" width="325.0" height="40" rx="0" fill="#bdd0dc" stroke="#bdd0dc" stroke-width="2"/><text x="550.0" y="645" class="small" text-anchor="middle">Aa 0.50</text><rect x="712.5" y="619" width="162.5" height="40" rx="0" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="793.75" y="645" class="small" text-anchor="middle">aa 0.25</text><text x="45" y="710" class="" text-anchor="start">F = 0.40</text><rect x="225" y="686" width="227.49999999999997" height="40" rx="0" fill="#245574" stroke="#bdd0dc" stroke-width="2"/><text x="338.75" y="712" class="white" text-anchor="middle">AA 0.35</text><rect x="452.5" y="686" width="195.0" height="40" rx="0" fill="#bdd0dc" stroke="#bdd0dc" stroke-width="2"/><text x="550.0" y="712" class="small" text-anchor="middle">Aa 0.30</text><rect x="647.5" y="686" width="227.49999999999997" height="40" rx="0" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="761.25" y="712" class="small" text-anchor="middle">aa 0.35</text><text x="32" y="795" class="small" text-anchor="start">In both inbreeding rows, p = f(AA) + ½f(Aa) = 0.50. F is identity by descent.</text></svg>