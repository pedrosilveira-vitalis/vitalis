<svg xmlns="http://www.w3.org/2000/svg" width="920" height="972" viewBox="0 0 920 972" role="img" aria-labelledby="t d"><title id="t">Five gates between an emergency and a helping hand</title><desc id="d">Top: Latané and Darley&#x27;s decision model as five gates in series. Help happens only if all five open; a failure at any one ends the sequence. The two gates the exam cares about are the second and the third, because they fail for different reasons and get confused with one another. At gate two the bystander does not know an emergency is happening, because everyone else looks calm — pluralistic ignorance. At gate three the bystander knows perfectly well and still does not move, because somebody else will — diffusion of responsibility. Bottom left: the numbers from the two studies that established the effect. Bottom right: what reopens the gates, and the aggression counterpart where the same situational logic runs the other way.</desc><defs><marker id="m8347" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="972" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Five gates between an emergency and a helping hand</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Each one can close on its own, and two of them close because other people are there</text><rect x="40" y="180" width="840" height="322" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">All five, in order</text><rect x="56" y="228" width="162" height="200" rx="9" fill="#efede8" stroke="#6d716f" stroke-width="1.8"/><text x="137.0" y="252.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:16px">1</text><text x="137.0" y="274.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10.5px">NOTICE IT</text><line x1="76" y1="308" x2="198" y2="308" stroke="#6d716f" stroke-width="1" stroke-dasharray="6 5"/><text x="137.0" y="328.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">attention; a crowded, hurried</text><text x="137.0" y="341.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">street can end it right here</text><rect x="64" y="368" width="146" height="46" rx="6" fill="none" stroke="#6d716f" stroke-width="1.5"/><text x="137.0" y="386.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:8.5px">distraction,</text><text x="137.0" y="399.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:8.5px">time pressure</text><rect x="226" y="228" width="162" height="200" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="307.0" y="252.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">2</text><text x="307.0" y="274.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10.5px">READ IT AS</text><text x="307.0" y="288.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10.5px">AN EMERGENCY</text><line x1="246" y1="308" x2="368" y2="308" stroke="#987740" stroke-width="1" stroke-dasharray="6 5"/><text x="307.0" y="328.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">everyone else looks calm, so</text><text x="307.0" y="341.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">it must be nothing</text><rect x="234" y="368" width="146" height="46" rx="6" fill="none" stroke="#987740" stroke-width="1.5"/><text x="307.0" y="386.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:8.5px">PLURALISTIC IGNORANCE</text><rect x="396" y="228" width="162" height="200" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="477.0" y="252.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">3</text><text x="477.0" y="274.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10.5px">FEEL</text><text x="477.0" y="288.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10.5px">RESPONSIBLE</text><line x1="416" y1="308" x2="538" y2="308" stroke="#a8324a" stroke-width="1" stroke-dasharray="6 5"/><text x="477.0" y="328.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">it is an emergency — and</text><text x="477.0" y="341.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">someone else will handle it</text><rect x="404" y="368" width="146" height="46" rx="6" fill="none" stroke="#a8324a" stroke-width="1.5"/><text x="477.0" y="386.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:8.5px">DIFFUSION</text><text x="477.0" y="399.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:8.5px">OF RESPONSIBILITY</text><rect x="566" y="228" width="162" height="200" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="647.0" y="252.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">4</text><text x="647.0" y="274.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10.5px">KNOW HOW</text><text x="647.0" y="288.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10.5px">TO HELP</text><line x1="586" y1="308" x2="708" y2="308" stroke="#245574" stroke-width="1" stroke-dasharray="6 5"/><text x="647.0" y="328.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">no competence, or fear of</text><text x="647.0" y="341.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">looking incompetent</text><rect x="574" y="368" width="146" height="46" rx="6" fill="none" stroke="#245574" stroke-width="1.5"/><text x="647.0" y="386.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:8.5px">audience inhibition</text><rect x="736" y="228" width="162" height="200" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="817.0" y="252.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">5</text><text x="817.0" y="274.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10.5px">ACTUALLY</text><text x="817.0" y="288.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10.5px">DO IT</text><line x1="756" y1="308" x2="878" y2="308" stroke="#5b7a64" stroke-width="1" stroke-dasharray="6 5"/><text x="817.0" y="328.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">decided to help, then hesitated</text><text x="817.0" y="341.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">under the watching eyes</text><rect x="744" y="368" width="146" height="46" rx="6" fill="none" stroke="#5b7a64" stroke-width="1.5"/><text x="817.0" y="386.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:8.5px">evaluation apprehension</text><line x1="222" y1="328" x2="232" y2="328" stroke="#6d716f" stroke-width="1.6" marker-end="url(#m8347)"/><line x1="392" y1="328" x2="402" y2="328" stroke="#6d716f" stroke-width="1.6" marker-end="url(#m8347)"/><line x1="562" y1="328" x2="572" y2="328" stroke="#6d716f" stroke-width="1.6" marker-end="url(#m8347)"/><line x1="732" y1="328" x2="742" y2="328" stroke="#6d716f" stroke-width="1.6" marker-end="url(#m8347)"/><text x="460.0" y="450.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11.5px">gate 2 fails because the bystander does not KNOW; gate 3 fails although they do</text><text x="460.0" y="472.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">both are caused by other people being present — that is why they get confused</text><rect x="40" y="518" width="410" height="436" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="245.0" y="546.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">The two founding studies</text><text x="245.0" y="572.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">SEIZURE OVER THE INTERCOM</text><text x="245.0" y="588.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">Darley and Latané, 1968 · helping by group size</text><text x="130.0" y="619.0" class="" text-anchor="end" style="fill:#18364a;font-size:9.5px">alone</text><rect x="140" y="604" width="221.0" height="22" rx="4" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="367.0" y="620.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:9.5px">85%  ·  52s</text><text x="130.0" y="649.0" class="" text-anchor="end" style="fill:#18364a;font-size:9.5px">one other</text><rect x="140" y="634" width="161.20000000000002" height="22" rx="4" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="307.2" y="650.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:9.5px">62%  ·  93s</text><text x="130.0" y="679.0" class="" text-anchor="end" style="fill:#18364a;font-size:9.5px">four others</text><rect x="140" y="664" width="80.60000000000001" height="22" rx="4" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="226.6" y="680.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:9.5px">31%  ·  166s</text><line x1="80" y1="702" x2="410" y2="702" stroke="#6d716f" stroke-width="1" stroke-dasharray="6 5"/><text x="245.0" y="724.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">THE SMOKE-FILLED ROOM</text><text x="245.0" y="740.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">Latané and Darley, 1968 · reporting the smoke</text><text x="190.0" y="771.0" class="" text-anchor="end" style="fill:#18364a;font-size:9.5px">alone</text><rect x="200" y="756" width="142.5" height="22" rx="4" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="348.5" y="772.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:10px">75%</text><text x="190.0" y="801.0" class="" text-anchor="end" style="fill:#18364a;font-size:9.5px">with two calm others</text><rect x="200" y="786" width="19.0" height="22" rx="4" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="225.0" y="802.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:10px">10%</text><rect x="64" y="826" width="362" height="110" rx="9" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="245.0" y="848.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">AND THEY DID CARE</text><text x="245.0" y="868.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9px">the bystanders who never helped were not</text><text x="245.0" y="884.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9px">indifferent — they were visibly agitated,</text><text x="245.0" y="900.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9px">asking whether the victim was all right.</text><text x="245.0" y="916.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">The block was responsibility, not empathy.</text><rect x="470" y="518" width="410" height="436" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="675.0" y="546.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">What reopens them</text><rect x="494" y="568" width="362" height="41" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="675.0" y="586.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">MAKE IT UNAMBIGUOUS</text><text x="675.0" y="601.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">shout what is wrong; gate 2 opens</text><rect x="494" y="616" width="362" height="54" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="675.0" y="634.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">NAME ONE PERSON</text><text x="675.0" y="649.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">“you, in the red jacket, call 911” —</text><text x="675.0" y="662.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">diffusion cannot survive being named</text><rect x="494" y="677" width="362" height="41" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="675.0" y="695.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">SMALLER GROUP</text><text x="675.0" y="710.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">fewer people, more felt responsibility</text><rect x="494" y="725" width="362" height="41" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="675.0" y="743.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">COMPETENCE</text><text x="675.0" y="758.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">training removes gate 4</text><line x1="510" y1="778" x2="840" y2="778" stroke="#6d716f" stroke-width="1" stroke-dasharray="6 5"/><text x="675.0" y="798.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">THE SAME LOGIC, RUN THE OTHER WAY</text><rect x="494" y="812" width="362" height="30" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.4"/><text x="510.0" y="831.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:9px">FRUSTRATION</text><text x="840.0" y="831.0" class="" text-anchor="end" style="fill:#6d716f;font-size:8.5px">makes aggression possible, not certain</text><rect x="494" y="846" width="362" height="30" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.4"/><text x="510.0" y="865.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:9px">AGGRESSIVE CUES</text><text x="840.0" y="865.0" class="" text-anchor="end" style="fill:#6d716f;font-size:8.5px">a weapon in the room raises the odds</text><rect x="494" y="880" width="362" height="30" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.4"/><text x="510.0" y="899.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:9px">MODELS</text><text x="840.0" y="899.0" class="" text-anchor="end" style="fill:#6d716f;font-size:8.5px">Bobo doll — watched, learned, repeated</text><rect x="494" y="914" width="362" height="30" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.4"/><text x="510.0" y="933.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:9px">REWARD OR PUNISHMENT</text><text x="840.0" y="933.0" class="" text-anchor="end" style="fill:#6d716f;font-size:8.5px">changes PERFORMANCE, not LEARNING</text></svg>