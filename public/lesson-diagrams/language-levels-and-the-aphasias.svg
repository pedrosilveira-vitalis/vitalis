<svg xmlns="http://www.w3.org/2000/svg" width="920" height="916" viewBox="0 0 920 916" role="img" aria-labelledby="t d"><title id="t">Five levels of language, and what breaks at each one</title><desc id="d">Top: the hierarchy, from sounds that carry no meaning up to the social use of an utterance, each level with the disorder that singles it out. Bottom left: the classical language areas on the left hemisphere and the tract between them. Bottom right: the three questions that sort the aphasias. Is speech fluent? No points to Broca&#x27;s area in the inferior frontal gyrus. Is comprehension intact? No points to Wernicke&#x27;s area in the posterior superior temporal gyrus. If both are fine but repetition fails, the lesion is in the arcuate fasciculus between them. The angular gyrus sits apart: damage there gives alexia together with agraphia, alongside the rest of Gerstmann&#x27;s syndrome, while alexia with writing preserved comes from a left occipital and splenial lesion instead.</desc><defs><marker id="m1960" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="916" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Five levels of language, and what breaks at each one</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">The aphasias are a map: fluency, comprehension, repetition — in that order</text><rect x="40" y="164" width="840" height="270" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="192.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">From sound to social meaning</text><rect x="70" y="214" width="176" height="38" rx="7" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="158.0" y="238.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">PRAGMATICS</text><text x="266.0" y="231.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">context and speaker intent</text><text x="266.0" y="247.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">&quot;Can you pass the salt?&quot; is a request</text><text x="600.0" y="239.0" class="" text-anchor="start" style="fill:#987740;font-size:11px">autism spectrum: this level alone</text><rect x="70" y="256" width="176" height="38" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="158.0" y="280.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">SEMANTICS</text><text x="266.0" y="273.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">meaning of words and sentences</text><text x="266.0" y="289.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">compositional, so infinitely productive</text><text x="600.0" y="281.0" class="" text-anchor="start" style="fill:#a8324a;font-size:11px">semantic dementia; Wernicke&#x27;s aphasia</text><rect x="70" y="298" width="176" height="38" rx="7" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="158.0" y="322.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">SYNTAX</text><text x="266.0" y="315.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">how words combine</text><text x="266.0" y="331.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">surface structure vs deep structure</text><text x="600.0" y="323.0" class="" text-anchor="start" style="fill:#5b7a64;font-size:11px">agrammatism in Broca&#x27;s aphasia</text><rect x="70" y="340" width="176" height="38" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="158.0" y="364.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">MORPHOLOGY</text><text x="266.0" y="357.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">smallest units of meaning</text><text x="266.0" y="373.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">un + break + able = three morphemes</text><text x="600.0" y="365.0" class="" text-anchor="start" style="fill:#245574;font-size:11px">specific language impairment</text><rect x="70" y="382" width="176" height="38" rx="7" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="158.0" y="406.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:12px">PHONOLOGY</text><text x="266.0" y="399.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">smallest units of sound</text><text x="266.0" y="415.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">~44 phonemes; no meaning on their own</text><text x="600.0" y="407.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">dyslexia is a phonological deficit</text><line x1="58" y1="418" x2="58" y2="222" stroke="#6d716f" stroke-width="2" marker-end="url(#m1960)"/><rect x="40" y="450" width="404" height="440" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="242.0" y="478.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">Left hemisphere, lateral view</text><rect x="82" y="498" width="320" height="172" rx="78" fill="#efe9df" stroke="#6d716f" stroke-width="2.4"/><path d="M118 608 q86 -34 162 -4" stroke="#6d716f" stroke-width="1.6" fill="none" stroke-dasharray="8 6"/><text x="242.0" y="690.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">frontal at left · occipital at right</text><circle cx="158" cy="552" r="24" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="158.0" y="557.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">B</text><circle cx="278" cy="602" r="24" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="278.0" y="607.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">W</text><path d="M177 566 q52 8 82 28" stroke="#987740" stroke-width="3" fill="none"/><circle cx="358" cy="566" r="19" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="358.0" y="571.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">A</text><text x="242.0" y="716.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">B  Broca&#x27;s area — inferior frontal gyrus</text><text x="242.0" y="734.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">speech output and grammar</text><text x="242.0" y="760.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">W  Wernicke&#x27;s area — posterior superior</text><text x="242.0" y="778.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">temporal gyrus; comprehension</text><text x="242.0" y="804.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">—  arcuate fasciculus between them</text><text x="242.0" y="822.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">carries repetition</text><text x="242.0" y="850.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">A  angular gyrus — reading and writing;</text><text x="242.0" y="868.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">damage gives alexia WITH agraphia</text><rect x="460" y="450" width="420" height="440" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="670.0" y="478.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">Three questions, in order</text><rect x="488" y="500" width="364" height="102" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="670.0" y="526.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">Is speech fluent?</text><text x="670.0" y="550.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">no → BROCA&#x27;S</text><text x="670.0" y="572.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">effortful, telegraphic;</text><text x="670.0" y="588.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">comprehension intact; aware of it</text><line x1="670" y1="602" x2="670" y2="616" stroke="#6d716f" stroke-width="1.8" marker-end="url(#m1960)"/><rect x="488" y="618" width="364" height="102" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="670.0" y="644.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">Is comprehension intact?</text><text x="670.0" y="668.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">no → WERNICKE&#x27;S</text><text x="670.0" y="690.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">fluent word salad;</text><text x="670.0" y="706.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">no insight into the deficit</text><line x1="670" y1="720" x2="670" y2="734" stroke="#6d716f" stroke-width="1.8" marker-end="url(#m1960)"/><rect x="488" y="736" width="364" height="102" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="670.0" y="762.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">Is repetition intact?</text><text x="670.0" y="786.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">no → CONDUCTION</text><text x="670.0" y="808.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">fluent and understands,</text><text x="670.0" y="824.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">but cannot repeat back</text><text x="670.0" y="872.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">all three impaired → global aphasia</text></svg>