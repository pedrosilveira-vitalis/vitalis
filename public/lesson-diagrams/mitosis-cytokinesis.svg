<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc"><title id="title">Mitosis and cytokinesis</title><desc id="desc">Three schematic animal cells distinguish chromosome separation from actomyosin constriction. Poleward flux adds tubulin at the plus end and removes it near the minus end.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#245574"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#18364a;font-size:18px}.h{font-size:25px;font-weight:700}.small{font-size:15px}.label{font-size:20px;font-weight:700}</style><rect width="900" height="760" rx="20" fill="#fbf7ef"/><text x="32" y="43" class="h" text-anchor="start">Separate chromosomes, then divide the cell</text><text x="150" y="91" class="label" text-anchor="middle">1  Biorientation</text><ellipse cx="150" cy="220" rx="127" ry="100" fill="white" stroke="#245574" stroke-width="2"/><circle cx="50" cy="220" r="6" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="250" cy="220" r="6" fill="#245574" stroke="#245574" stroke-width="2"/><text x="450" y="91" class="label" text-anchor="middle">2  Anaphase</text><ellipse cx="450" cy="220" rx="127" ry="100" fill="white" stroke="#245574" stroke-width="2"/><circle cx="350" cy="220" r="6" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="550" cy="220" r="6" fill="#245574" stroke="#245574" stroke-width="2"/><text x="750" y="91" class="label" text-anchor="middle">3  Cytokinesis</text><ellipse cx="750" cy="220" rx="127" ry="100" fill="white" stroke="#245574" stroke-width="2"/><path d="M50 220 L142 185 M250 220 L158 185" stroke="#245574" stroke-width="2" fill="none"/><path d="M140 170 L160 200 M160 170 L140 200" stroke="#245574" stroke-width="5" fill="none"/><path d="M50 220 L142 245 M250 220 L158 245" stroke="#245574" stroke-width="2" fill="none"/><path d="M140 230 L160 260 M160 230 L140 260" stroke="#245574" stroke-width="5" fill="none"/><path d="M402 170 L390 185 L402 200" stroke="#245574" stroke-width="5" fill="none"/><path d="M390 185 L350 220" stroke="#245574" stroke-width="2" fill="none"/><path d="M402 230 L390 245 L402 260" stroke="#245574" stroke-width="5" fill="none"/><path d="M390 245 L350 220" stroke="#245574" stroke-width="2" fill="none"/><path d="M498 170 L510 185 L498 200" stroke="#245574" stroke-width="5" fill="none"/><path d="M510 185 L550 220" stroke="#245574" stroke-width="2" fill="none"/><path d="M498 230 L510 245 L498 260" stroke="#245574" stroke-width="5" fill="none"/><path d="M510 245 L550 220" stroke="#245574" stroke-width="2" fill="none"/><path d="M425 215 H405" stroke="#245574" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M475 215 H495" stroke="#245574" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M750 120 Q713 167 740 198 M750 320 Q713 273 740 242" stroke="#245574" stroke-width="4" fill="none"/><ellipse cx="740" cy="220" rx="10" ry="23" fill="none" stroke="#245574" stroke-width="5"/><circle cx="690" cy="220" r="25" fill="#dce9f0" stroke="#245574" stroke-width="2"/><circle cx="810" cy="220" r="25" fill="#dce9f0" stroke="#245574" stroke-width="2"/><text x="690" y="226" class="small" text-anchor="middle">DNA</text><text x="810" y="226" class="small" text-anchor="middle">DNA</text><text x="150" y="352" class="small" text-anchor="middle">Sisters connect to</text><text x="150" y="374" class="small" text-anchor="middle">opposite spindle poles.</text><text x="450" y="352" class="small" text-anchor="middle">Cohesin cleavage permits</text><text x="450" y="374" class="small" text-anchor="middle">sister separation.</text><text x="750" y="352" class="small" text-anchor="middle">Actin + myosin II</text><text x="750" y="374" class="small" text-anchor="middle">constrict the cell equator.</text><path d="M32 412 H868" stroke="#245574" stroke-width="1" fill="none"/><text x="32" y="453" class="h" text-anchor="start">Poleward flux: do not reverse the microtubule ends</text><text x="130" y="502" class="label" text-anchor="middle">Spindle pole</text><text x="720" y="502" class="label" text-anchor="middle">Kinetochore</text><rect x="200" y="538" width="24" height="24" rx="4" fill="#bdd0dc" stroke="#245574"/><rect x="228" y="538" width="24" height="24" rx="4" fill="#bdd0dc" stroke="#245574"/><rect x="256" y="538" width="24" height="24" rx="4" fill="#bdd0dc" stroke="#245574"/><rect x="284" y="538" width="24" height="24" rx="4" fill="#bdd0dc" stroke="#245574"/><rect x="312" y="538" width="24" height="24" rx="4" fill="#bdd0dc" stroke="#245574"/><rect x="340" y="538" width="24" height="24" rx="4" fill="#bdd0dc" stroke="#245574"/><rect x="368" y="538" width="24" height="24" rx="4" fill="#bdd0dc" stroke="#245574"/><rect x="396" y="538" width="24" height="24" rx="4" fill="#bdd0dc" stroke="#245574"/><rect x="424" y="538" width="24" height="24" rx="4" fill="#bdd0dc" stroke="#245574"/><rect x="452" y="538" width="24" height="24" rx="4" fill="#bdd0dc" stroke="#245574"/><rect x="480" y="538" width="24" height="24" rx="4" fill="#bdd0dc" stroke="#245574"/><rect x="508" y="538" width="24" height="24" rx="4" fill="#bdd0dc" stroke="#245574"/><rect x="536" y="538" width="24" height="24" rx="4" fill="#bdd0dc" stroke="#245574"/><rect x="564" y="538" width="24" height="24" rx="4" fill="#bdd0dc" stroke="#245574"/><rect x="592" y="538" width="24" height="24" rx="4" fill="#bdd0dc" stroke="#245574"/><rect x="620" y="538" width="24" height="24" rx="4" fill="#bdd0dc" stroke="#245574"/><rect x="648" y="538" width="24" height="24" rx="4" fill="#bdd0dc" stroke="#245574"/><text x="175" y="556" class="label" text-anchor="middle">−</text><text x="720" y="556" class="label" text-anchor="middle">+</text><path d="M610 607 H280" stroke="#245574" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="445" y="639" class="" text-anchor="middle">Lattice moves toward the pole</text><text x="175" y="684" class="small" text-anchor="middle">Tubulin loss</text><text x="720" y="684" class="small" text-anchor="middle">Tubulin addition</text><text x="32" y="727" class="small" text-anchor="start">Schematic for typical flux; spindle forces and their relative contributions vary by cell type.</text></svg>