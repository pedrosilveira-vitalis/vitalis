<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">Peptide bonds: follow the backbone</title><desc id="desc">Four residues have three peptide links. Formal condensation differs from ribosomal transfer. The amide is planar, while phi and psi describe neighboring backbone bonds.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#245574;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">Follow the peptide backbone</text><rect x="24" y="60" width="752" height="190" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="92" class="h" text-anchor="start">1  Count residues and links</text><rect x="65" y="126" width="80" height="45" rx="12" fill="#e4eef1"/><text x="105" y="154" class="t" text-anchor="middle">Ala</text><path d="M145 148 L255 148" class="bond" /><text x="200" y="133" class="s" text-anchor="middle">1</text><rect x="255" y="126" width="80" height="45" rx="12" fill="#e4eef1"/><text x="295" y="154" class="t" text-anchor="middle">Gly</text><path d="M335 148 L445 148" class="bond" /><text x="390" y="133" class="s" text-anchor="middle">2</text><rect x="445" y="126" width="80" height="45" rx="12" fill="#e4eef1"/><text x="485" y="154" class="t" text-anchor="middle">Ser</text><path d="M525 148 L635 148" class="bond" /><text x="580" y="133" class="s" text-anchor="middle">3</text><rect x="635" y="126" width="80" height="45" rx="12" fill="#e4eef1"/><text x="675" y="154" class="t" text-anchor="middle">Val</text><text x="50" y="201" class="t" text-anchor="start">N-terminus → 4 residues, 3 backbone peptide bonds → C-terminus</text><text x="50" y="229" class="s" text-anchor="start">Linear, unmodified peptide mass = sum of free amino acids − 3 × H₂O</text><rect x="24" y="266" width="752" height="175" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="299" class="h" text-anchor="start">2  Formal balance ≠ cellular mechanism</text><text x="50" y="337" class="t" text-anchor="start">Free amino acids → peptide + water  (formal condensation)</text><text x="50" y="372" class="t" text-anchor="start">On the ribosome: peptidyl-tRNA + aminoacyl-tRNA</text><text x="70" y="400" class="t" text-anchor="start">→ longer peptidyl-tRNA + deacylated tRNA</text><text x="50" y="425" class="s" text-anchor="start">Activated tRNA supplies the chemistry; this step does not release water.</text><rect x="24" y="457" width="752" height="259" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="491" class="h" text-anchor="start">3  The peptide C–N bond has restricted rotation</text><text x="115" y="575" class="t" text-anchor="start">Cα</text><text x="265" y="575" class="t" text-anchor="start">C</text><text x="430" y="575" class="t" text-anchor="start">N</text><text x="593" y="575" class="t" text-anchor="start">Cα</text><path d="M146 568 L250 568" class="bond" /><path d="M286 568 L418 568" class="bond" /><path d="M451 568 L580 568" class="bond" /><path d="M270 551 L270 527" class="bond" /><path d="M279 551 L279 527" class="bond" /><text x="267" y="519" class="t" text-anchor="start">O</text><path d="M440 582 L440 610" class="bond" /><text x="434" y="631" class="t" text-anchor="start">H</text><rect x="243" y="502" width="221" height="140" rx="12" fill="none" stroke="#245574" stroke-width="2" stroke-dasharray="5 4"/><text x="330" y="554" class="s" text-anchor="start">ω</text><text x="505" y="552" class="s" text-anchor="start">φ</text><text x="188" y="552" class="s" text-anchor="start">ψ</text><text x="50" y="674" class="s" text-anchor="start">Amide resonance favors planarity. Neighboring φ and ψ angles vary.</text><text x="50" y="697" class="s" text-anchor="start">Schematic, not to scale. An internal proline nitrogen has no N–H donor.</text></svg>