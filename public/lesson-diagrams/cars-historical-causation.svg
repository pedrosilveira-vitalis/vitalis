<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="688" viewBox="0 0 1040 688" role="img" aria-labelledby="t d"><title id="t">Where the thesis hides, and what kind of cause is being claimed</title><desc id="d">On the left, the five-step template of a historiographical passage, read downwards. Step one, the prevailing view: historians have long argued, the traditional view holds, it has been widely assumed. This is not the author. Step two, the problem with it: a gap, a flaw, an overemphasis, evidence it cannot account for. Still not the author&#x27;s own claim. Step three, the revisionary claim, which is the thesis and is marked as the one to find. Step four, evidence and reasoning: primary sources, comparative cases, quantitative data. Step five, limitations and counterarguments, which are not always present. A warning beneath notes that the commonest error on these passages is stopping after paragraph one and taking the prevailing view for the author&#x27;s; a main idea answer that describes step one rather than step three is the trap written for exactly that mistake. On the right, five kinds of cause, each with the worked example of a medieval trade network that declined a decade before the Black Death arrived. Proximate, the immediate trigger: the plague&#x27;s arrival, which the author argues came too late to explain the onset. Distal or underlying, the deeper conditions: the political consolidation of rival powers. Necessary, without which the event could not have happened: the author denies this of the plague, since the decline had already begun. Sufficient, enough on its own: historians rarely claim it, because historical causation is almost always multi-factorial. Contributory, raising the probability or severity without being necessary or sufficient: the plague, on the author&#x27;s account, deepening a decline already under way. A footer gives the question to ask of every causal sentence: which of these five is being claimed, and does the evidence offered actually establish that one rather than a weaker one?</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1040" height="688" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Where the thesis hides, and what kind of cause is being claimed</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">In a historiographical passage the author&#x27;s own position arrives third — after two paragraphs of someone else&#x27;s.</text><rect x="24" y="108" width="476" height="64" rx="9" fill="#efede8" stroke="#6d716f" stroke-width="1.5"/><text x="46.0" y="134.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:700;font-size:15px">1</text><text x="72.0" y="134.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">THE PREVAILING VIEW</text><text x="286.0" y="154.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">“historians have long argued” · “the traditional view</text><text x="286.0" y="167.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">holds” — not the author</text><rect x="24" y="182" width="476" height="64" rx="9" fill="#efede8" stroke="#6d716f" stroke-width="1.5"/><text x="46.0" y="208.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:700;font-size:15px">2</text><text x="72.0" y="208.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">THE PROBLEM WITH IT</text><text x="286.0" y="228.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">a gap, a flaw, an overemphasis, evidence it cannot</text><text x="286.0" y="241.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">account for</text><rect x="24" y="256" width="476" height="64" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="46.0" y="282.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:700;font-size:15px">3</text><text x="72.0" y="282.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:700;font-size:12.5px">THE REVISIONARY CLAIM</text><text x="286.0" y="302.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">← this is the thesis</text><rect x="24" y="330" width="476" height="64" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="46.0" y="356.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:15px">4</text><text x="72.0" y="356.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">EVIDENCE AND REASONING</text><text x="286.0" y="376.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">primary sources · comparative cases · quantitative</text><text x="286.0" y="389.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">data</text><rect x="24" y="404" width="476" height="64" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="46.0" y="430.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:15px">5</text><text x="72.0" y="430.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">LIMITS AND COUNTERARGUMENTS</text><text x="286.0" y="450.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">not always present</text><rect x="24" y="486" width="476" height="92" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="262.0" y="516.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:13px">The error this template exists to prevent</text><text x="262.0" y="537.0" class="" text-anchor="middle" style="font-size:12px">Stopping after paragraph 1 and taking step 1 for the author&#x27;s</text><text x="262.0" y="554.0" class="" text-anchor="middle" style="font-size:12px">own view. A main idea answer that describes the prevailing</text><text x="262.0" y="571.0" class="" text-anchor="middle" style="font-size:12px">view is the trap written for exactly that mistake.</text><text x="772.0" y="100.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">FIVE KINDS OF CAUSE</text><text x="772.0" y="118.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">worked on one case: a trade network that declined a decade before the Black Death</text><rect x="524" y="130" width="492" height="76" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="548.0" y="154.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:700;font-size:12.5px">PROXIMATE</text><text x="700.0" y="154.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">the immediate trigger</text><text x="770.0" y="176.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">the plague&#x27;s arrival — too late, the author argues, to explain</text><text x="770.0" y="189.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">the onset</text><rect x="524" y="214" width="492" height="76" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="548.0" y="238.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:700;font-size:12.5px">DISTAL / UNDERLYING</text><text x="700.0" y="238.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">the deeper conditions</text><text x="770.0" y="260.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">the political consolidation of rival powers, and the route shift</text><text x="770.0" y="273.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">it forced</text><rect x="524" y="298" width="492" height="76" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="548.0" y="322.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:700;font-size:12.5px">NECESSARY</text><text x="700.0" y="322.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">without it, no event</text><text x="770.0" y="344.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">denied of the plague here: the decline had already begun</text><rect x="524" y="382" width="492" height="76" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="548.0" y="406.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:700;font-size:12.5px">SUFFICIENT</text><text x="700.0" y="406.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">enough on its own</text><text x="770.0" y="428.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">rarely claimed — historical causation is almost always</text><text x="770.0" y="441.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">multi-factorial</text><rect x="524" y="466" width="492" height="76" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="548.0" y="490.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:700;font-size:12.5px">CONTRIBUTORY</text><text x="700.0" y="490.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">raises probability or severity</text><text x="770.0" y="512.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">the plague, on this account: it deepened a decline already under</text><text x="770.0" y="525.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">way</text><rect x="524" y="556" width="492" height="108" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="770.0" y="586.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">Ask it of every causal sentence</text><text x="770.0" y="607.0" class="" text-anchor="middle" style="font-size:12px">Which of these five is being claimed — and does the evidence</text><text x="770.0" y="624.0" class="" text-anchor="middle" style="font-size:12px">offered establish that one, rather than a weaker one? Authors</text><text x="770.0" y="641.0" class="" text-anchor="middle" style="font-size:12px">and answer choices both slide from contributory to necessary</text><text x="770.0" y="658.0" class="" text-anchor="middle" style="font-size:12px">when no one is watching.</text></svg>