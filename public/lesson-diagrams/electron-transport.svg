<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">Respiratory chain proton accounting per electron pair</title><desc id="desc">NADH feeds Complex I, succinate feeds Complex II, both reduce Q. Q feeds III, cytochrome c feeds IV, oxygen is reduced to water. Proton equivalents per electron pair are 4 at I, 0 at II, 4 at III and 2 at IV. The totals are 10 from NADH and 6 from succinate. The gradient powers ATP synthesis on return to the matrix.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#aa3653;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">ETC: count per electron pair, not per O₂</text><rect x="24" y="60" width="752" height="330" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="94" class="h" text-anchor="start">1  Follow the electron routes</text><text x="60" y="134" class="t" text-anchor="start">NADH</text><rect x="55" y="150" width="100" height="44" rx="9" fill="#e4eef1"/><text x="105.0" y="178" class="t" text-anchor="middle">I</text><rect x="55" y="280" width="100" height="44" rx="9" fill="#e4eef1"/><text x="105.0" y="308" class="t" text-anchor="middle">II</text><text x="58" y="267" class="s" text-anchor="start">Succinate</text><rect x="235" y="150" width="80" height="44" rx="9" fill="#e4eef1"/><text x="275.0" y="178" class="t" text-anchor="middle">Q</text><rect x="395" y="150" width="85" height="44" rx="9" fill="#e4eef1"/><text x="437.5" y="178" class="t" text-anchor="middle">III</text><rect x="570" y="150" width="85" height="44" rx="9" fill="#e4eef1"/><text x="612.5" y="178" class="t" text-anchor="middle">IV</text><text x="683" y="177" class="t" text-anchor="start">O₂</text><path d="M160 172 L229 172" class="bond" /><path d="M221 167 L229 172 L221 177" class="bond"/><path d="M320 172 L389 172" class="bond" /><path d="M381 167 L389 172 L381 177" class="bond"/><path d="M485 172 L564 172" class="bond" /><path d="M556 167 L564 172 L556 177" class="bond"/><path d="M660 172 L680 172" class="bond" /><path d="M672 167 L680 172 L672 177" class="bond"/><text x="524" y="145" class="s" text-anchor="middle">cyt c</text><path d="M160 302 L275 302" class="bond" /><path d="M275 302 L275 202" class="bond" /><path d="M270 210 L275 202 L280 210" class="bond"/><text x="105" y="226" class="t" text-anchor="middle">4 H⁺</text><text x="438" y="226" class="t" text-anchor="middle">4 H⁺</text><text x="613" y="226" class="t" text-anchor="middle">2 H⁺</text><text x="105" y="349" class="t" text-anchor="middle">0 H⁺</text><text x="400" y="352" class="s" text-anchor="start">Counts refer to proton translocation.</text><rect x="24" y="406" width="752" height="132" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="440" class="h" text-anchor="start">2  Add the contributions on each route</text><text x="55" y="477" class="t" text-anchor="start">NADH: 4 + 4 + 2 = 10 H⁺ equivalents</text><text x="55" y="512" class="t" text-anchor="start">Succinate: 0 + 4 + 2 = 6 H⁺ equivalents</text><rect x="24" y="554" width="752" height="162" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="588" class="h" text-anchor="start">3  The gradient powers ATP synthase</text><text x="55" y="622" class="t" text-anchor="start">H⁺ returns: intermembrane space → matrix</text><text x="55" y="654" class="s" text-anchor="start">Conventional approximate accounting:</text><text x="55" y="687" class="t" text-anchor="start">10 ÷ 4 ≈ 2.5 ATP</text><text x="420" y="687" class="t" text-anchor="start">6 ÷ 4 ≈ 1.5 ATP</text></svg>