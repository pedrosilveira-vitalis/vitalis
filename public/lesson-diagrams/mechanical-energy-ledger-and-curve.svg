<svg xmlns="http://www.w3.org/2000/svg" width="920" height="820" viewBox="0 0 920 820" role="img" aria-labelledby="t d"><title id="t">Mechanical energy: what stays constant, and what leaks</title><desc id="d">Left: stacked energy bars at three points of a track. Without friction the kinetic plus potential total is the same at every point; with friction the mechanical total shrinks and the missing part appears as heat. Right: a potential energy curve with a total energy line, showing turning points where the curve meets the line, a stable minimum, an unstable maximum, and the kinetic energy as the gap between the line and the curve. Bottom: springs in parallel add while springs in series add reciprocally, with the combination rules matching capacitors rather than resistors.</desc><defs><marker id="m4708" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="820" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Mechanical energy: what stays constant, and what leaks</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Only conservative forces keep KE + U fixed; friction moves part of it out of the ledger</text><rect x="40" y="112" width="430" height="388" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="255.0" y="142.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">The same energy, re-labelled</text><text x="255.0" y="168.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">no friction:  KE + U is the same at every point</text><rect x="86" y="190" width="74" height="110" rx="4" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="123.0" y="250.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">U</text><rect x="206" y="245" width="74" height="55" rx="4" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="243.0" y="277.5" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">KE</text><rect x="206" y="190" width="74" height="55" rx="4" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="243.0" y="222.5" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">U</text><rect x="326" y="190" width="74" height="110" rx="4" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="363.0" y="250.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">KE</text><line x1="70" y1="300" x2="420" y2="300" stroke="#18364a" stroke-width="2"/><text x="123.0" y="320.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">top</text><text x="243.0" y="320.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">middle</text><text x="363.0" y="320.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">bottom</text><line x1="70" y1="190" x2="420" y2="190" stroke="#5b7a64" stroke-width="2" stroke-dasharray="6 5"/><text x="424.0" y="186.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:14px">E</text><text x="255.0" y="350.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">with friction:  KE + U falls, the rest is heat</text><rect x="86" y="360" width="74" height="110" rx="4" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="123.0" y="420.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">U</text><rect x="206" y="424" width="74" height="46" rx="4" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="243.0" y="452.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">KE</text><rect x="206" y="374" width="74" height="50" rx="4" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="243.0" y="404.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">U</text><rect x="206" y="360" width="74" height="14" rx="4" fill="#efede8" stroke="#6d716f" stroke-width="1.5"/><text x="243.0" y="371.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">heat</text><rect x="326" y="388" width="74" height="82" rx="4" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="363.0" y="434.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">KE</text><rect x="326" y="360" width="74" height="28" rx="4" fill="#efede8" stroke="#6d716f" stroke-width="1.5"/><text x="363.0" y="378.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">heat</text><line x1="70" y1="470" x2="420" y2="470" stroke="#18364a" stroke-width="2"/><text x="123.0" y="490.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">top</text><text x="243.0" y="490.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">middle</text><text x="363.0" y="490.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">bottom</text><line x1="70" y1="360" x2="420" y2="360" stroke="#5b7a64" stroke-width="2" stroke-dasharray="6 5"/><text x="424.0" y="356.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:14px">E</text><rect x="486" y="112" width="394" height="388" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="683.0" y="142.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:17px">Reading a U(x) curve</text><line x1="546" y1="370" x2="840" y2="370" stroke="#18364a" stroke-width="2"/><line x1="546" y1="180" x2="546" y2="370" stroke="#18364a" stroke-width="2"/><text x="693.0" y="414.0" class="" text-anchor="middle" style="font-size:17px">position x</text><text x="502" y="275.0" text-anchor="middle" transform="rotate(-90 502 275.0)" style="font-size:17px">U(x)</text><path d="M546.0 330.1 L548.9 329.6 L551.9 328.9 L554.8 327.8 L557.8 326.5 L560.7 324.8 L563.6 322.9 L566.6 320.6 L569.5 318.2 L572.5 315.4 L575.4 312.4 L578.3 309.2 L581.3 305.8 L584.2 302.2 L587.2 298.4 L590.1 294.4 L593.0 290.3 L596.0 286.1 L598.9 281.7 L601.9 277.3 L604.8 272.8 L607.7 268.3 L610.7 263.7 L613.6 259.2 L616.6 254.7 L619.5 250.2 L622.4 245.8 L625.4 241.5 L628.3 237.3 L631.3 233.3 L634.2 229.3 L637.1 225.6 L640.1 222.1 L643.0 218.7 L646.0 215.6 L648.9 212.7 L651.8 210.0 L654.8 207.6 L657.7 205.5 L660.7 203.7 L663.6 202.1 L666.5 200.9 L669.5 199.9 L672.4 199.3 L675.4 198.9 L678.3 198.9 L681.2 199.2 L684.2 199.7 L687.1 200.6 L690.1 201.7 L693.0 203.2 L695.9 204.9 L698.9 206.9 L701.8 209.1 L704.8 211.5 L707.7 214.2 L710.6 217.1 L713.6 220.2 L716.5 223.5 L719.5 226.9 L722.4 230.4 L725.3 234.1 L728.3 237.9 L731.2 241.7 L734.2 245.6 L737.1 249.5 L740.0 253.5 L743.0 257.4 L745.9 261.3 L748.9 265.1 L751.8 268.9 L754.7 272.5 L757.7 276.1 L760.6 279.5 L763.6 282.7 L766.5 285.8 L769.4 288.7 L772.4 291.3 L775.3 293.8 L778.3 296.0 L781.2 297.9 L784.1 299.6 L787.1 301.0 L790.0 302.1 L793.0 302.9 L795.9 303.5 L798.8 303.7 L801.8 303.6 L804.7 303.3 L807.7 302.6 L810.6 301.6 L813.5 300.3 L816.5 298.7 L819.4 296.9 L822.4 294.7 L825.3 292.3 L828.2 289.6 L831.2 286.7 L834.1 283.6 L837.1 280.2 L840.0 276.6" stroke="#987740" stroke-width="3" fill="none"/><line x1="546.0" y1="229.4" x2="840.0" y2="229.4" stroke="#5b7a64" stroke-width="2" stroke-dasharray="6 5"/><text x="846.0" y="234.4" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:15px">E</text><circle cx="801.78" cy="303.6411604939454" r="5" fill="#5b7a64" stroke="#5b7a64" stroke-width="2"/><text x="801.8" y="327.6" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">stable</text><circle cx="673.89" cy="199.07870993885462" r="5" fill="#a8324a" stroke="#a8324a" stroke-width="2"/><text x="669.9" y="185.1" class="" text-anchor="end" style="fill:#a8324a;font-weight:bold;font-size:13px">unstable</text><line x1="763.56" y1="282.7162455218988" x2="763.56" y2="229.4" stroke="#245574" stroke-width="2.5" marker-end="url(#m4708)"/><text x="771.6" y="261.1" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:14px">KE</text><text x="683.0" y="444.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">KE = E − U(x);  U = E is a turning point</text><text x="683.0" y="468.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">slope zero ⇒ F = 0:  a dip is stable, a crest is not</text><text x="683.0" y="492.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">the object can never reach x where U &gt; E</text><rect x="40" y="520" width="430" height="136" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="255.0" y="548.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">Combining springs</text><text x="255.0" y="578.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">parallel (side by side):  k_eff = k₁ + k₂</text><text x="255.0" y="602.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">series (end to end):  1/k_eff = 1/k₁ + 1/k₂</text><text x="255.0" y="632.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">same pattern as capacitors — the reverse of resistors</text><rect x="486" y="520" width="394" height="136" rx="10" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="683.0" y="548.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">The two equations</text><text x="683.0" y="578.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">conservative only:  KEᵢ + Uᵢ = KEᶠ + Uᶠ</text><text x="683.0" y="602.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">otherwise:  W_nc = ΔKE + ΔU = ΔE_mech</text><text x="683.0" y="632.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">friction makes W_nc negative: −μₖNd</text><text x="460.0" y="700.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">U_g = mgh (near Earth)   •   U_g = −GMm/r (far)   •   U_e = ½kx²</text><text x="460.0" y="730.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">The h = 0 line is yours to choose — only ΔU is physical</text><text x="460.0" y="760.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">A conservative force does zero net work around any closed loop</text><text x="460.0" y="790.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Potential energy exists only for conservative forces</text></svg>