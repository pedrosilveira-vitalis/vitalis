<svg xmlns="http://www.w3.org/2000/svg" width="920" height="800" viewBox="0 0 920 800" role="img" aria-labelledby="t d"><title id="t">Where the object sits decides what the image is</title><desc id="d">Top: five object positions for a converging lens or concave mirror — beyond 2f, at 2f, between f and 2f, at f and inside f — each with the image it produces, from real inverted and diminished through to virtual upright and magnified. Bottom left: the single rule for diverging lenses and convex mirrors, always virtual, upright and diminished. Bottom right: the two corrective-lens calculations, a myopic far point giving a negative dioptre power and a hyperopic near point giving a positive one.</desc><defs><marker id="m5898" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker><marker id="m7850" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="800" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Where the object sits decides what the image is</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">One equation, 1/f = 1/dₒ + 1/dᵢ, and one sign rule cover every lens and mirror</text><rect x="40" y="112" width="840" height="290" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="142.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">Converging lens or concave mirror</text><rect x="62" y="172" width="156" height="150" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="140.0" y="198.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">object</text><text x="140.0" y="220.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">beyond 2f</text><line x1="86" y1="236" x2="194" y2="236" stroke="#5b7a64" stroke-width="1.5" stroke-dasharray="6 5"/><text x="140.0" y="258.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">between f and 2f</text><text x="140.0" y="282.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">real • inverted</text><text x="140.0" y="304.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">diminished</text><rect x="230" y="172" width="156" height="150" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="308.0" y="198.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">object</text><text x="308.0" y="220.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">at 2f</text><line x1="254" y1="236" x2="362" y2="236" stroke="#5b7a64" stroke-width="1.5" stroke-dasharray="6 5"/><text x="308.0" y="258.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">at 2f</text><text x="308.0" y="282.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">real • inverted</text><text x="308.0" y="304.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">same size</text><rect x="398" y="172" width="156" height="150" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="476.0" y="198.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">object</text><text x="476.0" y="220.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">between f and 2f</text><line x1="422" y1="236" x2="530" y2="236" stroke="#987740" stroke-width="1.5" stroke-dasharray="6 5"/><text x="476.0" y="258.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">beyond 2f</text><text x="476.0" y="282.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">real • inverted</text><text x="476.0" y="304.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">magnified</text><rect x="566" y="172" width="156" height="150" rx="10" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="644.0" y="198.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">object</text><text x="644.0" y="220.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:14px">at f</text><line x1="590" y1="236" x2="698" y2="236" stroke="#6d716f" stroke-width="1.5" stroke-dasharray="6 5"/><text x="644.0" y="258.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">at infinity</text><text x="644.0" y="282.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">no image</text><text x="644.0" y="304.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">rays leave parallel</text><rect x="734" y="172" width="156" height="150" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="812.0" y="198.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">object</text><text x="812.0" y="220.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">inside f</text><line x1="758" y1="236" x2="866" y2="236" stroke="#a8324a" stroke-width="1.5" stroke-dasharray="6 5"/><text x="812.0" y="258.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">same side</text><text x="812.0" y="282.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">virtual • upright</text><text x="812.0" y="304.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">magnified</text><text x="460.0" y="352.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">m = −dᵢ/dₒ:  negative means inverted, |m| &gt; 1 means magnified</text><text x="460.0" y="378.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">dᵢ &gt; 0 is a real image — light actually goes there and a screen would catch it</text><rect x="40" y="422" width="416" height="232" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="248.0" y="450.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">Diverging lens, convex mirror</text><line x1="96" y1="540" x2="400" y2="540" stroke="#6d716f" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M257 488 Q268 540 257 592 L279 592 Q268 540 279 488 Z" stroke="#5b7a64" stroke-width="2.5" fill="#e5ece3"/><line x1="150" y1="540" x2="150" y2="496" stroke="#18364a" stroke-width="2.5" marker-end="url(#m5898)"/><text x="150.0" y="488.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">object</text><line x1="228" y1="540" x2="228" y2="520" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m7850)"/><text x="228.0" y="512.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">image</text><line x1="150" y1="496" x2="268" y2="510" stroke="#18364a" stroke-width="1.6"/><line x1="268" y1="510" x2="392" y2="534" stroke="#18364a" stroke-width="1.6"/><line x1="228" y1="520" x2="392" y2="534" stroke="#6d716f" stroke-width="1.4" stroke-dasharray="6 5"/><text x="248.0" y="606.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">always virtual • upright • diminished</text><text x="248.0" y="630.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">whatever the object distance, f &lt; 0 and the image sits inside f</text><rect x="472" y="422" width="408" height="232" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="676.0" y="450.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:17px">Two prescriptions, one equation</text><rect x="492" y="470" width="376" height="76" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="676.0" y="492.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">Myopia — distance vision</text><text x="676.0" y="514.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">object at ∞, image at the far point (virtual)</text><text x="676.0" y="536.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">far point 50 cm  ⇒  P = 1/(−0.50) = −2.0 D</text><rect x="492" y="556" width="376" height="84" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="676.0" y="578.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">Hyperopia / presbyopia — reading</text><text x="676.0" y="600.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">object at 25 cm, image at the near point (virtual)</text><text x="676.0" y="622.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">near point 100 cm  ⇒  P = 1/0.25 + 1/(−1.00) = +3.0 D</text><text x="460.0" y="694.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">P = 1/f in dioptres with f in metres, and lenses in contact simply add</text><text x="460.0" y="726.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">The eye runs about +60 D, roughly +43 D of it from the cornea alone</text><text x="460.0" y="756.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Accommodation: ciliary muscle contracts, zonules slacken, the lens fattens, P rises</text><text x="460.0" y="786.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Far point fixes distance correction; near point fixes reading correction</text></svg>