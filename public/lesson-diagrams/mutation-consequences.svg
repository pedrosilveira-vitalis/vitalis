<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-labelledby="title desc"><title id="title">Read a mutation in its coding frame</title><desc id="desc">Aligned mRNA codons distinguish synonymous, missense, stop-gain and frameshift outcomes. A frameshift deletion changes downstream triplet boundaries; incomplete terminal bases are not a codon.</desc><rect width="960" height="820" rx="22" fill="#fbf7ef"/><style>text{font-family:Arial,sans-serif;fill:#18364a;font-size:20px}.title{font-size:28px;font-weight:700}.head{font-size:23px;font-weight:700}.small{font-size:17px}.mono{font-family:monospace;font-size:23px}.white{fill:white}</style><text x="32" y="44" class="title" text-anchor="start">Read the sequence before predicting the effect</text><text x="32" y="77" class="small" text-anchor="start">Illustrative mRNA, 5′ → 3′. Start at AUG; translate until a stop.</text><rect x="24" y="110" width="912" height="106" rx="10" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="42" y="141" class="head" text-anchor="start">Reference</text><rect x="245" y="120" width="108" height="37" rx="5" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="299" y="146" class="mono" text-anchor="middle">AUG</text><rect x="370" y="120" width="108" height="37" rx="5" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="424" y="146" class="mono" text-anchor="middle">GAA</text><rect x="495" y="120" width="108" height="37" rx="5" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="549" y="146" class="mono" text-anchor="middle">UUU</text><rect x="620" y="120" width="108" height="37" rx="5" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="674" y="146" class="mono" text-anchor="middle">GGC</text><rect x="745" y="120" width="108" height="37" rx="5" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="799" y="146" class="mono" text-anchor="middle">UAA</text><text x="245" y="190" class="" text-anchor="start">Met – Glu – Phe – Gly – stop</text><rect x="24" y="230" width="912" height="106" rx="10" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="42" y="261" class="head" text-anchor="start">Synonymous</text><rect x="245" y="240" width="108" height="37" rx="5" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="299" y="266" class="mono" text-anchor="middle">AUG</text><rect x="370" y="240" width="108" height="37" rx="5" fill="#dce9f0" stroke="#bdd0dc" stroke-width="2"/><text x="424" y="266" class="mono" text-anchor="middle">GAG</text><rect x="495" y="240" width="108" height="37" rx="5" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="549" y="266" class="mono" text-anchor="middle">UUU</text><rect x="620" y="240" width="108" height="37" rx="5" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="674" y="266" class="mono" text-anchor="middle">GGC</text><rect x="745" y="240" width="108" height="37" rx="5" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="799" y="266" class="mono" text-anchor="middle">UAA</text><text x="245" y="310" class="" text-anchor="start">Met – Glu – Phe – Gly – stop</text><rect x="24" y="350" width="912" height="106" rx="10" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="42" y="381" class="head" text-anchor="start">Missense</text><rect x="245" y="360" width="108" height="37" rx="5" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="299" y="386" class="mono" text-anchor="middle">AUG</text><rect x="370" y="360" width="108" height="37" rx="5" fill="#dce9f0" stroke="#bdd0dc" stroke-width="2"/><text x="424" y="386" class="mono" text-anchor="middle">AAA</text><rect x="495" y="360" width="108" height="37" rx="5" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="549" y="386" class="mono" text-anchor="middle">UUU</text><rect x="620" y="360" width="108" height="37" rx="5" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="674" y="386" class="mono" text-anchor="middle">GGC</text><rect x="745" y="360" width="108" height="37" rx="5" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="799" y="386" class="mono" text-anchor="middle">UAA</text><text x="245" y="430" class="" text-anchor="start">Met – Lys – Phe – Gly – stop</text><rect x="24" y="470" width="912" height="106" rx="10" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="42" y="501" class="head" text-anchor="start">Stop-gain</text><rect x="245" y="480" width="108" height="37" rx="5" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="299" y="506" class="mono" text-anchor="middle">AUG</text><rect x="370" y="480" width="108" height="37" rx="5" fill="#dce9f0" stroke="#bdd0dc" stroke-width="2"/><text x="424" y="506" class="mono" text-anchor="middle">UAA</text><rect x="495" y="480" width="108" height="37" rx="5" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="549" y="506" class="mono" text-anchor="middle">UUU</text><rect x="620" y="480" width="108" height="37" rx="5" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="674" y="506" class="mono" text-anchor="middle">GGC</text><rect x="745" y="480" width="108" height="37" rx="5" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="799" y="506" class="mono" text-anchor="middle">UAA</text><text x="245" y="550" class="" text-anchor="start">Met – stop</text><rect x="24" y="590" width="912" height="106" rx="10" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="42" y="621" class="head" text-anchor="start">Delete base 4</text><rect x="245" y="600" width="108" height="37" rx="5" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="299" y="626" class="mono" text-anchor="middle">AUG</text><rect x="370" y="600" width="108" height="37" rx="5" fill="#dce9f0" stroke="#bdd0dc" stroke-width="2"/><text x="424" y="626" class="mono" text-anchor="middle">AAU</text><rect x="495" y="600" width="108" height="37" rx="5" fill="#dce9f0" stroke="#bdd0dc" stroke-width="2"/><text x="549" y="626" class="mono" text-anchor="middle">UUG</text><rect x="620" y="600" width="108" height="37" rx="5" fill="#dce9f0" stroke="#bdd0dc" stroke-width="2"/><text x="674" y="626" class="mono" text-anchor="middle">GCU</text><rect x="745" y="600" width="108" height="37" rx="5" fill="#dce9f0" stroke="#bdd0dc" stroke-width="2"/><text x="799" y="626" class="mono" text-anchor="middle">AA</text><text x="245" y="670" class="" text-anchor="start">Met – Asn – Leu – Ala – …</text><text x="790" y="669" class="small" text-anchor="start">2 bases only</text><text x="32" y="752" class="small" text-anchor="start">Frameshift: AUG | GAA | UUU | GGC | UAA → AUG | AAU | UUG | GCU | AA</text><text x="32" y="786" class="small" text-anchor="start">RNA surveillance and protein context determine the biological outcome.</text></svg>