<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="700" viewBox="0 0 1020 700" role="img" aria-labelledby="t d"><title id="t">The practice loop, and the four ways a question goes wrong</title><desc id="d">Four phases run left to right across the top. Phase 1, timed passage completion at about 9 to 9 and a half minutes per passage, classifying every stem before reading any choice and flagging anything uncertain. Phase 2, untimed review immediately afterwards, not at the end of the test, asking of every question, right or wrong, what type it was, why the correct answer is correct with passage text to point at, and why each wrong answer is wrong. Phase 3, error categorisation, placing every miss in exactly one of four types. Phase 4, pattern tracking across sessions, where five sessions of logs turn single mistakes into a diagnosis. Below, the four error types with their fixes. Type 1, misclassification: the right strategy run on the wrong question type, fixed by drilling the three-second decision tree until it is automatic. Type 2, strategy execution: classified correctly but a step skipped or distorted, fixed by returning to the strategy and naming the step that was missed. Type 3, passage comprehension: right type and right strategy, but the reading itself was wrong, fixed by finding where the reading went off track — reading too fast, anchoring on early content, or importing outside knowledge. Type 4, careless or timing: you knew it and still marked the wrong box, fixed by slowing down on the stem and confirming you answered the question asked rather than the one you expected. A footer warns that the most common mistake in review is calling a Type 2 error a Type 4 one, because careless is the more comfortable diagnosis.</desc><defs><marker id="m1016" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker><marker id="m7669" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1020" height="700" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">The practice loop, and the four ways a question goes wrong</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Doing passages is not practice. The loop is practice — and Phase 3 is where the score actually moves.</text><rect x="26" y="106" width="228" height="126" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="140.0" y="132.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:14px">PHASE 1</text><text x="140.0" y="150.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12.5px">timed completion</text><text x="140.0" y="172.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11.5px">~9–9½ min a passage · classify</text><text x="140.0" y="186.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11.5px">every stem before you read a</text><text x="140.0" y="200.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11.5px">choice · flag anything</text><text x="140.0" y="214.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11.5px">uncertain</text><line x1="256" y1="169" x2="268" y2="169" stroke="#245574" stroke-width="2.5" marker-end="url(#m7669)"/><rect x="272" y="106" width="228" height="126" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="386.0" y="132.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:14px">PHASE 2</text><text x="386.0" y="150.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12.5px">untimed review</text><text x="386.0" y="172.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11.5px">immediately, not at the end ·</text><text x="386.0" y="186.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11.5px">every question, right ones too</text><text x="386.0" y="200.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11.5px">· why is each wrong answer</text><text x="386.0" y="214.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11.5px">wrong?</text><line x1="502" y1="169" x2="514" y2="169" stroke="#245574" stroke-width="2.5" marker-end="url(#m7669)"/><rect x="518" y="106" width="228" height="126" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="632.0" y="132.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:14px">PHASE 3</text><text x="632.0" y="150.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12.5px">error categorisation</text><text x="632.0" y="172.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11.5px">every miss goes in exactly one</text><text x="632.0" y="186.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11.5px">of the four boxes below</text><line x1="748" y1="169" x2="760" y2="169" stroke="#245574" stroke-width="2.5" marker-end="url(#m7669)"/><rect x="764" y="106" width="228" height="126" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="878.0" y="132.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:14px">PHASE 4</text><text x="878.0" y="150.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12.5px">pattern tracking</text><text x="878.0" y="172.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11.5px">five sessions of logs turn</text><text x="878.0" y="186.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11.5px">single mistakes into a</text><text x="878.0" y="200.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11.5px">diagnosis</text><rect x="26" y="280" width="228" height="264" rx="12" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="140.0" y="308.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:12.5px">TYPE 1 ·</text><text x="140.0" y="323.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:12.5px">MISCLASSIFICATION</text><text x="140.0" y="352.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">Right strategy, wrong</text><text x="140.0" y="367.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">question type.</text><line x1="54" y1="432" x2="226" y2="432" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="140.0" y="456.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">the fix</text><text x="140.0" y="478.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">Drill the three-second</text><text x="140.0" y="493.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">decision tree until it runs</text><text x="140.0" y="508.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">without you.</text><rect x="270" y="280" width="228" height="264" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="384.0" y="308.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12.5px">TYPE 2 · STRATEGY</text><text x="384.0" y="323.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12.5px">EXECUTION</text><text x="384.0" y="352.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">Classified right, then a</text><text x="384.0" y="367.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">step skipped or distorted.</text><line x1="298" y1="432" x2="470" y2="432" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="384.0" y="456.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">the fix</text><text x="384.0" y="478.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">Go back to the strategy and</text><text x="384.0" y="493.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">name the step you missed.</text><rect x="514" y="280" width="228" height="264" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="628.0" y="308.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:12.5px">TYPE 3 · PASSAGE</text><text x="628.0" y="323.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:12.5px">COMPREHENSION</text><text x="628.0" y="352.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">Right type, right strategy,</text><text x="628.0" y="367.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">wrong reading.</text><line x1="542" y1="432" x2="714" y2="432" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="628.0" y="456.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">the fix</text><text x="628.0" y="478.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">Find where it went off: too</text><text x="628.0" y="493.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">fast, anchored early, or</text><text x="628.0" y="508.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">outside knowledge.</text><rect x="758" y="280" width="228" height="264" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="872.0" y="308.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12.5px">TYPE 4 · CARELESS /</text><text x="872.0" y="323.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12.5px">TIMING</text><text x="872.0" y="352.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">You knew it and still marked</text><text x="872.0" y="367.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">the wrong box.</text><line x1="786" y1="432" x2="958" y2="432" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="872.0" y="456.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">the fix</text><text x="872.0" y="478.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">Slow down on the stem.</text><text x="872.0" y="493.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">Answer the question asked,</text><text x="872.0" y="508.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">not the expected one.</text><line x1="632" y1="250" x2="632" y2="274" stroke="#6d716f" stroke-width="2.5" marker-end="url(#m1016)"/><rect x="26" y="566" width="968" height="76" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="510.0" y="596.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:14px">The misdiagnosis to watch for</text><text x="510.0" y="618.0" class="" text-anchor="middle" style="font-size:12.5px">Type 2 errors get filed as Type 4 more than any other mistake in review, because “I was careless” is a far more</text><text x="510.0" y="635.5" class="" text-anchor="middle" style="font-size:12.5px">comfortable verdict than “I do not actually run the strategy”. Before you write Type 4, prove it: say which step</text><text x="510.0" y="653.0" class="" text-anchor="middle" style="font-size:12.5px">you would have taken, and why you know you knew the answer.</text></svg>