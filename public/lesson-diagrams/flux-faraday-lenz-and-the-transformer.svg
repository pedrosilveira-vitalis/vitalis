<svg xmlns="http://www.w3.org/2000/svg" width="920" height="846" viewBox="0 0 920 846" role="img" aria-labelledby="t d"><title id="t">Only a CHANGING flux induces anything</title><desc id="d">Top left: magnetic flux as the field lines caught by a loop, maximum when the field is along the loop&#x27;s normal and zero when the field lies in the plane of the loop, with the three ways flux can change. Top right: Lenz&#x27;s law shown with a bar magnet approaching north pole first, the induced current running so that the loop presents a north pole back and pushes against the magnet. Middle: a straight wire&#x27;s field circles it, so a loop lying in the same plane as the wire catches that field while a loop lying in a plane perpendicular to the wire catches none of it. Bottom: the transformer, with the turns ratio setting the voltage, power conserved so current moves the other way, and nothing at all happening on direct current.</desc><defs><marker id="m7667" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b7a64"/></marker><marker id="m8920" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="846" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Only a CHANGING flux induces anything</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Φ = BA cosθ — change B, change A or turn the loop, and Lenz decides which way the current runs</text><rect x="40" y="136" width="420" height="250" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="250.0" y="164.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">Flux = the field lines a loop catches</text><path d="M98 232 L202 232 L180 258 L76 258 Z" stroke="#18364a" stroke-width="2" fill="#e4edf3"/><line x1="92" y1="196" x2="92" y2="240" stroke="#5b7a64" stroke-width="1.6" marker-end="url(#m7667)"/><line x1="116" y1="196" x2="116" y2="240" stroke="#5b7a64" stroke-width="1.6" marker-end="url(#m7667)"/><line x1="140" y1="196" x2="140" y2="240" stroke="#5b7a64" stroke-width="1.6" marker-end="url(#m7667)"/><line x1="164" y1="196" x2="164" y2="240" stroke="#5b7a64" stroke-width="1.6" marker-end="url(#m7667)"/><line x1="188" y1="196" x2="188" y2="240" stroke="#5b7a64" stroke-width="1.6" marker-end="url(#m7667)"/><text x="150.0" y="284.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">θ = 0°</text><text x="150.0" y="306.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">Φ = BA (max)</text><rect x="334" y="196" width="32" height="62" rx="2" fill="#e4edf3" stroke="#18364a" stroke-width="2"/><line x1="290" y1="206" x2="410" y2="206" stroke="#5b7a64" stroke-width="1.6" marker-end="url(#m7667)"/><line x1="290" y1="222" x2="410" y2="222" stroke="#5b7a64" stroke-width="1.6" marker-end="url(#m7667)"/><line x1="290" y1="238" x2="410" y2="238" stroke="#5b7a64" stroke-width="1.6" marker-end="url(#m7667)"/><line x1="290" y1="254" x2="410" y2="254" stroke="#5b7a64" stroke-width="1.6" marker-end="url(#m7667)"/><text x="350.0" y="284.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">θ = 90°</text><text x="350.0" y="306.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">Φ = 0</text><text x="250.0" y="338.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">three ways to change it: B, A, or θ</text><text x="250.0" y="362.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">|EMF| = N · ΔΦ/Δt  —  a big steady field induces nothing</text><rect x="476" y="136" width="404" height="250" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="678.0" y="164.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">Lenz: the loop pushes back</text><rect x="560" y="196" width="86" height="34" rx="4" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="582.0" y="219.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">S</text><text x="624.0" y="219.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">N</text><line x1="652" y1="213" x2="700" y2="213" stroke="#18364a" stroke-width="2.4" marker-end="url(#m8920)"/><text x="676.0" y="192.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">moving in</text><path d="M740 186 A 26 56 0 0 1 740 298" stroke="#987740" stroke-width="3" fill="none"/><path d="M740 186 A 26 56 0 0 0 740 298" stroke="#987740" stroke-width="3" fill="none" stroke-dasharray="8 6"/><text x="740.0" y="320.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">loop</text><text x="678.0" y="348.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">flux toward the loop is rising, so the induced current</text><text x="678.0" y="368.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">makes a north pole facing the magnet — it repels</text><rect x="40" y="406" width="840" height="212" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="460.0" y="434.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">A straight wire&#x27;s field circles it — so orientation is everything</text><line x1="250" y1="456" x2="250" y2="596" stroke="#18364a" stroke-width="4"/><line x1="250" y1="520" x2="250" y2="486" stroke="#18364a" stroke-width="2" marker-end="url(#m8920)"/><text x="250.0" y="448.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">I</text><text x="310.0" y="483.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:19px">×</text><text x="190.0" y="483.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:22px">•</text><text x="310.0" y="533.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:19px">×</text><text x="190.0" y="533.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:22px">•</text><text x="310.0" y="583.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:19px">×</text><text x="190.0" y="583.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:22px">•</text><text x="346.0" y="470.0" class="" text-anchor="start" style="fill:#5b7a64;font-size:12px">B into page</text><text x="154.0" y="470.0" class="" text-anchor="end" style="fill:#5b7a64;font-size:12px">B out</text><rect x="352" y="496" width="74" height="70" rx="3" fill="#e4edf3" stroke="#245574" stroke-width="2.4"/><text x="389.0" y="536.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:19px">X</text><text x="400.0" y="586.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">same plane as the wire</text><text x="389.0" y="604.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">field pierces it ⇒ EMF</text><path d="M600 530 L690 506 L780 530 L690 554 Z" stroke="#a8324a" stroke-width="2.4" fill="#f5e6e8"/><text x="690.0" y="536.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:19px">Y</text><text x="690.0" y="586.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">plane ⊥ to the wire</text><text x="690.0" y="604.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">field lies in its plane ⇒ no EMF</text><rect x="40" y="638" width="840" height="196" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="666.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">Transformer: the turns ratio sets the voltage</text><rect x="390" y="688" width="140" height="92" rx="4" fill="#e9e4da" stroke="#6d716f" stroke-width="3"/><text x="460.0" y="740.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:12px">iron core</text><path d="M356 698 q -22 9 0 18" stroke="#245574" stroke-width="2.4" fill="none"/><path d="M564 698 q 22 9 0 18" stroke="#a8324a" stroke-width="2.4" fill="none"/><path d="M356 716 q -22 9 0 18" stroke="#245574" stroke-width="2.4" fill="none"/><path d="M564 716 q 22 9 0 18" stroke="#a8324a" stroke-width="2.4" fill="none"/><path d="M356 734 q -22 9 0 18" stroke="#245574" stroke-width="2.4" fill="none"/><path d="M564 734 q 22 9 0 18" stroke="#a8324a" stroke-width="2.4" fill="none"/><path d="M356 752 q -22 9 0 18" stroke="#245574" stroke-width="2.4" fill="none"/><path d="M564 752 q 22 9 0 18" stroke="#a8324a" stroke-width="2.4" fill="none"/><path d="M356 770 q -22 9 0 18" stroke="#245574" stroke-width="2.4" fill="none"/><path d="M564 770 q 22 9 0 18" stroke="#a8324a" stroke-width="2.4" fill="none"/><text x="300.0" y="712.0" class="" text-anchor="end" style="fill:#245574;font-weight:bold;font-size:14px">primary</text><text x="300.0" y="734.0" class="" text-anchor="end" style="fill:#245574;font-size:13px">N_p turns</text><text x="620.0" y="712.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:14px">secondary</text><text x="620.0" y="734.0" class="" text-anchor="start" style="fill:#a8324a;font-size:13px">N_s turns</text><text x="460.0" y="802.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">V_s/V_p = N_s/N_p  •  V_pI_p = V_sI_s  •  step the voltage up and the current steps down</text><text x="460.0" y="828.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">On DC the flux never changes, so a transformer does nothing at all</text></svg>