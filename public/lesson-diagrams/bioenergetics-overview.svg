<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">Bioenergetics: direction, electron flow and ATP accounting</title><desc id="desc">The actual free energy equals the standard transformed value plus RT ln Q. Complexes I, III and IV pump protons; Complex II feeds electrons to Q without pumping. Approximate glucose totals combine four direct ATP equivalents with oxidative phosphorylation to give 30 or 32 ATP.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#245574;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">Check the direction and balance the accounting</text><rect x="24" y="60" width="752" height="131" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="94" class="h" text-anchor="start">1  Actual conditions matter</text><text x="55" y="132" class="t" text-anchor="start">ΔG = ΔG°′ + RT ln Q</text><text x="55" y="166" class="s" text-anchor="start">Negative ΔG favors forward reaction; it does not imply a fast rate.</text><rect x="24" y="207" width="752" height="268" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="241" class="h" text-anchor="start">2  Electron entry determines which pumps are used</text><rect x="60" y="292" width="80" height="42" rx="9" fill="#e4eef1"/><text x="100.0" y="319" class="t" text-anchor="middle">I</text><rect x="270" y="292" width="80" height="42" rx="9" fill="#e4eef1"/><text x="310.0" y="319" class="t" text-anchor="middle">Q</text><rect x="440" y="292" width="80" height="42" rx="9" fill="#e4eef1"/><text x="480.0" y="319" class="t" text-anchor="middle">III</text><rect x="650" y="292" width="80" height="42" rx="9" fill="#e4eef1"/><text x="690.0" y="319" class="t" text-anchor="middle">IV</text><path d="M145 313 L260 313" class="bond" /><path d="M251 308 L260 313 L251 318" class="bond"/><path d="M355 313 L430 313" class="bond" /><path d="M421 308 L430 313 L421 318" class="bond"/><path d="M525 313 L640 313" class="bond" /><path d="M631 308 L640 313 L631 318" class="bond"/><text x="578" y="300" class="s" text-anchor="middle">cyt c</text><path d="M100 286 V262 M95 269 L100 262 L105 269" stroke="#245574" stroke-width="3" fill="none"/><text x="112" y="275" class="s" text-anchor="start">H⁺</text><path d="M480 286 V262 M475 269 L480 262 L485 269" stroke="#245574" stroke-width="3" fill="none"/><text x="492" y="275" class="s" text-anchor="start">H⁺</text><path d="M690 286 V262 M685 269 L690 262 L695 269" stroke="#245574" stroke-width="3" fill="none"/><text x="702" y="275" class="s" text-anchor="start">H⁺</text><text x="60" y="357" class="s" text-anchor="start">NADH → I</text><rect x="270" y="373" width="80" height="42" rx="9" fill="#e4eef1"/><text x="310.0" y="400" class="t" text-anchor="middle">II</text><path d="M310 370 V341 M305 350 L310 341 L315 350" class="bond"/><text x="365" y="399" class="s" text-anchor="start">Succinate → II → Q (no proton pumping)</text><text x="55" y="452" class="s" text-anchor="start">At IV: electrons reduce O₂ to water. H⁺ pumping builds voltage + ΔpH.</text><rect x="24" y="491" width="752" height="225" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="525" class="h" text-anchor="start">3  Approximate yield per glucose</text><text x="50" y="563" class="s" text-anchor="start">Direct: glycolysis + TCA substrate-level ATP</text><text x="730" y="563" class="t" text-anchor="end">2 + 2 = 4</text><text x="50" y="598" class="s" text-anchor="start">Mitochondrial NADH + succinate-linked electrons</text><text x="730" y="598" class="t" text-anchor="end">20 + 3 = 23</text><text x="50" y="633" class="s" text-anchor="start">Cytosolic NADH equivalents, depending on shuttle</text><text x="730" y="633" class="t" text-anchor="end">3 or 5</text><path d="M50 653 L738 653" class="bond" /><text x="50" y="687" class="t" text-anchor="start">TOTAL = 4 + 23 + (3 or 5)</text><text x="730" y="687" class="h" text-anchor="end">30 or 32 ATP</text></svg>