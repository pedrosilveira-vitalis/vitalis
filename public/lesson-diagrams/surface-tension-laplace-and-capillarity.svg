<svg xmlns="http://www.w3.org/2000/svg" width="920" height="820" viewBox="0 0 920 820" role="img" aria-labelledby="t d"><title id="t">Surface tension: the surface is the odd place to be</title><desc id="d">Top left: a molecular picture, with a molecule in the bulk pulled equally in all directions and a molecule at the surface pulled only inward and sideways. Top right: two alveoli of different size joined by an airway, with the smaller one at higher pressure emptying into the larger, and a note that surfactant lowers surface tension more in the smaller one so the pressures match. Bottom left: capillary rise in two glass tubes, higher in the narrower one, beside mercury depressed below the outside level. Bottom right: the equations and the surface tension values for water, plasma, surfactant at expiration and mercury.</desc><defs><marker id="m7150" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="820" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Surface tension: the surface is the odd place to be</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">ΔP = 2γ/R makes small spheres tight; h = 2γcosθ/ρgr makes narrow tubes climb</text><rect x="40" y="112" width="416" height="300" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="248.0" y="142.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">Why a surface is under tension</text><rect x="86" y="212" width="326" height="150" rx="4" fill="#e4edf3" stroke="#245574" stroke-width="0"/><line x1="86" y1="212" x2="412" y2="212" stroke="#245574" stroke-width="3"/><circle cx="108" cy="232" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="144" cy="232" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="180" cy="232" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="216" cy="232" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="252" cy="232" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="288" cy="232" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="324" cy="232" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="360" cy="232" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="396" cy="232" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="126" cy="268" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="162" cy="268" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="198" cy="268" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="234" cy="268" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="270" cy="268" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="306" cy="268" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="342" cy="268" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="378" cy="268" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="108" cy="304" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="144" cy="304" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="180" cy="304" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="216" cy="304" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="252" cy="304" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="288" cy="304" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="324" cy="304" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="360" cy="304" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="396" cy="304" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="126" cy="340" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="162" cy="340" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="198" cy="340" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="234" cy="340" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="270" cy="340" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="306" cy="340" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="342" cy="340" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="378" cy="340" r="9" fill="#ffffff" stroke="#245574" stroke-width="1.2"/><circle cx="198" cy="304" r="11" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><line x1="198" y1="304" x2="222.0" y2="304.0" stroke="#18364a" stroke-width="1.6"/><line x1="198" y1="304" x2="214.97056274847714" y2="320.97056274847716" stroke="#18364a" stroke-width="1.6"/><line x1="198" y1="304" x2="198.0" y2="328.0" stroke="#18364a" stroke-width="1.6"/><line x1="198" y1="304" x2="181.02943725152286" y2="320.97056274847716" stroke="#18364a" stroke-width="1.6"/><line x1="198" y1="304" x2="174.0" y2="304.0" stroke="#18364a" stroke-width="1.6"/><line x1="198" y1="304" x2="181.02943725152286" y2="287.02943725152284" stroke="#18364a" stroke-width="1.6"/><line x1="198" y1="304" x2="198.0" y2="280.0" stroke="#18364a" stroke-width="1.6"/><line x1="198" y1="304" x2="214.97056274847714" y2="287.02943725152284" stroke="#18364a" stroke-width="1.6"/><rect x="118" y="336" width="160" height="22" rx="6" fill="#eef3f7" stroke="#6d716f" stroke-width="0"/><text x="198.0" y="351.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">bulk: pulled evenly</text><circle cx="330" cy="232" r="11" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><line x1="330" y1="232" x2="313.02943725152284" y2="215.02943725152286" stroke="#a8324a" stroke-width="1.6"/><line x1="330" y1="232" x2="306.0" y2="232.0" stroke="#a8324a" stroke-width="1.6"/><line x1="330" y1="232" x2="313.02943725152284" y2="248.97056274847714" stroke="#a8324a" stroke-width="1.6"/><line x1="330" y1="232" x2="330.0" y2="256.0" stroke="#a8324a" stroke-width="1.6"/><line x1="330" y1="232" x2="346.97056274847716" y2="215.02943725152286" stroke="#a8324a" stroke-width="1.6"/><line x1="330" y1="232" x2="346.97056274847716" y2="248.97056274847714" stroke="#a8324a" stroke-width="1.6"/><line x1="330" y1="216" x2="330" y2="188" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m7150)"/><text x="330.0" y="180.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">net pull inward</text><text x="248.0" y="388.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">γ = F/L = J/m²: the energy cost of making new surface</text><rect x="472" y="112" width="408" height="300" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="676.0" y="142.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">Small spheres squeeze harder</text><circle cx="568" cy="226" r="30" fill="#f5e6e8" stroke="#a8324a" stroke-width="2.5"/><circle cx="790" cy="238" r="54" fill="#e4edf3" stroke="#245574" stroke-width="2.5"/><line x1="598" y1="226" x2="640" y2="226" stroke="#18364a" stroke-width="3"/><line x1="736" y1="238" x2="700" y2="238" stroke="#18364a" stroke-width="3"/><line x1="640" y1="226" x2="668" y2="282" stroke="#18364a" stroke-width="3"/><line x1="700" y1="238" x2="668" y2="282" stroke="#18364a" stroke-width="3"/><line x1="668" y1="282" x2="668" y2="320" stroke="#18364a" stroke-width="3"/><text x="568.0" y="180.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">high P</text><text x="790.0" y="172.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">low P</text><line x1="612" y1="206" x2="700" y2="206" stroke="#a8324a" stroke-width="3" marker-end="url(#m7150)"/><text x="656.0" y="196.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">air</text><text x="676.0" y="338.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">ΔP = 2γ / R  ⇒  the smaller alveolus empties into the larger</text><rect x="492" y="352" width="376" height="46" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="680.0" y="372.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">Surfactant drops γ further as the alveolus shrinks,</text><text x="680.0" y="390.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">so the two pressures end up matched and both stay open</text><rect x="40" y="432" width="416" height="250" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="248.0" y="460.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">Narrow tubes climb higher</text><rect x="70" y="600" width="356" height="36" rx="0" fill="#e4edf3" stroke="#245574" stroke-width="0"/><line x1="70" y1="600" x2="426" y2="600" stroke="#245574" stroke-width="2"/><line x1="112" y1="482" x2="112" y2="636" stroke="#6d716f" stroke-width="2"/><line x1="140" y1="482" x2="140" y2="636" stroke="#6d716f" stroke-width="2"/><rect x="114" y="520" width="24" height="116" rx="0" fill="#e4edf3" stroke="#245574" stroke-width="0"/><path d="M114 520 Q126 510 138 520" stroke="#245574" stroke-width="2.5" fill="none"/><line x1="224" y1="482" x2="224" y2="636" stroke="#6d716f" stroke-width="2"/><line x1="240" y1="482" x2="240" y2="636" stroke="#6d716f" stroke-width="2"/><rect x="226" y="488" width="12" height="148" rx="0" fill="#e4edf3" stroke="#245574" stroke-width="0"/><path d="M226 488 Q232 478 238 488" stroke="#245574" stroke-width="2.5" fill="none"/><line x1="332" y1="482" x2="332" y2="636" stroke="#6d716f" stroke-width="2"/><line x1="364" y1="482" x2="364" y2="636" stroke="#6d716f" stroke-width="2"/><rect x="334" y="636" width="28" height="0" rx="0" fill="#efede8" stroke="#6d716f" stroke-width="0"/><path d="M334 636 Q348 646 362 636" stroke="#6d716f" stroke-width="2.5" fill="none"/><text x="126.0" y="506.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">wide</text><text x="232.0" y="474.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">narrow</text><text x="374.0" y="556.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:bold;font-size:13px">mercury</text><text x="374.0" y="576.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:bold;font-size:13px">sits lower</text><text x="374.0" y="596.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:bold;font-size:13px">inside</text><text x="248.0" y="666.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">h = 2γ cosθ / ρgr  —  halve r, double h</text><rect x="472" y="432" width="408" height="250" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="676.0" y="460.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:17px">Numbers worth carrying</text><text x="500.0" y="492.0" class="" text-anchor="start" style="fill:#6d716f;font-size:14px">water, 37°C</text><text x="852.0" y="492.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:14px">≈ 70 mN/m</text><text x="500.0" y="520.0" class="" text-anchor="start" style="fill:#6d716f;font-size:14px">blood plasma</text><text x="852.0" y="520.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:14px">≈ 55–60 mN/m</text><text x="500.0" y="548.0" class="" text-anchor="start" style="fill:#6d716f;font-size:14px">alveolus, inspiration</text><text x="852.0" y="548.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:14px">≈ 25–30 mN/m</text><text x="500.0" y="576.0" class="" text-anchor="start" style="fill:#6d716f;font-size:14px">alveolus, expiration</text><text x="852.0" y="576.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:14px">≈ 1–5 mN/m</text><text x="500.0" y="604.0" class="" text-anchor="start" style="fill:#6d716f;font-size:14px">mercury</text><text x="852.0" y="604.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:14px">≈ 480 mN/m</text><line x1="496" y1="638" x2="856" y2="638" stroke="#987740" stroke-width="2"/><text x="676.0" y="664.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">droplet ΔP = 2γ/R   •   soap bubble ΔP = 4γ/R</text><text x="460.0" y="722.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">θ &lt; 90° wets and climbs (concave);  θ &gt; 90° beads and sinks (convex)</text><text x="460.0" y="752.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Surfactant always lowers γ — DPPC from type II pneumocytes; its absence is NRDS</text><text x="460.0" y="782.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Law of Laplace for a vessel wall: T = P · r, so a widening aneurysm is self-worsening</text></svg>