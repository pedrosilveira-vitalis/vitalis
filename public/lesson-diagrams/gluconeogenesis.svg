<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">Gluconeogenic bypasses and hepatic reciprocal control</title><desc id="desc">Pyruvate carboxylase consumes ATP and bicarbonate to form OAA; PEPCK consumes GTP and releases CO2 to form PEP. FBPase1 hydrolyzes F1,6BP and G6PC1 hydrolyzes G6P. Lactate oxidation consumes NAD and produces NADH. Liver F2,6BP activates PFK1 and inhibits FBPase1.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#245574;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">Gluconeogenesis: bypasses, not simple reversal</text><rect x="24" y="60" width="752" height="227" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="94" class="h" text-anchor="start">1  Pyruvate → OAA → PEP</text><text x="55" y="136" class="t" text-anchor="start">Pyruvate + HCO₃⁻ + ATP → OAA + ADP + Pᵢ</text><text x="55" y="165" class="s" text-anchor="start">Pyruvate carboxylase: mitochondrial, biotin-dependent</text><text x="55" y="211" class="t" text-anchor="start">OAA + GTP → PEP + GDP + CO₂</text><text x="55" y="246" class="s" text-anchor="start">Cytosolic and mitochondrial PEPCK routes both exist.</text><text x="55" y="273" class="s" text-anchor="start">OAA itself does not directly cross the inner membrane.</text><rect x="24" y="303" width="752" height="136" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="337" class="h" text-anchor="start">2  Two hydrolytic bypasses</text><text x="55" y="376" class="s" text-anchor="start">F1,6BP + H₂O → F6P + Pᵢ</text><text x="470" y="376" class="s" text-anchor="start">Enzyme: FBPase-1</text><text x="55" y="414" class="s" text-anchor="start">G6P + H₂O → Glucose + Pᵢ</text><text x="470" y="414" class="s" text-anchor="start">G6PC1 system</text><rect x="24" y="455" width="752" height="116" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="489" class="h" text-anchor="start">3  Check the redox direction</text><text x="55" y="528" class="t" text-anchor="start">Lactate + NAD⁺ ⇌ Pyruvate + NADH + H⁺</text><text x="55" y="557" class="s" text-anchor="start">Lactate oxidation supplies NADH for gluconeogenesis.</text><rect x="24" y="587" width="752" height="129" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="621" class="h" text-anchor="start">4  Liver F2,6BP coordinates opposite routes</text><text x="55" y="656" class="s" text-anchor="start">F2,6BP ↑  →  PFK-1 stimulated; FBPase-1 inhibited</text><text x="55" y="692" class="s" text-anchor="start">From 2 pyruvate: spend 4 ATP + 2 GTP + 2 NADH</text></svg>