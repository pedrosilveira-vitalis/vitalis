<svg xmlns="http://www.w3.org/2000/svg" width="920" height="946" viewBox="0 0 920 946" role="img" aria-labelledby="t d"><title id="t">What works, what backfires, and what the fix is aimed at</title><desc id="d">Top: Allport&#x27;s four conditions as a gate. Contact helps on average even when they are missing, but the effect is far larger when all four hold, and contact under the wrong conditions — unequal, competitive, unsanctioned — can entrench the stereotype instead. Middle: the forms contact can take, which matter because none of them requires meeting anyone. Bottom left: interventions ranked by how well the evidence holds up, from the structural fixes that remove the opportunity for bias down to the two that can rebound. Bottom right: the generalization problem, which is why a good experience with one person so often leaves the category untouched.</desc><defs><marker id="m7187" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="946" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">What works, what backfires, and what the fix is aimed at</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Changing minds is the hard route; changing the procedure is the reliable one</text><rect x="40" y="180" width="840" height="206" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">Allport&#x27;s four conditions</text><rect x="60" y="228" width="200" height="100" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="160.0" y="254.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">EQUAL STATUS</text><text x="160.0" y="278.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">inside the contact situation —</text><text x="160.0" y="293.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">not one group serving the other</text><rect x="265" y="228" width="200" height="100" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="365.0" y="254.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">COMMON GOALS</text><text x="365.0" y="278.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">something neither group</text><text x="365.0" y="293.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">reaches on its own</text><rect x="470" y="228" width="200" height="100" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="570.0" y="254.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">COOPERATION</text><text x="570.0" y="278.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">genuine interdependence,</text><text x="570.0" y="293.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">not shared proximity</text><rect x="675" y="228" width="200" height="100" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="775.0" y="254.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">INSTITUTIONAL SUPPORT</text><text x="775.0" y="278.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">the law, the school, the boss</text><text x="775.0" y="293.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">visibly behind it</text><text x="460.0" y="350.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">contact helps on average without them; it helps far more with them</text><text x="460.0" y="370.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">and under unequal, competitive, unsanctioned contact it can make things worse</text><rect x="40" y="402" width="840" height="136" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="430.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">And it need not be face to face</text><rect x="60" y="450" width="200" height="72" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.6"/><text x="160.0" y="472.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">DIRECT</text><text x="160.0" y="490.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">you meet them yourself</text><rect x="265" y="450" width="200" height="72" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.6"/><text x="365.0" y="472.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">EXTENDED</text><text x="365.0" y="490.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">you know that a friend of yours</text><text x="365.0" y="503.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">has a friend in the out-group</text><rect x="470" y="450" width="200" height="72" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.6"/><text x="570.0" y="472.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:11px">IMAGINED</text><text x="570.0" y="490.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">you simply picture a positive</text><text x="570.0" y="503.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">encounter in some detail</text><rect x="675" y="450" width="200" height="72" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.6"/><text x="775.0" y="472.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:11px">VICARIOUS</text><text x="775.0" y="490.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">you watch a positive intergroup</text><text x="775.0" y="503.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">relationship, including in media</text><rect x="40" y="554" width="410" height="374" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="245.0" y="582.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">Ranked by how well it holds up</text><rect x="64" y="600" width="362" height="60" rx="7" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="245.0" y="616.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10px">CHANGE THE PROCEDURE</text><text x="245.0" y="629.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">blind review, standardised criteria,</text><text x="245.0" y="641.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">structured interviews — removes the</text><text x="245.0" y="653.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">opportunity rather than the attitude</text><rect x="64" y="664" width="362" height="48" rx="7" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="245.0" y="680.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10px">COOPERATIVE LEARNING</text><text x="245.0" y="693.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">the jigsaw classroom: unique pieces,</text><text x="245.0" y="705.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">so nobody succeeds alone</text><rect x="64" y="716" width="362" height="48" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="245.0" y="732.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10px">PERSPECTIVE-GETTING</text><text x="245.0" y="745.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">ask and listen; beats imagining it,</text><text x="245.0" y="757.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">which mostly projects your own view</text><rect x="64" y="768" width="362" height="48" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="245.0" y="784.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10px">IMPLEMENTATION INTENTIONS</text><text x="245.0" y="797.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">a specific if-then plan, not a resolve</text><text x="245.0" y="809.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">to be fair</text><rect x="64" y="820" width="362" height="48" rx="7" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="245.0" y="836.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10px">IMPLICIT BIAS TRAINING</text><text x="245.0" y="849.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">raises awareness; little durable change</text><text x="245.0" y="861.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">in behaviour, and can licence it</text><rect x="64" y="872" width="362" height="48" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="245.0" y="888.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10px">SUPPRESSING THE THOUGHT</text><text x="245.0" y="901.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">rebound — the stereotype comes back</text><text x="245.0" y="913.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">MORE accessible than before</text><rect x="470" y="554" width="410" height="374" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="675.0" y="582.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">The generalization problem</text><rect x="494" y="602" width="362" height="56" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="675.0" y="626.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">you have a good experience</text><text x="675.0" y="644.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">with ONE out-group member</text><line x1="675" y1="662" x2="675" y2="690" stroke="#6d716f" stroke-width="2.5" marker-end="url(#m7187)"/><rect x="494" y="696" width="170" height="108" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="579.0" y="718.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10px">SEEN AS ATYPICAL</text><text x="579.0" y="740.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">“not like the rest”</text><text x="579.0" y="762.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">SUBTYPED</text><text x="579.0" y="784.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">the category survives</text><rect x="686" y="696" width="170" height="108" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="771.0" y="718.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10px">SEEN AS TYPICAL</text><text x="771.0" y="740.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">a normal member</text><text x="771.0" y="762.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">GENERALISES</text><text x="771.0" y="784.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">the category updates</text><rect x="494" y="816" width="362" height="96" rx="9" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="675.0" y="838.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10.5px">SO THE PARADOX</text><text x="675.0" y="858.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">the most impressive counter-example is the</text><text x="675.0" y="874.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">easiest to dismiss; prejudice falls further when</text><text x="675.0" y="890.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">the person is ordinary and clearly of the group</text></svg>