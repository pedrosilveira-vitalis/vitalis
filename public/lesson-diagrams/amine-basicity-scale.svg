<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="t d"><title id="t">Amine basicity is one question: how available is the lone pair?</title><desc id="d">A horizontal pKa scale of conjugate acids running from minus 5 to 12. Pyrrole sits at minus 3.8 and an amide near zero because the lone pair is tied up in a pi system; aniline at 4.6 and pyridine at 5.2 in the middle; ammonia at 9.25 and the aliphatic amines between 9.8 and 10.7 at the basic end. A lower band lists the three factors that move a nitrogen along the scale: resonance delocalisation, hybridisation, and inductive effects plus solvation.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="900" height="600" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Amine basicity is one question: how available is the lone pair?</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">The scale is the pKₐ of the conjugate acid — higher means the amine holds a proton more willingly.</text><line x1="110" y1="250" x2="840" y2="250" stroke="#18364a" stroke-width="2.5"/><line x1="152.94117647058823" y1="244" x2="152.94117647058823" y2="256" stroke="#18364a" stroke-width="1.5"/><text x="152.9" y="274.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">-4</text><line x1="238.8235294117647" y1="244" x2="238.8235294117647" y2="256" stroke="#18364a" stroke-width="1.5"/><text x="238.8" y="274.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">-2</text><line x1="324.7058823529412" y1="244" x2="324.7058823529412" y2="256" stroke="#18364a" stroke-width="1.5"/><text x="324.7" y="274.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">0</text><line x1="410.5882352941176" y1="244" x2="410.5882352941176" y2="256" stroke="#18364a" stroke-width="1.5"/><text x="410.6" y="274.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">2</text><line x1="496.47058823529414" y1="244" x2="496.47058823529414" y2="256" stroke="#18364a" stroke-width="1.5"/><text x="496.5" y="274.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">4</text><line x1="582.3529411764706" y1="244" x2="582.3529411764706" y2="256" stroke="#18364a" stroke-width="1.5"/><text x="582.4" y="274.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">6</text><line x1="668.2352941176471" y1="244" x2="668.2352941176471" y2="256" stroke="#18364a" stroke-width="1.5"/><text x="668.2" y="274.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">8</text><line x1="754.1176470588235" y1="244" x2="754.1176470588235" y2="256" stroke="#18364a" stroke-width="1.5"/><text x="754.1" y="274.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">10</text><line x1="840.0" y1="244" x2="840.0" y2="256" stroke="#18364a" stroke-width="1.5"/><text x="840.0" y="274.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">12</text><text x="114.0" y="300.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:14px">← lone pair tied up</text><text x="836.0" y="300.0" class="" text-anchor="end" style="fill:#5b7a64;font-weight:bold;font-size:14px">lone pair free →</text><line x1="161.52941176470588" y1="236" x2="161.52941176470588" y2="176" stroke="#a8324a" stroke-width="2" stroke-dasharray="6 5"/><circle cx="161.52941176470588" cy="250" r="7" fill="#a8324a" stroke="#a8324a" stroke-width="0"/><text x="161.5" y="158.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">pyrrole</text><text x="161.5" y="180.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">lone pair is 2 of the</text><text x="161.5" y="195.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">6 aromatic π electrons</text><line x1="324.7058823529412" y1="264" x2="324.7058823529412" y2="324" stroke="#a8324a" stroke-width="2" stroke-dasharray="6 5"/><circle cx="324.7058823529412" cy="250" r="7" fill="#a8324a" stroke="#a8324a" stroke-width="0"/><text x="324.7" y="342.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">amide N</text><text x="324.7" y="364.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">lone pair delocalised</text><text x="324.7" y="379.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">into C=O</text><line x1="522.2352941176471" y1="236" x2="522.2352941176471" y2="176" stroke="#987740" stroke-width="2" stroke-dasharray="6 5"/><circle cx="522.2352941176471" cy="250" r="7" fill="#987740" stroke="#987740" stroke-width="0"/><text x="522.2" y="158.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">aniline</text><text x="522.2" y="180.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">lone pair delocalised</text><text x="522.2" y="195.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">into the ring</text><line x1="548.0" y1="264" x2="548.0" y2="324" stroke="#987740" stroke-width="2" stroke-dasharray="6 5"/><circle cx="548.0" cy="250" r="7" fill="#987740" stroke="#987740" stroke-width="0"/><text x="548.0" y="342.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">pyridine</text><text x="548.0" y="364.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">sp² lone pair, in</text><text x="548.0" y="379.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">plane, not in the π</text><text x="548.0" y="394.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">system</text><line x1="721.9117647058823" y1="236" x2="721.9117647058823" y2="176" stroke="#245574" stroke-width="2" stroke-dasharray="6 5"/><circle cx="721.9117647058823" cy="250" r="7" fill="#245574" stroke="#245574" stroke-width="0"/><text x="663.9" y="158.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">NH₃</text><text x="663.9" y="180.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">reference point</text><line x1="745.5294117647059" y1="264" x2="745.5294117647059" y2="324" stroke="#245574" stroke-width="2" stroke-dasharray="6 5"/><circle cx="745.5294117647059" cy="250" r="7" fill="#245574" stroke="#245574" stroke-width="0"/><text x="745.5" y="342.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">3° amine</text><text x="745.5" y="364.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">only one N–H to</text><text x="745.5" y="379.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">solvate</text><line x1="784.1764705882352" y1="236" x2="784.1764705882352" y2="176" stroke="#5b7a64" stroke-width="2" stroke-dasharray="6 5"/><circle cx="784.1764705882352" cy="250" r="7" fill="#5b7a64" stroke="#5b7a64" stroke-width="0"/><text x="820.2" y="158.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">1° / 2° amine</text><text x="820.2" y="180.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">alkyl donation plus</text><text x="820.2" y="195.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">good solvation</text><rect x="60" y="430" width="780" height="150" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="450.0" y="458.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">Three dials, in order of how far they move the needle</text><text x="236.0" y="488.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:15px">Resonance</text><text x="252.0" y="488.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">a lone pair shared with a π system is barely a base at all — worth 5 to 14 pKₐ units</text><text x="236.0" y="518.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:15px">Hybridisation</text><text x="252.0" y="518.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">sp³ holds the pair most loosely, then sp², then sp; nitriles are essentially non-basic</text><text x="236.0" y="548.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:15px">Induction and solvation</text><text x="252.0" y="548.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">alkyl groups donate, EWGs withdraw; in water a 3° ammonium ion has the fewest N–H to solvate</text></svg>