<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="790" viewBox="0 0 1080 790" role="img" aria-labelledby="t d"><title id="t">Four moral frameworks, and the objection each one attracts</title><desc id="d">Four columns comparing moral frameworks. Consequentialism, best known in its utilitarian form from Bentham and Mill: what makes an act right is its outcomes and nothing else; the signature move is the greatest good for the greatest number with everyone&#x27;s welfare counting equally; the standard objection is that it can license acts that look monstrous, such as harming one person to spare five. Deontology, most influentially Kant&#x27;s: some acts are right or wrong in themselves whatever follows from them; the signature move is to act only on rules you could will to be universal and to treat people as ends and never merely as means; the standard objection is rigidity in edge cases where the result is awful. Virtue ethics, rooted in Aristotle: the question is not what to do but what kind of person to be; the signature move is stable traits such as courage, honesty and justice that make up a flourishing life, guided by practical wisdom; the standard objection is that it gives thin guidance in a concrete dilemma. Contract theories, contractarian in Hobbes, Locke and Rousseau and contractualist in Rawls and Scanlon: morality is what we would agree to, or could not reasonably reject; the signature move is Rawls&#x27;s veil of ignorance, choosing the rules without knowing which life you get; the standard objection is that the agreement is hypothetical, so it is unclear why anyone is bound by it. A footer records the two distinctions that decide the most questions: necessary versus sufficient, where a necessary condition is one without which the thing cannot happen and a sufficient condition is one whose presence guarantees it, so many debates turn on claiming a condition is necessary but not sufficient; and valid versus sound, where a valid argument is one whose conclusion must be true if its premises are, which is a matter of structure alone, while a sound argument is valid and has true premises as well, so an author attacking an argument is attacking either its structure or one of its premises and which one they attack is frequently the question.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1080" height="790" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Four moral frameworks, and the objection each one attracts</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">You will not be asked which is correct. You will be asked which one an author is reasoning inside — and what follows if they are.</text><rect x="22" y="108" width="258" height="440" rx="12" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="151.0" y="134.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:14px">CONSEQUENTIALISM</text><text x="151.0" y="160.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">Utilitarianism is its best-known</text><text x="151.0" y="173.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">form (Bentham, Mill)</text><text x="151.0" y="212.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12.5px">What makes an act right is its</text><text x="151.0" y="228.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12.5px">outcomes, and nothing else.</text><text x="151.0" y="300.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">signature move</text><text x="151.0" y="320.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">the greatest good for the</text><text x="151.0" y="335.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">greatest number; everyone&#x27;s</text><text x="151.0" y="350.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">welfare counts equally</text><line x1="48" y1="436" x2="254" y2="436" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="151.0" y="460.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:10.5px">the standard objection</text><text x="151.0" y="480.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">It can license acts that look</text><text x="151.0" y="495.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">monstrous — harming one to spare</text><text x="151.0" y="510.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">five.</text><rect x="288" y="108" width="258" height="440" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="417.0" y="134.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:14px">DEONTOLOGY</text><text x="417.0" y="160.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">Kant&#x27;s is the most influential</text><text x="417.0" y="173.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">version</text><text x="417.0" y="212.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12.5px">Some acts are right or wrong</text><text x="417.0" y="228.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12.5px">in themselves, whatever</text><text x="417.0" y="244.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12.5px">follows from them.</text><text x="417.0" y="300.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">signature move</text><text x="417.0" y="320.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">act only on rules you could will</text><text x="417.0" y="335.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">to be universal; treat people as</text><text x="417.0" y="350.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">ends, never merely as means</text><line x1="314" y1="436" x2="520" y2="436" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="417.0" y="460.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:10.5px">the standard objection</text><text x="417.0" y="480.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">It can be rigid — holding in</text><text x="417.0" y="495.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">edge cases where the result is</text><text x="417.0" y="510.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">awful.</text><rect x="554" y="108" width="258" height="440" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="683.0" y="134.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:14px">VIRTUE ETHICS</text><text x="683.0" y="160.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">Rooted in Aristotle</text><text x="683.0" y="212.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12.5px">The question is not what to do</text><text x="683.0" y="228.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12.5px">but what kind of person to be.</text><text x="683.0" y="300.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">signature move</text><text x="683.0" y="320.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">stable traits — courage,</text><text x="683.0" y="335.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">honesty, justice — that make up</text><text x="683.0" y="350.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">a flourishing life (eudaimonia),</text><text x="683.0" y="365.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">guided by practical wisdom</text><line x1="580" y1="436" x2="786" y2="436" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="683.0" y="460.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:10.5px">the standard objection</text><text x="683.0" y="480.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">It gives thin guidance when you</text><text x="683.0" y="495.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">face a concrete dilemma.</text><rect x="820" y="108" width="258" height="440" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="949.0" y="134.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:14px">CONTRACT THEORIES</text><text x="949.0" y="160.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">Contractarian: Hobbes, Locke,</text><text x="949.0" y="173.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">Rousseau. Contractualist: Rawls,</text><text x="949.0" y="186.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">Scanlon</text><text x="949.0" y="212.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12.5px">Morality is what we would</text><text x="949.0" y="228.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12.5px">agree to — or could not</text><text x="949.0" y="244.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12.5px">reasonably reject.</text><text x="949.0" y="300.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">signature move</text><text x="949.0" y="320.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">Rawls&#x27;s veil of ignorance:</text><text x="949.0" y="335.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">choose the rules without knowing</text><text x="949.0" y="350.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">which life you get</text><line x1="846" y1="436" x2="1052" y2="436" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="949.0" y="460.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:10.5px">the standard objection</text><text x="949.0" y="480.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">The agreement is hypothetical,</text><text x="949.0" y="495.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">so why is anyone bound by it?</text><rect x="22" y="572" width="1036" height="96" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="540.0" y="602.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13.5px">Necessary vs. sufficient</text><text x="540.0" y="623.5" class="" text-anchor="middle" style="font-size:12px">Necessary: without it, no X. Sufficient: with it, X — guaranteed. Many philosophical debates turn on the claim that</text><text x="540.0" y="640.5" class="" text-anchor="middle" style="font-size:12px">some condition is necessary but not sufficient (consciousness for moral status, say), so read the pair carefully; they</text><text x="540.0" y="657.5" class="" text-anchor="middle" style="font-size:12px">are not interchangeable with “important” and “enough”.</text><rect x="22" y="680" width="1036" height="96" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="540.0" y="710.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13.5px">Valid vs. sound</text><text x="540.0" y="731.5" class="" text-anchor="middle" style="font-size:12px">Valid: IF the premises are true the conclusion must be — a fact about structure alone, and a valid argument can have</text><text x="540.0" y="748.5" class="" text-anchor="middle" style="font-size:12px">false premises. Sound: valid AND the premises really are true. An author attacking an argument is attacking its</text><text x="540.0" y="765.5" class="" text-anchor="middle" style="font-size:12px">structure or one of its premises; which of the two they attack is very often the question.</text></svg>