6 L540.0 190.3 L541.5 190.1 L543.0 189.9 L544.5 189.7 L546.0 189.5 L547.5 189.3 L549.0 189.1 L550.5 188.9 L552.0 188.7 L553.5 188.5 L555.0 188.4 L556.5 188.2 L558.0 188.0 L559.5 187.8 L561.0 187.7 L562.5 187.5 L564.0 187.3 L565.5 187.2 L567.0 187.0 L568.5 186.8 L570.0 186.7 L571.5 186.5 L573.0 186.4 L574.5 186.2 L576.0 186.1 L577.5 186.0 L579.0 185.8 L580.5 185.7 L582.0 185.5 L583.5 185.4 L585.0 185.3 L586.5 185.1 L588.0 185.0 L589.5 184.9 L591.0 184.7 L592.5 184.6 L594.0 184.5 L595.5 184.4 L597.0 184.3 L598.5 184.1 L600.0 184.0 L601.5 183.9 L603.0 183.8 L604.5 183.7 L606.0 183.6 L607.5 183.5 L609.0 183.3 L610.5 183.2 L612.0 183.1 L613.5 183.0 L615.0 182.9 L616.5 182.8 L618.0 182.7 L619.5 182.6 L621.0 182.5 L622.5 182.4 L624.0 182.3 L625.5 182.2 L627.0 182.1 L628.5 182.0 L630.0 181.9 L631.5 181.8 L633.0 181.8 L634.5 181.7 L636.0 181.6 L637.5 181.5 L639.0 181.4 L640.5 181.3 L642.0 181.2 L643.5 181.1 L645.0 181.1 L646.5 181.0 L648.0 180.9 L649.5 180.8 L651.0 180.7 L652.5 180.6 L654.0 180.6 L655.5 180.5 L657.0 180.4 L658.5 180.3 L660.0 180.2 L661.5 180.2 L663.0 180.1 L664.5 180.0 L666.0 179.9 L667.5 179.9 L669.0 179.8 L670.5 179.7 L672.0 179.7 L673.5 179.6 L675.0 179.5 L676.5 179.4 L678.0 179.4 L679.5 179.3 L681.0 179.2 L682.5 179.2 L684.0 179.1" stroke="#245574" stroke-width="3" fill="none"/><circle cx="271.5" cy="407.20000000000005" r="5" fill="#a8324a" stroke="#a8324a" stroke-width="1"/><text x="283.5" y="412.2" class="" text-anchor="start" style="fill:#a8324a;font-weight:700;font-size:12px">half-equivalence: pH = pKₐ = 4.76</text><circle cx="459.0" cy="288.1138846728103" r="5" fill="#18364a" stroke="#18364a" stroke-width="1"/><text x="329.0" y="258.1" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">equivalence: pH 8.7 — all</text><text x="329.0" y="273.1" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">acetate, which is itself a</text><text x="329.0" y="288.1" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">weak base</text><rect x="716" y="130" width="420" height="150" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="926.0" y="160.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13.5px">Capacity</text><text x="926.0" y="181.5" class="" text-anchor="middle" style="font-size:12px">Rises with total concentration, and is greatest</text><text x="926.0" y="198.5" class="" text-anchor="middle" style="font-size:12px">where the ratio is 1. Working range: pKₐ ± 1 — at</text><text x="926.0" y="215.5" class="" text-anchor="middle" style="font-size:12px">one unit out, the minor component is down to about</text><text x="926.0" y="232.5" class="" text-anchor="middle" style="font-size:12px">9%.</text><rect x="716" y="286" width="420" height="150" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="926.0" y="316.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13.5px">Choosing one</text><text x="926.0" y="337.5" class="" text-anchor="middle" style="font-size:12px">Match the pKₐ to the target pH, then tune with the</text><text x="926.0" y="354.5" class="" text-anchor="middle" style="font-size:12px">ratio. Acetate 4.76 · phosphate 7.20 · ammonium</text><text x="926.0" y="371.5" class="" text-anchor="middle" style="font-size:12px">9.25.</text><rect x="716" y="442" width="420" height="150" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="926.0" y="472.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13.5px">Why blood breaks the rule</text><text x="926.0" y="493.5" class="" text-anchor="middle" style="font-size:12px">Blood runs at 20:1 — only ~5% of the pair is in the</text><text x="926.0" y="510.5" class="" text-anchor="middle" style="font-size:12px">acid form, which would be a poor closed buffer. But</text><text x="926.0" y="527.5" class="" text-anchor="middle" style="font-size:12px">the lungs set dissolved CO₂ and the kidneys set</text><text x="926.0" y="544.5" class="" text-anchor="middle" style="font-size:12px">HCO₃⁻, so neither component can run out. The</text><text x="926.0" y="561.5" class="" text-anchor="middle" style="font-size:12px">capacity comes from the regulation, not from the</text><text x="926.0" y="578.5" class="" text-anchor="middle" style="font-size:12px">pKₐ.</text><rect x="84" y="624" width="1052" height="96" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="610.0" y="654.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13.5px">Henderson–Hasselbalch, and where it comes from</text><text x="610.0" y="675.5" class="" text-anchor="middle" style="font-size:12px">pH = pKₐ + log([A⁻]/[HA]) is just the Kₐ expression with a logarithm taken. Because it uses a ratio, moles work as well as</text><text x="610.0" y="692.5" class="" text-anchor="middle" style="font-size:12px">molarity — the volume cancels. Add strong acid: A⁻ → HA. Add strong base: HA → A⁻. Do the stoichiometry first, then put the</text><text x="610.0" y="709.5" class="" text-anchor="middle" style="font-size:12px">new amounts into the equation.</text></svg>