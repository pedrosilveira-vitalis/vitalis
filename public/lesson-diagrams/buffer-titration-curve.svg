<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="740" viewBox="0 0 1160 740" role="img" aria-labelledby="t d"><title id="t">The flat part is the buffer</title><desc id="d">A titration curve for fifty millilitres of 0.10 molar acetic acid titrated with 0.10 molar sodium hydroxide, pH plotted against millilitres of base added. The curve begins near pH 2.9, rises steeply at first, then flattens through a long buffering region before climbing sharply through the equivalence point at fifty millilitres and levelling off above pH 12. The buffering region, shaded, runs from one pKa unit below to one pKa unit above 4.76, which corresponds to roughly nine to forty-one millilitres of base. The half-equivalence point at twenty-five millilitres is marked: there exactly half the acid has been converted, the ratio of conjugate base to acid is one, the logarithm term vanishes and the pH equals the pKa of 4.76. The equivalence point at fifty millilitres is marked at a pH near 8.7, above seven because all the acid has become acetate, which is itself a weak base. Three panels beside the curve. The first, buffer capacity, notes that capacity rises with total concentration and is greatest where the ratio is one, that the working range is the pKa plus or minus one unit, and that at one unit away the minor component is down to about nine per cent. The second, choosing a buffer, says to match the pKa to the target pH and then tune with the ratio, giving acetate at four point seven six, phosphate at seven point two and ammonium at nine point two five as the standard choices. The third, the open system, explains why blood works at a ratio of twenty to one, which would be a poor closed buffer with only about five per cent of the pair in the acid form: the lungs continuously set the dissolved carbon dioxide and the kidneys set the bicarbonate, so neither component runs out, and the capacity comes from the regulation rather than from the position of the pKa.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1160" height="740" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">The flat part is the buffer</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">A titration curve is a buffer being used up. The flattest point is where the acid and its conjugate base are equal — and that is pH = pKₐ.</text><line x1="84" y1="550" x2="684" y2="550" stroke="#18364a" stroke-width="2"/><line x1="84" y1="130" x2="84" y2="550" stroke="#18364a" stroke-width="2"/><text x="384.0" y="594.0" class="" text-anchor="middle" style="font-size:17px">mL of 0.10 M NaOH added</text><text x="40" y="340.0" text-anchor="middle" transform="rotate(-90 40 340.0)" style="font-size:17px">pH</text><line x1="84.0" y1="550.0" x2="84.0" y2="556.0" stroke="#18364a" stroke-width="2"/><text x="84.0" y="572.0" class="" text-anchor="middle" style="font-size:14px">0</text><line x1="159.0" y1="550.0" x2="159.0" y2="556.0" stroke="#18364a" stroke-width="2"/><text x="159.0" y="572.0" class="" text-anchor="middle" style="font-size:14px">10</text><line x1="234.0" y1="550.0" x2="234.0" y2="556.0" stroke="#18364a" stroke-width="2"/><text x="234.0" y="572.0" class="" text-anchor="middle" style="font-size:14px">20</text><line x1="309.0" y1="550.0" x2="309.0" y2="556.0" stroke="#18364a" stroke-width="2"/><text x="309.0" y="572.0" class="" text-anchor="middle" style="font-size:14px">30</text><line x1="384.0" y1="550.0" x2="384.0" y2="556.0" stroke="#18364a" stroke-width="2"/><text x="384.0" y="572.0" class="" text-anchor="middle" style="font-size:14px">40</text><line x1="459.0" y1="550.0" x2="459.0" y2="556.0" stroke="#18364a" stroke-width="2"/><text x="459.0" y="572.0" class="" text-anchor="middle" style="font-size:14px">50</text><line x1="534.0" y1="550.0" x2="534.0" y2="556.0" stroke="#18364a" stroke-width="2"/><text 