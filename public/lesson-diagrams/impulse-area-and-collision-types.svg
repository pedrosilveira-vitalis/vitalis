<svg xmlns="http://www.w3.org/2000/svg" width="920" height="790" viewBox="0 0 920 790" role="img" aria-labelledby="t d"><title id="t">Impulse is the area; momentum is the thing that survives</title><desc id="d">Left: a force-versus-time graph with two pulses of equal area, a tall narrow one for a hard landing and a low wide one for a padded landing, showing that the same change in momentum can be delivered by a large force for a short time or a small force for a long time. Right: a table of collision types showing that momentum is conserved in all of them while kinetic energy is conserved only in elastic collisions. Bottom: the condition for conservation, the two separate steps of the ballistic pendulum, and the equal-mass elastic special cases.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="790" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Impulse is the area; momentum is the thing that survives</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Same Δp spread over a longer time means a smaller average force</text><rect x="40" y="112" width="430" height="356" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="255.0" y="142.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">Same area, different peak</text><line x1="96" y1="352" x2="426" y2="352" stroke="#18364a" stroke-width="2"/><line x1="96" y1="178" x2="96" y2="352" stroke="#18364a" stroke-width="2"/><text x="261.0" y="396.0" class="" text-anchor="middle" style="font-size:17px">time</text><text x="52" y="265.0" text-anchor="middle" transform="rotate(-90 52 265.0)" style="font-size:17px">force</text><path d="M96.0 352.0 L145.5 195.4 L195.0 352.0 Z" stroke="#a8324a" stroke-width="2.5" fill="#f5e6e8"/><path d="M195.0 352.0 L310.5 284.8 L426.0 352.0 Z" stroke="#5b7a64" stroke-width="2.5" fill="#e5ece3"/><text x="145.5" y="265.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">J</text><text x="310.5" y="322.4" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">J</text><text x="145.5" y="179.7" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">hard landing</text><text x="310.5" y="265.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">airbag, padding, bent knees</text><text x="255.0" y="428.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">J = area under F–t = Δp = mvᶠ − mvᵢ</text><text x="255.0" y="452.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">F_avg = Δp / Δt — fix Δp, stretch Δt, and F falls</text><rect x="486" y="112" width="394" height="356" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="683.0" y="142.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">What survives each collision</text><rect x="506" y="168" width="356" height="60" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="524.0" y="192.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:16px">elastic</text><text x="844.0" y="192.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:15px">p ✓   KE ✓</text><text x="524.0" y="214.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">steel balls, molecules</text><rect x="506" y="236" width="356" height="60" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="524.0" y="260.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:16px">inelastic</text><text x="844.0" y="260.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:15px">p ✓   KE ✗</text><text x="524.0" y="282.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">most real collisions</text><rect x="506" y="304" width="356" height="60" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="524.0" y="328.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:16px">perfectly inelastic</text><text x="844.0" y="328.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:15px">p ✓   KE ✗ (max loss)</text><text x="524.0" y="350.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">they stick: vᶠ = Σmv / Σm</text><rect x="506" y="372" width="356" height="60" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="524.0" y="396.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:16px">explosion / recoil</text><text x="844.0" y="396.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:15px">p ✓   KE rises</text><text x="524.0" y="418.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">starts at rest: Σp stays 0</text><text x="683.0" y="452.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">Momentum is conserved in every row; kinetic energy only in the first</text><rect x="40" y="498" width="280" height="162" rx="10" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="180.0" y="528.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">When is p conserved?</text><text x="180.0" y="558.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">ΣF_external = 0</text><text x="180.0" y="584.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">internal forces cancel in pairs</text><text x="180.0" y="610.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">brief collisions: gravity&#x27;s</text><text x="180.0" y="636.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">impulse is negligible</text><rect x="320" y="498" width="280" height="162" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="460.0" y="528.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">Ballistic pendulum: 2 steps</text><text x="460.0" y="558.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">1. collision: mv = (m+M)v′</text><text x="460.0" y="584.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">2. swing: ½(m+M)v′² = (m+M)gh</text><text x="460.0" y="610.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">never carry KE across</text><text x="460.0" y="636.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">the collision itself</text><rect x="600" y="498" width="280" height="162" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="740.0" y="528.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">Equal masses, elastic</text><text x="740.0" y="558.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">head-on: they swap velocities</text><text x="740.0" y="584.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">glancing: they separate at 90°</text><text x="740.0" y="610.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">light vs heavy wall: bounces</text><text x="740.0" y="636.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">back at nearly the same speed</text><text x="460.0" y="706.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">p = mv is a vector: a reversal flips its sign, so Δp can exceed either momentum alone</text><text x="460.0" y="738.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">A ball hitting 40 m/s and leaving at 50 m/s the other way changes by 90 m/s worth, not 10</text><text x="460.0" y="768.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Units: kg·m/s = N·s</text></svg>