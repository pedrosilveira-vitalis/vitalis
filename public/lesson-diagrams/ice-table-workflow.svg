<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="920" viewBox="0 0 1180 920" role="img" aria-labelledby="t d"><title id="t">Q first, then the ICE table</title><desc id="d">A five-step workflow runs down the left: write the balanced equation and the equilibrium expression, excluding pure solids and liquids; compute the reaction quotient from the concentrations you were given; compare it with the equilibrium constant, which fixes the direction and therefore the sign of x; build the initial, change and equilibrium rows; and solve, then check by substituting back. A branch below sets out the three ways to solve: if both sides are perfect squares, take the square root of the whole expression, which is much faster than expanding; if the equilibrium constant is small enough that the initial concentration divided by it exceeds four hundred, drop x from the denominator and take x as the square root of the constant times the initial concentration; otherwise expand and use the quadratic formula. A worked table shows hydrogen plus iodine giving hydrogen iodide with a constant of 49: initial values of 1.00, 1.00 and zero, changes of minus x, minus x and plus 2x, equilibrium values of one minus x, one minus x and 2x, and the perfect-square shortcut giving 2x over one minus x equals seven, so x is 0.778 and the hydrogen iodide concentration is 1.56 molar. A second panel shows how the sign of x flips: when the quotient is below the constant the reaction runs forward, so reactants take minus x and products plus x; when the quotient is above the constant the reaction runs backwards, so reactants take plus x and products minus x. A footer gives the validity test for dropping x: the approximation holds when x is under five per cent of the initial concentration, which because x is the square root of the constant times the concentration means the concentration must exceed four hundred times the constant, not one hundred, since a ratio of one hundred gives a ten per cent error and fails the test.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1180" height="920" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Q first, then the ICE table</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Q decides which way x points. Get that wrong and every number after it is wrong — so it is step two, before the table is drawn.</text><rect x="24" y="150" width="520" height="258" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="284.0" y="178.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">THE ORDER THAT KEEPS YOU OUT OF TROUBLE</text><text x="50.0" y="210.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:14px">1</text><text x="76.0" y="210.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">Write the equation and K</text><text x="76.0" y="227.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">exclude pure solids and liquids</text><text x="50.0" y="250.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:14px">2</text><text x="76.0" y="250.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">Compute Q from what you were given</text><text x="76.0" y="267.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">same expression, current values</text><text x="50.0" y="290.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:14px">3</text><text x="76.0" y="290.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">Compare Q with K</text><text x="76.0" y="307.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">this fixes the DIRECTION — and the sign of x</text><text x="50.0" y="330.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:14px">4</text><text x="76.0" y="330.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">Build the I, C, E rows</text><text x="76.0" y="347.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">coefficients multiply x</text><text x="50.0" y="370.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:14px">5</text><text x="76.0" y="370.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">Solve, then substitute back to check</text><text x="284.0" y="392.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:11px">Step 2 is the one people skip — and it is the one that sets the sign</text><rect x="24" y="428" width="520" height="236" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="284.0" y="456.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12.5px">THREE WAYS TO SOLVE — PICK BEFORE YOU EXPAND</text><text x="48.0" y="490.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:11.5px">both sides a perfect square</text><text x="48.0" y="507.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">take √ of the WHOLE expression</text><text x="520.0" y="498.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:11.5px">2x/(c−x) = √K</text><text x="48.0" y="540.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:11.5px">K small:  C / K &gt; 400</text><text x="48.0" y="557.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">drop x from the denominator</text><text x="520.0" y="548.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:11.5px">x ≈ √(K·C)</text><text x="48.0" y="590.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:11.5px">anything else</text><text x="48.0" y="607.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">expand and use the quadratic</text><text x="520.0" y="598.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:11.5px">x = (−b ± √(b²−4ac)) / 2a</text><text x="284.0" y="644.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:11px">Spotting the perfect square saves more time than any other move in equilibrium</text><rect x="564" y="150" width="588" height="300" rx="12" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="858.0" y="178.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:12.5px">WORKED — H₂ + I₂ ⇌ 2HI,  Kᴄ = 49</text><text x="760.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12.5px">H₂</text><text x="900.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12.5px">I₂</text><text x="1040.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12.5px">HI</text><text x="604.0" y="234.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:700;font-size:12px">I</text><text x="760.0" y="234.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">1.00</text><text x="900.0" y="234.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">1.00</text><text x="1040.0" y="234.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">0</text><text x="604.0" y="260.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:700;font-size:12px">C</text><text x="760.0" y="260.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">−x</text><text x="900.0" y="260.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">−x</text><text x="1040.0" y="260.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">+2x</text><text x="604.0" y="286.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:700;font-size:12px">E</text><text x="760.0" y="286.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">1.00 − x</text><text x="900.0" y="286.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">1.00 − x</text><text x="1040.0" y="286.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">2x</text><line x1="596" y1="318" x2="1120" y2="318" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="858.0" y="340.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:400;font-size:11.5px">Kᴄ = (2x)² / (1.00 − x)²  —  a perfect square on both sides</text><text x="858.0" y="363.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:400;font-size:11.5px">√ both sides:   2x / (1.00 − x) = 7</text><text x="858.0" y="386.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:400;font-size:11.5px">2x = 7 − 7x   →   9x = 7   →   x = 0.778</text><text x="858.0" y="409.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:11.5px">[H₂] = [I₂] = 0.222 M      [HI] = 2x = 1.56 M</text><text x="858.0" y="436.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:11px">check: (1.56)² / (0.222)² = 49.1 ✓</text><rect x="564" y="470" width="588" height="194" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="858.0" y="498.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12.5px">THE SIGN OF x FLIPS WITH Q</text><text x="712.0" y="526.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:11.5px">Q &lt; K  — runs FORWARD</text><text x="1004.0" y="526.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:11.5px">Q &gt; K  — runs BACKWARD</text><text x="596.0" y="554.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">reactants</text><text x="712.0" y="554.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:13px">−x</text><text x="1004.0" y="554.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:13px">+x</text><text x="596.0" y="580.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">products</text><text x="712.0" y="580.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:13px">+x</text><text x="1004.0" y="580.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:13px">−x</text><text x="858.0" y="624.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:11px">Set the signs from Q, not from habit — products are not always “plus”</text><rect x="24" y="688" width="1128" height="110" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="588.0" y="718.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13.5px">When may you drop x? The test that is usually quoted wrong</text><text x="588.0" y="739.5" class="" text-anchor="middle" style="font-size:12px">The approximation holds when x is under 5% of the initial concentration. Since x ≈ √(K·C), that means √(K/C) &lt; 0.05, so C must exceed 400×K — not</text><text x="588.0" y="756.5" class="" text-anchor="middle" style="font-size:12px">100×K. A ratio of 100 gives √(1/100) = 10%, which fails the 5% test outright. Worked: acetic acid, Kₐ = 1.8×10⁻⁵, needs C &gt; 7.2×10⁻³ M. At 0.10 M</text><text x="588.0" y="773.5" class="" text-anchor="middle" style="font-size:12px">the shortcut is fine (1.3% dissociated); at 0.0010 M it is not (13%), and the quadratic is required.</text><rect x="24" y="814" width="1128" height="86" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="588.0" y="844.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13.5px">Two more things that change the table</text><text x="588.0" y="865.5" class="" text-anchor="middle" style="font-size:12px">PRODUCTS PRESENT AT THE START do not change the method — they change the initial row, and Q tells you which way x then runs. · A PURE SOLID OR</text><text x="588.0" y="882.5" class="" text-anchor="middle" style="font-size:12px">LIQUID has no row at all: its amount never enters Q, which is why adding more CaCO₃ to CaCO₃(s) ⇌ CaO(s) + CO₂(g) shifts nothing.</text></svg>