<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="t d"><title id="t">How CO₂ travels to the lungs, and the four acid–base disorders</title><desc id="d">Top: CO2 from tissue enters a red blood cell. Carbonic anhydrase converts CO2 and water to carbonic acid, which dissociates to H+ and bicarbonate. Bicarbonate leaves the cell through band 3 in exchange for chloride (the chloride shift); H+ is buffered by deoxyhemoglobin; some CO2 binds globin amino groups as carbaminohemoglobin; a little stays dissolved. Approximate shares: bicarbonate 70 percent, carbamino 20 to 23 percent, dissolved 7 to 10 percent. Bottom table: respiratory acidosis has high PCO2 with compensatory high bicarbonate; respiratory alkalosis low PCO2 and low bicarbonate; metabolic acidosis low bicarbonate and low PCO2; metabolic alkalosis high bicarbonate and high PCO2.</desc><defs><marker id="m2484" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker><marker id="m3224" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b7a64"/></marker><marker id="m4608" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker><marker id="m7293" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker><marker id="m871" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#987740"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="650" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">How CO₂ travels to the lungs, and the four acid–base disorders</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Top: events at a systemic capillary (they reverse in the lungs). Bottom: primary change and compensation.</text><rect x="40" y="100" width="160" height="260" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="120.0" y="135.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700">Tissue</text><text x="120.0" y="230.0" class="" text-anchor="middle" style="font-weight:700;font-size:24px">CO₂</text><rect x="260" y="100" width="470" height="260" rx="90" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="495.0" y="132.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700">Red blood cell</text><line x1="160" y1="225" x2="285" y2="225" stroke="#18364a" stroke-width="3" marker-end="url(#m2484)"/><text x="340.0" y="230.0" class="" text-anchor="middle" style="font-weight:700">CO₂ + H₂O</text><line x1="400" y1="225" x2="465" y2="225" stroke="#18364a" stroke-width="2.5" marker-end="url(#m2484)"/><text x="432.5" y="215.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">CA</text><text x="500.0" y="230.0" class="" text-anchor="middle" style="font-weight:700">H₂CO₃</text><line x1="540" y1="225" x2="590" y2="225" stroke="#18364a" stroke-width="2.5" marker-end="url(#m2484)"/><text x="640.0" y="215.0" class="" text-anchor="middle" style="font-weight:700">H⁺ + HCO₃⁻</text><line x1="640" y1="240" x2="610" y2="290" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m7293)"/><text x="610.0" y="312.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:15px">H⁺ buffered</text><text x="610.0" y="331.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:15px">by deoxy-Hb</text><line x1="345" y1="245" x2="345" y2="290" stroke="#245574" stroke-width="2.5" marker-end="url(#m4608)"/><text x="370.0" y="312.0" class="" text-anchor="middle" style="fill:#245574;font-size:15px">CO₂ + globin–NH₂</text><text x="370.0" y="331.0" class="" text-anchor="middle" style="fill:#245574;font-size:15px">→ carbamino-Hb</text><rect x="800" y="100" width="170" height="260" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="885.0" y="135.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700">Plasma</text><line x1="690" y1="200" x2="830" y2="200" stroke="#5b7a64" stroke-width="3" marker-end="url(#m3224)"/><text x="885.0" y="205.0" class="" text-anchor="middle" style="font-size:15px">HCO₃⁻ (~70%)</text><line x1="830" y1="250" x2="700" y2="250" stroke="#987740" stroke-width="3" marker-end="url(#m871)"/><text x="885.0" y="255.0" class="" text-anchor="middle" style="font-size:15px">Cl⁻ in</text><text x="762.0" y="180.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:14px">band 3</text><text x="885.0" y="300.0" class="" text-anchor="middle" style="font-size:15px">dissolved CO₂</text><text x="885.0" y="320.0" class="" text-anchor="middle" style="font-size:15px">(~7–10%)</text><text x="495.0" y="385.0" class="" text-anchor="middle" style="font-size:15px">Chloride shift keeps the RBC electrically neutral. Carbamino-Hb carries ~20–23%.</text><text x="80.0" y="420.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:17px">Disorder</text><text x="420.0" y="420.0" class="" text-anchor="start" style="font-weight:700;font-size:17px">Primary change</text><text x="600.0" y="420.0" class="" text-anchor="start" style="font-weight:700;font-size:17px">Compensation</text><rect x="60" y="438" width="880" height="44" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="1"/><text x="80.0" y="468.0" class="" text-anchor="start" style="fill:#a8324a;font-size:17px">Respiratory acidosis</text><text x="420.0" y="468.0" class="" text-anchor="start" style="font-size:17px">↑ PCO₂</text><text x="600.0" y="468.0" class="" text-anchor="start" style="font-size:17px">↑ HCO₃⁻ (kidney, days)</text><rect x="60" y="486" width="880" height="44" rx="6" fill="#e4edf3" stroke="#245574" stroke-width="1"/><text x="80.0" y="516.0" class="" text-anchor="start" style="fill:#245574;font-size:17px">Respiratory alkalosis</text><text x="420.0" y="516.0" class="" text-anchor="start" style="font-size:17px">↓ PCO₂</text><text x="600.0" y="516.0" class="" text-anchor="start" style="font-size:17px">↓ HCO₃⁻ (kidney, days)</text><rect x="60" y="534" width="880" height="44" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="1"/><text x="80.0" y="564.0" class="" text-anchor="start" style="fill:#a8324a;font-size:17px">Metabolic acidosis</text><text x="420.0" y="564.0" class="" text-anchor="start" style="font-size:17px">↓ HCO₃⁻</text><text x="600.0" y="564.0" class="" text-anchor="start" style="font-size:17px">↓ PCO₂ (lungs, minutes–hours)</text><rect x="60" y="582" width="880" height="44" rx="6" fill="#e4edf3" stroke="#245574" stroke-width="1"/><text x="80.0" y="612.0" class="" text-anchor="start" style="fill:#245574;font-size:17px">Metabolic alkalosis</text><text x="420.0" y="612.0" class="" text-anchor="start" style="font-size:17px">↑ HCO₃⁻</text><text x="600.0" y="612.0" class="" text-anchor="start" style="font-size:17px">↑ PCO₂ (lungs, limited)</text></svg>