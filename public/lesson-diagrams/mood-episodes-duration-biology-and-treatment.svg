<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1018" viewBox="0 0 920 1018" role="img" aria-labelledby="t d"><title id="t">Mood episodes are sorted by duration and by damage</title><desc id="d">Top: the mood episodes laid out against duration, with the severity line that separates hypomania from mania. Four days with no marked impairment is hypomania; a week, or any length that lands the person in hospital, is mania; psychotic features during the episode make it mania whatever its length. Which episodes a person has had, not how they look today, fixes the diagnosis — which is why bipolar II so often gets called unipolar depression. Bottom left: the three biological threads, and the one observation the monoamine story alone cannot explain, the weeks-long lag before the drug works. Bottom right: the treatment lines, including the one combination that is actively dangerous.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="1018" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Mood episodes are sorted by duration and by damage</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Two axes decide the diagnosis: how long it lasted and how much it broke</text><rect x="40" y="180" width="840" height="344" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">Duration, and the severity line</text><text x="64.0" y="248.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:10px">ELEVATED</text><rect x="150" y="232" width="180" height="30" rx="6" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="240.0" y="252.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:11px">HYPOMANIA · ≥ 4 days</text><rect x="350" y="232" width="240" height="30" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="470.0" y="252.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">MANIA · ≥ 7 days</text><rect x="610" y="232" width="244" height="30" rx="6" fill="none" stroke="#a8324a" stroke-width="1.8"/><text x="732.0" y="252.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">…or any length, if hospitalised</text><text x="240.0" y="282.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">no marked impairment</text><text x="470.0" y="282.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">marked impairment, may be psychotic</text><line x1="96" y1="302" x2="854" y2="302" stroke="#6d716f" stroke-width="1.6" stroke-dasharray="6 5"/><text x="475.0" y="318.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">the severity line — impairment, hospitalisation or psychosis makes it mania</text><text x="64.0" y="352.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:10px">DEPRESSED</text><rect x="150" y="336" width="240" height="30" rx="6" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="270.0" y="356.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">MAJOR DEPRESSIVE EPISODE · ≥ 2 weeks</text><rect x="410" y="336" width="300" height="30" rx="6" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="560.0" y="356.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">PERSISTENT DEPRESSIVE DISORDER · ≥ 2 years</text><text x="270.0" y="386.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">5 of 9 symptoms, one of them low mood or anhedonia</text><text x="560.0" y="386.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">never symptom-free for 2 months at a stretch</text><line x1="96" y1="406" x2="854" y2="406" stroke="#6d716f" stroke-width="1" stroke-dasharray="6 5"/><text x="460.0" y="428.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">the diagnosis follows the episodes a person has EVER had</text><rect x="68" y="444" width="192" height="62" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="164.0" y="466.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11.5px">BIPOLAR I</text><text x="164.0" y="486.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">one manic episode, ever</text><rect x="268" y="444" width="192" height="62" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="364.0" y="466.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:11.5px">BIPOLAR II</text><text x="364.0" y="480.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">hypomania + a depressive episode,</text><text x="364.0" y="493.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">never mania</text><rect x="468" y="444" width="192" height="62" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="564.0" y="466.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11.5px">MDD</text><text x="564.0" y="486.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">depressive episodes only</text><rect x="668" y="444" width="192" height="62" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="764.0" y="466.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11.5px">CYCLOTHYMIA</text><text x="764.0" y="486.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">sub-threshold both ways, ≥ 2 years</text><rect x="40" y="540" width="410" height="462" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="245.0" y="568.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">Three biological threads</text><rect x="64" y="590" width="362" height="76" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="245.0" y="614.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">MONOAMINES</text><text x="245.0" y="634.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">5-HT, noradrenaline, dopamine low at the synapse.</text><text x="245.0" y="649.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">Every classical antidepressant raises them.</text><rect x="64" y="676" width="362" height="76" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="245.0" y="700.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">HPA AXIS</text><text x="245.0" y="720.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">cortisol high, dexamethasone fails to suppress it,</text><text x="245.0" y="735.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">CRH raised — and the hippocampus shrinks.</text><rect x="64" y="762" width="362" height="76" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="245.0" y="786.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">NEUROPLASTICITY</text><text x="245.0" y="806.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">BDNF down; antidepressants, exercise and ECT</text><text x="245.0" y="821.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">all push it back up.</text><rect x="64" y="852" width="362" height="130" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="245.0" y="878.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">THE AWKWARD FACT</text><text x="245.0" y="900.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">Synaptic serotonin rises within hours.</text><text x="245.0" y="915.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">The patient gets better in two to six weeks.</text><text x="245.0" y="930.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">So the monoamine rise is the trigger, not the cure —</text><text x="245.0" y="945.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">the slow part is receptor and plasticity change.</text><text x="245.0" y="960.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">Ketamine skips it: NMDA block, AMPA potentiation,</text><text x="245.0" y="975.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">BDNF release, relief in hours.</text><rect x="470" y="540" width="410" height="462" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="675.0" y="568.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">What is given, and why</text><rect x="494" y="590" width="362" height="40" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.6"/><text x="675.0" y="608.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">SSRI / SNRI</text><text x="675.0" y="624.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">first line for depression; block SERT, and NET too</text><rect x="494" y="637" width="362" height="52" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.6"/><text x="675.0" y="655.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">TCA</text><text x="675.0" y="671.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">same blockade plus H1, muscarinic, alpha — and lethal</text><text x="675.0" y="685.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">in overdose through cardiac sodium channels</text><rect x="494" y="696" width="362" height="52" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.6"/><text x="675.0" y="714.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">MAOI</text><text x="675.0" y="730.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">works well for atypical features; tyramine foods</text><text x="675.0" y="744.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">risk hypertensive crisis</text><rect x="494" y="755" width="362" height="40" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.6"/><text x="675.0" y="773.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">BUPROPION</text><text x="675.0" y="789.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">dopamine and noradrenaline; no sexual side effects</text><rect x="494" y="802" width="362" height="52" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><text x="675.0" y="820.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">LITHIUM</text><text x="675.0" y="836.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">first line in bipolar; GSK-3β and inositol;</text><text x="675.0" y="850.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">narrow window 0.6–1.2 mEq/L</text><rect x="494" y="861" width="362" height="40" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><text x="675.0" y="879.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">VALPROATE · LAMOTRIGINE</text><text x="675.0" y="895.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">mania; and lamotrigine for the depressed pole</text><rect x="494" y="912" width="362" height="64" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2.4"/><text x="675.0" y="936.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">DO NOT: antidepressant alone in bipolar</text><text x="675.0" y="956.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">it can flip the patient into mania or rapid cycling</text></svg>