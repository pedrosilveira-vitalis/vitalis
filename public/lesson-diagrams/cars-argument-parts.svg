<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="t d"><title id="t">The parts of an argument, and the shapes they make</title><desc id="d">Left, the three parts stacked: a claim, the contestable assertion the author wants you to accept; evidence, the material offered in support, such as data, examples, expert testimony or analogy; and reasoning, the unstated bridge that must hold for the evidence to support the claim. A note says the reasoning layer is usually left implicit, and that assumption, strengthen and weaken questions all target it. Right, four recurring passage shapes: thesis and support, where the claim comes early and the rest of the passage backs it; problem and solution, which turns on a pivot such as what is needed instead; dialectical, which presents one position, critiques it, then offers the author&#x27;s own; and concession and rebuttal, where a point is granted with admittedly or it is true that before nevertheless or yet introduces the real argument. A footer warns that the author&#x27;s position sits in the refutation, not in the concession, and that describing a view at length is not endorsing it.</desc><defs><marker id="m9954" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="640" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">The parts of an argument, and the shapes they make</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Every CARS passage is an argument. Find the claim, the evidence, and the reasoning that joins them.</text><text x="50.0" y="124.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:17px">The three parts</text><rect x="50" y="148" width="390" height="92" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="245.0" y="178.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:16px">CLAIM</text><text x="245.0" y="202.0" class="" text-anchor="middle" style="font-size:13px">a contestable assertion the author wants you to accept</text><line x1="245" y1="240" x2="245" y2="260" stroke="#18364a" stroke-width="2.5" marker-end="url(#m9954)"/><rect x="50" y="260" width="390" height="92" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="245.0" y="290.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:16px">EVIDENCE</text><text x="245.0" y="314.0" class="" text-anchor="middle" style="font-size:13px">data, examples, expert testimony, analogy, demonstration</text><line x1="245" y1="352" x2="245" y2="372" stroke="#18364a" stroke-width="2.5" marker-end="url(#m9954)"/><rect x="50" y="372" width="390" height="92" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="245.0" y="402.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:16px">REASONING</text><text x="245.0" y="426.0" class="" text-anchor="middle" style="font-size:13px">the unstated bridge: why that evidence supports that</text><text x="245.0" y="444.0" class="" text-anchor="middle" style="font-size:13px">claim</text><rect x="50" y="484" width="390" height="124" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="245.0" y="514.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:15px">Where the hard questions live</text><text x="245.0" y="537.0" class="" text-anchor="middle" style="font-size:13px">The reasoning layer is almost always implicit.</text><text x="245.0" y="555.0" class="" text-anchor="middle" style="font-size:13px">Assumption, strengthen and weaken questions all ask: what</text><text x="245.0" y="573.0" class="" text-anchor="middle" style="font-size:13px">must be true for this evidence to support this claim?</text><text x="530.0" y="124.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:17px">Four recurring shapes</text><rect x="530" y="148" width="420" height="78" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="740.0" y="178.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:16px">Thesis + support</text><text x="740.0" y="202.0" class="" text-anchor="middle" style="font-size:13px">claim stated early · the rest builds the case</text><rect x="530" y="236" width="420" height="78" rx="12" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="740.0" y="266.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:16px">Problem → solution</text><text x="740.0" y="290.0" class="" text-anchor="middle" style="font-size:13px">watch for the pivot: &quot;what is needed instead&quot;</text><rect x="530" y="324" width="420" height="78" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="740.0" y="354.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:16px">Dialectical</text><text x="740.0" y="378.0" class="" text-anchor="middle" style="font-size:13px">position A → critique of A → author&#x27;s position B</text><rect x="530" y="412" width="420" height="78" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="740.0" y="442.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:16px">Concession → rebuttal</text><text x="740.0" y="466.0" class="" text-anchor="middle" style="font-size:13px">&quot;admittedly…&quot; then &quot;nevertheless…&quot;</text><rect x="530" y="500" width="420" height="108" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="740.0" y="530.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:15px">The trap</text><text x="740.0" y="553.0" class="" text-anchor="middle" style="font-size:13px">The author&#x27;s position is in the refutation, not the</text><text x="740.0" y="571.0" class="" text-anchor="middle" style="font-size:13px">concession. Explaining a view at length — even generously — is</text><text x="740.0" y="589.0" class="" text-anchor="middle" style="font-size:13px">not endorsing it.</text></svg>