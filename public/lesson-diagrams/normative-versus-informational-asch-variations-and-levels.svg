<svg xmlns="http://www.w3.org/2000/svg" width="920" height="972" viewBox="0 0 920 972" role="img" aria-labelledby="t d"><title id="t">Two reasons to go along, and what each leaves behind</title><desc id="d">Top: normative and informational influence side by side, with the two experiments that isolate them. Asch&#x27;s lines were unambiguous — participants could see the right answer and said the wrong one anyway, which is normative influence and leaves private belief intact. Sherif&#x27;s moving dot was genuinely ambiguous — participants had nothing to go on but each other, which is informational influence and the group norm stayed with them when they were later tested alone. Middle: Asch&#x27;s variations, each one isolating a single factor, with the ally result that matters most. Bottom: the levels of change, and the two phenomena at the far ends — a consistent minority that converts the majority, and a cohesive group that talks itself into a bad decision.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="972" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Two reasons to go along, and what each leaves behind</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">One changes what you say; the other changes what you believe</text><rect x="40" y="180" width="840" height="272" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">Why people go along</text><rect x="70" y="228" width="390" height="206" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="265.0" y="254.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">NORMATIVE</text><text x="265.0" y="274.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">“I want to belong”</text><line x1="110" y1="288" x2="420" y2="288" stroke="#a8324a" stroke-width="1" stroke-dasharray="6 5"/><text x="265.0" y="310.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:10px">the situation is CLEAR — you know the answer</text><text x="265.0" y="330.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:10px">you say the group&#x27;s answer anyway</text><text x="265.0" y="350.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">public compliance, private belief UNCHANGED</text><text x="265.0" y="370.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:10px">needs an audience: anonymity kills it</text><rect x="130" y="396" width="270" height="26" rx="6" fill="none" stroke="#a8324a" stroke-width="1.6"/><text x="265.0" y="414.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">ASCH · the lines</text><rect x="460" y="228" width="390" height="206" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="655.0" y="254.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">INFORMATIONAL</text><text x="655.0" y="274.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">“they probably know better”</text><line x1="500" y1="288" x2="810" y2="288" stroke="#245574" stroke-width="1" stroke-dasharray="6 5"/><text x="655.0" y="310.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:10px">the situation is AMBIGUOUS — you don&#x27;t know</text><text x="655.0" y="330.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:10px">you use the group as evidence</text><text x="655.0" y="350.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">private acceptance: the belief CHANGES</text><text x="655.0" y="370.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:10px">survives being alone afterwards</text><rect x="520" y="396" width="270" height="26" rx="6" fill="none" stroke="#245574" stroke-width="1.6"/><text x="655.0" y="414.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">SHERIF · the moving dot</text><rect x="40" y="468" width="840" height="230" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="496.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">What Asch changed, and what happened</text><text x="460.0" y="520.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10.5px">baseline: about 32% of critical trials conformed; 75% conformed at least once; 25% never did</text><rect x="60" y="540" width="200" height="142" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="160.0" y="564.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:11px">GROUP SIZE</text><rect x="84" y="574" width="152" height="24" rx="5" fill="none" stroke="#987740" stroke-width="1.4"/><text x="160.0" y="591.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:9.5px">1 → 3 or 4</text><text x="160.0" y="620.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">conformity climbs, then flattens;</text><text x="160.0" y="635.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">fifteen is no worse than four</text><rect x="265" y="540" width="200" height="142" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="365.0" y="564.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">ONE ALLY</text><rect x="289" y="574" width="152" height="24" rx="5" fill="none" stroke="#5b7a64" stroke-width="1.4"/><text x="365.0" y="591.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:9.5px">unanimity broken</text><text x="365.0" y="620.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">32% → about 5%</text><text x="365.0" y="635.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">the ally need not even be right</text><rect x="470" y="540" width="200" height="142" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="570.0" y="564.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">WRITE IT DOWN</text><rect x="494" y="574" width="152" height="24" rx="5" fill="none" stroke="#245574" stroke-width="1.4"/><text x="570.0" y="591.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:9.5px">no audience</text><text x="570.0" y="620.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">conformity falls sharply —</text><text x="570.0" y="635.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">the normative motive evaporates</text><rect x="675" y="540" width="200" height="142" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="775.0" y="564.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">HARDER LINES</text><rect x="699" y="574" width="152" height="24" rx="5" fill="none" stroke="#a8324a" stroke-width="1.4"/><text x="775.0" y="591.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:9.5px">task made ambiguous</text><text x="775.0" y="620.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">conformity RISES — now it is</text><text x="775.0" y="635.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">informational, not normative</text><rect x="40" y="714" width="410" height="238" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="245.0" y="742.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">How deep did the change go?</text><rect x="64" y="762" width="362" height="58" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.6"/><text x="245.0" y="783.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:11px">COMPLIANCE</text><text x="245.0" y="799.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">goes along in public, disagrees in private;</text><text x="245.0" y="812.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">stops when the group stops watching</text><rect x="64" y="824" width="362" height="58" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.6"/><text x="245.0" y="845.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">IDENTIFICATION</text><text x="245.0" y="861.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">adopts it to keep a valued relationship;</text><text x="245.0" y="874.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">lasts as long as the relationship does</text><rect x="64" y="886" width="362" height="58" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="245.0" y="907.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">INTERNALISATION</text><text x="245.0" y="923.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">genuinely believes it now;</text><text x="245.0" y="936.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">persists with no group present at all</text><rect x="470" y="714" width="410" height="238" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="675.0" y="742.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">Two things at the edges</text><rect x="494" y="762" width="362" height="86" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="675.0" y="784.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">MINORITY INFLUENCE</text><text x="675.0" y="802.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">a small group that stays CONSISTENT</text><text x="675.0" y="820.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">makes the majority think harder, so it produces</text><text x="675.0" y="836.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">conversion — real private change, not compliance</text><rect x="494" y="858" width="362" height="86" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="675.0" y="880.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">GROUPTHINK</text><text x="675.0" y="898.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">cohesion beats accuracy</text><text x="675.0" y="916.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">self-censorship, illusion of unanimity, mindguards;</text><text x="675.0" y="932.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">the fix is structured dissent, not better intentions</text></svg>