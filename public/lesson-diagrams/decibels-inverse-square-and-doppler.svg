<svg xmlns="http://www.w3.org/2000/svg" width="920" height="830" viewBox="0 0 920 830" role="img" aria-labelledby="t d"><title id="t">Decibels count factors of ten; the Doppler shift counts closing speed</title><desc id="d">Top left: a decibel ladder from the threshold of hearing at 0 dB to the threshold of pain at 120 dB, with the intensity beside each level and the rules that ten times the intensity adds 10 dB and twice the intensity adds 3 dB. Top right: the inverse square law drawn as spreading spheres, with intensity falling to a quarter at twice the distance and a ninth at three times. Bottom left: a moving source with its wavefronts bunched ahead and stretched behind, with the Doppler formula and its sign rule. Bottom right: Doppler ultrasound, with the cosine factor, the impedance mismatch that makes gel necessary, and the pulse-echo depth formula.</desc><defs><marker id="m250" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker><marker id="m3698" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker><marker id="m7707" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="830" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Decibels count factors of ten; the Doppler shift counts closing speed</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">β = 10 log(I/I₀), I = P/4πr², and approaching always raises the pitch</text><rect x="40" y="112" width="416" height="326" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="248.0" y="142.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:17px">The decibel ladder</text><line x1="150" y1="170" x2="150" y2="360" stroke="#18364a" stroke-width="2"/><line x1="142" y1="180.0" x2="158" y2="180.0" stroke="#a8324a" stroke-width="3"/><text x="136.0" y="185.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:bold;font-size:14px">120 dB</text><text x="168.0" y="181.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">threshold of pain</text><text x="168.0" y="196.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">1 W/m²</text><line x1="142" y1="229.58333333333331" x2="158" y2="229.58333333333331" stroke="#987740" stroke-width="3"/><text x="136.0" y="234.6" class="" text-anchor="end" style="fill:#987740;font-weight:bold;font-size:14px">85 dB</text><text x="168.0" y="230.6" class="" text-anchor="start" style="fill:#18364a;font-size:13px">damage with exposure</text><text x="168.0" y="245.6" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">10⁻³·⁵</text><line x1="142" y1="265.0" x2="158" y2="265.0" stroke="#18364a" stroke-width="3"/><text x="136.0" y="270.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:14px">60 dB</text><text x="168.0" y="266.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">conversation</text><text x="168.0" y="281.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">10⁻⁶</text><line x1="142" y1="307.5" x2="158" y2="307.5" stroke="#18364a" stroke-width="3"/><text x="136.0" y="312.5" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:14px">30 dB</text><text x="168.0" y="308.5" class="" text-anchor="start" style="fill:#18364a;font-size:13px">quiet library</text><text x="168.0" y="323.5" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">10⁻⁹</text><line x1="142" y1="350.0" x2="158" y2="350.0" stroke="#5b7a64" stroke-width="3"/><text x="136.0" y="355.0" class="" text-anchor="end" style="fill:#5b7a64;font-weight:bold;font-size:14px">0 dB</text><text x="168.0" y="351.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">threshold of hearing</text><text x="168.0" y="366.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">10⁻¹² W/m²</text><rect x="62" y="372" width="372" height="50" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="248.0" y="392.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">×10 intensity ⇒ +10 dB   •   ×2 ⇒ +3 dB   •   ×4 ⇒ +6 dB</text><text x="248.0" y="412.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">two 60 dB sources make 63 dB, never 120</text><rect x="472" y="112" width="408" height="326" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="676.0" y="142.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">Spreading over a bigger sphere</text><circle cx="520" cy="290" r="7" fill="#a8324a" stroke="#a8324a" stroke-width="2"/><path d="M559.0102124231956 265.62371384527256 A46 46 0 0 1 559.0102124231956 314.37628615472744" stroke="#245574" stroke-width="2.5" fill="none"/><text x="564.0" y="253.6" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">r</text><text x="562.0" y="296.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">I</text><path d="M598.0204248463912 241.24742769054515 A92 92 0 0 1 598.0204248463912 338.7525723094549" stroke="#245574" stroke-width="2.5" fill="none"/><text x="610.0" y="229.2" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">2r</text><text x="608.0" y="296.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">I/4</text><path d="M637.0306372695868 216.87114153581774 A138 138 0 0 1 637.0306372695868 363.12885846418226" stroke="#245574" stroke-width="2.5" fill="none"/><text x="656.0" y="204.9" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">3r</text><text x="654.0" y="296.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">I/9</text><text x="676.0" y="386.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">I = P / 4πr²</text><text x="676.0" y="410.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">triple the distance ⇒ one ninth the intensity ⇒ −9.5 dB</text><text x="676.0" y="430.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">amplitude itself falls as 1/r, since I ∝ A²</text><rect x="40" y="458" width="416" height="240" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="248.0" y="486.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">A moving source crowds its own waves</text><circle cx="150" cy="580" r="64" fill="none" stroke="#6d716f" stroke-width="1.6"/><circle cx="167" cy="580" r="51" fill="none" stroke="#6d716f" stroke-width="1.6"/><circle cx="184" cy="580" r="38" fill="none" stroke="#6d716f" stroke-width="1.6"/><circle cx="201" cy="580" r="25" fill="none" stroke="#6d716f" stroke-width="1.6"/><circle cx="218" cy="580" r="12" fill="none" stroke="#6d716f" stroke-width="1.6"/><circle cx="214" cy="580" r="7" fill="#a8324a" stroke="#a8324a" stroke-width="2"/><line x1="224" y1="580" x2="264" y2="580" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m250)"/><text x="272.0" y="585.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:14px">v_s</text><text x="296.0" y="502.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:13px">crowded: higher pitch</text><text x="62.0" y="502.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:bold;font-size:13px">stretched: lower pitch</text><text x="248.0" y="652.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">f_obs = fₛ (v ± v_o) / (v ∓ v_s)</text><text x="248.0" y="676.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">pick the signs that make approaching raise f</text><rect x="472" y="458" width="408" height="240" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="676.0" y="486.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">Why the gel, and what the angle costs</text><rect x="496" y="508" width="46" height="58" rx="5" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="519.0" y="580.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">probe</text><rect x="548" y="508" width="300" height="58" rx="5" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="700.0" y="532.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">tissue  Z ≈ 1.5 × 10⁶ rayl</text><text x="700.0" y="554.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:12px">air Z ≈ 400 rayl ⇒ almost all of it reflects</text><line x1="548" y1="596" x2="700" y2="596" stroke="#18364a" stroke-width="2" marker-end="url(#m3698)"/><line x1="700" y1="612" x2="548" y2="612" stroke="#6d716f" stroke-width="2" marker-end="url(#m7707)"/><text x="716.0" y="600.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">pulse</text><text x="716.0" y="618.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">echo</text><text x="676.0" y="650.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">Δf = 2fₛ·v·cosθ / c   —   θ = 90° shows no flow at all</text><text x="676.0" y="676.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">depth d = v·t/2, with v ≈ 1,540 m/s in soft tissue</text><text x="460.0" y="740.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">Sound needs a medium and is longitudinal; 0 dB is the faintest audible, not silence</text><text x="460.0" y="772.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Higher ultrasound frequency buys resolution and loses depth — the two always trade</text><text x="460.0" y="802.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Murmurs, bruits and Korotkoff sounds are turbulence; S1 and S2 are valves closing</text></svg>