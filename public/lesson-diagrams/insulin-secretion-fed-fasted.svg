<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="t d"><title id="t">How a β cell senses glucose, and what insulin and glucagon do</title><desc id="d">Top: glucose enters the beta cell through GLUT2, is phosphorylated by glucokinase, glycolysis and oxidation raise ATP/ADP, ATP closes K-ATP channels (also closed by sulfonylureas, opened by diazoxide), the membrane depolarizes, voltage-gated calcium channels open, and calcium triggers insulin granule exocytosis. Bottom: insulin acts through a receptor tyrosine kinase, PI3K and Akt to promote glycogen synthesis, glycolysis, lipogenesis and GLUT4 uptake in muscle and fat; glucagon acts through a Gs-coupled receptor, cAMP and PKA in liver to promote glycogenolysis, gluconeogenesis, fatty acid oxidation and ketogenesis.</desc><defs><marker id="m4063" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="520" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">How a β cell senses glucose, and what insulin and glucagon do</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Top: glucose-stimulated insulin secretion. Bottom: the fed–fasted switch in the liver.</text><rect x="30" y="110" width="140" height="110" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="100.0" y="140.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:17px">Glucose in</text><text x="100.0" y="165.0" class="" text-anchor="middle" style="font-size:14px">GLUT2 (high Km)</text><line x1="171" y1="165" x2="189" y2="165" stroke="#18364a" stroke-width="2" marker-end="url(#m4063)"/><rect x="190" y="110" width="140" height="110" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="260.0" y="140.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:17px">Glucokinase</text><text x="260.0" y="165.0" class="" text-anchor="middle" style="font-size:14px">glucose sensor</text><line x1="331" y1="165" x2="349" y2="165" stroke="#18364a" stroke-width="2" marker-end="url(#m4063)"/><rect x="350" y="110" width="140" height="110" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="420.0" y="140.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:17px">↑ ATP/ADP</text><text x="420.0" y="165.0" class="" text-anchor="middle" style="font-size:14px">glycolysis + TCA</text><line x1="491" y1="165" x2="509" y2="165" stroke="#18364a" stroke-width="2" marker-end="url(#m4063)"/><rect x="510" y="110" width="140" height="110" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="580.0" y="140.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:17px">K-ATP closes</text><text x="580.0" y="165.0" class="" text-anchor="middle" style="font-size:14px">depolarization</text><line x1="651" y1="165" x2="669" y2="165" stroke="#18364a" stroke-width="2" marker-end="url(#m4063)"/><rect x="670" y="110" width="140" height="110" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="740.0" y="140.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:17px">Ca²⁺ enters</text><text x="740.0" y="165.0" class="" text-anchor="middle" style="font-size:14px">voltage-gated</text><text x="740.0" y="184.0" class="" text-anchor="middle" style="font-size:14px">channels</text><line x1="811" y1="165" x2="829" y2="165" stroke="#18364a" stroke-width="2" marker-end="url(#m4063)"/><rect x="830" y="110" width="140" height="110" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="900.0" y="140.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:17px">Exocytosis</text><text x="900.0" y="165.0" class="" text-anchor="middle" style="font-size:14px">insulin + C-peptide</text><text x="570.0" y="250.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:15px">Sulfonylureas close K-ATP → ↑ insulin;  diazoxide opens it → ↓ insulin</text><rect x="40" y="290" width="440" height="160" rx="12" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="260.0" y="320.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:19px">Insulin (fed)</text><text x="260.0" y="347.0" class="" text-anchor="middle" style="font-size:16px">Receptor tyrosine kinase → IRS → PI3K → Akt. Liver:</text><text x="260.0" y="368.0" class="" text-anchor="middle" style="font-size:16px">↑ glycogen synthesis, ↑ glycolysis, ↑ lipogenesis, ↓</text><text x="260.0" y="389.0" class="" text-anchor="middle" style="font-size:16px">gluconeogenesis. Muscle &amp; fat: GLUT4 to membrane, ↑</text><text x="260.0" y="410.0" class="" text-anchor="middle" style="font-size:16px">storage. Fat: ↓ lipolysis (↓ cAMP).</text><rect x="520" y="290" width="440" height="160" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="740.0" y="320.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:19px">Glucagon (fasting)</text><text x="740.0" y="347.0" class="" text-anchor="middle" style="font-size:16px">Gs-coupled receptor → cAMP → PKA, mainly in liver</text><text x="740.0" y="368.0" class="" text-anchor="middle" style="font-size:16px">(muscle has no receptor). ↑ glycogenolysis, ↑</text><text x="740.0" y="389.0" class="" text-anchor="middle" style="font-size:16px">gluconeogenesis, ↑ fatty acid oxidation and</text><text x="740.0" y="410.0" class="" text-anchor="middle" style="font-size:16px">ketogenesis, ↓ hepatic glycolysis.</text><text x="500.0" y="495.0" class="" text-anchor="middle" style="font-weight:700;font-size:16px">The insulin : glucagon ratio sets the liver&#x27;s direction.</text></svg>