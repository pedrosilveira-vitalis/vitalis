<svg xmlns="http://www.w3.org/2000/svg" width="920" height="906" viewBox="0 0 920 906" role="img" aria-labelledby="t d"><title id="t">Two roads to the amygdala, two timescales of stress</title><desc id="d">Top: LeDoux&#x27;s two routes. The low road runs thalamus straight to amygdala and fires before you know what you are looking at — it is crude, and it is supposed to be, because a stick mistaken for a snake costs nothing while the reverse costs everything. The high road goes through sensory cortex first, arrives later, and can call the alarm off. Middle: the stress response on its two clocks. Sympathetic nerves and adrenal catecholamines act in seconds; the HPA axis takes minutes and keeps going for hours, which is the arm that does the damage when it never shuts off. Bottom: the four theories of emotion, which differ only in where they put the arrow between body, appraisal and feeling — and a question stem naming an experiment is usually asking which arrow it supports.</desc><defs><marker id="m3409" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker><marker id="m5888" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="906" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Two roads to the amygdala, two timescales of stress</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Fear is fast because it is allowed to be wrong</text><rect x="40" y="170" width="840" height="216" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="460.0" y="198.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">The low road and the high road</text><rect x="70" y="226" width="134" height="54" rx="9" fill="#e9e4da" stroke="#6d716f" stroke-width="2"/><text x="137.0" y="258.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">stimulus</text><rect x="250" y="226" width="134" height="54" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="317.0" y="258.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">thalamus</text><rect x="452" y="300" width="160" height="54" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="532.0" y="332.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">sensory cortex</text><rect x="700" y="226" width="150" height="54" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="775.0" y="258.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">amygdala</text><line x1="206" y1="253" x2="246" y2="253" stroke="#6d716f" stroke-width="2" marker-end="url(#m5888)"/><line x1="386" y1="248" x2="696" y2="248" stroke="#a8324a" stroke-width="3" marker-end="url(#m3409)"/><text x="540.0" y="276.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">LOW ROAD — about 12 ms, crude, pre-conscious</text><path d="M330 282 q0 22 44 30 q40 6 76 6" stroke="#5b7a64" stroke-width="2.4" fill="none"/><path d="M612 322 q70 -4 112 -32" stroke="#5b7a64" stroke-width="2.4" fill="none"/><text x="532.0" y="368.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">HIGH ROAD — slower, accurate, can cancel the alarm</text><rect x="40" y="402" width="840" height="232" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="430.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">Two clocks on the same threat</text><rect x="70" y="450" width="380" height="164" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="260.0" y="474.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">SECONDS — sympathetic</text><text x="260.0" y="498.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">nerves release norepinephrine</text><text x="260.0" y="516.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">adrenal MEDULLA adds epinephrine</text><text x="260.0" y="534.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">(about 80% epi, 20% norepi)</text><text x="260.0" y="562.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">heart up · airways open · pupils wide</text><text x="260.0" y="580.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">gut down · glucose up · palms wet</text><text x="260.0" y="602.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">this is the arm you feel</text><rect x="470" y="450" width="380" height="164" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="660.0" y="474.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">MINUTES TO HOURS — HPA axis</text><text x="660.0" y="500.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">hypothalamus: CRH</text><text x="660.0" y="520.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">↓  anterior pituitary: ACTH</text><text x="660.0" y="540.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">↓  adrenal CORTEX: cortisol</text><text x="660.0" y="566.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">mobilises fuel · damps immunity</text><text x="660.0" y="584.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">negative feedback shuts it down</text><text x="660.0" y="606.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">chronic elevation injures the hippocampus</text><rect x="40" y="650" width="840" height="232" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="460.0" y="678.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">Four theories, four arrangements of the same three things</text><rect x="70" y="700" width="230" height="38" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="185.0" y="724.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">JAMES–LANGE</text><text x="320.0" y="717.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">stimulus → body → feeling</text><text x="320.0" y="733.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">you are afraid because you tremble</text><rect x="70" y="742" width="230" height="38" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="185.0" y="766.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">CANNON–BARD</text><text x="320.0" y="759.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">stimulus → body AND feeling</text><text x="320.0" y="775.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">at the same time, neither causing the other</text><rect x="70" y="784" width="230" height="38" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="185.0" y="808.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">SCHACHTER–SINGER</text><text x="320.0" y="801.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">arousal + label → feeling</text><text x="320.0" y="817.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">same adrenaline, different emotion by context</text><rect x="70" y="826" width="230" height="38" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="185.0" y="850.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">LAZARUS</text><text x="320.0" y="843.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">appraisal → feeling and body</text><text x="320.0" y="859.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">what it means to me comes first</text><text x="460.0" y="876.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">block the body&#x27;s arousal and James-Lange predicts the feeling fades; Cannon-Bard predicts it does not</text></svg>