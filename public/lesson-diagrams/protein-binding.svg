s="s" text-anchor="start">Kd = 40</text><rect x="24" y="425" width="752" height="147" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="458" class="h" text-anchor="start">2  Standard reversible-inhibition models</text><text x="50" y="496" class="t" text-anchor="start">Mixed: Vmax ↓; apparent Km can increase or decrease.</text><text x="50" y="530" class="t" text-anchor="start">Pure noncompetitive: Vmax ↓; apparent Km unchanged.</text><text x="50" y="555" class="s" text-anchor="start">Km is a kinetic parameter, not generally the same as Kd.</text><rect x="24" y="588" width="752" height="128" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="620" class="h" text-anchor="start">3  Sickle hemoglobin: get the direction right</text><text x="50" y="658" class="t" text-anchor="start">β-globin position 6: glutamate (Glu) → valine (Val)</text><text x="50" y="691" class="s" text-anchor="start">The new nonpolar surface favors deoxy-HbS polymerization.</text></svg>