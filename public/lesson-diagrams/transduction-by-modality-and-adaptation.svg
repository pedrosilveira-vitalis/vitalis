<svg xmlns="http://www.w3.org/2000/svg" width="920" height="910" viewBox="0 0 920 910" role="img" aria-labelledby="t d"><title id="t">Every sense does the same four things</title><desc id="d">Top: the universal chain. Whatever the stimulus, it ends up changing the permeability of a membrane; the resulting receptor potential is graded and local, and only the action potentials it triggers are all-or-none. Intensity is carried by how often those spikes come, not by how big they are. Middle: the front end differs by modality — directly gated channels for touch and hearing, a G protein cascade for vision and smell, mixed mechanisms for taste, TRP channels for temperature and pain. The one that catches people out is vision, where light closes channels and the cell hyperpolarises. Bottom: adaptation, and the receptors that refuse to do it.</desc><defs><marker id="m4440" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="910" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Every sense does the same four things</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Different front ends, one common path: open or close a channel, grade a potential, code a rate</text><rect x="40" y="170" width="840" height="136" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="198.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">The chain every modality shares</text><rect x="62" y="218" width="148" height="62" rx="9" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="136.0" y="255.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:12px">stimulus</text><line x1="210" y1="249" x2="230" y2="249" stroke="#6d716f" stroke-width="1.8" marker-end="url(#m4440)"/><rect x="230" y="218" width="148" height="62" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="304.0" y="245.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">channel opens</text><text x="304.0" y="263.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">or closes</text><line x1="378" y1="249" x2="398" y2="249" stroke="#6d716f" stroke-width="1.8" marker-end="url(#m4440)"/><rect x="398" y="218" width="148" height="62" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="472.0" y="245.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">RECEPTOR POTENTIAL</text><text x="472.0" y="263.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">graded · local</text><line x1="546" y1="249" x2="566" y2="249" stroke="#6d716f" stroke-width="1.8" marker-end="url(#m4440)"/><rect x="566" y="218" width="148" height="62" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="640.0" y="245.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">ACTION POTENTIALS</text><text x="640.0" y="263.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">all-or-none</text><line x1="714" y1="249" x2="734" y2="249" stroke="#6d716f" stroke-width="1.8" marker-end="url(#m4440)"/><rect x="734" y="218" width="148" height="62" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="808.0" y="245.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:11px">rate codes</text><text x="808.0" y="263.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">intensity</text><rect x="40" y="322" width="840" height="300" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="460.0" y="350.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">Five front ends</text><rect x="70" y="372" width="150" height="34" rx="7" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="145.0" y="394.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">TOUCH</text><text x="240.0" y="387.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:11px">mechanically gated channels (PIEZO)</text><text x="240.0" y="402.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">deformation → Na⁺ and Ca²⁺ in → depolarise</text><rect x="70" y="410" width="150" height="34" rx="7" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="145.0" y="432.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">HEARING</text><text x="240.0" y="425.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:11px">tip links pull open MET channels</text><text x="240.0" y="440.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">endolymph is K⁺-rich, so K⁺ flows IN</text><rect x="70" y="448" width="150" height="34" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="145.0" y="470.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">VISION</text><text x="240.0" y="463.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:11px">rhodopsin → transducin → PDE → cGMP falls</text><text x="240.0" y="478.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">channels CLOSE → HYPERpolarise · the exception</text><rect x="70" y="486" width="150" height="34" rx="7" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="145.0" y="508.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">SMELL</text><text x="240.0" y="501.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:11px">GPCR → G-olf → cAMP → CNG channels</text><text x="240.0" y="516.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">Ca²⁺ then opens Cl⁻ channels, amplifying</text><rect x="70" y="524" width="150" height="34" rx="7" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="145.0" y="546.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">TASTE</text><text x="240.0" y="539.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:11px">salt: ENaC · sour: H⁺ · rest: T1R/T2R</text><text x="240.0" y="554.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">sweet, bitter, umami go through gustducin</text><rect x="70" y="562" width="150" height="34" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="145.0" y="584.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">HEAT · PAIN</text><text x="240.0" y="577.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:11px">TRP channels on free nerve endings</text><text x="240.0" y="592.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">TRPV1 &gt;43 °C and capsaicin; TRPM8 cold, menthol</text><text x="460.0" y="612.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:11px">in the dark the photoreceptor sits depolarised and leaks glutamate; light is what switches it off</text><rect x="40" y="638" width="840" height="246" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="666.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">Adaptation — and the receptors that will not</text><rect x="70" y="686" width="250" height="174" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="195.0" y="712.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">RAPIDLY ADAPTING</text><text x="195.0" y="734.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">fires at onset and offset</text><text x="195.0" y="752.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">then falls silent</text><text x="195.0" y="782.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">Meissner · Pacinian</text><text x="195.0" y="804.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">reports CHANGE:</text><text x="195.0" y="820.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">vibration, movement,</text><text x="195.0" y="836.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">the moment of contact</text><rect x="336" y="686" width="250" height="174" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="461.0" y="712.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">SLOWLY ADAPTING</text><text x="461.0" y="734.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">keeps firing throughout</text><text x="461.0" y="752.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">at a reduced rate</text><text x="461.0" y="782.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">Merkel · Ruffini</text><text x="461.0" y="804.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">reports STATE:</text><text x="461.0" y="820.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">steady pressure, shape,</text><text x="461.0" y="836.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">skin stretch, position</text><rect x="602" y="686" width="250" height="174" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="727.0" y="712.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">BARELY ADAPTS</text><text x="727.0" y="734.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">nociceptors SENSITISE</text><text x="727.0" y="752.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">instead of fading</text><text x="727.0" y="782.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">also proprioception</text><text x="727.0" y="804.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">inflammation lowers the</text><text x="727.0" y="820.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">TRPV1 threshold — hence</text><text x="727.0" y="836.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">allodynia and hyperalgesia</text></svg>