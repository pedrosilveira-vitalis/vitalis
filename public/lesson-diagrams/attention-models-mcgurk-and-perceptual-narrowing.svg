<svg xmlns="http://www.w3.org/2000/svg" width="920" height="898" viewBox="0 0 920 898" role="img" aria-labelledby="t d"><title id="t">Attention decides, the senses vote, experience tunes</title><desc id="d">Top: where attention does its selecting. Broadbent put the gate early, before meaning; Treisman turned the gate into a dimmer, which is how your own name still gets through from the ignored ear; Deutsch and Deutsch put it late, after everything has been understood. Lavie&#x27;s load theory settles the argument by making the gate&#x27;s position depend on how hard the attended task is. Middle: the McGurk effect, in the right order — the ears get ba, the eyes get ga, and what reaches awareness is da, a syllable nobody presented. Knowing about it does not switch it off, which is the point: integration happens before consciousness. Bottom: the rules that govern when two senses combine at all, and the windows in development when experience prunes perception to fit the world the infant actually lives in.</desc><defs><marker id="m3465" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="898" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Attention decides, the senses vote, experience tunes</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Three filters sit between the world and the percept</text><rect x="40" y="168" width="840" height="206" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="196.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">Where is the bottleneck?</text><rect x="62" y="216" width="198" height="134" rx="10" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="161.0" y="242.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">BROADBENT</text><text x="161.0" y="264.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">a hard filter, EARLY</text><text x="161.0" y="296.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">selects on physical features;</text><text x="161.0" y="314.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">meaning never extracted</text><rect x="266" y="216" width="198" height="134" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="365.0" y="242.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">TREISMAN</text><text x="365.0" y="264.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">a dimmer, not a gate</text><text x="365.0" y="296.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">unattended is attenuated;</text><text x="365.0" y="314.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">your name still breaks through</text><rect x="470" y="216" width="198" height="134" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="569.0" y="242.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">DEUTSCH × 2</text><text x="569.0" y="264.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">selection is LATE</text><text x="569.0" y="296.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">everything is understood;</text><text x="569.0" y="314.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">attention picks what reaches awareness</text><rect x="674" y="216" width="198" height="134" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="773.0" y="242.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">LAVIE</text><text x="773.0" y="264.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">it depends on load</text><text x="773.0" y="296.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">hard task → early selection;</text><text x="773.0" y="314.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">easy task → late</text><text x="460.0" y="364.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">no attention, no conscious percept — the invisible gorilla and change blindness make the same point</text><rect x="40" y="390" width="840" height="196" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="460.0" y="418.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">The McGurk effect, in the right order</text><rect x="90" y="440" width="210" height="96" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="195.0" y="466.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">EARS HEAR</text><text x="195.0" y="500.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:24px">“ba”</text><rect x="340" y="440" width="210" height="96" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="445.0" y="466.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">EYES SEE THE LIPS SAY</text><text x="445.0" y="500.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:24px">“ga”</text><rect x="620" y="440" width="210" height="96" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="725.0" y="466.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">WHAT YOU PERCEIVE</text><text x="725.0" y="500.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:24px">“da”</text><line x1="306" y1="488" x2="332" y2="488" stroke="#6d716f" stroke-width="2" marker-end="url(#m3465)"/><line x1="558" y1="488" x2="612" y2="488" stroke="#6d716f" stroke-width="2" marker-end="url(#m3465)"/><text x="460.0" y="562.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">neither input, and it does not go away once you know — integration finishes before awareness begins</text><rect x="40" y="602" width="420" height="266" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="250.0" y="630.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">When do two senses combine?</text><rect x="66" y="656" width="368" height="42" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="250.0" y="674.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">same place</text><text x="250.0" y="690.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">spatial correspondence</text><rect x="66" y="704" width="368" height="42" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="250.0" y="722.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">same time</text><text x="250.0" y="738.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">within about ±200 ms for speech</text><rect x="66" y="752" width="368" height="42" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="250.0" y="770.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">both weak</text><text x="250.0" y="786.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">inverse effectiveness: the boost is biggest</text><rect x="66" y="800" width="368" height="42" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="250.0" y="818.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">weight by reliability</text><text x="250.0" y="834.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">vision wins for space, ears for time</text><text x="250.0" y="858.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">lose one sense early and its cortex is recruited by the others</text><rect x="480" y="602" width="400" height="266" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="680.0" y="630.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">Experience prunes perception</text><text x="500.0" y="658.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:12px">newborn acuity</text><text x="500.0" y="674.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">about 20/400 → adult by 6–12 months</text><text x="500.0" y="692.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:12px">stereopsis</text><text x="500.0" y="708.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">appears at 3–5 months</text><text x="500.0" y="726.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:12px">visual cliff</text><text x="500.0" y="742.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">depth before the fear of heights</text><text x="500.0" y="760.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:12px">phonemes</text><text x="500.0" y="776.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">all contrasts at 6 months, native only by 12</text><text x="500.0" y="794.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:12px">faces</text><text x="500.0" y="810.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">other-race effect by about 9 months</text><text x="500.0" y="828.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:12px">ageing</text><text x="500.0" y="844.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">presbycusis from above 4 kHz; wider binding window</text></svg>