8" stroke="#245574" stroke-width="0.6"/><line x1="110" y1="278" x2="400" y2="255" stroke="#245574" stroke-width="0.6"/><line x1="110" y1="278" x2="400" y2="292" stroke="#245574" stroke-width="0.6"/><line x1="110" y1="278" x2="400" y2="324" stroke="#245574" stroke-width="0.6"/><text x="248.0" y="362.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">Δy = λL/d: longer λ or bigger L spreads the fringes</text><text x="248.0" y="386.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">dark where the path difference is (m + ½)λ</text><rect x="472" y="112" width="408" height="300" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="676.0" y="142.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:17px">One slit: minima at a sinθ = mλ</text><path d="M504.0 281.8 L505.1 281.8 L506.1 281.9 L507.2 282.0 L508.3 282.0 L509.4 282.0 L510.4 282.0 L511.5 282.0 L512.6 281.9 L513.7 281.8 L514.8 281.7 L515.8 281.6 L516.9 281.5 L518.0 281.4 L519.0 281.2 L520.1 281.1 L521.2 281.0 L522.3 281.0 L523.4 280.9 L524.4 280.9 L525.5 281.0 L526.6 281.0 L527.6 281.1 L528.7 281.3 L529.8 281.4 L530.9 281.5 L532.0 281.7 L533.0 281.8 L534.1 281.9 L535.2 282.0 L536.2 282.0 L537.3 282.0 L538.4 281.9 L539.5 281.8 L540.5 281.6 L541.6 281.3 L542.7 281.0 L543.8 280.7 L544.9 280.4 L545.9 280.0 L547.0 279.7 L548.1 279.4 L549.1 279.2 L550.2 279.1 L551.3 279.0 L552.4 279.0 L553.5 279.1 L554.5 279.3 L555.6 279.7 L556.7 280.0 L557.8 280.4 L558.8 280.9 L559.9 281.3 L561.0 281.7 L562.0 281.9 L563.1 282.0 L564.2 281.9 L565.3 281.5 L566.4 280.9 L567.4 279.9 L568.5 278.5 L569.6 276.7 L570.6 274.6 L571.7 272.0 L572.8 269.0 L573.9 265.7 L575.0 262.0 L576.0 258.1 L577.1 254.0 L578.2 249.7 L579.2 245.3 L580.3 241.0 L581.4 236.9 L582.5 232.9 L583.5 229.2 L584.6 226.0 L585.7 223.2 L586.8 221.0 L587.9 219.3 L588.9 218.3 L590.0 218.0 L591.1 218.3 L592.1 219.3 L593.2 221.0 L594.3 223.2 L595.4 226.0 L596.5 229.2 L597.5 232.9 L598.6 236.9 