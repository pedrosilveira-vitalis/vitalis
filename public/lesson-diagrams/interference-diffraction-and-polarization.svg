<svg xmlns="http://www.w3.org/2000/svg" width="920" height="830" viewBox="0 0 920 830" role="img" aria-labelledby="t d"><title id="t">Two slits add; one slit cancels; a film does both</title><desc id="d">Top left: the double-slit pattern, with bright fringes where the path difference is a whole number of wavelengths and the spacing lambda L over d. Top right: single-slit diffraction, where a sine theta equals m lambda gives the dark fringes and a narrower slit spreads the central maximum wider. Bottom left: thin-film interference, with the rule that a reflection off a higher-index medium flips the phase, and the two cases that follow. Bottom right: polarization, with Malus&#x27;s law, Brewster&#x27;s angle, and the vertical transmission axis of sunglasses blocking horizontally polarized glare.</desc><defs><marker id="m1838" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker><marker id="m2434" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker><marker id="m6675" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="830" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Two slits add; one slit cancels; a film does both</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Path difference decides everything — count wavelengths, and count phase flips</text><rect x="40" y="112" width="416" height="300" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="248.0" y="142.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">Two slits: maxima at d sinθ = mλ</text><line x1="110" y1="180" x2="110" y2=