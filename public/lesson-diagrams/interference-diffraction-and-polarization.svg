" text-anchor="middle" style="fill:#6d716f;font-size:13px">a bigger aperture resolves finer detail</text><rect x="40" y="432" width="416" height="246" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="248.0" y="460.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">Thin films: count the phase flips</text><rect x="96" y="506" width="264" height="44" rx="0" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="228.0" y="496.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">n_film</text><text x="70.0" y="532.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:14px">t</text><line x1="150" y1="466" x2="178" y2="504" stroke="#18364a" stroke-width="2" marker-end="url(#m2434)"/><line x1="178" y1="504" x2="206" y2="466" stroke="#a8324a" stroke-width="2" marker-end="url(#m6675)"/><text x="214.0" y="472.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:12px">flip</text><line x1="178" y1="508" x2="236" y2="548" stroke="#6d716f" stroke-width="1.6" marker-end="url(#m1838)"/><line x1="236" y1="548" x2="294" y2="508" stroke="#6d716f" stroke-width="1.6" marker-end="url(#m1838)"/><text x="300.0" y="518.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:bold;font-size:12px">no flip</text><rect x="62" y="574" width="180" height="56" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="152.0" y="596.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">one flip</text><text x="152.0" y="618.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">bright: 2nt = (m+½)λ</text><rect x="254" y="574" width="180" height="56" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="344.0" y="596.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">zero or two flips</text><text x="344.0" y="618.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">bright: 2nt = mλ</text><text x="248.0" y="656.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">the n belongs in the path: inside the film λ shrinks to λ/n</text><rect x="472" y="432" width="408" height="246" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="676.0" y="460.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">Polarization</text><text x="676.0" y="490.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">I = I₀ cos²θ   •   unpolarized first ⇒ I₀/2</text><text x="676.0" y="516.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">tan θ_B = n₂/n₁: reflection at Brewster&#x27;s angle comes back</text><text x="676.0" y="536.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">polarized parallel to the surface — horizontal off water</text><rect x="500" y="556" width="360" height="62" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="680.0" y="578.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">So sunglasses transmit the vertical component:</text><text x="680.0" y="600.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">a vertical axis is what blocks horizontal glare</text><text x="676.0" y="646.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Chiral molecules rotate the plane — the basis of polarimetry</text><text x="460.0" y="716.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">E = hf = hc/λ: shorter wavelength, more energy per photon</text><text x="460.0" y="748.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">UV-B (280–315 nm) makes thymine dimers; UV-A ages skin through reactive oxygen</text><text x="460.0" y="778.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">Single slit a sinθ = mλ gives DARK fringes; double slit d sinθ = mλ gives BRIGHT ones</text><text x="460.0" y="808.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Everything travels at c in vacuum; in glass the index, and so the speed, depends on λ</text></svg>