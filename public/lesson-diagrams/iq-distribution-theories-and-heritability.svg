460.0" y="372.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">100</text><line x1="573.3333333333333" y1="352.0" x2="573.3333333333333" y2="276.7452699986177" stroke="#6d716f" stroke-width="1.4" stroke-dasharray="6 5"/><text x="573.3" y="372.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:12px">115</text><line x1="686.6666666666667" y1="352.0" x2="686.6666666666667" y2="335.2084000428647" stroke="#5b7a64" stroke-width="1.4" stroke-dasharray="6 5"/><text x="686.7" y="372.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">130</text><text x="233.3" y="232.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">−2 SD</text><text x="233.3" y="248.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:10px">intellectual disability</text><text x="233.3" y="262.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">requires adaptive deficits too</text><text x="686.7" y="232.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">+2 SD</text><text x="686.7" y="248.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:10px">gifted range</text><text x="460.0" y="396.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">mean 100 · SD 15 · renormed every few decades, because the Flynn effect adds about 3 points a decade to raw performance</text><rect x="40" y="436" width="840" height="190" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="460.0" y="464.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">Four answers to &quot;intelligence of what kind?&quot;</text><rect x="62" y="484" width="198" height="120" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="161.0" y="510.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">SPEARMAN</text><text x="161.0" y="534.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">g, plus task-specific s</text><text x="161.0" y="562.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">everything correlates</text><text x="161.0" y="578.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">positively — that is g</text><rect x="266" y="484" width="198" height="120" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="365.0" y="510.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">CATTELL</text><text x="365.0" y="534.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">fluid vs crystallised</text><text x="365.0" y="562.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">Gf peaks early and falls;</text><text x="365.0" y="578.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">Gc holds or grows</text><rect x="470" y="484" width="198" height="120" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="569.0" y="510.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">GARDNER</text><text x="569.0" y="534.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">eight intelligences</text><text x="569.0" y="562.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">popular in schools; weak</text><text x="569.0" y="578.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">factor-analytic support</text><rect x="674" y="484" width="198" height="120" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="773.0" y="510.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">STERNBERG</text><text x="773.0" y="534.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">analytical · creative · practical</text><text x="773.0" y="562.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">&quot;street smarts&quot; is the</text><text x="773.0" y="578.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">practical branch</text><rect x="40" y="642" width="840" height="230" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="460.0" y="670.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">Heritability: what the number is, and what it is not</text><rect x="70" y="690" width="380" height="160" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="260.0" y="714.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">IT IS</text><text x="260.0" y="740.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">the share of VARIANCE in one population</text><text x="260.0" y="764.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">attributable to genetic differences</text><text x="260.0" y="788.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">measured in one environment, at one time</text><text x="260.0" y="812.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">0.50–0.80 for adults in Western samples</text><text x="260.0" y="840.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:11px">MZ .86 together · .75 apart · DZ .60</text><rect x="470" y="690" width="380" height="160" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="660.0" y="714.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">IT IS NOT</text><text x="660.0" y="740.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">a statement about any one person</text><text x="660.0" y="764.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">an explanation of a gap between groups</text><text x="660.0" y="788.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">a ceiling on what environments can do</text><text x="660.0" y="812.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">a fixed constant — it falls under deprivation</text><text x="660.0" y="840.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:11px">height is highly heritable and still rose with nutrition</text></svg>