<svg xmlns="http://www.w3.org/2000/svg" width="920" height="902" viewBox="0 0 920 902" role="img" aria-labelledby="t d"><title id="t">What a score means, and what heritability does not mean</title><desc id="d">Top: the IQ distribution is defined, not discovered — mean 100, standard deviation 15, with the clinical cut-offs two deviations out on each side, and the whole scale renormed periodically because raw performance keeps rising. Middle: the four frameworks, from the single general factor that keeps falling out of factor analysis to the models built to capture what the tests leave out. Bottom: the statistic worth slowing down for. Heritability is the share of variance within one population in one environment that tracks genetic differences; it says nothing about any individual, nothing about the gap between two groups, and nothing about whether the trait can be changed. The clearest proof is that the number itself moves — it falls where deprivation makes environments vary more.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="902" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">What a score means, and what heritability does not mean</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">A normal curve, four theories and one statistic that is read wrong more than any other</text><rect x="40" y="170" width="840" height="250" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="198.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">The scale is built, not found</text><line x1="120" y1="352" x2="800" y2="352" stroke="#18364a" stroke-width="2"/><line x1="120" y1="218" x2="120" y2="352" stroke="#18364a" stroke-width="2"/><text x="460.0" y="396.0" class="" text-anchor="middle" style="font-size:17px"></text><text x="76" 