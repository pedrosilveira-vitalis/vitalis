<svg xmlns="http://www.w3.org/2000/svg" width="920" height="912" viewBox="0 0 920 912" role="img" aria-labelledby="t d"><title id="t">The brain&#x27;s rules for grouping, and for depth</title><desc id="d">Top: the Gestalt principles, each drawn as the smallest figure that makes it visible. Proximity groups by distance, similarity by feature, good continuation by smooth path, closure by completing a shape that was never drawn, common fate by shared motion, and symmetry by balance — all of them special cases of Prägnanz, the preference for the simplest stable reading. Bottom: the depth cues, sorted by how many eyes they need. The pictorial cues all work in a photograph, which is why a painting can look deep; motion parallax needs the observer to move; disparity and convergence need two eyes and work best close up. Lose an eye and the whole top row survives — which is why monocular pilots can still judge distance, especially while moving.</desc><defs><marker id="m4534" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="912" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">The brain&#x27;s rules for grouping, and for depth</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Perception is a hypothesis: the simplest arrangement that explains the image</text><rect x="40" y="170" width="840" height="300" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="460.0" y="198.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">Seven ways the brain groups</text><rect x="66" y="218" width="194" height="112" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="163.0" y="240.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">PROXIMITY</text><text x="163.0" y="322.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">near things belong together</text><circle cx="100" cy="270" r="5" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="100" cy="288" r="5" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="116" cy="270" r="5" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="116" cy="288" r="5" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="132" cy="270" r="5" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="132" cy="288" r="5" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="176" cy="270" r="5" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="176" cy="288" r="5" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="192" cy="270" r="5" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="192" cy="288" r="5" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="208" cy="270" r="5" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="208" cy="288" r="5" fill="#245574" stroke="#245574" stroke-width="2"/><rect x="272" y="218" width="194" height="112" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="369.0" y="240.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">SIMILARITY</text><text x="369.0" y="322.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">like features belong together</text><circle cx="316" cy="270" r="5" fill="#a8324a" stroke="#a8324a" stroke-width="2"/><circle cx="316" cy="288" r="5" fill="#a8324a" stroke="#a8324a" stroke-width="2"/><circle cx="338" cy="270" r="5" fill="#6d716f" stroke="#6d716f" stroke-width="2"/><circle cx="338" cy="288" r="5" fill="#6d716f" stroke="#6d716f" stroke-width="2"/><circle cx="360" cy="270" r="5" fill="#a8324a" stroke="#a8324a" stroke-width="2"/><circle cx="360" cy="288" r="5" fill="#a8324a" stroke="#a8324a" stroke-width="2"/><circle cx="382" cy="270" r="5" fill="#6d716f" stroke="#6d716f" stroke-width="2"/><circle cx="382" cy="288" r="5" fill="#6d716f" stroke="#6d716f" stroke-width="2"/><circle cx="404" cy="270" r="5" fill="#a8324a" stroke="#a8324a" stroke-width="2"/><circle cx="404" cy="288" r="5" fill="#a8324a" stroke="#a8324a" stroke-width="2"/><circle cx="426" cy="270" r="5" fill="#6d716f" stroke="#6d716f" stroke-width="2"/><circle cx="426" cy="288" r="5" fill="#6d716f" stroke="#6d716f" stroke-width="2"/><rect x="478" y="218" width="194" height="112" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="575.0" y="240.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">GOOD CONTINUATION</text><text x="575.0" y="322.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">the smooth path wins</text><path d="M496 280 q40 -24 80 0 q40 24 80 0" stroke="#987740" stroke-width="2.6" fill="none"/><path d="M496 280 q40 24 80 0 q40 -24 80 0" stroke="#6d716f" stroke-width="2.2" fill="none" stroke-dasharray="8 6"/><rect x="684" y="218" width="194" height="112" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="781.0" y="240.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">CLOSURE</text><text x="781.0" y="322.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">a shape that was never drawn</text><circle cx="781.0" cy="256.0" r="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><circle cx="758.4833395016046" cy="295.0" r="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><circle cx="803.5166604983954" cy="295.0" r="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><path d="M781.0 256.0 L758.0 295.0 L804.0 295.0 z" stroke="#5b7a64" stroke-width="1.4" fill="none" stroke-dasharray="8 6"/><rect x="66" y="342" width="194" height="112" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="163.0" y="364.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">COMMON FATE</text><text x="163.0" y="446.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">moving together = one thing</text><line x1="98" y1="408" x2="116" y2="388" stroke="#245574" stroke-width="2" marker-end="url(#m4534)"/><line x1="132" y1="408" x2="150" y2="388" stroke="#245574" stroke-width="2" marker-end="url(#m4534)"/><line x1="166" y1="408" x2="184" y2="388" stroke="#245574" stroke-width="2" marker-end="url(#m4534)"/><line x1="200" y1="408" x2="218" y2="388" stroke="#245574" stroke-width="2" marker-end="url(#m4534)"/><rect x="272" y="342" width="194" height="112" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="369.0" y="364.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">SYMMETRY</text><text x="369.0" y="446.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">balanced regions read as figure</text><path d="M316 398 q24 -26 46 0 q-22 26 -46 0 z" stroke="#a8324a" stroke-width="2.2" fill="#f5e6e8"/><path d="M422 398 q-24 -26 -46 0 q22 26 46 0 z" stroke="#a8324a" stroke-width="2.2" fill="#f5e6e8"/><line x1="369.0" y1="378" x2="369.0" y2="418" stroke="#6d716f" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="478" y="342" width="194" height="112" rx="9" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="575.0" y="364.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:12px">FIGURE–GROUND</text><text x="575.0" y="446.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">the edge belongs to the figure</text><rect x="514" y="376" width="122" height="46" rx="5" fill="#e9e4da" stroke="#6d716f" stroke-width="1.6"/><circle cx="575" cy="399" r="17" fill="#dde4ea" stroke="#18364a" stroke-width="2"/><rect x="684" y="342" width="194" height="112" rx="9" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="781.0" y="364.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">PRÄGNANZ</text><text x="781.0" y="446.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">all of the above, in one rule</text><text x="781.0" y="404.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">simplest stable reading</text><rect x="40" y="486" width="840" height="396" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="514.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">Depth cues, by how many eyes they need</text><rect x="66" y="534" width="788" height="148" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="460.0" y="558.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">MONOCULAR — one eye is enough</text><text x="200.0" y="584.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:11px">linear perspective</text><text x="212.0" y="584.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">parallels converge</text><text x="620.0" y="584.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:11px">relative size</text><text x="632.0" y="584.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">smaller = farther</text><text x="200.0" y="608.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:11px">interposition</text><text x="212.0" y="608.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">the one in front is nearer</text><text x="620.0" y="608.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:11px">texture gradient</text><text x="632.0" y="608.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">denser = farther</text><text x="200.0" y="632.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:11px">aerial perspective</text><text x="212.0" y="632.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">hazier and bluer = farther</text><text x="620.0" y="632.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:11px">shading</text><text x="632.0" y="632.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">light is assumed from above</text><text x="200.0" y="656.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:11px">motion parallax</text><text x="212.0" y="656.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">near things sweep past faster</text><text x="620.0" y="656.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:11px">accommodation</text><text x="632.0" y="656.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">lens effort, under 2 m</text><rect x="66" y="698" width="788" height="112" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="460.0" y="722.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">BINOCULAR — needs both</text><text x="300.0" y="750.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:11px">binocular disparity</text><text x="312.0" y="750.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">the two retinal images differ; the strongest cue, best within ~10 m</text><text x="300.0" y="776.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:11px">convergence</text><text x="312.0" y="776.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">how far the eyes turn inward; useful under about 6 m</text><text x="460.0" y="840.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">a painting has only the pictorial cues · a one-eyed observer keeps every monocular cue, and leans on parallax</text><text x="460.0" y="862.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">3D cinema fakes disparity but cannot fake convergence or accommodation — which is why it can make people queasy</text></svg>