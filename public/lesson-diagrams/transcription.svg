<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">Transcription: strand direction and RNA processing</title><desc id="desc">Coding DNA 5 prime ATG CCT 3 prime matches primary RNA 5 prime AUG CCU 3 prime. Template DNA runs 3 prime TAC GGA 5 prime. RNA grows at its 3 prime end. In a schematic animal pre-mRNA, splicing removes an intron and retains untranslated as well as coding exon segments. Capping and nontemplated polyadenylation modify the ends.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#245574;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">From DNA sequence to a processed RNA</text><rect x="24" y="60" width="752" height="250" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="94" class="h" text-anchor="start">1  Read the template in the opposite direction</text><text x="55" y="140" class="t" text-anchor="start">Coding DNA</text><text x="300" y="140" class="h" text-anchor="start">5′  A T G   C C T  3′</text><text x="55" y="185" class="t" text-anchor="start">Template DNA</text><text x="300" y="185" class="h" text-anchor="start">3′  T A C   G G A  5′</text><text x="55" y="230" class="t" text-anchor="start">Primary RNA</text><text x="300" y="230" class="h" text-anchor="start">5′  A U G   C C U  3′</text><path d="M300 255 L610 255" class="bond" /><path d="M610 255 L598 247" class="bond" /><path d="M610 255 L598 263" class="bond" /><text x="55" y="286" class="t" text-anchor="start">RNA grows 5′ → 3′; new nucleotides join its 3′-OH.</text><rect x="24" y="326" width="752" height="270" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="360" class="h" text-anchor="start">2  Exons are retained segments, including UTRs</text><text x="55" y="393" class="s" text-anchor="start">Primary RNA:</text><rect x="180" y="405" width="85" height="35" fill="#e9d8ac"/><text x="222.5" y="428" class="s" text-anchor="middle">5′ UTR</text><rect x="265" y="405" width="100" height="35" fill="#245574"/><text x="315.0" y="428" class="s" text-anchor="middle">coding</text><rect x="435" y="405" width="100" height="35" fill="#245574"/><text x="485.0" y="428" class="s" text-anchor="middle">coding</text><rect x="535" y="405" width="85" height="35" fill="#e9d8ac"/><text x="577.5" y="428" class="s" text-anchor="middle">3′ UTR</text><path d="M365 423 L435 423" class="bond" /><text x="400" y="464" class="s" text-anchor="middle">intron</text><text x="55" y="493" class="t" text-anchor="start">Splicing removes the intron; exon segments join.</text><text x="55" y="531" class="s" text-anchor="start">Mature RNA:</text><rect x="180" y="543" width="85" height="35" fill="#e9d8ac"/><text x="222.5" y="566" class="s" text-anchor="middle">5′ UTR</text><rect x="265" y="543" width="200" height="35" fill="#245574"/><text x="365.0" y="566" class="s" text-anchor="middle">coding sequence</text><rect x="465" y="543" width="85" height="35" fill="#e9d8ac"/><text x="507.5" y="566" class="s" text-anchor="middle">3′ UTR</text><text x="155" y="566" class="s" text-anchor="end">cap</text><path d="M162 559 L180 559" class="bond" /><text x="558" y="566" class="s" text-anchor="start">AAAA…</text><rect x="24" y="612" width="752" height="104" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="646" class="h" text-anchor="start">3  Do not copy the whole gene into mature mRNA</text><text x="55" y="678" class="t" text-anchor="start">Remove the appropriate introns; keep untranslated exon regions.</text><text x="55" y="703" class="s" text-anchor="start">The poly-A tail is added without a DNA template. Typical animal model.</text></svg>