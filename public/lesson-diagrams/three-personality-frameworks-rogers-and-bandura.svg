<svg xmlns="http://www.w3.org/2000/svg" width="920" height="916" viewBox="0 0 920 916" role="img" aria-labelledby="t d"><title id="t">Three answers to what a person is made of</title><desc id="d">Top: the three frameworks set against each other on the questions that separate them — what drives behaviour, how good human nature is taken to be, and whether the theory can actually be tested. Middle: Rogers in detail, because his machinery is the most often muddled. A child meets conditional regard, takes on conditions of worth, and starts editing the self-concept to fit them; the edited self-concept then drifts away both from the ideal self and from what the child actually experiences and values, and that gap is the distress. Bottom left: the defence mechanisms that vignettes test, grouped so the confusable pairs sit together. Bottom right: Bandura&#x27;s loop and the four sources of self-efficacy, in order of strength.</desc><defs><marker id="m8314" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="916" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Three answers to what a person is made of</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Freud says conflict, Rogers says conditions, Bandura says a loop</text><rect x="40" y="180" width="840" height="170" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">The three frameworks, on what divides them</text><rect x="66" y="226" width="258" height="108" rx="10" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="195.0" y="250.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">PSYCHODYNAMIC</text><text x="195.0" y="270.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">Freud</text><text x="195.0" y="292.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">unconscious conflict</text><text x="195.0" y="312.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">human nature: conflicted</text><text x="195.0" y="326.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">testability: low</text><rect x="340" y="226" width="258" height="108" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="469.0" y="250.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">HUMANISTIC</text><text x="469.0" y="270.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">Rogers, Maslow</text><text x="469.0" y="292.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">an innate push to grow</text><text x="469.0" y="312.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">human nature: good</text><text x="469.0" y="326.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">testability: low</text><rect x="614" y="226" width="258" height="108" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="743.0" y="250.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">SOCIAL-COGNITIVE</text><text x="743.0" y="270.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">Bandura</text><text x="743.0" y="292.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">beliefs and observation</text><text x="743.0" y="312.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">human nature: neutral</text><text x="743.0" y="326.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">testability: high</text><rect x="40" y="370" width="840" height="196" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="398.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">Rogers, in the order it actually happens</text><rect x="66" y="418" width="188" height="86" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="160.0" y="446.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">conditional regard</text><text x="160.0" y="472.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">loved IF you perform</text><line x1="254" y1="461" x2="262" y2="461" stroke="#6d716f" stroke-width="1.8" marker-end="url(#m8314)"/><rect x="262" y="418" width="188" height="86" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="356.0" y="446.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">conditions of worth</text><text x="356.0" y="472.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">“only valuable if…”</text><line x1="450" y1="461" x2="458" y2="461" stroke="#6d716f" stroke-width="1.8" marker-end="url(#m8314)"/><rect x="458" y="418" width="188" height="86" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="552.0" y="446.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">self-concept distorts</text><text x="552.0" y="472.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">to fit the conditions</text><line x1="646" y1="461" x2="654" y2="461" stroke="#6d716f" stroke-width="1.8" marker-end="url(#m8314)"/><rect x="654" y="418" width="188" height="86" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="748.0" y="446.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">INCONGRUENCE</text><text x="748.0" y="466.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">with the ideal self, and</text><text x="748.0" y="482.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">with what you really value</text><text x="460.0" y="530.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">the cure runs backwards: unconditional positive regard · empathy · genuineness</text><text x="460.0" y="550.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">remove the conditions and the actualising tendency does the rest</text><rect x="40" y="586" width="470" height="304" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="275.0" y="614.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">The pairs that get confused</text><rect x="66" y="636" width="200" height="52" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="166.0" y="657.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">REPRESSION</text><text x="166.0" y="674.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">pushed out, unconsciously</text><rect x="284" y="636" width="200" height="52" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="384.0" y="657.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">SUPPRESSION</text><text x="384.0" y="674.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">pushed out, on purpose</text><rect x="66" y="694" width="200" height="52" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="166.0" y="715.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">PROJECTION</text><text x="166.0" y="732.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">my feeling, attributed to you</text><rect x="284" y="694" width="200" height="52" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="384.0" y="715.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">REACTION FORMATION</text><text x="384.0" y="732.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">my feeling, flipped in me</text><rect x="66" y="752" width="200" height="52" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="166.0" y="773.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">DISPLACEMENT</text><text x="166.0" y="790.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">same feeling, safer target</text><rect x="284" y="752" width="200" height="52" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="384.0" y="773.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">SUBLIMATION</text><text x="384.0" y="790.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">redirected into something useful</text><rect x="66" y="810" width="200" height="52" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="166.0" y="831.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">REGRESSION</text><text x="166.0" y="848.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">retreat to an earlier age</text><rect x="284" y="810" width="200" height="52" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="384.0" y="831.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">INTELLECTUALISATION</text><text x="384.0" y="848.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">all facts, no feeling</text><text x="275.0" y="880.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">sublimation is the mature one</text><rect x="530" y="586" width="350" height="304" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="705.0" y="614.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">Bandura&#x27;s loop</text><circle cx="705" cy="668" r="24" fill="#dde4ea" stroke="#18364a" stroke-width="2"/><text x="705.0" y="673.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">P</text><text x="705.0" y="636.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">person · beliefs</text><circle cx="620" cy="726" r="24" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="620.0" y="731.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">B</text><text x="600.0" y="760.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:10px">behaviour</text><circle cx="790" cy="726" r="24" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="790.0" y="731.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">E</text><text x="810.0" y="760.0" class="" text-anchor="middle" style="fill:#987740;font-size:10px">environment</text><path d="M686 684 q-34 14 -46 24" stroke="#6d716f" stroke-width="2" fill="none"/><path d="M644 718 q40 -34 40 -34" stroke="#6d716f" stroke-width="2" fill="none"/><line x1="644" y1="726" x2="766" y2="726" stroke="#6d716f" stroke-width="2"/><path d="M724 684 q34 14 46 24" stroke="#6d716f" stroke-width="2" fill="none"/><text x="705.0" y="790.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">each one changes the other two</text><text x="705.0" y="820.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:11px">self-efficacy, strongest source first:</text><text x="705.0" y="840.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">mastery → vicarious → persuasion → arousal</text><text x="705.0" y="862.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">domain-specific — not the same as self-esteem</text></svg>