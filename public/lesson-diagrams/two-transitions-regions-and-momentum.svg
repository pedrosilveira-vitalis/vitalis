<svg xmlns="http://www.w3.org/2000/svg" width="920" height="960" viewBox="0 0 920 960" role="img" aria-labelledby="t d"><title id="t">Where the world is on the curve</title><desc id="d">Top: the two transitions running in parallel. The demographic transition tracks how many people are born and die; the epidemiological transition tracks what they die OF. They move together because surviving infection is what lets a population live long enough to develop chronic disease. Middle: where the major regions sit today, which is the usual way a passage sets up its question. Bottom left: momentum, the reason a population keeps growing for decades after fertility reaches replacement. Bottom right: what the model is criticised for, which the exam does ask about.</desc><defs><marker id="m6818" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="960" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Where the world is on the curve</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">The same model, read across regions instead of across centuries</text><rect x="40" y="180" width="840" height="238" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">Two transitions, one clock</text><text x="72.0" y="240.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:10.5px">DEMOGRAPHIC</text><text x="72.0" y="336.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:10.5px">EPIDEMIOLOGICAL</text><text x="72.0" y="352.0" class="" text-anchor="start" style="fill:#6d716f;font-size:8px">(Omran, 1971)</text><rect x="230" y="232" width="148" height="56" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.6"/><text x="304.0" y="256.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">high births</text><text x="304.0" y="271.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">high deaths</text><rect x="230" y="328" width="148" height="56" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><text x="304.0" y="352.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">pestilence</text><text x="304.0" y="367.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">and famine</text><text x="304.0" y="306.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:9px">STAGE 1</text><line x1="382" y1="260" x2="404" y2="260" stroke="#6d716f" stroke-width="1.4" marker-end="url(#m6818)"/><line x1="382" y1="356" x2="404" y2="356" stroke="#6d716f" stroke-width="1.4" marker-end="url(#m6818)"/><rect x="404" y="232" width="148" height="56" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.6"/><text x="478.0" y="256.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">deaths FALL</text><text x="478.0" y="271.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">births stay high</text><rect x="404" y="328" width="148" height="56" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><text x="478.0" y="352.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">receding</text><text x="478.0" y="367.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">pandemics</text><text x="478.0" y="306.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:9px">STAGE 2</text><line x1="556" y1="260" x2="578" y2="260" stroke="#6d716f" stroke-width="1.4" marker-end="url(#m6818)"/><line x1="556" y1="356" x2="578" y2="356" stroke="#6d716f" stroke-width="1.4" marker-end="url(#m6818)"/><rect x="578" y="232" width="148" height="56" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.6"/><text x="652.0" y="256.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">births FALL</text><text x="652.0" y="271.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">deaths low</text><rect x="578" y="328" width="148" height="56" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><text x="652.0" y="352.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">degenerative</text><text x="652.0" y="367.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">disease</text><text x="652.0" y="306.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:9px">STAGE 3</text><line x1="730" y1="260" x2="752" y2="260" stroke="#6d716f" stroke-width="1.4" marker-end="url(#m6818)"/><line x1="730" y1="356" x2="752" y2="356" stroke="#6d716f" stroke-width="1.4" marker-end="url(#m6818)"/><rect x="752" y="232" width="148" height="56" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.6"/><text x="826.0" y="256.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">both low</text><text x="826.0" y="271.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">ageing</text><rect x="752" y="328" width="148" height="56" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><text x="826.0" y="352.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">delayed</text><text x="826.0" y="367.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">degenerative</text><text x="826.0" y="306.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:9px">STAGE 4</text><text x="460.0" y="400.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:9.5px">the DOUBLE BURDEN: a country still fighting infection while obesity and diabetes rise — India, Nigeria, Brazil, South Africa</text><rect x="40" y="434" width="840" height="182" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="462.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">Where the regions sit now</text><rect x="56" y="480" width="162" height="118" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="137.0" y="502.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:9.5px">SUB-SAHARAN</text><text x="137.0" y="515.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:9.5px">AFRICA</text><text x="137.0" y="538.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">stage 2 → early 3</text><text x="137.0" y="562.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">TFR 4–6; most of the</text><text x="137.0" y="576.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">world&#x27;s growth to 2100</text><rect x="222" y="480" width="162" height="118" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="303.0" y="502.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:9.5px">SOUTH ASIA</text><text x="303.0" y="538.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">stage 3</text><text x="303.0" y="562.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">India near replacement</text><text x="303.0" y="576.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">at about 2.0</text><rect x="388" y="480" width="162" height="118" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="469.0" y="502.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:9.5px">LATIN AMERICA</text><text x="469.0" y="538.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">stage 3–4</text><text x="469.0" y="562.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">fertility falling,</text><text x="469.0" y="576.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">growth slowing</text><rect x="554" y="480" width="162" height="118" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="635.0" y="502.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:9.5px">EUROPE · N. AMERICA</text><text x="635.0" y="538.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">stage 4</text><text x="635.0" y="562.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">below replacement,</text><text x="635.0" y="576.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">offset by immigration</text><rect x="720" y="480" width="162" height="118" rx="9" fill="#e8ecef" stroke="#18364a" stroke-width="1.8"/><text x="801.0" y="502.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">EAST ASIA</text><text x="801.0" y="538.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">stage 4–5</text><text x="801.0" y="562.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">Japan 1.2, Korea under</text><text x="801.0" y="576.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">1.0; shrinking</text><rect x="40" y="632" width="410" height="308" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="245.0" y="660.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13.5px">Why growth outlives high fertility</text><rect x="66" y="682" width="358" height="46" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="245.0" y="700.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">fertility reaches replacement, 2.1</text><text x="245.0" y="718.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">a woman now has just enough children to replace herself</text><line x1="245" y1="732" x2="245" y2="754" stroke="#6d716f" stroke-width="2.5" marker-end="url(#m6818)"/><rect x="66" y="760" width="358" height="58" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.6"/><text x="245.0" y="780.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">but the last large cohorts are still children</text><text x="245.0" y="798.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">they have not reached childbearing age yet, and there</text><text x="245.0" y="812.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">are far more of them than there are old people</text><line x1="245" y1="822" x2="245" y2="844" stroke="#6d716f" stroke-width="2.5" marker-end="url(#m6818)"/><rect x="66" y="850" width="358" height="64" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="245.0" y="872.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">POPULATION MOMENTUM</text><text x="245.0" y="890.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">births keep exceeding deaths for DECADES</text><text x="245.0" y="906.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">after fertility itself has stopped falling</text><text x="245.0" y="930.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">it is why the world is projected to peak near 10 billion around 2080–2100</text><rect x="470" y="632" width="410" height="308" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="675.0" y="660.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13.5px">What the model is criticised for</text><rect x="494" y="682" width="362" height="46" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.4"/><text x="675.0" y="699.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10px">EUROCENTRIC</text><text x="675.0" y="713.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">built on 18th–19th century western Europe;</text><text x="675.0" y="724.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">other regions need not follow the same path</text><rect x="494" y="734" width="362" height="46" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.4"/><text x="675.0" y="751.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10px">ASSUMES ONE LINE</text><text x="675.0" y="765.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">countries can stall, reverse, or skip —</text><text x="675.0" y="776.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">the stages are not a timetable</text><rect x="494" y="786" width="362" height="46" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.4"/><text x="675.0" y="803.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10px">IGNORES MIGRATION</text><text x="675.0" y="817.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">it models births minus deaths only, yet</text><text x="675.0" y="828.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">migration now drives growth in Stage 4 countries</text><rect x="494" y="838" width="362" height="46" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.4"/><text x="675.0" y="855.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10px">DESCRIBES, NOT EXPLAINS</text><text x="675.0" y="869.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">it says THAT fertility falls, not exactly</text><text x="675.0" y="880.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">why or when — so it predicts policy poorly</text><rect x="494" y="890" width="362" height="46" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.4"/><text x="675.0" y="907.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10px">THE AFRICAN EXCEPTION</text><text x="675.0" y="921.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">mortality fell without the expected</text><text x="675.0" y="932.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">fertility decline across several generations</text></svg>