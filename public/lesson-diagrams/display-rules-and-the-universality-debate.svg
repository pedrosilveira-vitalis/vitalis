<svg xmlns="http://www.w3.org/2000/svg" width="920" height="884" viewBox="0 0 920 884" role="img" aria-labelledby="t d"><title id="t">The face is universal; the permission to use it is not</title><desc id="d">Top: the Ekman and Friesen experiment that separates the two claims, and it is worth holding in mind as a single picture. Watching a distressing film alone, Japanese and American viewers made the same faces. Watching it with an authority figure in the room, the American viewers went on showing distress while the Japanese viewers covered it with smiles. The emotion did not differ; the display rule did. Middle: the four things a display rule can do to an expression, and the fact that these rules vary within a culture too — by gender, by role, by who is watching. Bottom: the universalist and constructionist positions, which the exam expects you to be able to argue either way, and the kinds of evidence each one leans on.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="884" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">The face is universal; the permission to use it is not</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Same emotion, different rules about showing it</text><rect x="40" y="170" width="840" height="236" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="198.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">Alone, the same face. Watched, a different one.</text><rect x="80" y="222" width="360" height="150" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="260.0" y="248.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">WATCHING ALONE</text><text x="260.0" y="278.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">Japanese viewers</text><text x="260.0" y="300.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">American viewers</text><line x1="170" y1="312" x2="350" y2="312" stroke="#5b7a64" stroke-width="1.4" stroke-dasharray="6 5"/><text x="260.0" y="334.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">the same disgust and distress</text><text x="260.0" y="356.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">no difference worth measuring</text><rect x="480" y="222" width="360" height="150" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="660.0" y="248.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">WITH AN AUTHORITY FIGURE</text><text x="660.0" y="278.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">Japanese viewers → masked with smiles</text><text x="660.0" y="300.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">American viewers → distress shown</text><line x1="570" y1="312" x2="750" y2="312" stroke="#a8324a" stroke-width="1.4" stroke-dasharray="6 5"/><text x="660.0" y="334.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">the display rule did the work</text><text x="660.0" y="356.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">the felt emotion was never the variable</text><rect x="40" y="422" width="840" height="196" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="450.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">Four things a display rule can do</text><rect x="66" y="472" width="190" height="104" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="161.0" y="500.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">INTENSIFY</text><text x="161.0" y="526.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">show more than you feel</text><text x="161.0" y="554.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">delight at a dull gift</text><rect x="264" y="472" width="190" height="104" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="359.0" y="500.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">DEINTENSIFY</text><text x="359.0" y="526.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">show less than you feel</text><text x="359.0" y="554.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">modesty after winning</text><rect x="462" y="472" width="190" height="104" rx="10" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="557.0" y="500.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">NEUTRALISE</text><text x="557.0" y="526.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">show nothing at all</text><text x="557.0" y="554.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">the poker face</text><rect x="660" y="472" width="190" height="104" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="755.0" y="500.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">MASK</text><text x="755.0" y="526.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">show a different emotion</text><text x="755.0" y="554.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">smiling over anger</text><text x="460.0" y="600.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">these vary within a culture as well as between: by gender, by role, by who is in the room</text><rect x="40" y="634" width="840" height="216" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="460.0" y="662.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">Two positions the exam wants you to argue either way</text><rect x="70" y="682" width="380" height="150" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="260.0" y="708.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">UNIVERSALIST · Ekman</text><text x="260.0" y="732.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">six basic emotions, recognised everywhere</text><text x="260.0" y="754.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">the Fore of Papua New Guinea matched them</text><text x="260.0" y="776.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">congenitally blind people make the faces</text><text x="260.0" y="798.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">FACS measures the muscles objectively</text><rect x="470" y="682" width="380" height="150" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="660.0" y="708.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">CONSTRUCTIONIST · Barrett</text><text x="660.0" y="732.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">no brain region maps onto one emotion</text><text x="660.0" y="754.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">languages cut the space up differently</text><text x="660.0" y="776.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">concepts and context build the feeling</text><text x="660.0" y="798.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">amae, saudade, fago have no translation</text></svg>