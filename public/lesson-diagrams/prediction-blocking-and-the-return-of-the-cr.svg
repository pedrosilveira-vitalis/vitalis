<svg xmlns="http://www.w3.org/2000/svg" width="920" height="872" viewBox="0 0 920 872" role="img" aria-labelledby="t d"><title id="t">Conditioning is about prediction, not mere pairing</title><desc id="d">Top left: blocking shown in two phases — a tone is first trained to predict the shock, then a light is added alongside it, and because the tone already predicts the shock perfectly the light is learned hardly at all. Beneath it the Rescorla-Wagner rule, in which the change in associative strength is proportional to how surprising the outcome still is. Top right: the four ways an extinguished response comes back — spontaneous recovery after a rest, renewal in a different context, reinstatement after the US alone, and rapid reacquisition on re-pairing — all of them evidence that extinction added new inhibitory learning rather than deleting the old association. Bottom left: discrimination training narrowing the generalisation gradient around the reinforced stimulus and shifting its peak away from the unreinforced one. Bottom right: the effects that change how readily something is learned — latent inhibition, overshadowing, preparedness and second-order conditioning.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="872" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Conditioning is about prediction, not mere pairing</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">If the CS tells you nothing you did not already know, nothing is learned</text><rect x="40" y="150" width="420" height="300" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="250.0" y="178.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">Blocking: no surprise, no learning</text><rect x="70" y="198" width="360" height="72" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="250.0" y="220.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">Phase 1</text><text x="250.0" y="244.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">tone → shock, many times</text><text x="250.0" y="262.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">the tone now predicts the shock fully</text><rect x="70" y="282" width="360" height="90" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="250.0" y="304.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">Phase 2</text><text x="250.0" y="328.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">tone + light → shock</text><text x="250.0" y="350.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">test the light alone: almost no fear</text><text x="250.0" y="366.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">nothing was left to explain</text><text x="250.0" y="400.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:19px">ΔV = αβ(λ − ΣV)</text><text x="250.0" y="426.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">learning stops as ΣV approaches λ</text><rect x="480" y="150" width="400" height="300" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="680.0" y="178.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">Four ways the response comes back</text><rect x="506" y="202" width="348" height="48" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="560.0" y="232.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:14px">spontaneous recovery</text><text x="840.0" y="232.0" class="" text-anchor="end" style="fill:#6d716f;font-size:12px">just let time pass</text><rect x="506" y="256" width="348" height="48" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="560.0" y="286.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:14px">renewal</text><text x="840.0" y="286.0" class="" text-anchor="end" style="fill:#6d716f;font-size:12px">test it somewhere else</text><rect x="506" y="310" width="348" height="48" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="560.0" y="340.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:14px">reinstatement</text><text x="840.0" y="340.0" class="" text-anchor="end" style="fill:#6d716f;font-size:12px">give the US on its own</text><rect x="506" y="364" width="348" height="48" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="560.0" y="394.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:14px">rapid reacquisition</text><text x="840.0" y="394.0" class="" text-anchor="end" style="fill:#6d716f;font-size:12px">re-pair once or twice</text><text x="680.0" y="438.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">so extinction wrote something new; it erased nothing</text><rect x="40" y="466" width="420" height="250" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="250.0" y="494.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">Training discrimination narrows the gradient</text><line x1="110" y1="636" x2="410" y2="636" stroke="#18364a" stroke-width="2"/><line x1="110" y1="516" x2="110" y2="636" stroke="#18364a" stroke-width="2"/><text x="260.0" y="680.0" class="" text-anchor="middle" style="font-size:17px">stimulus along the dimension</text><text x="66" y="576.0" text-anchor="middle" transform="rotate(-90 66 576.0)" style="font-size:17px">CR</text><path d="M110.0 635.1 L114.7 634.7 L119.4 634.3 L124.1 633.8 L128.8 633.2 L133.4 632.4 L138.1 631.4 L142.8 630.2 L147.5 628.8 L152.2 627.0 L156.9 625.0 L161.6 622.6 L166.2 619.9 L170.9 616.8 L175.6 613.3 L180.3 609.3 L185.0 605.0 L189.7 600.4 L194.4 595.3 L199.1 590.0 L203.8 584.5 L208.4 578.8 L213.1 573.1 L217.8 567.4 L222.5 561.9 L227.2 556.7 L231.9 551.8 L236.6 547.5 L241.2 543.8 L245.9 540.8 L250.6 538.7 L255.3 537.3 L260.0 536.9 L264.7 537.3 L269.4 538.7 L274.1 540.8 L278.8 543.8 L283.4 547.5 L288.1 551.8 L292.8 556.7 L297.5 561.9 L302.2 567.4 L306.9 573.1 L311.6 578.8 L316.2 584.5 L320.9 590.0 L325.6 595.3 L330.3 600.4 L335.0 605.0 L339.7 609.3 L344.4 613.3 L349.1 616.8 L353.8 619.9 L358.4 622.6 L363.1 625.0 L367.8 627.0 L372.5 628.8 L377.2 630.2 L381.9 631.4 L386.6 632.4 L391.2 633.2 L395.9 633.8 L400.6 634.3 L405.3 634.7 L410.0 635.1" stroke="#6d716f" stroke-width="2.2" fill="none" stroke-dasharray="8 6"/><path d="M110.0 636.0 L114.7 636.0 L119.4 636.0 L124.1 636.0 L128.8 636.0 L133.4 636.0 L138.1 636.0 L142.8 636.0 L147.5 636.0 L152.2 636.0 L156.9 636.0 L161.6 636.0 L166.2 636.0 L170.9 636.0 L175.6 636.0 L180.3 636.0 L185.0 636.0 L189.7 636.0 L194.4 635.9 L199.1 635.9 L203.8 635.8 L208.4 635.5 L213.1 635.1 L217.8 634.4 L222.5 633.3 L227.2 631.4 L231.9 628.6 L236.6 624.5 L241.2 618.8 L245.9 611.4 L250.6 602.1 L255.3 591.2 L260.0 579.0 L264.7 566.4 L269.4 554.3 L274.1 543.9 L278.8 536.2 L283.4 532.2 L288.1 532.2 L292.8 536.2 L297.5 543.9 L302.2 554.3 L306.9 566.4 L311.6 579.0 L316.2 591.2 L320.9 602.1 L325.6 611.4 L330.3 618.8 L335.0 624.5 L339.7 628.6 L344.4 631.4 L349.1 633.3 L353.8 634.4 L358.4 635.1 L363.1 635.5 L367.8 635.8 L372.5 635.9 L377.2 635.9 L381.9 636.0 L386.6 636.0 L391.2 636.0 L395.9 636.0 L400.6 636.0 L405.3 636.0 L410.0 636.0" stroke="#5b7a64" stroke-width="2.8" fill="none"/><line x1="260.0" y1="636.0" x2="260.0" y2="624.0" stroke="#18364a" stroke-width="2"/><text x="260.0" y="656.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">CS+</text><line x1="194.375" y1="636.0" x2="194.375" y2="624.0" stroke="#a8324a" stroke-width="2"/><text x="194.4" y="656.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">CS−</text><circle cx="285.78125" cy="531.6521739130435" r="4" fill="#5b7a64" stroke="#5b7a64" stroke-width="2"/><text x="293.8" y="523.7" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:12px">peak shift</text><text x="250.0" y="700.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">before training (dashed) the gradient is broad and centred on the CS+</text><rect x="480" y="466" width="400" height="250" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="680.0" y="494.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">What makes a CS easy or hard to learn</text><text x="690.0" y="524.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:bold;font-size:13px">latent inhibition</text><text x="700.0" y="524.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">seen it before with no US ⇒ slower</text><text x="690.0" y="552.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:bold;font-size:13px">overshadowing</text><text x="700.0" y="552.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">a louder partner CS takes the strength</text><text x="690.0" y="580.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:bold;font-size:13px">preparedness</text><text x="700.0" y="580.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">taste–nausea is learned in one trial;</text><text x="700.0" y="608.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">tone–nausea hardly at all</text><text x="690.0" y="636.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:bold;font-size:13px">second-order</text><text x="700.0" y="636.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">CS1 can train CS2 — weaker, and CS1</text><text x="700.0" y="664.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">extinguishes while you do it</text><text x="680.0" y="700.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">partial reinforcement during training slows extinction later</text><text x="460.0" y="760.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">Contiguity is not enough — the CS must raise the odds of the US</text><text x="460.0" y="792.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">A US that occurs just as often without the CS teaches nothing (Rescorla)</text><text x="460.0" y="822.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">Clinically: relapse after exposure therapy is the same four effects,</text><text x="460.0" y="846.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">which is why extinction is practised in many contexts</text></svg>