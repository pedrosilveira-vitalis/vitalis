<svg xmlns="http://www.w3.org/2000/svg" width="900" height="740" viewBox="0 0 900 740" role="img" aria-labelledby="t d"><title id="t">Counting sigma bonds and lone pairs gives the hybridization</title><desc id="d">Three columns compare sp3, sp2 and sp centers: the count of sigma bonds plus lone pairs, the resulting geometry, bond angle, percent s character, and an example. A lower panel shows a carbonyl oxygen, where both lone pairs sit in sp2 orbitals because the unhybridized p orbital is already used by the pi bond.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="900" height="740" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Counting sigma bonds and lone pairs gives the hybridization</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Add sigma bonds + lone pairs on the atom. Ignore pi bonds. The sum is the number of hybrid orbitals.</text><rect x="45" y="96" width="250" height="66" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="170.0" y="124.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:30px">sp³</text><text x="170.0" y="150.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">4 sigma bonds + lone pairs</text><circle cx="170" cy="228" r="11" fill="#18364a" stroke="#18364a" stroke-width="0"/><line x1="170" y1="228" x2="108" y2="194" stroke="#18364a" stroke-width="2"/><circle cx="108" cy="194" r="7" fill="#ffffff" stroke="#18364a" stroke-width="2"/><line x1="170" y1="228" x2="232" y2="194" stroke="#18364a" stroke-width="2"/><circle cx="232" cy="194" r="7" fill="#ffffff" stroke="#18364a" stroke-width="2"/><line x1="170" y1="228" x2="140" y2="274" stroke="#18364a" stroke-width="2"/><circle cx="140" cy="274" r="7" fill="#ffffff" stroke="#18364a" stroke-width="2"/><line x1="170" y1="228" x2="204" y2="268" stroke="#18364a" stroke-width="2"/><circle cx="204" cy="268" r="7" fill="#ffffff" stroke="#18364a" stroke-width="2"/><text x="170.0" y="306.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">tetrahedral</text><text x="170.0" y="330.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">109.5°  ·  25% s</text><text x="170.0" y="354.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">CH₄, NH₃, H₂O</text><rect x="325" y="96" width="250" height="66" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="450.0" y="124.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:30px">sp²</text><text x="450.0" y="150.0" class="" text-anchor="middle" style="fill:#245574;font-size:14px">3 sigma bonds + lone pairs</text><circle cx="450" cy="228" r="11" fill="#245574" stroke="#245574" stroke-width="0"/><line x1="450" y1="228" x2="450" y2="176" stroke="#245574" stroke-width="2"/><circle cx="450" cy="176" r="7" fill="#ffffff" stroke="#245574" stroke-width="2"/><line x1="450" y1="228" x2="404" y2="256" stroke="#245574" stroke-width="2"/><circle cx="404" cy="256" r="7" fill="#ffffff" stroke="#245574" stroke-width="2"/><line x1="450" y1="228" x2="496" y2="256" stroke="#245574" stroke-width="2"/><circle cx="496" cy="256" r="7" fill="#ffffff" stroke="#245574" stroke-width="2"/><text x="450.0" y="230.0" class="" text-anchor="middle" style="fill:#245574"></text><text x="450.0" y="306.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">trigonal planar</text><text x="450.0" y="330.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">120°  ·  33% s</text><text x="450.0" y="354.0" class="" text-anchor="middle" style="fill:#245574;font-size:15px">C₂H₄, C=O, benzene</text><rect x="605" y="96" width="250" height="66" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="730.0" y="124.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:30px">sp</text><text x="730.0" y="150.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:14px">2 sigma bonds + lone pairs</text><circle cx="730" cy="228" r="11" fill="#a8324a" stroke="#a8324a" stroke-width="0"/><line x1="730" y1="228" x2="668" y2="228" stroke="#a8324a" stroke-width="2"/><circle cx="668" cy="228" r="7" fill="#ffffff" stroke="#a8324a" stroke-width="2"/><line x1="730" y1="228" x2="792" y2="228" stroke="#a8324a" stroke-width="2"/><circle cx="792" cy="228" r="7" fill="#ffffff" stroke="#a8324a" stroke-width="2"/><text x="730.0" y="306.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">linear</text><text x="730.0" y="330.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">180°  ·  50% s</text><text x="730.0" y="354.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:15px">HC≡CH, CO₂, HCN</text><rect x="60" y="388" width="780" height="52" rx="10" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="450.0" y="410.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">Unhybridized p orbitals left over:  sp³ → none   ·   sp² → one   ·   sp → two</text><text x="450.0" y="431.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">Each leftover p orbital makes one pi bond. Pi bonds never change the hybridization.</text><rect x="60" y="462" width="780" height="148" rx="12" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="450.0" y="486.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:19px">Worked case: the oxygen of a carbonyl (C=O)</text><circle cx="215" cy="548" r="16" fill="#ffffff" stroke="#5b7a64" stroke-width="2.5"/><text x="215.0" y="554.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:19px">O</text><circle cx="123" cy="548" r="16" fill="#ffffff" stroke="#18364a" stroke-width="2.5"/><text x="123.0" y="554.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:19px">C</text><line x1="139" y1="544" x2="199" y2="544" stroke="#18364a" stroke-width="2.5"/><line x1="139" y1="552" x2="199" y2="552" stroke="#a8324a" stroke-width="2.5"/><text x="169.0" y="534.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">σ</text><text x="169.0" y="572.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:14px">π</text><circle cx="241" cy="526" r="3.5" fill="#5b7a64" stroke="#5b7a64" stroke-width="0"/><circle cx="253" cy="526" r="3.5" fill="#5b7a64" stroke="#5b7a64" stroke-width="0"/><circle cx="241" cy="570" r="3.5" fill="#5b7a64" stroke="#5b7a64" stroke-width="0"/><circle cx="253" cy="570" r="3.5" fill="#5b7a64" stroke="#5b7a64" stroke-width="0"/><text x="267.0" y="531.0" class="" text-anchor="start" style="fill:#5b7a64;font-size:14px">lone pair (sp²)</text><text x="267.0" y="575.0" class="" text-anchor="start" style="fill:#5b7a64;font-size:14px">lone pair (sp²)</text><text x="560.0" y="518.0" class="" text-anchor="start" style="fill:#18364a;font-size:15px">1 sigma bond + 2 lone pairs = 3 → sp².</text><text x="560.0" y="538.0" class="" text-anchor="start" style="fill:#18364a;font-size:15px">Both lone pairs occupy sp² orbitals in the</text><text x="560.0" y="558.0" class="" text-anchor="start" style="fill:#18364a;font-size:15px">plane. The unhybridized p orbital is</text><text x="560.0" y="578.0" class="" text-anchor="start" style="fill:#18364a;font-size:15px">already holding the pi bond, so it cannot</text><text x="560.0" y="598.0" class="" text-anchor="start" style="fill:#18364a;font-size:15px">also hold a lone pair.</text><line x1="60" y1="644" x2="96" y2="644" stroke="#18364a" stroke-width="3"/><text x="106.0" y="649.0" class="" text-anchor="start" style="font-size:15px">In the C=O panel — Navy: sigma bond</text><line x1="60" y1="670" x2="96" y2="670" stroke="#a8324a" stroke-width="3"/><text x="106.0" y="675.0" class="" text-anchor="start" style="font-size:15px">Red: pi bond from the p orbitals</text><line x1="60" y1="696" x2="96" y2="696" stroke="#5b7a64" stroke-width="3"/><text x="106.0" y="701.0" class="" text-anchor="start" style="font-size:15px">Sage: lone pairs on oxygen</text></svg>