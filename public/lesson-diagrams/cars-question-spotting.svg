<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="770" viewBox="0 0 1000 770" role="img" aria-labelledby="t d"><title id="t">Spotting the question from its first few words</title><desc id="d">A table of seven question types. Each row gives the giveaway phrases in the stem, the task the question is really setting, and the characteristic wrong answer. Main idea or primary purpose: primary purpose, mainly concerned with, best describes the passage, most appropriate title; characterize the whole passage; wrong answers are too specific, too broad, or the wrong tone. Detail or retrieval: according to the passage, the author states, the passage indicates, as described in; locate what is explicitly written; wrong answers are true in the world but never stated, or a slight distortion. Inference: it can be inferred, the author implies, the passage suggests, would most likely agree; extend the author&#x27;s logic exactly one step; wrong answers are too extreme or mere speculation. Function or structure: primarily in order to, serves to, the function of, why does the author include; name the rhetorical move; the classic wrong answer summarizes what the section says instead of what it does. Strengthen or weaken: if true, would support, would undermine, would challenge; judge how new information bears on a specific claim; wrong answers run in the opposite direction or are merely on-topic. Application: most analogous, suppose, how would the author respond; match the underlying principle, not the surface content; the wrong answer shares surface features but different logic. Vocabulary in context: as used in the passage, in the context of, most nearly means; find the contextual meaning; the trap is the word&#x27;s most common dictionary definition. A footer names the three costly category errors: hunting the passage for an inference that was never stated, answering a function question with a content summary, and treating a strengthen question as if consistency with the author were the same as evidence for the author.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="770" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Spotting the question from its first few words</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Classify the stem before you look at the choices. The task verb tells you what kind of thinking to use.</text><text x="44.0" y="128.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:700;font-size:11px">type</text><text x="250.0" y="128.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:700;font-size:11px">giveaway phrases in the stem</text><text x="600.0" y="128.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:700;font-size:11px">the real task</text><text x="800.0" y="128.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:700;font-size:11px">classic wrong answer</text><rect x="30" y="140" width="940" height="62" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="44.0" y="168.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:700;font-size:13px">Main idea / purpose</text><text x="250.0" y="166.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">primary purpose · mainly concerned with ·</text><text x="250.0" y="180.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">best title</text><text x="600.0" y="166.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">Characterize the WHOLE</text><text x="600.0" y="180.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">passage</text><text x="800.0" y="166.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">too specific · too broad ·</text><text x="800.0" y="180.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">wrong tone</text><rect x="30" y="210" width="940" height="62" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="44.0" y="238.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:13px">Detail / retrieval</text><text x="250.0" y="236.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">according to · the author states · indicates</text><text x="600.0" y="236.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">Locate what is explicitly</text><text x="600.0" y="250.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">written</text><text x="800.0" y="236.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">true in the world, never</text><text x="800.0" y="250.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">stated</text><rect x="30" y="280" width="940" height="62" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="44.0" y="308.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:700;font-size:13px">Inference</text><text x="250.0" y="306.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">it can be inferred · implies · suggests ·</text><text x="250.0" y="320.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">would agree</text><text x="600.0" y="306.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">Extend the logic exactly</text><text x="600.0" y="320.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">ONE step</text><text x="800.0" y="306.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">too extreme · speculation</text><rect x="30" y="350" width="940" height="62" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="44.0" y="378.0" class="" text-anchor="start" style="fill:#987740;font-weight:700;font-size:13px">Function / structure</text><text x="250.0" y="376.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">primarily in order to · serves to · the</text><text x="250.0" y="390.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">function of</text><text x="600.0" y="376.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">Name the rhetorical MOVE</text><text x="800.0" y="376.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">summarizes content, not</text><text x="800.0" y="390.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">function</text><rect x="30" y="420" width="940" height="62" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="44.0" y="448.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:13px">Strengthen / weaken</text><text x="250.0" y="446.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">if true · would support · would undermine</text><text x="600.0" y="446.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">Judge new info against a</text><text x="600.0" y="460.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">specific claim</text><text x="800.0" y="446.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">opposite direction ·</text><text x="800.0" y="460.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">merely on-topic</text><rect x="30" y="490" width="940" height="62" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="44.0" y="518.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:700;font-size:13px">Application</text><text x="250.0" y="516.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">most analogous · suppose · how would the</text><text x="250.0" y="530.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">author respond</text><text x="600.0" y="516.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">Match the principle, not</text><text x="600.0" y="530.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">the surface</text><text x="800.0" y="516.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">same surface, different</text><text x="800.0" y="530.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">logic</text><rect x="30" y="560" width="940" height="62" rx="9" fill="#efede8" stroke="#6d716f" stroke-width="1.8"/><text x="44.0" y="588.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:700;font-size:13px">Vocabulary in context</text><text x="250.0" y="586.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">as used in · in the context of · most nearly</text><text x="250.0" y="600.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">means</text><text x="600.0" y="586.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">Find the CONTEXTUAL</text><text x="600.0" y="600.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">meaning</text><text x="800.0" y="586.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">the common dictionary</text><text x="800.0" y="600.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">definition</text><rect x="30" y="638" width="940" height="96" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="500.0" y="668.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:15px">The three costly category errors</text><text x="500.0" y="691.0" class="" text-anchor="middle" style="font-size:13px">Hunting the passage for an inference that was never stated. · Answering a function question with a</text><text x="500.0" y="709.0" class="" text-anchor="middle" style="font-size:13px">content summary. · Treating a strengthen question as if being consistent with the author were the same</text><text x="500.0" y="727.0" class="" text-anchor="middle" style="font-size:13px">as being evidence for the author.</text></svg>