<svg xmlns="http://www.w3.org/2000/svg" width="920" height="884" viewBox="0 0 920 884" role="img" aria-labelledby="t d"><title id="t">Three heuristics, three biases, two kinds of stuck</title><desc id="d">Top: the three heuristics the exam tests by name, each with the question it answers, the error it produces and the clinical form that error takes. Availability substitutes ease of recall for frequency; representativeness substitutes resemblance for probability, which is why base rates get dropped and why the conjunction fallacy appears; anchoring starts from the first number offered and never adjusts far enough. Middle: the strategies that are not shortcuts, and the distinction between means-end analysis and working backward, which are related but separate. Bottom: the two barriers that look alike and are not — functional fixedness is about what an object can be, mental set is about what a method can solve.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="884" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Three heuristics, three biases, two kinds of stuck</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Most of these questions are an identification task — name the shortcut, then name the error it makes</text><rect x="40" y="160" width="840" height="244" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="460.0" y="188.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">The three heuristics, and the error each one makes</text><text x="96.0" y="216.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:bold;font-size:11px">HEURISTIC</text><text x="300.0" y="216.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:bold;font-size:11px">SUBSTITUTES</text><text x="540.0" y="216.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:bold;font-size:11px">CLASSIC ERROR</text><line x1="70" y1="226" x2="850" y2="226" stroke="#6d716f" stroke-width="1" stroke-dasharray="6 5"/><rect x="70" y="242" width="200" height="40" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="170.0" y="267.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">Availability</text><text x="300.0" y="260.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">ease of recall</text><text x="300.0" y="276.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">for frequency</text><text x="540.0" y="260.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">vivid or recent events</text><text x="540.0" y="276.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">feel more common</text><rect x="70" y="288" width="200" height="40" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="170.0" y="313.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">Representativeness</text><text x="300.0" y="306.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">resemblance</text><text x="300.0" y="322.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">for probability</text><text x="540.0" y="306.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">base rates dropped;</text><text x="540.0" y="322.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">conjunction fallacy</text><rect x="70" y="334" width="200" height="40" rx="7" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="170.0" y="359.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">Anchoring</text><text x="300.0" y="352.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">the first number</text><text x="300.0" y="368.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">for a fresh estimate</text><text x="540.0" y="352.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">adjustment is always</text><text x="540.0" y="368.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">too small</text><text x="460.0" y="392.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">in a clinic: recently seen → overdiagnosed · looks typical → base rate ignored · first impression → premature closure</text><rect x="40" y="412" width="840" height="212" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="440.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">The strategies that are not shortcuts</text><rect x="66" y="462" width="192" height="118" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="162.0" y="488.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">ALGORITHM</text><text x="162.0" y="510.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">every step, every time</text><text x="162.0" y="536.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">guarantees the answer;</text><text x="162.0" y="554.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">may take forever</text><rect x="264" y="462" width="192" height="118" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="360.0" y="488.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">MEANS–END ANALYSIS</text><text x="360.0" y="510.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">shrink the gap</text><text x="360.0" y="536.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">set subgoals that reduce</text><text x="360.0" y="554.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">current-to-goal distance</text><rect x="462" y="462" width="192" height="118" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="558.0" y="488.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">WORKING BACKWARD</text><text x="558.0" y="510.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">start at the goal</text><text x="558.0" y="536.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">ask what must be true</text><text x="558.0" y="554.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">just before it — a separate heuristic</text><rect x="660" y="462" width="192" height="118" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="756.0" y="488.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">ANALOGY</text><text x="756.0" y="510.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">borrow a structure</text><text x="756.0" y="536.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">needs deep similarity,</text><text x="756.0" y="554.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">not surface similarity</text><text x="460.0" y="604.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">insight is none of these: impasse, incubation, then the representation itself changes</text><rect x="40" y="640" width="840" height="212" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="668.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">The two barriers students confuse</text><rect x="70" y="688" width="380" height="142" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="260.0" y="714.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">FUNCTIONAL FIXEDNESS</text><text x="260.0" y="738.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">stuck on what an OBJECT is for</text><text x="260.0" y="764.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">Duncker&#x27;s candle: the tack box is</text><text x="260.0" y="782.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">a container, never a shelf</text><text x="260.0" y="808.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:11px">worse when the object is shown in use</text><rect x="470" y="688" width="380" height="142" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="660.0" y="714.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">MENTAL SET · EINSTELLUNG</text><text x="660.0" y="738.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">stuck on what a METHOD solves</text><text x="660.0" y="764.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">Luchins&#x27; jars: keep using B − A − 2C</text><text x="660.0" y="782.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">when A − C would do</text><text x="660.0" y="808.0" class="" text-anchor="middle" style="fill:#245574;font-size:11px">the old strategy still works — just badly</text></svg>