<svg xmlns="http://www.w3.org/2000/svg" width="920" height="960" viewBox="0 0 920 960" role="img" aria-labelledby="t d"><title id="t">Three institutions, one question asked three ways</title><desc id="d">Top: family, education and religion read through each of the three frameworks. The grid is the point — a passage is almost never asking which institution is involved, it is asking which reading of it the author has adopted. Functionalism names the need the institution meets. Conflict theory asks who the arrangement benefits and finds that advantage is handed down. Symbolic interactionism drops to the level of the classroom, the dinner table and the ritual. Bottom left: the religious organisation types, ordered by how much tension each has with the surrounding society. Bottom right: the health associations, which is where this material usually enters a question.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="960" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Three institutions, one question asked three ways</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">What does it do for society, whose interests does it serve, and how is it lived?</text><rect x="40" y="180" width="840" height="420" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">The grid the exam is really testing</text><rect x="262" y="226" width="200" height="38" rx="7" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="362.0" y="244.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">FUNCTIONALIST</text><text x="362.0" y="258.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">what need does it meet?</text><rect x="467" y="226" width="200" height="38" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><text x="567.0" y="244.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">CONFLICT</text><text x="567.0" y="258.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">who does it serve?</text><rect x="672" y="226" width="200" height="38" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.6"/><text x="772.0" y="244.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">INTERACTIONIST</text><text x="772.0" y="258.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">how is it lived?</text><rect x="60" y="274" width="190" height="94" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="155.0" y="327.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">FAMILY</text><rect x="262" y="274" width="200" height="94" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.4"/><text x="362.0" y="296.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">reproduction, primary</text><text x="362.0" y="310.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">socialization, status;</text><text x="362.0" y="324.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">Parsons&#x27;s instrumental</text><text x="362.0" y="338.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">and expressive roles</text><rect x="467" y="274" width="200" height="94" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.4"/><text x="567.0" y="296.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">hands down economic,</text><text x="567.0" y="310.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">cultural and social</text><text x="567.0" y="324.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">capital; Engels on</text><text x="567.0" y="338.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">inheritance</text><rect x="672" y="274" width="200" height="94" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.4"/><text x="772.0" y="296.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">the looking-glass self;</text><text x="772.0" y="310.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">family labels become</text><text x="772.0" y="324.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">self-concept</text><rect x="60" y="376" width="190" height="94" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="155.0" y="429.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">EDUCATION</text><rect x="262" y="376" width="200" height="94" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.4"/><text x="362.0" y="398.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">integration, placement,</text><text x="362.0" y="412.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">innovation; Durkheim on</text><text x="362.0" y="426.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">shared values</text><rect x="467" y="376" width="200" height="94" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.4"/><text x="567.0" y="398.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">social reproduction;</text><text x="567.0" y="412.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">Bourdieu — schools reward</text><text x="567.0" y="426.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">the capital the privileged</text><text x="567.0" y="440.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">already arrive with</text><rect x="672" y="376" width="200" height="94" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.4"/><text x="772.0" y="398.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">teacher expectations;</text><text x="772.0" y="412.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">Pygmalion and the</text><text x="772.0" y="426.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">self-fulfilling prophecy</text><rect x="60" y="478" width="190" height="94" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="155.0" y="531.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">RELIGION</text><rect x="262" y="478" width="200" height="94" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.4"/><text x="362.0" y="500.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">cohesion, meaning,</text><text x="362.0" y="514.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">control, support;</text><text x="362.0" y="528.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">Durkheim&#x27;s sacred</text><text x="362.0" y="542.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">and profane</text><rect x="467" y="478" width="200" height="94" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.4"/><text x="567.0" y="500.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">Marx: the opium of the</text><text x="567.0" y="514.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">people — though liberation</text><text x="567.0" y="528.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">theology cuts the other</text><text x="567.0" y="542.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">way</text><rect x="672" y="478" width="200" height="94" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.4"/><text x="772.0" y="500.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">ritual makes shared</text><text x="772.0" y="514.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">symbols; conversion</text><text x="772.0" y="528.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">remakes identity</text><text x="460.0" y="590.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">and Bellah&#x27;s CIVIL RELIGION applies the religious reading to secular ritual — flags, anthems, founding stories</text><rect x="40" y="616" width="410" height="326" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="245.0" y="644.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">Ordered by tension with society</text><rect x="64" y="666" width="362" height="43" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="245.0" y="684.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">ECCLESIA</text><text x="245.0" y="699.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">a state church; membership by birth</text><rect x="64" y="717" width="362" height="56" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="245.0" y="735.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">DENOMINATION</text><text x="245.0" y="750.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">one church among several, accepted</text><text x="245.0" y="763.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">and accommodated</text><rect x="64" y="781" width="362" height="56" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.6"/><text x="245.0" y="799.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10.5px">SECT</text><text x="245.0" y="814.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">broke away from a church; stricter,</text><text x="245.0" y="827.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">conversion-based, keeps its distance</text><rect x="64" y="845" width="362" height="69" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><text x="245.0" y="863.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">NEW RELIGIOUS MOVEMENT</text><text x="245.0" y="878.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">novel beliefs, often a charismatic</text><text x="245.0" y="891.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">founder, high tension — the word “cult”</text><text x="245.0" y="904.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">carries judgement, so sociologists avoid it</text><text x="245.0" y="928.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">low tension at the top, high tension at the bottom</text><rect x="470" y="616" width="410" height="326" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="675.0" y="644.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">Where this enters a health question</text><rect x="494" y="666" width="362" height="54" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.6"/><text x="675.0" y="683.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10px">EDUCATION</text><text x="675.0" y="697.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">the strongest single social predictor of</text><text x="675.0" y="710.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">health — via income, literacy and control</text><rect x="494" y="728" width="362" height="67" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.6"/><text x="675.0" y="745.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10px">MARRIAGE AND FAMILY</text><text x="675.0" y="759.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">lower mortality and depression; support</text><text x="675.0" y="772.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">blunts the cortisol response — but quality</text><text x="675.0" y="785.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">matters, and the effect is larger for men</text><rect x="494" y="803" width="362" height="67" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="675.0" y="820.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10px">RELIGIOUS ATTENDANCE</text><text x="675.0" y="834.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">lower all-cause mortality, partly through</text><text x="675.0" y="847.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">dense social support and health norms;</text><text x="675.0" y="860.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">Adventists are the natural experiment</text><rect x="494" y="878" width="362" height="67" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><text x="675.0" y="895.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10px">AND THE OTHER DIRECTION</text><text x="675.0" y="909.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">prayer substituted for care, shame around</text><text x="675.0" y="922.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">illness, refusal of specific treatments — take</text><text x="675.0" y="935.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">a spiritual history rather than assuming</text></svg>