<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc"><title id="title">Cardiac conduction and ECG</title><desc id="desc">A chamber-based conduction sketch traces SA to AV to His to bundle branches and Purkinje fibers. A schematic ECG marks P QRS T and correctly bounded PR and QT intervals.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#245574"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#18364a;font-size:18px}.h{font-size:25px;font-weight:700}.small{font-size:15px}.label{font-size:20px;font-weight:700}</style><rect width="900" height="760" rx="20" fill="#fbf7ef"/><text x="32" y="43" class="h" text-anchor="start">Electrical activation has a route and a timing</text><text x="32" y="75" class="small" text-anchor="start">Chamber diagram is schematic; not an anatomical drawing.</text><rect x="70" y="110" width="210" height="100" rx="12" fill="#e4edf3" stroke="#245574"/><text x="160" y="196" class="" text-anchor="middle">Right atrium</text><rect x="290" y="110" width="210" height="100" rx="12" fill="#e4edf3" stroke="#245574"/><text x="395.0" y="166.0" class="" text-anchor="middle">Left atrium</text><rect x="70" y="230" width="210" height="160" rx="12" fill="#e4edf3" stroke="#245574"/><text x="175.0" y="374" class="" text-anchor="middle">Right ventricle</text><rect x="290" y="230" width="210" height="160" rx="12" fill="#e4edf3" stroke="#245574"/><text x="395.0" y="374" class="" text-anchor="middle">Left ventricle</text><circle cx="115" cy="135" r="9" fill="#245574" stroke="#245574" stroke-width="2"/><text x="130" y="135" class="small" text-anchor="start">SA</text><circle cx="245" cy="194" r="9" fill="#245574" stroke="#245574" stroke-width="2"/><text x="251" y="185" class="small" text-anchor="start">AV</text><path d="M122 143 L237 187" stroke="#245574" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M255 195 L285 228 V267" stroke="#245574" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="304" y="255" class="small" text-anchor="start">His</text><path d="M285 265 L170 345" stroke="#245574" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M285 265 L400 345" stroke="#245574" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="585" y="145" class="label" text-anchor="start">SA node sets the rhythm.</text><text x="585" y="189" class="" text-anchor="start">AV delay permits filling.</text><text x="585" y="233" class="" text-anchor="start">His–Purkinje pathways</text><text x="585" y="257" class="" text-anchor="start">rapidly distribute activation.</text><text x="585" y="316" class="" text-anchor="start">A surface ECG records</text><text x="585" y="340" class="" text-anchor="start">the net electrical projection</text><text x="585" y="364" class="" text-anchor="start">seen by a particular lead.</text><text x="32" y="425" class="h" text-anchor="start">One representative ECG beat</text><path d="M70 550 H820" stroke="#bdd0dc" stroke-width="1" fill="none"/><path d="M70 550 H140 Q160 550 170 530 Q185 510 200 535 Q210 550 225 550 H300 L315 565 L335 465 L355 585 L375 550 H475 Q500 550 525 520 Q560 475 595 520 Q625 550 650 550 H820" stroke="#245574" stroke-width="4" fill="none"/><text x="185" y="492" class="label" text-anchor="middle">P</text><text x="335" y="448" class="label" text-anchor="middle">QRS</text><text x="560" y="478" class="label" text-anchor="middle">T</text><path d="M140 622 V638 M140 630 H300 M300 622 V638" stroke="#245574" stroke-width="2" fill="none"/><text x="220.0" y="658" class="" text-anchor="middle">PR interval</text><path d="M300 682 V698 M300 690 H650 M650 682 V698" stroke="#245574" stroke-width="2" fill="none"/><text x="475.0" y="718" class="" text-anchor="middle">QT interval</text><path d="M140 555 V620" stroke="#245574" stroke-width="1" fill="none" stroke-dasharray="4 4"/><path d="M300 555 V680" stroke="#245574" stroke-width="1" fill="none" stroke-dasharray="4 4"/><path d="M650 555 V680" stroke="#245574" stroke-width="1" fill="none" stroke-dasharray="4 4"/><text x="32" y="748" class="small" text-anchor="start">P: atria depolarize   •   QRS: ventricles depolarize   •   T: ventricles repolarize</text></svg>