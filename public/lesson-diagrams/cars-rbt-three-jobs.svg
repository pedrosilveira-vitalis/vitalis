<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Reasoning Beyond the Text: three jobs</title><desc id="d">Three columns, one per task. Apply: the stem gives a scenario not in the passage and asks which case fits the author&#x27;s framework; the move is to abstract the passage&#x27;s principle into one general sentence, then match the new scenario to that structure; traps are the superficial match that shares vocabulary but not logic, the opposite case, and a principle the passage never endorsed. Strengthen or weaken: the stem offers a hypothetical finding and asks how it bears on the argument; the move is to name the central assumption first, then see whether the choice validates or attacks it, since strengthening can support a premise, validate an assumption, rule out an alternative explanation, or extend the pattern, while weakening can attack a premise, expose an unwarranted assumption, supply an alternative explanation, or show an exception; traps are irrelevant information, the wrong direction, an answer that proves too much, and a scope mismatch. Extend: the stem asks what the author would agree with or what follows; the move is to ask what must also be true if the argument is sound, requiring entailment rather than mere consistency; traps are the too-extreme extension, the merely consistent but unentailed answer, and guessing from the author&#x27;s apparent personality. A footer says to predict before reading the choices, match on logical structure rather than topic, and remember that a strengthener need only make the conclusion likelier, not prove it.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="620" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Reasoning Beyond the Text: three jobs</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">~40% of CARS — about 21 of 53 questions. Use the author&#x27;s logic; don&#x27;t judge whether it&#x27;s true.</text><rect x="30" y="104" width="306" height="390" rx="14" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="183.0" y="136.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:17px">APPLY</text><rect x="44" y="154" width="278" height="62" rx="8" fill="#ffffff" stroke="#5b7a64" stroke-width="1.5"/><text x="183.0" y="176.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">&quot;Which scenario would the author</text><text x="183.0" y="191.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">consider an example of…&quot;</text><text x="183.0" y="240.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">The move</text><text x="183.0" y="262.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">Abstract the principle into ONE</text><text x="183.0" y="278.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">general sentence, then match</text><text x="183.0" y="294.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">structure.</text><text x="183.0" y="348.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:13px">Traps</text><text x="183.0" y="370.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">· superficial match — same words,</text><text x="183.0" y="385.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">different logic</text><text x="183.0" y="410.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">· the opposite case</text><text x="183.0" y="435.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">· a principle the passage never</text><text x="183.0" y="450.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">endorsed</text><rect x="352" y="104" width="306" height="390" rx="14" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="505.0" y="136.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:17px">STRENGTHEN / WEAKEN</text><rect x="366" y="154" width="278" height="62" rx="8" fill="#ffffff" stroke="#245574" stroke-width="1.5"/><text x="505.0" y="176.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">&quot;Which of the following, if true,</text><text x="505.0" y="191.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">would most…&quot;</text><text x="505.0" y="240.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">The move</text><text x="505.0" y="262.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">Name the central assumption FIRST,</text><text x="505.0" y="278.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">then ask: does this validate or</text><text x="505.0" y="294.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">attack it?</text><text x="505.0" y="348.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:13px">Traps</text><text x="505.0" y="370.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">· irrelevant — same topic, no</text><text x="505.0" y="385.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">logical bearing</text><text x="505.0" y="410.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">· wrong direction (re-read the</text><text x="505.0" y="425.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">stem)</text><text x="505.0" y="450.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">· proves too much</text><text x="505.0" y="475.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">· scope mismatch</text><rect x="674" y="104" width="306" height="390" rx="14" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="827.0" y="136.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:17px">EXTEND</text><rect x="688" y="154" width="278" height="62" rx="8" fill="#ffffff" stroke="#a8324a" stroke-width="1.5"/><text x="827.0" y="176.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">&quot;The author would most likely</text><text x="827.0" y="191.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">agree that…&quot;</text><text x="827.0" y="240.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">The move</text><text x="827.0" y="262.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">If the argument is sound, what</text><text x="827.0" y="278.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">ELSE must be true? Entailment, not</text><text x="827.0" y="294.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">consistency.</text><text x="827.0" y="348.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:13px">Traps</text><text x="827.0" y="370.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">· too extreme — qualified claim</text><text x="827.0" y="385.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">made universal</text><text x="827.0" y="410.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">· merely consistent, not entailed</text><text x="827.0" y="435.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">· guessing the author&#x27;s</text><text x="827.0" y="450.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">personality</text><rect x="30" y="514" width="940" height="84" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="500.0" y="544.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:15px">Across all three</text><text x="500.0" y="567.0" class="" text-anchor="middle" style="font-size:13px">Predict before you read the choices. Match on logical structure, not topic. A strengthener only has to make the conclusion likelier — it</text><text x="500.0" y="585.0" class="" text-anchor="middle" style="font-size:13px">does not have to prove it.</text></svg>