<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">Glycolysis carbon and ATP accounting</title><desc id="desc">A six-carbon glucose consumes ATP at hexokinase and PFK1. Fructose bisphosphate splits into DHAP and GAP, and DHAP becomes GAP. Two GAP molecules each form NADH at GAPDH and ATP at PGK and pyruvate kinase, yielding two pyruvates and net two ATP.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#aa3653;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">Glycolysis: follow the six carbons</text><rect x="24" y="60" width="752" height="656" rx="16" fill="white" stroke="#d9d2c6"/><rect x="265" y="90" width="270" height="40" rx="9" fill="#e4eef1"/><text x="400.0" y="116" class="t" text-anchor="middle">Glucose (6C)</text><rect x="265" y="167" width="270" height="40" rx="9" fill="#e4eef1"/><text x="400.0" y="193" class="t" text-anchor="middle">G6P ⇌ F6P (6C)</text><rect x="265" y="244" width="270" height="40" rx="9" fill="#e4eef1"/><text x="400.0" y="270" class="t" text-anchor="middle">F1,6BP (6C)</text><path d="M400 132 V159 M395 151 L400 159 L405 151" class="bond"/><text x="450" y="147" class="s" text-anchor="start">Hexokinase: 1 ATP used</text><path d="M400 209 V236 M395 228 L400 236 L405 228" class="bond"/><text x="450" y="224" class="s" text-anchor="start">PFK-1: 1 ATP used</text><path d="M400 284 L400 307" class="bond" /><path d="M205 307 L595 307" class="bond" /><path d="M205 307 V329 M200 321 L205 329 L210 321" class="bond"/><path d="M595 307 V329 M590 321 L595 329 L600 321" class="bond"/><rect x="105" y="330" width="200" height="40" rx="9" fill="#e4eef1"/><text x="205.0" y="356" class="t" text-anchor="middle">DHAP (3C)</text><rect x="495" y="330" width="200" height="40" rx="9" fill="#e4eef1"/><text x="595.0" y="356" class="t" text-anchor="middle">GAP (3C)</text><path d="M310 350 L480 350" class="bond" /><path d="M470 345 L480 350 L470 355" class="bond"/><text x="395" y="337" class="s" text-anchor="middle">TPI</text><text x="400" y="398" class="t" text-anchor="middle">Two GAP molecules enter the payoff phase</text><rect x="90" y="427" width="255" height="40" rx="9" fill="#e4eef1"/><text x="217.5" y="453" class="t" text-anchor="middle">GAPDH</text><text x="390" y="453" class="t" text-anchor="start">→</text><text x="447" y="453" class="t" text-anchor="start">2 NADH</text><rect x="90" y="492" width="255" height="40" rx="9" fill="#e4eef1"/><text x="217.5" y="518" class="t" text-anchor="middle">PGK</text><text x="390" y="518" class="t" text-anchor="start">→</text><text x="447" y="518" class="t" text-anchor="start">2 ATP</text><rect x="90" y="557" width="255" height="40" rx="9" fill="#e4eef1"/><text x="217.5" y="583" class="t" text-anchor="middle">Pyruvate kinase</text><text x="390" y="583" class="t" text-anchor="start">→</text><text x="447" y="583" class="t" text-anchor="start">2 ATP + 2 pyruvate</text><text x="400" y="652" class="h" text-anchor="middle">4 ATP made − 2 ATP used = 2 ATP net</text><text x="400" y="689" class="s" text-anchor="middle">Each payoff enzyme processes two molecules per starting glucose.</text></svg>