<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-labelledby="title desc"><title id="title">Hardy-Weinberg weighted gamete square</title><desc id="desc">A weighted square with p=0.7 and q=0.3 shows probabilities 0.49 AA, two 0.21 heterozygote pathways and 0.09 aa. Separate genotype bars can have the same allele frequency despite different heterozygosity.</desc><rect width="960" height="820" rx="22" fill="#fbf7ef"/><style>text{font-family:Arial,sans-serif;fill:#18364a;font-size:20px}.title{font-size:28px;font-weight:700}.head{font-size:23px;font-weight:700}.small{font-size:17px}.mono{font-family:monospace;font-size:23px}.white{fill:white}</style><text x="32" y="44" class="title" text-anchor="start">Random union of gametes predicts genotype frequencies</text><text x="32" y="78" class="small" text-anchor="start">Diploid autosomal two-allele model • p = 0.70, q = 0.30</text><text x="310" y="116" class="" text-anchor="middle">A: 0.70</text><text x="510" y="116" class="" text-anchor="middle">a: 0.30</text><rect x="170" y="135" width="280" height="210" rx="0" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="310.0" y="246.0" class="" text-anchor="middle">AA  0.49</text><rect x="450" y="135" width="120" height="210" rx="0" fill="#dce9f0" stroke="#bdd0dc" stroke-width="2"/><text x="510.0" y="246.0" class="" text-anchor="middle">Aa  0.21</text><rect x="170" y="345" width="280" height="90" rx="0" fill="#dce9f0" stroke="#bdd0dc" stroke-width="2"/><text x="310.0" y="396.0" class="" text-anchor="middle">aA  0.21</text><rect x="450" y="345" width="120" height="90" rx="0" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="510.0" y="396.0" class="" text-anchor="middle">aa  0.09</text><text x="48" y="245" class="" text-anchor="start">A: 0.70</text><text x="48" y="395" class="" text-anchor="start">a: 0.30</text><text x="625" y="210" class="head" text-anchor="start">Two pathways</text><text x="625" y="246" class="" text-anchor="start">to heterozygosity:</text><text x="625" y="283" class="" text-anchor="start">pq + qp = 2pq</text><text x="625" y="320" class="" text-anchor="start">0.21 + 0.21 = 0.42</text><text x="625" y="392" class="small" text-anchor="start">Area = probability</text><text x="32" y="490" class="head" text-anchor="start">Same allele frequency, different genotype proportions</text><text x="32" y="526" class="small" text-anchor="start">Both rows below have p = f(AA) + ½ f(Aa) = 0.60.</text><text x="32" y="600" class="small" text-anchor="start">HWE prediction</text><rect x="235" y="575" width="237.6" height="48" rx="0" fill="#245574" stroke="#bdd0dc" stroke-width="2"/><text x="353.8" y="605" class="white" text-anchor="middle">AA 0.36</text><rect x="472.6" y="575" width="316.8" height="48" rx="0" fill="#bdd0dc" stroke="#bdd0dc" stroke-width="2"/><text x="631.0" y="605" class="small" text-anchor="middle">Aa 0.48</text><rect x="789.4000000000001" y="575" width="105.60000000000001" height="48" rx="0" fill="#ffffff" stroke="#bdd0dc" stroke-width="2"/><text x="842.2" y="605" class="small" text-anchor="middle">aa 0.16</text><text x="32" y="690" class="small" text-anchor="start">Observed sample</text><rect x="235" y="665" width="330.0" height="48" rx="0" fill="#245574" stroke="#bdd0dc" stroke-width="2"/><text x="400.0" y="695" class="white" text-anchor="middle">AA 0.50</text><rect x="565.0" y="665" width="132.0" height="48" rx="0" fill="#bdd0dc" stroke="#bdd0dc" stroke-width="2"/><text x="631.0" y="695" class="small" text-anchor="middle">Aa 0.20</text><rect x="697.0" y="665" width="198.0" height="48" rx="0" fill="#ffffff" stroke="#bdd0dc" stroke-width="2"/><text x="796.0" y="695" class="small" text-anchor="middle">aa 0.30</text><text x="32" y="767" class="small" text-anchor="start">A heterozygote deficit does not, by itself, prove a change in p over time.</text><text x="32" y="793" class="small" text-anchor="start">Investigate sampling, population structure, biology and genotyping quality.</text></svg>