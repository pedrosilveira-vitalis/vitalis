<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">Tissue-specific glycolytic regulation</title><desc id="desc">In the liver, glucagon cAMP and PKA favor the phosphatase activity of PFK2 FBPase2. Fructose 2,6-bisphosphate falls, reducing PFK1 activation and relieving FBPase1 inhibition. ATP is both PFK1 substrate and inhibitor. Glucokinase is kinetically cooperative, not a binary glucose switch.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#aa3653;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">Regulation: name the tissue first</text><rect x="24" y="60" width="752" height="355" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="94" class="h" text-anchor="start">1  Classic liver glucagon response</text><rect x="175" y="113" width="450" height="40" rx="9" fill="#e4eef1"/><text x="400.0" y="139" class="t" text-anchor="middle">Glucagon → cAMP → PKA</text><path d="M400 156 V178 M395 170 L400 178 L405 170" class="bond"/><rect x="175" y="187" width="450" height="40" rx="9" fill="#e4eef1"/><text x="400.0" y="213" class="t" text-anchor="middle">Phosphorylated PFK-2 / FBPase-2</text><path d="M400 230 V252 M395 244 L400 252 L405 244" class="bond"/><rect x="175" y="261" width="450" height="40" rx="9" fill="#e4eef1"/><text x="400.0" y="287" class="t" text-anchor="middle">F2,6BP decreases</text><path d="M400 305 L400 327" class="bond" /><path d="M195 327 L605 327" class="bond" /><path d="M195 327 V344 M190 336 L195 344 L200 336" class="bond"/><path d="M605 327 V344 M600 336 L605 344 L610 336" class="bond"/><rect x="45" y="345" width="300" height="40" rx="9" fill="#f4dce0"/><text x="195.0" y="371" class="t" text-anchor="middle">PFK-1: less activation</text><rect x="455" y="345" width="300" height="40" rx="9" fill="#e4eef1"/><text x="605.0" y="371" class="t" text-anchor="middle">FBPase-1: less inhibition</text><text x="400" y="404" class="s" text-anchor="middle">Bias: less glycolysis, more gluconeogenesis</text><rect x="24" y="431" width="752" height="128" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="465" class="h" text-anchor="start">2  ATP plays two roles at PFK-1</text><rect x="50" y="485" width="315" height="40" rx="9" fill="#e4eef1"/><text x="207.5" y="511" class="t" text-anchor="middle">Catalytic site: phosphate donor</text><rect x="405" y="485" width="345" height="40" rx="9" fill="#f4dce0"/><text x="577.5" y="511" class="t" text-anchor="middle">Regulatory site: inhibition at high ATP</text><text x="50" y="547" class="s" text-anchor="start">The net response depends on ATP, Mg²⁺, substrates and other effectors.</text><rect x="24" y="575" width="752" height="141" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="609" class="h" text-anchor="start">3  Glucokinase is not a binary switch</text><text x="50" y="645" class="t" text-anchor="start">Typical HK I–III: low glucose Km; inhibited by G6P.</text><text x="50" y="676" class="t" text-anchor="start">Glucokinase: higher glucose S₀.₅; not inhibited by G6P.</text><text x="50" y="701" class="s" text-anchor="start">Heart PFK-2 regulation differs from this liver model.</text></svg>