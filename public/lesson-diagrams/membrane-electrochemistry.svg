<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820" role="img" aria-labelledby="title desc"><title id="title">Voltage and concentration act together</title><desc id="desc">At minus70mV, sodium chemical and electrical forces favor entry; potassium has opposing forces and a smaller net outward drive. Matrix negative and alkaline both favor proton entry.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#245574"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#18364a;font-size:18px}.h{font-size:25px;font-weight:700}.s{font-size:15px}.label{font-size:20px;font-weight:600}.line{stroke:#245574;stroke-width:3;fill:none}.arrow{stroke:#245574;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect width="900" height="820" rx="22" fill="#fbf7ef"/><text x="32" y="45" class="h" text-anchor="start">Voltage and concentration act together</text><text x="32" y="75" class="s" text-anchor="start">Convention: V = inside − outside. Arrows show ion movement, not current.</text><rect x="355" y="105" width="70" height="375" rx="5" fill="#c6d9e5" stroke="#b6cbd8"/><circle cx="365" cy="116" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="415" cy="116" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="365" cy="138" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="415" cy="138" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="365" cy="160" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="415" cy="160" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="365" cy="182" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="415" cy="182" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="365" cy="204" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="415" cy="204" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="365" cy="226" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="415" cy="226" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="365" cy="248" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="415" cy="248" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="365" cy="270" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="415" cy="270" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="365" cy="292" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="415" cy="292" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="365" cy="314" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="415" cy="314" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="365" cy="336" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="415" cy="336" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="365" cy="358" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="415" cy="358" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="365" cy="380" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="415" cy="380" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="365" cy="402" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="415" cy="402" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="365" cy="424" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="415" cy="424" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="365" cy="446" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="415" cy="446" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="365" cy="468" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><circle cx="415" cy="468" r="5" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><text x="175" y="127" class="label" text-anchor="middle">OUTSIDE</text><text x="650" y="127" class="label" text-anchor="middle">CYTOSOL: −70 mV</text><text x="175" y="176" class="" text-anchor="middle">Na⁺: 145 mM</text><text x="650" y="176" class="" text-anchor="middle">Na⁺: 12 mM</text><path d="M210 205 H595" class="arrow"/><text x="460" y="197" class="s" text-anchor="start">Chemical force</text><path d="M210 240 H595" class="arrow"/><text x="460" y="232" class="s" text-anchor="start">Electrical force</text><text x="650" y="279" class="" text-anchor="middle">Net Na⁺ entry</text><text x="650" y="304" class="s" text-anchor="middle">V − E_Na ≈ −135 mV</text><text x="175" y="349" class="" text-anchor="middle">K⁺: 5 mM</text><text x="650" y="349" class="" text-anchor="middle">K⁺: 140 mM</text><path d="M595 375 H210" class="arrow"/><text x="460" y="367" class="s" text-anchor="start">Chemical force</text><path d="M210 415 H595" class="arrow"/><text x="460" y="407" class="s" text-anchor="start">Electrical force</text><text x="650" y="454" class="s" text-anchor="middle">Net K⁺ exit: V − E_K ≈ +17 mV</text><text x="32" y="511" class="s" text-anchor="start">Example values use a rounded 60 mV Nernst coefficient; concentrations stay fixed.</text><path d="M32 537 H868" class="line"/><text x="32" y="578" class="h" text-anchor="start">Mitochondria: both forces favor H⁺ entry</text><rect x="355" y="605" width="70" height="130" rx="5" fill="#c6d9e5" stroke="#b6cbd8"/><text x="175" y="632" class="" text-anchor="middle">INTERMEMBRANE</text><text x="175" y="658" class="s" text-anchor="middle">Higher [H⁺]</text><text x="665" y="632" class="" text-anchor="middle">MATRIX</text><text x="665" y="658" class="s" text-anchor="middle">Negative and more alkaline</text><path d="M210 691 H590" class="arrow"/><text x="650" y="722" class="s" text-anchor="middle">H⁺ → matrix</text><text x="32" y="770" class="s" text-anchor="start">If ΔΨ = −180 mV and ΔpH = +1: ΔG/F = −180 − 61.5 = −241.5 mV.</text><text x="32" y="796" class="s" text-anchor="start">ΔpH means pH_matrix − pH_intermembrane. Schematic is not to scale.</text></svg>