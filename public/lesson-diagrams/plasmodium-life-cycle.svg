<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="t d"><title id="t">Plasmodium life cycle: two hosts</title><desc id="d">A loop between a mosquito panel on the left and a human panel on the right. 1, an infected female Anopheles injects sporozoites while feeding. 2, sporozoites infect liver cells and multiply asexually into merozoites; P. vivax and P. ovale can leave dormant hypnozoites that cause relapses. 3, merozoites invade red blood cells and cycle through ring, trophozoite and schizont stages; synchronous rupture causes periodic fevers; P. falciparum makes infected cells stick to small-vessel walls. 4, some parasites become male and female gametocytes. 5, a feeding mosquito takes up gametocytes; gametes fuse in the mosquito gut to form a zygote, the only diploid stage, which becomes an oocyst producing sporozoites that move to the salivary glands. Drug notes: primaquine for hypnozoites, chloroquine and artemisinins for blood stages.</desc><defs><marker id="m1949" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker><marker id="m5264" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#987740"/></marker><marker id="m7365" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker><marker id="m8717" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="640" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Plasmodium life cycle: two hosts</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Asexual multiplication in humans; sexual reproduction in the Anopheles mosquito.</text><rect x="30" y="96" width="300" height="500" rx="14" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="180.0" y="126.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:16px">Mosquito (definitive host)</text><rect x="370" y="96" width="600" height="500" rx="14" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="670.0" y="126.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:16px">Human (intermediate host)</text><rect x="50" y="420" width="260" height="130" rx="12" fill="#ffffff" stroke="#a8324a" stroke-width="2"/><text x="180.0" y="450.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:14px">5 Sexual stage (gut)</text><text x="180.0" y="472.0" class="" text-anchor="middle" style="font-size:13px">gametes fuse → zygote (only diploid</text><text x="180.0" y="490.0" class="" text-anchor="middle" style="font-size:13px">stage) → oocyst → thousands of</text><text x="180.0" y="508.0" class="" text-anchor="middle" style="font-size:13px">sporozoites</text><rect x="50" y="160" width="260" height="90" rx="12" fill="#ffffff" stroke="#a8324a" stroke-width="2"/><text x="180.0" y="190.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:14px">Sporozoites</text><text x="180.0" y="212.0" class="" text-anchor="middle" style="font-size:13px">gather in salivary glands</text><line x1="180" y1="418" x2="180" y2="252" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m1949)"/><rect x="400" y="150" width="260" height="110" rx="12" fill="#ffffff" stroke="#245574" stroke-width="2"/><text x="530.0" y="180.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:14px">1 → 2 Liver stage</text><text x="530.0" y="202.0" class="" text-anchor="middle" style="font-size:13px">sporozoites infect hepatocytes;</text><text x="530.0" y="220.0" class="" text-anchor="middle" style="font-size:13px">asexual multiplication → merozoites</text><rect x="690" y="150" width="260" height="110" rx="12" fill="#ffffff" stroke="#987740" stroke-width="2"/><text x="820.0" y="180.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:14px">Hypnozoites</text><text x="820.0" y="202.0" class="" text-anchor="middle" style="font-size:13px">P. vivax, P. ovale: dormant in liver →</text><text x="820.0" y="220.0" class="" text-anchor="middle" style="font-size:13px">relapses (primaquine)</text><rect x="400" y="320" width="260" height="130" rx="12" fill="#ffffff" stroke="#245574" stroke-width="2"/><text x="530.0" y="350.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:14px">3 Blood stage</text><text x="530.0" y="372.0" class="" text-anchor="middle" style="font-size:13px">merozoites invade RBCs: ring →</text><text x="530.0" y="390.0" class="" text-anchor="middle" style="font-size:13px">trophozoite → schizont → rupture;</text><text x="530.0" y="408.0" class="" text-anchor="middle" style="font-size:13px">cyclic fevers</text><rect x="690" y="320" width="260" height="130" rx="12" fill="#ffffff" stroke="#a8324a" stroke-width="2"/><text x="820.0" y="350.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:14px">P. falciparum</text><text x="820.0" y="372.0" class="" text-anchor="middle" style="font-size:13px">infected RBCs stick to capillary walls</text><text x="820.0" y="390.0" class="" text-anchor="middle" style="font-size:13px">(PfEMP1) → cerebral malaria</text><rect x="400" y="490" width="260" height="80" rx="12" fill="#ffffff" stroke="#245574" stroke-width="2"/><text x="530.0" y="520.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:14px">4 Gametocytes</text><text x="530.0" y="542.0" class="" text-anchor="middle" style="font-size:13px">some parasites become sexual forms</text><line x1="530" y1="260" x2="530" y2="318" stroke="#245574" stroke-width="2.5" marker-end="url(#m8717)"/><line x1="660" y1="205" x2="688" y2="205" stroke="#987740" stroke-width="2" marker-end="url(#m5264)"/><path d="M 400 400 C 360 420, 360 360, 400 370" stroke="#245574" stroke-width="2.5" fill="none"/><line x1="530" y1="450" x2="530" y2="488" stroke="#245574" stroke-width="2.5" marker-end="url(#m8717)"/><line x1="310" y1="205" x2="398" y2="205" stroke="#a8324a" stroke-width="3" marker-end="url(#m1949)"/><text x="354.0" y="196.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">bite</text><line x1="398" y1="530" x2="312" y2="500" stroke="#18364a" stroke-width="3" marker-end="url(#m7365)"/><text x="354.0" y="560.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">feeding</text><text x="500.0" y="622.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">Sickle trait (HbAS) and G6PD deficiency give partial protection against severe malaria.</text></svg>