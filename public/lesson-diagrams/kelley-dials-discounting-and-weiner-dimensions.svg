<svg xmlns="http://www.w3.org/2000/svg" width="920" height="946" viewBox="0 0 920 946" role="img" aria-labelledby="t d"><title id="t">Kelley&#x27;s three dials, and what each setting means</title><desc id="d">Top: the three dimensions set out as switches, with the question each one answers and what a HIGH or a LOW reading contributes. The commonest mistake is misreading distinctiveness: a person who misbehaves only in one specific setting is HIGH on distinctiveness, which argues for the setting rather than the person. Middle: the three standard combinations and the attribution each produces. Bottom left: the two principles for the far more common case of a single observation, where the dials cannot be read at all. Bottom right: Weiner&#x27;s three dimensions, which pick up where the attribution leaves off and say what the person will feel and whether they will try again.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="946" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Kelley&#x27;s three dials, and what each setting means</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Read the vignette for all three before deciding — one dial alone decides nothing</text><rect x="40" y="180" width="840" height="232" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">Three dials, three questions</text><rect x="68" y="228" width="262" height="164" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="199.0" y="254.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">CONSENSUS</text><text x="199.0" y="274.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">do OTHER people do it too?</text><line x1="108" y1="288" x2="290" y2="288" stroke="#245574" stroke-width="1" stroke-dasharray="6 5"/><text x="199.0" y="310.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">HIGH — everyone does</text><text x="199.0" y="334.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">LOW — only this person</text><text x="199.0" y="368.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:9px"></text><text x="199.0" y="382.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:9px"></text><rect x="344" y="228" width="262" height="164" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="475.0" y="254.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">DISTINCTIVENESS</text><text x="475.0" y="274.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">do they do it ONLY here?</text><line x1="384" y1="288" x2="566" y2="288" stroke="#987740" stroke-width="1" stroke-dasharray="6 5"/><text x="475.0" y="310.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">HIGH — only this one target</text><text x="475.0" y="334.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">LOW — they do it everywhere</text><text x="475.0" y="368.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:9px">watch this one — “only on Mondays”</text><text x="475.0" y="382.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:9px">is HIGH, not low</text><rect x="620" y="228" width="262" height="164" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="751.0" y="254.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">CONSISTENCY</text><text x="751.0" y="274.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">do they do it EVERY time?</text><line x1="660" y1="288" x2="842" y2="288" stroke="#5b7a64" stroke-width="1" stroke-dasharray="6 5"/><text x="751.0" y="310.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">HIGH — always, over time</text><text x="751.0" y="334.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">LOW — it varies</text><text x="751.0" y="368.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:9px"></text><text x="751.0" y="382.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:9px"></text><rect x="40" y="428" width="840" height="182" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="460.0" y="456.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">The three combinations worth memorising</text><rect x="68" y="474" width="262" height="120" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="199.0" y="498.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12.5px">LOW · LOW · HIGH</text><text x="199.0" y="518.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">only they do it, they do it everywhere,</text><text x="199.0" y="532.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">and they always do it</text><text x="199.0" y="570.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">→ THE PERSON</text><rect x="344" y="474" width="262" height="120" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="475.0" y="498.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12.5px">HIGH · HIGH · HIGH</text><text x="475.0" y="518.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">everyone does it, only to this target,</text><text x="475.0" y="532.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">and always</text><text x="475.0" y="570.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">→ THE STIMULUS</text><rect x="620" y="474" width="262" height="120" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="751.0" y="498.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12.5px">LOW · HIGH · LOW</text><text x="751.0" y="518.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">nobody else does it, only here,</text><text x="751.0" y="532.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">and not reliably</text><text x="751.0" y="570.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">→ THE CIRCUMSTANCE</text><rect x="40" y="626" width="410" height="304" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="245.0" y="654.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">When you only see it once</text><text x="245.0" y="674.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">the dials need repeated observations; usually you have one</text><rect x="64" y="692" width="362" height="108" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="245.0" y="716.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">DISCOUNTING</text><text x="245.0" y="736.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">another plausible cause is present</text><text x="245.0" y="758.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10.5px">→ trust the dispositional reading LESS</text><text x="245.0" y="778.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">the salesman is enthusiastic — and paid to be</text><rect x="64" y="812" width="362" height="108" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="245.0" y="836.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">AUGMENTATION</text><text x="245.0" y="856.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">the behaviour happened DESPITE a cost</text><text x="245.0" y="878.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">→ trust the dispositional reading MORE</text><text x="245.0" y="898.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">the researcher publishes against their own interest</text><rect x="470" y="626" width="410" height="304" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="675.0" y="654.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">Weiner: what follows from it</text><rect x="494" y="676" width="362" height="48" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><text x="560.0" y="695.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">ABILITY</text><text x="790.0" y="695.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:9.5px">shame; stop trying</text><text x="675.0" y="713.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">internal · stable · uncontrollable</text><rect x="494" y="732" width="362" height="48" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="560.0" y="751.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">EFFORT</text><text x="790.0" y="751.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:9.5px">guilt; try again</text><text x="675.0" y="769.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">internal · unstable · CONTROLLABLE</text><rect x="494" y="788" width="362" height="48" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.6"/><text x="560.0" y="807.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10.5px">TASK DIFFICULTY</text><text x="790.0" y="807.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:9.5px">resignation</text><text x="675.0" y="825.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">external · stable · uncontrollable</text><rect x="494" y="844" width="362" height="48" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.6"/><text x="560.0" y="863.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">LUCK</text><text x="790.0" y="863.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:9.5px">surprise; no lesson</text><text x="675.0" y="881.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">external · unstable · uncontrollable</text><text x="675.0" y="912.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">blame a failure on effort and motivation survives; blame it on ability and it does not</text></svg>