<svg xmlns="http://www.w3.org/2000/svg" width="920" height="912" viewBox="0 0 920 912" role="img" aria-labelledby="t d"><title id="t">The signals that say eat, and the ones that say stop</title><desc id="d">Top: the arcuate nucleus as the switchboard. Two opposing cell populations sit there — one releasing NPY and AgRP that drives eating, one releasing POMC products and CART that stops it — and every hormone in the picture works by pushing one of those two. Ghrelin from the stomach is the only peripheral hormone that says eat; everything else in the list says stop. Leptin from fat is the long-term signal, and the reason obesity is not a leptin deficiency: the level is high and the brain has stopped listening. Bottom left: the two models of body weight and what each one has to explain. Bottom right: hormones acting on sexual behaviour at two different times of life — permanently before birth, reversibly in adulthood.</desc><defs><marker id="m4636" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b7a64"/></marker><marker id="m9549" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="912" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">The signals that say eat, and the ones that say stop</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">One nucleus reads them all; everything else is a messenger</text><rect x="40" y="180" width="840" height="300" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">Everything routes through the arcuate nucleus</text><rect x="330" y="300" width="260" height="110" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2.4"/><text x="460.0" y="326.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">ARCUATE NUCLEUS</text><rect x="346" y="338" width="110" height="58" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="401.0" y="360.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">NPY / AgRP</text><text x="401.0" y="378.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">EAT</text><rect x="464" y="338" width="110" height="58" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="519.0" y="360.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">POMC / CART</text><text x="519.0" y="378.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">STOP</text><rect x="70" y="300" width="210" height="72" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="175.0" y="324.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">GHRELIN</text><text x="175.0" y="344.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">from the STOMACH</text><text x="175.0" y="362.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">peaks before meals</text><line x1="284" y1="336" x2="326" y2="342" stroke="#a8324a" stroke-width="2.4" marker-end="url(#m9549)"/><text x="175.0" y="394.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">the only peripheral</text><text x="175.0" y="410.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">hormone that says EAT</text><rect x="640" y="236" width="210" height="46" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="745.0" y="256.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">LEPTIN</text><text x="745.0" y="272.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">fat mass · long-term</text><rect x="640" y="288" width="210" height="46" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="745.0" y="308.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">INSULIN</text><text x="745.0" y="324.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">pancreas · after glucose</text><rect x="640" y="340" width="210" height="46" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="745.0" y="360.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">CCK</text><text x="745.0" y="376.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">small intestine · fat and protein</text><rect x="640" y="392" width="210" height="46" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="745.0" y="412.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">PYY · GLP-1</text><text x="745.0" y="428.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">ileum and colon · after a meal</text><line x1="636" y1="342" x2="596" y2="348" stroke="#5b7a64" stroke-width="2.4" marker-end="url(#m4636)"/><text x="745.0" y="456.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">all four say STOP</text><text x="230.0" y="452.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">obesity is not low leptin — leptin is HIGH and ignored</text><rect x="40" y="500" width="420" height="384" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="250.0" y="528.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">Two models of body weight</text><rect x="66" y="548" width="368" height="150" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="250.0" y="572.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">SET POINT</text><text x="250.0" y="594.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">the body defends a target</text><text x="250.0" y="618.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">twins raised apart share BMI</text><text x="250.0" y="637.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">metabolism falls more than mass does</text><text x="250.0" y="656.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">ghrelin stays high after dieting</text><text x="250.0" y="675.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">leptin falls, removing the brake</text><rect x="66" y="712" width="368" height="150" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="250.0" y="736.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">SETTLING POINT</text><text x="250.0" y="758.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">genes AND environment find a level</text><text x="250.0" y="782.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">populations gained weight in 50 years</text><text x="250.0" y="801.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">genes cannot move that fast</text><text x="250.0" y="820.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">cheap, dense, palatable food shifts it</text><text x="250.0" y="839.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">so the level itself can drift upward</text><rect x="480" y="500" width="400" height="384" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="680.0" y="528.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">Hormones act at two different times</text><rect x="506" y="548" width="348" height="150" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="680.0" y="574.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">ORGANISATIONAL</text><text x="680.0" y="596.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">before birth and just after</text><text x="680.0" y="620.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">androgens build the circuits themselves</text><text x="680.0" y="638.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">sexually dimorphic nucleus; later orientation</text><text x="680.0" y="666.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">PERMANENT — a window, then it closes</text><text x="680.0" y="686.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">congenital adrenal hyperplasia is the natural test</text><rect x="506" y="712" width="348" height="150" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="680.0" y="738.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">ACTIVATIONAL</text><text x="680.0" y="760.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">in adulthood, on circuits already built</text><text x="680.0" y="784.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">testosterone drives libido in BOTH sexes</text><text x="680.0" y="802.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">castration or oophorectomy lowers it</text><text x="680.0" y="830.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">REVERSIBLE — restore the hormone,</text><text x="680.0" y="848.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">restore the behaviour</text></svg>