<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc"><title id="title">Apoptosis pathways</title><desc id="desc">Bax and Bak permeabilize the mitochondrial outer membrane. Cytochrome c activates the Apaf-1 apoptosome and caspase-9. Fas activates caspase-8; Bid connects the pathways.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#245574"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#18364a;font-size:18px}.h{font-size:25px;font-weight:700}.small{font-size:15px}.label{font-size:20px;font-weight:700}</style><rect width="900" height="760" rx="20" fill="#fbf7ef"/><text x="32" y="43" class="h" text-anchor="start">Two entry routes, a shared execution phase</text><text x="220" y="88" class="label" text-anchor="middle">Intrinsic stress</text><text x="680" y="88" class="label" text-anchor="middle">Fas ligand</text><path d="M220 100 V140" stroke="#245574" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="125" y="145" width="190" height="50" rx="12" fill="#e4edf3" stroke="#245574"/><text x="220.0" y="176.0" class="" text-anchor="middle">BH3-only proteins</text><path d="M220 197 V235" stroke="#245574" stroke-width="3" fill="none" marker-end="url(#arrow)"/><ellipse cx="220" cy="297" rx="150" ry="60" fill="#e4edf3" stroke="#245574" stroke-width="4"/><ellipse cx="220" cy="297" rx="125" ry="40" fill="#fbf7ef" stroke="#245574" stroke-width="2"/><text x="220" y="288" class="" text-anchor="middle">Mitochondrion</text><text x="220" y="315" class="small" text-anchor="middle">Bax/Bak pores</text><text x="45" y="229" class="small" text-anchor="start">Bcl-2 inhibits</text><path d="M112 237 L145 255 M138 250 L149 260" stroke="#245574" stroke-width="3" fill="none"/><circle cx="176" cy="340" r="4" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="215" cy="340" r="4" fill="#245574" stroke="#245574" stroke-width="2"/><circle cx="254" cy="340" r="4" fill="#245574" stroke="#245574" stroke-width="2"/><path d="M220 360 V397" stroke="#245574" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="220" y="424" class="" text-anchor="middle">Cytochrome c + Apaf-1</text><circle cx="255.0" cy="490.0" r="12" fill="#dce9f0" stroke="#245574" stroke-width="2"/><circle cx="241.82214306505568" cy="517.364101886381" r="12" fill="#dce9f0" stroke="#245574" stroke-width="2"/><circle cx="212.211767311529" cy="524.1224769263638" r="12" fill="#dce9f0" stroke="#245574" stroke-width="2"/><circle cx="188.46608962341534" cy="505.18593086911454" r="12" fill="#dce9f0" stroke="#245574" stroke-width="2"/><circle cx="188.46608962341531" cy="474.81406913088546" r="12" fill="#dce9f0" stroke="#245574" stroke-width="2"/><circle cx="212.211767311529" cy="455.87752307363616" r="12" fill="#dce9f0" stroke="#245574" stroke-width="2"/><circle cx="241.82214306505568" cy="462.63589811361896" r="12" fill="#dce9f0" stroke="#245574" stroke-width="2"/><text x="220" y="552" class="small" text-anchor="middle">Apoptosome + ATP/dATP</text><path d="M220 565 V588" stroke="#245574" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="135" y="592" width="170" height="45" rx="12" fill="#e4edf3" stroke="#245574"/><text x="220.0" y="620.5" class="" text-anchor="middle">Caspase-9</text><path d="M545 150 H815" stroke="#245574" stroke-width="5" fill="none"/><path d="M660 122 V185 M700 122 V185" stroke="#245574" stroke-width="4" fill="none"/><path d="M680 100 V128" stroke="#245574" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="680" y="211" class="small" text-anchor="middle">Fas receptor cluster</text><rect x="565" y="240" width="230" height="50" rx="12" fill="#e4edf3" stroke="#245574"/><text x="680.0" y="271.0" class="" text-anchor="middle">FADD / DISC</text><path d="M680 215 V235" stroke="#245574" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M680 292 V330" stroke="#245574" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="595" y="335" width="170" height="45" rx="12" fill="#e4edf3" stroke="#245574"/><text x="680.0" y="363.5" class="" text-anchor="middle">Caspase-8</text><path d="M595 360 H430 V300 H382" stroke="#245574" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="450" y="339" class="small" text-anchor="start">Bid → tBid</text><text x="440" y="388" class="small" text-anchor="start">Mitochondrial</text><text x="440" y="408" class="small" text-anchor="start">amplification</text><path d="M680 382 V615 H530 V657" stroke="#245574" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M220 638 V675 H345" stroke="#245574" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="350" y="656" width="250" height="50" rx="12" fill="#e4edf3" stroke="#245574"/><text x="475.0" y="687.0" class="" text-anchor="middle">Executioners: 3 and 7</text><text x="450" y="738" class="small" text-anchor="middle">Cell dismantling and clearance; inflammatory outcome depends on context.</text></svg>