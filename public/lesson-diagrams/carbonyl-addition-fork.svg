<svg xmlns="http://www.w3.org/2000/svg" width="900" height="668" viewBox="0 0 900 668" role="img" aria-labelledby="t d"><title id="t">One attack, then a fork: keep the oxygen or lose it as water</title><desc id="d">A flow diagram. A nucleophile attacks the sp2 carbonyl carbon to give a tetrahedral alkoxide intermediate, which then forks. On the left branch the oxygen is simply protonated and the reaction stops, giving hydrates, hemiacetals, cyanohydrins and alcohols. On the right branch the oxygen is protonated and leaves as water, giving acetals and ketals, imines and enamines. A note records that these condensations need acid and that imine formation is fastest near pH 4 to 5.</desc><defs><marker id="m2309" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker><marker id="m5406" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b7a64"/></marker><marker id="m696" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="900" height="668" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">One attack, then a fork: keep the oxygen or lose it as water</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Every nucleophile does the same first thing. What differs is whether the intermediate stops at protonation or dehydrates.</text><rect x="250" y="96" width="400" height="76" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="450.0" y="124.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:18px">Nu attacks the carbonyl carbon</text><text x="450.0" y="150.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">sp² → sp³, trigonal planar → tetrahedral</text><line x1="450" y1="174" x2="450" y2="206" stroke="#18364a" stroke-width="2.5" marker-end="url(#m696)"/><rect x="290" y="208" width="320" height="62" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="450.0" y="234.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:17px">tetrahedral alkoxide intermediate</text><text x="450.0" y="256.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">R₂C(Nu)–O⁻</text><line x1="390" y1="272" x2="250" y2="312" stroke="#5b7a64" stroke-width="2.5" marker-end="url(#m5406)"/><text x="286.0" y="288.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">protonate O</text><line x1="510" y1="272" x2="650" y2="312" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m2309)"/><text x="620.0" y="288.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">protonate O, lose H₂O</text><rect x="60" y="318" width="370" height="236" rx="12" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="245.0" y="344.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:18px">Addition stops here</text><text x="80.0" y="386.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">H₂O</text><text x="410.0" y="386.0" class="" text-anchor="end" style="fill:#5b7a64;font-weight:bold;font-size:15px">hydrate (gem-diol)</text><line x1="78" y1="398" x2="412" y2="398" stroke="#6d716f" stroke-width="1"/><text x="80.0" y="430.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">one R&#x27;OH</text><text x="410.0" y="430.0" class="" text-anchor="end" style="fill:#5b7a64;font-weight:bold;font-size:15px">hemiacetal</text><line x1="78" y1="442" x2="412" y2="442" stroke="#6d716f" stroke-width="1"/><text x="80.0" y="474.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">CN⁻ (from HCN)</text><text x="410.0" y="474.0" class="" text-anchor="end" style="fill:#5b7a64;font-weight:bold;font-size:15px">cyanohydrin</text><line x1="78" y1="486" x2="412" y2="486" stroke="#6d716f" stroke-width="1"/><text x="80.0" y="518.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">H:⁻ (NaBH₄, LiAlH₄)</text><text x="410.0" y="518.0" class="" text-anchor="end" style="fill:#5b7a64;font-weight:bold;font-size:15px">alcohol</text><rect x="470" y="318" width="370" height="236" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="655.0" y="344.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:18px">Condensation: water leaves</text><text x="490.0" y="386.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">second R&#x27;OH</text><text x="820.0" y="386.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:bold;font-size:15px">acetal / ketal</text><line x1="488" y1="398" x2="822" y2="398" stroke="#6d716f" stroke-width="1"/><text x="490.0" y="430.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">R&#x27;NH₂ (1° amine)</text><text x="820.0" y="430.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:bold;font-size:15px">imine (Schiff base)</text><line x1="488" y1="442" x2="822" y2="442" stroke="#6d716f" stroke-width="1"/><text x="490.0" y="474.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">R&#x27;₂NH (2° amine)</text><text x="820.0" y="474.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:bold;font-size:15px">enamine</text><rect x="60" y="566" width="780" height="82" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="450.0" y="594.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">The right-hand branch needs acid — and not too much of it</text><text x="450.0" y="616.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Acid protonates the leaving OH, but it also protonates the amine: imine and enamine formation peak near pH 4–5.</text><text x="450.0" y="634.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">The Wittig is the outlier — the oxygen leaves with phosphorus as Ph₃P=O, giving C=C.</text></svg>