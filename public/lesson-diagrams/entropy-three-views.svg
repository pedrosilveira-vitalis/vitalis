<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="806" viewBox="0 0 1180 806" role="img" aria-labelledby="t d"><title id="t">Entropy from three angles</title><desc id="d">Three panels. The first is the statistical picture: four distinguishable particles shared between the two halves of a box. There is exactly one arrangement with all four on the left, four with three left and one right, six with two and two, four with one and three, and one with none and four, a histogram peaking sharply at the even split. Boltzmann&#x27;s relation, entropy equals Boltzmann&#x27;s constant times the natural logarithm of the number of microstates, converts those counts into entropy, and a note observes that with four particles the even split is six times more likely than the all-left one, while with Avogadro&#x27;s number of particles the ratio becomes so large that the spread-out state is the only one ever observed. Nothing pushes the particles apart; there are simply more ways to be spread out. The second panel is the thermodynamic picture: the change in entropy equals the reversible heat divided by the absolute temperature, so the same joule of heat buys more entropy at low temperature than at high, because a cold system has few accessible microstates and the added energy opens proportionally many more. A worked line shows one kilojoule delivered at 100 kelvin giving ten joules per kelvin, and the same kilojoule at 1000 kelvin giving only one. The third panel lists the heuristics for predicting the sign of an entropy change: change in the number of moles of gas first and above all; then phase, since gas greatly exceeds liquid which exceeds solid; then molecular complexity, with larger and less branched molecules higher; then dissolving, usually positive but negative for small highly charged ions whose hydration shells order the solvent; and temperature, always positive on heating. A footer gives the four sign combinations of enthalpy and entropy change: negative enthalpy with positive entropy is spontaneous at every temperature; positive enthalpy with negative entropy at none; negative with negative is spontaneous only below the crossover temperature; positive with positive only above it; and the crossover temperature in both mixed cases is the enthalpy change divided by the entropy change.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1180" height="806" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Entropy from three angles</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">The same quantity, approached statistically, thermodynamically, and by rule of thumb. The first explains why the other two work.</text><rect x="24" y="112" width="368" height="330" rx="12" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="208.0" y="140.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:13px">1 · STATISTICAL</text><text x="208.0" y="160.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">four particles, two halves of a box</text><rect x="64" y="282" width="42" height="18" rx="4" fill="#c6d6c7" stroke="#5b7a64" stroke-width="1.2"/><text x="85.0" y="274.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:12px">1</text><text x="85.0" y="318.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">4 | 0</text><rect x="120" y="228" width="42" height="72" rx="4" fill="#c6d6c7" stroke="#5b7a64" stroke-width="1.2"/><text x="141.0" y="220.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:12px">4</text><text x="141.0" y="318.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">3 | 1</text><rect x="176" y="192" width="42" height="108" rx="4" fill="#c6d6c7" stroke="#5b7a64" stroke-width="1.2"/><text x="197.0" y="184.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:12px">6</text><text x="197.0" y="318.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">2 | 2</text><rect x="232" y="228" width="42" height="72" rx="4" fill="#c6d6c7" stroke="#5b7a64" stroke-width="1.2"/><text x="253.0" y="220.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:12px">4</text><text x="253.0" y="318.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">1 | 3</text><rect x="288" y="282" width="42" height="18" rx="4" fill="#c6d6c7" stroke="#5b7a64" stroke-width="1.2"/><text x="309.0" y="274.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:12px">1</text><text x="309.0" y="318.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">0 | 4</text><line x1="56" y1="300" x2="338" y2="300" stroke="#18364a" stroke-width="2"/><text x="208.0" y="338.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">number of arrangements (microstates)</text><text x="208.0" y="368.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:16px">S = k_B · ln W</text><text x="208.0" y="394.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">Nothing pushes them apart. There are simply</text><text x="208.0" y="408.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">more ways to be spread out — and with 10²³</text><text x="208.0" y="422.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">particles, “more ways” becomes “always”.</text><rect x="406" y="112" width="368" height="330" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="590.0" y="140.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:13px">2 · THERMODYNAMIC</text><text x="590.0" y="160.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">what you can actually measure</text><text x="590.0" y="206.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:18px">ΔS = q_rev / T</text><text x="590.0" y="240.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">Temperature sits in the denominator, so the</text><text x="590.0" y="255.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">same joule of heat buys more entropy in a</text><text x="590.0" y="270.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">cold system than a hot one.</text><rect x="432" y="286" width="316" height="96" rx="8" fill="#ffffff" stroke="#245574" stroke-width="1.5"/><text x="590.0" y="310.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">1 kJ delivered at 100 K   →   +10 J/K</text><text x="590.0" y="334.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">1 kJ delivered at 1000 K  →   +1 J/K</text><text x="590.0" y="362.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">A cold system has few microstates, so the same</text><text x="590.0" y="375.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">energy opens far more.</text><text x="590.0" y="410.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">ΔS is a state function, so this is the value</text><text x="590.0" y="424.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">for *any* path — but only the reversible q may</text><text x="590.0" y="438.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">be used to compute it.</text><rect x="788" y="112" width="368" height="330" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="972.0" y="140.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:13px">3 · BY RULE OF THUMB</text><text x="972.0" y="160.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">what the exam asks for</text><text x="812.0" y="192.0" class="" text-anchor="start" style="fill:#987740;font-weight:700;font-size:12px">Δn_gas</text><text x="990.0" y="192.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">first and above all. More gas → ΔS &gt;</text><text x="990.0" y="206.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">0</text><text x="812.0" y="242.0" class="" text-anchor="start" style="fill:#987740;font-weight:700;font-size:12px">phase</text><text x="990.0" y="242.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">gas ≫ liquid &gt; solid</text><text x="812.0" y="276.0" class="" text-anchor="start" style="fill:#987740;font-weight:700;font-size:12px">complexity</text><text x="990.0" y="276.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">bigger and less branched → higher</text><text x="812.0" y="310.0" class="" text-anchor="start" style="fill:#987740;font-weight:700;font-size:12px">dissolving</text><text x="990.0" y="310.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">usually +, but − for small, highly</text><text x="990.0" y="324.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">charged ions</text><text x="812.0" y="360.0" class="" text-anchor="start" style="fill:#987740;font-weight:700;font-size:12px">heating</text><text x="990.0" y="360.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">always +</text><text x="972.0" y="412.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">Hydration is the trap: the lattice breaks up,</text><text x="972.0" y="426.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">yet the solvent becomes more ordered.</text><rect x="24" y="468" width="272" height="92" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="160.0" y="496.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:13px">ΔH &lt; 0  ·  ΔS &gt; 0</text><text x="160.0" y="522.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">spontaneous at every temperature</text><rect x="308" y="468" width="272" height="92" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="444.0" y="496.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:13px">ΔH &gt; 0  ·  ΔS &lt; 0</text><text x="444.0" y="522.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">spontaneous at no temperature</text><rect x="592" y="468" width="272" height="92" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="728.0" y="496.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:13px">ΔH &lt; 0  ·  ΔS &lt; 0</text><text x="728.0" y="522.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">spontaneous only BELOW T = ΔH/ΔS</text><rect x="876" y="468" width="272" height="92" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="1012.0" y="496.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:13px">ΔH &gt; 0  ·  ΔS &gt; 0</text><text x="1012.0" y="522.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">spontaneous only ABOVE T = ΔH/ΔS</text><rect x="24" y="576" width="1132" height="92" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="590.0" y="606.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13.5px">ΔG = ΔH − TΔS — and what the T is doing there</text><text x="590.0" y="627.5" class="" text-anchor="middle" style="font-size:12px">Temperature is the weighting factor on the entropy term, and nothing else. Below the crossover T = ΔH/ΔS the enthalpy term decides;</text><text x="590.0" y="644.5" class="" text-anchor="middle" style="font-size:12px">above it the entropy term does. Both mixed cases cross at that same temperature — the difference is only which side of it is</text><text x="590.0" y="661.5" class="" text-anchor="middle" style="font-size:12px">spontaneous.</text><rect x="24" y="682" width="1132" height="92" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="590.0" y="712.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13.5px">Two things “entropy = disorder” gets wrong</text><text x="590.0" y="733.5" class="" text-anchor="middle" style="font-size:12px">Dissolving MgSO₄ destroys a crystal and yet ΔS &lt; 0, because each small doubly charged ion freezes a shell of water around it. And</text><text x="590.0" y="750.5" class="" text-anchor="middle" style="font-size:12px">burning methane to CO₂ and liquid water has ΔS° ≈ −242 J/mol·K — combustion is spontaneous because ΔH is enormous, not because</text><text x="590.0" y="767.5" class="" text-anchor="middle" style="font-size:12px">entropy helps.</text></svg>