2 L536.2 413.9 L537.6 413.6 L539.0 413.3 L540.4 412.9 L541.8 412.6 L543.2 412.2 L544.6 411.8 L546.0 411.5 L547.4 411.1 L548.8 410.7 L550.2 410.3 L551.6 409.8 L553.0 409.4 L554.4 409.0 L555.8 408.5 L557.2 408.0 L558.6 407.6 L560.0 407.1 L561.4 406.6 L562.8 406.1 L564.2 405.5 L565.6 405.0 L567.0 404.4 L568.4 403.9 L569.8 403.3 L571.2 402.7 L572.6 402.1 L574.0 401.5 L575.4 400.9 L576.8 400.2 L578.2 399.6 L579.6 398.9 L581.0 398.2 L582.4 397.5 L583.8 396.8 L585.2 396.1 L586.6 395.3 L588.0 394.5 L589.4 393.8 L590.8 392.9 L592.2 392.1 L593.6 391.3 L595.0 390.4 L596.4 389.5 L597.8 388.6 L599.2 387.7 L600.6 386.7 L602.0 385.7 L603.4 384.7 L604.8 383.7 L606.2 382.6 L607.6 381.5 L609.0 380.4 L610.4 379.2 L611.8 378.0 L613.2 376.7 L614.6 375.4 L616.0 374.1 L617.4 372.7 L618.8 371.3 L620.2 369.8 L621.6 368.2 L623.0 366.5 L624.4 364.7 L625.8 362.8 L627.2 360.7 L628.6 358.4" stroke="#245574" stroke-width="3" fill="none"/><circle cx="476.0" cy="420.4" r="6" fill="#a8324a" stroke="#a8324a" stroke-width="1"/><text x="476.0" y="452.4" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">EQUILIBRIUM</text><text x="476.0" y="470.4" class="" text-anchor="middle" style="fill:#a8324a;font-size:11px">ΔG = 0 · slope is flat · position = K</text><circle cx="71.4" cy="163.0" r="4" fill="#ffffff" stroke="#18364a" stroke-width="2"/><circle cx="628.6" cy="358.39837417723504" r="4" fill="#ffffff" stroke="#18364a" stroke-width="2"/><text x="77.4" y="149.0" class="" text-anchor="start" style="fill:#18364a;font-size:11px">pure reactants</text><text x="622.6" y="344.4" class="" text-anchor="end" style="fill:#18364a;font-size:11px">pure products</text><line x1="71.4" y1="163.0" x2="596" y2="163.0" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><line x1="628.6" y1="358.39837417723504" x2="596" y2="358.39837417723504" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><line x1="600" y1="163.0" x2="600" y2="358.39837417723504" stroke="#987740" stroke-width="2.5"/><text x="656.6" y="260.7" class="" text-anchor="start" style="fill:#987740;font-weight:700;font-size:14px">ΔG°</text><text x="350.0" y="534.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">ΔG is the SLOPE where you stand · ΔG° is the HEIGHT DIFFERENCE between the</text><text x="350.0" y="549.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">ends · K is WHERE the minimum sits</text><rect x="660" y="130" width="494" height="134" rx="11" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="907.0" y="156.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:13px">ΔG — right now</text><text x="907.0" y="180.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">ΔG = ΔG° + RT ln Q</text><text x="907.0" y="203.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">Q &lt; K → runs forward (ΔG &lt; 0)</text><text x="907.0" y="220.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">Q &gt; K → runs backward (ΔG &gt; 0)</text><text x="907.0" y="237.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">Q = K → equilibrium (ΔG = 0)</text><rect x="660" y="278" width="494" height="134" rx="11" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="907.0" y="304.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:13px">ΔG° — the fixed constant</text><text x="907.0" y="328.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">ΔG° = −RT ln K = −nFE°</text><text x="907.0" y="351.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">ΔG° &lt; 0 ⟺ K &gt; 1 ⟺ E° &gt; 0</text><text x="907.0" y="368.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">At 298 K: RT = 2.48 kJ/mol, and each</text><text x="907.0" y="385.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">factor of 10 in K ≈ 5.7 kJ/mol.</text><rect x="660" y="426" width="494" height="134" rx="11" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="907.0" y="452.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:13px">ΔG° ≠ 0 at equilibrium</text><text x="907.0" y="476.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">Only when K = 1. A reaction with</text><text x="907.0" y="493.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">ΔG° = +13.8 kJ/mol still reaches an</text><text x="907.0" y="510.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">equilibrium — just one lying well</text><text x="907.0" y="527.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">toward reactants.</text><rect x="24" y="578" width="272" height="106" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="160.0" y="606.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:13px">− ΔH · + ΔS</text><text x="160.0" y="632.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">spontaneous at every</text><text x="160.0" y="646.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">temperature</text><text x="160.0" y="668.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">glucose combustion</text><rect x="308" y="578" width="272" height="106" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="444.0" y="606.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:13px">+ ΔH · − ΔS</text><text x="444.0" y="632.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">spontaneous at no temperature</text><text x="444.0" y="668.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">3O₂ → 2O₃</text><rect x="592" y="578" width="272" height="106" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="728.0" y="606.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:13px">− ΔH · − ΔS</text><text x="728.0" y="632.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">spontaneous only below T =</text><text x="728.0" y="646.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">ΔH/ΔS</text><text x="728.0" y="668.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">water freezing</text><rect x="876" y="578" width="272" height="106" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="1012.0" y="606.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:13px">+ ΔH · + ΔS</text><text x="1012.0" y="632.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">spontaneous only above T =</text><text x="1012.0" y="646.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">ΔH/ΔS</text><text x="1012.0" y="668.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">ice melting</text><rect x="24" y="700" width="1132" height="92" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="590.0" y="730.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13.5px">Five traps</text><text x="590.0" y="751.5" class="" text-anchor="middle" style="font-size:12px">Spontaneous ≠ fast — diamond is thermodynamically unstable at room temperature and lasts forever. · T in kelvin, always. · ΔH in kJ</text><text x="590.0" y="768.5" class="" text-anchor="middle" style="font-size:12px">and ΔS in J must be reconciled before subtracting. · Enzymes change the rate, never ΔG or K. · Coupled reactions add their ΔG only</text><text x="590.0" y="785.5" class="" text-anchor="middle" style="font-size:12px">when genuinely linked — a shared intermediate, or one enzyme.</text></svg>