<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="806" viewBox="0 0 1180 806" role="img" aria-labelledby="t d"><title id="t">ΔG, ΔG° and K — three things people merge into one</title><desc id="d">A free-energy curve is plotted against the extent of reaction, from pure reactants on the left to pure products on the right, dipping to a minimum in between. The actual free energy change at any point is the slope of that curve: steeply downhill near pure reactants, zero at the minimum, and uphill beyond it, which is why the reaction runs toward the minimum from either side and stops there. Equilibrium is the bottom of the valley, not the right-hand end, and the position of that minimum is the equilibrium constant. The standard free energy change is something else entirely: the difference in height between the left end and the right end, which is generally not zero even though the slope at the minimum is. Panels alongside draw the distinction out. The actual free energy change equals the standard change plus the gas constant times temperature times the logarithm of the reaction quotient, so when the quotient is below the equilibrium constant the reaction runs forward, when above it runs backward, and when equal the reaction is at equilibrium and the actual change is zero. The standard change equals minus the gas constant times temperature times the logarithm of the equilibrium constant, and also equals minus the number of electrons times the Faraday constant times the standard cell potential, so a standard change below zero means an equilibrium constant above one and a positive cell potential. At 298 kelvin, the gas constant times temperature is 2.48 kilojoules per mole and each factor of ten in the equilibrium constant is worth about 5.7 kilojoules per mole. A four-quadrant panel gives the sign combinations: negative enthalpy with positive entropy change is spontaneous at every temperature, illustrated by glucose combustion; positive with negative is spontaneous at none, illustrated by ozone formation from oxygen; negative with negative is spontaneous only below the crossover temperature, illustrated by freezing; positive with positive only above it, illustrated by melting; and the crossover temperature is the enthalpy change divided by the entropy change. A footer collects the traps: spontaneous is not the same as fast, since diamond is thermodynamically unstable at room temperature and yet persists; temperature must be in kelvin; enthalpy in kilojoules and entropy in joules must be reconciled before subtracting; enzymes change the rate and never the free energy change or the equilibrium constant; and coupled reactions add their free energy changes only when genuinely linked through a shared intermediate or a single enzyme.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1180" height="806" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">ΔG, ΔG° and K — three things people merge into one</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">ΔG is where you are standing. ΔG° is the height difference between the two ends. K is where the bottom of the valley sits.</text><line x1="70" y1="460" x2="630" y2="460" stroke="#18364a" stroke-width="2"/><line x1="70" y1="130" x2="70" y2="460" stroke="#18364a" stroke-width="2"/><text x="350.0" y="504.0" class="" text-anchor="middle" style="font-size:17px">extent of reaction  →</text><text x="26" y="295.0" text-anchor="middle" transform="rotate(-90 26 295.0)" style="font-size:17px">G of the mixture</text><path d="M71.4 163.0 L72.8 166.3 L74.2 169.4 L75.6 172.3 L77.0 175.0 L78.4 177.7 L79.8 180.2 L81.2 182.7 L82.6 185.2 L84.0 187.5 L85.4 189.9 L86.8 192.1 L88.2 194.4 L89.6 196.6 L91.0 198.7 L92.4 200.8 L93.8 202.9 L95.2 205.0 L96.6 207.0 L98.0 209.0 L99.4 210.9 L100.8 212.9 L102.2 214.8 L103.6 216.7 L1