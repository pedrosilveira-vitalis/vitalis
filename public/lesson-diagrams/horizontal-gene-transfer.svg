<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="t d"><title id="t">Three routes of horizontal gene transfer</title><desc id="d">Three panels. Transformation: a lysed donor cell releases naked DNA fragments; a competent recipient takes them up and recombines them into its chromosome; no contact and no virus; blocked by DNase. Transduction: a phage infecting a donor packages donor DNA by mistake (generalized: any gene, from mispackaging during the lytic cycle; specialized: only genes next to a prophage insertion site, from faulty excision) and injects it into a recipient; DNase-resistant because the DNA is inside the capsid. Conjugation: an F-plus donor uses a sex pilus to contact an F-minus recipient; one strand of the F plasmid (or of the chromosome in an Hfr strain) is transferred starting at oriT; requires contact; F-plus times F-minus gives two F-plus cells, while Hfr times F-minus usually leaves the recipient F-minus with some donor genes. A bottom row gives the test: needs contact, conjugation; needs phage, transduction; works with purified DNA and is DNase-sensitive, transformation.</desc><defs><marker id="m2596" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker><marker id="m2751" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#987740"/></marker><marker id="m4207" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b7a64"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="640" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Three routes of horizontal gene transfer</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">How a bacterium gains DNA from another cell, and how to tell the routes apart.</text><rect x="30" y="96" width="300" height="440" rx="14" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="180.0" y="126.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:20px">Transformation</text><rect x="350" y="96" width="300" height="440" rx="14" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="500.0" y="126.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:20px">Transduction</text><rect x="670" y="96" width="300" height="440" rx="14" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="820.0" y="126.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:20px">Conjugation</text><rect x="50" y="150" width="110" height="60" rx="30" fill="#ffffff" stroke="#6d716f" stroke-width="2"/><text x="105.0" y="230.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:700;font-size:12px">lysed donor</text><path d="M 180 175 q 12 -10 24 0 q 12 10 24 0" stroke="#18364a" stroke-width="2.5" fill="none"/><path d="M 190 195 q 12 -10 24 0 q 12 10 24 0" stroke="#18364a" stroke-width="2.5" fill="none"/><path d="M 205 160 q 12 -10 24 0 q 12 10 24 0" stroke="#18364a" stroke-width="2.5" fill="none"/><line x1="220" y1="210" x2="220" y2="262" stroke="#5b7a64" stroke-width="2.5" marker-end="url(#m4207)"/><rect x="140" y="270" width="160" height="70" rx="35.0" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="220.0" y="358.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:13px">competent recipient</text><circle cx="220" cy="305" r="16" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><path d="M 180 300 q 10 -8 20 0" stroke="#a8324a" stroke-width="3" fill="none"/><text x="180.0" y="390.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">Naked DNA taken up and recombined</text><text x="180.0" y="407.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">into the chromosome.</text><text x="180.0" y="440.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">No contact, no virus. DNase in the</text><text x="180.0" y="457.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">medium blocks it.</text><rect x="370" y="160" width="110" height="60" rx="30.0" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="425.0" y="238.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:13px">infected donor</text><circle cx="425" cy="190" r="16" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><path d="M 540 150 l 14 8 l 0 16 l -14 8 l -14 -8 l 0 -16 Z" stroke="#987740" stroke-width="2" fill="#ffffff"/><line x1="540" y1="174" x2="540" y2="196" stroke="#987740" stroke-width="2.5"/><line x1="540" y1="196" x2="530" y2="206" stroke="#987740" stroke-width="2"/><line x1="540" y1="196" x2="550" y2="206" stroke="#987740" stroke-width="2"/><path d="M 534 165 q 6 -6 12 0" stroke="#a8324a" stroke-width="2.5" fill="none"/><line x1="540" y1="214" x2="540" y2="254" stroke="#987740" stroke-width="2.5" marker-end="url(#m2751)"/><rect x="460" y="270" width="160" height="70" rx="35.0" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="540.0" y="358.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:13px">recipient</text><circle cx="540" cy="305" r="16" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><path d="M 500 300 q 10 -8 20 0" stroke="#a8324a" stroke-width="3" fill="none"/><text x="500.0" y="390.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">Phage packages donor DNA by</text><text x="500.0" y="407.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">mistake and injects it.</text><text x="500.0" y="430.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">Generalized: any gene.</text><text x="500.0" y="447.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">Specialized: genes beside the</text><text x="500.0" y="464.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">prophage site.</text><rect x="690" y="170" width="110" height="70" rx="35.0" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="745.0" y="258.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:13px">F⁺ donor</text><circle cx="730" cy="205" r="16" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><circle cx="775" cy="205" r="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2.5"/><rect x="840" y="170" width="110" height="70" rx="35.0" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="895.0" y="258.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:13px">F⁻ recipient</text><circle cx="880" cy="205" r="16" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><rect x="800" y="196" width="40" height="18" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="820.0" y="160.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">pilus / bridge</text><line x1="782" y1="205" x2="856" y2="205" stroke="#a8324a" stroke-width="2" marker-end="url(#m2596)"/><text x="820.0" y="290.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">One strand of the F plasmid passes</text><text x="820.0" y="307.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">from oriT; both cells end up F⁺.</text><text x="820.0" y="350.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">Hfr (F integrated): chromosome</text><text x="820.0" y="367.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">genes transfer in order; mating</text><text x="820.0" y="384.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">breaks off, recipient stays F⁻.</text><text x="820.0" y="430.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">Requires cell-to-cell contact.</text><rect x="30" y="552" width="940" height="64" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="500.0" y="582.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:15px">Quick test</text><text x="500.0" y="605.0" class="" text-anchor="middle" style="font-size:14px">Separate cells by a filter → stops conjugation only. Add DNase → stops transformation only. Needs a phage → transduction.</text></svg>