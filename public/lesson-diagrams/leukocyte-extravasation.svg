<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="t d"><title id="t">Leukocyte extravasation: how neutrophils leave the blood</title><desc id="d">A blood vessel drawn as a horizontal channel with blood flowing left to right above an endothelial lining, with tissue below. Step 1, margination: neutrophils move to the vessel wall as flow slows. Step 2, rolling: endothelial E- and P-selectins bind sialyl-Lewis X on the neutrophil; the bonds are weak so the cell rolls. Step 3, activation: chemokines such as IL-8 (CXCL8) on the endothelium bind G-protein-coupled receptors and switch the neutrophil&#x27;s integrins to high affinity. Step 4, firm adhesion: beta-2 integrins LFA-1 and Mac-1 (CD11/CD18) bind ICAM-1 and the cell stops. Step 5, transmigration or diapedesis between or through endothelial cells and across the basement membrane. Step 6, chemotaxis in the tissue along gradients of IL-8, C5a and fMLP toward the microbes. Footnote: in leukocyte adhesion deficiency type 1, CD18 is missing, so step 4 fails: neutrophils stay in blood, high neutrophil count, no pus, recurrent infections.</desc><defs><marker id="m2986" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker><marker id="m3606" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker><marker id="m5536" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="640" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Leukocyte extravasation: how neutrophils leave the blood</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Post-capillary venule, blood flowing left to right. Each step depends on the one before it.</text><rect x="40" y="100" width="920" height="240" rx="14" fill="#f3e9e6" stroke="#18364a" stroke-width="2"/><text x="70.0" y="128.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:700;font-size:14px">BLOOD</text><line x1="150" y1="123" x2="260" y2="123" stroke="#6d716f" stroke-width="2" marker-end="url(#m3606)"/><text x="270.0" y="128.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">flow</text><rect x="42" y="324" width="88" height="16" rx="6" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><rect x="134" y="324" width="88" height="16" rx="6" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><rect x="226" y="324" width="88" height="16" rx="6" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><rect x="318" y="324" width="88" height="16" rx="6" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><rect x="410" y="324" width="88" height="16" rx="6" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><rect x="502" y="324" width="88" height="16" rx="6" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><rect x="594" y="324" width="88" height="16" rx="6" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><rect x="686" y="324" width="88" height="16" rx="6" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><rect x="778" y="324" width="88" height="16" rx="6" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><rect x="870" y="324" width="88" height="16" rx="6" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="950.0" y="380.0" class="" text-anchor="end" style="fill:#6d716f;font-weight:700;font-size:14px">TISSUE</text><line x1="40" y1="344" x2="960" y2="344" stroke="#987740" stroke-width="2" stroke-dasharray="6 5"/><text x="950.0" y="362.0" class="" text-anchor="end" style="fill:#987740;font-size:12px">basement membrane</text><circle cx="110" cy="245" r="24" fill="#e4edf3" stroke="#245574" stroke-width="2"/><circle cx="103" cy="242" r="5" fill="#245574" stroke="#245574" stroke-width="1"/><circle cx="113" cy="250" r="5" fill="#245574" stroke="#245574" stroke-width="1"/><circle cx="118" cy="239" r="4" fill="#245574" stroke="#245574" stroke-width="1"/><circle cx="270" cy="298" r="24" fill="#e4edf3" stroke="#245574" stroke-width="2"/><circle cx="263" cy="295" r="5" fill="#245574" stroke="#245574" stroke-width="1"/><circle cx="273" cy="303" r="5" fill="#245574" stroke="#245574" stroke-width="1"/><circle cx="278" cy="292" r="4" fill="#245574" stroke="#245574" stroke-width="1"/><circle cx="430" cy="298" r="24" fill="#e4edf3" stroke="#245574" stroke-width="2"/><circle cx="423" cy="295" r="5" fill="#245574" stroke="#245574" stroke-width="1"/><circle cx="433" cy="303" r="5" fill="#245574" stroke="#245574" stroke-width="1"/><circle cx="438" cy="292" r="4" fill="#245574" stroke="#245574" stroke-width="1"/><circle cx="590" cy="300" r="24" fill="#e4edf3" stroke="#245574" stroke-width="2"/><circle cx="583" cy="297" r="5" fill="#245574" stroke="#245574" stroke-width="1"/><circle cx="593" cy="305" r="5" fill="#245574" stroke="#245574" stroke-width="1"/><circle cx="598" cy="294" r="4" fill="#245574" stroke="#245574" stroke-width="1"/><line x1="258" y1="320" x2="262" y2="324" stroke="#a8324a" stroke-width="2.5"/><line x1="276" y1="320" x2="280" y2="324" stroke="#a8324a" stroke-width="2.5"/><path d="M 236 278 a 34 34 0 0 1 50 -18" stroke="#a8324a" stroke-width="2" fill="none"/><line x1="284" y1="259" x2="292" y2="264" stroke="#a8324a" stroke-width="2" marker-end="url(#m2986)"/><circle cx="400" cy="320" r="3" fill="#987740" stroke="#987740" stroke-width="1"/><circle cx="415" cy="320" r="3" fill="#987740" stroke="#987740" stroke-width="1"/><circle cx="430" cy="320" r="3" fill="#987740" stroke="#987740" stroke-width="1"/><circle cx="445" cy="320" r="3" fill="#987740" stroke="#987740" stroke-width="1"/><circle cx="460" cy="320" r="3" fill="#987740" stroke="#987740" stroke-width="1"/><line x1="574" y1="322" x2="574" y2="325" stroke="#18364a" stroke-width="4"/><line x1="584" y1="322" x2="584" y2="325" stroke="#18364a" stroke-width="4"/><line x1="594" y1="322" x2="594" y2="325" stroke="#18364a" stroke-width="4"/><line x1="604" y1="322" x2="604" y2="325" stroke="#18364a" stroke-width="4"/><path d="M 762 290 q 14 25 0 50 q -14 25 0 60" stroke="#245574" stroke-width="2.5" fill="none"/><circle cx="776" cy="292" r="18" fill="#e4edf3" stroke="#245574" stroke-width="2"/><circle cx="776" cy="370" r="16" fill="#e4edf3" stroke="#245574" stroke-width="2"/><line x1="796" y1="400" x2="896" y2="460" stroke="#245574" stroke-width="2.5" marker-end="url(#m5536)"/><rect x="891" y="460" width="18" height="10" rx="5" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><rect x="916" y="475" width="18" height="10" rx="5" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><rect x="896" y="485" width="18" height="10" rx="5" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="912.0" y="515.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:13px">microbes</text><text x="110.0" y="162.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:14px">1  Margination</text><text x="270.0" y="162.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:14px">2  Rolling</text><text x="430.0" y="162.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:14px">3  Activation</text><text x="590.0" y="162.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:14px">4  Firm adhesion</text><text x="782.0" y="162.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:14px">5  Diapedesis</text><text x="110.0" y="184.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">flow slows; cells</text><text x="110.0" y="201.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">drift to the wall</text><text x="270.0" y="184.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">E-/P-selectin ↔</text><text x="270.0" y="201.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">sialyl-Lewis X</text><text x="270.0" y="218.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">(weak)</text><text x="430.0" y="184.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">IL-8 → GPCR →</text><text x="430.0" y="201.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">integrins switch on</text><text x="590.0" y="184.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">LFA-1/Mac-1 (CD18)</text><text x="590.0" y="201.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">↔ ICAM-1</text><text x="782.0" y="184.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">between/through</text><text x="782.0" y="201.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">endothelium</text><rect x="560" y="440" width="230" height="70" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="675.0" y="470.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:14px">6 Chemotaxis</text><text x="675.0" y="492.0" class="" text-anchor="middle" style="font-size:13px">IL-8, C5a, fMLP gradients</text><rect x="40" y="440" width="470" height="150" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="275.0" y="470.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:16px">Leukocyte adhesion deficiency (LAD-1)</text><text x="275.0" y="494.0" class="" text-anchor="middle" style="font-size:14px">CD18 (β2 integrin) is missing, so step 4 fails. Neutrophils roll</text><text x="275.0" y="513.0" class="" text-anchor="middle" style="font-size:14px">but cannot stop or leave the blood: very high blood neutrophil</text><text x="275.0" y="532.0" class="" text-anchor="middle" style="font-size:14px">count, no pus at infection sites, poor wound healing, recurrent</text><text x="275.0" y="551.0" class="" text-anchor="middle" style="font-size:14px">bacterial infections.</text></svg>