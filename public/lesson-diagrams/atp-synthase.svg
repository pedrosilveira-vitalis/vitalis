<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">ATP synthase couples proton flow to nucleotide binding changes</title><desc id="desc">F-o is the membrane motor and F1 the catalytic head. The c-ring and central shaft rotate, while the alpha beta head is held by the stator. A beta site cycles loose, tight and open. Eight protons per full mammalian rotor turn yield three ATP; transport and leak affect the final P/O ratio.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#245574;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">ATP synthase: a motor, not an electron carrier</text><rect x="24" y="60" width="752" height="245" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="94" class="h" text-anchor="start">1  Keep rotating and stationary parts distinct</text><rect x="55" y="133" width="690" height="49" rx="12" fill="#f4dce0"/><text x="65" y="123" class="s" text-anchor="start">Intermembrane space: H⁺ reservoir</text><text x="65" y="204" class="s" text-anchor="start">Matrix</text><rect x="350" y="128" width="100" height="59" rx="15" fill="#e4eef1" stroke="#203f52" stroke-width="3"/><text x="400" y="165" class="t" text-anchor="middle">c-ring</text><path d="M400 188 L400 238" class="bond" /><ellipse cx="400" cy="250" rx="100" ry="31" fill="#e4eef1" stroke="#203f52" stroke-width="3"/><text x="400" y="256" class="t" text-anchor="middle">F₁: α₃β₃</text><text x="555" y="156" class="s" text-anchor="start">Fₒ membrane motor</text><text x="555" y="227" class="s" text-anchor="start">Ring + shaft rotate</text><text x="555" y="253" class="s" text-anchor="start">Head is held still</text><text x="70" y="255" class="s" text-anchor="start">H⁺ flow drives rotation</text><rect x="24" y="321" width="752" height="173" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="355" class="h" text-anchor="start">2  Follow one β site through the cycle</text><rect x="65" y="380" width="195" height="80" rx="12" fill="#e4eef1"/><text x="163" y="409" class="t" text-anchor="middle">Loose</text><text x="163" y="440" class="s" text-anchor="middle">ADP + Pᵢ held</text><rect x="300" y="380" width="195" height="80" rx="12" fill="#e4eef1"/><text x="398" y="409" class="t" text-anchor="middle">Tight</text><text x="398" y="440" class="s" text-anchor="middle">Bound ATP</text><rect x="535" y="380" width="195" height="80" rx="12" fill="#e4eef1"/><text x="633" y="409" class="t" text-anchor="middle">Open</text><text x="633" y="440" class="s" text-anchor="middle">ATP released</text><path d="M266 420 L294 420" class="bond" /><path d="M286 415 L294 420 L286 425" class="bond"/><path d="M501 420 L529 420" class="bond" /><path d="M521 415 L529 420 L521 425" class="bond"/><text x="400" y="482" class="s" text-anchor="middle">Open → Loose → Tight → Open (simplified synthesis cycle)</text><rect x="24" y="510" width="752" height="206" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="544" class="h" text-anchor="start">3  Separate rotor cost from exported ATP yield</text><text x="55" y="583" class="t" text-anchor="start">Mammalian c₈ ring: 8 H⁺ / turn</text><text x="55" y="615" class="t" text-anchor="start">Three catalytic sites: 3 ATP / turn</text><text x="55" y="648" class="t" text-anchor="start">Rotor cost: 8/3 ≈ 2.67 H⁺ per ATP</text><text x="55" y="686" class="s" text-anchor="start">Transport, leak and coupling affect whole-mitochondrion yield.</text></svg>