<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="792" viewBox="0 0 1200 792" role="img" aria-labelledby="t d"><title id="t">Three definitions, one ladder</title><desc id="d">On the left, three nested boxes. The outermost is the Lewis model: an acid accepts an electron pair and a base donates one, which covers reactions with no proton at all, such as boron trifluoride accepting the nitrogen lone pair of ammonia. Inside it is the Bronsted-Lowry model: an acid donates a proton and a base accepts one, every reaction being a proton transfer, as when hydrogen chloride gives a proton to water. Innermost is the Arrhenius model: an acid makes hydrogen ions in water and a base makes hydroxide, which fails for ammonia and for anything outside water. A note records that every Bronsted-Lowry base is a Lewis base, and that a Bronsted-Lowry acid acts as a Lewis acid through the proton it donates rather than in its own right. On the right, a pKa ladder running from strongly acidic at the top to weakly acidic at the bottom, each rung giving an acid and its conjugate base: hydrogen chloride at about minus seven with chloride; hydronium at minus one point seven with water; bisulfate at two with sulfate; hydrofluoric acid at three point two with fluoride; acetic acid at four point seven with acetate; carbon dioxide and carbonic acid at six point one, the blood buffer, with bicarbonate; dihydrogen phosphate at seven point two with hydrogen phosphate; the histidine imidazolium at about six, which is why histidine shuttles protons at body pH; ammonium at nine point three with ammonia; bicarbonate at ten point three with carbonate; water at about fourteen as a solvent with hydroxide; and ethanol at sixteen with ethoxide. Two rules sit beside the ladder. First, the conjugate base of a stronger acid is a weaker base, quantified by Ka times Kb equals Kw, so pKa plus pKb equals fourteen at twenty-five degrees. Second, a proton moves from a rung higher up to the conjugate base of a rung lower down, and the equilibrium constant for that transfer is ten raised to the difference between the two pKa values, so a gap of four pKa units means a factor of ten thousand in favour of products. A footer warns about the two conventions for the acidity of water: use pKa fourteen when water is the solvent being deprotonated, which is the same as computing Kb as Kw over Ka, and reserve pKa fifteen point seven for the convention that treats water as a solute at fifty-five point five molar, as organic chemistry tables do. Mixing them changes an answer by a factor of about fifty-five.</desc><defs><marker id="m5610" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1200" height="792" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Three definitions, one ladder</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Each model is contained in the next. The pKₐ ladder then tells you, in one glance, which way any proton will move.</text><rect x="24" y="300" width="480" height="84" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="44.0" y="326.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:700;font-size:13px">ARRHENIUS</text><text x="44.0" y="345.0" class="" text-anchor="start" style="fill:#18364a;font-size:11.5px">acid makes H⁺ in water · base makes OH⁻</text><text x="264.0" y="364.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">the narrowest: fails for NH₃, and for anything outside water</text><line x1="264" y1="300" x2="264" y2="286" stroke="#6d716f" stroke-width="2.5" marker-end="url(#m5610)"/><rect x="24" y="204" width="480" height="84" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="44.0" y="230.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:13px">BRØNSTED–LOWRY</text><text x="44.0" y="249.0" class="" text-anchor="start" style="fill:#18364a;font-size:11.5px">acid donates a proton · base accepts one</text><text x="264.0" y="268.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">every reaction is a proton transfer: HCl + H₂O → H₃O⁺ + Cl⁻</text><line x1="264" y1="204" x2="264" y2="190" stroke="#6d716f" stroke-width="2.5" marker-end="url(#m5610)"/><rect x="24" y="108" width="480" height="84" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="44.0" y="134.0" class="" text-anchor="start" style="fill:#987740;font-weight:700;font-size:13px">LEWIS</text><text x="44.0" y="153.0" class="" text-anchor="start" style="fill:#18364a;font-size:11.5px">acid accepts an electron pair · base donates one</text><text x="264.0" y="172.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">the widest: covers reactions with no proton at all: BF₃ + :NH₃ → F₃B–NH₃</text><rect x="24" y="398" width="480" height="110" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="264.0" y="428.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">The containment is not symmetric</text><text x="264.0" y="449.0" class="" text-anchor="middle" style="font-size:12px">Every Brønsted–Lowry base is a Lewis base outright. A</text><text x="264.0" y="466.0" class="" text-anchor="middle" style="font-size:12px">Brønsted–Lowry acid acts as a Lewis acid only through the</text><text x="264.0" y="483.0" class="" text-anchor="middle" style="font-size:12px">proton it hands over — H⁺ is the electron-pair acceptor, not</text><text x="264.0" y="500.0" class="" text-anchor="middle" style="font-size:12px">the molecule that released it.</text><rect x="24" y="520" width="480" height="128" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="264.0" y="550.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">Which way will the proton go?</text><text x="264.0" y="571.0" class="" text-anchor="middle" style="font-size:12px">From the acid higher on the ladder to the conjugate base of</text><text x="264.0" y="588.0" class="" text-anchor="middle" style="font-size:12px">one lower down. For HA + B⁻ ⇌ A⁻ + HB, K = 10^(pKₐ HB − pKₐ</text><text x="264.0" y="605.0" class="" text-anchor="middle" style="font-size:12px">HA). A four-unit gap is a factor of 10⁴ in favour of</text><text x="264.0" y="622.0" class="" text-anchor="middle" style="font-size:12px">products. Reactions run toward the weaker acid and weaker</text><text x="264.0" y="639.0" class="" text-anchor="middle" style="font-size:12px">base.</text><text x="740.0" y="104.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:700;font-size:11px">pKₐ</text><line x1="748" y1="116" x2="748" y2="590" stroke="#d9d2c4" stroke-width="1.5"/><rect x="548" y="114" width="420" height="30" rx="7" fill="#ffffff" stroke="#e2dbcd" stroke-width="1"/><text x="652.0" y="133.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">HCl</text><text x="748.0" y="133.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">-7</text><text x="860.0" y="133.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12px">Cl⁻</text><text x="980.0" y="133.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">strong acid — fully dissociated</text><rect x="548" y="154" width="420" height="30" rx="7" fill="#ffffff" stroke="#e2dbcd" stroke-width="1"/><text x="652.0" y="173.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">H₃O⁺</text><text x="748.0" y="173.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">-1.7</text><text x="860.0" y="173.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12px">H₂O</text><rect x="548" y="194" width="420" height="30" rx="7" fill="#ffffff" stroke="#e2dbcd" stroke-width="1"/><text x="652.0" y="213.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">HSO₄⁻</text><text x="748.0" y="213.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">2</text><text x="860.0" y="213.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12px">SO₄²⁻</text><text x="980.0" y="213.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">2nd proton of H₂SO₄</text><rect x="548" y="234" width="420" height="30" rx="7" fill="#ffffff" stroke="#e2dbcd" stroke-width="1"/><text x="652.0" y="253.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">HF</text><text x="748.0" y="253.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">3.2</text><text x="860.0" y="253.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12px">F⁻</text><rect x="548" y="274" width="420" height="30" rx="7" fill="#ffffff" stroke="#e2dbcd" stroke-width="1"/><text x="652.0" y="293.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">CH₃COOH</text><text x="748.0" y="293.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">4.7</text><text x="860.0" y="293.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12px">CH₃COO⁻</text><rect x="548" y="314" width="420" height="30" rx="7" fill="#ffffff" stroke="#e2dbcd" stroke-width="1"/><text x="652.0" y="333.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">His imidazolium</text><text x="748.0" y="333.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">6</text><text x="860.0" y="333.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12px">His imidazole</text><text x="980.0" y="333.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">shuttles protons at body pH</text><rect x="548" y="354" width="420" height="30" rx="7" fill="#ffffff" stroke="#e2dbcd" stroke-width="1"/><text x="652.0" y="373.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">CO₂ / H₂CO₃</text><text x="748.0" y="373.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">6.1</text><text x="860.0" y="373.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12px">HCO₃⁻</text><text x="980.0" y="373.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">the blood buffer</text><rect x="548" y="394" width="420" height="30" rx="7" fill="#ffffff" stroke="#e2dbcd" stroke-width="1"/><text x="652.0" y="413.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">H₂PO₄⁻</text><text x="748.0" y="413.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">7.2</text><text x="860.0" y="413.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12px">HPO₄²⁻</text><text x="980.0" y="413.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">intracellular buffer</text><rect x="548" y="434" width="420" height="30" rx="7" fill="#ffffff" stroke="#e2dbcd" stroke-width="1"/><text x="652.0" y="453.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">NH₄⁺</text><text x="748.0" y="453.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">9.3</text><text x="860.0" y="453.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12px">NH₃</text><rect x="548" y="474" width="420" height="30" rx="7" fill="#ffffff" stroke="#e2dbcd" stroke-width="1"/><text x="652.0" y="493.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">HCO₃⁻</text><text x="748.0" y="493.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">10.3</text><text x="860.0" y="493.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12px">CO₃²⁻</text><rect x="548" y="514" width="420" height="30" rx="7" fill="#ffffff" stroke="#e2dbcd" stroke-width="1"/><text x="652.0" y="533.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">H₂O (as solvent)</text><text x="748.0" y="533.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">14</text><text x="860.0" y="533.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12px">OH⁻</text><rect x="548" y="554" width="420" height="30" rx="7" fill="#ffffff" stroke="#e2dbcd" stroke-width="1"/><text x="652.0" y="573.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">CH₃CH₂OH</text><text x="748.0" y="573.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">16</text><text x="860.0" y="573.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12px">CH₃CH₂O⁻</text><text x="604.0" y="98.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:11px">STRONGER ACID</text><text x="896.0" y="98.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:11px">WEAKER BASE</text><text x="604.0" y="604.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:11px">WEAKER ACID</text><text x="896.0" y="604.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:11px">STRONGER BASE</text><rect x="24" y="666" width="1152" height="104" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="600.0" y="696.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13.5px">Two conventions for the acidity of water — do not mix them</text><text x="600.0" y="717.5" class="" text-anchor="middle" style="font-size:12px">Use pKₐ = 14 when water is the solvent being deprotonated; that is the same as Kᵇ = Kᵥᵥ / Kₐ, which gives acetate Kᵇ = 5.6 ×</text><text x="600.0" y="734.5" class="" text-anchor="middle" style="font-size:12px">10⁻¹⁰. Reserve pKₐ = 15.7 for the organic-chemistry convention, which treats water as a solute at 55.5 M. The two differ by</text><text x="600.0" y="751.5" class="" text-anchor="middle" style="font-size:12px">a factor of about 55 — enough to turn a right answer into a wrong one.</text></svg>