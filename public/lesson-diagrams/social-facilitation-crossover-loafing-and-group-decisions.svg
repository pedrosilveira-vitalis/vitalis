<svg xmlns="http://www.w3.org/2000/svg" width="920" height="948" viewBox="0 0 920 948" role="img" aria-labelledby="t d"><title id="t">Who else is in the room, and what are they doing there?</title><desc id="d">Top: the crossover that defines social facilitation. An audience raises arousal, and arousal strengthens whatever response is already dominant — so performance improves when the dominant response is the correct one and gets worse when it is not. Note that “simple” and “complex” are relative to the performer, not to the task: the same laparoscopic procedure is simple for the attending and complex for the intern, and the audience helps one and hurts the other. Bottom left: the sorting question that separates facilitation from loafing — whose task is it, and can anyone see your share. Bottom right: groupthink against polarization, which get confused because both end in unanimity, though for opposite reasons.</desc><defs><marker id="m7386" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b7a64"/></marker><marker id="m9370" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="948" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Who else is in the room, and what are they doing there?</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Two questions sort almost every group effect on the exam</text><rect x="40" y="180" width="840" height="318" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">Arousal strengthens the dominant response</text><rect x="360" y="228" width="200" height="42" rx="8" fill="#efede8" stroke="#6d716f" stroke-width="1.6"/><text x="460.0" y="246.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11.5px">AN AUDIENCE</text><text x="460.0" y="262.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">→ physiological arousal</text><line x1="400" y1="276" x2="270" y2="302" stroke="#5b7a64" stroke-width="2.5" marker-end="url(#m7386)"/><line x1="520" y1="276" x2="650" y2="302" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m9370)"/><rect x="80" y="310" width="340" height="168" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="250.0" y="334.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">TASK IS WELL-PRACTISED</text><text x="250.0" y="352.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">…for this performer</text><line x1="120" y1="364" x2="380" y2="364" stroke="#5b7a64" stroke-width="1" stroke-dasharray="6 5"/><text x="250.0" y="388.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">dominant response = CORRECT</text><text x="250.0" y="416.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">PERFORMANCE IMPROVES</text><text x="250.0" y="442.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">the concert pianist, the attending surgeon</text><text x="250.0" y="462.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">the cyclist racing rather than riding alone</text><rect x="500" y="310" width="340" height="168" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="670.0" y="334.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">TASK IS NOT YET LEARNED</text><text x="670.0" y="352.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">…for this performer</text><line x1="540" y1="364" x2="800" y2="364" stroke="#a8324a" stroke-width="1" stroke-dasharray="6 5"/><text x="670.0" y="388.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">dominant response = ERROR</text><text x="670.0" y="416.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">PERFORMANCE WORSENS</text><text x="670.0" y="442.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">the student recital, the intern&#x27;s first case</text><text x="670.0" y="462.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">same audience, opposite effect</text><rect x="40" y="514" width="410" height="414" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="245.0" y="542.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">Facilitation or loafing?</text><rect x="64" y="562" width="362" height="44" rx="8" fill="#efede8" stroke="#6d716f" stroke-width="1.6"/><text x="245.0" y="582.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10.5px">WHOSE TASK IS IT, AND WHO CAN SEE</text><text x="245.0" y="598.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">your individual share of the result?</text><rect x="64" y="618" width="362" height="128" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="245.0" y="642.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">MY OWN TASK, VISIBLE</text><text x="245.0" y="662.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">→ SOCIAL FACILITATION</text><text x="245.0" y="688.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">others are watching or working alongside</text><text x="245.0" y="706.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">effort goes UP; accuracy depends on skill</text><text x="245.0" y="724.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">studying in a library, racing, performing</text><rect x="64" y="758" width="362" height="160" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="245.0" y="782.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">SHARED TASK, SHARE HIDDEN</text><text x="245.0" y="802.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">→ SOCIAL LOAFING</text><text x="245.0" y="828.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9.5px">Ringelmann: 1 person pulls at 100%,</text><text x="245.0" y="846.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9.5px">three at about 85%, eight at about 49%</text><text x="245.0" y="864.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9.5px">diffused responsibility, no identifiability,</text><text x="245.0" y="882.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9.5px">free riders — and the sucker effect in reply</text><text x="245.0" y="900.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">cured by making each share visible</text><rect x="470" y="514" width="410" height="414" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="675.0" y="542.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12.5px">Both end unanimous — for opposite reasons</text><rect x="494" y="562" width="362" height="172" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="675.0" y="586.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">GROUPTHINK</text><text x="675.0" y="606.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">debate is SUPPRESSED</text><line x1="540" y1="618" x2="810" y2="618" stroke="#a8324a" stroke-width="1" stroke-dasharray="6 5"/><text x="675.0" y="640.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9px">needs a cohesive, insulated group under stress</text><text x="675.0" y="655.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9px">self-censorship, illusion of unanimity,</text><text x="675.0" y="670.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9px">mindguards, pressure on dissenters</text><text x="675.0" y="685.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">the decision gets WORSE</text><text x="675.0" y="700.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9px">fix: devil&#x27;s advocate, outside experts,</text><text x="675.0" y="715.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9px">leader speaks last, second-chance meeting</text><rect x="494" y="746" width="362" height="172" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="675.0" y="770.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">GROUP POLARIZATION</text><text x="675.0" y="790.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">debate is what DOES it</text><line x1="540" y1="802" x2="810" y2="802" stroke="#5b7a64" stroke-width="1" stroke-dasharray="6 5"/><text x="675.0" y="824.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9px">no cohesion required</text><text x="675.0" y="839.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9px">arguments heard all point one way</text><text x="675.0" y="854.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9px">— and people position themselves against the group</text><text x="675.0" y="869.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">the group ends MORE EXTREME in the</text><text x="675.0" y="884.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9px">direction it already leaned, risky OR cautious</text><text x="675.0" y="899.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9px">jury rooms, echo chambers, radicalisation</text></svg>