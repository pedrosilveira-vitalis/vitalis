<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">Protein secondary structure patterns</title><desc id="desc">An alpha helix has a carbonyl oxygen hydrogen bonded to the N–H of residue i plus four. Beta strands may align in parallel or antiparallel directions. Type II turns often contain glycine at i plus two. Porins have hydrophobic outer surfaces and polar water channels.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#245574;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">Recognize the backbone patterns</text><rect x="24" y="60" width="752" height="180" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="94" class="h" text-anchor="start">1  α-helix: an i → i+4 hydrogen bond</text><circle cx="92" cy="132" r="20" fill="#e4eef1"/><text x="92" y="138" class="s" text-anchor="middle">i</text><path d="M112 132 L222 132" class="bond" /><circle cx="242" cy="132" r="20" fill="#e4eef1"/><text x="242" y="138" class="s" text-anchor="middle">i+1</text><path d="M262 132 L372 132" class="bond" /><circle cx="392" cy="132" r="20" fill="#e4eef1"/><text x="392" y="138" class="s" text-anchor="middle">i+2</text><path d="M412 132 L522 132" class="bond" /><circle cx="542" cy="132" r="20" fill="#e4eef1"/><text x="542" y="138" class="s" text-anchor="middle">i+3</text><path d="M562 132 L672 132" class="bond" /><circle cx="692" cy="132" r="20" fill="#e4eef1"/><text x="692" y="138" class="s" text-anchor="middle">i+4</text><text x="60" y="184" class="t" text-anchor="start">C=O</text><text x="624" y="184" class="t" text-anchor="start">H–N</text><path d="M105 178 L620 178" stroke="#245574" stroke-width="3" stroke-dasharray="6 5"/><text x="350" y="172" class="s" text-anchor="middle">hydrogen bond</text><text x="50" y="217" class="s" text-anchor="start">O accepts; N–H donates. Sequence is straightened here for clarity.</text><rect x="24" y="256" width="752" height="191" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="290" class="h" text-anchor="start">2  β-sheets: compare N-to-C directions</text><path d="M75 335 L335 335" class="bond" /><path d="M323 328 L335 335 L323 342" class="bond"/><text x="60" y="340" class="s" text-anchor="start">N</text><text x="343" y="340" class="s" text-anchor="start">C</text><path d="M75 380 L335 380" class="bond" /><path d="M323 373 L335 380 L323 387" class="bond"/><text x="60" y="385" class="s" text-anchor="start">N</text><text x="343" y="385" class="s" text-anchor="start">C</text><path d="M125 340 L125 374" stroke="#245574" stroke-dasharray="4 4"/><path d="M185 340 L185 374" stroke="#245574" stroke-dasharray="4 4"/><path d="M245 340 L245 374" stroke="#245574" stroke-dasharray="4 4"/><path d="M305 340 L305 374" stroke="#245574" stroke-dasharray="4 4"/><text x="200" y="422" class="t" text-anchor="middle">Parallel</text><path d="M445 335 L705 335" class="bond" /><path d="M693 328 L705 335 L693 342" class="bond"/><text x="430" y="340" class="s" text-anchor="start">N</text><text x="713" y="340" class="s" text-anchor="start">C</text><path d="M705 380 L445 380" class="bond" /><path d="M457 373 L445 380 L457 387" class="bond"/><text x="713" y="385" class="s" text-anchor="start">N</text><text x="430" y="385" class="s" text-anchor="start">C</text><path d="M495 340 L495 374" stroke="#245574" stroke-dasharray="4 4"/><path d="M555 340 L555 374" stroke="#245574" stroke-dasharray="4 4"/><path d="M615 340 L615 374" stroke="#245574" stroke-dasharray="4 4"/><path d="M675 340 L675 374" stroke="#245574" stroke-dasharray="4 4"/><text x="570" y="422" class="t" text-anchor="middle">Antiparallel</text><text x="400" y="441" class="s" text-anchor="middle">Dashed links symbolize interstrand backbone H-bonds; not atom geometry.</text><rect x="24" y="463" width="752" height="253" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="497" class="h" text-anchor="start">3  Two useful applications</text><circle cx="75" cy="545" r="7" fill="#245574"/><text x="89" y="550" class="s" text-anchor="start">i</text><circle cx="170" cy="530" r="7" fill="#245574"/><text x="184" y="535" class="s" text-anchor="start">i+1</text><circle cx="200" cy="598" r="7" fill="#245574"/><text x="214" y="603" class="s" text-anchor="start">i+2</text><circle cx="105" cy="615" r="7" fill="#245574"/><text x="119" y="620" class="s" text-anchor="start">i+3</text><path d="M75 545 Q165 480 200 598 Q175 642 105 615" class="bond"/><text x="50" y="661" class="s" text-anchor="start">Type II turn: glycine often at i+2.</text><text x="50" y="688" class="s" text-anchor="start">Its H side chain fits positive φ.</text><ellipse cx="590" cy="570" rx="114" ry="54" fill="#eadbbf" stroke="#18364a" stroke-width="3"/><ellipse cx="590" cy="570" rx="65" ry="35" fill="#e4eef1" stroke="#245574" stroke-width="3"/><text x="590" y="575" class="s" text-anchor="middle">Water pore</text><text x="590" y="644" class="t" text-anchor="middle">Porin cross-section</text><text x="590" y="670" class="s" text-anchor="middle">Hydrophobic outside → lipid</text><text x="590" y="693" class="s" text-anchor="middle">Polar inside → water</text></svg>