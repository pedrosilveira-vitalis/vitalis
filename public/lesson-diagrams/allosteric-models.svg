<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">Allosteric models and evidence</title><desc id="desc">MWC interconverts all-T and all-R oligomers without mixed subunit conformations. Sequential models allow mixed states. Monomeric glucokinase demonstrates that allostery does not require multiple subunits. Rate comparison requires specified half-maximal concentrations.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#245574;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">Allostery: distinguish model from evidence</text><rect x="24" y="60" width="752" height="220" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="96" class="h" text-anchor="start">1  Two models of subunit communication</text><text x="55" y="142" class="h" text-anchor="start">MWC:  [ T T T T ]  ⇌  [ R R R R ]</text><text x="55" y="177" class="s" text-anchor="start">Classical concerted model excludes mixed T/R oligomers.</text><text x="55" y="218" class="t" text-anchor="start">Sequential: mixed conformations can occur.</text><text x="55" y="253" class="s" text-anchor="start">Ligand occupancy and subunit conformation are different labels.</text><rect x="24" y="296" width="752" height="142" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="332" class="h" text-anchor="start">2  Multiple subunits are not required</text><text x="55" y="375" class="s" text-anchor="start">Human glucokinase is monomeric yet shows kinetic cooperativity.</text><text x="55" y="410" class="s" text-anchor="start">A sigmoidal curve does not uniquely identify an MWC mechanism.</text><rect x="24" y="454" width="752" height="262" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="490" class="h" text-anchor="start">3  Compare curves only with stated parameters</text><text x="55" y="532" class="t" text-anchor="start">Same Vmax and half-maximal concentration K:</text><text x="55" y="575" class="t" text-anchor="start">Hyperbola: v/Vmax = [S] / (K + [S])</text><text x="55" y="616" class="t" text-anchor="start">Hill n = 2: v/Vmax = [S]² / (K² + [S]²)</text><text x="55" y="656" class="t" text-anchor="start">At [S] = 0.1K:  9.1% versus 1.0% of Vmax</text><text x="55" y="691" class="s" text-anchor="start">Equal Vmax alone would not establish which enzyme is faster.</text></svg>