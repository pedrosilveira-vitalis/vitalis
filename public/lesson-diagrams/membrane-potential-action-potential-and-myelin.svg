<svg xmlns="http://www.w3.org/2000/svg" width="920" height="860" viewBox="0 0 920 860" role="img" aria-labelledby="t d"><title id="t">Open a channel and the voltage walks toward that ion&#x27;s equilibrium</title><desc id="d">Top: a voltage scale from minus ninety-five to plus sixty-seven millivolts showing where each ion&#x27;s equilibrium potential sits, with the resting potential near potassium&#x27;s because the resting membrane is mostly potassium-permeable, and threshold and the action potential peak marked. Middle: the action potential traced through its phases — the sodium channels opening on a positive feedback loop, their inactivation gate closing, the slower potassium channels repolarising and overshooting into afterhyperpolarisation, with the absolute and relative refractory periods marked underneath. Bottom left: the membrane as a circuit, a capacitor in parallel with a conductance and battery for each ion. Bottom right: why myelin is fast — it raises the membrane resistance and lowers its capacitance, so the local current reaches the next node of Ranvier before it leaks away.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="860" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Open a channel and the voltage walks toward that ion&#x27;s equilibrium</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Driving force = V_m − E_ion — that one difference sets the direction and size of every current</text><rect x="40" y="136" width="840" height="180" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="164.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">Where the voltages sit</text><line x1="120" y1="238" x2="800" y2="238" stroke="#6d716f" stroke-width="2.4"/><line x1="173.68421052631578" y1="229" x2="173.68421052631578" y2="247" stroke="#18364a" stroke-width="2.4"/><text x="173.7" y="218.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">E_K</text><text x="173.7" y="200.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">-95 mV</text><line x1="263.1578947368421" y1="229" x2="263.1578947368421" y2="247" stroke="#245574" stroke-width="2.4"/><text x="263.2" y="268.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">rest</text><text x="263.2" y="286.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">-70 mV</text><line x1="316.8421052631579" y1="229" x2="316.8421052631579" y2="247" stroke="#987740" stroke-width="2.4"/><text x="316.8" y="218.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">threshold</text><text x="316.8" y="200.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">-55 mV</text><line x1="638.9473684210527" y1="229" x2="638.9473684210527" y2="247" stroke="#a8324a" stroke-width="2.4"/><text x="638.9" y="268.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">AP peak</text><text x="638.9" y="286.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">+35 mV</text><line x1="753.4736842105264" y1="229" x2="753.4736842105264" y2="247" stroke="#18364a" stroke-width="2.4"/><text x="753.5" y="218.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">E_Na</text><text x="753.5" y="200.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">+67 mV</text><text x="460.0" y="300.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">the resting membrane is mostly K⁺-permeable, so V_m sits near E_K</text><rect x="40" y="332" width="840" height="300" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="460.0" y="360.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">One spike, four jobs</text><line x1="130" y1="526" x2="670" y2="526" stroke="#18364a" stroke-width="2"/><line x1="130" y1="378" x2="130" y2="526" stroke="#18364a" stroke-width="2"/><text x="400.0" y="570.0" class="" text-anchor="middle" style="font-size:17px">time (ms)</text><text x="86" y="452.0" text-anchor="middle" transform="rotate(-90 86 452.0)" style="font-size:17px">V_m (mV)</text><line x1="220.0" y1="526.0" x2="220.0" y2="532.0" stroke="#18364a" stroke-width="2"/><text x="220.0" y="548.0" class="" text-anchor="middle" style="font-size:14px">1</text><line x1="310.0" y1="526.0" x2="310.0" y2="532.0" stroke="#18364a" stroke-width="2"/><text x="310.0" y="548.0" class="" text-anchor="middle" style="font-size:14px">2</text><line x1="400.0" y1="526.0" x2="400.0" y2="532.0" stroke="#18364a" stroke-width="2"/><text x="400.0" y="548.0" class="" text-anchor="middle" style="font-size:14px">3</text><line x1="490.0" y1="526.0" x2="490.0" y2="532.0" stroke="#18364a" stroke-width="2"/><text x="490.0" y="548.0" class="" text-anchor="middle" style="font-size:14px">4</text><line x1="580.0" y1="526.0" x2="580.0" y2="532.0" stroke="#18364a" stroke-width="2"/><text x="580.0" y="548.0" class="" text-anchor="middle" style="font-size:14px">5</text><line x1="124.0" y1="504.85714285714283" x2="130.0" y2="504.85714285714283" stroke="#18364a" stroke-width="2"/><text x="120.0" y="509.9" class="" text-anchor="end" style="font-size:14px">-70</text><line x1="124.0" y1="489.0" x2="130.0" y2="489.0" stroke="#18364a" stroke-width="2"/><text x="120.0" y="494.0" class="" text-anchor="end" style="font-size:14px">-55</text><line x1="124.0" y1="430.85714285714283" x2="130.0" y2="430.85714285714283" stroke="#18364a" stroke-width="2"/><text x="120.0" y="435.9" class="" text-anchor="end" style="font-size:14px">0</text><line x1="124.0" y1="399.14285714285717" x2="130.0" y2="399.14285714285717" stroke="#18364a" stroke-width="2"/><text x="120.0" y="404.1" class="" text-anchor="end" style="font-size:14px">30</text><path d="M130.0 504.9 L132.2 504.9 L134.5 504.9 L136.8 504.9 L139.0 504.8 L141.2 504.8 L143.5 504.8 L145.8 504.8 L148.0 504.7 L150.2 504.7 L152.5 504.6 L154.8 504.5 L157.0 504.4 L159.2 504.3 L161.5 504.2 L163.8 504.0 L166.0 503.8 L168.2 503.6 L170.5 503.4 L172.8 503.2 L175.0 502.9 L177.2 502.6 L179.5 502.2 L181.8 501.8 L184.0 501.4 L186.2 501.0 L188.5 500.5 L190.8 500.0 L193.0 499.4 L195.2 498.8 L197.5 498.2 L199.8 497.5 L202.0 496.7 L204.2 496.0 L206.5 495.1 L208.8 494.2 L211.0 493.3 L213.2 492.3 L215.5 491.3 L217.8 490.2 L220.0 489.0 L222.2 488.2 L224.5 486.6 L226.8 484.4 L229.0 481.8 L231.2 478.6 L233.5 475.1 L235.8 471.3 L238.0 467.0 L240.2 462.5 L242.5 457.6 L244.8 452.4 L247.0 447.0 L249.2 441.2 L251.5 435.2 L253.8 429.0 L256.0 422.4 L258.2 415.6 L260.5 408.6 L262.8 401.4 L265.0 393.9 L267.2 397.9 L269.5 401.4 L271.8 404.7 L274.0 407.9 L276.2 411.0 L278.5 414.1 L280.8 417.1 L283.0 420.1 L285.2 423.0 L287.5 425.9 L289.8 428.8 L292.0 431.6 L294.2 434.4 L296.5 437.2 L298.8 440.0 L301.0 442.8 L303.2 445.5 L305.5 448.2 L307.8 451.0 L310.0 453.7 L312.2 456.3 L314.5 459.0 L316.8 461.7 L319.0 464.3 L321.2 466.9 L323.5 469.6 L325.8 472.2 L328.0 474.8 L330.2 477.4 L332.5 480.0 L334.8 482.6 L337.0 485.1 L339.2 487.7 L341.5 490.3 L343.8 492.8 L346.0 495.3 L348.2 497.9 L350.5 500.4 L352.8 502.9 L355.0 505.4 L357.2 507.9 L359.5 510.4 L361.8 512.9 L364.0 515.4 L366.2 515.4 L368.5 515.4 L370.8 515.4 L373.0 515.3 L375.2 515.3 L377.5 515.2 L379.8 515.1 L382.0 515.0 L384.2 514.9 L386.5 514.8 L388.8 514.6 L391.0 514.5 L393.2 514.3 L395.5 514.1 L397.8 513.9 L400.0 513.7 L402.2 513.5 L404.5 513.3 L406.8 513.0 L409.0 512.8 L411.2 512.5 L413.5 512.2 L415.8 511.9 L418.0 511.6 L420.2 511.3 L422.5 511.0 L424.8 510.6 L427.0 510.2 L429.2 509.9 L431.5 509.5 L433.8 509.1 L436.0 508.7 L438.2 508.2 L440.5 507.8 L442.8 507.3 L445.0 506.9 L447.2 506.4 L449.5 505.9 L451.8 505.4 L454.0 510.1 L456.2 509.9 L458.5 509.7 L460.7 509.5 L463.0 509.4 L465.2 509.2 L467.5 509.0 L469.8 508.9 L472.0 508.7 L474.3 508.5 L476.5 508.4 L478.8 508.3 L481.0 508.1 L483.2 508.0 L485.5 507.9 L487.8 507.8 L490.0 507.6 L492.3 507.5 L494.5 507.4 L496.8 507.3 L499.0 507.2 L501.2 507.1 L503.5 507.0 L505.8 507.0 L508.0 506.9 L510.2 506.8 L512.5 506.7 L514.8 506.7 L517.0 506.6 L519.2 506.5 L521.5 506.4 L523.8 506.4 L526.0 506.3 L528.2 506.3 L530.5 506.2 L532.8 506.2 L535.0 506.1 L537.2 506.1 L539.5 506.0 L541.8 506.0 L544.0 505.9 L546.2 505.9 L548.5 505.8 L550.8 505.8 L553.0 505.8 L555.2 505.7 L557.5 505.7 L559.8 505.7 L562.0 505.6 L564.2 505.6 L566.5 505.6 L568.8 505.5 L571.0 505.5 L573.2 505.5 L575.5 505.5 L577.8 505.4 L580.0 505.4 L582.2 505.4 L584.5 505.4 L586.8 505.4 L589.0 505.3 L591.2 505.3 L593.5 505.3 L595.8 505.3 L598.0 505.3 L600.2 505.2 L602.5 505.2 L604.8 505.2 L607.0 505.2 L609.2 505.2 L611.5 505.2 L613.8 505.2 L616.0 505.2 L618.2 505.1 L620.5 505.1 L622.8 505.1 L625.0 505.1 L627.2 505.1 L629.5 505.1 L631.8 505.1 L634.0 505.1 L636.2 505.1 L638.5 505.1 L640.8 505.0 L643.0 505.0 L645.2 505.0 L647.5 505.0 L649.8 505.0 L652.0 505.0 L654.2 505.0 L656.5 505.0 L658.8 505.0 L661.0 505.0 L663.2 505.0 L665.5 505.0 L667.8 505.0 L670.0 505.0" stroke="#a8324a" stroke-width="2.8" fill="none"/><line x1="130.0" y1="504.85714285714283" x2="670.0" y2="504.85714285714283" stroke="#6d716f" stroke-width="1" stroke-dasharray="6 5"/><line x1="130.0" y1="489.0" x2="670.0" y2="489.0" stroke="#6d716f" stroke-width="1" stroke-dasharray="6 5"/><text x="186.5" y="424.9" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">Na⁺ in</text><text x="281.0" y="383.9" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">peak</text><text x="343.0" y="452.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">K⁺ out</text><text x="457.0" y="501.3" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">undershoot</text><line x1="220.0" y1="592" x2="364.0" y2="592" stroke="#a8324a" stroke-width="4"/><text x="292.0" y="612.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">absolute refractory</text><line x1="364.0" y1="592" x2="472.0" y2="592" stroke="#987740" stroke-width="4"/><text x="418.0" y="612.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">relative</text><text x="700.0" y="420.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:13px">Na⁺ channels have TWO gates:</text><text x="700.0" y="442.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">activation opens fast,</text><text x="700.0" y="462.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">inactivation closes just after —</text><text x="700.0" y="482.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:13px">and only repolarising resets it</text><text x="700.0" y="516.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">K⁺ channels are simply slow,</text><text x="700.0" y="536.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">which is what causes the undershoot</text><rect x="40" y="650" width="404" height="190" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="242.0" y="678.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">The membrane as a circuit</text><line x1="90" y1="700" x2="400" y2="700" stroke="#6d716f" stroke-width="2"/><line x1="90" y1="800" x2="400" y2="800" stroke="#6d716f" stroke-width="2"/><line x1="120" y1="700" x2="120" y2="740" stroke="#6d716f" stroke-width="2"/><line x1="110" y1="740" x2="130" y2="740" stroke="#18364a" stroke-width="3"/><line x1="110" y1="750" x2="130" y2="750" stroke="#18364a" stroke-width="3"/><line x1="120" y1="750" x2="120" y2="800" stroke="#6d716f" stroke-width="2"/><text x="120.0" y="820.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">C_m</text><line x1="220" y1="700" x2="220" y2="722" stroke="#6d716f" stroke-width="2"/><rect x="209" y="722" width="22" height="30" rx="3" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><line x1="220" y1="752" x2="220" y2="766" stroke="#6d716f" stroke-width="2"/><line x1="209" y1="766" x2="231" y2="766" stroke="#18364a" stroke-width="3"/><line x1="214" y1="774" x2="226" y2="774" stroke="#18364a" stroke-width="1.8"/><line x1="220" y1="774" x2="220" y2="800" stroke="#6d716f" stroke-width="2"/><text x="202.0" y="742.0" class="" text-anchor="end" style="fill:#5b7a64;font-weight:bold;font-size:13px">g_K</text><text x="238.0" y="774.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:13px">E_K</text><line x1="330" y1="700" x2="330" y2="722" stroke="#6d716f" stroke-width="2"/><rect x="319" y="722" width="22" height="30" rx="3" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><line x1="330" y1="752" x2="330" y2="766" stroke="#6d716f" stroke-width="2"/><line x1="319" y1="766" x2="341" y2="766" stroke="#18364a" stroke-width="3"/><line x1="324" y1="774" x2="336" y2="774" stroke="#18364a" stroke-width="1.8"/><line x1="330" y1="774" x2="330" y2="800" stroke="#6d716f" stroke-width="2"/><text x="312.0" y="742.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:bold;font-size:13px">g_Na</text><text x="348.0" y="774.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:13px">E_Na</text><text x="242.0" y="820.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">I_ion = g(V_m − E_ion)</text><rect x="466" y="650" width="414" height="190" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="673.0" y="678.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">Why myelin is fast</text><line x1="506" y1="730" x2="846" y2="730" stroke="#18364a" stroke-width="5"/><rect x="514" y="718" width="84" height="24" rx="6" fill="#f1eadc" stroke="#987740" stroke-width="2"/><rect x="624" y="718" width="84" height="24" rx="6" fill="#f1eadc" stroke="#987740" stroke-width="2"/><rect x="734" y="718" width="84" height="24" rx="6" fill="#f1eadc" stroke="#987740" stroke-width="2"/><circle cx="514" cy="730" r="6" fill="#a8324a" stroke="#a8324a" stroke-width="2"/><circle cx="622" cy="730" r="6" fill="#a8324a" stroke="#a8324a" stroke-width="2"/><circle cx="732" cy="730" r="6" fill="#a8324a" stroke="#a8324a" stroke-width="2"/><circle cx="840" cy="730" r="6" fill="#a8324a" stroke="#a8324a" stroke-width="2"/><text x="673.0" y="762.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">nodes of Ranvier: all the Na⁺ channels are here</text><text x="673.0" y="788.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">myelin raises R_m and lowers C_m, so the current</text><text x="673.0" y="808.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">reaches the next node before it leaks away</text><text x="673.0" y="832.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">70–120 m/s myelinated vs 0.5–2 m/s bare</text></svg>