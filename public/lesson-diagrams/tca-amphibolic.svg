<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">Refill the TCA intermediate pool</title><desc id="desc">External carbon can replenish the TCA intermediate pool. Pyruvate carboxylase makes OAA using bicarbonate, ATP and biotin. Propionyl-CoA supplies succinyl-CoA using biotin and B12-dependent reactions. Exits supply lipids, amino acids, glucose and heme. Acetyl-CoA alone does not increase the net intermediate pool.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#aa3653;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">TCA intermediates: refilling versus withdrawal</text><rect x="24" y="60" width="752" height="238" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="94" class="h" text-anchor="start">1  Anaplerosis adds carbon to the pool</text><rect x="50" y="120" width="190" height="44" rx="9" fill="#e4eef1"/><text x="145.0" y="148" class="t" text-anchor="middle">Pyruvate + HCO₃⁻</text><path d="M255 142 L515 142" class="bond" /><path d="M507 137 L515 142 L507 147" class="bond"/><rect x="530" y="120" width="215" height="44" rx="9" fill="#e4eef1"/><text x="637.5" y="148" class="t" text-anchor="middle">Oxaloacetate</text><text x="385" y="130" class="s" text-anchor="middle">Pyruvate carboxylase</text><text x="385" y="174" class="s" text-anchor="middle">ATP + biotin</text><rect x="50" y="205" width="190" height="44" rx="9" fill="#e4eef1"/><text x="145.0" y="233" class="t" text-anchor="middle">Propionyl-CoA</text><path d="M255 227 L515 227" class="bond" /><path d="M507 222 L515 227 L507 232" class="bond"/><rect x="530" y="205" width="215" height="44" rx="9" fill="#e4eef1"/><text x="637.5" y="233" class="t" text-anchor="middle">Succinyl-CoA</text><text x="385" y="215" class="s" text-anchor="middle">Several reactions</text><text x="385" y="260" class="s" text-anchor="middle">Biotin + B₁₂</text><rect x="24" y="314" width="752" height="245" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="348" class="h" text-anchor="start">2  Cataplerosis supplies biosynthesis</text><text x="55" y="382" class="s" text-anchor="start">Citrate</text><path d="M280 377 L355 377" class="bond" /><path d="M347 372 L355 377 L347 382" class="bond"/><text x="375" y="382" class="s" text-anchor="start">Cytosolic acetyl-CoA → lipids</text><text x="55" y="425" class="s" text-anchor="start">α-Ketoglutarate</text><path d="M280 420 L355 420" class="bond" /><path d="M347 415 L355 420 L347 425" class="bond"/><text x="375" y="425" class="s" text-anchor="start">Glutamate → nitrogen metabolism</text><text x="55" y="468" class="s" text-anchor="start">Oxaloacetate</text><path d="M280 463 L355 463" class="bond" /><path d="M347 458 L355 463 L347 468" class="bond"/><text x="375" y="468" class="s" text-anchor="start">Glucose or aspartate</text><text x="55" y="511" class="s" text-anchor="start">Succinyl-CoA + glycine</text><path d="M280 506 L355 506" class="bond" /><path d="M347 501 L355 506 L347 511" class="bond"/><text x="375" y="511" class="s" text-anchor="start">ALA → heme</text><rect x="24" y="575" width="752" height="141" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="609" class="h" text-anchor="start">3  Entry is not the same as a net refill</text><text x="55" y="643" class="t" text-anchor="start">Acetyl-CoA enters; two carbons leave per complete turn.</text><text x="55" y="674" class="s" text-anchor="start">No net gain of intermediate molecules from that entry alone.</text><text x="55" y="700" class="s" text-anchor="start">First-turn carbon identity is a different question.</text></svg>