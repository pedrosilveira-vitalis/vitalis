<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820" role="img" aria-labelledby="title desc"><title id="title">GPCR and RTK switches</title><desc id="desc">A sevenpass GPCR promotes G alpha nucleotide exchange and cAMP synthesis. An RTK receptor pair activates phosphotyrosine docking and a Ras Raf MEK ERK kinase cascade. GTP hydrolysis terminates G protein and Ras activation.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#245574"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#18364a;font-size:18px}.h{font-size:25px;font-weight:700}.s{font-size:15px}.label{font-size:20px;font-weight:600}.line{stroke:#245574;stroke-width:3;fill:none}.arrow{stroke:#245574;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect width="900" height="820" rx="22" fill="#fbf7ef"/><text x="32" y="45" class="h" text-anchor="start">Different receptors. Different switches.</text><text x="225" y="93" class="label" text-anchor="middle">GPCR → cAMP</text><text x="675" y="93" class="label" text-anchor="middle">RTK → MAPK</text><path d="M450 80 V742" class="line"/><rect x="35" y="145" width="380" height="45" rx="4" fill="#c6d9e5" stroke="#b6cbd8"/><rect x="485" y="145" width="380" height="45" rx="4" fill="#c6d9e5" stroke="#b6cbd8"/><rect x="140" y="130" width="12" height="80" rx="6" fill="#245574" stroke="#b6cbd8"/><rect x="163" y="130" width="12" height="80" rx="6" fill="#245574" stroke="#b6cbd8"/><rect x="186" y="130" width="12" height="80" rx="6" fill="#245574" stroke="#b6cbd8"/><rect x="209" y="130" width="12" height="80" rx="6" fill="#245574" stroke="#b6cbd8"/><rect x="232" y="130" width="12" height="80" rx="6" fill="#245574" stroke="#b6cbd8"/><rect x="255" y="130" width="12" height="80" rx="6" fill="#245574" stroke="#b6cbd8"/><rect x="278" y="130" width="12" height="80" rx="6" fill="#245574" stroke="#b6cbd8"/><text x="225" y="240" class="s" text-anchor="middle">Seven-pass receptor</text><rect x="115" y="280" width="220" height="55" rx="12" fill="#e4eef3" stroke="#b6cbd8"/><text x="225" y="313" class="" text-anchor="middle">Gαs: GDP → GTP</text><path d="M225 249 V271" class="arrow"/><rect x="115" y="380" width="220" height="55" rx="12" fill="#e4eef3" stroke="#b6cbd8"/><text x="225" y="413" class="" text-anchor="middle">Adenylyl cyclase</text><path d="M225 340 V371" class="arrow"/><text x="225" y="478" class="" text-anchor="middle">ATP → cAMP</text><path d="M225 442 V454" class="arrow"/><rect x="115" y="515" width="220" height="55" rx="12" fill="#e4eef3" stroke="#b6cbd8"/><text x="225" y="548" class="" text-anchor="middle">PKA → substrates</text><path d="M225 484 V506" class="arrow"/><text x="225" y="617" class="label" text-anchor="middle">OFF switches</text><text x="225" y="648" class="s" text-anchor="middle">Gαs: GTP → GDP</text><text x="225" y="675" class="s" text-anchor="middle">PDE: cAMP → AMP</text><rect x="625" y="115" width="18" height="115" rx="6" fill="#245574" stroke="#b6cbd8"/><circle cx="634" cy="247" r="27" fill="#e4eef3" stroke="#245574" stroke-width="2"/><text x="634" y="254" class="s" text-anchor="middle">K</text><rect x="705" y="115" width="18" height="115" rx="6" fill="#245574" stroke="#b6cbd8"/><circle cx="714" cy="247" r="27" fill="#e4eef3" stroke="#245574" stroke-width="2"/><text x="714" y="254" class="s" text-anchor="middle">K</text><path d="M640 128 Q670 95 710 128" class="line"/><text x="675" y="295" class="s" text-anchor="middle">Kinase domains → phosphotyrosines</text><rect x="535" y="320" width="280" height="55" rx="12" fill="#e4eef3" stroke="#b6cbd8"/><text x="675" y="354" class="" text-anchor="middle">Grb2 + SOS</text><rect x="535" y="410" width="280" height="55" rx="12" fill="#e4eef3" stroke="#b6cbd8"/><text x="675" y="444" class="" text-anchor="middle">Ras: GDP → GTP</text><path d="M675 378 V401" class="arrow"/><rect x="535" y="500" width="280" height="55" rx="12" fill="#e4eef3" stroke="#b6cbd8"/><text x="675" y="534" class="" text-anchor="middle">Raf → MEK → ERK</text><path d="M675 468 V491" class="arrow"/><path d="M675 563 V611" class="arrow"/><rect x="550" y="620" width="250" height="65" rx="12" fill="#e4eef3" stroke="#b6cbd8"/><text x="675" y="647" class="" text-anchor="middle">Substrates + transcription</text><text x="675" y="674" class="s" text-anchor="middle">Response depends on context</text><text x="32" y="770" class="s" text-anchor="start">RTKs associate or rearrange; insulin receptors are already paired before ligand binds.</text><text x="32" y="796" class="s" text-anchor="start">Ras is a small GTPase. It is not the heterotrimeric Gαβγ protein used by GPCRs.</text></svg>