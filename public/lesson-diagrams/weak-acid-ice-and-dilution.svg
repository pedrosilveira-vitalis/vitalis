<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-labelledby="t d"><title id="t">One procedure, one check, one counterintuitive fact</title><desc id="d">On the left, the procedure as a flow. Step one, identify the species that reacts with water and decide whether it donates a proton, making it an acid, or accepts one, making it a base, remembering that a salt&#x27;s spectator ion does nothing and that the hydrolysing ion starts at the salt&#x27;s full molarity. Step two, get the right constant: if the problem hands you the constant for the conjugate partner, convert with Ka times Kb equals Kw. Step three, build the ICE table, with the initial concentration of the reacting species, a change of minus x for it and plus x for each product, and equilibrium values of C naught minus x and x and x. Step four, try the approximation x equals the square root of K times C naught. Step five, check the five per cent rule by dividing x by C naught: if it is under five per cent the approximation stands, and if it is over you must solve the quadratic, which happens when K is large or the solution is dilute. Step six, convert: for an acid, pH is minus the log of x; for a base, pOH is minus the log of x and pH is fourteen minus pOH. A box gives the shortcut that follows from the approximation: pH is one half of the quantity pKa minus log C naught, and for a base pOH is one half of pKb minus log C naught, valid exactly when the five per cent rule holds. On the right, a plot of percent dissociation against concentration for acetic acid, on a logarithmic concentration axis running from ten to the minus five molar up to one molar, computed exactly rather than by the approximation. The curve rises steeply as the solution is diluted: around nought point four per cent at one molar, one point three per cent at nought point one molar, four point two per cent at ten millimolar, twelve point five per cent at one millimolar, and above thirty per cent below a hundred micromolar. A dashed line marks the five per cent threshold, which acetic acid crosses at roughly seven millimolar; to the right of that crossing the square-root shortcut is safe, and to the left of it the quadratic is required. A note explains why: dilution shifts an equilibrium toward the side with more dissolved particles, and one HA becomes two ions, so the fraction that dissociates rises even though the hydronium concentration itself falls.</desc><defs><marker id="m7755" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1120" height="780" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">One procedure, one check, one counterintuitive fact</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Every weak-acid, weak-base and salt-hydrolysis problem is the same ICE table. The only decision is whether you may skip the quadratic.</text><rect x="24" y="104" width="500" height="76" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="46.0" y="130.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:15px">1</text><text x="72.0" y="130.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">Which species reacts with water?</text><text x="274.0" y="150.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">Donates H⁺ → acid. Accepts H⁺ → base. A salt&#x27;s spectator ion does</text><text x="274.0" y="163.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">nothing; the hydrolysing ion starts at the salt&#x27;s full molarity.</text><line x1="274" y1="180" x2="274" y2="192" stroke="#6d716f" stroke-width="2.5" marker-end="url(#m7755)"/><rect x="24" y="190" width="500" height="76" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="46.0" y="216.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:15px">2</text><text x="72.0" y="216.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">Get the right constant</text><text x="274.0" y="236.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">Given the partner&#x27;s constant? Convert: Kₐ × Kᵇ = Kᵥᵥ = 1.0 × 10⁻¹⁴.</text><line x1="274" y1="266" x2="274" y2="278" stroke="#6d716f" stroke-width="2.5" marker-end="url(#m7755)"/><rect x="24" y="276" width="500" height="76" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="46.0" y="302.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:15px">3</text><text x="72.0" y="302.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">Build the ICE table</text><text x="274.0" y="322.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">I: C₀, 0, 0 · C: −x, +x, +x · E: C₀ − x, x, x</text><line x1="274" y1="352" x2="274" y2="364" stroke="#6d716f" stroke-width="2.5" marker-end="url(#m7755)"/><rect x="24" y="362" width="500" height="76" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="46.0" y="388.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:15px">4</text><text x="72.0" y="388.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">Try the approximation</text><text x="274.0" y="408.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">x ≈ √(K × C₀)</text><line x1="274" y1="438" x2="274" y2="450" stroke="#6d716f" stroke-width="2.5" marker-end="url(#m7755)"/><rect x="24" y="448" width="500" height="76" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="46.0" y="474.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:700;font-size:15px">5</text><text x="72.0" y="474.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">Check the 5% rule</text><text x="274.0" y="494.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">x / C₀ &lt; 5%? Keep it. Over 5%? Solve the quadratic — which happens</text><text x="274.0" y="507.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">when K is large or the solution is dilute.</text><line x1="274" y1="524" x2="274" y2="536" stroke="#6d716f" stroke-width="2.5" marker-end="url(#m7755)"/><rect x="24" y="534" width="500" height="76" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="46.0" y="560.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:15px">6</text><text x="72.0" y="560.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">Convert</text><text x="274.0" y="580.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">Acid: pH = −log x. Base: pOH = −log x, then pH = 14 − pOH.</text><rect x="24" y="624" width="500" height="118" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="274.0" y="654.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">The shortcut that falls out of step 4</text><text x="274.0" y="675.0" class="" text-anchor="middle" style="font-size:12px">pH ≈ ½(pKₐ − log C₀) for a weak acid, and pOH ≈ ½(pKᵇ − log C₀)</text><text x="274.0" y="692.0" class="" text-anchor="middle" style="font-size:12px">for a weak base. Valid exactly when the 5% rule holds — which is</text><text x="274.0" y="709.0" class="" text-anchor="middle" style="font-size:12px">why step 5 is not optional. Acetic acid at 0.10 M: ½(4.74 + 1) =</text><text x="274.0" y="726.0" class="" text-anchor="middle" style="font-size:12px">2.87.</text><line x1="640" y1="550" x2="1060" y2="550" stroke="#18364a" stroke-width="2"/><line x1="640" y1="150" x2="640" y2="550" stroke="#18364a" stroke-width="2"/><text x="850.0" y="594.0" class="" text-anchor="middle" style="font-size:17px">log₁₀ [acetic acid]  (M)</text><text x="596" y="350.0" text-anchor="middle" transform="rotate(-90 596 350.0)" style="font-size:17px">% dissociated</text><line x1="640.0" y1="550.0" x2="640.0" y2="556.0" stroke="#18364a" stroke-width="2"/><text x="640.0" y="572.0" class="" text-anchor="middle" style="font-size:14px">-5</text><line x1="724.0" y1="550.0" x2="724.0" y2="556.0" stroke="#18364a" stroke-width="2"/><text x="724.0" y="572.0" class="" text-anchor="middle" style="font-size:14px">-4</text><line x1="808.0" y1="550.0" x2="808.0" y2="556.0" stroke="#18364a" stroke-width="2"/><text x="808.0" y="572.0" class="" text-anchor="middle" style="font-size:14px">-3</text><line x1="892.0" y1="550.0" x2="892.0" y2="556.0" stroke="#18364a" stroke-width="2"/><text x="892.0" y="572.0" class="" text-anchor="middle" style="font-size:14px">-2</text><line x1="976.0" y1="550.0" x2="976.0" y2="556.0" stroke="#18364a" stroke-width="2"/><text x="976.0" y="572.0" class="" text-anchor="middle" style="font-size:14px">-1</text><line x1="1060.0" y1="550.0" x2="1060.0" y2="556.0" stroke="#18364a" stroke-width="2"/><text x="1060.0" y="572.0" class="" text-anchor="middle" style="font-size:14px">0</text><line x1="634.0" y1="550.0" x2="640.0" y2="550.0" stroke="#18364a" stroke-width="2"/><text x="630.0" y="555.0" class="" text-anchor="end" style="font-size:14px">0</text><line x1="634.0" y1="470.0" x2="640.0" y2="470.0" stroke="#18364a" stroke-width="2"/><text x="630.0" y="475.0" class="" text-anchor="end" style="font-size:14px">20</text><line x1="634.0" y1="390.0" x2="640.0" y2="390.0" stroke="#18364a" stroke-width="2"/><text x="630.0" y="395.0" class="" text-anchor="end" style="font-size:14px">40</text><line x1="634.0" y1="310.0" x2="640.0" y2="310.0" stroke="#18364a" stroke-width="2"/><text x="630.0" y="315.0" class="" text-anchor="end" style="font-size:14px">60</text><line x1="634.0" y1="230.0" x2="640.0" y2="230.0" stroke="#18364a" stroke-width="2"/><text x="630.0" y="235.0" class="" text-anchor="end" style="font-size:14px">80</text><line x1="634.0" y1="150.0" x2="640.0" y2="150.0" stroke="#18364a" stroke-width="2"/><text x="630.0" y="155.0" class="" text-anchor="end" style="font-size:14px">100</text><path d="M640.0 263.8 L644.2 271.2 L648.4 278.7 L652.6 286.4 L656.8 294.1 L661.0 302.0 L665.2 309.8 L669.4 317.7 L673.6 325.6 L677.8 333.5 L682.0 341.3 L686.2 349.0 L690.4 356.7 L694.6 364.2 L698.8 371.6 L703.0 378.8 L707.2 385.9 L711.4 392.8 L715.6 399.6 L719.8 406.1 L724.0 412.5 L728.2 418.7 L732.4 424.7 L736.6 430.4 L740.8 436.0 L745.0 441.4 L749.2 446.6 L753.4 451.5 L757.6 456.3 L761.8 460.9 L766.0 465.3 L770.2 469.5 L774.4 473.5 L778.6 477.4 L782.8 481.0 L787.0 484.6 L791.2 487.9 L795.4 491.1 L799.6 494.1 L803.8 497.1 L808.0 499.8 L812.2 502.4 L816.4 504.9 L820.6 507.3 L824.8 509.6 L829.0 511.7 L833.2 513.8 L837.4 515.7 L841.6 517.5 L845.8 519.3 L850.0 520.9 L854.2 522.5 L858.4 524.0 L862.6 525.4 L866.8 526.7 L871.0 528.0 L875.2 529.2 L879.4 530.3 L883.6 531.4 L887.8 532.4 L892.0 533.4 L896.2 534.3 L900.4 535.2 L904.6 536.0 L908.8 536.7 L913.0 537.5 L917.2 538.2 L921.4 538.8 L925.6 539.4 L929.8 540.0 L934.0 540.6 L938.2 541.1 L942.4 541.6 L946.6 542.1 L950.8 542.5 L955.0 542.9 L959.2 543.3 L963.4 543.7 L967.6 544.0 L971.8 544.4 L976.0 544.7 L980.2 545.0 L984.4 545.2 L988.6 545.5 L992.8 545.8 L997.0 546.0 L1001.2 546.2 L1005.4 546.4 L1009.6 546.6 L1013.8 546.8 L1018.0 547.0 L1022.2 547.2 L1026.4 547.3 L1030.6 547.5 L1034.8 547.6 L1039.0 547.7 L1043.2 547.9 L1047.4 548.0 L1051.6 548.1 L1055.8 548.2 L1060.0 548.3" stroke="#a8324a" stroke-width="3" fill="none"/><path d="M640.0 530.0 L1060.0 530.0" stroke="#6d716f" stroke-width="1.5" fill="none" stroke-dasharray="8 6"/><circle cx="878.35" cy="530.0" r="5" fill="#18364a" stroke="#18364a" stroke-width="1"/><text x="888.4" y="516.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12px">5% threshold ≈ 7 mM</text><text x="910.0" y="280.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11.5px">right of the dashed line,</text><text x="910.0" y="295.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11.5px">the √ shortcut is safe;</text><text x="910.0" y="310.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11.5px">left of it, solve the</text><text x="910.0" y="325.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11.5px">quadratic</text><rect x="640" y="624" width="456" height="132" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="868.0" y="654.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">Why dilution raises the percentage</text><text x="868.0" y="675.0" class="" text-anchor="middle" style="font-size:12px">Dilution shifts an equilibrium toward whichever side has</text><text x="868.0" y="692.0" class="" text-anchor="middle" style="font-size:12px">more dissolved particles, and one HA becomes two ions. So</text><text x="868.0" y="709.0" class="" text-anchor="middle" style="font-size:12px">the *fraction* dissociated rises on dilution — even though</text><text x="868.0" y="726.0" class="" text-anchor="middle" style="font-size:12px">[H₃O⁺] itself falls and the solution gets less acidic. % ≈</text><text x="868.0" y="743.0" class="" text-anchor="middle" style="font-size:12px">√(Kₐ / C₀) × 100.</text></svg>