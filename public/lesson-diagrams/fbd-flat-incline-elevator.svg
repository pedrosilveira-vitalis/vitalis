<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600" viewBox="0 0 920 600" role="img" aria-labelledby="t d"><title id="t">Free-body diagrams: flat surface, incline, elevator</title><desc id="d">Three free-body diagrams side by side. Flat surface: weight down, normal force up, applied force sideways, giving N = mg and a = F/m. Incline with tilted axes: the normal force is mg cosine theta, the component along the slope is mg sine theta, and the block slides when tangent theta exceeds the coefficient of static friction. Elevator: the scale reads the normal force, which is m times g plus a when accelerating upward, mg at rest or constant velocity, and zero in free fall. A footer shows two genuine third-law pairs and warns that the weight and normal force on a resting book are not a third-law pair.</desc><defs><marker id="m2642" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker><marker id="m4257" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker><marker id="m440" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#987740"/></marker><marker id="m5223" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b7a64"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="600" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Free-body diagrams: flat surface, incline, elevator</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Draw only the forces acting ON the object, then apply ΣF = ma in each direction</text><rect x="40" y="112" width="282" height="320" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="181.0" y="142.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">Flat surface</text><line x1="72" y1="320" x2="290" y2="320" stroke="#6d716f" stroke-width="2"/><rect x="146" y="264" width="72" height="56" rx="6" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="182.0" y="298.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">m</text><line x1="182" y1="264" x2="182" y2="180" stroke="#245574" stroke-width="2.5" marker-end="url(#m4257)"/><text x="192.0" y="202.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:16px">N</text><line x1="182" y1="320" x2="182" y2="378" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m2642)"/><text x="192.0" y="360.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:15px">W = mg</text><line x1="218" y1="292" x2="294" y2="292" stroke="#5b7a64" stroke-width="2.5" marker-end="url(#m5223)"/><text x="256.0" y="282.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">F</text><text x="181.0" y="400.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">ΣF_y = 0  ⇒  N = mg</text><text x="181.0" y="424.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">ΣF_x = F  ⇒  a = F / m</text><rect x="338" y="112" width="282" height="320" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="479.0" y="142.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">Incline: tilt the axes</text><path d="M362 372 L596 372 L596 252 Z" stroke="#6d716f" stroke-width="2" fill="#efede8"/><path d="M517.3 267.6 L467.4 293.2 L477.5 312.8 L527.3 287.2 Z" stroke="#18364a" stroke-width="2" fill="#e8ecef"/><line x1="497.38051687644094" y1="290.2120079090599" x2="469.08888472547187" y2="235.04332521467018" stroke="#245574" stroke-width="2.5" marker-end="url(#m4257)"/><text x="459.6" y="224.4" class="" text-anchor="end" style="fill:#245574;font-weight:bold;font-size:16px">N</text><line x1="497.38051687644094" y1="290.2120079090599" x2="497.38051687644094" y2="362.2120079090599" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m2642)"/><text x="505.4" y="356.2" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:15px">mg</text><line x1="497.38051687644094" y1="290.2120079090599" x2="447.5507389589277" y2="315.7657401744513" stroke="#987740" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#m440)"/><text x="394.9" y="347.5" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">mg sin θ</text><text x="404.0" y="364.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:17px">θ</text><text x="479.0" y="400.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">⊥ to slope:  N = mg cos θ</text><text x="479.0" y="422.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">slides only when tan θ &gt; μₛ</text><rect x="636" y="112" width="244" height="320" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="758.0" y="142.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:17px">Elevator: apparent weight</text><rect x="722" y="228" width="72" height="62" rx="6" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="758.0" y="264.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">m</text><line x1="758" y1="228" x2="758" y2="172" stroke="#245574" stroke-width="2.5" marker-end="url(#m4257)"/><text x="768.0" y="196.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:16px">N</text><line x1="758" y1="290" x2="758" y2="346" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m2642)"/><text x="768.0" y="328.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:15px">W = mg</text><line x1="700" y1="350" x2="816" y2="350" stroke="#6d716f" stroke-width="2"/><text x="758.0" y="378.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">accelerating up:  N = m(g + a)</text><text x="758.0" y="400.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">at rest or constant v:  N = mg</text><text x="758.0" y="422.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">free fall:  N = 0</text><rect x="40" y="452" width="840" height="124" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="460.0" y="480.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">A third-law pair acts on two different objects and is the same kind of force</text><rect x="60" y="494" width="390" height="42" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="255.0" y="520.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">Earth pulls book down  ↔  book pulls Earth up</text><rect x="470" y="494" width="390" height="42" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="665.0" y="520.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">table pushes book up  ↔  book pushes table down</text><text x="460.0" y="560.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:14px">W and N on a resting book are NOT a pair: same object, different kinds of force</text></svg>