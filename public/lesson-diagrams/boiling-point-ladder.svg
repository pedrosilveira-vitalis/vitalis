<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img" aria-labelledby="t d"><title id="t">Boiling point at matched molecular weight (all MW 58-60)</title><desc id="d">A horizontal bar chart of normal boiling points for nine compounds of molecular weight 58 to 60, from acetamide at 221 degrees Celsius down to butane at minus 0.5. A right-hand column states, for each, whether the molecule can donate and accept hydrogen bonds, only accept them, or neither.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="900" height="720" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Boiling point at matched molecular weight (all MW 58-60)</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Hold molecular weight fixed and the order falls out of hydrogen bonding, not of polarity alone.</text><line x1="282.6666666666667" y1="96" x2="282.6666666666667" y2="486" stroke="#6d716f" stroke-width="1" stroke-dasharray="6 5"/><text x="282.7" y="90.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">0 °C</text><text x="258.0" y="129.0" class="" text-anchor="end" style="fill:#18364a;font-size:16px">Acetamide (amide)</text><rect x="282.6666666666667" y="108" width="324.13333333333327" height="32" rx="5" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="616.8" y="129.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:15px">221°C</text><text x="700.0" y="129.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">donates + accepts (2 N-H)</text><text x="258.0" y="173.0" class="" text-anchor="end" style="fill:#18364a;font-size:16px">Acetic acid (carb. acid)</text><rect x="282.6666666666667" y="152" width="173.06666666666666" height="32" rx="5" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="465.7" y="173.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:15px">118°C</text><text x="700.0" y="173.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">donates + accepts, dimerises</text><text x="258.0" y="217.0" class="" text-anchor="end" style="fill:#18364a;font-size:16px">1-Propanol (alcohol)</text><rect x="282.6666666666667" y="196" width="142.26666666666665" height="32" rx="5" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="434.9" y="217.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:15px">97°C</text><text x="700.0" y="217.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">donates + accepts (O-H)</text><text x="258.0" y="261.0" class="" text-anchor="end" style="fill:#18364a;font-size:16px">Acetone (ketone)</text><rect x="282.6666666666667" y="240" width="82.13333333333333" height="32" rx="5" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="374.8" y="261.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:15px">56°C</text><text x="700.0" y="261.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">accepts only</text><text x="258.0" y="305.0" class="" text-anchor="end" style="fill:#18364a;font-size:16px">Propanal (aldehyde)</text><rect x="282.6666666666667" y="284" width="70.39999999999998" height="32" rx="5" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="363.1" y="305.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:15px">48°C</text><text x="700.0" y="305.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">accepts only</text><text x="258.0" y="349.0" class="" text-anchor="end" style="fill:#18364a;font-size:16px">Propylamine (1° amine)</text><rect x="282.6666666666667" y="328" width="70.39999999999998" height="32" rx="5" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="363.1" y="349.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:15px">48°C</text><text x="700.0" y="349.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">donates + accepts (weak N-H)</text><text x="258.0" y="393.0" class="" text-anchor="end" style="fill:#18364a;font-size:16px">Methyl formate (ester)</text><rect x="282.6666666666667" y="372" width="46.93333333333334" height="32" rx="5" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="339.6" y="393.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:15px">32°C</text><text x="700.0" y="393.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">accepts only</text><text x="258.0" y="437.0" class="" text-anchor="end" style="fill:#18364a;font-size:16px">Methoxyethane (ether)</text><rect x="282.6666666666667" y="416" width="10.853333333333296" height="32" rx="5" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="303.5" y="437.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:15px">7.4°C</text><text x="700.0" y="437.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">accepts only</text><text x="258.0" y="481.0" class="" text-anchor="end" style="fill:#18364a;font-size:16px">Butane (alkane)</text><rect x="281.93333333333334" y="460" width="3" height="32" rx="5" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="291.9" y="481.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:bold;font-size:15px">-0.5°C</text><text x="700.0" y="481.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">neither</text><text x="700.0" y="92.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:14px">hydrogen bonding</text><rect x="60" y="536" width="780" height="76" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="450.0" y="560.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:18px">Order at matched molecular weight</text><text x="450.0" y="586.0" class="" text-anchor="middle" style="fill:#18364a;font-size:16px">amide &gt; carboxylic acid &gt; alcohol &gt; aldehyde/ketone ≈ 1°/2° amine &gt; ester &gt; ether ≈ alkane</text><text x="450.0" y="604.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Two N-H donors plus a strongly polarised C=O put amides at the top, above the acid dimer.</text><line x1="60" y1="640" x2="96" y2="640" stroke="#a8324a" stroke-width="3"/><text x="106.0" y="645.0" class="" text-anchor="start" style="font-size:15px">Red: donates and accepts hydrogen bonds</text><line x1="60" y1="666" x2="96" y2="666" stroke="#245574" stroke-width="3"/><text x="106.0" y="671.0" class="" text-anchor="start" style="font-size:15px">Blue: accepts only</text><line x1="60" y1="692" x2="96" y2="692" stroke="#6d716f" stroke-width="3"/><text x="106.0" y="697.0" class="" text-anchor="start" style="font-size:15px">Grey: neither</text></svg>