<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="t d"><title id="t">Reading an IR spectrum: five places to look, in order</title><desc id="d">An infrared wavenumber axis from 4000 down to 400 inverse centimetres, divided into labelled bands: O-H and N-H stretches from 3200 to 3600, the carboxylic acid O-H smear from 2500 to 3300, C-H stretches around 3000 with sp3 below and sp2 above, the triple-bond window from 2100 to 2260 for alkynes and nitriles, the carbonyl window from 1650 to 1850, and the fingerprint region below 1500. A second strip orders the carbonyl types inside that window, from acid chloride highest to amide lowest.</desc><defs><marker id="m2288" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="900" height="640" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Reading an IR spectrum: five places to look, in order</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Wavenumber runs high to low, left to right, the way a spectrum is printed. Everything below 1500 is the fingerprint region.</text><line x1="70" y1="300" x2="846" y2="300" stroke="#18364a" stroke-width="2.5"/><line x1="70.0" y1="294" x2="70.0" y2="306" stroke="#18364a" stroke-width="1.5"/><text x="70.0" y="324.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">4000</text><line x1="177.77777777777777" y1="294" x2="177.77777777777777" y2="306" stroke="#18364a" stroke-width="1.5"/><text x="177.8" y="324.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">3500</text><line x1="285.55555555555554" y1="294" x2="285.55555555555554" y2="306" stroke="#18364a" stroke-width="1.5"/><text x="285.6" y="324.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">3000</text><line x1="393.3333333333333" y1="294" x2="393.3333333333333" y2="306" stroke="#18364a" stroke-width="1.5"/><text x="393.3" y="324.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">2500</text><line x1="501.1111111111111" y1="294" x2="501.1111111111111" y2="306" stroke="#18364a" stroke-width="1.5"/><text x="501.1" y="324.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">2000</text><line x1="608.8888888888889" y1="294" x2="608.8888888888889" y2="306" stroke="#18364a" stroke-width="1.5"/><text x="608.9" y="324.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">1500</text><line x1="716.6666666666666" y1="294" x2="716.6666666666666" y2="306" stroke="#18364a" stroke-width="1.5"/><text x="716.7" y="324.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">1000</text><line x1="846.0" y1="294" x2="846.0" y2="306" stroke="#18364a" stroke-width="1.5"/><text x="846.0" y="324.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">400</text><rect x="156.22222222222223" y="254" width="86.22222222222223" height="40" rx="6" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="199.3" y="275.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">O–H  /  N–H</text><text x="199.3" y="244.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">alcohol broad; amine sharper</text><rect x="220.88888888888889" y="158" width="172.44444444444443" height="40" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="307.1" y="179.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">COOH O–H</text><text x="307.1" y="148.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">very broad, smeared across C–H</text><rect x="264.0" y="354" width="53.888888888888914" height="40" rx="6" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="290.9" y="375.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">C–H</text><text x="290.9" y="410.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">sp³ below 3000, sp² above</text><rect x="445.06666666666666" y="254" width="34.48888888888888" height="40" rx="6" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="462.3" y="275.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">C≡C  /  C≡N</text><text x="462.3" y="244.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">sharp; nitrile stronger</text><rect x="533.4444444444445" y="354" width="43.111111111111086" height="40" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="555.0" y="375.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">C=O</text><text x="555.0" y="410.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">the single most useful band</text><rect x="608.8888888888889" y="354" width="237.1111111111111" height="40" rx="6" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="727.4" y="375.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:15px">fingerprint</text><text x="727.4" y="410.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">C–O at 1000–1300; aromatic C=C</text><text x="727.4" y="425.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">1450–1600</text><rect x="60" y="436" width="780" height="186" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="450.0" y="464.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">Inside the carbonyl window: the more the substituent donates, the lower the band</text><text x="112.0" y="506.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">acid chloride</text><text x="112.0" y="528.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">1800–1850</text><text x="222.0" y="506.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">anhydride</text><text x="222.0" y="528.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">1800–1850 + 1750</text><text x="332.0" y="506.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">ester</text><text x="332.0" y="528.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">1735–1750</text><text x="442.0" y="506.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">aldehyde</text><text x="442.0" y="528.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">1720–1740</text><text x="552.0" y="506.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">ketone</text><text x="552.0" y="528.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">1705–1725</text><text x="662.0" y="506.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">carboxylic acid</text><text x="662.0" y="528.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">1700–1725</text><text x="772.0" y="506.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">amide</text><text x="772.0" y="528.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">1630–1690</text><line x1="100" y1="548" x2="806" y2="548" stroke="#18364a" stroke-width="2" marker-end="url(#m2288)"/><text x="450.0" y="572.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Conjugation lowers the band another 20–40 cm⁻¹; a strained ring raises it.</text><text x="450.0" y="598.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">Mass spec partners: m/z 77 phenyl · 91 tropylium · 105 benzoyl · 43 acetyl · M:M+2 of 3:1 means Cl, 1:1 means Br</text></svg>