<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">Protein stability: signs, treatments and CCT</title><desc id="desc">Negative folding enthalpy and positive folding entropy both favor folding. Detergent unfolding differs from disulfide reduction. CCT has two eight-subunit rings, sixteen subunits total.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#aa3653;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">Keep the thermodynamic signs straight</text><rect x="24" y="60" width="752" height="215" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="94" class="h" text-anchor="start">1  ΔGfold = ΔHfold − TΔSfold</text><text x="50" y="134" class="t" text-anchor="start">Negative ΔH → favorable contribution</text><text x="50" y="167" class="t" text-anchor="start">Positive ΔS → favorable contribution (T is in kelvin)</text><text x="50" y="200" class="t" text-anchor="start">Those two signs reinforce each other; they do not cancel.</text><text x="50" y="238" class="s" text-anchor="start">Chain entropy, solvent entropy and enthalpy must all be considered.</text><text x="50" y="260" class="s" text-anchor="start">Their net values depend on temperature, protein and environment.</text><rect x="24" y="291" width="752" height="199" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="325" class="h" text-anchor="start">2  Unfolding and reduction are different</text><text x="50" y="365" class="t" text-anchor="start">SDS / suitable heat → loss of native fold</text><text x="50" y="398" class="t" text-anchor="start">DTT / β-mercaptoethanol → S–S reduced to two thiols</text><text x="50" y="431" class="t" text-anchor="start">Peptide backbone: generally retained in standard denaturation</text><text x="50" y="468" class="s" text-anchor="start">Neither SDS alone nor ordinary heating is a disulfide-reducing reagent.</text><rect x="24" y="506" width="752" height="210" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="540" class="h" text-anchor="start">3  CCT / TRiC: 2 rings × 8 subunits = 16</text><circle cx="210.0" cy="610.0" r="14" fill="#a8324a"/><circle cx="195.35533905932738" cy="638.2842712474619" r="14" fill="#24495c"/><circle cx="160.0" cy="650.0" r="14" fill="#bc9450"/><circle cx="124.64466094067262" cy="638.2842712474619" r="14" fill="#518568"/><circle cx="110.0" cy="610.0" r="14" fill="#a26c9c"/><circle cx="124.64466094067262" cy="581.7157287525381" r="14" fill="#558f9b"/><circle cx="160.0" cy="570.0" r="14" fill="#bd7451"/><circle cx="195.35533905932738" cy="581.7157287525381" r="14" fill="#6b6e9b"/><circle cx="450.0" cy="610.0" r="14" fill="#a8324a"/><circle cx="435.3553390593274" cy="638.2842712474619" r="14" fill="#24495c"/><circle cx="400.0" cy="650.0" r="14" fill="#bc9450"/><circle cx="364.6446609406726" cy="638.2842712474619" r="14" fill="#518568"/><circle cx="350.0" cy="610.0" r="14" fill="#a26c9c"/><circle cx="364.6446609406726" cy="581.7157287525381" r="14" fill="#558f9b"/><circle cx="400.0" cy="570.0" r="14" fill="#bd7451"/><circle cx="435.3553390593274" cy="581.7157287525381" r="14" fill="#6b6e9b"/><text x="280" y="617" class="h" text-anchor="middle">+</text><text x="538" y="600" class="t" text-anchor="start">Eight distinct types</text><text x="538" y="627" class="t" text-anchor="start">in each ring</text><text x="50" y="690" class="s" text-anchor="start">Rings shown apart for counting; in the complex they stack back-to-back.</text></svg>