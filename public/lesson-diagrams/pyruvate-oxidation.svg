<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">Pyruvate dehydrogenase carbon and redox map</title><desc id="desc">Pyruvate has three carbons. E1 releases its carboxyl carbon as carbon dioxide, while the other two become the acetyl group on CoA. A second map shows reducing equivalents traveling from the lipoyl arm through E3 disulfide and FAD to NAD. PDK phosphorylation inhibits E1 and PDP dephosphorylation reactivates it.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#245574;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">PDC: follow carbon and electrons separately</text><rect x="24" y="60" width="752" height="182" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="94" class="h" text-anchor="start">1  Carbon bookkeeping per pyruvate</text><rect x="55" y="125" width="190" height="40" rx="9" fill="#e4eef1"/><text x="150.0" y="151" class="t" text-anchor="middle">Pyruvate (3C)</text><path d="M257 145 L435 145" class="bond" /><path d="M427 140 L435 145 L427 150" class="bond"/><rect x="450" y="125" width="290" height="40" rx="9" fill="#e4eef1"/><text x="595.0" y="151" class="t" text-anchor="middle">Acetyl group on CoA (2C)</text><text x="340" y="134" class="s" text-anchor="middle">E1 + E2</text><text x="340" y="192" class="t" text-anchor="middle">+ CO₂ (1C)</text><text x="55" y="222" class="s" text-anchor="start">CoA itself contains additional carbons; count only the pyruvate-derived group.</text><rect x="24" y="258" width="752" height="225" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="292" class="h" text-anchor="start">2  Five cofactors, three catalytic components</text><text x="55" y="324" class="t" text-anchor="start">E1 + TPP</text><text x="400" y="324" class="t" text-anchor="start">→</text><text x="445" y="324" class="s" text-anchor="start">Decarboxylate pyruvate</text><text x="55" y="371" class="t" text-anchor="start">E2 + lipoyl arm + CoA</text><text x="400" y="371" class="t" text-anchor="start">→</text><text x="445" y="371" class="s" text-anchor="start">Transfer the acetyl group</text><text x="55" y="418" class="t" text-anchor="start">E3 + FAD + NAD⁺</text><text x="400" y="418" class="t" text-anchor="start">→</text><text x="445" y="418" class="s" text-anchor="start">Reoxidize the lipoyl arm</text><text x="55" y="460" class="s" text-anchor="start">Electron relay: reduced lipoyl arm → E3 disulfide → FAD → NAD⁺</text><rect x="24" y="499" width="752" height="217" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="533" class="h" text-anchor="start">3  Do not reverse the regulatory sign</text><rect x="65" y="562" width="205" height="40" rx="9" fill="#e4eef1"/><text x="167.5" y="588" class="t" text-anchor="middle">E1, less phosphorylated</text><rect x="510" y="562" width="220" height="40" rx="9" fill="#f4dce0"/><text x="620.0" y="588" class="t" text-anchor="middle">E1, phosphorylated</text><path d="M280 582 L499 582" class="bond" /><path d="M491 577 L499 582 L491 587" class="bond"/><text x="390" y="569" class="s" text-anchor="middle">PDK + ATP</text><path d="M499 626 L280 626" class="bond" /><path d="M288 621 L280 626 L288 631" class="bond"/><text x="390" y="652" class="s" text-anchor="middle">PDP removes phosphate</text><text x="160" y="686" class="t" text-anchor="middle">More active</text><text x="620" y="686" class="t" text-anchor="middle">Less active</text></svg>