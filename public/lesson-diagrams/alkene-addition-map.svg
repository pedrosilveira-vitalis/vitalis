<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="t d"><title id="t">Every alkene addition is one regiochemistry plus one stereochemistry</title><desc id="d">A three by three grid. Columns are Markovnikov, anti-Markovnikov, and no regiochemistry because both carbons receive the same group. Rows are syn addition, anti addition, and no stereochemical control. Oxymercuration-demercuration, HX addition and acid-catalysed hydration sit in the Markovnikov column with no stereochemical control; halohydrin formation is Markovnikov and anti; hydroboration-oxidation is the only anti-Markovnikov entry and is syn; halogenation with X2 is anti and catalytic hydrogenation is syn, both with no regiochemistry.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="900" height="600" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Every alkene addition is one regiochemistry plus one stereochemistry</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Place a reaction on both axes and the product follows. Blank cells are combinations no common reagent gives.</text><text x="290.0" y="104.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">Markovnikov</text><text x="290.0" y="122.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">group adds to the</text><text x="290.0" y="136.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">more substituted C</text><text x="520.0" y="104.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">anti-Markovnikov</text><text x="520.0" y="122.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">group adds to the</text><text x="520.0" y="136.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">less substituted C</text><text x="750.0" y="104.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">no regiochemistry</text><text x="750.0" y="122.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">both carbons get</text><text x="750.0" y="136.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">the same group</text><text x="168.0" y="202.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:16px">syn</text><text x="168.0" y="220.0" class="" text-anchor="end" style="fill:#6d716f;font-size:12px">both groups, same face</text><text x="168.0" y="318.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:16px">anti</text><text x="168.0" y="336.0" class="" text-anchor="end" style="fill:#6d716f;font-size:12px">groups, opposite faces</text><text x="168.0" y="434.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:16px">no control</text><text x="168.0" y="452.0" class="" text-anchor="end" style="fill:#6d716f;font-size:12px">planar cation, either face</text><rect x="414.0" y="168" width="212" height="96" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="520.0" y="194.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">hydroboration–oxidation</text><text x="520.0" y="228.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">1. BH₃·THF  2. H₂O₂, NaOH</text><text x="520.0" y="245.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">no carbocation, no rearrangement</text><rect x="644.0" y="168" width="212" height="96" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="750.0" y="194.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">catalytic hydrogenation</text><text x="750.0" y="228.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">H₂, Pt / Pd / Ni</text><text x="750.0" y="245.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">both H from the catalyst face</text><rect x="184.0" y="284" width="212" height="96" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="290.0" y="310.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">halohydrin formation</text><text x="290.0" y="344.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">X₂ in H₂O</text><text x="290.0" y="361.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">OH to the more substituted C</text><rect x="644.0" y="284" width="212" height="96" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="750.0" y="310.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">halogenation</text><text x="750.0" y="344.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">X₂ in CCl₄</text><text x="750.0" y="361.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">bromonium opened from behind</text><rect x="184.0" y="400" width="212" height="96" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="290.0" y="426.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">HX · H₂O/H⁺ ·</text><text x="290.0" y="445.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">oxymercuration</text><text x="290.0" y="460.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">planar cation (or bridged Hg)</text><text x="290.0" y="477.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">racemic; rearranges except with Hg</text><text x="520.0" y="332.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:22px">—</text><text x="520.0" y="448.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:22px">—</text><text x="290.0" y="216.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:22px">—</text><rect x="60" y="512" width="780" height="72" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="450.0" y="540.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">The one-line test</text><text x="450.0" y="562.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Does a free carbocation form?  Yes → Markovnikov, racemic, rearrangements possible.  No → read the bridged or concerted geometry.</text></svg>