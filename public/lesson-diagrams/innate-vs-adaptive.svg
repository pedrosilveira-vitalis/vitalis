<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Innate and adaptive immunity: speed, specificity, memory</title><desc id="d">Left: a schematic graph of response size against days after exposure. The innate response rises within hours and peaks in the first days. The primary adaptive response rises after several days and peaks around one to two weeks, mostly IgM first. A secondary response after re-exposure is faster, larger and mostly IgG. Right: innate players are barriers, neutrophils, macrophages, NK cells, dendritic cells and complement, recognizing shared patterns through PRRs such as TLRs. Adaptive players are B cells and CD4 and CD8 T cells with specific receptors. Dendritic cells link them by carrying antigen to lymph nodes and providing signal 1 and co-stimulation (signal 2).</desc><defs><marker id="m3863" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="620" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Innate and adaptive immunity: speed, specificity, memory</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Left: schematic timing of responses. Right: key players and how the two arms connect.</text><line x1="90" y1="480" x2="570" y2="480" stroke="#18364a" stroke-width="2"/><line x1="90" y1="120" x2="90" y2="480" stroke="#18364a" stroke-width="2"/><text x="330.0" y="524.0" class="" text-anchor="middle" style="font-size:17px">Days after exposure</text><text x="46" y="300.0" text-anchor="middle" transform="rotate(-90 46 300.0)" style="font-size:17px">Response size</text><line x1="90.0" y1="480.0" x2="90.0" y2="486.0" stroke="#18364a" stroke-width="2"/><text x="90