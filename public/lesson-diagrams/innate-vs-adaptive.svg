4 L477.0 412.1 L480.0 427.1 L483.0 439.5 L486.0 449.6 L489.0 457.6 L492.0 463.8 L495.0 468.5 L498.0 472.0 L501.0 474.5 L504.0 476.3 L507.0 477.6 L510.0 478.4 L513.0 479.0 L516.0 479.4 L519.0 479.6 L522.0 479.8 L525.0 479.9 L528.0 479.9 L531.0 480.0 L534.0 480.0 L537.0 480.0 L540.0 480.0 L543.0 480.0 L546.0 480.0 L549.0 480.0 L552.0 480.0 L555.0 480.0 L558.0 480.0 L561.0 480.0 L564.0 480.0 L567.0 480.0 L570.0 480.0" stroke="#a8324a" stroke-width="3" fill="none"/><line x1="378.0" y1="480.0" x2="378.0" y2="134.40000000000003" stroke="#6d716f" stroke-width="1.5" stroke-dasharray="6 5"/><text x="378.0" y="123.6" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">re-exposure</text><text x="129.6" y="346.8" class="" text-anchor="start" style="fill:#987740;font-weight:700;font-size:14px">innate (hours)</text><text x="222.0" y="278.4" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:14px">primary adaptive</text><text x="222.0" y="298.2" class="" text-anchor="middle" style="fill:#245574;font-size:13px">(days; IgM first)</text><text x="420.0" y="177.6" class="" text-anchor="end" style="fill:#a8324a;font-weight:700;font-size:14px">secondary: faster,</text><text x="420.0" y="199.2" class="" text-anchor="end" style="fill:#a8324a;font-size:13px">larger, mostly IgG</text><rect x="620" y="110" width="340" height="150" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="790.0" y="140.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:19px">Innate</text><text x="790.0" y="167.0" class="" text-anchor="middle" style="font-size:14px">Barriers, neutrophils, macrophages, NK cells,</text><text x="790.0" y="186.0" class="" text-anchor="middle" style="font-size:14px">complement, dendritic cells. Germline PRRs</text><text x="790.0" y="205.0" class="" text-anchor="middle" style="font-size:14px">(e.g., TLRs) detect shared PAMPs/DAMPs. No</text><text x="790.0" y="224.0" class="" text-anchor="middle" style="font-size:14px">antigen-specific memory.</text><rect x="620" y="300" width="340" height="130" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="790.0" y="330.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:19px">Adaptive</text><text x="790.0" y="357.0" class="" text-anchor="middle" style="font-size:14px">B cells (antibodies) and T cells (CD4 helpers,</text><text x="790.0" y="376.0" class="" text-anchor="middle" style="font-size:14px">CD8 killers). V(D)J-generated receptors,</text><text x="790.0" y="395.0" class="" text-anchor="middle" style="font-size:14px">clonal selection, memory.</text><line x1="790" y1="262" x2="790" y2="298" stroke="#18364a" stroke-width="3" marker-end="url(#m3863)"/><rect x="620" y="460" width="340" height="110" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="790.0" y="490.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:16px">Bridge: dendritic cells</text><text x="790.0" y="514.0" class="" text-anchor="middle" style="font-size:14px">carry antigen to lymph nodes; signal 1</text><text x="790.0" y="533.0" class="" text-anchor="middle" style="font-size:14px">(peptide–MHC) + signal 2 (B7→CD28)</text><text x="330.0" y="600.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Curve shapes are schematic, for comparing timing only.</text></svg>