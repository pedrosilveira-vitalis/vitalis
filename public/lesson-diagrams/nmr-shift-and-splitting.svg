<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="t d"><title id="t">The ¹H scale, and the three patterns worth recognising on sight</title><desc id="d">A proton chemical-shift scale from 12 to 0 ppm, printed the way a spectrum is, with the zones marked: carboxylic acid at 10 to 12, aldehyde at 9 to 10, aromatic at 6.5 to 8.5, vinyl at 4.5 to 6.5, carbon bonded to oxygen or halogen at 3 to 4, allylic benzylic and alpha-to-carbonyl at 2 to 3, and plain alkyl from 0.5 to 2, with TMS at zero. Below, a panel gives the n plus one rule with Pascal intensities, and another shows the three signature patterns: the ethyl triplet and quartet, the isopropyl doublet and septet, and the tert-butyl nine-proton singlet.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="900" height="650" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">The ¹H scale, and the three patterns worth recognising on sight</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Chemical shift tells you the environment, integration counts the protons, splitting counts the neighbours.</text><line x1="72" y1="250" x2="846" y2="250" stroke="#18364a" stroke-width="2.5"/><line x1="846.0" y1="244" x2="846.0" y2="256" stroke="#18364a" stroke-width="1.2"/><text x="846.0" y="274.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">0</text><line x1="781.5" y1="244" x2="781.5" y2="256" stroke="#18364a" stroke-width="1.2"/><line x1="717.0" y1="244" x2="717.0" y2="256" stroke="#18364a" stroke-width="1.2"/><text x="717.0" y="274.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">2</text><line x1="652.5" y1="244" x2="652.5" y2="256" stroke="#18364a" stroke-width="1.2"/><line x1="588.0" y1="244" x2="588.0" y2="256" stroke="#18364a" stroke-width="1.2"/><text x="588.0" y="274.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">4</text><line x1="523.5" y1="244" x2="523.5" y2="256" stroke="#18364a" stroke-width="1.2"/><line x1="459.0" y1="244" x2="459.0" y2="256" stroke="#18364a" stroke-width="1.2"/><text x="459.0" y="274.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">6</text><line x1="394.5" y1="244" x2="394.5" y2="256" stroke="#18364a" stroke-width="1.2"/><line x1="330.0" y1="244" x2="330.0" y2="256" stroke="#18364a" stroke-width="1.2"/><text x="330.0" y="274.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">8</text><line x1="265.5" y1="244" x2="265.5" y2="256" stroke="#18364a" stroke-width="1.2"/><line x1="201.0" y1="244" x2="201.0" y2="256" stroke="#18364a" stroke-width="1.2"/><text x="201.0" y="274.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">10</text><line x1="136.5" y1="244" x2="136.5" y2="256" stroke="#18364a" stroke-width="1.2"/><line x1="72.0" y1="244" x2="72.0" y2="256" stroke="#18364a" stroke-width="1.2"/><text x="72.0" y="274.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">12</text><text x="840.0" y="296.0" class="" text-anchor="end" style="fill:#6d716f;font-weight:bold;font-size:12px">TMS</text><text x="76.0" y="296.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:13px">← downfield, deshielded</text><rect x="72.0" y="183" width="129.0" height="34" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="136.5" y="205.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">COOH</text><rect x="201.0" y="295" width="64.5" height="34" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="233.2" y="348.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">CHO</text><rect x="297.75" y="183" width="129.0" height="34" rx="6" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="362.2" y="205.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">aromatic</text><rect x="426.75" y="295" width="129.0" height="34" rx="6" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="491.2" y="317.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">vinyl</text><rect x="588.0" y="183" width="64.5" height="34" rx="6" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="620.2" y="172.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">C–O, C–X</text><rect x="652.5" y="295" width="64.5" height="34" rx="6" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="684.8" y="348.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">benzylic / α to C=O</text><rect x="717.0" y="183" width="96.75" height="34" rx="6" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="765.4" y="172.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">plain alkyl</text><text x="458.0" y="128.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">exchangeable –OH and –NH₂ wander anywhere from 1 to 5 ppm, broad, and vanish on a D₂O shake</text><rect x="60" y="372" width="380" height="254" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="250.0" y="400.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">n + 1, with Pascal intensities</text><text x="104.0" y="430.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">0 neighbours</text><text x="262.0" y="430.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:14px">singlet</text><text x="412.0" y="430.0" class="" text-anchor="end" style="fill:#6d716f;font-size:13px">1</text><text x="104.0" y="458.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">1 neighbour</text><text x="262.0" y="458.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:14px">doublet</text><text x="412.0" y="458.0" class="" text-anchor="end" style="fill:#6d716f;font-size:13px">1 : 1</text><text x="104.0" y="486.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">2 neighbours</text><text x="262.0" y="486.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:14px">triplet</text><text x="412.0" y="486.0" class="" text-anchor="end" style="fill:#6d716f;font-size:13px">1 : 2 : 1</text><text x="104.0" y="514.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">3 neighbours</text><text x="262.0" y="514.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:14px">quartet</text><text x="412.0" y="514.0" class="" text-anchor="end" style="fill:#6d716f;font-size:13px">1 : 3 : 3 : 1</text><text x="104.0" y="542.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">4 neighbours</text><text x="262.0" y="542.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:14px">quintet</text><text x="412.0" y="542.0" class="" text-anchor="end" style="fill:#6d716f;font-size:13px">1 : 4 : 6 : 4 : 1</text><text x="250.0" y="584.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Two different neighbours with different J give</text><text x="250.0" y="604.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">a doublet of doublets, not a triplet.</text><rect x="460" y="372" width="380" height="254" rx="12" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="650.0" y="400.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">Three patterns to know on sight</text><text x="486.0" y="434.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:15px">–CH₂CH₃</text><text x="814.0" y="434.0" class="" text-anchor="end" style="fill:#5b7a64;font-weight:bold;font-size:13px">ethyl</text><text x="486.0" y="453.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">quartet (2H) + triplet (3H)</text><text x="486.0" y="480.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:15px">–CH(CH₃)₂</text><text x="814.0" y="480.0" class="" text-anchor="end" style="fill:#5b7a64;font-weight:bold;font-size:13px">isopropyl</text><text x="486.0" y="499.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">septet (1H) + doublet (6H)</text><text x="486.0" y="526.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:15px">–C(CH₃)₃</text><text x="814.0" y="526.0" class="" text-anchor="end" style="fill:#5b7a64;font-weight:bold;font-size:13px">tert-butyl</text><text x="486.0" y="545.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">one singlet, 9H</text><text x="486.0" y="572.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:15px">–OCH₃</text><text x="814.0" y="572.0" class="" text-anchor="end" style="fill:#5b7a64;font-weight:bold;font-size:13px">methoxy</text><text x="486.0" y="591.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">one singlet near δ 3.3</text></svg>