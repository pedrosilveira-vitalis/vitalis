<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">Citric acid cycle carbon counts and outputs</title><desc id="desc">Citrate and isocitrate have six carbons; alpha-ketoglutarate has five; the remaining intermediates have four. Carbon dioxide and NADH are released at steps three and four, NADH at step eight, a nucleotide triphosphate at step five, and reducing equivalents to ubiquinone at step six. Oxaloacetate is regenerated.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#aa3653;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">TCA: carbon count is not carbon identity</text><rect x="24" y="60" width="752" height="466" rx="16" fill="white" stroke="#d9d2c6"/><rect x="85" y="100" width="190" height="40" rx="9" fill="#e4eef1"/><text x="180.0" y="126" class="t" text-anchor="middle">Citrate (6C)</text><rect x="85" y="205" width="190" height="40" rx="9" fill="#e4eef1"/><text x="180.0" y="231" class="t" text-anchor="middle">Isocitrate (6C)</text><rect x="85" y="310" width="190" height="40" rx="9" fill="#e4eef1"/><text x="180.0" y="336" class="t" text-anchor="middle">α-Ketoglutarate (5C)</text><rect x="85" y="415" width="190" height="40" rx="9" fill="#e4eef1"/><text x="180.0" y="441" class="t" text-anchor="middle">Succinyl-CoA (4C)</text><rect x="525" y="415" width="190" height="40" rx="9" fill="#e4eef1"/><text x="620.0" y="441" class="t" text-anchor="middle">Succinate (4C)</text><rect x="525" y="310" width="190" height="40" rx="9" fill="#e4eef1"/><text x="620.0" y="336" class="t" text-anchor="middle">Fumarate (4C)</text><rect x="525" y="205" width="190" height="40" rx="9" fill="#e4eef1"/><text x="620.0" y="231" class="t" text-anchor="middle">Malate (4C)</text><rect x="525" y="100" width="190" height="40" rx="9" fill="#e4eef1"/><text x="620.0" y="126" class="t" text-anchor="middle">Oxaloacetate (4C)</text><path d="M180 145 L180 198" class="bond" /><path d="M175 190 L180 198 L185 190" class="bond"/><text x="160" y="176" class="s" text-anchor="end">2</text><path d="M180 250 L180 303" class="bond" /><path d="M175 295 L180 303 L185 295" class="bond"/><text x="160" y="281" class="s" text-anchor="end">3</text><path d="M180 355 L180 408" class="bond" /><path d="M175 400 L180 408 L185 400" class="bond"/><text x="160" y="386" class="s" text-anchor="end">4</text><path d="M620 410 L620 357" class="bond" /><path d="M615 365 L620 357 L625 365" class="bond"/><text x="645" y="388" class="s" text-anchor="start">6</text><path d="M620 305 L620 252" class="bond" /><path d="M615 260 L620 252 L625 260" class="bond"/><text x="645" y="283" class="s" text-anchor="start">7</text><path d="M620 200 L620 147" class="bond" /><path d="M615 155 L620 147 L625 155" class="bond"/><text x="645" y="178" class="s" text-anchor="start">8</text><path d="M284 435 L515 435" class="bond" /><path d="M507 430 L515 435 L507 440" class="bond"/><text x="400" y="423" class="s" text-anchor="middle">5: GTP or ATP</text><path d="M515 120 L285 120" class="bond" /><path d="M293 115 L285 120 L293 125" class="bond"/><text x="400" y="103" class="s" text-anchor="middle">1: + acetyl-CoA (2C)</text><text x="300" y="284" class="s" text-anchor="start">NADH + CO₂</text><text x="300" y="389" class="s" text-anchor="start">NADH + CO₂</text><text x="420" y="282" class="s" text-anchor="start">H₂O in</text><text x="420" y="180" class="s" text-anchor="start">NADH</text><text x="420" y="385" class="s" text-anchor="start">Electrons → Q</text><text x="400" y="500" class="s" text-anchor="middle">Net: 3 NADH + 1 QH₂ equivalent + 1 GTP/ATP + 2 CO₂</text><rect x="24" y="542" width="752" height="174" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="576" class="h" text-anchor="start">Read the numbered enzyme steps</text><text x="45" y="608" class="s" text-anchor="start">1 Citrate synthase • 2 Aconitase</text><text x="425" y="608" class="s" text-anchor="start">5 Succinyl-CoA synthetase</text><text x="45" y="638" class="s" text-anchor="start">3 NAD-dependent IDH • 4 α-KGDH</text><text x="425" y="638" class="s" text-anchor="start">6 SDH / Complex II • 7 Fumarase</text><text x="45" y="668" class="s" text-anchor="start">8 Malate dehydrogenase</text><text x="425" y="668" class="s" text-anchor="start">OAA is regenerated, not gained</text><text x="400" y="700" class="s" text-anchor="middle">New acetyl carbons are retained in the first turn; two OAA-derived carbons leave.</text></svg>