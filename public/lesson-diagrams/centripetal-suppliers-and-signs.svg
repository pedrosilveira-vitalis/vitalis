<svg xmlns="http://www.w3.org/2000/svg" width="920" height="800" viewBox="0 0 920 800" role="img" aria-labelledby="t d"><title id="t">Centripetal force: always inward, never a new force</title><desc id="d">Left: a circle with velocity arrows drawn tangentially and acceleration arrows drawn inward at four points, showing that v and a are perpendicular, with the relations v = 2 pi r over T and a = v squared over r. Right: four suppliers of the centripetal force — tension, gravity in orbit, the normal force on a banked curve, and friction on a flat turn — each with its equation. Bottom: the sign of the normal force at four points, inside the top of a loop, at the bottom of a loop, over the crest of a hill, and on a flat turn.</desc><defs><marker id="m4088" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b7a64"/></marker><marker id="m7671" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="800" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Centripetal force: always inward, never a new force</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Name the physical force that supplies mv²/r, then set the inward sum equal to it</text><rect x="40" y="112" width="396" height="356" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="238.0" y="142.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">v is tangential, a is radial</text><circle cx="238" cy="292" r="104" fill="none" stroke="#6d716f" stroke-width="2"/><circle cx="238" cy="292" r="4" fill="#18364a" stroke="#18364a" stroke-width="2"/><line x1="311.53910524340097" y1="218.46089475659906" x2="273.35533905932743" y2="180.2771285725255" stroke="#5b7a64" stroke-width="2.5" marker-end="url(#m4088)"/><line x1="311.53910524340097" y1="218.46089475659906" x2="268.8864242022284" y2="261.1135757977716" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m7671)"/><line x1="164.46089475659906" y1="218.46089475659903" x2="126.2771285725255" y2="256.64466094067257" stroke="#5b7a64" stroke-width="2.5" marker-end="url(#m4088)"/><line x1="164.46089475659906" y1="218.46089475659903" x2="207.1135757977716" y2="261.1135757977716" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m7671)"/><line x1="164.46089475659903" y1="365.53910524340097" x2="202.6446609406726" y2="403.72287142747456" stroke="#5b7a64" stroke-width="2.5" marker-end="url(#m4088)"/><line x1="164.46089475659903" y1="365.53910524340097" x2="207.1135757977716" y2="322.8864242022284" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m7671)"/><line x1="311.5391052434009" y1="365.53910524340097" x2="349.7228714274745" y2="327.35533905932743" stroke="#5b7a64" stroke-width="2.5" marker-end="url(#m4088)"/><line x1="311.5391052434009" y1="365.53910524340097" x2="268.8864242022284" y2="322.8864242022284" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m7671)"/><text x="356.0" y="174.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">v</text><text x="264.0" y="258.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">aᴄ</text><text x="252.0" y="349.2" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:16px">r</text><line x1="238" y1="292" x2="238" y2="396" stroke="#18364a" stroke-width="1" stroke-dasharray="6 5"/><text x="238.0" y="424.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">v = 2πr / T   •   aᴄ = v²/r = 4π²r/T²</text><text x="238.0" y="450.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">speed constant, direction never is ⇒ always accelerating</text><rect x="452" y="112" width="428" height="356" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="666.0" y="142.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">Which real force is supplying mv²/r?</text><rect x="470" y="160" width="392" height="50" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="486.0" y="180.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:14px">string, ball on a table</text><text x="486.0" y="200.0" class="" text-anchor="start" style="fill:#18364a;font-size:15px">T = mv²/r</text><rect x="470" y="216" width="392" height="50" rx="9" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="486.0" y="236.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:14px">gravity, satellite in orbit</text><text x="486.0" y="256.0" class="" text-anchor="start" style="fill:#18364a;font-size:15px">GMm/r² = mv²/r  ⇒  v = √(GM/r)</text><rect x="470" y="272" width="392" height="50" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="486.0" y="292.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:14px">normal force, banked curve</text><text x="486.0" y="312.0" class="" text-anchor="start" style="fill:#18364a;font-size:15px">N sinθ = mv²/r  ⇒  tanθ = v²/rg</text><rect x="470" y="328" width="392" height="50" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="486.0" y="348.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:14px">static friction, flat turn</text><text x="486.0" y="368.0" class="" text-anchor="start" style="fill:#18364a;font-size:15px">fₛ = mv²/r  ⇒  vₘₐₓ = √(μₛ rg)</text><rect x="470" y="384" width="392" height="50" rx="9" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="486.0" y="404.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:bold;font-size:14px">magnetic force, charge in B</text><text x="486.0" y="424.0" class="" text-anchor="start" style="fill:#18364a;font-size:15px">qvB = mv²/r  ⇒  r = mv/qB</text><text x="666.0" y="452.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">Fᴄ is the net inward force — never drawn as an extra arrow</text><text x="60.0" y="506.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:17px">The sign of N depends on which side of the car the track is</text><rect x="40" y="528" width="200" height="140" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="140.0" y="556.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">inside, top of loop</text><text x="140.0" y="578.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">track above</text><text x="140.0" y="612.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">N + mg = mv²/r</text><text x="140.0" y="644.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">N = 0 at v = √(gr)</text><rect x="253" y="528" width="200" height="140" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="353.0" y="556.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">inside, bottom of loop</text><text x="353.0" y="578.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">track below</text><text x="353.0" y="612.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">N − mg = mv²/r</text><text x="353.0" y="644.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">N = mg + mv²/r: heavy</text><rect x="466" y="528" width="200" height="140" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="566.0" y="556.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">crest of a hill</text><text x="566.0" y="578.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">track below</text><text x="566.0" y="612.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">mg − N = mv²/r</text><text x="566.0" y="644.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">N = mg − mv²/r: light</text><rect x="679" y="528" width="200" height="140" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="779.0" y="556.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">flat turn</text><text x="779.0" y="578.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">track below</text><text x="779.0" y="612.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">fₛ = mv²/r</text><text x="779.0" y="644.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">N = mg: normal weight</text><text x="460.0" y="708.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">Centre of the circle first, then add the inward forces as positive</text><text x="460.0" y="736.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Over a crest the centre is below the car, so gravity is the inward one</text><text x="460.0" y="764.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Fᴄ does no work in uniform circular motion: it is ⊥ to v, so KE never changes</text></svg>