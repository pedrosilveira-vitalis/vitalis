<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="t d"><title id="t">A passage map has three layers</title><desc id="d">Three layers shown on one worked example. Layer one, paragraph tags of two to five words naming what each paragraph does: P1 introduces the topic, intuitions are widely trusted; P2 states the author&#x27;s thesis, intuitions are unreliable and prone to bias; P3 gives evidence from research on moral dumbfounding; P4 gives a second piece of evidence, cultural variation; P5 concedes that intuitions are developmentally necessary; P6 concludes that intuitions are useful heuristics but not ultimate standards. Layer two, relationship markers between the tags: BUT before P2, a plain run of evidence into P3 and P4, HOWEVER before P5, and SO before P6. Layer three, a one-sentence main idea naming the author&#x27;s stance and what is at stake, plus a short tone note: critical of intuition-based ethics but measured. A side panel maps question types to the layer that answers them: paragraph function to layer one, why-is-this-here and contrast questions to layer two, main idea, tone, inference and strengthen or weaken to layer three, and detail questions to the tag that tells you which paragraph to open.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="660" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">A passage map has three layers</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Worked example: a philosopher argues moral intuitions are unreliable but developmentally necessary.</text><text x="50.0" y="126.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:15px">Layer 1 — paragraph tags (what it does)</text><text x="470.0" y="126.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:15px">Layer 2 — links</text><rect x="50" y="148" width="400" height="48" rx="8" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="74.0" y="178.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:700;font-size:17px">P1</text><text x="116.0" y="178.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">intro — intuitions widely trusted</text><text x="508.0" y="208.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:14px">BUT</text><rect x="50" y="210" width="400" height="48" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="74.0" y="240.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:700;font-size:17px">P2</text><text x="116.0" y="240.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">THESIS — intuitions unreliable, biased</text><rect x="50" y="272" width="400" height="48" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="74.0" y="302.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:17px">P3</text><text x="116.0" y="302.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">evidence — moral dumbfounding</text><text x="508.0" y="332.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:14px">AND</text><rect x="50" y="334" width="400" height="48" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="74.0" y="364.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:17px">P4</text><text x="116.0" y="364.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">evidence 2 — cultural variation</text><text x="508.0" y="394.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:14px">HOWEVER</text><rect x="50" y="396" width="400" height="48" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="74.0" y="426.0" class="" text-anchor="start" style="fill:#987740;font-weight:700;font-size:17px">P5</text><text x="116.0" y="426.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">concedes — developmentally necessary</text><text x="508.0" y="456.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:14px">SO</text><rect x="50" y="458" width="400" height="48" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="74.0" y="488.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:700;font-size:17px">P6</text><text x="116.0" y="488.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">conclusion — heuristics, not standards</text><rect x="50" y="522" width="540" height="118" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="320.0" y="552.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:15px">Layer 3 — main idea + tone</text><text x="320.0" y="575.0" class="" text-anchor="middle" style="font-size:13px">Moral intuitions are psychologically necessary for moral development but</text><text x="320.0" y="593.0" class="" text-anchor="middle" style="font-size:13px">epistemically unreliable, so they should not be the ultimate ethical standard.</text><text x="320.0" y="611.0" class="" text-anchor="middle" style="font-size:13px">· Tone: critical of intuition-based ethics, but measured.</text><rect x="620" y="148" width="330" height="310" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="785.0" y="178.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:16px">Which layer answers which question</text><text x="640.0" y="212.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:13px">Paragraph function</text><text x="652.0" y="230.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">layer 1 — the tag</text><text x="640.0" y="258.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:13px">Why is this here? Contrast?</text><text x="652.0" y="276.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">layer 2 — the link</text><text x="640.0" y="304.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:13px">Main idea, primary purpose</text><text x="652.0" y="322.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">layer 3</text><text x="640.0" y="350.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:13px">Tone, attitude, inference</text><text x="652.0" y="368.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">layer 3</text><text x="640.0" y="396.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:13px">Detail / retrieval</text><text x="652.0" y="414.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">layer 1 points to the ¶; the text</text><text x="652.0" y="430.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">has the detail</text><rect x="620" y="470" width="330" height="170" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="785.0" y="500.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:15px">Keep it short</text><text x="785.0" y="523.0" class="" text-anchor="middle" style="font-size:13px">Tags of 2–5 words. The whole map should take</text><text x="785.0" y="541.0" class="" text-anchor="middle" style="font-size:13px">well under a minute of writing, spread through</text><text x="785.0" y="559.0" class="" text-anchor="middle" style="font-size:13px">the reading. Reading plus mapping ≈ 4 minutes,</text><text x="785.0" y="577.0" class="" text-anchor="middle" style="font-size:13px">leaving ~6 for the questions.</text></svg>