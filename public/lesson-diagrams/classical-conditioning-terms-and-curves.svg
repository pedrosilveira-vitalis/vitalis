.1 L572.2 490.3 L574.1 489.6 L575.9 488.8 L577.8 488.2 L579.6 487.6 L581.5 487.0 L583.3 486.4 L585.2 486.0 L587.0 485.5 L588.9 485.7 L590.7 486.7 L592.6 487.6 L594.5 488.4 L596.3 489.3 L598.2 490.1 L600.0 491.0 L601.9 491.8 L603.7 492.6 L605.6 493.4 L607.4 494.1 L609.3 494.9 L611.1 495.6 L613.0 496.3 L614.8 497.0 L616.7 497.7 L618.5 498.4 L620.4 499.1 L622.3 499.7 L624.1 500.4 L626.0 501.0 L627.8 501.6 L629.7 502.2 L631.5 502.8 L633.4 503.4 L635.2 503.9 L637.1 504.5 L638.9 505.0 L640.8 505.6 L642.6 506.1 L644.5 506.6 L646.3 507.1 L648.2 507.6 L650.1 508.1 L651.9 508.6 L653.8 509.0 L655.6 509.5 L657.5 509.9 L659.3 510.4 L661.2 510.8 L663.0 511.2 L664.9 511.6 L666.7 512.0 L668.6 512.4 L670.4 512.8 L672.3 513.2 L674.1 513.6 L676.0 513.9" stroke="#a8324a" stroke-width="2.8" fill="none"/><line x1="120.0" y1="556" x2="305.3333333333333" y2="556" stroke="#5b7a64" stroke-width="4"/><text x="212.7" y="576.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">acquisition</text><line x1="305.3333333333333" y1="556" x2="453.59999999999997" y2="556" stroke="#18364a" stroke-width="4"/><text x="379.5" y="576.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">extinction</text><line x1="453.59999999999997" y1="556" x2="527.7333333333333" y2="556" stroke="#6d716f" stroke-width="4"/><text x="490.7" y="576.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:12px">rest</text><line x1="527.7333333333333" y1="556" x2="676.0" y2="556" stroke="#987740" stroke-width="4"/><text x="601.9" y="576.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">spontaneous recovery</text><text x="700.0" y="440.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:12px">the CR comes back</text><text x="700.0" y="460.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">on its own, weaker —</text><text x="700.0" y="480.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">so the old association</text><text x="700.0" y="500.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">was only inhibited</text><text x="700.0" y="528.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">(same reason phobia</text><text x="700.0" y="546.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">relapse is common)</text><rect x="40" y="614" width="404" height="216" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="242.0" y="642.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">Spread out, or narrow down</text><line x1="110" y1="738" x2="360" y2="738" stroke="#18364a" stroke-width="2"/><line x1="110" y1="660" x2="110" y2="738" stroke="#18364a" stroke-width="2"/><text x="235.0" y="782.0" class="" text-anchor="middle" style="font-size:17px">similarity to the CS</text><text x="66" y="699.0" text-anchor="middle" transform="rotate(-90 66 699.0)" style="font-size:17px">CR</text><path d="M110.0 737.7 L114.2 737.6 L118.3 737.5 L122.5 737.3 L126.7 737.0 L130.8 736.6 L135.0 736.1 L139.2 735.4 L143.3 734.6 L147.5 733.5 L151.7 732.2 L155.8 730.6 L160.0 728.6 L164.2 726.4 L168.3 723.7 L172.5 720.6 L176.7 717.2 L180.8 713.3 L185.0 709.2 L189.2 704.7 L193.3 700.0 L197.5 695.3 L201.7 690.5 L205.8 685.8 L210.0 681.4 L214.2 677.3 L218.3 673.8 L222.5 671.0 L226.7 668.8 L230.8 667.5 L235.0 667.1 L239.2 667.5 L243.3 668.8 L247.5 671.0 L251.7 673.8 L255.8 677.3 L260.0 681.4 L264.2 685.8 L268.3 690.5 L272.5 695.3 L276.7 700.0 L280.8 704.7 L285.0 709.2 L289.2 713.3 L293.3 717.2 L297.5 720.6 L301.7 723.7 L305.8 726.4 L310.0 728.6 L314.2 730.6 L318.3 732.2 L322.5 733.5 L326.7 734.6 L330.8 735.4 L335.0 736.1 L339.2 736.6 L343.3 737.0 L347.5 737.3 L351.7 737.5 L355.8 737.6 L360.0 737.7" stroke="#5b7a64" stroke-width="2.6" fill="none"/><circle cx="235.0" cy="667.0909090909091" r="4" fill="#18364a" stroke="#18364a" stroke-width="2"/><text x="235.0" y="655.1" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">the trained CS</text><text x="242.0" y="806.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">generalisation is this gradient; discrimination is</text><text x="242.0" y="824.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">trained by reinforcing one point and not its neighbours</text><rect x="466" y="614" width="414" height="216" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="673.0" y="642.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">Biology sets the rules</text><rect x="490" y="660" width="366" height="66" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="673.0" y="682.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">taste aversion breaks every rule</text><text x="673.0" y="704.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">one trial • hours between CS and US • hard to extinguish</text><text x="673.0" y="718.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">and only for tastes — not for sounds or sights</text><rect x="490" y="738" width="176" height="72" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="578.0" y="760.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">amygdala</text><text x="578.0" y="782.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">fear conditioning</text><text x="578.0" y="800.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">(vmPFC extinguishes it)</text><rect x="680" y="738" width="176" height="72" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="768.0" y="760.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">cerebellum</text><text x="768.0" y="782.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">eyeblink conditioning</text><text x="768.0" y="800.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">(hippocampus: context)</text></svg>