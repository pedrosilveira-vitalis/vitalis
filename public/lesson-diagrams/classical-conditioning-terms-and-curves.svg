<svg xmlns="http://www.w3.org/2000/svg" width="920" height="860" viewBox="0 0 920 860" role="img" aria-labelledby="t d"><title id="t">The CS borrows its power from what it predicts</title><desc id="d">Top: the four labels laid on a timeline. Before conditioning the food produces salivation with no learning, so food is the unconditioned stimulus and that salivation the unconditioned response, while the bell does nothing. During conditioning the bell comes just before the food, about half a second ahead. After conditioning the bell alone produces salivation, so the bell is now the conditioned stimulus and that salivation the conditioned response, usually a little weaker than the original. Middle: the strength of the conditioned response over time, rising through acquisition, falling through extinction, then reappearing by itself after a rest, which shows extinction suppresses the association rather than erasing it. Bottom left: generalisation as a gradient falling away from the trained stimulus, against discrimination, which is trained by reinforcing one stimulus and not its neighbours. Bottom right: taste aversion as the exception that proves biology constrains learning, and the amygdala and cerebellum as the two separate seats of conditioning.</desc><defs><marker id="m5808" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="860" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">The CS borrows its power from what it predicts</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Name the US first, then the UR — the other two labels follow without guessing</text><rect x="40" y="150" width="840" height="196" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="178.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">Before, during, after</text><rect x="70" y="198" width="256" height="124" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="198.0" y="224.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">BEFORE</text><text x="198.0" y="254.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:normal;font-size:13px">food → salivation</text><text x="198.0" y="278.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">US → UR</text><text x="198.0" y="302.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:13px">bell → nothing</text><rect x="340" y="198" width="256" height="124" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="468.0" y="224.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">DURING</text><text x="468.0" y="254.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:normal;font-size:13px">bell, then food</text><text x="468.0" y="278.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:13px">CS before US,</text><text x="468.0" y="302.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:13px">by about 0.5 s</text><rect x="610" y="198" width="256" height="124" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="738.0" y="224.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">AFTER</text><text x="738.0" y="254.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:normal;font-size:13px">bell → salivation</text><text x="738.0" y="278.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">CS → CR</text><text x="738.0" y="302.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:13px">usually weaker than the UR</text><line x1="326" y1="260" x2="338" y2="260" stroke="#6d716f" stroke-width="2" marker-end="url(#m5808)"/><line x1="596" y1="260" x2="608" y2="260" stroke="#6d716f" stroke-width="2" marker-end="url(#m5808)"/><rect x="40" y="362" width="840" height="236" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="460.0" y="390.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">Extinction suppresses; it does not erase</text><line x1="120" y1="532" x2="676" y2="532" stroke="#18364a" stroke-width="2"/><line x1="120" y1="412" x2="120" y2="532" stroke="#18364a" stroke-width="2"/><text x="398.0" y="576.0" class="" text-anchor="middle" style="font-size:17px"></text><text x="76" y="472.0" text-anchor="middle" transform="rotate(-90 76 472.0)" style="font-size:17px">strength of the CR</text><path d="M120.0 532.0 L121.9 528.6 L123.7 525.4 L125.6 522.2 L127.4 519.2 L129.3 516.2 L131.1 513.3 L133.0 510.6 L134.8 507.9 L136.7 505.3 L138.5 502.7 L140.4 500.3 L142.2 497.9 L144.1 495.6 L145.9 493.3 L147.8 491.2 L149.7 489.1 L151.5 487.0 L153.4 485.1 L155.2 483.2 L157.1 481.3 L158.9 479.5 L160.8 477.8 L162.6 476.1 L164.5 474.4 L166.3 472.9 L168.2 471.3 L170.0 469.8 L171.9 468.4 L173.7 467.0 L175.6 465.6 L177.5 464.3 L179.3 463.0 L181.2 461.8 L183.0 460.6 L184.9 459.4 L186.7 458.3 L188.6 457.2 L190.4 456.2 L192.3 455.2 L194.1 454.2 L196.0 453.2 L197.8 452.3 L199.7 451.4 L201.5 450.5 L203.4 449.6 L205.3 448.8 L207.1 448.0 L209.0 447.3 L210.8 446.5 L212.7 445.8 L214.5 445.1 L216.4 444.4 L218.2 443.7 L220.1 443.1 L221.9 442.5 L223.8 441.9 L225.6 441.3 L227.5 440.7 L229.3 440.2 L231.2 439.6 L233.1 439.1 L234.9 438.6 L236.8 438.1 L238.6 437.7 L240.5 437.2 L242.3 436.8 L244.2 436.4 L246.0 435.9 L247.9 435.5 L249.7 435.1 L251.6 434.8 L253.4 434.4 L255.3 434.1 L257.1 433.7 L259.0 433.4 L260.9 433.1 L262.7 432.7 L264.6 432.4 L266.4 432.1 L268.3 431.9 L270.1 431.6 L272.0 431.3 L273.8 431.1 L275.7 430.8 L277.5 430.6 L279.4 430.3 L281.2 430.1 L283.1 429.9 L284.9 429.7