<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1010" viewBox="0 0 920 1010" role="img" aria-labelledby="t d"><title id="t">Naming a study design in two questions</title><desc id="d">Top: the decision tree that names almost any design a passage can describe. The first question is whether the researcher did anything to anyone; the second is whether assignment was random. If the researcher did nothing, the design is observational, and the question becomes where in time the study begins: at the outcome and looking back, at the exposure and looking forward, or at one moment with no time at all. Middle: what each observational design can and cannot compute, which is how passages usually test the difference. Bottom: the two validities, which pull against each other, and the specific threats named for each.</desc><defs><marker id="m2193" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#987740"/></marker><marker id="m485" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker><marker id="m7235" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b7a64"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="1010" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Naming a study design in two questions</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Ask what the researcher did, then ask where the study starts</text><rect x="40" y="180" width="840" height="336" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">What kind of study is this?</text><rect x="330" y="228" width="260" height="44" rx="9" fill="#e8ecef" stroke="#18364a" stroke-width="1.8"/><text x="460.0" y="248.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">did the researcher ASSIGN</text><text x="460.0" y="264.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">the exposure or treatment?</text><line x1="400" y1="274" x2="250" y2="300" stroke="#5b7a64" stroke-width="1.6" marker-end="url(#m7235)"/><text x="311.0" y="281.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:15px">yes</text><line x1="520" y1="274" x2="672" y2="300" stroke="#6d716f" stroke-width="1.6" marker-end="url(#m485)"/><text x="610.0" y="281.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">no</text><rect x="120" y="304" width="260" height="40" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="250.0" y="329.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">was assignment RANDOM?</text><line x1="190" y1="346" x2="150" y2="374" stroke="#5b7a64" stroke-width="1.4" marker-end="url(#m7235)"/><text x="154.0" y="356.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:15px">yes</text><line x1="310" y1="346" x2="350" y2="374" stroke="#987740" stroke-width="1.4" marker-end="url(#m2193)"/><text x="344.0" y="356.0" class="" text-anchor="middle" style="fill:#987740;font-size:15px">no</text><rect x="48" y="378" width="190" height="64" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="143.0" y="400.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">TRUE EXPERIMENT</text><text x="143.0" y="418.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">the only design that</text><text x="143.0" y="432.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">establishes causation</text><rect x="256" y="378" width="190" height="64" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="351.0" y="400.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10.5px">QUASI-EXPERIMENT</text><text x="351.0" y="418.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">nonequivalent groups,</text><text x="351.0" y="432.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">interrupted time series</text><rect x="542" y="304" width="300" height="40" rx="8" fill="#efede8" stroke="#6d716f" stroke-width="1.6"/><text x="692.0" y="329.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">where does the study START?</text><rect x="474" y="378" width="132" height="64" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="540.0" y="398.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:9.5px">CASE-CONTROL</text><text x="540.0" y="416.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">starts at the</text><text x="540.0" y="430.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">OUTCOME, looks back</text><rect x="614" y="378" width="132" height="64" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="680.0" y="398.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:9.5px">COHORT</text><text x="680.0" y="416.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">starts at the</text><text x="680.0" y="430.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">EXPOSURE, follows</text><rect x="754" y="378" width="126" height="64" rx="8" fill="#e8ecef" stroke="#18364a" stroke-width="1.8"/><text x="817.0" y="398.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">CROSS-SECTIONAL</text><text x="817.0" y="416.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">one moment,</text><text x="817.0" y="430.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">no time at all</text><text x="460.0" y="472.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">random SAMPLING is how people get into the study — it buys external validity</text><text x="460.0" y="492.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">random ASSIGNMENT is how they get into a group — it buys internal validity, and only it licenses a causal claim</text><rect x="40" y="532" width="840" height="170" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="560.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">What each observational design can compute</text><rect x="60" y="578" width="266" height="108" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="193.0" y="600.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">CASE-CONTROL</text><text x="193.0" y="622.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">ODDS RATIO only</text><text x="193.0" y="637.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">no incidence, no prevalence</text><text x="193.0" y="652.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">good for RARE disease</text><text x="193.0" y="667.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">worst for RECALL BIAS</text><rect x="340" y="578" width="266" height="108" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="473.0" y="600.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">COHORT</text><text x="473.0" y="622.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">RELATIVE RISK</text><text x="473.0" y="637.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">true INCIDENCE</text><text x="473.0" y="652.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">exposure recorded before</text><text x="473.0" y="667.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">the outcome, so little recall bias</text><rect x="620" y="578" width="266" height="108" rx="9" fill="#e8ecef" stroke="#18364a" stroke-width="1.8"/><text x="753.0" y="600.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">CROSS-SECTIONAL</text><text x="753.0" y="622.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">PREVALENCE</text><text x="753.0" y="637.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">association, but no</text><text x="753.0" y="652.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">temporal order — you cannot</text><text x="753.0" y="667.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">tell which came first</text><rect x="40" y="718" width="840" height="266" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="746.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">The two validities pull against each other</text><rect x="60" y="766" width="390" height="196" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="255.0" y="790.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">INTERNAL VALIDITY</text><text x="255.0" y="808.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">did the IV really cause the change in the DV?</text><line x1="90" y1="820" x2="420" y2="820" stroke="#5b7a64" stroke-width="1" stroke-dasharray="6 5"/><text x="255.0" y="838.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">confounding — a third variable drives both</text><text x="255.0" y="855.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">selection bias — the groups differed to begin with</text><text x="255.0" y="872.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">history — something else happened during the study</text><text x="255.0" y="889.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">maturation — participants changed on their own</text><text x="255.0" y="906.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">testing — measuring changed what was measured</text><text x="255.0" y="923.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">regression to the mean — extreme scores drift back</text><text x="255.0" y="940.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">attrition — and worse, differential dropout</text><rect x="470" y="766" width="390" height="196" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="665.0" y="790.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">EXTERNAL VALIDITY</text><text x="665.0" y="808.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">does the finding travel beyond this study?</text><line x1="500" y1="820" x2="830" y2="820" stroke="#987740" stroke-width="1" stroke-dasharray="6 5"/><text x="665.0" y="842.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">POPULATION validity</text><text x="665.0" y="858.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">to other people — a result from undergraduates</text><text x="665.0" y="872.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">may not hold for the patients in a clinic</text><text x="665.0" y="898.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">ECOLOGICAL validity</text><text x="665.0" y="914.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">to the real world — behaviour in a controlled lab</text><text x="665.0" y="928.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">may not be behaviour anywhere else</text><text x="665.0" y="950.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:9px">tightening control raises one and lowers the other</text></svg>