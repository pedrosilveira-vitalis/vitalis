<svg xmlns="http://www.w3.org/2000/svg" width="920" height="800" viewBox="0 0 920 800" role="img" aria-labelledby="t d"><title id="t">Classify the collision first, then write only the laws that apply</title><desc id="d">Left: before-and-after pictures of three collisions — an elastic collision between equal masses where the moving ball stops and the struck ball leaves with the same speed, a perfectly inelastic collision where the two stick together, and an explosion where a resting object splits and the fragments carry equal and opposite momenta. Right: a decision tree asking whether the objects stick and whether kinetic energy is conserved, giving the equations available in each case. Bottom: the kinetic energy lost in a perfectly inelastic collision, the coefficient of restitution scale, and the neutron moderation case.</desc><defs><marker id="m3049" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker><marker id="m5029" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker><marker id="m5175" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker><marker id="m6802" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b7a64"/></marker><marker id="m776" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#987740"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="800" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Classify the collision first, then write only the laws that apply</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Momentum is conserved in every one; kinetic energy only when the problem says elastic</text><rect x="40" y="112" width="430" height="400" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="255.0" y="142.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">Before  →  after</text><line x1="255" y1="166" x2="255" y2="226" stroke="#6d716f" stroke-width="1" stroke-dasharray="6 5"/><line x1="255" y1="270" x2="255" y2="330" stroke="#6d716f" stroke-width="1" stroke-dasharray="6 5"/><line x1="255" y1="374" x2="255" y2="434" stroke="#6d716f" stroke-width="1" stroke-dasharray="6 5"/><text x="255.0" y="178.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">elastic, equal masses</text><text x="255.0" y="262.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">the moving one stops dead; speeds swap</text><circle cx="96" cy="216" r="17" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="96.0" y="221.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">m</text><line x1="118" y1="216" x2="162" y2="216" stroke="#245574" stroke-width="2.5" marker-end="url(#m5029)"/><circle cx="196" cy="216" r="17" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="196.0" y="221.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">m</text><circle cx="300" cy="216" r="17" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="300.0" y="221.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">m</text><circle cx="396" cy="216" r="17" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="396.0" y="221.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">m</text><line x1="418" y1="216" x2="462" y2="216" stroke="#5b7a64" stroke-width="2.5" marker-end="url(#m6802)"/><text x="140.0" y="200.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">v</text><text x="440.0" y="200.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">v</text><text x="255.0" y="282.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">perfectly inelastic</text><text x="255.0" y="366.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">one unknown: vᶠ = (m₁v₁ + m₂v₂) / (m₁ + m₂)</text><circle cx="96" cy="320" r="17" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="96.0" y="325.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">m₁</text><line x1="118" y1="320" x2="160" y2="320" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m5175)"/><circle cx="196" cy="320" r="21" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="196.0" y="325.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">m₂</text><circle cx="340" cy="320" r="24" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="340.0" y="326.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">m₁+m₂</text><line x1="366" y1="320" x2="400" y2="320" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m5175)"/><text x="383.0" y="304.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">vᶠ</text><text x="255.0" y="386.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">explosion from rest</text><text x="255.0" y="470.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Σp stays zero; kinetic energy rises</text><circle cx="150" cy="424" r="24" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="150.0" y="430.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">at rest</text><circle cx="310" cy="424" r="15" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="310.0" y="429.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">m</text><line x1="290" y1="424" x2="248" y2="424" stroke="#987740" stroke-width="2.5" marker-end="url(#m776)"/><circle cx="410" cy="424" r="21" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="410.0" y="429.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">M</text><line x1="434" y1="424" x2="462" y2="424" stroke="#987740" stroke-width="2.5" marker-end="url(#m776)"/><text x="268.0" y="408.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">fast</text><text x="448.0" y="408.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">slow</text><rect x="486" y="112" width="394" height="400" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="683.0" y="142.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">Which equations do you get?</text><rect x="566" y="162" width="234" height="44" rx="9" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="683.0" y="190.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">Do they stick together?</text><line x1="620" y1="206" x2="578" y2="238" stroke="#18364a" stroke-width="2.5" marker-end="url(#m3049)"/><text x="581.0" y="220.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">yes</text><line x1="746" y1="206" x2="786" y2="238" stroke="#18364a" stroke-width="2.5" marker-end="url(#m3049)"/><text x="782.0" y="220.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">no</text><rect x="500" y="242" width="150" height="94" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="575.0" y="268.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">perfectly</text><text x="575.0" y="288.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">inelastic</text><text x="575.0" y="314.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">1 equation,</text><text x="575.0" y="332.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">1 unknown</text><rect x="680" y="242" width="180" height="44" rx="9" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="770.0" y="270.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">Is KE conserved?</text><line x1="726" y1="286" x2="706" y2="320" stroke="#18364a" stroke-width="2.5" marker-end="url(#m3049)"/><text x="698.0" y="303.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">yes</text><line x1="818" y1="286" x2="834" y2="320" stroke="#18364a" stroke-width="2.5" marker-end="url(#m3049)"/><text x="840.0" y="303.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">no</text><rect x="654" y="324" width="116" height="90" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="712.0" y="350.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">elastic</text><text x="712.0" y="374.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">p and KE:</text><text x="712.0" y="396.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">2 equations</text><rect x="784" y="324" width="94" height="90" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="831.0" y="350.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">inelastic</text><text x="831.0" y="374.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">p only:</text><text x="831.0" y="394.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">need more</text><rect x="506" y="430" width="354" height="60" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="683.0" y="454.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">Elastic with the target at rest:</text><text x="683.0" y="478.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">v₁ᶠ = (m₁−m₂)/(m₁+m₂) · v₁   •   v₂ᶠ = 2m₁/(m₁+m₂) · v₁</text><rect x="40" y="542" width="412" height="112" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="246.0" y="570.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">How much KE is lost when they stick</text><text x="246.0" y="600.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">KE_lost = ½m₁v₁² · m₂/(m₁ + m₂)</text><text x="246.0" y="630.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">tiny m₁ into huge m₂: almost all of it goes</text><rect x="468" y="542" width="412" height="112" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="674.0" y="570.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">Equal masses transfer the most</text><text x="674.0" y="600.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">a neutron stops dead on hydrogen (A = 1)</text><text x="674.0" y="630.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">and bounces off lead with its energy intact</text><text x="460.0" y="692.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">e = separation speed / approach speed:  1 elastic  •  0 perfectly inelastic</text><text x="460.0" y="724.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Same momentum, different energy: 4 kg at 3 m/s and 1 kg at 12 m/s both carry 12 kg·m/s,</text><text x="460.0" y="750.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">but 18 J and 72 J — momentum and kinetic energy are not interchangeable</text><text x="460.0" y="780.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Ballistic pendulum: momentum for the collision, energy for the swing — never one across both</text></svg>