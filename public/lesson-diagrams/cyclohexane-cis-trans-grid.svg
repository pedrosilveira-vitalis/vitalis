<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="t d"><title id="t">Which disubstituted cyclohexane can get both groups equatorial?</title><desc id="d">A grid of the three disubstituted cyclohexane patterns, 1,2 and 1,3 and 1,4, against cis and trans. For 1,2 and 1,4 the trans isomer interconverts between diequatorial and diaxial while the cis isomer is axial-equatorial in both chairs; for 1,3 the two are swapped. A rule panel below states that for an even relationship trans reaches diequatorial and for an odd relationship cis does.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="900" height="620" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Which disubstituted cyclohexane can get both groups equatorial?</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Only one of cis and trans can reach the diequatorial chair, and which one it is flips with the substitution pattern.</text><text x="370.0" y="104.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:19px">cis</text><text x="660.0" y="104.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:19px">trans</text><text x="110.0" y="168.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">1,2-disubstituted</text><rect x="239.0" y="118" width="262" height="84" rx="10" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="370.0" y="154.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:19px">a,e in both chairs</text><text x="370.0" y="180.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">equivalent chairs</text><rect x="529.0" y="118" width="262" height="84" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="660.0" y="154.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:19px">e,e  ↔  a,a</text><text x="660.0" y="180.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">diequatorial wins</text><text x="110.0" y="270.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">1,3-disubstituted</text><rect x="239.0" y="220" width="262" height="84" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="370.0" y="256.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:19px">e,e  ↔  a,a</text><text x="370.0" y="282.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">diequatorial wins</text><rect x="529.0" y="220" width="262" height="84" rx="10" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="660.0" y="256.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:19px">a,e in both chairs</text><text x="660.0" y="282.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">equivalent chairs</text><text x="110.0" y="372.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">1,4-disubstituted</text><rect x="239.0" y="322" width="262" height="84" rx="10" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="370.0" y="358.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:19px">a,e in both chairs</text><text x="370.0" y="384.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">equivalent chairs</text><rect x="529.0" y="322" width="262" height="84" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="660.0" y="358.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:19px">e,e  ↔  a,a</text><text x="660.0" y="384.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">diequatorial wins</text><rect x="60" y="438" width="780" height="112" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="450.0" y="466.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:19px">The pattern</text><text x="450.0" y="494.0" class="" text-anchor="middle" style="fill:#18364a;font-size:16px">1,2 and 1,4 (even gap): the TRANS isomer reaches diequatorial.</text><text x="450.0" y="518.0" class="" text-anchor="middle" style="fill:#18364a;font-size:16px">1,3 (odd gap): the CIS isomer reaches diequatorial.</text><text x="450.0" y="540.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">The other isomer is locked axial-equatorial in both chairs, so with identical groups its two chairs are equal.</text><line x1="60" y1="576" x2="96" y2="576" stroke="#245574" stroke-width="3"/><text x="106.0" y="581.0" class="" text-anchor="start" style="font-size:15px">Blue: a chair exists with both groups equatorial</text><line x1="60" y1="602" x2="96" y2="602" stroke="#6d716f" stroke-width="3"/><text x="106.0" y="607.0" class="" text-anchor="start" style="font-size:15px">Grey: one axial and one equatorial whichever way the ring flips</text></svg>