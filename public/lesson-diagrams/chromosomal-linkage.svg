<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800" role="img" aria-labelledby="title desc"><title id="title">Linkage: distinguish gametes from map length</title><desc id="desc">AB and ab chromosomes are in cis. With recombination fraction 0.20, parental gametes occur at 0.40 each and recombinant gametes at 0.10 each. A three-point map has intervals 4.5 and 19.5 centimorgans.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a;font-size:18px}.h{font-size:27px;font-weight:700}.sub{font-size:22px;font-weight:700}.small{font-size:16px}</style><rect width="900" height="800" fill="#fbf7ef" rx="20"/><text x="35" y="48" class="h" text-anchor="start">Linked does not mean inseparable</text><text x="35" y="86" class="" text-anchor="start">Example: AB / ab in cis, recombination fraction r = 0.20</text><path d="M90 140 H350" stroke="#245574" stroke-width="13" fill="none" stroke-dasharray=""/><text x="130" y="122" class="sub" text-anchor="middle">A</text><text x="310" y="122" class="sub" text-anchor="middle">B</text><path d="M90 205 H350" stroke="#7898aa" stroke-width="13" fill="none" stroke-dasharray=""/><text x="130" y="187" class="sub" text-anchor="middle">a</text><text x="310" y="187" class="sub" text-anchor="middle">b</text><text x="100" y="255" class="small" text-anchor="start">Two homologs; unreplicated schematic</text><path d="M390 170 H455" stroke="#245574" stroke-width="3" fill="none" stroke-dasharray=""/><path d="M445 160 L455 170 L445 180" stroke="#245574" stroke-width="3" fill="none" stroke-dasharray=""/><rect x="495" y="125" width="80" height="120" rx="10" fill="#eaf0f4" stroke="#245574" stroke-width="2"/><text x="535" y="171" class="sub" text-anchor="middle">AB</text><text x="535" y="214" class="" text-anchor="middle">40%</text><rect x="590" y="125" width="80" height="120" rx="10" fill="#eaf0f4" stroke="#245574" stroke-width="2"/><text x="630" y="171" class="sub" text-anchor="middle">ab</text><text x="630" y="214" class="" text-anchor="middle">40%</text><rect x="685" y="125" width="80" height="120" rx="10" fill="#fff" stroke="#245574" stroke-width="2"/><text x="725" y="171" class="sub" text-anchor="middle">Ab</text><text x="725" y="214" class="" text-anchor="middle">10%</text><rect x="780" y="125" width="80" height="120" rx="10" fill="#fff" stroke="#245574" stroke-width="2"/><text x="820" y="171" class="sub" text-anchor="middle">aB</text><text x="820" y="214" class="" text-anchor="middle">10%</text><text x="490" y="276" class="small" text-anchor="start">Parental: 1 − r = 80%</text><text x="490" y="305" class="small" text-anchor="start">Recombinant: r = 20%</text><path d="M35 340 H865" stroke="#cbd7df" stroke-width="2" fill="none" stroke-dasharray=""/><text x="35" y="391" class="h" text-anchor="start">A three-marker map reveals missed exchanges</text><path d="M100 485 H795" stroke="#245574" stroke-width="8" fill="none" stroke-dasharray=""/><path d="M100 465 V505" stroke="#245574" stroke-width="3" fill="none" stroke-dasharray=""/><text x="100" y="451" class="sub" text-anchor="middle">A</text><path d="M250 465 V505" stroke="#245574" stroke-width="3" fill="none" stroke-dasharray=""/><text x="250" y="451" class="sub" text-anchor="middle">B</text><path d="M795 465 V505" stroke="#245574" stroke-width="3" fill="none" stroke-dasharray=""/><text x="795" y="451" class="sub" text-anchor="middle">C</text><text x="175" y="543" class="" text-anchor="middle">4.5 cM</text><text x="522" y="543" class="" text-anchor="middle">19.5 cM</text><path d="M100 572 V590 H795 V572" stroke="#245574" stroke-width="3" fill="none" stroke-dasharray=""/><text x="447" y="624" class="sub" text-anchor="middle">Total genetic map length = 24 cM</text><text x="35" y="681" class="" text-anchor="start">Worked cross: 10 / 1,000 offspring are double recombinants.</text><text x="35" y="715" class="small" text-anchor="start">Outer-marker recombinant fraction = (45 + 195 − 2 × 10) / 1,000 = 22%.</text><text x="35" y="760" class="small" text-anchor="start">A double recombinant can restore the outer-marker association.</text></svg>