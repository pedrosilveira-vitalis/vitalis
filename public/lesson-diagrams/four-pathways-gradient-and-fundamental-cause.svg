<svg xmlns="http://www.w3.org/2000/svg" width="920" height="968" viewBox="0 0 920 968" role="img" aria-labelledby="t d"><title id="t">How a social condition becomes a diagnosis</title><desc id="d">Top: the four routes by which position in society turns into disease. They are worth separating because questions usually ask which one a passage is describing. Material deprivation acts directly on what a person can buy and where they can live. The psychosocial route runs through chronic stress to the HPA axis and allostatic load. The behavioural route is real but is itself shaped by the first two, so an answer that stops at “poor choices” is usually the wrong one. Access is the healthcare route. Middle: the gradient and what it rules out. Bottom: fundamental cause theory, which explains why disparities outlive any particular risk factor, and the figures most often quoted.</desc><defs><marker id="m8947" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="968" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">How a social condition becomes a diagnosis</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Four pathways from the outside world to the inside of the body</text><rect x="40" y="180" width="840" height="250" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">Four pathways from position to pathology</text><rect x="60" y="228" width="200" height="182" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="160.0" y="252.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11.5px">MATERIAL</text><text x="160.0" y="270.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">what you can buy,</text><text x="160.0" y="283.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">where you can live</text><line x1="84" y1="300" x2="236" y2="300" stroke="#245574" stroke-width="1" stroke-dasharray="6 5"/><text x="160.0" y="322.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">food, housing, heating</text><text x="160.0" y="339.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">neighbourhood exposure:</text><text x="160.0" y="356.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">lead, pollution, violence</text><text x="160.0" y="373.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">no cushion for a shock</text><rect x="265" y="228" width="200" height="182" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="365.0" y="252.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11.5px">PSYCHOSOCIAL</text><text x="365.0" y="270.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">chronic stress and</text><text x="365.0" y="283.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">low control</text><line x1="289" y1="300" x2="441" y2="300" stroke="#a8324a" stroke-width="1" stroke-dasharray="6 5"/><text x="365.0" y="322.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">HPA axis → cortisol</text><text x="365.0" y="339.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">allostatic load</text><text x="365.0" y="356.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">shorter telomeres</text><text x="365.0" y="373.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">inflammation, insulin resistance</text><rect x="470" y="228" width="200" height="182" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="570.0" y="252.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:11.5px">BEHAVIOURAL</text><text x="570.0" y="270.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">smoking, diet, activity,</text><text x="570.0" y="283.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">adherence</text><line x1="494" y1="300" x2="646" y2="300" stroke="#987740" stroke-width="1" stroke-dasharray="6 5"/><text x="570.0" y="322.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">real — but downstream of</text><text x="570.0" y="339.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">the first two</text><text x="570.0" y="356.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">“poor choices” is almost</text><text x="570.0" y="373.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">never the keyed answer</text><rect x="675" y="228" width="200" height="182" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="775.0" y="252.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11.5px">ACCESS</text><text x="775.0" y="270.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">whether care is got,</text><text x="775.0" y="283.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">and what kind</text><line x1="699" y1="300" x2="851" y2="300" stroke="#5b7a64" stroke-width="1" stroke-dasharray="6 5"/><text x="775.0" y="322.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">insurance, distance, time off</text><text x="775.0" y="339.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">language and literacy</text><text x="775.0" y="356.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">provider bias once inside</text><text x="775.0" y="373.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">trust, or its absence</text><rect x="40" y="446" width="410" height="240" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="245.0" y="474.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">It is a gradient, not a cliff</text><line x1="96" y1="616" x2="396" y2="616" stroke="#18364a" stroke-width="2"/><line x1="96" y1="496" x2="96" y2="616" stroke="#18364a" stroke-width="2"/><text x="246.0" y="660.0" class="" text-anchor="middle" style="font-size:17px"></text><text x="52" y="556.0" text-anchor="middle" transform="rotate(-90 52 556.0)" style="font-size:17px"></text><path d="M120.0 512.8 L180.0 536.8 L240.0 558.4 L300.0 577.6 L366.0 592.0" stroke="#987740" stroke-width="3" fill="none"/><circle cx="120.0" cy="512.8" r="4.5" fill="#987740" stroke="#987740" stroke-width="2"/><circle cx="180.0" cy="536.8" r="4.5" fill="#987740" stroke="#987740" stroke-width="2"/><circle cx="240.0" cy="558.4" r="4.5" fill="#987740" stroke="#987740" stroke-width="2"/><circle cx="300.0" cy="577.6" r="4.5" fill="#987740" stroke="#987740" stroke-width="2"/><circle cx="366.0" cy="592.0" r="4.5" fill="#987740" stroke="#987740" stroke-width="2"/><text x="110.0" y="640.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:9px">poorest</text><text x="390.0" y="640.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:9px">richest</text><text x="60.0" y="556.0" class="" text-anchor="start" style="fill:#6d716f;font-size:8.5px">worse</text><text x="245.0" y="662.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">every step up improves health — so a poverty</text><text x="245.0" y="678.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">threshold cannot be the whole story</text><rect x="470" y="446" width="410" height="240" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="675.0" y="474.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13.5px">Why disparities outlive the risk factor</text><rect x="494" y="494" width="362" height="50" rx="8" fill="#efede8" stroke="#6d716f" stroke-width="1.6"/><text x="675.0" y="514.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">a new way to protect health appears</text><text x="675.0" y="532.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">a vaccine, a screening test, a cessation programme</text><line x1="675" y1="548" x2="675" y2="570" stroke="#6d716f" stroke-width="2.5" marker-end="url(#m8947)"/><rect x="494" y="576" width="176" height="52" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="582.0" y="598.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10px">HIGHER SES</text><text x="582.0" y="616.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">takes it up first</text><rect x="680" y="576" width="176" height="52" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><text x="768.0" y="598.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10px">LOWER SES</text><text x="768.0" y="616.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">takes it up later or not</text><text x="675.0" y="650.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">so the gap reappears around the NEW factor</text><text x="675.0" y="668.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10px">Link and Phelan: SES is a FUNDAMENTAL cause</text><rect x="40" y="702" width="840" height="246" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="730.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">The figures worth carrying in</text><rect x="60" y="750" width="200" height="110" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="160.0" y="774.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10px">LIFE EXPECTANCY</text><text x="160.0" y="796.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">richest 1% vs poorest 1%:</text><text x="160.0" y="810.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">14.6 years for men, 10.1 for women</text><rect x="265" y="750" width="200" height="110" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="365.0" y="774.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10px">INFANT MORTALITY</text><text x="365.0" y="796.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">Black infants die at about</text><text x="365.0" y="810.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">2.3 times the white rate</text><rect x="470" y="750" width="200" height="110" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="570.0" y="774.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10px">MATERNAL MORTALITY</text><text x="570.0" y="796.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">Black women: 2–3 times the</text><text x="570.0" y="810.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">white rate, after adjusting for</text><text x="570.0" y="824.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">income and education</text><rect x="675" y="750" width="200" height="110" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="775.0" y="774.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10px">ACEs</text><text x="775.0" y="796.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">4 or more adverse childhood</text><text x="775.0" y="810.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">experiences: sharply raised adult</text><text x="775.0" y="824.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">disease across many systems</text><text x="460.0" y="886.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">AND THE ONE THAT RUNS THE OTHER WAY</text><text x="460.0" y="906.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">the Hispanic paradox: lower mortality than non-Hispanic white Americans despite lower average income</text><text x="460.0" y="924.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">explained by healthy-immigrant selection, dense family networks, and possibly salmon bias; it fades with time in the US</text></svg>