<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="t d"><title id="t">Oxygen–hemoglobin dissociation curve and its shifts</title><desc id="d">Saturation versus PO2. Myoglobin has a hyperbolic curve with P50 near 2.8 mmHg. Normal adult hemoglobin is sigmoid with P50 about 26.7 mmHg, about 75 percent saturated at 40 mmHg and 97 to 98 percent at 100 mmHg. A right-shifted curve (P50 about 36) reflects increased CO2, acid, 2,3-BPG and temperature and favors unloading; a left-shifted curve (P50 about 17) reflects alkalosis, low CO2, low 2,3-BPG, cold, fetal hemoglobin or carbon monoxide and favors loading.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="640" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Oxygen–hemoglobin dissociation curve and its shifts</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Curves generated with the Hill equation (n ≈ 2.7 for Hb, 1 for myoglobin); teaching sketch.</text><line x1="100" y1="540" x2="660" y2="540" stroke="#18364a" stroke-width="2"/><line x1="100" y1="110" x2="100" y2="540" stroke="#18364a" stroke-width="2"/><text x="380.0" y="584.0" class="" text-anchor="middle" style="font-size:17px">PO₂ (mmHg)</text><text x="56" y="325.0" text-anchor="middle" transform="rotate(-90 56 325.0)" style="font-size:17px">Hb O₂ saturation (%)</text><line x1="201.8181818181818" y1="540.0" x2="201.8181818181818" y2="546.0" stroke="#18364a" stroke-width="2"/><text x="201.8" y="562.0" class="" text-anchor="middle" style="font-size:14px">20</text><line x1="235.9272727272727" y1="540.0" x2="235.9272727272727" y2="546.0" stroke="#18364a" stroke-width="2"/><text x="235.9" y="562.0" class="" text-anchor="middle" style="font-size:14px">26.7</text><line x1="303.6363636363636" y1="540.0" x2="30