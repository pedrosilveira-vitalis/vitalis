<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800" role="img" aria-labelledby="title desc"><title id="title">Epistasis: the phenotype rule changes the ratio</title><desc id="desc">EeBb crossed with EeBb gives 16 equal-probability gamete pairs. E_B_ cells are black, E_bb brown, and all ee cells yellow. Independent segregation remains intact.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a;font-size:18px}.h{font-size:27px;font-weight:700}.sub{font-size:22px;font-weight:700}.small{font-size:16px}</style><rect width="900" height="800" fill="#fbf7ef" rx="20"/><text x="35" y="48" class="h" text-anchor="start">A different phenotype rule, the same segregation</text><text x="35" y="83" class="small" text-anchor="start">EeBb × EeBb • independently assorting loci • each gamete has probability ¼</text><text x="240" y="130" class="sub" text-anchor="middle">EB</text><text x="105" y="185" class="sub" text-anchor="middle">EB</text><text x="385" y="130" class="sub" text-anchor="middle">Eb</text><text x="105" y="285" class="sub" text-anchor="middle">Eb</text><text x="530" y="130" class="sub" text-anchor="middle">eB</text><text x="105" y="385" class="sub" text-anchor="middle">eB</text><text x="675" y="130" class="sub" text-anchor="middle">eb</text><text x="105" y="485" class="sub" text-anchor="middle">eb</text><rect x="168" y="150" width="145" height="100" rx="0" fill="#dde8ef" stroke="#245574" stroke-width="2"/><text x="240" y="187" class="sub" text-anchor="middle">EEBB</text><text x="240" y="220" class="" text-anchor="middle">Black</text><rect x="313" y="150" width="145" height="100" rx="0" fill="#dde8ef" stroke="#245574" stroke-width="2"/><text x="385" y="187" class="sub" text-anchor="middle">EEBb</text><text x="385" y="220" class="" text-anchor="middle">Black</text><rect x="458" y="150" width="145" height="100" rx="0" fill="#dde8ef" stroke="#245574" stroke-width="2"/><text x="530" y="187" class="sub" text-anchor="middle">EeBB</text><text x="530" y="220" class="" text-anchor="middle">Black</text><rect x="603" y="150" width="145" height="100" rx="0" fill="#dde8ef" stroke="#245574" stroke-width="2"/><text x="675" y="187" class="sub" text-anchor="middle">EeBb</text><text x="675" y="220" class="" text-anchor="middle">Black</text><rect x="168" y="250" width="145" height="100" rx="0" fill="#dde8ef" stroke="#245574" stroke-width="2"/><text x="240" y="287" class="sub" text-anchor="middle">EEBb</text><text x="240" y="320" class="" text-anchor="middle">Black</text><rect x="313" y="250" width="145" height="100" rx="0" fill="#edf2f5" stroke="#245574" stroke-width="2"/><text x="385" y="287" class="sub" text-anchor="middle">EEbb</text><text x="385" y="320" class="" text-anchor="middle">Brown</text><rect x="458" y="250" width="145" height="100" rx="0" fill="#dde8ef" stroke="#245574" stroke-width="2"/><text x="530" y="287" class="sub" text-anchor="middle">EeBb</text><text x="530" y="320" class="" text-anchor="middle">Black</text><rect x="603" y="250" width="145" height="100" rx="0" fill="#edf2f5" stroke="#245574" stroke-width="2"/><text x="675" y="287" class="sub" text-anchor="middle">Eebb</text><text x="675" y="320" class="" text-anchor="middle">Brown</text><rect x="168" y="350" width="145" height="100" rx="0" fill="#dde8ef" stroke="#245574" stroke-width="2"/><text x="240" y="387" class="sub" text-anchor="middle">EeBB</text><text x="240" y="420" class="" text-anchor="middle">Black</text><rect x="313" y="350" width="145" height="100" rx="0" fill="#dde8ef" stroke="#245574" stroke-width="2"/><text x="385" y="387" class="sub" text-anchor="middle">EeBb</text><text x="385" y="420" class="" text-anchor="middle">Black</text><rect x="458" y="350" width="145" height="100" rx="0" fill="#fff" stroke="#245574" stroke-width="2"/><text x="530" y="387" class="sub" text-anchor="middle">eeBB</text><text x="530" y="420" class="" text-anchor="middle">Yellow</text><rect x="603" y="350" width="145" height="100" rx="0" fill="#fff" stroke="#245574" stroke-width="2"/><text x="675" y="387" class="sub" text-anchor="middle">eeBb</text><text x="675" y="420" class="" text-anchor="middle">Yellow</text><rect x="168" y="450" width="145" height="100" rx="0" fill="#dde8ef" stroke="#245574" stroke-width="2"/><text x="240" y="487" class="sub" text-anchor="middle">EeBb</text><text x="240" y="520" class="" text-anchor="middle">Black</text><rect x="313" y="450" width="145" height="100" rx="0" fill="#edf2f5" stroke="#245574" stroke-width="2"/><text x="385" y="487" class="sub" text-anchor="middle">Eebb</text><text x="385" y="520" class="" text-anchor="middle">Brown</text><rect x="458" y="450" width="145" height="100" rx="0" fill="#fff" stroke="#245574" stroke-width="2"/><text x="530" y="487" class="sub" text-anchor="middle">eeBb</text><text x="530" y="520" class="" text-anchor="middle">Yellow</text><rect x="603" y="450" width="145" height="100" rx="0" fill="#fff" stroke="#245574" stroke-width="2"/><text x="675" y="487" class="sub" text-anchor="middle">eebb</text><text x="675" y="520" class="" text-anchor="middle">Yellow</text><text x="35" y="605" class="h" text-anchor="start">9 black : 3 brown : 4 yellow</text><text x="35" y="648" class="" text-anchor="start">ee masks the B/b difference in eumelanin color.</text><text x="35" y="683" class="" text-anchor="start">Yellow/red pheomelanin remains: yellow does not mean “no pigment.”</text><text x="35" y="739" class="small" text-anchor="start">The grid uses labels and blue shading, not literal coat colors.</text><text x="35" y="765" class="small" text-anchor="start">Assumes the stated phenotype model, full penetrance and equal viability.</text></svg>