<svg xmlns="http://www.w3.org/2000/svg" width="920" height="946" viewBox="0 0 920 946" role="img" aria-labelledby="t d"><title id="t">Where the gap comes from, and what each mechanism is called</title><desc id="d">Top: the gender pay gap decomposed. The single figure most people quote is the ratio of median earnings, and which figure you get depends on whether part-time workers are counted — so always check the measure before comparing two numbers. Underneath it sit four separable mechanisms, each named in its own right and each testable: men and women are sorted into different occupations, the work women do is paid less for comparable skill, parenthood moves the two sexes in opposite directions, and a gap survives inside the same job. Bottom left: the vertical barriers, which are about promotion rather than pay. Bottom right: the frameworks, from the social construction of gender through to minority stress.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="946" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Where the gap comes from, and what each mechanism is called</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">The headline number hides four different things, each with its own name</text><rect x="40" y="180" width="840" height="318" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">One headline number, four mechanisms</text><rect x="230" y="228" width="460" height="62" rx="9" fill="#efede8" stroke="#6d716f" stroke-width="1.8"/><text x="460.0" y="252.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">CHECK THE MEASURE FIRST</text><text x="460.0" y="274.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">full-time year-round ≠ all workers — the two give different cents-on-the-dollar</text><rect x="60" y="308" width="200" height="124" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="160.0" y="332.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10px">OCCUPATIONAL</text><text x="160.0" y="346.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10px">SEGREGATION</text><line x1="86" y1="362" x2="234" y2="362" stroke="#245574" stroke-width="1" stroke-dasharray="6 5"/><text x="160.0" y="384.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">men and women end up in</text><text x="160.0" y="399.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">different jobs</text><rect x="265" y="308" width="200" height="124" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="365.0" y="332.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10px">DEVALUATION</text><line x1="291" y1="362" x2="439" y2="362" stroke="#987740" stroke-width="1" stroke-dasharray="6 5"/><text x="365.0" y="384.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">work associated with women is</text><text x="365.0" y="399.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">paid less for comparable skill</text><rect x="470" y="308" width="200" height="124" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="570.0" y="332.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10px">MOTHERHOOD PENALTY</text><text x="570.0" y="346.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10px">FATHERHOOD BONUS</text><line x1="496" y1="362" x2="644" y2="362" stroke="#a8324a" stroke-width="1" stroke-dasharray="6 5"/><text x="570.0" y="384.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">the same event moves the two</text><text x="570.0" y="399.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">sexes in opposite directions</text><rect x="675" y="308" width="200" height="124" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="775.0" y="332.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10px">WITHIN-JOB GAP</text><line x1="701" y1="362" x2="849" y2="362" stroke="#5b7a64" stroke-width="1" stroke-dasharray="6 5"/><text x="775.0" y="384.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">a gap survives inside the same</text><text x="775.0" y="399.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">occupation — so sorting is not all</text><text x="460.0" y="458.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">the last one matters most for exam logic: if sorting explained everything,</text><text x="460.0" y="476.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">the within-occupation gap would be zero — and it is not</text><rect x="40" y="514" width="410" height="414" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="245.0" y="542.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">Barriers to moving UP</text><text x="245.0" y="562.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">these are about promotion, not pay</text><rect x="64" y="584" width="362" height="72" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="245.0" y="606.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11.5px">GLASS CEILING</text><text x="245.0" y="625.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">qualified women stop short of the top;</text><text x="245.0" y="639.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">the refusal is justified in vague terms</text><rect x="64" y="664" width="362" height="72" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="245.0" y="686.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:11.5px">GLASS ESCALATOR</text><text x="245.0" y="705.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">men in nursing, teaching and social work</text><text x="245.0" y="719.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">rise faster than the women around them</text><rect x="64" y="744" width="362" height="72" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="245.0" y="766.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11.5px">STICKY FLOOR</text><text x="245.0" y="785.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">held in the lowest-paid grades rather</text><text x="245.0" y="799.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">than blocked near the top</text><rect x="64" y="824" width="362" height="72" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="245.0" y="846.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11.5px">DOUBLE BIND</text><text x="245.0" y="865.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">the same assertiveness read as confidence</text><text x="245.0" y="879.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">in a man and aggression in a woman</text><text x="245.0" y="914.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">all four persist after controlling for education and experience</text><rect x="470" y="514" width="410" height="414" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="675.0" y="542.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">The frameworks to name</text><rect x="494" y="566" width="362" height="56" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="675.0" y="586.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">SEX ≠ GENDER</text><text x="675.0" y="601.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">chromosomes, hormones and anatomy against</text><text x="675.0" y="614.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">roles, identity and expression</text><rect x="494" y="626" width="362" height="56" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="675.0" y="646.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">PERFORMATIVITY</text><text x="675.0" y="661.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">Butler: gender is not something one is but</text><text x="675.0" y="674.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">something repeatedly done</text><rect x="494" y="686" width="362" height="56" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="675.0" y="706.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">PATRIARCHY</text><text x="675.0" y="721.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">institutional, not personal — it shows up in law,</text><text x="675.0" y="734.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">in firms and in norms at once</text><rect x="494" y="746" width="362" height="56" rx="7" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="675.0" y="766.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10.5px">INTERSECTIONALITY</text><text x="675.0" y="781.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">Crenshaw: the categories multiply rather than</text><text x="675.0" y="794.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">add; a position neither axis explains</text><rect x="494" y="806" width="362" height="56" rx="7" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="675.0" y="826.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">MINORITY STRESS</text><text x="675.0" y="841.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">Meyer: LGBTQ+ health gaps come from stigma,</text><text x="675.0" y="854.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">discrimination and concealment</text><rect x="494" y="866" width="362" height="56" rx="7" fill="#efede8" stroke="#6d716f" stroke-width="1.5"/><text x="675.0" y="886.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:10.5px">MEDICALIZATION</text><text x="675.0" y="901.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">homosexuality left the DSM in 1973; gender</text><text x="675.0" y="914.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">dysphoria remains, and that is contested</text></svg>