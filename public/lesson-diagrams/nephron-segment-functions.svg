<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="t d"><title id="t">What each nephron segment does to filtered sodium and water</title><desc id="d">Five boxes in sequence: proximal tubule reabsorbs about 65 percent of filtered sodium and water isosmotically using NHE3 and SGLT2, always water permeable, targeted by acetazolamide and SGLT2 inhibitors; thick ascending limb reabsorbs about 25 percent of sodium via NKCC2, water impermeable, building the medullary gradient, targeted by loop diuretics; distal convoluted tubule about 5 percent via NCC, water impermeable, targeted by thiazides; collecting duct principal cells 2 to 5 percent via ENaC under aldosterone and water via AQP2 under ADH, targeted by spironolactone and amiloride. The thin descending limb is water permeable with no active transport.</desc><defs><marker id="m7064" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1100" height="640" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">What each nephron segment does to filtered sodium and water</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Approximate share of filtered Na⁺ reabsorbed, the key apical transporter, water permeability and the drug that targets it.</text><rect x="30" y="110" width="196" height="380" rx="14" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="128.0" y="145.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:18px">Proximal tubule</text><text x="128.0" y="215.0" class="" text-anchor="middle" style="font-weight:700;font-size:18px">~65% Na⁺ &amp; water</text><text x="128.0" y="265.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Transporter</text><text x="128.0" y="287.0" class="" text-anchor="middle" style="font-size:15px">NHE3, SGLT2</text><text x="128.0" y="345.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Water</text><text x="128.0" y="367.0" class="" text-anchor="middle" style="font-size:15px">always (AQP1)</text><text x="128.0" y="425.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Drug target</text><text x="128.0" y="447.0" class="" text-anchor="middle" style="font-size:15px">Acetazolamide, SGLT2</text><text x="128.0" y="467.0" class="" text-anchor="middle" style="font-size:15px">inhibitors</text><line x1="227" y1="300" x2="241" y2="300" stroke="#18364a" stroke-width="2" marker-end="url(#m7064)"/><rect x="242" y="110" width="196" height="380" rx="14" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="340.0" y="145.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:18px">Thin descending</text><text x="340.0" y="167.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:18px">limb</text><text x="340.0" y="215.0" class="" text-anchor="middle" style="font-weight:700;font-size:18px">water only</text><text x="340.0" y="265.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Transporter</text><text x="340.0" y="287.0" class="" text-anchor="middle" style="font-size:15px">none</text><text x="340.0" y="345.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Water</text><text x="340.0" y="367.0" class="" text-anchor="middle" style="font-size:15px">yes (AQP1)</text><text x="340.0" y="425.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Drug target</text><text x="340.0" y="447.0" class="" text-anchor="middle" style="font-size:15px">—</text><line x1="439" y1="300" x2="453" y2="300" stroke="#18364a" stroke-width="2" marker-end="url(#m7064)"/><rect x="454" y="110" width="196" height="380" rx="14" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="552.0" y="145.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:18px">Thick ascending</text><text x="552.0" y="167.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:18px">limb</text><text x="552.0" y="215.0" class="" text-anchor="middle" style="font-weight:700;font-size:18px">~25% Na⁺</text><text x="552.0" y="265.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Transporter</text><text x="552.0" y="287.0" class="" text-anchor="middle" style="font-size:15px">NKCC2 (+ ROMK)</text><text x="552.0" y="345.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Water</text><text x="552.0" y="367.0" class="" text-anchor="middle" style="font-size:15px">never</text><text x="552.0" y="425.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Drug target</text><text x="552.0" y="447.0" class="" text-anchor="middle" style="font-size:15px">Loop diuretics</text><text x="552.0" y="467.0" class="" text-anchor="middle" style="font-size:15px">(furosemide)</text><line x1="651" y1="300" x2="665" y2="300" stroke="#18364a" stroke-width="2" marker-end="url(#m7064)"/><rect x="666" y="110" width="196" height="380" rx="14" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="764.0" y="145.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:18px">Distal tubule</text><text x="764.0" y="167.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:18px">(DCT)</text><text x="764.0" y="215.0" class="" text-anchor="middle" style="font-weight:700;font-size:18px">~5% Na⁺</text><text x="764.0" y="265.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Transporter</text><text x="764.0" y="287.0" class="" text-anchor="middle" style="font-size:15px">NCC; PTH → Ca²⁺</text><text x="764.0" y="345.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Water</text><text x="764.0" y="367.0" class="" text-anchor="middle" style="font-size:15px">never</text><text x="764.0" y="425.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Drug target</text><text x="764.0" y="447.0" class="" text-anchor="middle" style="font-size:15px">Thiazides</text><line x1="863" y1="300" x2="877" y2="300" stroke="#18364a" stroke-width="2" marker-end="url(#m7064)"/><rect x="878" y="110" width="196" height="380" rx="14" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="976.0" y="145.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:18px">Collecting duct</text><text x="976.0" y="215.0" class="" text-anchor="middle" style="font-weight:700;font-size:18px">~2–5% Na⁺</text><text x="976.0" y="265.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Transporter</text><text x="976.0" y="287.0" class="" text-anchor="middle" style="font-size:15px">ENaC (aldosterone)</text><text x="976.0" y="345.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Water</text><text x="976.0" y="367.0" class="" text-anchor="middle" style="font-size:15px">only with ADH (AQP2)</text><text x="976.0" y="425.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Drug target</text><text x="976.0" y="447.0" class="" text-anchor="middle" style="font-size:15px">Spironolactone,</text><text x="976.0" y="467.0" class="" text-anchor="middle" style="font-size:15px">amiloride</text><text x="30.0" y="530.0" class="" text-anchor="start" style="font-weight:700;font-size:16px">Tubular fluid osmolality:</text><text x="30.0" y="556.0" class="" text-anchor="start" style="font-size:15px">≈300 (isosmotic) in the proximal tubule → up to ~1200 at the bend (deep nephrons) → ~100–150 leaving the thick ascending limb →</text><text x="30.0" y="580.0" class="" text-anchor="start" style="font-size:15px">final urine ~50 (no ADH) to ~1200 mOsm/kg (high ADH).</text><text x="30.0" y="615.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">Shares are typical textbook values and vary with physiological state.</text></svg>