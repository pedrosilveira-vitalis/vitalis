<svg xmlns="http://www.w3.org/2000/svg" width="920" height="890" viewBox="0 0 920 890" role="img" aria-labelledby="t d"><title id="t">Three answers to “why did it do that?”</title><desc id="d">Top: the Yerkes and Dodson result, drawn as the two curves it actually is. Both peak in the middle, but the peak sits further right for a simple, well-practised task and further left for a complex or novel one — which is why high arousal helps a sprinter and ruins a chess player, and why exam anxiety hurts most on the questions that need the most working memory. Bottom left: Hull&#x27;s equation, whose point is that it multiplies. Drive without a learned habit produces nothing, and a perfectly learned habit with no drive produces nothing either. Bottom right: the three traditions and what finished each of them — instinct theory died of circular reasoning, drive theory of curiosity.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="890" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Three answers to “why did it do that?”</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Drive says reduce the tension; arousal says find the right amount of it</text><rect x="40" y="170" width="840" height="300" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="198.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">Two curves, not one</text><line x1="130" y1="394" x2="790" y2="394" stroke="#18364a" stroke-width="2"/><line x1="130" y1="224" x2="130" y2="394" stroke="#18364a" stroke-width="2"/><text x="460.0" y="438.0" class="" text-anchor="middle" style="font-size:17px">arousal  →</text><text x="86" y="309.0" text-anchor="middle" transform="rotate(-90 86 309.0)" style="font-size:17px">performance</text><path d="M130.0 374.0 L133.3 372.8 L136