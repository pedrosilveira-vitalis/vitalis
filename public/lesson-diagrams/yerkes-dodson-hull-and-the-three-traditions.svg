78.3 L476.5 276.3 L479.8 274.3 L483.1 272.4 L486.4 270.5 L489.7 268.7 L493.0 266.9 L496.3 265.2 L499.6 263.5 L502.9 261.9 L506.2 260.4 L509.5 258.9 L512.8 257.5 L516.1 256.2 L519.4 255.0 L522.7 253.8 L526.0 252.7 L529.3 251.7 L532.6 250.7 L535.9 249.9 L539.2 249.1 L542.5 248.4 L545.8 247.8 L549.1 247.3 L552.4 246.9 L555.7 246.6 L559.0 246.4 L562.3 246.2 L565.6 246.2 L568.9 246.2 L572.2 246.4 L575.5 246.6 L578.8 246.9 L582.1 247.3 L585.4 247.8 L588.7 248.4 L592.0 249.1 L595.3 249.9 L598.6 250.7 L601.9 251.7 L605.2 252.7 L608.5 253.8 L611.8 255.0 L615.1 256.2 L618.4 257.5 L621.7 258.9 L625.0 260.4 L628.3 261.9 L631.6 263.5 L634.9 265.2 L638.2 266.9 L641.5 268.7 L644.8 270.5 L648.1 272.4 L651.4 274.3 L654.7 276.3 L658.0 278.3 L661.3 280.3 L664.6 282.4 L667.9 284.5 L671.2 286.7 L674.5 288.8 L677.8 291.0 L681.1 293.2 L684.4 295.4 L687.7 297.6 L691.0 299.9 L694.3 302.1 L697.6 304.3 L700.9 306.6 L704.2 308.8 L707.5 311.1 L710.8 313.3 L714.1 315.5 L717.4 317.7 L720.7 319.9 L724.0 322.0 L727.3 324.2 L730.6 326.3 L733.9 328.4 L737.2 330.5 L740.5 332.5 L743.8 334.6 L747.1 336.6 L750.4 338.5 L753.7 340.4 L757.0 342.3 L760.3 344.2 L763.6 346.0 L766.9 347.8 L770.2 349.5 L773.5 351.2 L776.8 352.9 L780.1 354.5 L783.4 356.1 L786.7 357.6 L790.0 359.2" stroke="#5b7a64" stroke-width="3" fill="none"/><text x="215.8" y="253.6" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:12px">COMPLEX or NEW task</text><text x="215.8" y="269.6" class="" text-anchor="start" style="fill:#a8324a;font-size:11px">peaks early — needs calm</text><text x="750.4" y="253.6" class="" text-anchor="end" style="fill:#5b7a64;font-weight:bold;font-size:12px">SIMPLE or PRACTISED task</text><text x="750.4" y="269.6" class="" text-anchor="end" style="fill:#5b7a64;font-size:11px">peaks late — tolerates pressure</text><line x1="354.4" y1="394.0" x2="354.4" y2="246.17391304347825" stroke="#a8324a" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="565.5999999999999" y1="394.0" x2="565.5999999999999" y2="246.17391304347825" stroke="#5b7a64" stroke-width="1.2" stroke-dasharray="6 5"/><text x="169.6" y="376.3" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">asleep</text><text x="750.4" y="376.3" class="" text-anchor="end" style="fill:#6d716f;font-size:11px">panic</text><text x="460.0" y="452.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">the law has two halves: the inverted U, and the fact that its peak moves with difficulty</text><rect x="40" y="488" width="400" height="372" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="240.0" y="516.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">Hull&#x27;s equation multiplies</text><rect x="70" y="536" width="340" height="66" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="240.0" y="578.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:24px">E = D × H × K</text><text x="240.0" y="620.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">D  drive</text><text x="240.0" y="638.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">how energised — and it is GENERAL,</text><text x="240.0" y="654.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">any need energises the strongest habit</text><text x="240.0" y="682.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">H  habit strength</text><text x="240.0" y="700.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">how well learned — built by</text><text x="240.0" y="716.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">reinforced practice, with diminishing returns</text><text x="240.0" y="744.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">K  incentive</text><text x="240.0" y="762.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">how good the reward looks — added later,</text><text x="240.0" y="778.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">and it is where cognition sneaks in</text><rect x="70" y="806" width="340" height="40" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="240.0" y="831.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">any term at zero → no behaviour at all</text><rect x="460" y="488" width="420" height="372" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="670.0" y="516.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">What killed each one</text><rect x="486" y="540" width="368" height="100" rx="9" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="670.0" y="564.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">INSTINCT</text><text x="670.0" y="582.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">James, McDougall</text><text x="670.0" y="602.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">behaviour is innate and species-wide</text><text x="670.0" y="620.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">named 10,000 instincts and explained</text><text x="670.0" y="633.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">nothing — pure circular reasoning</text><rect x="486" y="648" width="368" height="100" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="670.0" y="672.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">DRIVE REDUCTION</text><text x="670.0" y="690.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">Hull, after Cannon</text><text x="670.0" y="710.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">a need makes a tension; behaviour cuts it</text><text x="670.0" y="728.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">cannot explain curiosity, play or</text><text x="670.0" y="741.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">anything that RAISES arousal</text><rect x="486" y="756" width="368" height="100" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="670.0" y="780.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">AROUSAL</text><text x="670.0" y="798.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">Yerkes and Dodson</text><text x="670.0" y="818.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">organisms seek an optimum, not a minimum</text><text x="670.0" y="836.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">still standing — and it absorbed the</text><text x="670.0" y="849.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">problem that sank drive theory</text></svg>