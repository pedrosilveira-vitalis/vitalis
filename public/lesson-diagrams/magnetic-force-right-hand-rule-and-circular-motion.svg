<svg xmlns="http://www.w3.org/2000/svg" width="920" height="824" viewBox="0 0 920 824" role="img" aria-labelledby="t d"><title id="t">The magnetic force turns a charge but never speeds it up</title><desc id="d">Top left: the right-hand rule, with fingers along v, curling toward B, and the thumb giving the force on a positive charge, reversed for a negative one, plus the reminder that the force vanishes when v is parallel to B and is largest when they are perpendicular. Top right: a charge entering a field perpendicular to it and going in a circle of radius r = mv/qB, with the period T = 2 pi m over qB that does not depend on the speed. Middle: a table contrasting the electric force, which acts on any charge, points along E and does work, with the magnetic force, which acts only on moving charges, points perpendicular to both v and B, and does none. Bottom: two parallel wires attracting when their currents run the same way and repelling when they oppose, with the field of a long wire, and the mass spectrometer, where the heavier isotope sweeps the wider arc.</desc><defs><marker id="m6686" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker><marker id="m7771" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker><marker id="m8739" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b7a64"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="824" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">The magnetic force turns a charge but never speeds it up</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">F = qvB sinθ, always perpendicular to v — so it does no work, only curves the path</text><rect x="40" y="126" width="420" height="262" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="250.0" y="154.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">Direction: fingers v, curl to B, thumb F</text><line x1="190" y1="268" x2="308" y2="268" stroke="#18364a" stroke-width="2.6" marker-end="url(#m7771)"/><text x="318.0" y="273.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:17px">v</text><line x1="190" y1="268" x2="190" y2="176" stroke="#5b7a64" stroke-width="2.6" marker-end="url(#m8739)"/><text x="198.0" y="168.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:17px">B</text><line x1="190" y1="268" x2="124" y2="330" stroke="#a8324a" stroke-width="2.6" marker-end="url(#m6686)"/><text x="110.0" y="308.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:bold;font-size:15px">F on +q</text><circle cx="190" cy="268" r="6" fill="#18364a" stroke="#18364a" stroke-width="2"/><text x="250.0" y="352.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">for a negative charge, point the thumb the other way</text><text x="250.0" y="376.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">v ∥ B ⇒ F = 0   •   v ⊥ B ⇒ F = qvB (largest)</text><rect x="476" y="126" width="404" height="262" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="678.0" y="154.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">Perpendicular entry ⇒ a circle</text><circle cx="640" cy="262" r="62" fill="none" stroke="#987740" stroke-width="2.4"/><circle cx="640" cy="262" r="4" fill="#6d716f" stroke="#6d716f" stroke-width="2"/><line x1="640" y1="262" x2="702" y2="262" stroke="#6d716f" stroke-width="1.6" stroke-dasharray="6 5"/><text x="671.0" y="254.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:14px">r</text><circle cx="640" cy="200" r="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><line x1="646" y1="186" x2="694" y2="186" stroke="#18364a" stroke-width="2" marker-end="url(#m7771)"/><text x="670.0" y="178.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">v</text><line x1="640" y1="212" x2="640" y2="248" stroke="#a8324a" stroke-width="2" marker-end="url(#m6686)"/><text x="650.0" y="234.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:14px">F</text><text x="560.0" y="200.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="560.0" y="232.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="560.0" y="264.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="560.0" y="296.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="560.0" y="328.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="590.0" y="200.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="590.0" y="232.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="590.0" y="264.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="590.0" y="296.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="590.0" y="328.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="620.0" y="200.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="620.0" y="232.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="620.0" y="264.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="620.0" y="296.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="620.0" y="328.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="650.0" y="200.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="650.0" y="232.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="650.0" y="264.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="650.0" y="296.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="650.0" y="328.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="680.0" y="200.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="680.0" y="232.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="680.0" y="264.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="680.0" y="296.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="680.0" y="328.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="710.0" y="200.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="710.0" y="232.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="710.0" y="264.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="710.0" y="296.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="710.0" y="328.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="740.0" y="200.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="740.0" y="232.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="740.0" y="264.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="740.0" y="296.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="740.0" y="328.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">×</text><text x="768.0" y="206.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:12px">B into</text><text x="768.0" y="224.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:12px">the page</text><text x="678.0" y="348.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">r = mv/qB  •  T = 2πm/qB</text><text x="678.0" y="374.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">the period does not depend on speed or radius</text><rect x="40" y="408" width="840" height="196" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="436.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">Electric force against magnetic force</text><text x="250.0" y="464.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">F = qE</text><text x="690.0" y="464.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">F = qvB sinθ</text><text x="148.0" y="492.0" class="" text-anchor="end" style="fill:#6d716f;font-size:13px">acts on</text><text x="250.0" y="492.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">any charge, moving or not</text><text x="690.0" y="492.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">only a moving charge</text><text x="148.0" y="518.0" class="" text-anchor="end" style="fill:#6d716f;font-size:13px">direction</text><text x="250.0" y="518.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">along E</text><text x="690.0" y="518.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">⊥ to both v and B</text><text x="148.0" y="544.0" class="" text-anchor="end" style="fill:#6d716f;font-size:13px">does work?</text><text x="250.0" y="544.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">yes — changes speed</text><text x="690.0" y="544.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">never — speed is constant</text><text x="148.0" y="570.0" class="" text-anchor="end" style="fill:#6d716f;font-size:13px">turns it?</text><text x="250.0" y="570.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">yes</text><text x="690.0" y="570.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">yes</text><text x="460.0" y="592.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">so a magnetic field alone can never change a particle&#x27;s kinetic energy</text><rect x="40" y="624" width="404" height="176" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="242.0" y="652.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">Two parallel wires</text><line x1="94" y1="672" x2="94" y2="744" stroke="#6d716f" stroke-width="3"/><line x1="146" y1="672" x2="146" y2="744" stroke="#6d716f" stroke-width="3"/><line x1="94" y1="700" x2="94" y2="678" stroke="#18364a" stroke-width="2" marker-end="url(#m7771)"/><line x1="146" y1="700" x2="146" y2="678" stroke="#18364a" stroke-width="2" marker-end="url(#m7771)"/><line x1="104" y1="756" x2="118" y2="756" stroke="#5b7a64" stroke-width="2" marker-end="url(#m8739)"/><line x1="136" y1="756" x2="122" y2="756" stroke="#5b7a64" stroke-width="2" marker-end="url(#m8739)"/><text x="120.0" y="782.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">same way: attract</text><line x1="284" y1="672" x2="284" y2="744" stroke="#6d716f" stroke-width="3"/><line x1="336" y1="672" x2="336" y2="744" stroke="#6d716f" stroke-width="3"/><line x1="284" y1="700" x2="284" y2="678" stroke="#18364a" stroke-width="2" marker-end="url(#m7771)"/><line x1="336" y1="700" x2="336" y2="722" stroke="#18364a" stroke-width="2" marker-end="url(#m7771)"/><line x1="308" y1="756" x2="292" y2="756" stroke="#a8324a" stroke-width="2" marker-end="url(#m6686)"/><line x1="312" y1="756" x2="328" y2="756" stroke="#a8324a" stroke-width="2" marker-end="url(#m6686)"/><text x="310.0" y="782.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">opposite: repel</text><rect x="466" y="624" width="414" height="176" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="673.0" y="652.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">Mass spectrometer</text><line x1="520" y1="764" x2="860" y2="764" stroke="#6d716f" stroke-width="2"/><circle cx="520" cy="764" r="5" fill="#18364a" stroke="#18364a" stroke-width="2"/><path d="M520 764 A 44 44 0 0 1 608 764" stroke="#245574" stroke-width="2.4" fill="none"/><text x="564.0" y="738.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">lighter</text><path d="M520 764 A 70 70 0 0 1 660 764" stroke="#a8324a" stroke-width="2.4" fill="none"/><text x="590.0" y="712.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">heavier</text><text x="673.0" y="786.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">r = mv/qB, so the heavier ion lands further along</text><text x="673.0" y="680.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">velocity selector first: qE = qvB ⇒ v = E/B</text></svg>