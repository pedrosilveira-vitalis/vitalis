<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900" role="img" aria-labelledby="t d"><title id="t">Kₛₚ is not solubility</title><desc id="d">A table converts the solubility product to molar solubility for four formula types. For a one-to-one salt such as silver chloride, the solubility product equals s squared and s is its square root, giving 1.3 times ten to the minus five molar from a solubility product of 1.8 times ten to the minus ten. For a one-to-two salt such as calcium fluoride, and equally for a two-to-one salt such as silver chromate, the solubility product equals four s cubed and s is the cube root of the solubility product over four: calcium fluoride at 3.9 times ten to the minus eleven gives 2.1 times ten to the minus four, and silver chromate at 1.1 times ten to the minus twelve gives 6.5 times ten to the minus five. For a three-to-two salt such as calcium phosphate, the solubility product equals 108 s to the fifth and s is the fifth root of the solubility product over 108, giving about 1.1 times ten to the minus seven from 2.1 times ten to the minus thirty-three. A panel drives the point home: silver chromate has a solubility product about 160 times smaller than silver chloride, yet dissolves about five times more, because its formula releases three ions instead of two. A second panel shows selective precipitation on a logarithmic chloride axis: starting from 0.10 molar silver and lead ions, silver chloride begins to precipitate once chloride reaches 1.8 times ten to the minus nine molar, while lead chloride does not begin until chloride reaches about 0.013 molar, leaving roughly seven orders of magnitude of chloride concentration in which silver is removed and lead is untouched. A footer gives the comparison of the ion product with the solubility product: below it the solution is unsaturated and more solid dissolves, equal to it the solution is saturated, above it the solution is supersaturated and solid precipitates until they match; and warns that when two solutions are mixed every concentration must first be recomputed for the combined volume, since forgetting the dilution is the commonest way these questions are lost.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1180" height="900" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Kₛₚ is not solubility</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">The exponent pattern changes with the formula, so two salts can rank one way by Kₛₚ and the opposite way by how much actually dissolves. Convert first, then compare.</text><rect x="24" y="150" width="1128" height="246" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="588.0" y="178.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13.5px">Kₛₚ → MOLAR SOLUBILITY, BY FORMULA TYPE</text><text x="70.0" y="204.0" class="" text-anchor="start" style="fill:#6d716f;font-size:9.5px">TYPE</text><text x="250.0" y="204.0" class="" text-anchor="start" style="fill:#6d716f;font-size:9.5px">DISSOLUTION</text><text x="560.0" y="204.0" class="" text-anchor="end" style="fill:#6d716f;font-size:9.5px">Kₛₚ IN TERMS OF S</text><text x="790.0" y="204.0" class="" text-anchor="start" style="fill:#6d716f;font-size:9.5px">S FROM Kₛₚ</text><text x="1120.0" y="204.0" class="" text-anchor="end" style="fill:#6d716f;font-size:9.5px">WORKED</text><text x="70.0" y="234.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:13px">MX</text><text x="250.0" y="234.0" class="" text-anchor="start" style="fill:#18364a;font-size:11.5px">MX ⇌ M⁺ + X⁻</text><text x="560.0" y="234.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:11.5px">K = s²</text><text x="790.0" y="234.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:12px">s = √K</text><text x="1120.0" y="234.0" class="" text-anchor="end" style="fill:#6d716f;font-size:11px">AgCl  1.8×10⁻¹⁰  →  1.3×10⁻⁵ M</text><text x="70.0" y="268.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:13px">MX₂</text><text x="250.0" y="268.0" class="" text-anchor="start" style="fill:#18364a;font-size:11.5px">MX₂ ⇌ M²⁺ + 2X⁻</text><text x="560.0" y="268.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:11.5px">K = s(2s)² = 4s³</text><text x="790.0" y="268.0" class="" text-anchor="end" style="fill:#245574;font-weight:700;font-size:12px">s = ∛(K/4)</text><text x="1120.0" y="268.0" class="" text-anchor="end" style="fill:#6d716f;font-size:11px">CaF₂  3.9×10⁻¹¹  →  2.1×10⁻⁴ M</text><text x="70.0" y="302.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:13px">M₂X</text><text x="250.0" y="302.0" class="" text-anchor="start" style="fill:#18364a;font-size:11.5px">M₂X ⇌ 2M⁺ + X²⁻</text><text x="560.0" y="302.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:11.5px">K = (2s)²s = 4s³</text><text x="790.0" y="302.0" class="" text-anchor="end" style="fill:#245574;font-weight:700;font-size:12px">s = ∛(K/4)</text><text x="1120.0" y="302.0" class="" text-anchor="end" style="fill:#6d716f;font-size:11px">Ag₂CrO₄  1.1×10⁻¹²  →  6.5×10⁻⁵ M</text><text x="70.0" y="336.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:700;font-size:13px">M₃X₂</text><text x="250.0" y="336.0" class="" text-anchor="start" style="fill:#18364a;font-size:11.5px">M₃X₂ ⇌ 3M²⁺ + 2X³⁻</text><text x="560.0" y="336.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:11.5px">K = (3s)³(2s)² = 108s⁵</text><text x="790.0" y="336.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:700;font-size:12px">s = ⁵√(K/108)</text><text x="1120.0" y="336.0" class="" text-anchor="end" style="fill:#6d716f;font-size:11px">Ca₃(PO₄)₂  2.1×10⁻³³  →  1.1×10⁻⁷ M</text><text x="588.0" y="378.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:11.5px">MX₂ and M₂X give the SAME formula — what matters is how many ions, not which one is doubled</text><rect x="24" y="418" width="448" height="206" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="248.0" y="446.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12.5px">THE TRAP THIS LESSON IS BUILT AROUND</text><text x="48.0" y="486.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12px">AgCl</text><text x="48.0" y="504.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">Kₛₚ 1.8×10⁻¹⁰</text><rect x="170" y="474" width="37.10769230769231" height="20" rx="4" fill="#18364a" stroke="#18364a" stroke-width="0"/><text x="215.1" y="488.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:11.5px">1.34×10⁻⁵ M</text><text x="48.0" y="538.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12px">Ag₂CrO₄</text><text x="48.0" y="556.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">Kₛₚ 1.1×10⁻¹²</text><rect x="170" y="526" width="180.0" height="20" rx="4" fill="#a8324a" stroke="#a8324a" stroke-width="0"/><text x="358.0" y="540.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:700;font-size:11.5px">6.50×10⁻⁵ M</text><text x="248.0" y="596.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:11.5px">160× the smaller Kₛₚ — and 5× the solubility</text><rect x="492" y="418" width="660" height="206" rx="12" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="822.0" y="446.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:12.5px">SELECTIVE PRECIPITATION — THE WINDOW</text><text x="822.0" y="466.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">starting from 0.10 M Ag⁺ and 0.10 M Pb²⁺, adding Cl⁻ slowly</text><line x1="540" y1="540" x2="1110" y2="540" stroke="#18364a" stroke-width="2"/><line x1="540.0" y1="540" x2="540.0" y2="545" stroke="#18364a" stroke-width="1"/><text x="540.0" y="558.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">10⁻¹⁰</text><line x1="654.0" y1="540" x2="654.0" y2="545" stroke="#18364a" stroke-width="1"/><text x="654.0" y="558.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">10⁻⁸</text><line x1="768.0" y1="540" x2="768.0" y2="545" stroke="#18364a" stroke-width="1"/><text x="768.0" y="558.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">10⁻⁶</text><line x1="882.0" y1="540" x2="882.0" y2="545" stroke="#18364a" stroke-width="1"/><text x="882.0" y="558.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">10⁻⁴</text><line x1="996.0" y1="540" x2="996.0" y2="545" stroke="#18364a" stroke-width="1"/><text x="996.0" y="558.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">10⁻²</text><line x1="1110.0" y1="540" x2="1110.0" y2="545" stroke="#18364a" stroke-width="1"/><text x="1110.0" y="558.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">1 M</text><line x1="611.5505327908885" y1="504" x2="611.5505327908885" y2="540" stroke="#18364a" stroke-width="2" stroke-dasharray="6 5"/><text x="611.6" y="480.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:10.5px">AgCl starts</text><text x="611.6" y="494.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:10.5px">1.8×10⁻⁹ M</text><line x1="1002.4947710814897" y1="504" x2="1002.4947710814897" y2="540" stroke="#a8324a" stroke-width="2" stroke-dasharray="6 5"/><text x="1002.5" y="480.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:10.5px">PbCl₂ starts</text><text x="1002.5" y="494.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:10.5px">0.013 M</text><line x1="611.5505327908885" y1="532" x2="1002.4947710814897" y2="532" stroke="#5b7a64" stroke-width="7"/><text x="822.0" y="600.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:11px">≈ 7 orders of magnitude of [Cl⁻] in which Ag⁺ is gone and Pb²⁺ is untouched</text><rect x="24" y="648" width="1128" height="110" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="588.0" y="676.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12.5px">COMPARE THE ION PRODUCT WITH Kₛₚ — SAME LOGIC AS Q vs K ANYWHERE ELSE</text><text x="100.0" y="708.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:13px">Q &lt; Kₛₚ</text><text x="202.0" y="708.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12px">unsaturated</text><text x="100.0" y="730.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">more solid dissolves</text><text x="476.0" y="708.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:13px">Q = Kₛₚ</text><text x="578.0" y="708.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12px">saturated</text><text x="476.0" y="730.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">no net change</text><text x="852.0" y="708.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:13px">Q &gt; Kₛₚ</text><text x="954.0" y="708.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12px">supersaturated</text><text x="852.0" y="730.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">precipitates until Q = Kₛₚ</text><rect x="24" y="778" width="1128" height="92" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="588.0" y="808.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13.5px">Before you compute Q, dilute</text><text x="588.0" y="829.5" class="" text-anchor="middle" style="font-size:12px">Mixing two solutions dilutes BOTH: C_final = C_initial × V_initial / V_total. Mixing equal volumes halves every concentration, and for an MX₂ salt</text><text x="588.0" y="846.5" class="" text-anchor="middle" style="font-size:12px">that drops Q eightfold — enough to turn a predicted precipitate into a clear solution. Also: only ions that appear in the Kₛₚ expression exert a</text><text x="588.0" y="863.5" class="" text-anchor="middle" style="font-size:12px">common ion effect. Adding NaNO₃ to AgCl does nothing.</text></svg>