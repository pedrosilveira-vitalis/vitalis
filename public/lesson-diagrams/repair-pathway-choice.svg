<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-labelledby="title desc"><title id="title">Choose the repair action</title><desc id="desc">A damaged base is removed by a glycosylase in base excision repair, a photoproduct-containing segment is excised in nucleotide excision repair, and a mismatch-containing new strand segment is replaced in mismatch repair. Broken ends may be copied from a sister or joined.</desc><rect width="960" height="820" rx="22" fill="#fbf7ef"/><style>text{font-family:Arial,sans-serif;fill:#18364a;font-size:20px}.title{font-size:28px;font-weight:700}.head{font-size:23px;font-weight:700}.small{font-size:17px}.mono{font-family:monospace;font-size:23px}.white{fill:white}</style><text x="32" y="44" class="title" text-anchor="start">What is removed—and what supplies the template?</text><rect x="24" y="80" width="912" height="152" rx="10" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><rect x="24" y="255" width="912" height="152" rx="10" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><rect x="24" y="430" width="912" height="152" rx="10" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><rect x="24" y="605" width="912" height="152" rx="10" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="42" y="111" class="head" text-anchor="start">BER · remove a damaged base</text><path d="M38 148 L280 148" stroke="#245574" stroke-width="2" fill="none"/><rect x="48" y="132" width="50" height="33" rx="4" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="73" y="155" class="small" text-anchor="middle">A</text><rect x="106" y="132" width="50" height="33" rx="4" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="131" y="155" class="small" text-anchor="middle">G*</text><rect x="164" y="132" width="50" height="33" rx="4" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="189" y="155" class="small" text-anchor="middle">T</text><rect x="222" y="132" width="50" height="33" rx="4" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="247" y="155" class="small" text-anchor="middle">C</text><path d="M38 191 L280 191" stroke="#245574" stroke-width="2" fill="none"/><rect x="48" y="175" width="50" height="33" rx="4" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="73" y="198" class="small" text-anchor="middle">T</text><rect x="106" y="175" width="50" height="33" rx="4" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="131" y="198" class="small" text-anchor="middle">C</text><rect x="164" y="175" width="50" height="33" rx="4" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="189" y="198" class="small" text-anchor="middle">A</text><rect x="222" y="175" width="50" height="33" rx="4" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="247" y="198" class="small" text-anchor="middle">G</text><text x="390" y="151" class="small" text-anchor="start">G* = oxidized guanine</text><path d="M350 175 L450 175" stroke="#245574" stroke-width="2" fill="none"/><path d="M440 169 L450 175 L440 181" fill="none" stroke="#245574" stroke-width="2"/><text x="475" y="176" class="head" text-anchor="start">Base removal → gap repair</text><text x="475" y="210" class="small" text-anchor="start">Complementary strand guides replacement.</text><text x="55" y="217" class="small" text-anchor="start">Template strand</text><text x="42" y="286" class="head" text-anchor="start">NER · excise a lesion-containing segment</text><path d="M38 324 L280 324" stroke="#245574" stroke-width="2" fill="none"/><rect x="48" y="308" width="50" height="33" rx="4" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="73" y="331" class="small" text-anchor="middle">A</text><rect x="106" y="308" width="50" height="33" rx="4" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="131" y="331" class="small" text-anchor="middle">T</text><rect x="164" y="308" width="50" height="33" rx="4" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="189" y="331" class="small" text-anchor="middle">T</text><rect x="222" y="308" width="50" height="33" rx="4" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="247" y="331" class="small" text-anchor="middle">C</text><path d="M38 367 L280 367" stroke="#245574" stroke-width="2" fill="none"/><rect x="48" y="351" width="50" height="33" rx="4" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="73" y="374" class="small" text-anchor="middle">T</text><rect x="106" y="351" width="50" height="33" rx="4" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="131" y="374" class="small" text-anchor="middle">A</text><rect x="164" y="351" width="50" height="33" rx="4" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="189" y="374" class="small" text-anchor="middle">A</text><rect x="222" y="351" width="50" height="33" rx="4" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="247" y="374" class="small" text-anchor="middle">G</text><path d="M130 303 L188 303" stroke="#245574" stroke-width="2" fill="none"/><path d="M130 303 L130 309" stroke="#245574" stroke-width="2" fill="none"/><path d="M188 303 L188 309" stroke="#245574" stroke-width="2" fill="none"/><text x="390" y="327" class="small" text-anchor="start">Covalently linked pyrimidines</text><path d="M350 366 L450 366" stroke="#245574" stroke-width="2" fill="none"/><path d="M440 360 L450 366 L440 372" fill="none" stroke="#245574" stroke-width="2"/><text x="475" y="367" class="head" text-anchor="start">Cut on both sides → fill gap</text><text x="475" y="394" class="small" text-anchor="start">Human excised patch: roughly 25–30 nt.</text><text x="42" y="461" class="head" text-anchor="start">MMR · replace the new-strand error</text><path d="M38 499 L280 499" stroke="#245574" stroke-width="2" fill="none"/><rect x="48" y="483" width="50" height="33" rx="4" fill="#dce9f0" stroke="#bdd0dc" stroke-width="2"/><text x="73" y="506" class="small" text-anchor="middle">A</text><rect x="106" y="483" width="50" height="33" rx="4" fill="#dce9f0" stroke="#bdd0dc" stroke-width="2"/><text x="131" y="506" class="small" text-anchor="middle">G</text><rect x="164" y="483" width="50" height="33" rx="4" fill="#dce9f0" stroke="#bdd0dc" stroke-width="2"/><text x="189" y="506" class="small" text-anchor="middle">T</text><rect x="222" y="483" width="50" height="33" rx="4" fill="#dce9f0" stroke="#bdd0dc" stroke-width="2"/><text x="247" y="506" class="small" text-anchor="middle">C</text><path d="M38 542 L280 542" stroke="#245574" stroke-width="2" fill="none"/><rect x="48" y="526" width="50" height="33" rx="4" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="73" y="549" class="small" text-anchor="middle">T</text><rect x="106" y="526" width="50" height="33" rx="4" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="131" y="549" class="small" text-anchor="middle">T</text><rect x="164" y="526" width="50" height="33" rx="4" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="189" y="549" class="small" text-anchor="middle">A</text><rect x="222" y="526" width="50" height="33" rx="4" fill="#fff" stroke="#bdd0dc" stroke-width="2"/><text x="247" y="549" class="small" text-anchor="middle">G</text><text x="390" y="503" class="small" text-anchor="start">G:T mismatch</text><path d="M350 541 L450 541" stroke="#245574" stroke-width="2" fill="none"/><path d="M440 535 L450 541 L440 547" fill="none" stroke="#245574" stroke-width="2"/><text x="475" y="542" class="head" text-anchor="start">Identify new strand → replace</text><text x="475" y="570" class="small" text-anchor="start">Light-blue strand is newly synthesized.</text><text x="42" y="637" class="head" text-anchor="start">Double-strand break · copy or join</text><path d="M48 679 L165 679" stroke="#245574" stroke-width="2" fill="none"/><path d="M48 692 L165 692" stroke="#245574" stroke-width="2" fill="none"/><path d="M192 679 L305 679" stroke="#245574" stroke-width="2" fill="none"/><path d="M192 692 L305 692" stroke="#245574" stroke-width="2" fill="none"/><path d="M330 684 L425 684" stroke="#245574" stroke-width="2" fill="none"/><path d="M415 678 L425 684 L415 690" fill="none" stroke="#245574" stroke-width="2"/><text x="450" y="681" class="head" text-anchor="start">HR: copy a homologous template</text><text x="450" y="714" class="head" text-anchor="start">End joining: reconnect ends</text><text x="450" y="743" class="small" text-anchor="start">Compatible ends can be joined accurately.</text><text x="32" y="793" class="small" text-anchor="start">Schematic DNA segments, not atomic structures or nucleotide-scale patch lengths.</text></svg>