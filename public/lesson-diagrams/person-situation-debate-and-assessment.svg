<svg xmlns="http://www.w3.org/2000/svg" width="920" height="900" viewBox="0 0 920 900" role="img" aria-labelledby="t d"><title id="t">Does the person predict the act, or does the room?</title><desc id="d">Top: the argument in sequence. Trait theory promised prediction; Mischel counted the correlations and found them stuck around 0.30, which is nine per cent of the variance; Epstein pointed out that one observation is one test item, and that averaging fourteen days of behaviour pushes the same correlations to 0.7 or 0.8; and the field settled on interaction, with Mischel himself supplying its best version. Middle: situational strength, which decides when a trait gets to show at all — traits predict in the weak room and go quiet in the strong one. Bottom left: if-then signatures, the reformulation that makes consistency compatible with varying behaviour. Bottom right: the two families of test and what each one trades away.</desc><defs><marker id="m5165" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="900" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Does the person predict the act, or does the room?</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">The answer turned out to be: ask how many acts, and how strong the room</text><rect x="40" y="174" width="840" height="190" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="202.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">How the debate actually went</text><rect x="62" y="222" width="198" height="108" rx="10" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="161.0" y="248.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">TRAIT THEORY</text><text x="161.0" y="276.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">know the person,</text><text x="161.0" y="300.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">predict the behaviour</text><line x1="260" y1="276" x2="268" y2="276" stroke="#6d716f" stroke-width="1.8" marker-end="url(#m5165)"/><rect x="268" y="222" width="198" height="108" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="367.0" y="248.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">MISCHEL 1968</text><text x="367.0" y="276.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">r ≈ 0.30 across situations</text><text x="367.0" y="300.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">only 9% of the variance</text><line x1="466" y1="276" x2="474" y2="276" stroke="#6d716f" stroke-width="1.8" marker-end="url(#m5165)"/><rect x="474" y="222" width="198" height="108" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="573.0" y="248.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">EPSTEIN</text><text x="573.0" y="276.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">one act = one test item</text><text x="573.0" y="300.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">average 14 days → r ≈ 0.7–0.8</text><line x1="672" y1="276" x2="680" y2="276" stroke="#6d716f" stroke-width="1.8" marker-end="url(#m5165)"/><rect x="680" y="222" width="198" height="108" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="779.0" y="248.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">INTERACTIONISM</text><text x="779.0" y="276.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">B = f(P × S)</text><text x="779.0" y="300.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">and Mischel wrote it</text><text x="460.0" y="350.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">the fight was never traits versus situations — it was how to measure either one properly</text><rect x="40" y="384" width="840" height="186" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="412.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">Situational strength decides whether a trait can show</text><rect x="70" y="432" width="380" height="122" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="260.0" y="456.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">STRONG SITUATION</text><text x="260.0" y="480.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">clear norms · real consequences · no ambiguity</text><text x="260.0" y="504.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">a job interview · a funeral · a drill</text><text x="260.0" y="532.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">everyone behaves the same → traits predict badly</text><rect x="470" y="432" width="380" height="122" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="660.0" y="456.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">WEAK SITUATION</text><text x="660.0" y="480.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">ambiguous · unstructured · little pressure</text><text x="660.0" y="504.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">a free afternoon · an open task · a party</text><text x="660.0" y="532.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">people diverge → traits predict well</text><rect x="40" y="590" width="420" height="278" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="250.0" y="618.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">If-then signatures</text><text x="250.0" y="644.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">the same child, two settings</text><rect x="66" y="664" width="368" height="48" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="176.0" y="693.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">IF teased by peers</text><text x="330.0" y="693.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">THEN aggressive</text><rect x="66" y="718" width="368" height="48" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="176.0" y="747.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">IF asked by an adult</text><text x="330.0" y="747.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">THEN cooperative</text><rect x="66" y="772" width="368" height="48" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="176.0" y="801.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">IF the task is open-ended</text><text x="330.0" y="801.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">THEN persistent</text><text x="250.0" y="836.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">the behaviour varies; the PATTERN does not</text><text x="250.0" y="856.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">that stable pattern is the personality</text><rect x="480" y="590" width="400" height="278" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="680.0" y="618.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">Two families of test</text><rect x="506" y="638" width="348" height="106" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="680.0" y="662.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">PROJECTIVE · Rorschach, TAT</text><text x="680.0" y="684.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">ambiguous stimulus, interpreted response</text><text x="680.0" y="706.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">harder to fake · reaches implicit material</text><text x="680.0" y="728.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:11px">lower reliability, shakier validity</text><rect x="506" y="756" width="348" height="106" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="680.0" y="780.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">OBJECTIVE · MMPI, NEO-PI</text><text x="680.0" y="802.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">fixed items, scored by key, no interpreter</text><text x="680.0" y="824.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">reliable · researchable · strong norms</text><text x="680.0" y="846.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:11px">easy to fake — hence the MMPI&#x27;s L, F and K scales</text></svg>