<svg xmlns="http://www.w3.org/2000/svg" width="920" height="810" viewBox="0 0 920 810" role="img" aria-labelledby="t d"><title id="t">Radius to the fourth power decides almost everything</title><desc id="d">Top left: bars showing how flow falls as the radius shrinks — 100 percent at full radius, 41 percent at 0.8, 32 percent at 0.75 and about 6 percent at half the radius. Top right: the parabolic velocity profile in a tube, fastest on the axis, zero at the wall, with the mean equal to half the maximum. Bottom left: resistance equals 8 eta L over pi r to the fourth, with the Ohm&#x27;s law analogy and the series and parallel rules. Bottom right: the Reynolds number scale from laminar below 2000 to turbulent above 4000, and a note that murmurs and bruits are turbulence while the normal heart sounds are valve closure.</desc><defs><marker id="m6914" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="810" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Radius to the fourth power decides almost everything</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Q = πr⁴ΔP/8ηL, so a small squeeze on an arteriole does what no pressure change can</text><rect x="40" y="112" width="416" height="318" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="248.0" y="142.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">What a little narrowing costs</text><text x="176.0" y="206.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:15px">r</text><rect x="190" y="186" width="236.0" height="30" rx="4" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="438.0" y="206.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:15px">100%</text><text x="176.0" y="252.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:15px">0.8r</text><rect x="190" y="232" width="96.6656" height="30" rx="4" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="298.7" y="252.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:15px">41%</text><text x="176.0" y="298.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:15px">0.75r</text><rect x="190" y="278" width="74.6704" height="30" rx="4" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="276.7" y="298.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:15px">32%</text><text x="176.0" y="344.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:15px">0.5r</text><rect x="190" y="324" width="14.75" height="30" rx="4" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="216.8" y="344.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:15px">6%</text><text x="248.0" y="388.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">flow ∝ r⁴  •  resistance ∝ 1/r⁴</text><text x="248.0" y="412.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">a 25% narrower coronary carries a third of the blood</text><rect x="472" y="112" width="408" height="318" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="676.0" y="142.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">Laminar flow is parabolic</text><rect x="540" y="190" width="280" height="150" rx="0" fill="#e4edf3" stroke="#245574" stroke-width="0"/><line x1="540" y1="190" x2="820" y2="190" stroke="#18364a" stroke-width="3"/><line x1="540" y1="340" x2="820" y2="340" stroke="#18364a" stroke-width="3"/><line x1="564" y1="200.0" x2="566" y2="200.0" stroke="#18364a" stroke-width="2" marker-end="url(#m6914)"/><line x1="564" y1="221.66666666666666" x2="647.3333333333333" y2="221.66666666666666" stroke="#18364a" stroke-width="2" marker-end="url(#m6914)"/><line x1="564" y1="243.33333333333334" x2="697.3333333333334" y2="243.33333333333334" stroke="#18364a" stroke-width="2" marker-end="url(#m6914)"/><line x1="564" y1="265.0" x2="714.0" y2="265.0" stroke="#18364a" stroke-width="2" marker-end="url(#m6914)"/><line x1="564" y1="286.6666666666667" x2="697.3333333333333" y2="286.6666666666667" stroke="#18364a" stroke-width="2" marker-end="url(#m6914)"/><line x1="564" y1="308.3333333333333" x2="647.3333333333334" y2="308.3333333333333" stroke="#18364a" stroke-width="2" marker-end="url(#m6914)"/><line x1="564" y1="330.0" x2="566" y2="330.0" stroke="#18364a" stroke-width="2" marker-end="url(#m6914)"/><path d="M566.0 200.0 L647.3 221.7 L697.3 243.3 L714.0 265.0 L697.3 286.7 L647.3 308.3 L566.0 330.0" stroke="#a8324a" stroke-width="2.5" fill="none"/><text x="550.0" y="180.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">no slip at the wall: v = 0</text><text x="736.0" y="270.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:13px">v_max on the axis</text><text x="676.0" y="372.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">v_mean = v_max / 2</text><text x="676.0" y="398.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">cells drift to the fast centre, leaving a plasma layer at the wall</text><text x="676.0" y="420.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">(the Fåhræus–Lindqvist effect in small vessels)</text><rect x="40" y="450" width="416" height="212" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="248.0" y="478.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">Resistance behaves like a circuit</text><text x="248.0" y="512.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">R = 8ηL / πr⁴   •   ΔP = Q · R</text><text x="248.0" y="544.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">ΔP ↔ voltage   •   Q ↔ current   •   R ↔ resistance</text><rect x="62" y="562" width="180" height="76" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="152.0" y="588.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">in series</text><text x="152.0" y="614.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">R = R₁ + R₂ + …</text><rect x="254" y="562" width="180" height="76" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="344.0" y="588.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">in parallel</text><text x="344.0" y="614.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">1/R = 1/R₁ + 1/R₂ + …</text><rect x="472" y="450" width="408" height="212" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="676.0" y="478.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:17px">Will it stay laminar?</text><text x="676.0" y="506.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">Re = ρvd / η</text><rect x="496" y="524" width="128" height="38" rx="6" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="560.0" y="548.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">laminar</text><text x="560.0" y="580.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Re &lt; 2,000</text><rect x="632" y="524" width="92" height="38" rx="6" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="678.0" y="548.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">mixed</text><text x="678.0" y="580.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">2,000–4,000</text><rect x="736" y="524" width="128" height="38" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="800.0" y="548.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">turbulent</text><text x="800.0" y="580.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Re &gt; 4,000</text><text x="676.0" y="612.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">raised by v, d and ρ  •  damped by η</text><text x="676.0" y="636.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">anaemia: thinner blood and faster flow ⇒ flow murmurs</text><text x="460.0" y="700.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">Murmurs and bruits are turbulence — S1 and S2 are valves closing, not turbulent flow</text><text x="460.0" y="732.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Blood is shear-thinning: rouleaux raise its viscosity when flow is slow</text><text x="460.0" y="762.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Arterioles are the resistance vessels; capillaries are slow because they are many</text><text x="460.0" y="792.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Whole blood ≈ 3–4 cP  •  plasma ≈ 1.2–1.5 cP  •  water at 37°C ≈ 0.7 cP</text></svg>