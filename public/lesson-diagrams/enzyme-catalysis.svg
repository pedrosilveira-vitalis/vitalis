<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">Catalysts change the route not the destination</title><desc id="desc">Two schematic free energy profiles have the same reactants and products. The catalyzed route has a lower barrier. kcat measures saturated turnover; kcat over Km describes low substrate efficiency. B12 cofactors have distinct roles.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#aa3653;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">Catalysts change the route, not the destination</text><rect x="24" y="60" width="752" height="330" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="94" class="h" text-anchor="start">1  Lower barrier • same equilibrium</text><path d="M100 330 L735 330" class="bond" /><path d="M100 330 L100 120" class="bond" /><text x="112" y="128" class="s" text-anchor="start">Free energy</text><text x="420" y="371" class="s" text-anchor="middle">Reaction progress</text><path d="M130 268 C240 268 240 150 350 150 S470 304 570 304 H700" fill="none" stroke="#24495c" stroke-width="4"/><path d="M130 268 C240 268 260 220 350 220 S470 304 570 304 H700" fill="none" stroke="#a8324a" stroke-width="4"/><text x="430" y="158" class="s" text-anchor="start">Uncatalyzed</text><text x="430" y="218" class="s" text-anchor="start">Catalyzed</text><text x="134" y="296" class="s" text-anchor="start">Reactants</text><text x="604" y="292" class="s" text-anchor="start">Products</text><rect x="24" y="406" width="752" height="143" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="441" class="h" text-anchor="start">2  Turnover and efficiency are different</text><text x="65" y="484" class="t" text-anchor="start">kcat: turnover per active site at saturating substrate</text><text x="65" y="520" class="t" text-anchor="start">kcat/Km: efficiency when substrate concentration is low</text><rect x="24" y="565" width="752" height="151" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="600" class="h" text-anchor="start">3  Two B12 coenzymes, two roles</text><text x="65" y="644" class="t" text-anchor="start">Methylcobalamin → methyl-group transfer</text><text x="65" y="684" class="t" text-anchor="start">Adenosylcobalamin → radical rearrangements</text></svg>