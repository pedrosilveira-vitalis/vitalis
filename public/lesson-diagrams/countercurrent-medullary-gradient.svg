<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="t d"><title id="t">Building and using the medullary gradient</title><desc id="d">A loop of Henle runs from cortex to papilla. The descending limb loses water (AQP1), so its fluid rises from 300 to about 1200 mOsm/kg at the bend. The thick ascending limb pumps NaCl out via NKCC2 without water, so fluid leaving the loop is about 100 mOsm/kg. The interstitium rises from 300 at the corticomedullary junction to about 1200 at the papilla, roughly half NaCl and half urea deep in the inner medulla. Beside it, the collecting duct with ADH inserts AQP2 and loses water to the interstitium, making urine up to about 1200 mOsm/kg; without ADH, urine can be as dilute as about 50 mOsm/kg. Vasa recta preserve the gradient by countercurrent exchange.</desc><defs><marker id="m176" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker><marker id="m2496" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker><marker id="m5021" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="700" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Building and using the medullary gradient</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Long-looped nephron with maximal ADH; osmolalities in mOsm/kg are classic textbook values.</text><rect x="60" y="130" width="620" height="48" fill="rgb(250,237,225)" opacity="0.55"/><rect x="60" y="178" width="620" height="48" fill="rgb(236,223,211)" opacity="0.55"/><rect x="60" y="226" width="620" height="48" fill="rgb(222,209,197)" opacity="0.55"/><rect x="60" y="274" width="620" height="48" fill="rgb(208,195,183)" opacity="0.55"/><rect x="60" y="322" width="620" height="48" fill="rgb(194,181,169)" opacity="0.55"/><rect x="60" y="370" width="620" height="48" fill="rgb(180,167,155)" opacity="0.55"/><rect x="60" y="418" width="620" height="48" fill="rgb(166,153,141)" opacity="0.55"/><rect x="60" y="466" width="620" height="48" fill="rgb(152,139,127)" opacity="0.55"/><rect x="60" y="514" width="620" height="48" fill="rgb(138,125,113)" opacity="0.55"/><rect x="60" y="562" width="620" height="48" fill="rgb(124,111,99)" opacity="0.55"/><text x="80.0" y="122.0" class="" text-anchor="start" style="fill:#6d716f;font-size:14px">Cortex</text><text x="80.0" y="625.0" class="" text-anchor="start" style="fill:#6d716f;font-size:14px">Papilla</text><text x="470.0" y="160.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:16px">300</text><text x="470.0" y="300.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:16px">600</text><text x="470.0" y="440.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:16px">900</text><text x="470.0" y="590.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:16px">1200</text><text x="470.0" y="122.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">Interstitium</text><path d="M200 130 L200 560 Q260 620 320 560 L320 130" stroke="#245574" stroke-width="16" fill="none"/><path d="M200 130 L200 560 Q260 620 320 560 L320 130" stroke="#fbf7ef" stroke-width="10" fill="none"/><text x="180.0" y="170.0" class="" text-anchor="end" style="fill:#245574;font-size:15px">300</text><text x="180.0" y="310.0" class="" text-anchor="end" style="fill:#245574;font-size:15px">600</text><text x="180.0" y="450.0" class="" text-anchor="end" style="fill:#245574;font-size:15px">900</text><text x="180.0" y="570.0" class="" text-anchor="end" style="fill:#245574;font-size:15px">1200</text><text x="340.0" y="560.0" class="" text-anchor="start" style="fill:#a8324a;font-size:15px">1200</text><text x="340.0" y="330.0" class="" text-anchor="start" style="fill:#a8324a;font-size:15px">400</text><text x="340.0" y="160.0" class="" text-anchor="start" style="fill:#a8324a;font-size:15px">100</text><text x="195.0" y="650.0" class="" text-anchor="end" style="fill:#245574;font-weight:700;font-size:15px">Descending limb</text><text x="325.0" y="650.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:700;font-size:15px">Ascending limb</text><line x1="198" y1="220" x2="140" y2="220" stroke="#245574" stroke-width="2" marker-end="url(#m5021)"/><text x="120.0" y="214.0" class="" text-anchor="end" style="fill:#245574;font-size:13px">H₂O</text><line x1="198" y1="360" x2="140" y2="360" stroke="#245574" stroke-width="2" marker-end="url(#m5021)"/><text x="120.0" y="354.0" class="" text-anchor="end" style="fill:#245574;font-size:13px">H₂O</text><line x1="198" y1="480" x2="140" y2="480" stroke="#245574" stroke-width="2" marker-end="url(#m5021)"/><text x="120.0" y="474.0" class="" text-anchor="end" style="fill:#245574;font-size:13px">H₂O</text><line x1="322" y1="180" x2="390" y2="180" stroke="#a8324a" stroke-width="2" marker-end="url(#m2496)"/><line x1="322" y1="260" x2="390" y2="260" stroke="#a8324a" stroke-width="2" marker-end="url(#m2496)"/><text x="395.0" y="185.0" class="" text-anchor="start" style="fill:#a8324a;font-size:13px">NaCl (NKCC2,</text><text x="395.0" y="202.0" class="" text-anchor="start" style="fill:#a8324a;font-size:13px">no water)</text><rect x="600" y="130" width="50" height="470" rx="10" fill="#fbf7ef" stroke="#18364a" stroke-width="2"/><text x="625.0" y="650.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:15px">Collecting duct</text><line x1="598" y1="260" x2="540" y2="260" stroke="#18364a" stroke-width="2" marker-end="url(#m176)"/><text x="535.0" y="254.0" class="" text-anchor="end" style="fill:#18364a;font-size:13px">H₂O</text><line x1="598" y1="400" x2="540" y2="400" stroke="#18364a" stroke-width="2" marker-end="url(#m176)"/><text x="535.0" y="394.0" class="" text-anchor="end" style="fill:#18364a;font-size:13px">H₂O</text><line x1="598" y1="520" x2="540" y2="520" stroke="#18364a" stroke-width="2" marker-end="url(#m176)"/><text x="535.0" y="514.0" class="" text-anchor="end" style="fill:#18364a;font-size:13px">H₂O</text><rect x="710" y="150" width="260" height="130" rx="12" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="840.0" y="180.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:19px">With ADH</text><text x="840.0" y="207.0" class="" text-anchor="middle" style="font-size:14px">V2 → cAMP → AQP2 in apical</text><text x="840.0" y="226.0" class="" text-anchor="middle" style="font-size:14px">membrane; urine up to ~1200</text><rect x="710" y="310" width="260" height="110" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="840.0" y="340.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:19px">Without ADH</text><text x="840.0" y="367.0" class="" text-anchor="middle" style="font-size:14px">CD water-tight; urine as low as ~50</text><rect x="710" y="450" width="260" height="100" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="840.0" y="480.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:19px">Vasa recta</text><text x="840.0" y="507.0" class="" text-anchor="middle" style="font-size:14px">passive countercurrent exchange</text><text x="840.0" y="526.0" class="" text-anchor="middle" style="font-size:14px">preserves gradient</text></svg>