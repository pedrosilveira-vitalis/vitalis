<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">Three mechanisms of enzyme regulation</title><desc id="desc">Product feedback inhibits an earlier pathway enzyme. A kinase and phosphatase change the activity bias of glycogen enzymes in opposing directions. Proteolytic activation exposes a new terminus in a digestive enzyme. Bacterial ATCase and human CAD use different regulatory examples.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#245574;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">Regulation: follow the signal, not just the name</text><rect x="24" y="60" width="752" height="170" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="94" class="h" text-anchor="start">1  Product feedback</text><rect x="50" y="116" width="130" height="42" rx="9" fill="#e4eef1"/><text x="115.0" y="143" class="t" text-anchor="middle">Precursor</text><rect x="300" y="116" width="130" height="42" rx="9" fill="#e4eef1"/><text x="365.0" y="143" class="t" text-anchor="middle">Intermediate</text><rect x="575" y="116" width="145" height="42" rx="9" fill="#e4eef1"/><text x="647.5" y="143" class="t" text-anchor="middle">Product</text><path d="M185 137 L290 137" class="bond" /><path d="M281 132 L290 137 L281 142" class="bond"/><path d="M435 137 L565 137" class="bond" /><path d="M556 132 L565 137 L556 142" class="bond"/><text x="236" y="124" class="s" text-anchor="middle">enzyme</text><path d="M645 163 V198 H235 V158 M225 158 H245" stroke="#245574" stroke-width="3" fill="none"/><text x="404" y="218" class="s" text-anchor="middle">feedback to an earlier step</text><rect x="24" y="246" width="752" height="197" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="279" class="h" text-anchor="start">2  Same modification, opposite activity effects</text><text x="50" y="336" class="t" text-anchor="start">Phosphorylase</text><rect x="225" y="310" width="170" height="42" rx="9" fill="#e4eef1"/><text x="310.0" y="337" class="t" text-anchor="middle">less active</text><path d="M404 331 L515 331" class="bond" /><path d="M506 326 L515 331 L506 336" class="bond"/><rect x="525" y="310" width="170" height="42" rx="9" fill="#f4dce0"/><text x="610.0" y="337" class="t" text-anchor="middle">more active</text><text x="460" y="322" class="s" text-anchor="middle">+ phosphate</text><text x="50" y="393" class="t" text-anchor="start">Synthase</text><rect x="225" y="367" width="170" height="42" rx="9" fill="#e4eef1"/><text x="310.0" y="394" class="t" text-anchor="middle">more active</text><path d="M404 388 L515 388" class="bond" /><path d="M506 383 L515 388 L506 393" class="bond"/><rect x="525" y="367" width="170" height="42" rx="9" fill="#f4dce0"/><text x="610.0" y="394" class="t" text-anchor="middle">less active</text><text x="460" y="379" class="s" text-anchor="middle">+ phosphate</text><text x="50" y="429" class="s" text-anchor="start">Phosphatases remove phosphate. Allosteric effects still matter.</text><rect x="24" y="459" width="752" height="162" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="493" class="h" text-anchor="start">3  Proteolytic maturation</text><rect x="50" y="518" width="195" height="42" rx="9" fill="#e4eef1"/><text x="147.5" y="545" class="t" text-anchor="middle">Digestive precursor</text><path d="M257 539 L494 539" class="bond" /><path d="M485 534 L494 539 L485 544" class="bond"/><text x="375" y="526" class="s" text-anchor="middle">peptide cleavage</text><rect x="505" y="518" width="220" height="42" rx="9" fill="#f4dce0"/><text x="615.0" y="545" class="t" text-anchor="middle">Mature protease</text><text x="50" y="590" class="s" text-anchor="start">Cleavage cannot simply be reversed by a phosphatase.</text><rect x="24" y="637" width="752" height="79" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="666" class="h" text-anchor="start">Species check</text><text x="44" y="695" class="s" text-anchor="start">E. coli ATCase: CTP/ATP • Human CAD: CPSII control by UTP/PRPP</text></svg>