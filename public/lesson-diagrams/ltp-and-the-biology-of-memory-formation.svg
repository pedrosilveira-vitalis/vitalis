<svg xmlns="http://www.w3.org/2000/svg" width="920" height="892" viewBox="0 0 920 892" role="img" aria-labelledby="t d"><title id="t">A memory is a synapse that was changed</title><desc id="d">Top: the induction of long-term potentiation at a single synapse. Glutamate alone is not enough, because a magnesium ion plugs the NMDA channel at rest; only when the postsynaptic membrane is already depolarised does the plug come out, letting calcium in. The calcium activates CaMKII, which phosphorylates AMPA receptors and brings more of them to the membrane, so the same presynaptic signal now produces a bigger response. Middle: early against late potentiation — the first lasting one to three hours on existing proteins, the second lasting days and requiring CREB, new gene expression and new protein, which is why a protein synthesis blocker spares short-term memory and abolishes long-term memory. Bottom: the two consolidations, synaptic within hours and systems over months as sleep replays the trace, with slow-wave sleep favouring declarative material and REM favouring procedural and emotional.</desc><defs><marker id="m7870" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="892" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">A memory is a synapse that was changed</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">The NMDA receptor only opens when both sides fire — that is the whole trick</text><rect x="40" y="156" width="840" height="268" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="184.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">Why the NMDA receptor is a coincidence detector</text><path d="M90 206 q60 -10 110 10 l0 70 q-60 20 -110 6 z" stroke="#6d716f" stroke-width="2" fill="#e9e4da"/><text x="145.0" y="250.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:12px">presynaptic</text><circle cx="216" cy="236" r="4" fill="#5b7a64" stroke="#5b7a64" stroke-width="2"/><circle cx="230" cy="236" r="4" fill="#5b7a64" stroke="#5b7a64" stroke-width="2"/><circle cx="244" cy="236" r="4" fill="#5b7a64" stroke="#5b7a64" stroke-width="2"/><circle cx="216" cy="254" r="4" fill="#5b7a64" stroke="#5b7a64" stroke-width="2"/><circle cx="230" cy="254" r="4" fill="#5b7a64" stroke="#5b7a64" stroke-width="2"/><circle cx="244" cy="254" r="4" fill="#5b7a64" stroke="#5b7a64" stroke-width="2"/><text x="248.0" y="214.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">glutamate</text><rect x="290" y="206" width="20" height="120" rx="3" fill="#e9e4da" stroke="#6d716f" stroke-width="2"/><text x="300.0" y="344.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:12px">postsynaptic</text><rect x="282" y="222" width="36" height="34" rx="5" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="300.0" y="244.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">N</text><text x="344.0" y="232.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:13px">NMDA</text><text x="344.0" y="250.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">blocked by Mg²⁺ until the</text><text x="344.0" y="266.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">membrane depolarises</text><rect x="282" y="280" width="36" height="34" rx="5" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="300.0" y="302.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">A</text><text x="344.0" y="292.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:13px">AMPA</text><text x="344.0" y="310.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">carries the ordinary signal</text><rect x="556" y="206" width="300" height="38" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="706.0" y="230.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">Ca²⁺ floods in</text><line x1="706" y1="244" x2="706" y2="252" stroke="#6d716f" stroke-width="1.8" marker-end="url(#m7870)"/><rect x="556" y="254" width="300" height="38" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="706.0" y="278.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">CaMKII activated</text><line x1="706" y1="292" x2="706" y2="300" stroke="#6d716f" stroke-width="1.8" marker-end="url(#m7870)"/><rect x="556" y="302" width="300" height="38" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="706.0" y="326.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">AMPA phosphorylated — and more inserted</text><line x1="706" y1="340" x2="706" y2="348" stroke="#6d716f" stroke-width="1.8" marker-end="url(#m7870)"/><rect x="556" y="350" width="300" height="38" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="706.0" y="374.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">bigger response — to the same input</text><text x="250.0" y="374.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">Hebb in molecules: fire together, wire together</text><text x="460.0" y="398.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">both sides must be active at once — that is what makes the synapse selective</text><rect x="40" y="440" width="840" height="198" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="468.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">Two phases, and only one of them needs the nucleus</text><rect x="70" y="488" width="370" height="124" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="255.0" y="514.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">EARLY LTP — 1 to 3 hours</text><text x="255.0" y="540.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">phosphorylate what is already there;</text><text x="255.0" y="558.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">traffic existing AMPA receptors in</text><text x="255.0" y="584.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:12px">no new protein needed</text><rect x="480" y="488" width="370" height="124" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="665.0" y="514.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">LATE LTP — hours to days</text><text x="665.0" y="540.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">PKA → CREB → new gene expression</text><text x="665.0" y="558.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">new synaptic protein; spines grow</text><text x="665.0" y="584.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:12px">a protein synthesis blocker stops this one only</text><rect x="40" y="654" width="840" height="206" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="460.0" y="682.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">From one synapse to the whole cortex</text><line x1="110" y1="810" x2="460" y2="810" stroke="#18364a" stroke-width="2"/><line x1="110" y1="702" x2="110" y2="810" stroke="#18364a" stroke-width="2"/><text x="285.0" y="854.0" class="" text-anchor="middle" style="font-size:17px">time since learning</text><text x="66" y="756.0" text-anchor="middle" transform="rotate(-90 66 756.0)" style="font-size:17px">hippocampus needed</text><path d="M110.0 711.8 L111.4 713.0 L112.8