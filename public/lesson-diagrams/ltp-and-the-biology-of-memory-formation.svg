.4 796.0 L329.8 796.2 L331.2 796.4 L332.6 796.5 L334.0 796.7 L335.4 796.9 L336.8 797.0 L338.2 797.2 L339.6 797.4 L341.0 797.5 L342.4 797.7 L343.8 797.8 L345.2 798.0 L346.6 798.1 L348.0 798.3 L349.4 798.4 L350.8 798.6 L352.2 798.7 L353.6 798.8 L355.0 799.0 L356.4 799.1 L357.8 799.3 L359.2 799.4 L360.6 799.5 L362.0 799.7 L363.4 799.8 L364.8 799.9 L366.2 800.0 L367.6 800.2 L369.0 800.3 L370.4 800.4 L371.8 800.5 L373.2 800.6 L374.6 800.8 L376.0 800.9 L377.4 801.0 L378.8 801.1 L380.2 801.2 L381.6 801.3 L383.0 801.4 L384.4 801.5 L385.8 801.6 L387.2 801.7 L388.6 801.8 L390.0 801.9 L391.4 802.0 L392.8 802.1 L394.2 802.2 L395.6 802.3 L397.0 802.4 L398.4 802.5 L399.8 802.6 L401.2 802.7 L402.6 802.8 L404.0 802.9 L405.4 803.0 L406.8 803.1 L408.2 803.1 L409.6 803.2 L411.0 803.3 L412.4 803.4 L413.8 803.5 L415.2 803.6 L416.6 803.6 L418.0 803.7 L419.4 803.8 L420.8 803.9 L422.2 804.0 L423.6 804.0 L425.0 804.1 L426.4 804.2 L427.8 804.2 L429.2 804.3 L430.6 804.4 L432.0 804.5 L433.4 804.5 L434.8 804.6 L436.2 804.7 L437.6 804.7 L439.0 804.8 L440.4 804.9 L441.8 804.9 L443.2 805.0 L444.6 805.1 L446.0 805.1 L447.4 805.2 L448.8 805.2 L450.2 805.3 L451.6 805.4 L453.0 805.4 L454.4 805.5 L455.8 805.5 L457.2 805.6 L458.6 805.6 L460.0 805.7" stroke="#5b7a64" stroke-width="2.8" fill="none"/><text x="132.0" y="723.6" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">hours: hippocampus holds it</text><text x="327.0" y="783.3" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">months: the cortex holds it</text><rect x="500" y="700" width="350" height="56" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="675.0" y="722.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">SLOW-WAVE SLEEP</text><text x="675.0" y="742.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">sharp-wave ripples replay the day; declarative material</text><rect x="500" y="766" width="350" height="56" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="675.0" y="788.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">REM SLEEP</text><text x="675.0" y="808.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">procedural and emotional material; high acetylcholine</text><text x="675.0" y="844.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">deprive one stage and you lose that kind of memory</text></svg>