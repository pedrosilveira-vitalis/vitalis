<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="t d"><title id="t">Three hypothalamic–pituitary axes and their feedback loops</title><desc id="d">Three columns. HPA axis: CRH from the hypothalamus stimulates ACTH from the anterior pituitary, which stimulates cortisol from the adrenal zona fasciculata; cortisol feeds back on both pituitary and hypothalamus. HPT axis: TRH stimulates TSH, which stimulates T4 and T3 from the thyroid; thyroid hormone feeds back mainly on the pituitary. HPG axis: pulsatile GnRH stimulates LH and FSH, which stimulate sex steroids and gametes; steroids feed back negatively, inhibin suppresses FSH, and sustained high estradiol switches to positive feedback that triggers the LH surge. A bottom rule: primary gland failure gives low end hormone with high tropic hormone; pituitary failure gives both low.</desc><defs><marker id="m1400" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#987740"/></marker><marker id="m406" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker><marker id="m7520" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b7a64"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="680" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Three hypothalamic–pituitary axes and their feedback loops</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Solid arrows stimulate; dashed red arrows show negative feedback from the end hormone.</text><text x="170.0" y="112.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:20px">HPA axis</text><rect x="60" y="135" width="220" height="90" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="170.0" y="165.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:18px">CRH</text><text x="170.0" y="191.0" class="" text-anchor="middle" style="font-size:14px">Hypothalamus (PVN)</text><line x1="170" y1="226" x2="170" y2="273" stroke="#245574" stroke-width="3" marker-end="url(#m406)"/><rect x="60" y="275" width="220" height="90" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="170.0" y="305.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:18px">ACTH</text><text x="170.0" y="331.0" class="" text-anchor="middle" style="font-size:14px">Anterior pituitary</text><line x1="170" y1="366" x2="170" y2="413" stroke="#245574" stroke-width="3" marker-end="url(#m406)"/><rect x="60" y="415" width="220" height="90" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="170.0" y="445.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:18px">Cortisol</text><text x="170.0" y="471.0" class="" text-anchor="middle" style="font-size:14px">Adrenal cortex (fasciculata)</text><path d="M282 460 C330 460 330 320 284 320" stroke="#a8324a" stroke-width="2.5" fill="none" stroke-dasharray="8 6"/><path d="M282 475 C350 475 350 180 284 180" stroke="#a8324a" stroke-width="2.5" fill="none" stroke-dasharray="8 6"/><text x="480.0" y="112.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:20px">HPT axis</text><rect x="370" y="135" width="220" height="90" rx="12" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="480.0" y="165.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:18px">TRH</text><text x="480.0" y="191.0" class="" text-anchor="middle" style="font-size:14px">Hypothalamus</text><line x1="480" y1="226" x2="480" y2="273" stroke="#5b7a64" stroke-width="3" marker-end="url(#m7520)"/><rect x="370" y="275" width="220" height="90" rx="12" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="480.0" y="305.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:18px">TSH</text><text x="480.0" y="331.0" class="" text-anchor="middle" style="font-size:14px">Anterior pituitary</text><line x1="480" y1="366" x2="480" y2="413" stroke="#5b7a64" stroke-width="3" marker-end="url(#m7520)"/><rect x="370" y="415" width="220" height="90" rx="12" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="480.0" y="445.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:18px">T₄ → T₃</text><text x="480.0" y="471.0" class="" text-anchor="middle" style="font-size:14px">Thyroid follicles</text><path d="M592 460 C640 460 640 320 594 320" stroke="#a8324a" stroke-width="2.5" fill="none" stroke-dasharray="8 6"/><path d="M592 475 C660 475 660 180 594 180" stroke="#a8324a" stroke-width="2.5" fill="none" stroke-dasharray="8 6"/><text x="790.0" y="112.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:20px">HPG axis</text><rect x="680" y="135" width="220" height="90" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="790.0" y="165.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:18px">GnRH (pulsatile)</text><text x="790.0" y="191.0" class="" text-anchor="middle" style="font-size:14px">Hypothalamus</text><line x1="790" y1="226" x2="790" y2="273" stroke="#987740" stroke-width="3" marker-end="url(#m1400)"/><rect x="680" y="275" width="220" height="90" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="790.0" y="305.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:18px">LH + FSH</text><text x="790.0" y="331.0" class="" text-anchor="middle" style="font-size:14px">Anterior pituitary</text><line x1="790" y1="366" x2="790" y2="413" stroke="#987740" stroke-width="3" marker-end="url(#m1400)"/><rect x="680" y="415" width="220" height="90" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="790.0" y="445.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:18px">Sex steroids</text><text x="790.0" y="471.0" class="" text-anchor="middle" style="font-size:14px">Gonads</text><path d="M902 460 C950 460 950 320 904 320" stroke="#a8324a" stroke-width="2.5" fill="none" stroke-dasharray="8 6"/><path d="M902 475 C970 475 970 180 904 180" stroke="#a8324a" stroke-width="2.5" fill="none" stroke-dasharray="8 6"/><text x="790.0" y="560.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:14px">Inhibin ⟶ ↓ FSH;  high E₂ for ~2 days ⟶ LH surge (positive)</text><rect x="60" y="585" width="880" height="70" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="500.0" y="615.0" class="" text-anchor="middle" style="font-size:17px">Primary gland failure: end hormone ↓, tropic hormone ↑. Pituitary (secondary) failure: both ↓.</text></svg>