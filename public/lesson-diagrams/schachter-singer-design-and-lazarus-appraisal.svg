<svg xmlns="http://www.w3.org/2000/svg" width="920" height="906" viewBox="0 0 920 906" role="img" aria-labelledby="t d"><title id="t">One injection, two rooms, two emotions</title><desc id="d">Top: Schachter and Singer&#x27;s design, which is the whole two-factor theory in one table. Everyone in the epinephrine rows has the same racing heart. The only thing that differs is whether they have an explanation for it. Those who do blame the drug and feel little; those who do not borrow an explanation from whoever is in the room with them, and end up euphoric or furious accordingly. The saline rows have nothing to label and feel almost nothing. Middle: the same logic in the field — arousal left over from a frightening bridge gets re-attributed to the person standing on it. Bottom: Lazarus&#x27;s two appraisals, which decide not just how strong the emotion is but which emotion it is, and why the same event lands differently on two different people.</desc><defs><marker id="m6114" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="906" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">One injection, two rooms, two emotions</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">The experiments are the argument — learn what each one rules out</text><rect x="40" y="176" width="840" height="288" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="204.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">Schachter and Singer, 1962</text><text x="470.0" y="236.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:11px">with a EUPHORIC confederate</text><text x="740.0" y="236.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:11px">with an ANGRY confederate</text><line x1="70" y1="246" x2="850" y2="246" stroke="#6d716f" stroke-width="1" stroke-dasharray="6 5"/><rect x="70" y="258" width="150" height="42" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="145.0" y="276.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10px">EPINEPHRINE,</text><text x="145.0" y="290.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10px">uninformed</text><text x="470.0" y="278.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">feels euphoric</text><text x="740.0" y="278.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">feels angry</text><text x="470.0" y="296.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">no explanation → borrows one from the room</text><rect x="70" y="304" width="150" height="42" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="145.0" y="322.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10px">EPINEPHRINE,</text><text x="145.0" y="336.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10px">misinformed</text><text x="470.0" y="324.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">feels euphoric</text><text x="740.0" y="324.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">feels angry</text><text x="470.0" y="342.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">wrong explanation → same as above</text><rect x="70" y="350" width="150" height="42" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="145.0" y="368.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10px">EPINEPHRINE,</text><text x="145.0" y="382.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10px">informed</text><text x="470.0" y="370.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">little effect</text><text x="740.0" y="370.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">little effect</text><text x="470.0" y="388.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">“it&#x27;s the drug” — arousal already explained</text><rect x="70" y="396" width="150" height="42" rx="7" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="145.0" y="414.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:10px">SALINE,</text><text x="145.0" y="428.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:10px">placebo</text><text x="470.0" y="416.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">little effect</text><text x="740.0" y="416.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">little effect</text><text x="470.0" y="434.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">no arousal to label at all</text><text x="460.0" y="454.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">identical arousal · different label · different emotion</text><rect x="40" y="480" width="840" height="160" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="460.0" y="508.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">Excitation transfer, in the field</text><rect x="66" y="532" width="188" height="76" rx="9" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="160.0" y="560.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:11px">the bridge is terrifying</text><text x="160.0" y="584.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">sympathetic arousal</text><line x1="254" y1="570" x2="262" y2="570" stroke="#6d716f" stroke-width="1.8" marker-end="url(#m6114)"/><rect x="262" y="532" width="188" height="76" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="356.0" y="560.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">the arousal outlasts it</text><text x="356.0" y="584.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">no obvious cause left</text><line x1="450" y1="570" x2="458" y2="570" stroke="#6d716f" stroke-width="1.8" marker-end="url(#m6114)"/><rect x="458" y="532" width="188" height="76" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="552.0" y="560.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">someone attractive is there</text><text x="552.0" y="584.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">the arousal gets re-labelled</text><line x1="646" y1="570" x2="654" y2="570" stroke="#6d716f" stroke-width="1.8" marker-end="url(#m6114)"/><rect x="654" y="532" width="188" height="76" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="748.0" y="560.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:11px">“I must be attracted”</text><text x="748.0" y="584.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">Dutton and Aron, 1974</text><rect x="40" y="656" width="840" height="220" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="460.0" y="684.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">Lazarus: two appraisals, then the emotion</text><rect x="70" y="704" width="340" height="150" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="240.0" y="728.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">PRIMARY — does this matter to me?</text><text x="228.0" y="754.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:11px">irrelevant</text><text x="240.0" y="754.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">no emotion follows</text><text x="228.0" y="774.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:11px">benign-positive</text><text x="240.0" y="774.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">pleasant emotions</text><text x="228.0" y="794.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:11px">harm or loss</text><text x="240.0" y="794.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">grief, anger — damage done</text><text x="228.0" y="814.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:11px">threat</text><text x="240.0" y="814.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">anxiety — damage ahead</text><text x="228.0" y="834.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:11px">challenge</text><text x="240.0" y="834.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">excitement — a chance to master</text><rect x="440" y="704" width="410" height="150" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="645.0" y="728.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">SECONDARY — what can I do about it?</text><text x="645.0" y="756.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">what are my options, and will they work?</text><text x="645.0" y="780.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">controllable threat → focused concern</text><text x="645.0" y="800.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">uncontrollable threat → helplessness</text><text x="645.0" y="830.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">reappraisal changes the emotion later —</text><text x="645.0" y="846.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">this is the lever cognitive therapy pulls</text></svg>