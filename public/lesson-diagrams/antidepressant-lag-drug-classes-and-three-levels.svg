<svg xmlns="http://www.w3.org/2000/svg" width="920" height="980" viewBox="0 0 920 980" role="img" aria-labelledby="t d"><title id="t">Why the pills take weeks when the blockade is instant</title><desc id="d">Top: the antidepressant delay, which is the most asked mechanism in this lesson. Reuptake blockade raises synaptic serotonin within hours, but the somatodendritic autoreceptors sense the rise and throttle firing back, so little reaches the forebrain. Only after those autoreceptors desensitise over weeks does firing recover on top of the blockade, and the slow plasticity changes follow. Bottom left: the four questions worth asking about any psychiatric drug class, with the answers that recur. Bottom right: the three levels of the biopsychosocial frame — passages almost always ask you to place an intervention in one of them, or to notice that a good treatment plan needs all three.</desc><defs><marker id="m1558" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="980" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Why the pills take weeks when the blockade is instant</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">And the three levels any MCAT treatment passage is built from</text><rect x="40" y="180" width="840" height="330" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">The antidepressant lag, in three stages</text><rect x="68" y="228" width="262" height="238" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="199.0" y="254.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">DAY 1</text><text x="199.0" y="274.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10.5px">SERT is blocked</text><line x1="108" y1="286" x2="290" y2="286" stroke="#a8324a" stroke-width="1" stroke-dasharray="6 5"/><text x="199.0" y="308.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">serotonin rises in the synapse</text><text x="199.0" y="330.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">— and at the cell body too</text><text x="199.0" y="352.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">autoreceptors detect it and</text><text x="199.0" y="374.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">CUT the firing rate</text><text x="199.0" y="396.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">net effect at the target: small</text><rect x="344" y="228" width="262" height="238" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="475.0" y="254.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">WEEKS 1–3</text><text x="475.0" y="274.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10.5px">autoreceptors desensitise</text><line x1="384" y1="286" x2="566" y2="286" stroke="#987740" stroke-width="1" stroke-dasharray="6 5"/><text x="475.0" y="308.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">the 5-HT1A brake wears off</text><text x="475.0" y="330.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">firing recovers while the</text><text x="475.0" y="352.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">reuptake block stays on</text><text x="475.0" y="374.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">now serotonin actually rises</text><text x="475.0" y="396.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">downstream — symptoms start to lift</text><rect x="620" y="228" width="262" height="238" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="751.0" y="254.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">WEEKS 4–6</text><text x="751.0" y="274.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10.5px">the slow changes land</text><line x1="660" y1="286" x2="842" y2="286" stroke="#5b7a64" stroke-width="1" stroke-dasharray="6 5"/><text x="751.0" y="308.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">postsynaptic receptors adapt</text><text x="751.0" y="330.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">BDNF rises</text><text x="751.0" y="352.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">hippocampal neurogenesis</text><text x="751.0" y="374.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">full response, if it comes</text><text x="751.0" y="396.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">this is why nobody stops at week 2</text><line x1="336" y1="347" x2="354" y2="347" stroke="#6d716f" stroke-width="2.5" marker-end="url(#m1558)"/><line x1="612" y1="347" x2="630" y2="347" stroke="#6d716f" stroke-width="2.5" marker-end="url(#m1558)"/><text x="460.0" y="492.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">immediate chemistry, delayed clinical effect — the gap is the autoreceptor</text><rect x="40" y="526" width="410" height="432" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="245.0" y="554.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">Ask four things of any drug</text><rect x="64" y="578" width="362" height="58" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="150.0" y="598.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">SSRI / SNRI</text><text x="350.0" y="598.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">block SERT ± NET</text><text x="245.0" y="613.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">depression, all the anxiety</text><text x="245.0" y="625.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">disorders, OCD, PTSD</text><rect x="64" y="640" width="362" height="58" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="150.0" y="660.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">TCA · MAOI</text><text x="350.0" y="660.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">same blockade, dirtier</text><text x="245.0" y="675.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">anticholinergic load;</text><text x="245.0" y="687.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">tyramine → hypertensive crisis</text><rect x="64" y="702" width="362" height="58" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="150.0" y="722.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">TYPICAL ANTIPSYCH.</text><text x="350.0" y="722.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">D2 antagonist</text><text x="245.0" y="737.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">positive symptoms;</text><text x="245.0" y="749.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">EPS and tardive dyskinesia</text><rect x="64" y="764" width="362" height="58" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="150.0" y="784.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">ATYPICAL</text><text x="350.0" y="784.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">D2 + 5-HT2A</text><text x="245.0" y="799.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">less EPS; metabolic syndrome;</text><text x="245.0" y="811.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">clozapine → agranulocytosis</text><rect x="64" y="826" width="362" height="58" rx="7" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="150.0" y="846.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10.5px">BENZODIAZEPINE</text><text x="350.0" y="846.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">GABA-A, more Cl⁻</text><text x="245.0" y="861.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">fast anxiolysis; tolerance,</text><text x="245.0" y="873.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">dependence, respiratory risk</text><rect x="64" y="888" width="362" height="58" rx="7" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="150.0" y="908.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">LITHIUM</text><text x="350.0" y="908.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">inositol, GSK-3</text><text x="245.0" y="923.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">bipolar; narrow window</text><text x="245.0" y="935.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">0.6–1.2 mEq/L, monitor levels</text><rect x="470" y="526" width="410" height="432" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="675.0" y="554.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">Three levels, one patient</text><rect x="494" y="578" width="362" height="64" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="675.0" y="600.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">BIOLOGICAL</text><text x="675.0" y="618.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">drugs, ECT, TMS, DBS</text><text x="675.0" y="633.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">barrier: side effects, metabolism</text><rect x="494" y="652" width="362" height="79" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="675.0" y="674.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">PSYCHOLOGICAL</text><text x="675.0" y="692.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">CBT and its cousins, behavioural work,</text><text x="675.0" y="707.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">psychodynamic, humanistic, DBT</text><text x="675.0" y="722.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">barrier: avoidance, low insight</text><rect x="494" y="741" width="362" height="79" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="675.0" y="763.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">SOCIOCULTURAL</text><text x="675.0" y="781.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">family, group and community work,</text><text x="675.0" y="796.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">culturally adapted therapy, ACT teams</text><text x="675.0" y="811.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">barrier: stigma, poverty, racism, access</text><rect x="494" y="836" width="362" height="128" rx="10" fill="#e8ecef" stroke="#18364a" stroke-width="2.2"/><text x="675.0" y="860.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10.5px">COMBINING THEM BEATS ANY ONE ALONE</text><text x="675.0" y="880.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">depression — SSRI plus CBT</text><text x="675.0" y="894.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">schizophrenia — antipsychotic, cognitive</text><text x="675.0" y="908.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">remediation, family psychoeducation, work support</text><text x="675.0" y="922.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">PTSD — trauma-focused CBT first, SSRI adjunct</text><text x="675.0" y="936.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">addiction — medication, motivational work,</text><text x="675.0" y="950.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">and the social conditions for relapse</text></svg>