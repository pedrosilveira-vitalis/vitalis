<svg xmlns="http://www.w3.org/2000/svg" width="920" height="840" viewBox="0 0 920 840" role="img" aria-labelledby="t d"><title id="t">Pressure counts depth; buoyancy counts displaced fluid</title><desc id="d">Top left: a tank showing pressure rising linearly with depth, about one extra atmosphere every ten metres of water, with a note that container shape does not matter. Top right: two floating blocks showing that the submerged fraction equals the ratio of the object&#x27;s density to the fluid&#x27;s, 60 percent for wood and 92 percent for ice. Bottom left: a hydraulic lift, where a small force on a small piston supports a large force on a large piston while the work stays equal. Bottom right: the standing blood column, higher pressure at the feet and lower at the brain than at the heart.</desc><defs><marker id="m6814" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker><marker id="m7550" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b7a64"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="840" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Pressure counts depth; buoyancy counts displaced fluid</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">P = P₀ + ρgh depends on depth and density alone — never on the shape of the container</text><rect x="40" y="112" width="416" height="330" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="248.0" y="142.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">Pressure builds with depth</text><rect x="96" y="180" width="180" height="182" rx="4" fill="#e4edf3" stroke="#245574" stroke-width="2"/><line x1="96" y1="180" x2="276" y2="180" stroke="#245574" stroke-width="3"/><line x1="86" y1="180.0" x2="286" y2="180.0" stroke="#18364a" stroke-width="1.5" stroke-dasharray="6 5"/><text x="80.0" y="185.0" class="" text-anchor="end" style="fill:#6d716f;font-size:13px">0 m</text><text x="292.0" y="185.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:14px">1 atm</text><line x1="86" y1="271.0" x2="286" y2="271.0" stroke="#18364a" stroke-width="1.5" stroke-dasharray="6 5"/><text x="80.0" y="276.0" class="" text-anchor="end" style="fill:#6d716f;font-size:13px">10 m</text><text x="292.0" y="276.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:14px">2 atm</text><line x1="86" y1="362.0" x2="286" y2="362.0" stroke="#18364a" stroke-width="1.5" stroke-dasharray="6 5"/><text x="80.0" y="367.0" class="" text-anchor="end" style="fill:#6d716f;font-size:13px">20 m</text><text x="292.0" y="367.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:14px">3 atm</text><text x="248.0" y="398.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">P = P₀ + ρgh   •   ≈1 atm per 10 m of water</text><text x="248.0" y="424.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">same depth ⇒ same pressure, whatever the shape</text><rect x="472" y="112" width="408" height="330" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="676.0" y="142.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">How much sits below the line</text><rect x="490" y="256.4" width="172" height="111.6" rx="3" fill="#e4edf3" stroke="#245574" stroke-width="0"/><line x1="490" y1="256.4" x2="662" y2="256.4" stroke="#245574" stroke-width="2.5"/><rect x="516.0" y="218" width="120" height="96" rx="4" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><line x1="516.0" y1="256.4" x2="636.0" y2="256.4" stroke="#18364a" stroke-width="2" stroke-dasharray="6 5"/><text x="576.0" y="204.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">wood</text><text x="576.0" y="282.4" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:18px">60%</text><text x="576.0" y="368.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">ρ = 600</text><rect x="692" y="225.68" width="172" height="142.32" rx="3" fill="#e4edf3" stroke="#245574" stroke-width="0"/><line x1="692" y1="225.68" x2="864" y2="225.68" stroke="#245574" stroke-width="2.5"/><rect x="718.0" y="218" width="120" height="96" rx="4" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><line x1="718.0" y1="225.68" x2="838.0" y2="225.68" stroke="#18364a" stroke-width="2" stroke-dasharray="6 5"/><text x="778.0" y="204.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">ice</text><text x="778.0" y="251.7" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:18px">92%</text><text x="778.0" y="368.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">ρ = 917</text><text x="676.0" y="398.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">fraction submerged = ρ_object / ρ_fluid</text><text x="676.0" y="424.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">F_b = ρ_fluid · V_displaced · g — the fluid&#x27;s density, never the object&#x27;s</text><rect x="40" y="462" width="416" height="234" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="248.0" y="490.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:17px">Pascal: pressure goes everywhere</text><path d="M110 560 L110 630 L390 630 L390 548 L330 548 L330 600 L170 600 L170 560 Z" stroke="#987740" stroke-width="2" fill="#f1eadc"/><rect x="108" y="552" width="64" height="12" rx="2" fill="#e8ecef" stroke="#18364a" stroke-width="1.5"/><rect x="328" y="540" width="64" height="12" rx="2" fill="#e8ecef" stroke="#18364a" stroke-width="1.5"/><line x1="140" y1="520" x2="140" y2="548" stroke="#a8324a" stroke-width="3" marker-end="url(#m6814)"/><text x="140.0" y="512.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">F₁ = 200 N</text><line x1="360" y1="518" x2="360" y2="538" stroke="#5b7a64" stroke-width="3" marker-end="url(#m7550)"/><text x="360.0" y="512.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">10,000 N</text><text x="140.0" y="652.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">A₁ = 0.01 m²</text><text x="360.0" y="652.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">A₂ = 0.5 m²</text><text x="248.0" y="676.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">F₂ = F₁ · A₂/A₁, and F₁d₁ = F₂d₂: force gained, distance paid</text><rect x="472" y="462" width="408" height="234" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="676.0" y="490.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">The body is a fluid column too</text><line x1="676" y1="512" x2="676" y2="660" stroke="#6d716f" stroke-width="2"/><circle cx="676" cy="524" r="7" fill="#245574" stroke="#245574" stroke-width="2"/><text x="664.0" y="529.0" class="" text-anchor="end" style="fill:#245574;font-weight:bold;font-size:14px">brain</text><text x="692.0" y="529.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">≈ 30 mmHg lower</text><circle cx="676" cy="578" r="7" fill="#18364a" stroke="#18364a" stroke-width="2"/><text x="664.0" y="583.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:14px">heart</text><text x="692.0" y="583.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">reference level</text><circle cx="676" cy="648" r="7" fill="#a8324a" stroke="#a8324a" stroke-width="2"/><text x="664.0" y="653.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:bold;font-size:14px">feet</text><text x="692.0" y="653.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">≈ 100 mmHg higher</text><text x="676.0" y="682.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">ΔP = ρgh with ρ_blood ≈ 1060 kg/m³</text><text x="460.0" y="742.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">Gauge pressure is ρgh alone; absolute pressure adds the atmosphere on top</text><text x="460.0" y="774.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">A floating object at rest always has F_b = W exactly — that is what sets how deep it sits</text><text x="460.0" y="804.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Blood pressure readings are gauge pressures, referenced to the right atrium</text></svg>