<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">Mean pressure falls most steeply across the arterioles</title><desc id="d">A line chart of mean blood pressure along the systemic circulation: aorta about 100 mmHg, large arteries 95, small arteries 85, arterioles falling from 85 to 35, capillaries 35 to 15, venules 15, large veins and vena cava about 5. The steepest fall is shaded across the arterioles. A side panel restates MAP equals cardiac output times total peripheral resistance and resistance is proportional to 1 over radius to the fourth.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="600" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Mean pressure falls most steeply across the arterioles</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Approximate resting mean pressures (mmHg) in the systemic circulation; teaching values.</text><line x1="110" y1="490" x2="710" y2="490" stroke="#18364a" stroke-width="2"/><line x1="110" y1="110" x2="110" y2="490" stroke="#18364a" stroke-width="2"/><text x="410.0" y="534.0" class="" text-anchor="middle" style="font-size:17px"></text><text x="66" y="300.0" text-anchor="middle" transform="rotate(-90 66 300.0)" style="font-size:17px">Mean pressure (mmHg)</text><line x1="104.0" y1="420.9090909090909" x2="110.0" y2="420.9090909090909" stroke="#18364a" stroke-width="2"/><text x="100.0" y="425.9" class="" text-anchor="end" style="font-size:14px">20</text><line x1="104.0" y1="351.8181818181818" x2="110.0" y2="351.8181818181818" stroke="#18364a" stroke-width="2"/><text x="100.0" y="356.8" class="" text-anchor="end" style="font-size:14px">40</text><line x1="104.0" y1="282.72727272727275" x2="110.0" y2="282.72727272727275" stroke="#18364a" stroke-width="2"/><text x="100.0" y="287.7" class="" text-anchor="end" style="font-size:14px">60</text><line x1="104.0" y1="213.63636363636363" x2="110.0" y2="213.63636363636363" stroke="#18364a" stroke-width="2"/><text x="100.0" y="218.6" class="" text-anchor="end" style="font-size:14px">80</text><line x1="104.0" y1="144.54545454545456" x2="110.0" y2="144.54545454545456" stroke="#18364a" stroke-width="2"/><text x="100.0" y="149.5" class="" text-anchor="end" style="font-size:14px">100</text><rect x="367.1428571428571" y="110.0" width="85.71428571428572" height="380" rx="0" fill="#f5e6e8" stroke="#a8324a" stroke-width="0"/><path d="M110.0 144.5 L195.7 161.8 L281.4 179.1 L367.1 196.4 L452.9 369.1 L538.6 438.2 L624.3 455.5 L710.0 476.2" stroke="#245574" stroke-width="4" fill="none"/><text x="152.9" y="516.0" class="" text-anchor="middle" style="font-size:15px">Aorta</text><text x="238.6" y="516.0" class="" text-anchor="middle" style="font-size:15px">Large</text><text x="238.6" y="535.0" class="" text-anchor="middle" style="font-size:15px">arteries</text><text x="324.3" y="516.0" class="" text-anchor="middle" style="font-size:15px">Small</text><text x="324.3" y="535.0" class="" text-anchor="middle" style="font-size:15px">arteries</text><text x="410.0" y="516.0" class="" text-anchor="middle" style="font-size:15px">Arterioles</text><text x="495.7" y="516.0" class="" text-anchor="middle" style="font-size:15px">Capillaries</text><text x="581.4" y="516.0" class="" text-anchor="middle" style="font-size:15px">Venules</text><text x="667.1" y="516.0" class="" text-anchor="middle" style="font-size:15px">Veins /</text><text x="667.1" y="535.0" class="" text-anchor="middle" style="font-size:15px">vena cava</text><text x="410.0" y="144.5" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:17px">largest drop</text><text x="410.0" y="166.5" class="" text-anchor="middle" style="fill:#a8324a;font-size:15px">(≈ 85 → 35)</text><rect x="750" y="150" width="220" height="115" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="860.0" y="180.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:19px">MAP ≈ CO × TPR</text><text x="860.0" y="207.0" class="" text-anchor="middle" style="font-size:16px">Arteriolar tone sets most</text><text x="860.0" y="228.0" class="" text-anchor="middle" style="font-size:16px">of TPR.</text><rect x="750" y="300" width="220" height="115" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="860.0" y="330.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:19px">R ∝ 1 / r⁴</text><text x="860.0" y="357.0" class="" text-anchor="middle" style="font-size:16px">Halving radius raises</text><text x="860.0" y="378.0" class="" text-anchor="middle" style="font-size:16px">resistance 16-fold (2⁴).</text></svg>