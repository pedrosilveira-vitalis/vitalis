<svg xmlns="http://www.w3.org/2000/svg" width="920" height="856" viewBox="0 0 920 856" role="img" aria-labelledby="t d"><title id="t">Field is a vector; potential is a scalar</title><desc id="d">Top left: a point charge with its radial field lines and circular equipotentials, noting that the field lines cross the equipotentials at right angles. Top right: the same charge&#x27;s field and potential plotted against distance, showing the inverse-square fall of E against the slower inverse fall of V. Middle: parallel plates with a uniform field E = V/d running from the positive plate to the negative one, equipotential planes between them, and the cell membrane as the biological version. Bottom: a sign table giving, for a positive and a negative charge released from rest, the direction of the force relative to the field, whether the potential it moves toward is higher or lower, and the fact that both lose potential energy and gain kinetic energy.</desc><defs><marker id="m1253" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="856" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Field is a vector; potential is a scalar</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">E = kQ/r² falls off faster than V = kQ/r — and E always points downhill in V</text><rect x="40" y="118" width="404" height="288" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="242.0" y="146.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">Field lines cross equipotentials at 90°</text><circle cx="242" cy="282" r="36" fill="none" stroke="#987740" stroke-width="1.6"/><circle cx="242" cy="282" r="62" fill="none" stroke="#987740" stroke-width="1.6"/><circle cx="242" cy="282" r="88" fill="none" stroke="#987740" stroke-width="1.6"/><line x1="258.0" y1="282.0" x2="346.0" y2="282.0" stroke="#245574" stroke-width="1.4" marker-end="url(#m1253)"/><line x1="255.85640646055103" y1="290.0" x2="332.06664199358164" y2="334.0" stroke="#245574" stroke-width="1.4" marker-end="url(#m1253)"/><line x1="250.0" y1="295.856406460551" x2="294.0" y2="372.0666419935816" stroke="#245574" stroke-width="1.4" marker-end="url(#m1253)"/><line x1="242.0" y1="298.0" x2="242.0" y2="386.0" stroke="#245574" stroke-width="1.4" marker-end="url(#m1253)"/><line x1="234.0" y1="295.856406460551" x2="190.00000000000003" y2="372.06664199358164" stroke="#245574" stroke-width="1.4" marker-end="url(#m1253)"/><line x1="228.14359353944897" y1="290.0" x2="151.93335800641836" y2="334.0" stroke="#245574" stroke-width="1.4" marker-end="url(#m1253)"/><line x1="226.0" y1="282.0" x2="138.0" y2="282.0" stroke="#245574" stroke-width="1.4" marker-end="url(#m1253)"/><line x1="228.14359353944897" y1="274.0" x2="151.9333580064184" y2="230.0" stroke="#245574" stroke-width="1.4" marker-end="url(#m1253)"/><line x1="234.0" y1="268.143593539449" x2="189.99999999999994" y2="191.93335800641842" stroke="#245574" stroke-width="1.4" marker-end="url(#m1253)"/><line x1="242.0" y1="266.0" x2="241.99999999999997" y2="178.0" stroke="#245574" stroke-width="1.4" marker-end="url(#m1253)"/><line x1="250.0" y1="268.143593539449" x2="294.0" y2="191.9333580064184" stroke="#245574" stroke-width="1.4" marker-end="url(#m1253)"/><line x1="255.856406460551" y1="274.0" x2="332.0666419935816" y2="229.99999999999994" stroke="#245574" stroke-width="1.4" marker-end="url(#m1253)"/><circle cx="242" cy="282" r="15" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="242.0" y="289.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:20px">+</text><text x="242.0" y="388.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">equipotentials (gold) • field lines (blue)</text><text x="242.0" y="170.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">V = kQ/r on each circle</text><rect x="460" y="118" width="420" height="288" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="670.0" y="146.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">Same charge, two different fall-offs</text><line x1="530" y1="328" x2="830" y2="328" stroke="#18364a" stroke-width="2"/><line x1="530" y1="178" x2="530" y2="328" stroke="#18364a" stroke-width="2"/><text x="680.0" y="372.0" class="" text-anchor="middle" style="font-size:17px">distance r</text><text x="486" y="253.0" text-anchor="middle" transform="rotate(-90 486 253.0)" style="font-size:17px">fraction of the value at r₀</text><line x1="601.4285714285714" y1="328.0" x2="601.4285714285714" y2="334.0" stroke="#18364a" stroke-width="2"/><text x="601.4" y="350.0" class="" text-anchor="middle" style="font-size:14px">1</text><line x1="672.8571428571429" y1="328.0" x2="672.8571428571429" y2="334.0" stroke="#18364a" stroke-width="2"/><text x="672.9" y="350.0" class="" text-anchor="middle" style="font-size:14px">2</text><line x1="744.2857142857142" y1="328.0" x2="744.2857142857142" y2="334.0" stroke="#18364a" stroke-width="2"/><text x="744.3" y="350.0" class="" text-anchor="middle" style="font-size:14px">3</text><line x1="815.7142857142858" y1="328.0" x2="815.7142857142858" y2="334.0" stroke="#18364a" stroke-width="2"/><text x="815.7" y="350.0" class="" text-anchor="middle" style="font-size:14px">4</text><line x1="524.0" y1="258.55555555555554" x2="530.0" y2="258.55555555555554" stroke="#18364a" stroke-width="2"/><text x="520.0" y="263.6" class="" text-anchor="end" style="font-size:14px">0.5</text><line x1="524.0" y1="189.11111111111111" x2="530.0" y2="189.11111111111111" stroke="#18364a" stroke-width="2"/><text x="520.0" y="194.1" class="" text-anchor="end" style="font-size:14px">1</text><path d="M601.4 189.1 L605.0 202.0 L608.6 213.2 L612.1 223.0 L615.7 231.5 L619.3 239.1 L622.9 245.8 L626.4 251.8 L630.0 257.1 L633.6 261.9 L637.1 266.3 L640.7 270.2 L644.3 273.7 L647.9 277.0 L651.4 279.9 L655.0 282.6 L658.6 285.1 L662.1 287.4 L665.7 289.5 L669.3 291.5 L672.9 293.3 L676.4 295.0 L680.0 296.5 L683.6 298.0 L687.1 299.3 L690.7 300.6 L694.3 301.7 L697.9 302.9 L701.4 303.9 L705.0 304.9 L708.6 305.8 L712.1 306.6 L715.7 307.5 L719.3 308.2 L722.9 308.9 L726.4 309.6 L730.0 310.3 L733.6 310.9 L737.1 311.5 L740.7 312.0 L744.3 312.6 L747.9 313.1 L751.4 313.5 L755.0 314.0 L758.6 314.4 L762.1 314.9 L765.7 315.2 L769.3 315.6 L772.9 316.0 L776.4 316.3 L780.0 316.7 L783.6 317.0 L787.1 317.3 L790.7 317.6 L794.3 317.9 L797.9 318.1 L801.4 318.4 L805.0 318.6 L808.6 318.9 L812.1 319.1 L815.7 319.3 L819.3 319.5 L822.9 319.7 L826.4 319.9 L830.0 320.1" stroke="#245574" stroke-width="2.6" fill="none"/><path d="M601.4 189.1 L605.0 195.7 L608.6 201.7 L612.1 207.2 L615.7 212.3 L619.3 216.9 L622.9 221.2 L626.4 225.1 L630.0 228.8 L633.6 232.2 L637.1 235.4 L640.7 238.4 L644.3 241.2 L647.9 243.8 L651.4 246.3 L655.0 248.6 L658.6 250.8 L662.1 252.9 L665.7 254.9 L669.3 256.8 L672.9 258.6 L676.4 260.2 L680.0 261.9 L683.6 263.4 L687.1 264.9 L690.7 266.3 L694.3 267.6 L697.9 268.9 L701.4 270.1 L705.0 271.3 L708.6 272.4 L712.1 273.5 L715.7 274.6 L719.3 275.6 L722.9 276.6 L726.4 277.5 L730.0 278.4 L733.6 279.3 L737.1 280.1 L740.7 280.9 L744.3 281.7 L747.9 282.5 L751.4 283.2 L755.0 283.9 L758.6 284.6 L762.1 285.3 L765.7 285.9 L769.3 286.5 L772.9 287.2 L776.4 287.7 L780.0 288.3 L783.6 288.9 L787.1 289.4 L790.7 289.9 L794.3 290.5 L797.9 291.0 L801.4 291.5 L805.0 291.9 L808.6 292.4 L812.1 292.8 L815.7 293.3 L819.3 293.7 L822.9 294.1 L826.4 294.5 L830.0 294.9" stroke="#987740" stroke-width="2.6" fill="none"/><text x="688.0" y="255.9" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:14px">V ∝ 1/r</text><text x="665.0" y="300.6" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:14px">E ∝ 1/r²</text><text x="670.0" y="388.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">at double the distance: E is a quarter, V is a half</text><rect x="40" y="426" width="840" height="216" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="454.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">Uniform field: E = V/d, pointing from + plate to − plate</text><rect x="120" y="486" width="400" height="10" rx="2" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><rect x="120" y="606" width="400" height="10" rx="2" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="110.0" y="496.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:bold;font-size:22px">+</text><text x="110.0" y="618.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:24px">−</text><line x1="160" y1="502" x2="160" y2="602" stroke="#245574" stroke-width="1.8" marker-end="url(#m1253)"/><line x1="220" y1="502" x2="220" y2="602" stroke="#245574" stroke-width="1.8" marker-end="url(#m1253)"/><line x1="280" y1="502" x2="280" y2="602" stroke="#245574" stroke-width="1.8" marker-end="url(#m1253)"/><line x1="340" y1="502" x2="340" y2="602" stroke="#245574" stroke-width="1.8" marker-end="url(#m1253)"/><line x1="400" y1="502" x2="400" y2="602" stroke="#245574" stroke-width="1.8" marker-end="url(#m1253)"/><line x1="460" y1="502" x2="460" y2="602" stroke="#245574" stroke-width="1.8" marker-end="url(#m1253)"/><line x1="132" y1="526" x2="508" y2="526" stroke="#987740" stroke-width="1.4" stroke-dasharray="6 5"/><line x1="132" y1="566" x2="508" y2="566" stroke="#987740" stroke-width="1.4" stroke-dasharray="6 5"/><text x="480.0" y="476.0" class="" text-anchor="end" style="fill:#987740;font-weight:bold;font-size:13px">dashed lines = equipotentials</text><text x="320.0" y="628.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">d is the plate separation; V is the potential difference</text><rect x="600" y="478" width="268" height="136" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="734.0" y="502.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">The membrane is this capacitor</text><text x="734.0" y="528.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">ΔV ≈ 70 mV across d ≈ 8 nm</text><text x="734.0" y="554.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">E ≈ 10⁷ V/m</text><text x="734.0" y="582.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">a tiny voltage across a tiny gap</text><text x="734.0" y="602.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">makes an enormous field</text><text x="460.0" y="684.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">Released from rest, which way does it go?</text><rect x="100" y="704" width="720" height="44" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="196.0" y="732.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">positive charge</text><text x="420.0" y="732.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">force along E</text><text x="640.0" y="732.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">moves to LOWER V</text><rect x="100" y="756" width="720" height="44" rx="9" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="196.0" y="784.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">negative charge</text><text x="420.0" y="784.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">force against E</text><text x="640.0" y="784.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">moves to HIGHER V</text><text x="460.0" y="816.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">Either way the potential energy drops and the kinetic energy rises</text><text x="460.0" y="840.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">U = qV, so the sign of q decides which V is favourable</text></svg>