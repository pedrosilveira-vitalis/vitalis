<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="t d"><title id="t">Reading author voice: three signals</title><desc id="d">Three panels. Left, loaded word pairs with the same factual content but different evaluative framing: implemented versus imposed, argue versus complain, change versus disrupt, sought versus demanded, careful versus timid; the second word in each pair carries the author&#x27;s judgment. Middle, a ladder of commitment from weakest to strongest: attribution phrases such as proponents claim or according to some scholars, which distance the author entirely; epistemic adverbs such as perhaps, possibly, arguably; modal verbs such as may, might, could; limiting phrases such as in certain contexts or to some extent; and at the top, flat unhedged assertion, which marks a claim the author is sure of. A note warns that wrong answers often move the author one rung up or down. Right, how to tell the author&#x27;s voice from a reported voice: the author&#x27;s own voice appears in evaluative language with no attribution, in the thesis and conclusion, in the framing of concessions and refutations, and in any first-person use; reported voice is flagged by phrases such as according to, X argues that, proponents claim, critics contend. A reminder notes that an author may present an opposing view generously before dismantling it, so favourable description is not endorsement.</desc><defs><marker id="m8238" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="660" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Reading author voice: three signals</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Word choice, hedging strength, and whose voice is speaking.</text><rect x="30" y="100" width="300" height="44" rx="12" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="180.0" y="130.0" class="" text-anchor="middle" style="font-size:15px">1 · Word choice carries judgment</text><rect x="30" y="164" width="140" height="46" rx="8" fill="#ffffff" stroke="#6d716f" stroke-width="1.5"/><text x="100.0" y="193.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">implemented</text><rect x="190" y="164" width="140" height="46" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="260.0" y="193.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:15px">imposed</text><text x="180.0" y="193.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">vs</text><rect x="30" y="220" width="140" height="46" rx="8" fill="#ffffff" stroke="#6d716f" stroke-width="1.5"/><text x="100.0" y="249.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">argue</text><rect x="190" y="220" width="140" height="46" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="260.0" y="249.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:15px">complain</text><text x="180.0" y="249.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">vs</text><rect x="30" y="276" width="140" height="46" rx="8" fill="#ffffff" stroke="#6d716f" stroke-width="1.5"/><text x="100.0" y="305.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">change</text><rect x="190" y="276" width="140" height="46" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="260.0" y="305.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:15px">disrupt</text><text x="180.0" y="305.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">vs</text><rect x="30" y="332" width="140" height="46" rx="8" fill="#ffffff" stroke="#6d716f" stroke-width="1.5"/><text x="100.0" y="361.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">sought</text><rect x="190" y="332" width="140" height="46" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="260.0" y="361.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:15px">demanded</text><text x="180.0" y="361.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">vs</text><rect x="30" y="388" width="140" height="46" rx="8" fill="#ffffff" stroke="#6d716f" stroke-width="1.5"/><text x="100.0" y="417.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">careful</text><rect x="190" y="388" width="140" height="46" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="260.0" y="417.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:15px">timid</text><text x="180.0" y="417.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">vs</text><text x="180.0" y="460.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">Same facts. The right-hand word is the</text><text x="180.0" y="477.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">author showing their hand.</text><rect x="350" y="100" width="300" height="44" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="500.0" y="130.0" class="" text-anchor="middle" style="font-size:15px">2 · Strength of the claim ↑</text><rect x="350" y="164" width="300" height="62" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="366.0" y="190.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:700;font-size:14px">flat assertion</text><text x="366.0" y="210.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">&quot;X is the case&quot; — author is sure</text><rect x="350" y="236" width="300" height="62" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="366.0" y="262.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:14px">limiting phrase</text><text x="366.0" y="282.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">in certain contexts, to some extent</text><rect x="350" y="308" width="300" height="62" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="366.0" y="334.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:14px">modal verb</text><text x="366.0" y="354.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">may, might, could</text><rect x="350" y="380" width="300" height="62" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="366.0" y="406.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:14px">epistemic adverb</text><text x="366.0" y="426.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">perhaps, possibly, arguably</text><rect x="350" y="452" width="300" height="62" rx="8" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="366.0" y="478.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:700;font-size:14px">attribution</text><text x="366.0" y="498.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">proponents claim, according to…</text><line x1="338" y1="504" x2="338" y2="174" stroke="#18364a" stroke-width="2.5" marker-end="url(#m8238)"/><text x="500.0" y="540.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:13px">Wrong answers move the author one rung</text><text x="500.0" y="557.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:13px">up or down.</text><rect x="670" y="100" width="300" height="44" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="820.0" y="130.0" class="" text-anchor="middle" style="font-size:15px">3 · Whose voice is this?</text><rect x="670" y="164" width="300" height="196" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="820.0" y="194.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:15px">The author&#x27;s own voice</text><text x="820.0" y="217.0" class="" text-anchor="middle" style="font-size:13px">evaluative words with no source attached ·</text><text x="820.0" y="235.0" class="" text-anchor="middle" style="font-size:13px">the thesis and the conclusion · how a</text><text x="820.0" y="253.0" class="" text-anchor="middle" style="font-size:13px">concession is framed before the refutation ·</text><text x="820.0" y="271.0" class="" text-anchor="middle" style="font-size:13px">any first person</text><rect x="670" y="376" width="300" height="172" rx="12" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="820.0" y="406.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:700;font-size:15px">Someone else&#x27;s, reported</text><text x="820.0" y="429.0" class="" text-anchor="middle" style="font-size:13px">according to X · X argues that · proponents</text><text x="820.0" y="447.0" class="" text-anchor="middle" style="font-size:13px">claim · critics contend · it has been</text><text x="820.0" y="465.0" class="" text-anchor="middle" style="font-size:13px">suggested</text><text x="820.0" y="578.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:13px">An author may state an opposing view</text><text x="820.0" y="596.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:13px">generously before taking it apart.</text><text x="820.0" y="614.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:13px">Describing it well is not endorsing it.</text></svg>