<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="t d"><title id="t">Blood pressure control works on several timescales</title><desc id="d">A timeline shows the baroreceptor reflex acting in seconds, catecholamines and ADH over minutes to hours, the renin-angiotensin-aldosterone system over hours to days, and pressure natriuresis over days to weeks. Below, a flow chart: low renal perfusion, low NaCl at the macula densa, or sympathetic beta-1 input triggers renin from juxtaglomerular cells; renin converts angiotensinogen from the liver to angiotensin I; ACE, mainly in lung endothelium, forms angiotensin II; angiotensin II causes vasoconstriction, aldosterone release, ADH release and thirst, raising blood volume and pressure.</desc><defs><marker id="m1783" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker><marker id="m4016" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker><marker id="m6665" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="700" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Blood pressure control works on several timescales</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Top: approximate onset of each mechanism. Bottom: the renin-angiotensin-aldosterone cascade.</text><line x1="60" y1="150" x2="940" y2="150" stroke="#18364a" stroke-width="2"/><rect x="60" y="165" width="180" height="70" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="150.0" y="192.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:17px">Seconds</text><text x="150.0" y="218.0" class="" text-anchor="middle" style="font-size:15px">Baroreceptor reflex</text><rect x="260" y="165" width="180" height="70" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="350.0" y="192.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:17px">Minutes–hours</text><text x="350.0" y="218.0" class="" text-anchor="middle" style="font-size:15px">Catecholamines, ADH</text><rect x="460" y="165" width="220" height="70" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="570.0" y="192.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:17px">Hours–days</text><text x="570.0" y="218.0" class="" text-anchor="middle" style="font-size:15px">RAAS, aldosterone</text><rect x="700" y="165" width="230" height="70" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="815.0" y="192.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:17px">Days–weeks</text><text x="815.0" y="218.0" class="" text-anchor="middle" style="font-size:15px">Pressure natriuresis</text><line x1="900" y1="150" x2="945" y2="150" stroke="#18364a" stroke-width="2.5" marker-end="url(#m6665)"/><rect x="40" y="300" width="230" height="120" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="155.0" y="330.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:19px">Triggers</text><text x="155.0" y="357.0" class="" text-anchor="middle" style="font-size:15px">↓ renal perfusion, ↓ NaCl at</text><text x="155.0" y="377.0" class="" text-anchor="middle" style="font-size:15px">macula densa, ↑ sympathetic</text><text x="155.0" y="397.0" class="" text-anchor="middle" style="font-size:15px">β₁</text><rect x="320" y="300" width="190" height="120" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="415.0" y="330.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:19px">JG cells</text><text x="415.0" y="357.0" class="" text-anchor="middle" style="font-size:15px">release renin</text><rect x="560" y="300" width="190" height="120" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="655.0" y="330.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:19px">Angiotensinogen</text><text x="655.0" y="357.0" class="" text-anchor="middle" style="font-size:15px">(liver) → angiotensin I</text><rect x="790" y="300" width="180" height="120" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="880.0" y="330.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:19px">ACE</text><text x="880.0" y="357.0" class="" text-anchor="middle" style="font-size:15px">(mostly lung</text><text x="880.0" y="377.0" class="" text-anchor="middle" style="font-size:15px">endothelium) →</text><text x="880.0" y="397.0" class="" text-anchor="middle" style="font-size:15px">angiotensin II</text><line x1="270" y1="360" x2="318" y2="360" stroke="#245574" stroke-width="2.5" marker-end="url(#m4016)"/><line x1="510" y1="360" x2="558" y2="360" stroke="#245574" stroke-width="2.5" marker-end="url(#m4016)"/><text x="534.0" y="350.0" class="" text-anchor="middle" style="fill:#245574;font-size:15px">renin</text><line x1="750" y1="360" x2="788" y2="360" stroke="#245574" stroke-width="2.5" marker-end="url(#m4016)"/><rect x="40" y="500" width="215" height="105" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="147.5" y="530.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:19px">Vasoconstriction</text><text x="147.5" y="557.0" class="" text-anchor="middle" style="font-size:15px">↑ TPR (AT₁)</text><line x1="880" y1="420" x2="147" y2="498" stroke="#a8324a" stroke-width="1.6" marker-end="url(#m1783)"/><rect x="275" y="500" width="215" height="105" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="382.5" y="530.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:19px">Aldosterone</text><text x="382.5" y="557.0" class="" text-anchor="middle" style="font-size:15px">↑ Na⁺ reabsorption, ↑ K⁺</text><text x="382.5" y="577.0" class="" text-anchor="middle" style="font-size:15px">secretion</text><line x1="880" y1="420" x2="382" y2="498" stroke="#a8324a" stroke-width="1.6" marker-end="url(#m1783)"/><rect x="510" y="500" width="215" height="105" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="617.5" y="530.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:19px">ADH release</text><text x="617.5" y="557.0" class="" text-anchor="middle" style="font-size:15px">↑ water reabsorption</text><line x1="880" y1="420" x2="617" y2="498" stroke="#a8324a" stroke-width="1.6" marker-end="url(#m1783)"/><rect x="745" y="500" width="215" height="105" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="852.5" y="530.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:19px">Thirst</text><text x="852.5" y="557.0" class="" text-anchor="middle" style="font-size:15px">↑ water intake</text><line x1="880" y1="420" x2="852" y2="498" stroke="#a8324a" stroke-width="1.6" marker-end="url(#m1783)"/><text x="500.0" y="650.0" class="" text-anchor="middle" style="font-weight:700;font-size:17px">Net effect: ↑ blood volume and ↑ TPR → ↑ MAP.  ANP/BNP oppose the cascade.</text></svg>