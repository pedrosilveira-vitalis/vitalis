<svg xmlns="http://www.w3.org/2000/svg" width="920" height="820" viewBox="0 0 920 820" role="img" aria-labelledby="t d"><title id="t">From air to fluid to a nerve impulse</title><desc id="d">Top: the chain from ear canal to cochlea, with the canal resonating near 3.4 kilohertz, the eardrum&#x27;s 55 square millimetres concentrated onto the oval window&#x27;s 3.2, and the ossicular lever adding another factor, together worth roughly 20 to 30 decibels. Bottom left: the uncoiled cochlea, narrow and stiff at the base where high frequencies peak and wide and floppy at the apex where low frequencies peak. Bottom right: the hair cell cascade, from stereocilia bending through potassium entry from endolymph to glutamate release onto the cochlear nerve, with the outer hair cells amplifying through prestin.</desc><defs><marker id="m6979" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker><marker id="m979" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b7a64"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="820" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">From air to fluid to a nerve impulse</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">The middle ear fixes an impedance mismatch; the cochlea turns frequency into position</text><rect x="40" y="112" width="840" height="230" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="142.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">Why the middle ear exists</text><rect x="80" y="172" width="168" height="94" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="164.0" y="198.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">ear canal</text><text x="164.0" y="222.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">≈2.5 cm, a closed pipe</text><text x="164.0" y="244.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">resonates ≈ 3.4 kHz</text><line x1="250" y1="219" x2="270" y2="219" stroke="#18364a" stroke-width="2.5" marker-end="url(#m6979)"/><rect x="272" y="172" width="168" height="94" rx="9" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="356.0" y="198.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">eardrum</text><text x="356.0" y="222.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">area ≈ 55 mm²</text><text x="356.0" y="244.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">collects the force</text><line x1="442" y1="219" x2="462" y2="219" stroke="#18364a" stroke-width="2.5" marker-end="url(#m6979)"/><rect x="464" y="172" width="168" height="94" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="548.0" y="198.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">ossicles</text><text x="548.0" y="222.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">lever ≈ 1.3×</text><text x="548.0" y="244.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">malleus–incus–stapes</text><line x1="634" y1="219" x2="654" y2="219" stroke="#18364a" stroke-width="2.5" marker-end="url(#m6979)"/><rect x="656" y="172" width="168" height="94" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="740.0" y="198.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">oval window</text><text x="740.0" y="222.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">area ≈ 3.2 mm²</text><text x="740.0" y="244.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">17–20× the pressure</text><line x1="826" y1="219" x2="858" y2="219" stroke="#18364a" stroke-width="2.5" marker-end="url(#m6979)"/><text x="846.0" y="268.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">cochlea</text><text x="460.0" y="296.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">Air meets fluid: without this stage ≈ 99.9% of the energy would reflect</text><text x="460.0" y="322.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">area ratio × lever ⇒ a pressure gain worth roughly 20–30 dB</text><rect x="40" y="362" width="416" height="300" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="248.0" y="392.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:17px">The cochlea, uncoiled</text><path d="M80 460 L420 436 L420 504 L80 480 Z" stroke="#987740" stroke-width="2" fill="#f1eadc"/><text x="72.0" y="474.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:14px">base</text><text x="428.0" y="474.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:14px">apex</text><text x="114.0" y="522.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">narrow, stiff</text><text x="380.0" y="530.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">wide, floppy</text><line x1="107.2" y1="444" x2="107.2" y2="496" stroke="#a8324a" stroke-width="2.5"/><text x="107.2" y="424.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">20 kHz</text><line x1="233.0" y1="444" x2="233.0" y2="496" stroke="#987740" stroke-width="2.5"/><text x="233.0" y="424.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">2 kHz</text><line x1="386.0" y1="444" x2="386.0" y2="496" stroke="#5b7a64" stroke-width="2.5"/><text x="386.0" y="424.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">20 Hz</text><path d="M80.0 556.0 L83.4 555.9 L86.8 555.8 L90.2 555.6 L93.6 555.5 L97.0 555.5 L100.4 555.6 L103.8 555.8 L107.2 556.2 L110.6 556.6 L114.0 557.1 L117.4 557.5 L120.8 557.7 L124.2 557.6 L127.6 557.0 L131.0 556.1 L134.4 554.8 L137.8 553.4 L141.2 552.2 L144.6 551.4 L148.0 551.4 L151.4 552.4 L154.8 554.4 L158.2 557.1 L161.6 560.3 L165.0 563.3 L168.4 565.4 L171.8 566.1 L175.2 564.9 L178.6 561.7 L182.0 556.9 L185.4 551.1 L188.8 545.4 L192.2 540.9 L195.6 538.7 L199.0 539.5 L202.4 543.4 L205.8 550.2 L209.2 558.6 L212.6 567.3 L216.0 574.6 L219.4 579.0 L222.8 579.5 L226.2 575.8 L229.6 568.4 L233.0 558.5 L236.4 548.0 L239.8 538.6 L243.2 532.3 L246.6 530.1 L250.0 532.4 L253.4 538.8 L256.8 548.0 L260.2 558.3 L263.6 567.8 L267.0 574.8 L270.4 578.2 L273.8 577.6 L277.2 573.4 L280.6 566.6 L284.0 558.6 L287.4 550.9 L290.8 544.8 L294.2 541.3 L297.6 540.7 L301.0 542.7 L304.4 546.7 L307.8 551.7 L311.2 556.7 L314.6 560.8 L318.0 563.4 L321.4 564.4 L324.8 563.8 L328.2 562.0 L331.6 559.5 L335.0 557.0 L338.4 554.7 L341.8 553.2 L345.2 552.4 L348.6 552.4 L352.0 553.1 L355.4 554.0 L358.8 555.1 L362.2 556.1 L365.6 556.8 L369.0 557.2 L372.4 557.3 L375.8 557.1 L379.2 556.8 L382.6 556.5 L386.0 556.1 L389.4 555.9 L392.8 555.7 L396.2 555.7 L399.6 555.7 L403.0 555.7 L406.4 555.8 L409.8 555.9 L413.2 556.0 L416.6 556.0 L420.0 556.1" stroke="#245574" stroke-width="2" fill="none"/><text x="248.0" y="598.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">the wave peaks where the membrane matches the tone</text><text x="248.0" y="626.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">noise and ageing hit the base first: high tones go first</text><rect x="472" y="362" width="408" height="300" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="676.0" y="392.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">How bending becomes firing</text><text x="498.0" y="420.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:15px">stereocilia bend</text><text x="498.0" y="440.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">shear against the tectorial membrane</text><line x1="508" y1="448" x2="508" y2="460" stroke="#5b7a64" stroke-width="2" marker-end="url(#m979)"/><text x="498.0" y="472.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:15px">tip links pull open K⁺ channels</text><text x="498.0" y="492.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">endolymph is the rare high-K⁺ fluid</text><line x1="508" y1="500" x2="508" y2="512" stroke="#5b7a64" stroke-width="2" marker-end="url(#m979)"/><text x="498.0" y="524.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:15px">K⁺ flows in</text><text x="498.0" y="544.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">+80 mV endolymph vs −70 mV cell ⇒ 150 mV push</text><line x1="508" y1="552" x2="508" y2="564" stroke="#5b7a64" stroke-width="2" marker-end="url(#m979)"/><text x="498.0" y="576.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:15px">Ca²⁺ enters, glutamate out</text><text x="498.0" y="596.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">onto the cochlear nerve, CN VIII</text><rect x="492" y="604" width="376" height="48" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="680.0" y="624.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">Outer hair cells amplify by 40–50 dB using prestin;</text><text x="680.0" y="642.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">lose them and the loss is sensorineural, not conductive</text><text x="460.0" y="700.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">Open pipe: fₙ = nv/2L, every n   •   Closed pipe: fₙ = nv/4L, odd n only</text><text x="460.0" y="732.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">A closed pipe sounds an octave below an open pipe of the same length</text><text x="460.0" y="762.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Beats: f = |f₁ − f₂|, the trick behind tuning and Doppler flow probes</text><text x="460.0" y="792.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Conductive loss spares the cochlea; sensorineural loss starts at high frequencies</text></svg>