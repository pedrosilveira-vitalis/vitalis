<svg xmlns="http://www.w3.org/2000/svg" width="920" height="884" viewBox="0 0 920 884" role="img" aria-labelledby="t d"><title id="t">Memory is several systems wearing one name</title><desc id="d">Top: the branching of long-term memory. Explicit memory, which needs conscious access, splits into episodic memory for personal events, run by the hippocampus, and semantic memory for plain facts, hubbed in the anterior temporal lobes. Implicit memory, which shows without conscious recall, splits into procedural skills in the basal ganglia and cerebellum, priming in the neocortex, classical conditioning with the amygdala for fear and the cerebellum for eyeblink, and non-associative habituation and sensitisation. Middle: the clinical dissociations, with each disease matched to the structure it attacks and the memory it spares. Bottom: consolidation, from synaptic changes within hours through long-term potentiation to systems consolidation over months, as sleep replays the trace and the cortex gradually takes over from the hippocampus.</desc><defs><marker id="m5252" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="884" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Memory is several systems wearing one name</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Which structure is damaged tells you exactly which kind of remembering fails</text><rect x="40" y="156" width="840" height="288" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="184.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">One name, two families</text><rect x="390" y="198" width="140" height="34" rx="8" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="460.0" y="221.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">LONG-TERM</text><line x1="424" y1="234" x2="262" y2="258" stroke="#6d716f" stroke-width="1.8" marker-end="url(#m5252)"/><line x1="496" y1="234" x2="658" y2="258" stroke="#6d716f" stroke-width="1.8" marker-end="url(#m5252)"/><rect x="140" y="260" width="244" height="34" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="262.0" y="283.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">EXPLICIT — you can state it</text><rect x="536" y="260" width="244" height="34" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="658.0" y="283.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">IMPLICIT — it shows in behaviour</text><rect x="76" y="312" width="170" height="92" rx="9" fill="none" stroke="#245574" stroke-width="2"/><text x="161.0" y="336.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">episodic</text><text x="161.0" y="358.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">your own events,</text><text x="161.0" y="374.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">placed in time</text><text x="161.0" y="396.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:11px">hippocampus</text><rect x="258" y="312" width="170" height="92" rx="9" fill="none" stroke="#245574" stroke-width="2"/><text x="343.0" y="336.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">semantic</text><text x="343.0" y="358.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">facts with no</text><text x="343.0" y="374.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">personal context</text><text x="343.0" y="396.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:11px">anterior temporal</text><rect x="460" y="312" width="136" height="92" rx="9" fill="none" stroke="#a8324a" stroke-width="2"/><text x="528.0" y="336.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">procedural</text><text x="528.0" y="358.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">skills and habits</text><text x="528.0" y="382.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:10px">basal ganglia,</text><text x="528.0" y="395.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:10px">cerebellum</text><rect x="606" y="312" width="136" height="92" rx="9" fill="none" stroke="#a8324a" stroke-width="2"/><text x="674.0" y="336.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">priming</text><text x="674.0" y="358.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">prior exposure</text><text x="674.0" y="374.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">speeds processing</text><text x="674.0" y="382.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:10px">neocortex</text><rect x="752" y="312" width="136" height="92" rx="9" fill="none" stroke="#a8324a" stroke-width="2"/><text x="820.0" y="336.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">conditioning</text><text x="820.0" y="358.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">fear → amygdala;</text><text x="820.0" y="374.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">eyeblink → cerebellum</text><text x="460.0" y="426.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">H.M. lost the left family entirely and kept the right one intact</text><rect x="40" y="460" width="840" height="206" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="460.0" y="488.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">Which structure, which failure</text><text x="224.0" y="510.0" class="" text-anchor="end" style="fill:#245574;font-weight:bold;font-size:13px">medial temporal lobe</text><text x="240.0" y="510.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">H.M., hypoxia</text><text x="858.0" y="510.0" class="" text-anchor="end" style="fill:#6d716f;font-size:12px">no new episodes; skills and priming fine</text><text x="224.0" y="548.0" class="" text-anchor="end" style="fill:#987740;font-weight:bold;font-size:13px">diencephalon</text><text x="240.0" y="548.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">Korsakoff: mammillary bodies,</text><text x="240.0" y="563.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">mediodorsal thalamus</text><text x="858.0" y="548.0" class="" text-anchor="end" style="fill:#6d716f;font-size:12px">amnesia plus confabulation</text><text x="224.0" y="592.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:bold;font-size:13px">anterior temporal</text><text x="240.0" y="592.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">semantic dementia</text><text x="858.0" y="592.0" class="" text-anchor="end" style="fill:#6d716f;font-size:12px">concepts go; recent episodes hold up</text><text x="224.0" y="630.0" class="" text-anchor="end" style="fill:#5b7a64;font-weight:bold;font-size:13px">striatum</text><text x="240.0" y="630.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">Parkinson&#x27;s, Huntington&#x27;s</text><text x="858.0" y="630.0" class="" text-anchor="end" style="fill:#6d716f;font-size:12px">habits and skills go; facts hold up</text><text x="460.0" y="652.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">a double dissociation: hippocampal damage spares concepts, temporal-pole damage spares episodes</text><rect x="40" y="682" width="840" height="178" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="710.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">Consolidation runs on two clocks</text><rect x="70" y="730" width="370" height="104" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="255.0" y="756.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">SYNAPTIC — minutes to hours</text><text x="255.0" y="780.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">LTP: NMDA receptors, calcium in,</text><text x="255.0" y="798.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">AMPA receptors inserted, protein made</text><text x="255.0" y="820.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">the synapse itself gets stronger</text><rect x="480" y="730" width="370" height="104" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="665.0" y="756.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">SYSTEMS — weeks to years</text><text x="665.0" y="780.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">sleep replays the trace; the cortex</text><text x="665.0" y="798.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">gradually takes over from the hippocampus</text><text x="665.0" y="820.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">which is why old memories survive the lesion</text></svg>