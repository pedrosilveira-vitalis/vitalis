<svg xmlns="http://www.w3.org/2000/svg" width="920" height="898" viewBox="0 0 920 898" role="img" aria-labelledby="t d"><title id="t">Two axes, three stages, two appraisals</title><desc id="d">Top: Selye&#x27;s curve, which is worth seeing rather than listing. Resistance dips below normal during alarm, because the defences are still being mobilised; it climbs above normal through the resistance stage, where the organism looks fine and is quietly spending reserves; then it falls away in exhaustion. Middle: the two stress axes side by side. The sympathetic-adrenal-medullary arm fires in seconds and is the one you feel; the HPA axis takes minutes, lasts hours, and is the one that does the long-term damage when its negative feedback stops working. Bottom: Lazarus and Folkman&#x27;s two appraisals, and the rule that decides which kind of coping will actually help — whether the stressor can be changed at all.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="898" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Two axes, three stages, two appraisals</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Whether something is a stressor is decided twice before the body commits</text><rect x="40" y="174" width="840" height="236" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="202.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">General Adaptation Syndrome</text><line x1="120" y1="346" x2="820" y2="346" stroke="#18364a" stroke-width="2"/><line x1="120" y1="226" x2="120" y2="346" stroke="#18364a" stroke-width="2"/><text x="470.0" y="390.0" class="" text-anchor="middle" style="font-size:17px"></text><text x="76" y="286.0" text-anchor="middle" transform="rotate(-90 76 286.0)" style="font-size:17px">resistance to the stressor</text><line x1="120.0" y1="286.0" x2="820.0" y2="286.0" stroke="#6d716f" stroke-width="1.4" stroke-dasharray="6 5"/><text x="826.0" y="290.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10px">normal</text><path d="M120.0 286.0 L123.5 287.6 L127.0 289.2 L130.5 290.8 L134.0 292.4 L137.5 294.0 L141.0 295.6 L144.5 297.2 L148.0 298.8 L151.5 300.4 L155.0 302.0 L158.5 303.6 L162.0 305.2 L165.5 306.8 L169.0 308.4 L172.5 310.0 L176.0 311.6 L179.5 313.2 L183.0 314.8 L186.5 316.4 L190.0 318.0 L193.5 318.0 L197.0 318.0 L200.5 318.0 L204.0 318.0 L207.5 318.0 L211.0 318.0 L214.5 318.0 L218.0 318.0 L221.5 318.0 L225.0 318.0 L228.5 318.0 L232.0 318.0 L235.5 318.0 L239.0 318.0 L242.5 318.0 L246.0 318.0 L249.5 318.0 L253.0 318.0 L256.5 318.0 L260.0 318.0 L263.5 316.0 L267.0 314.0 L270.5 312.0 L274.0 310.0 L277.5 308.0 L281.0 306.0 L284.5 304.0 L288.0 302.0 L291.5 300.0 L295.0 298.0 L298.5 296.0 L302.0 294.0 L305.5 292.0 L309.0 290.0 L312.5 288.0 L316.0 286.0 L319.5 284.0 L323.0 282.0 L326.5 280.0 L330.0 278.0 L333.5 276.0 L337.0 274.0 L340.5 272.0 L344.0 270.0 L347.5 268.0 L351.0 266.0 L354.5 264.0 L358.0 262.0 L361.5 260.0 L365.0 258.0 L368.5 256.0 L372.0 254.0 L375.5 252.0 L379.0 250.0 L382.5 248.0 L386.0 246.0 L389.5 246.0 L393.0 246.0 L396.5 246.0 L400.0 246.0 L403.5 246.0 L407.0 246.0 L410.5 246.0 L414.0 246.0 L417.5 246.0 L421.0 246.0 L424.5 246.0 L428.0 246.0 L431.5 246.0 L435.0 246.0 L438.5 246.0 L442.0 246.0 L445.5 246.0 L449.0 246.0 L452.5 246.0 L456.0 246.0 L459.5 246.0 L463.0 246.0 L466.5 246.0 L470.0 246.0 L473.5 246.0 L477.0 246.0 L480.5 246.0 L484.0 246.0 L487.5 246.0 L491.0 246.0 L494.5 246.0 L498.0 246.0 L501.5 246.0 L505.0 246.0 L508.5 246.0 L512.0 246.0 L515.5 246.0 L519.0 246.0 L522.5 246.0 L526.0 246.0 L529.5 246.0 L533.0 246.0 L536.5 246.0 L540.0 246.0 L543.5 246.0 L547.0 246.0 L550.5 246.0 L554.0 246.0 L557.5 246.0 L561.0 246.0 L564.5 246.0 L568.0 246.0 L571.5 246.0 L575.0 246.0 L578.5 246.1 L582.0 246.3 L585.5 246.6 L589.0 247.0 L592.5 247.4 L596.0 247.9 L599.5 248.4 L603.0 249.0 L606.5 249.6 L610.0 250.2 L613.5 250.9 L617.0 251.7 L620.5 252.4 L624.0 253.2 L627.5 254.1 L631.0 255.0 L634.5 255.9 L638.0 256.8 L641.5 257.8 L645.0 258.8 L648.5 259.8 L652.0 260.9 L655.5 262.0 L659.0 263.1 L662.5 264.3 L666.0 265.5 L669.5 266.7 L673.0 267.9 L676.5 269.2 L680.0 270.5 L683.5 271.8 L687.0 273.2 L690.5 274.5 L694.0 275.9 L697.5 277.3 L701.0 278.8 L704.5 280.3 L708.0 281.7 L711.5 283.3 L715.0 284.8 L718.5 286.4 L722.0 288.0 L725.5 289.6 L729.0 291.2 L732.5 292.8 L736.0 294.5 L739.5 296.2 L743.0 297.9 L746.5 299.7 L750.0 301.5 L753.5 303.2 L757.0 305.0 L760.5 306.9 L764.0 308.7 L767.5 310.6 L771.0 312.5 L774.5 314.4 L778.0 316.3 L781.5 318.3 L785.0 320.2 L788.5 322.2 L792.0 324.2 L795.5 326.3 L799.0 328.3 L802.5 330.4 L806.0 332.5 L809.5 334.6 L813.0 336.7 L816.5 338.8 L820.0 341.0" stroke="#245574" stroke-width="3" fill="none"/><text x="190.0" y="368.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">ALARM</text><text x="421.0" y="368.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">RESISTANCE</text><text x="708.0" y="368.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">EXHAUSTION</text><line x1="260.0" y1="346.0" x2="260.0" y2="231.0" stroke="#6d716f" stroke-width="1" stroke-dasharray="6 5"/><line x1="575.0" y1="346.0" x2="575.0" y2="231.0" stroke="#6d716f" stroke-width="1" stroke-dasharray="6 5"/><text x="221.5" y="299.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:10px">defences still</text><text x="221.5" y="312.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:10px">being mobilised</text><text x="421.0" y="234.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">looks fine, spending reserves</text><text x="694.0" y="326.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:11px">reserves gone → illness</text><text x="460.0" y="394.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">allostatic load is the bill for every trip round this curve</text><rect x="40" y="426" width="840" height="200" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="460.0" y="454.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">The two axes, by speed</text><rect x="70" y="474" width="380" height="134" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="260.0" y="498.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">SAM — seconds</text><text x="260.0" y="522.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">hypothalamus → sympathetic nerves</text><text x="260.0" y="542.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">→ adrenal MEDULLA → epinephrine</text><text x="260.0" y="570.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">heart, airways, pupils, glucose</text><text x="260.0" y="592.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">this is what a fright feels like</text><rect x="470" y="474" width="380" height="134" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="660.0" y="498.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">HPA — minutes to hours</text><text x="660.0" y="522.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">CRH → ACTH → adrenal CORTEX</text><text x="660.0" y="542.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">→ cortisol, for hours</text><text x="660.0" y="570.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">glucose up, immunity down, muscle broken down</text><text x="660.0" y="592.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">feedback failure here is what injures</text><rect x="40" y="642" width="840" height="232" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="460.0" y="670.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">Appraised twice, then coped with</text><rect x="70" y="690" width="236" height="160" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="188.0" y="714.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">PRIMARY</text><text x="188.0" y="734.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">does this matter?</text><text x="188.0" y="762.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">irrelevant</text><text x="188.0" y="784.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">benign-positive</text><text x="188.0" y="806.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">harm · threat · challenge</text><text x="188.0" y="834.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">challenge beats threat</text><rect x="326" y="690" width="236" height="160" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="444.0" y="714.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">SECONDARY</text><text x="444.0" y="734.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">can I handle it?</text><text x="444.0" y="762.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">what are my options</text><text x="444.0" y="784.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">do I have support</text><text x="444.0" y="806.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">have I done this before</text><text x="444.0" y="834.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">self-efficacy lives here</text><rect x="582" y="690" width="268" height="160" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="716.0" y="714.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">WHICH COPING HELPS?</text><text x="716.0" y="742.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">controllable → PROBLEM-focused</text><text x="716.0" y="762.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">act on the stressor itself</text><text x="716.0" y="790.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">uncontrollable → EMOTION-focused</text><text x="716.0" y="810.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">reappraise, seek support, accept</text><text x="716.0" y="836.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:11px">mismatch the two and coping backfires</text></svg>