<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">Separate switches in lac and trp regulation</title><desc id="desc">LacI represses while CAP-cAMP activates. In the trp leader, high charged tRNA allows a ribosome to cover region 2 so regions 3 and 4 pair to terminate. Low charged tRNA stalls the ribosome in region 1, allowing 2 and 3 to pair and transcription to continue.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#aa3653;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">Operons: identify which switch changed</text><rect x="24" y="60" width="752" height="170" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="94" class="h" text-anchor="start">lac: repressor relief and activation are separate</text><text x="55" y="132" class="t" text-anchor="start">Allolactose → less LacI repression</text><text x="55" y="166" class="t" text-anchor="start">CAP + cAMP → stronger transcription initiation</text><text x="55" y="203" class="s" text-anchor="start">Loss of LacI does not remove regulation by CAP-cAMP.</text><rect x="24" y="246" width="752" height="350" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="280" class="h" text-anchor="start">trp: ribosome position controls alternative RNA pairing</text><text x="55" y="330" class="t" text-anchor="start">High charged Trp-tRNA</text><rect x="70" y="345" width="65" height="30" rx="5" fill="#e4eef1"/><text x="102" y="366" class="t" text-anchor="middle">1</text><path d="M135 360 L215 360" class="bond" /><rect x="215" y="345" width="65" height="30" rx="5" fill="#e4eef1"/><text x="247" y="366" class="t" text-anchor="middle">2</text><path d="M280 360 L360 360" class="bond" /><rect x="360" y="345" width="65" height="30" rx="5" fill="#e4eef1"/><text x="392" y="366" class="t" text-anchor="middle">3</text><path d="M425 360 L505 360" class="bond" /><rect x="505" y="345" width="65" height="30" rx="5" fill="#e4eef1"/><text x="537" y="366" class="t" text-anchor="middle">4</text><ellipse cx="247" cy="347" rx="44" ry="24" fill="#aa3653" opacity=".25"/><path d="M392 376 V392 H537 V376" class="accent"/><text x="55" y="420" class="t" text-anchor="start">3–4 terminator → less readthrough</text><text x="55" y="475" class="t" text-anchor="start">Low charged Trp-tRNA</text><rect x="70" y="490" width="65" height="30" rx="5" fill="#e4eef1"/><text x="102" y="511" class="t" text-anchor="middle">1</text><path d="M135 505 L215 505" class="bond" /><rect x="215" y="490" width="65" height="30" rx="5" fill="#e4eef1"/><text x="247" y="511" class="t" text-anchor="middle">2</text><path d="M280 505 L360 505" class="bond" /><rect x="360" y="490" width="65" height="30" rx="5" fill="#e4eef1"/><text x="392" y="511" class="t" text-anchor="middle">3</text><path d="M425 505 L505 505" class="bond" /><rect x="505" y="490" width="65" height="30" rx="5" fill="#e4eef1"/><text x="537" y="511" class="t" text-anchor="middle">4</text><ellipse cx="102" cy="492" rx="44" ry="24" fill="#aa3653" opacity=".25"/><path d="M247 521 V537 H392 V521" class="accent"/><text x="55" y="565" class="t" text-anchor="start">2–3 antiterminator → more readthrough</text><text x="55" y="584" class="s" text-anchor="start">Pink oval = ribosome; bracket = competing RNA pairing (schematic).</text><rect x="24" y="612" width="752" height="104" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="646" class="t" text-anchor="start">Deleting trpR removes only the initiation repressor.</text><text x="44" y="679" class="t" text-anchor="start">An intact leader still regulates readthrough by attenuation.</text></svg>