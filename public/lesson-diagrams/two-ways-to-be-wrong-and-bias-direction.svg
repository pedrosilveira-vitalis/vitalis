<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1016" viewBox="0 0 920 1016" role="img" aria-labelledby="t d"><title id="t">Two ways to be wrong</title><desc id="d">Top: the 2×2 that organises hypothesis testing. The truth sits in the columns and your decision in the rows, which gives exactly two ways to be wrong and exactly two ways to be right. Alpha is the rate of the false alarm, beta the rate of the miss, and power is the complement of beta. Tightening alpha trades one error for the other; only a bigger sample shrinks both at once. Middle: what moves power, and the confidence interval as the same test read off an interval. Bottom: the biases sorted by the direction they push the result, because passages usually ask which way the error runs rather than what the bias is called.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="1016" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Two ways to be wrong</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">The decision table, and which direction each bias pushes the result</text><rect x="40" y="180" width="840" height="288" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">The decision table</text><text x="455.0" y="240.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:10px">THE TRUTH</text><text x="340.0" y="262.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">H₀ is TRUE</text><text x="340.0" y="276.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">(there is no effect)</text><text x="620.0" y="262.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">H₀ is FALSE</text><text x="620.0" y="276.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">(there is a real effect)</text><text x="150.0" y="328.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">YOU REJECT H₀</text><text x="150.0" y="344.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">“there is an effect”</text><text x="150.0" y="408.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">YOU FAIL TO REJECT</text><text x="150.0" y="424.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">“not enough evidence”</text><rect x="250" y="292" width="180" height="72" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="340.0" y="316.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">TYPE I ERROR</text><text x="340.0" y="334.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8px">false positive · “I cried wolf”</text><text x="340.0" y="352.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:8.5px">probability = α</text><rect x="530" y="292" width="180" height="72" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="620.0" y="316.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">CORRECT</text><text x="620.0" y="334.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8px">you found a real effect</text><text x="620.0" y="352.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:8.5px">probability = POWER = 1 − β</text><rect x="250" y="372" width="180" height="72" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="340.0" y="396.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">CORRECT</text><text x="340.0" y="414.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8px">nothing there, nothing claimed</text><text x="340.0" y="432.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:8.5px">probability = 1 − α</text><rect x="530" y="372" width="180" height="72" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="620.0" y="396.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10.5px">TYPE II ERROR</text><text x="620.0" y="414.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8px">false negative · “I missed the wolf”</text><text x="620.0" y="432.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:8.5px">probability = β</text><text x="460.0" y="456.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">lowering α trades a Type I error for a Type II error — only a LARGER SAMPLE reduces both at once</text><rect x="40" y="484" width="410" height="250" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="245.0" y="512.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">What raises POWER</text><rect x="64" y="536" width="362" height="40" rx="7" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.4"/><text x="245.0" y="553.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10px">bigger SAMPLE</text><text x="245.0" y="568.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">the one you can actually change</text><rect x="64" y="581" width="362" height="40" rx="7" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.4"/><text x="245.0" y="598.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10px">bigger EFFECT</text><text x="245.0" y="613.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">a real difference that is large</text><rect x="64" y="626" width="362" height="40" rx="7" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.4"/><text x="245.0" y="643.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10px">less VARIABILITY</text><text x="245.0" y="658.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">tighter measurement, cleaner design</text><rect x="64" y="671" width="362" height="40" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.4"/><text x="245.0" y="688.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10px">larger α</text><text x="245.0" y="703.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">but you buy it with Type I errors</text><text x="245.0" y="724.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">convention: α = 0.05, β = 0.20, power = 0.80</text><rect x="470" y="484" width="410" height="250" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="675.0" y="512.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13.5px">The same test, read off an interval</text><rect x="494" y="532" width="362" height="56" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="675.0" y="554.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">a DIFFERENCE: does the CI contain 0?</text><text x="675.0" y="574.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">if not, it is significant at α = 0.05</text><rect x="494" y="596" width="362" height="56" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="675.0" y="618.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">a RATIO (RR or OR): does it contain 1?</text><text x="675.0" y="638.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">if not, it is significant at α = 0.05</text><rect x="494" y="660" width="362" height="62" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="675.0" y="680.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10px">WIDTH</text><text x="675.0" y="698.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">wider: smaller N, more variability,</text><text x="675.0" y="712.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">or a HIGHER confidence level (99% &gt; 95%)</text><rect x="40" y="750" width="840" height="248" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="460.0" y="778.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">Which way does the bias push?</text><text x="245.0" y="804.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">INFLATES THE EFFECT</text><text x="675.0" y="804.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">HIDES OR SHRINKS THE EFFECT</text><rect x="60" y="820" width="390" height="32" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.2"/><text x="150.0" y="841.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:9px">recall bias</text><text x="350.0" y="841.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">the ill search their past harder</text><rect x="470" y="820" width="390" height="32" rx="6" fill="#e4edf3" stroke="#245574" stroke-width="1.2"/><text x="580.0" y="841.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:8.5px">non-differential misclassification</text><text x="770.0" y="841.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">noise in either variable</text><rect x="60" y="855" width="390" height="32" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.2"/><text x="150.0" y="876.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:9px">publication bias</text><text x="350.0" y="876.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">null results stay in the drawer</text><rect x="470" y="855" width="390" height="32" rx="6" fill="#e4edf3" stroke="#245574" stroke-width="1.2"/><text x="580.0" y="876.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:8.5px">diffusion of treatment</text><text x="770.0" y="876.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">controls get the treatment too</text><rect x="60" y="890" width="390" height="32" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.2"/><text x="150.0" y="911.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:9px">lead-time bias</text><text x="350.0" y="911.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">earlier diagnosis, not longer life</text><rect x="470" y="890" width="390" height="32" rx="6" fill="#e4edf3" stroke="#245574" stroke-width="1.2"/><text x="580.0" y="911.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:8.5px">low power</text><text x="770.0" y="911.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">a real effect goes undetected</text><rect x="60" y="925" width="390" height="32" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.2"/><text x="150.0" y="946.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:9px">length-time bias</text><text x="350.0" y="946.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">screening catches the slow cancers</text><rect x="470" y="925" width="390" height="32" rx="6" fill="#e4edf3" stroke="#245574" stroke-width="1.2"/><text x="580.0" y="946.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:8.5px">ceiling and floor effects</text><text x="770.0" y="946.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">the scale runs out of room</text><rect x="60" y="960" width="390" height="32" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.2"/><text x="150.0" y="981.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:9px">observer bias</text><text x="350.0" y="981.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">if the rater knows the group</text><rect x="470" y="960" width="390" height="32" rx="6" fill="#e4edf3" stroke="#245574" stroke-width="1.2"/><text x="580.0" y="981.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:8.5px">attrition</text><text x="770.0" y="981.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">either way, depending on who leaves</text></svg>