<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">Protein domains, subunits and chaperones</title><desc id="desc">Domains belong to one chain; subunits are separate chains. Soluble proteins often bury nonpolar residues. Hsp70 binds clients tightly in its ADP state and releases them following ATP rebinding.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#aa3653;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">From one chain to an assembled protein</text><rect x="24" y="60" width="752" height="190" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="94" class="h" text-anchor="start">1  Domains are not subunits</text><path d="M55 158 C85 98 140 214 180 155 S260 100 300 161" stroke="#a8324a" stroke-width="6" fill="none"/><ellipse cx="108" cy="151" rx="48" ry="37" fill="none" stroke="#a8324a" stroke-dasharray="4 3"/><ellipse cx="251" cy="151" rx="48" ry="37" fill="none" stroke="#a8324a" stroke-dasharray="4 3"/><text x="50" y="212" class="s" text-anchor="start">One continuous chain, two domains</text><ellipse cx="524" cy="134" rx="43" ry="22" fill="#a8324a"/><ellipse cx="620" cy="134" rx="43" ry="22" fill="#24495c"/><ellipse cx="524" cy="184" rx="43" ry="22" fill="#24495c"/><ellipse cx="620" cy="184" rx="43" ry="22" fill="#a8324a"/><text x="455" y="226" class="s" text-anchor="start">Four chains form a tetramer</text><rect x="24" y="266" width="752" height="190" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="300" class="h" text-anchor="start">2  Soluble globular protein: core versus surface</text><ellipse cx="165" cy="374" rx="90" ry="54" fill="#e5eef0" stroke="#24495c" stroke-width="3"/><circle cx="143" cy="365" r="10" fill="#bc9450"/><circle cx="180" cy="376" r="10" fill="#bc9450"/><circle cx="157" cy="395" r="10" fill="#bc9450"/><text x="280" y="351" class="t" text-anchor="start">Nonpolar groups often cluster inside.</text><text x="280" y="384" class="t" text-anchor="start">Polar and charged groups often face water.</text><text x="280" y="417" class="s" text-anchor="start">Real cores also contain specific polar contacts.</text><rect x="24" y="472" width="752" height="244" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="506" class="h" text-anchor="start">3  Hsp70: nucleotide controls client binding</text><rect x="55" y="543" width="310" height="55" rx="15" fill="#e4eef1"/><text x="210" y="577" class="t" text-anchor="middle">ATP: rapid exchange</text><rect x="433" y="543" width="310" height="55" rx="15" fill="#f4dfd4"/><text x="588" y="577" class="t" text-anchor="middle">ADP: tight hold</text><path d="M365 565 L422 565 L411 558 M422 565 L411 572" class="bond"/><text x="400" y="535" class="s" text-anchor="middle">Hydrolysis</text><path d="M580 602 L580 636 L210 636 L210 604 M210 604 L203 615 M210 604 L217 615" class="bond"/><text x="400" y="662" class="s" text-anchor="middle">ADP release + ATP rebinding → client release</text><text x="50" y="694" class="s" text-anchor="start">Cochaperones coordinate the cycle; hydrolysis does not itself release the client.</text></svg>