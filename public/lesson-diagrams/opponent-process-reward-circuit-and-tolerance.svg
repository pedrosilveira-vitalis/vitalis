<svg xmlns="http://www.w3.org/2000/svg" width="920" height="964" viewBox="0 0 920 964" role="img" aria-labelledby="t d"><title id="t">Addiction is a shift in what the drug is for</title><desc id="d">Top: the opponent-process arc. Early on the drug is taken for the A process, the pleasure, and the behaviour is positively reinforced. With repetition the A process shrinks through tolerance while the B process, the compensatory dysphoria, grows and outlasts it. The motive flips to negative reinforcement: using to stop feeling bad. Bottom left: where that happens anatomically — the ventral tegmental area to nucleus accumbens pathway that every drug of abuse converges on, the amygdala and hippocampus that attach cues to it, and the migration of control from prefrontal cortex to dorsal striatum that turns a choice into a habit. Bottom right: the two adaptations that make up tolerance, and the diagnostic rule that keeps a medical patient from being mislabelled.</desc><defs><marker id="m9247" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker><marker id="m9277" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="964" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Addiction is a shift in what the drug is for</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">From chasing the high to escaping its absence — and the circuit changes with it</text><rect x="40" y="180" width="840" height="318" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">Opponent process · the same drug, two different jobs</text><line x1="110" y1="400" x2="810" y2="400" stroke="#18364a" stroke-width="2"/><line x1="110" y1="240" x2="110" y2="400" stroke="#18364a" stroke-width="2"/><text x="460.0" y="444.0" class="" text-anchor="middle" style="font-size:17px"></text><text x="66" y="320.0" text-anchor="middle" transform="rotate(-90 66 320.0)" style="font-size:17px"></text><line x1="110" y1="320" x2="810" y2="320" stroke="#6d716f" stroke-width="1.2" stroke-dasharray="6 5"/><text x="100.0" y="324.0" class="" text-anchor="end" style="fill:#6d716f;font-size:9px">0</text><path d="M110.0 313.7 L113.5 312.4 L117.0 310.8 L120.5 309.0 L124.0 307.0 L127.5 304.6 L131.0 302.1 L134.5 299.3 L138.0 296.2 L141.5 292.9 L145.0 289.5 L148.5 285.8 L152.0 282.1 L155.5 278.3 L159.0 274.5 L162.5 270.7 L166.0 267.1 L169.5 263.7 L173.0 260.5 L176.5 257.7 L180.0 255.4 L183.5 253.5 L187.0 252.1 L190.5 251.2 L194.0 250.9 L197.5 251.2 L201.0 252.1 L204.5 253.5 L208.0 255.4 L211.5 257.7 L215.0 260.5 L218.5 263.7 L222.0 267.1 L225.5 270.7 L229.0 274.5 L232.5 278.3 L236.0 282.1 L239.5 285.8 L243.0 289.5 L246.5 292.9 L250.0 296.2 L253.5 299.3 L257.0 302.1 L260.5 304.6 L264.0 307.0 L267.5 309.0 L271.0 310.8 L274.5 312.4 L278.0 313.7 L281.5 314.9 L285.0 315.9 L288.5 316.7 L292.0 317.4 L295.5 317.9 L299.0 318.4 L302.5 318.7 L306.0 319.0 L309.5 319.3 L313.0 319.4 L316.5 319.6 L320.0 319.7 L323.5 319.8 L327.0 319.8 L330.5 319.9 L334.0 319.9 L337.5 319.9 L341.0 320.0 L344.5 320.0 L348.0 320.0 L351.5 320.0 L355.0 320.0 L358.5 320.0 L362.0 320.0 L365.5 320.0 L369.0 320.0 L372.5 320.0 L376.0 320.0 L379.5 320.0 L383.0 320.0 L386.5 320.0 L390.0 320.0" stroke="#a8324a" stroke-width="2.4" fill="none"/><path d="M110.0 321.5 L113.5 321.7 L117.0 321.9 L120.5 322.1 L124.0 322.3 L127.5 322.5 L131.0 322.8 L134.5 323.1 L138.0 323.4 L141.5 323.7 L145.0 324.1 L148.5 324.4 L152.0 324.8 L155.5 325.2 L159.0 325.7 L162.5 326.1 L166.0 326.6 L169.5 327.1 L173.0 327.6 L176.5 328.2 L180.0 328.8 L183.5 329.4 L187.0 330.0 L190.5 330.6 L194.0 331.2 L197.5 331.9 L201.0 332.6 L204.5 333.3 L208.0 334.0 L211.5 334.7 L215.0 335.4 L218.5 336.1 L222.0 336.8 L225.5 337.5 L229.0 338.2 L232.5 338.8 L236.0 339.5 L239.5 340.1 L243.0 340.8 L246.5 341.3 L250.0 341.9 L253.5 342.4 L257.0 342.9 L260.5 343.4 L264.0 343.8 L267.5 344.2 L271.0 344.5 L274.5 344.8 L278.0 345.0 L281.5 345.2 L285.0 345.3 L288.5 345.4 L292.0 345.5 L295.5 345.4 L299.0 345.3 L302.5 345.2 L306.0 345.0 L309.5 344.8 L313.0 344.5 L316.5 344.2 L320.0 343.8 L323.5 343.4 L327.0 342.9 L330.5 342.4 L334.0 341.9 L337.5 341.3 L341.0 340.8 L344.5 340.1 L348.0 339.5 L351.5 338.8 L355.0 338.2 L358.5 337.5 L362.0 336.8 L365.5 336.1 L369.0 335.4 L372.5 334.7 L376.0 334.0 L379.5 333.3 L383.0 332.6 L386.5 331.9 L390.0 331.2" stroke="#245574" stroke-width="2.4" fill="none"/><text x="312.0" y="266.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">A · the high</text><text x="248.0" y="370.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">B · the rebound</text><text x="215.0" y="412.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">EARLY USE</text><text x="215.0" y="430.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">big A, small B — positive reinforcement</text><path d="M460.0 318.0 L463.5 317.6 L467.0 317.1 L470.5 316.5 L474.0 315.9 L477.5 315.2 L481.0 314.3 L484.5 313.5 L488.0 312.5 L491.5 311.5 L495.0 310.4 L498.5 309.2 L502.0 308.0 L505.5 306.8 L509.0 305.6 L512.5 304.4 L516.0 303.3 L519.5 302.2 L523.0 301.2 L526.5 300.3 L530.0 299.6 L533.5 299.0 L537.0 298.5 L540.5 298.3 L544.0 298.2 L547.5 298.3 L551.0 298.5 L554.5 299.0 L558.0 299.6 L561.5 300.3 L565.0 301.2 L568.5 302.2 L572.0 303.3 L575.5 304.4 L579.0 305.6 L582.5 306.8 L586.0 308.0 L589.5 309.2 L593.0 310.4 L596.5 311.5 L600.0 312.5 L603.5 313.5 L607.0 314.3 L610.5 315.2 L614.0 315.9 L617.5 316.5 L621.0 317.1 L624.5 317.6 L628.0 318.0 L631.5 318.4 L635.0 318.7 L638.5 319.0 L642.0 319.2 L645.5 319.3 L649.0 319.5 L652.5 319.6 L656.0 319.7 L659.5 319.8 L663.0 319.8 L666.5 319.9 L670.0 319.9 L673.5 319.9 L677.0 319.9 L680.5 320.0 L684.0 320.0 L687.5 320.0 L691.0 320.0 L694.5 320.0 L698.0 320.0 L701.5 320.0 L705.0 320.0 L708.5 320.0 L712.0 320.0 L715.5 320.0 L719.0 320.0 L722.5 320.0 L726.0 320.0 L729.5 320.0 L733.0 320.0 L736.5 320.0 L740.0 320.0 L743.5 320.0 L747.0 320.0 L750.5 320.0 L754.0 320.0 L757.5 320.0 L761.0 320.0 L764.5 320.0 L768.0 320.0 L771.5 320.0 L775.0 320.0 L778.5 320.0 L782.0 320.0 L785.5 320.0 L789.0 320.0 L792.5 320.0 L796.0 320.0 L799.5 320.0 L803.0 320.0 L806.5 320.0 L810.0 320.0" stroke="#a8324a" stroke-width="2.4" fill="none"/><path d="M460.0 326.5 L463.5 327.0 L467.0 327.6 L470.5 328.1 L474.0 328.7 L477.5 329.3 L481.0 330.0 L484.5 330.7 L488.0 331.4 L491.5 332.2 L495.0 333.0 L498.5 333.8 L502.0 334.6 L505.5 335.5 L509.0 336.5 L512.5 337.4 L516.0 338.4 L519.5 339.5 L523.0 340.5 L526.5 341.6 L530.0 342.7 L533.5 343.9 L537.0 345.1 L540.5 346.3 L544.0 347.5 L547.5 348.7 L551.0 350.0 L554.5 351.3 L558.0 352.6 L561.5 353.9 L565.0 355.2 L568.5 356.5 L572.0 357.9 L575.5 359.2 L579.0 360.5 L582.5 361.8 L586.0 363.1 L589.5 364.4 L593.0 365.7 L596.5 366.9 L600.0 368.1 L603.5 369.3 L607.0 370.5 L610.5 371.6 L614.0 372.7 L617.5 373.7 L621.0 374.7 L624.5 375.6 L628.0 376.5 L631.5 377.3 L635.0 378.1 L638.5 378.8 L642.0 379.4 L645.5 380.0 L649.0 380.4 L652.5 380.9 L656.0 381.2 L659.5 381.5 L663.0 381.7 L666.5 381.8 L670.0 381.8 L673.5 381.8 L677.0 381.7 L680.5 381.5 L684.0 381.2 L687.5 380.9 L691.0 380.4 L694.5 380.0 L698.0 379.4 L701.5 378.8 L705.0 378.1 L708.5 377.3 L712.0 376.5 L715.5 375.6 L719.0 374.7 L722.5 373.7 L726.0 372.7 L729.5 371.6 L733.0 370.5 L736.5 369.3 L740.0 368.1 L743.5 366.9 L747.0 365.7 L750.5 364.4 L754.0 363.1 L757.5 361.8 L761.0 360.5 L764.5 359.2 L768.0 357.9 L771.5 356.5 L775.0 355.2 L778.5 353.9 L782.0 352.6 L785.5 351.3 L789.0 350.0 L792.5 348.7 L796.0 347.5 L799.5 346.3 L803.0 345.1 L806.5 343.9 L810.0 342.7" stroke="#245574" stroke-width="2.4" fill="none"/><text x="600.0" y="296.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">A shrinks</text><text x="752.0" y="346.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">B grows and lasts</text><text x="655.0" y="412.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">AFTER CHRONIC USE</text><text x="655.0" y="430.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">small A, big B — negative reinforcement</text><text x="460.0" y="466.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">the person now uses to stop feeling bad, not to feel good</text><text x="460.0" y="486.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">withdrawal is always roughly the opposite of the drug&#x27;s own effect</text><rect x="40" y="514" width="410" height="428" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="245.0" y="542.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">Where it happens</text><rect x="78" y="566" width="150" height="52" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="153.0" y="590.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">VTA</text><text x="153.0" y="608.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">dopamine source</text><line x1="232" y1="592" x2="268" y2="592" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m9247)"/><rect x="272" y="566" width="150" height="52" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="347.0" y="590.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11.5px">N. ACCUMBENS</text><text x="347.0" y="608.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">ventral striatum</text><text x="245.0" y="638.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">every drug of abuse ends up raising dopamine here</text><text x="245.0" y="656.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">far above anything food or sex produces</text><rect x="78" y="674" width="344" height="54" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="250.0" y="696.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:11.5px">AMYGDALA + HIPPOCAMPUS</text><text x="250.0" y="714.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">attach places, people and paraphernalia to the drug → cue-induced craving</text><rect x="78" y="742" width="344" height="54" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="250.0" y="764.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11.5px">PREFRONTAL CORTEX</text><text x="250.0" y="782.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">weakens: the brake on using despite consequences</text><line x1="250" y1="800" x2="250" y2="826" stroke="#18364a" stroke-width="2.5" marker-end="url(#m9277)"/><text x="324.0" y="813.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">control migrates</text><rect x="78" y="832" width="344" height="54" rx="8" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="250.0" y="854.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11.5px">DORSAL STRIATUM</text><text x="250.0" y="872.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">goal-directed choice becomes automatic habit</text><text x="245.0" y="912.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">which is why insight alone does not stop it</text><rect x="470" y="514" width="410" height="428" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="675.0" y="542.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">Two kinds of tolerance</text><rect x="494" y="566" width="362" height="78" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="675.0" y="586.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:11.5px">PHARMACOKINETIC</text><text x="675.0" y="604.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">the liver gets faster</text><text x="675.0" y="622.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">CYP450 induction — alcohol induces CYP2E1,</text><text x="675.0" y="635.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">so less drug reaches the brain per dose</text><rect x="494" y="652" width="362" height="78" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="675.0" y="672.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11.5px">PHARMACODYNAMIC</text><text x="675.0" y="690.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">the receptors adapt</text><text x="675.0" y="708.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">downregulation, desensitisation, and in opioids</text><text x="675.0" y="721.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">upregulated adenylyl cyclase — the cell fights back</text><rect x="494" y="738" width="362" height="78" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="675.0" y="758.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11.5px">BEHAVIOURAL</text><text x="675.0" y="776.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">the setting learns too</text><text x="675.0" y="794.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">tolerance is partly conditioned to the usual place;</text><text x="675.0" y="807.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">using somewhere new is how people overdose</text><rect x="494" y="828" width="362" height="100" rx="10" fill="#e8ecef" stroke="#18364a" stroke-width="2.4"/><text x="675.0" y="852.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10.5px">AND THE RULE THAT PROTECTS PATIENTS</text><text x="675.0" y="872.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9.5px">Tolerance and withdrawal do NOT count toward</text><text x="675.0" y="887.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9.5px">a substance use disorder when the drug is taken</text><text x="675.0" y="902.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9.5px">solely under appropriate medical supervision.</text><text x="675.0" y="917.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">Physical dependence is not addiction.</text></svg>