<svg xmlns="http://www.w3.org/2000/svg" width="920" height="902" viewBox="0 0 920 902" role="img" aria-labelledby="t d"><title id="t">Four stages, and the one thing each one cannot yet do</title><desc id="d">Top: Piaget&#x27;s four stages laid on an age line, each with the achievement that defines it and the limitation that gives it away in a vignette. Middle: the engine — a schema that absorbs new input is assimilating; when the input will not fit, the resulting disequilibrium forces the schema itself to change, and that accommodation is what moves development forward. Bottom: the same child described by Piaget and by Vygotsky. For Piaget the child is a lone scientist and readiness has to come before teaching; for Vygotsky the child is an apprentice, teaching leads development, and the useful zone is the gap between what the child manages alone and what the child manages with help.</desc><defs><marker id="m7259" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="902" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Four stages, and the one thing each one cannot yet do</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Vignette questions give you an age and a behaviour — read the behaviour</text><rect x="40" y="150" width="840" height="282" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="178.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">The four stages, by what the child cannot yet do</text><rect x="62" y="200" width="198" height="196" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="161.0" y="226.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">SENSORIMOTOR</text><text x="161.0" y="246.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">birth – 2 yr</text><text x="161.0" y="276.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">object permanence;</text><text x="161.0" y="292.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">deferred imitation</text><line x1="86" y1="310" x2="236" y2="310" stroke="#5b7a64" stroke-width="1" stroke-dasharray="6 5"/><text x="161.0" y="332.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">cannot yet:</text><text x="161.0" y="352.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">no symbols early on;</text><text x="161.0" y="368.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">A-not-B error at 8–12 mo</text><rect x="266" y="200" width="198" height="196" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="365.0" y="226.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">PREOPERATIONAL</text><text x="365.0" y="246.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">2 – 7 yr</text><text x="365.0" y="276.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">symbols, language,</text><text x="365.0" y="292.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">pretend play</text><line x1="290" y1="310" x2="440" y2="310" stroke="#987740" stroke-width="1" stroke-dasharray="6 5"/><text x="365.0" y="332.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:11px">cannot yet:</text><text x="365.0" y="352.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">egocentrism, centration,</text><text x="365.0" y="368.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">no conservation</text><rect x="470" y="200" width="198" height="196" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="569.0" y="226.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">CONCRETE OPERATIONAL</text><text x="569.0" y="246.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">7 – 11 yr</text><text x="569.0" y="276.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">conservation, seriation,</text><text x="569.0" y="292.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">classification</text><line x1="494" y1="310" x2="644" y2="310" stroke="#245574" stroke-width="1" stroke-dasharray="6 5"/><text x="569.0" y="332.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">cannot yet:</text><text x="569.0" y="352.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">cannot reason from a</text><text x="569.0" y="368.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">premise it knows is false</text><rect x="674" y="200" width="198" height="196" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="773.0" y="226.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">FORMAL OPERATIONAL</text><text x="773.0" y="246.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">11 yr +</text><text x="773.0" y="276.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">hypothetical-deductive</text><text x="773.0" y="292.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">reasoning</text><line x1="698" y1="310" x2="848" y2="310" stroke="#a8324a" stroke-width="1" stroke-dasharray="6 5"/><text x="773.0" y="332.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">cannot yet:</text><text x="773.0" y="352.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">not universal; many adults</text><text x="773.0" y="368.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">never use it in every domain</text><text x="460.0" y="418.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">the order never changes and no stage is skipped — the ages are approximate, the sequence is not</text><rect x="40" y="448" width="840" height="196" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="476.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">What actually moves a child forward</text><rect x="70" y="496" width="212" height="118" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="176.0" y="522.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">ASSIMILATION</text><text x="176.0" y="546.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">new input fits the</text><text x="176.0" y="564.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">schema you have</text><text x="176.0" y="594.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">every four-legged</text><text x="176.0" y="608.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">animal is &quot;doggie&quot;</text><rect x="354" y="496" width="212" height="118" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="460.0" y="522.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">DISEQUILIBRIUM</text><text x="460.0" y="546.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">the input will not fit</text><text x="460.0" y="564.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">— that is the cat</text><text x="460.0" y="594.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">cognitive conflict is</text><text x="460.0" y="608.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">the motivator</text><rect x="638" y="496" width="212" height="118" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="744.0" y="522.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">ACCOMMODATION</text><text x="744.0" y="546.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">the schema itself</text><text x="744.0" y="564.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">splits or changes</text><text x="744.0" y="594.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">equilibrium returns,</text><text x="744.0" y="608.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">at a higher level</text><line x1="290" y1="555" x2="346" y2="555" stroke="#6d716f" stroke-width="2" marker-end="url(#m7259)"/><line x1="574" y1="555" x2="630" y2="555" stroke="#6d716f" stroke-width="2" marker-end="url(#m7259)"/><rect x="40" y="660" width="840" height="212" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="460.0" y="688.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">The same child, two theories</text><text x="258.0" y="716.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">PIAGET</text><text x="690.0" y="716.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">VYGOTSKY</text><line x1="474" y1="706" x2="474" y2="856" stroke="#6d716f" stroke-width="1" stroke-dasharray="6 5"/><text x="452.0" y="742.0" class="" text-anchor="end" style="fill:#18364a;font-size:12px">development drives learning</text><text x="496.0" y="742.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">learning drives development</text><text x="452.0" y="766.0" class="" text-anchor="end" style="fill:#18364a;font-size:12px">readiness must come first</text><text x="496.0" y="766.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">teach inside the ZPD</text><text x="452.0" y="790.0" class="" text-anchor="end" style="fill:#18364a;font-size:12px">the child as lone scientist</text><text x="496.0" y="790.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">the child as apprentice</text><text x="452.0" y="814.0" class="" text-anchor="end" style="fill:#18364a;font-size:12px">private speech = egocentrism</text><text x="496.0" y="814.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">private speech = a tool for self-control</text><text x="452.0" y="838.0" class="" text-anchor="end" style="fill:#18364a;font-size:12px">thought comes first, language follows</text><text x="496.0" y="838.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">language transforms thought</text></svg>