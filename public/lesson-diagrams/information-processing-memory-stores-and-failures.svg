<svg xmlns="http://www.w3.org/2000/svg" width="920" height="892" viewBox="0 0 920 892" role="img" aria-labelledby="t d"><title id="t">Three stores, three failures</title><desc id="d">Top: the flow from the world through sensory memory, which holds a great deal for well under a second, into working memory, which holds about seven chunks for fifteen to thirty seconds, and on into long-term memory, which has no known limit; attention gates the first transfer and encoding the second, and retrieval brings things back. Middle left: the branching of long-term memory into explicit memory, which splits into episodic and semantic, and implicit memory, which splits into procedural, priming and conditioning, with the structure each depends on. Middle right: Baddeley&#x27;s working memory, a central executive over a phonological loop, a visuospatial sketchpad and an episodic buffer. Bottom left: levels of processing, from structural through phonemic to semantic, with memory strength rising as processing deepens. Bottom right: the two kinds of interference, old disrupting new and new disrupting old.</desc><defs><marker id="m3166" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker><marker id="m419" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker><marker id="m7440" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="892" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Three stores, three failures</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Encoding, storage, retrieval — name which one broke and the answer follows</text><rect x="40" y="150" width="840" height="182" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="178.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">The pipeline, and what gates each step</text><rect x="96" y="198" width="214" height="96" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="203.0" y="224.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">SENSORY</text><text x="203.0" y="248.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">everything, &lt; 1 s</text><text x="203.0" y="270.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">iconic ≈ 250–500 ms</text><text x="203.0" y="286.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">echo ≈ 3–4 s</text><rect x="366" y="198" width="214" height="96" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="473.0" y="224.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">WORKING</text><text x="473.0" y="248.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">≈ 7 chunks, 15–30 s</text><text x="473.0" y="270.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">rehearsal keeps it</text><text x="473.0" y="286.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">alive, nothing more</text><rect x="636" y="198" width="214" height="96" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="743.0" y="224.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">LONG-TERM</text><text x="743.0" y="248.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">no known limit</text><text x="743.0" y="270.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">minutes to</text><text x="743.0" y="286.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">a lifetime</text><line x1="314" y1="246" x2="362" y2="246" stroke="#18364a" stroke-width="2.4" marker-end="url(#m3166)"/><text x="338.0" y="232.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">attention</text><line x1="584" y1="246" x2="632" y2="246" stroke="#18364a" stroke-width="2.4" marker-end="url(#m3166)"/><text x="608.0" y="232.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">encoding</text><line x1="632" y1="274" x2="584" y2="274" stroke="#a8324a" stroke-width="2.4" marker-end="url(#m7440)"/><text x="608.0" y="296.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">retrieval</text><text x="460.0" y="320.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">lose it at step one and it was never encoded — that is not a retrieval problem</text><rect x="40" y="348" width="440" height="268" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="260.0" y="376.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">Long-term memory is not one thing</text><rect x="190" y="392" width="140" height="32" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="260.0" y="414.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">LONG-TERM</text><line x1="224" y1="426" x2="150" y2="448" stroke="#6d716f" stroke-width="1.8" marker-end="url(#m419)"/><line x1="296" y1="426" x2="370" y2="448" stroke="#6d716f" stroke-width="1.8" marker-end="url(#m419)"/><rect x="70" y="450" width="160" height="30" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="150.0" y="471.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">EXPLICIT</text><text x="150.0" y="496.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">you can say it</text><rect x="290" y="450" width="160" height="30" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="370.0" y="471.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">IMPLICIT</text><text x="370.0" y="496.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">it just shows</text><text x="150.0" y="522.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">episodic — your own events</text><text x="150.0" y="542.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">semantic — plain facts</text><text x="150.0" y="566.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">hippocampus</text><text x="370.0" y="522.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">procedural — how to</text><text x="370.0" y="542.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">priming, conditioning</text><text x="370.0" y="566.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">basal ganglia, cerebellum</text><text x="260.0" y="596.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">H.M. lost the left branch and kept the right</text><rect x="500" y="348" width="380" height="268" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="690.0" y="376.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">Inside working memory</text><rect x="560" y="394" width="260" height="40" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="690.0" y="420.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">CENTRAL EXECUTIVE</text><text x="690.0" y="450.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">allocates attention, switches tasks</text><rect x="528" y="466" width="160" height="76" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="608.0" y="488.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">phonological loop</text><text x="608.0" y="508.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">the inner voice;</text><text x="608.0" y="524.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">holds speech ≈ 2 s</text><rect x="700" y="466" width="160" height="76" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="780.0" y="488.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">visuospatial sketchpad</text><text x="780.0" y="508.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">the inner eye;</text><text x="780.0" y="524.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">images and layout</text><rect x="528" y="554" width="332" height="34" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="694.0" y="576.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">episodic buffer: binds them to long-term memory</text><rect x="40" y="632" width="440" height="232" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="260.0" y="660.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">Deeper processing, stronger trace</text><text x="162.0" y="706.0" class="" text-anchor="end" style="fill:#6d716f;font-weight:bold;font-size:13px">structural</text><rect x="172" y="690" width="33" height="22" rx="5" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="336.0" y="706.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">is it in capitals?</text><text x="162.0" y="754.0" class="" text-anchor="end" style="fill:#245574;font-weight:bold;font-size:13px">phonemic</text><rect x="172" y="738" width="72" height="22" rx="5" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="336.0" y="754.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">does it rhyme?</text><text x="162.0" y="802.0" class="" text-anchor="end" style="fill:#5b7a64;font-weight:bold;font-size:13px">semantic</text><rect x="172" y="786" width="150" height="22" rx="5" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="336.0" y="802.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">what does it mean?</text><text x="260.0" y="836.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">repetition alone is shallow; connecting to meaning is what lasts</text><rect x="500" y="632" width="380" height="232" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="690.0" y="660.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">Which way does the interference run?</text><rect x="530" y="682" width="320" height="70" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="690.0" y="706.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">PROACTIVE: old blocks new</text><text x="690.0" y="730.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">old Spanish gets in the way of new Italian</text><rect x="530" y="766" width="320" height="70" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="690.0" y="790.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">RETROACTIVE: new blocks old</text><text x="690.0" y="814.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">new Italian crowds out the old Spanish</text></svg>