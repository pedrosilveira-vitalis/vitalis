<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="t d"><title id="t">The galvanic cell, and which way everything moves</title><desc id="d">A zinc-copper galvanic cell. On the left the zinc anode sits in zinc sulfate solution and is labelled negative, the site of oxidation, and losing mass. On the right the copper cathode sits in copper sulfate solution and is labelled positive, the site of reduction, and gaining mass. A wire across the top carries electrons from left to right through a voltmeter reading 1.10 volts, and a salt bridge below carries anions left into the anode compartment and cations right into the cathode compartment. A panel below gives the cell notation and the conventions.</desc><defs><marker id="m2032" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#987740"/></marker><marker id="m8921" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b7a64"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="900" height="640" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">The galvanic cell, and which way everything moves</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Electrons go one way through the wire; ions go the other way through the salt bridge. Both loops have to close.</text><path d="M 110 220 L 110 400 Q 110 420 130 420 L 350 420 Q 370 420 370 400 L 370 220" stroke="#18364a" stroke-width="2.5" fill="none"/><rect x="116" y="300" width="248" height="112" rx="0" fill="#e4edf3" stroke="#245574" stroke-width="0"/><text x="240.0" y="396.0" class="" text-anchor="middle" style="fill:#245574;font-size:13px">Zn²⁺ solution</text><path d="M 530 220 L 530 400 Q 530 420 550 420 L 770 420 Q 790 420 790 400 L 790 220" stroke="#18364a" stroke-width="2.5" fill="none"/><rect x="536" y="300" width="248" height="112" rx="0" fill="#f5e6e8" stroke="#a8324a" stroke-width="0"/><text x="660.0" y="396.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:13px">Cu²⁺ solution</text><rect x="206" y="180" width="26" height="170" rx="3" fill="#e4edf3" stroke="#245574" stroke-width="2.5"/><text x="219.0" y="168.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">Zn</text><rect x="668" y="180" width="26" height="170" rx="3" fill="#f5e6e8" stroke="#a8324a" stroke-width="2.5"/><text x="681.0" y="168.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">Cu</text><line x1="219" y1="180" x2="219" y2="118" stroke="#18364a" stroke-width="2.5"/><line x1="681" y1="180" x2="681" y2="118" stroke="#18364a" stroke-width="2.5"/><line x1="219" y1="118" x2="406" y2="118" stroke="#18364a" stroke-width="2.5"/><line x1="494" y1="118" x2="681" y2="118" stroke="#18364a" stroke-width="2.5"/><circle cx="450" cy="118" r="44" fill="#ffffff" stroke="#18364a" stroke-width="2.5"/><text x="450.0" y="112.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:19px">V</text><text x="450.0" y="132.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">1.10 V</text><line x1="300" y1="100" x2="380" y2="100" stroke="#5b7a64" stroke-width="2.5" marker-end="url(#m8921)"/><text x="340.0" y="88.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">e⁻</text><line x1="600" y1="100" x2="520" y2="100" stroke="#5b7a64" stroke-width="2.5" marker-end="url(#m8921)"/><text x="560.0" y="88.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">e⁻</text><path d="M 330 300 L 330 250 Q 330 232 350 232 L 550 232 Q 570 232 570 250 L 570 300" stroke="#987740" stroke-width="3" fill="none"/><text x="450.0" y="220.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">salt bridge  (KNO₃)</text><line x1="430" y1="258" x2="360" y2="258" stroke="#987740" stroke-width="2" marker-end="url(#m2032)"/><text x="395.0" y="250.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">NO₃⁻</text><line x1="470" y1="280" x2="540" y2="280" stroke="#987740" stroke-width="2" marker-end="url(#m2032)"/><text x="505.0" y="272.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">K⁺</text><text x="219.0" y="442.0" class="" text-anchor="middle" style="fill:#245574;font-size:14px">ANODE · negative · oxidation ·</text><text x="219.0" y="460.0" class="" text-anchor="middle" style="fill:#245574;font-size:14px">loses mass Zn → Zn²⁺ + 2e⁻</text><text x="681.0" y="442.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:14px">CATHODE · positive · reduction</text><text x="681.0" y="460.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:14px">· gains mass Cu²⁺ + 2e⁻ → Cu</text><rect x="60" y="496" width="780" height="128" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="450.0" y="524.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:19px">Zn(s) | Zn²⁺(aq) || Cu²⁺(aq) | Cu(s)</text><text x="450.0" y="548.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">anode on the left, cathode on the right; one bar is a phase boundary, two is the salt bridge</text><text x="228.0" y="580.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">E°cell = E°cathode − E°anode</text><text x="560.0" y="580.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">= 0.34 − (−0.76) = +1.10 V</text><text x="450.0" y="606.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Both potentials come straight off the reduction table — the subtraction already flips the anode.</text></svg>