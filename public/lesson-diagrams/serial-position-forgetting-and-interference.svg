<svg xmlns="http://www.w3.org/2000/svg" width="920" height="900" viewBox="0 0 920 900" role="img" aria-labelledby="t d"><title id="t">Why you forget, and why the delay is the experiment</title><desc id="d">Top: free recall of a word list gives a U-shaped curve. The early items were rehearsed into long-term store, so the primacy end survives a delay; the final items are still sitting in working memory, so the recency end disappears the moment you insert thirty seconds of counting backwards. That single manipulation is the classic evidence for two separate stores. Middle: the forgetting mechanisms, with the one question that separates them — was the memory never stored, stored and faded, stored but crowded out, stored but uncued, or stored and kept out. Interference is the dominant explanation for everyday long-term forgetting. Bottom: proactive against retroactive interference, decided by asking which list is being tested rather than which was learned first.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="900" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Why you forget, and why the delay is the experiment</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">The serial position curve is two memory systems measured at once</text><rect x="40" y="150" width="840" height="300" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="178.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">One curve, two stores</text><line x1="110" y1="370" x2="530" y2="370" stroke="#18364a" stroke-width="2"/><line x1="110" y1="206" x2="110" y2="370" stroke="#18364a" stroke-width="2"/><text x="320.0" y="414.0" class="" text-anchor="middle" style="font-size:17px">position in the list</text><text x="66" y="288.0" text-anchor="middle" transform="rotate(-90 66 288.0)" style="font-size:17px">proportion recalled</text><path d="M110.0 229.0 L140.0 248.6 L170.0 268.3 L200.0 288.0 L230.0 301.1 L260.0 309.3 L290.0 314.2 L320.0 315.9 L350.0 314.2 L380.0 309.3 L410.0 297.8 L440.0 278.2 L470.0 255.2 L500.0 235.5 L530.0 219.1" stroke="#245574" stroke-width="2.8" fill="none"/><path d="M110.0 233.9 L140.0 253.6 L170.0 271.6 L200.0 289.6 L230.0 302.8 L260.0 311.0 L290.0 315.9 L320.0 317.5 L350.0 317.5 L380.0 315.9 L410.0 315.9 L440.0 317.5 L470.0 319.2 L500.0 320.8 L530.0 322.4" stroke="#a8324a" stroke-width="2.6" fill="none" stroke-dasharray="8 6"/><text x="152.0" y="217.5" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:12px">PRIMACY</text><text x="152.0" y="233.5" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">rehearsed into long-term store</text><text x="482.0" y="207.6" class="" text-anchor="end" style="fill:#245574;font-weight:bold;font-size:12px">RECENCY</text><text x="482.0" y="223.6" class="" text-anchor="end" style="fill:#245574;font-size:11px">still in working memory</text><text x="470.0" y="333.9" class="" text-anchor="end" style="fill:#a8324a;font-weight:bold;font-size:11px">… and gone after 30 s of counting backwards</text><line x1="576" y1="216" x2="612" y2="216" stroke="#245574" stroke-width="3"/><text x="622.0" y="221.0" class="" text-anchor="start" style="font-size:15px">immediate free recall</text><line x1="576" y1="242" x2="612" y2="242" stroke="#a8324a" stroke-width="3" stroke-dasharray="6 5"/><text x="622.0" y="247.0" class="" text-anchor="start" style="font-size:15px">after a filled 30 s delay</text><rect x="576" y="286" width="272" height="136" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="712.0" y="312.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">WHAT THE DELAY PROVES</text><text x="712.0" y="336.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">primacy survives → long-term store</text><text x="712.0" y="356.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">recency vanishes → short-term store</text><text x="712.0" y="384.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:12px">two ends, two systems, one list</text><text x="712.0" y="406.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">slower presentation raises primacy only</text><rect x="40" y="466" width="840" height="244" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="494.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">Five ways a memory fails to come back</text><rect x="70" y="512" width="200" height="34" rx="7" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="170.0" y="534.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">Encoding failure</text><text x="292.0" y="534.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">it was never stored</text><text x="506.0" y="534.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">shallow processing; not really forgetting</text><rect x="70" y="550" width="200" height="34" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="170.0" y="572.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">Decay</text><text x="292.0" y="572.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">stored, then faded</text><text x="506.0" y="572.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">sensory and short-term store; weak for long-term</text><rect x="70" y="588" width="200" height="34" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="170.0" y="610.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">Interference</text><text x="292.0" y="610.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">stored, but crowded</text><text x="506.0" y="610.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">the main cause of everyday long-term forgetting</text><rect x="70" y="626" width="200" height="34" rx="7" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="170.0" y="648.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">Retrieval failure</text><text x="292.0" y="648.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">stored, but uncued</text><text x="506.0" y="648.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">tip of the tongue; recognition beats recall</text><rect x="70" y="664" width="200" height="34" rx="7" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="170.0" y="686.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">Motivated forgetting</text><text x="292.0" y="686.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">stored, but kept out</text><text x="506.0" y="686.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">suppression is conscious, repression is not</text><rect x="40" y="726" width="840" height="150" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="460.0" y="754.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">Which interference? Ask what is being tested, not what was learned first</text><rect x="70" y="772" width="380" height="84" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="260.0" y="796.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">PROACTIVE — old blocks new</text><text x="260.0" y="818.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">learned Spanish → now tested on Italian</text><text x="260.0" y="840.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:12px">the NEWER memory is the one being tested</text><rect x="470" y="772" width="380" height="84" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="660.0" y="796.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">RETROACTIVE — new blocks old</text><text x="660.0" y="818.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">learned Italian → now tested on Spanish</text><text x="660.0" y="840.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:12px">the OLDER memory is the one being tested</text></svg>