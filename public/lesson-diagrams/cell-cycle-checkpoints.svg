<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820" role="img" aria-labelledby="title desc"><title id="title">Copy once then separate</title><desc id="desc">G1 2n2C enters S phase where DNA doubles, G2 remains diploid2n4C, and mitosis and cytokinesis produce two2n2C daughters. An unattached kinetochore produces MCC to inhibit APC C Cdc20, keeping securin stable and separase inhibited.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#245574"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#18364a;font-size:18px}.h{font-size:25px;font-weight:700}.s{font-size:15px}.label{font-size:20px;font-weight:600}.line{stroke:#245574;stroke-width:3;fill:none}.arrow{stroke:#245574;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect width="900" height="820" rx="22" fill="#fbf7ef"/><text x="32" y="45" class="h" text-anchor="start">Copy once. Check. Separate.</text><text x="32" y="75" class="s" text-anchor="start">DNA amount (C) and chromosome-set ploidy (n) are different.</text><circle cx="175" cy="175" r="63" fill="#e4eef3" stroke="#245574" stroke-width="2"/><text x="175" y="172" class="h" text-anchor="middle">G1</text><text x="175" y="200" class="s" text-anchor="middle">2n, 2C</text><circle cx="450" cy="175" r="63" fill="#e4eef3" stroke="#245574" stroke-width="2"/><text x="450" y="172" class="h" text-anchor="middle">S</text><text x="450" y="200" class="s" text-anchor="middle">2C → 4C</text><circle cx="725" cy="175" r="63" fill="#e4eef3" stroke="#245574" stroke-width="2"/><text x="725" y="172" class="h" text-anchor="middle">G2</text><text x="725" y="200" class="s" text-anchor="middle">2n, 4C</text><circle cx="450" cy="355" r="63" fill="#e4eef3" stroke="#245574" stroke-width="2"/><text x="450" y="352" class="h" text-anchor="middle">M</text><text x="450" y="380" class="s" text-anchor="middle">Sister separation</text><path d="M245 175 H377" class="arrow"/><path d="M520 175 H652" class="arrow"/><path d="M725 245 Q725 355 521 355" class="arrow"/><path d="M380 355 Q175 355 175 246" class="arrow"/><text x="655" y="315" class="s" text-anchor="middle">CDK1–cyclin B</text><text x="218" y="432" class="s" text-anchor="start">Two daughters, normally 2n and 2C each</text><text x="660" y="401" class="s" text-anchor="middle">G2/M checks DNA</text><path d="M32 445 H868" class="line"/><text x="32" y="485" class="h" text-anchor="start">An unattached kinetochore holds anaphase</text><circle cx="77" cy="580" r="13" fill="#245574" stroke="#245574" stroke-width="2"/><rect x="238" y="530" width="19" height="90" rx="8" fill="#245574" stroke="#b6cbd8"/><rect x="277" y="530" width="19" height="90" rx="8" fill="#245574" stroke="#b6cbd8"/><circle cx="232" cy="575" r="8" fill="#e4eef3" stroke="#245574" stroke-width="2"/><circle cx="302" cy="575" r="8" fill="white" stroke="#245574" stroke-width="2"/><path d="M91 580 L224 575" class="line"/><path d="M259 575 H275" class="line"/><text x="185" y="650" class="s" text-anchor="middle">Sister chromatids + cohesin</text><text x="329" y="553" class="s" text-anchor="start">Unattached</text><text x="329" y="576" class="s" text-anchor="start">kinetochore</text><path d="M311 588 L440 617" class="arrow"/><rect x="450" y="590" width="125" height="52" rx="12" fill="#e4eef3" stroke="#b6cbd8"/><text x="512" y="622" class="" text-anchor="middle">MCC</text><path d="M585 616 H630" class="line"/><path d="M630 602 V632" class="line"/><rect x="645" y="585" width="205" height="65" rx="12" fill="#e4eef3" stroke="#b6cbd8"/><text x="747" y="613" class="" text-anchor="middle">APC/C–Cdc20</text><text x="747" y="638" class="s" text-anchor="middle">inhibited</text><path d="M747 658 V697" class="arrow"/><text x="747" y="724" class="label" text-anchor="middle">Securin retained</text><text x="747" y="753" class="s" text-anchor="middle">Separase inhibited</text><text x="747" y="780" class="s" text-anchor="middle">Cohesin not cleaved</text><text x="32" y="726" class="s" text-anchor="start">Attachment signaling and tension-dependent</text><text x="32" y="751" class="s" text-anchor="start">error correction cooperate. Some incorrect</text><text x="32" y="776" class="s" text-anchor="start">attachments can escape the checkpoint.</text></svg>