<svg xmlns="http://www.w3.org/2000/svg" width="920" height="978" viewBox="0 0 920 978" role="img" aria-labelledby="t d"><title id="t">Two routes in, and the one that sticks</title><desc id="d">Top: the elaboration likelihood model as a gate. Motivation and ability both have to be present for the central route; either one missing sends the message down the peripheral route. The two routes do not differ only in how persuasion happens but in what it produces: central-route change is durable, resistant and predicts behaviour, peripheral-route change is none of those. Note the counter-intuitive consequence in the middle — distracting an audience that would otherwise argue back can raise persuasion, because the distraction knocks out the counterarguing rather than the comprehension. Bottom left: dissonance and the three ways out of it, with the paradigms. Bottom right: what makes an attitude actually predict a behaviour.</desc><defs><marker id="m2200" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b7a64"/></marker><marker id="m8672" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#987740"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="978" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Two routes in, and the one that sticks</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Whether a message is thought about decides how long its effect lasts</text><rect x="40" y="180" width="840" height="332" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">Which route does the message take?</text><rect x="360" y="228" width="200" height="46" rx="8" fill="#efede8" stroke="#6d716f" stroke-width="1.6"/><text x="460.0" y="248.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">A PERSUASIVE MESSAGE</text><text x="460.0" y="265.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">arrives</text><rect x="300" y="290" width="320" height="42" rx="8" fill="#e8ecef" stroke="#18364a" stroke-width="1.8"/><text x="460.0" y="310.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10.5px">MOTIVATED to think about it?</text><text x="460.0" y="326.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">AND ABLE to — time, quiet, expertise?</text><line x1="390" y1="338" x2="250" y2="362" stroke="#5b7a64" stroke-width="2.5" marker-end="url(#m2200)"/><text x="290.0" y="342.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:9.5px">both yes</text><line x1="530" y1="338" x2="670" y2="362" stroke="#987740" stroke-width="2.5" marker-end="url(#m8672)"/><text x="630.0" y="342.0" class="" text-anchor="middle" style="fill:#987740;font-size:9.5px">either no</text><rect x="70" y="370" width="350" height="128" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="245.0" y="394.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">CENTRAL ROUTE</text><text x="245.0" y="414.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">the argument itself is weighed</text><line x1="110" y1="426" x2="380" y2="426" stroke="#5b7a64" stroke-width="1" stroke-dasharray="6 5"/><text x="245.0" y="446.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">change is DURABLE</text><text x="245.0" y="464.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:10px">resists later counter-persuasion</text><text x="245.0" y="482.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:10px">and it predicts behaviour</text><rect x="500" y="370" width="350" height="128" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="675.0" y="394.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">PERIPHERAL ROUTE</text><text x="675.0" y="414.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">cues stand in for the argument</text><line x1="540" y1="426" x2="810" y2="426" stroke="#987740" stroke-width="1" stroke-dasharray="6 5"/><text x="675.0" y="446.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">change is FRAGILE</text><text x="675.0" y="464.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:10px">source looks good, crowd agrees,</text><text x="675.0" y="482.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:10px">the message simply felt nice</text><rect x="40" y="528" width="410" height="426" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="245.0" y="556.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">Dissonance, and the ways out</text><rect x="64" y="578" width="362" height="56" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="245.0" y="600.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">“I smoke”  +  “smoking kills”</text><text x="245.0" y="620.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">an aversive state, like hunger — it demands action</text><rect x="64" y="646" width="362" height="48" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.6"/><text x="245.0" y="666.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">CHANGE A COGNITION</text><text x="245.0" y="683.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">quit, or decide the risk is overstated</text><rect x="64" y="700" width="362" height="48" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.6"/><text x="245.0" y="720.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:11px">ADD A COGNITION</text><text x="245.0" y="737.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">“but I run every morning” — rationalisation</text><rect x="64" y="754" width="362" height="48" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="245.0" y="774.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">DEMOTE A COGNITION</text><text x="245.0" y="791.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">“life is short anyway” — trivialisation</text><rect x="64" y="810" width="362" height="134" rx="10" fill="#e8ecef" stroke="#18364a" stroke-width="2.2"/><text x="245.0" y="834.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">THE THREE PARADIGMS</text><text x="245.0" y="854.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">INSUFFICIENT JUSTIFICATION — $1 beats $20,</text><text x="245.0" y="869.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9px">because the big payment explains the lie away</text><text x="245.0" y="884.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">POST-DECISION — after choosing, the chosen</text><text x="245.0" y="899.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9px">option looks better and the rejected one worse</text><text x="245.0" y="914.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">EFFORT JUSTIFICATION — a harsh initiation</text><text x="245.0" y="929.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9px">makes a dull group seem worth joining</text><rect x="470" y="528" width="410" height="426" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="675.0" y="556.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">When an attitude predicts behaviour</text><rect x="494" y="578" width="362" height="60" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="675.0" y="597.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">SPECIFICITY</text><text x="675.0" y="612.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">measure the attitude at the same grain as</text><text x="675.0" y="625.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">the behaviour — “recycling”, not “the environment”</text><rect x="494" y="646" width="362" height="47" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="675.0" y="665.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">STRENGTH AND ACCESS</text><text x="675.0" y="680.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">held with certainty, and it comes to mind fast</text><rect x="494" y="701" width="362" height="47" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="675.0" y="720.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">DIRECT EXPERIENCE</text><text x="675.0" y="735.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">lived, not heard about</text><rect x="494" y="756" width="362" height="47" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.6"/><text x="675.0" y="775.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10.5px">WEAK SITUATION</text><text x="675.0" y="790.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">no social pressure pulling the other way</text><rect x="494" y="817" width="362" height="150" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2.2"/><text x="675.0" y="841.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">AND WHAT THE MODEL ADDS</text><text x="675.0" y="859.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">theory of planned behaviour</text><text x="675.0" y="881.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">ATTITUDE toward the behaviour</text><text x="675.0" y="898.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">SUBJECTIVE NORMS — what others expect</text><text x="675.0" y="915.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">PERCEIVED BEHAVIOURAL CONTROL — can I?</text><text x="675.0" y="939.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">all three feed INTENTION, and intention predicts the act</text></svg>