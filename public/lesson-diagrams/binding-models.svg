<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">Binding order and affinity</title><desc id="desc">Induced fit binds a ligand before a conformational change. Conformational selection binds a pre-existing conformation. Kd measures equilibrium binding while Km describes initial-rate dependence in the Michaelis Menten model.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#245574;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">Binding order and affinity are separate questions</text><rect x="24" y="60" width="752" height="170" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="96" class="h" text-anchor="start">1  Induced fit: bind, then rearrange</text><text x="65" y="151" class="h" text-anchor="start">E + S  ⇌  ES  ⇌  E* S</text><text x="65" y="201" class="t" text-anchor="start">A bound complex changes its conformation.</text><rect x="24" y="246" width="752" height="170" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="282" class="h" text-anchor="start">2  Conformational selection: sample, then bind</text><text x="65" y="337" class="h" text-anchor="start">E  ⇌  E*     then     E* + S  ⇌  E* S</text><text x="65" y="387" class="t" text-anchor="start">The binding-ready conformation already exists.</text><rect x="24" y="432" width="752" height="284" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="469" class="h" text-anchor="start">3  What does an experiment establish?</text><text x="65" y="512" class="t" text-anchor="start">Different bound/unbound structures show flexibility.</text><text x="65" y="548" class="t" text-anchor="start">They do not, alone, establish the order of events.</text><text x="65" y="590" class="t" text-anchor="start">Kd = k₋₁ / k₁     •     equilibrium affinity</text><text x="65" y="631" class="t" text-anchor="start">Km = (k₋₁ + kcat) / k₁     •     simple kinetic model</text><text x="65" y="678" class="t" text-anchor="start">Km ≈ Kd only if kcat ≪ k₋₁ in this model.</text></svg>