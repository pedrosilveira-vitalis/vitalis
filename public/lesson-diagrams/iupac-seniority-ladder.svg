<svg xmlns="http://www.w3.org/2000/svg" width="900" height="696" viewBox="0 0 900 696" role="img" aria-labelledby="t d"><title id="t">Seniority decides the suffix; everything else drops to a prefix</title><desc id="d">A ranked ladder of eleven functional groups from carboxylic acid down to alkane, each with the suffix it takes when it is the senior group and the prefix it takes when outranked. Below, the name methyl (2S)-2-amino-3-(4-hydroxyphenyl)propanoate is split into its parts and each part is labelled.</desc><defs><marker id="m519" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="900" height="696" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Seniority decides the suffix; everything else drops to a prefix</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">The highest-ranked group present becomes the ending and takes the lowest locant. Every other group is cited as a prefix.</text><text x="104.0" y="104.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">rank</text><text x="230.0" y="104.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">group</text><text x="452.0" y="104.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">suffix when senior</text><text x="706.0" y="104.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">prefix when outranked</text><rect x="76" y="112" width="760" height="30" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="104.0" y="133.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">1</text><text x="230.0" y="133.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">Carboxylic acid</text><text x="452.0" y="133.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">-oic acid</text><text x="706.0" y="133.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">carboxy-</text><rect x="76" y="148" width="760" height="30" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="104.0" y="169.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">2</text><text x="230.0" y="169.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">Ester</text><text x="452.0" y="169.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">-oate</text><text x="706.0" y="169.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">alkoxycarbonyl-</text><rect x="76" y="184" width="760" height="30" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="104.0" y="205.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">3</text><text x="230.0" y="205.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">Acid halide</text><text x="452.0" y="205.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">-oyl halide</text><text x="706.0" y="205.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">halocarbonyl-</text><rect x="76" y="220" width="760" height="30" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="104.0" y="241.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">4</text><text x="230.0" y="241.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">Amide</text><text x="452.0" y="241.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">-amide</text><text x="706.0" y="241.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">carbamoyl-</text><rect x="76" y="256" width="760" height="30" rx="6" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="104.0" y="277.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">5</text><text x="230.0" y="277.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">Aldehyde</text><text x="452.0" y="277.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">-al</text><text x="706.0" y="277.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">oxo- / formyl-</text><rect x="76" y="292" width="760" height="30" rx="6" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="104.0" y="313.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">6</text><text x="230.0" y="313.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">Ketone</text><text x="452.0" y="313.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">-one</text><text x="706.0" y="313.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">oxo-</text><rect x="76" y="328" width="760" height="30" rx="6" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="104.0" y="349.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">7</text><text x="230.0" y="349.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">Alcohol</text><text x="452.0" y="349.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">-ol</text><text x="706.0" y="349.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">hydroxy-</text><rect x="76" y="364" width="760" height="30" rx="6" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="104.0" y="385.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">8</text><text x="230.0" y="385.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">Amine</text><text x="452.0" y="385.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">-amine</text><text x="706.0" y="385.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">amino-</text><rect x="76" y="400" width="760" height="30" rx="6" fill="#efede8" stroke="#6d716f" stroke-width="1.5"/><text x="104.0" y="421.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:15px">9</text><text x="230.0" y="421.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">Alkene</text><text x="452.0" y="421.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:15px">-ene</text><text x="706.0" y="421.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">(none)</text><rect x="76" y="436" width="760" height="30" rx="6" fill="#efede8" stroke="#6d716f" stroke-width="1.5"/><text x="104.0" y="457.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:15px">10</text><text x="230.0" y="457.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">Alkyne</text><text x="452.0" y="457.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:15px">-yne</text><text x="706.0" y="457.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">(none)</text><rect x="76" y="472" width="760" height="30" rx="6" fill="#efede8" stroke="#6d716f" stroke-width="1.5"/><text x="104.0" y="493.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:15px">11</text><text x="230.0" y="493.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">Alkane</text><text x="452.0" y="493.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:15px">-ane</text><text x="706.0" y="493.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">alkyl-</text><line x1="60" y1="116" x2="60" y2="496" stroke="#18364a" stroke-width="2" marker-end="url(#m519)"/><text x="44.0" y="312.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">senior</text><rect x="60" y="530" width="780" height="134" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="450.0" y="556.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:21px">methyl (2S)-2-amino-3-(4-hydroxyphenyl)propanoate</text><line x1="166" y1="568" x2="166" y2="584" stroke="#6d716f" stroke-width="1.5" stroke-dasharray="6 5"/><text x="166.0" y="602.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">alcohol half of</text><text x="166.0" y="619.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">the ester</text><line x1="300" y1="568" x2="300" y2="584" stroke="#6d716f" stroke-width="1.5" stroke-dasharray="6 5"/><text x="300.0" y="602.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">configuration at</text><text x="300.0" y="619.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">C2</text><line x1="420" y1="568" x2="420" y2="584" stroke="#6d716f" stroke-width="1.5" stroke-dasharray="6 5"/><text x="420.0" y="602.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">NH₂ at C2, demoted</text><text x="420.0" y="619.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">to prefix</text><line x1="585" y1="568" x2="585" y2="584" stroke="#6d716f" stroke-width="1.5" stroke-dasharray="6 5"/><text x="585.0" y="602.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">para-OH phenyl</text><text x="585.0" y="619.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">ring at C3</text><line x1="770" y1="568" x2="770" y2="584" stroke="#6d716f" stroke-width="1.5" stroke-dasharray="6 5"/><text x="770.0" y="602.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">3 C acid half,</text><text x="770.0" y="619.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">ester is senior</text><text x="450.0" y="654.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">Reading it back: the methyl ester of L-tyrosine.</text></svg>