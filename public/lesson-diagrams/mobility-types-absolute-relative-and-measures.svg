<svg xmlns="http://www.w3.org/2000/svg" width="920" height="962" viewBox="0 0 920 962" role="img" aria-labelledby="t d"><title id="t">Two axes of mobility, and two ways to measure it</title><desc id="d">Top: the four combinations that the vocabulary describes, laid out on the two questions that generate them — whose lifetime is being compared, and in which direction. Horizontal movement sits at the centre: a change of job without a change of stratum. Middle: absolute against relative mobility, the pair most often confused, because a country can have plenty of one and almost none of the other. The two figures underneath are the standard illustration: nearly everyone born in 1940 out-earned their parents, while barely half of those born in 1984 did, even though the rank ordering changed little either way. Bottom: the transition matrix as the exam uses it, and the measures that summarise it.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="962" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Two axes of mobility, and two ways to measure it</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Across generations or within a life; against your parents or against everyone else</text><rect x="40" y="180" width="840" height="258" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">Who is being compared with whom?</text><rect x="300" y="228" width="270" height="34" rx="7" fill="#efede8" stroke="#6d716f" stroke-width="1.5"/><text x="435.0" y="250.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">INTERgenerational</text><rect x="580" y="228" width="270" height="34" rx="7" fill="#efede8" stroke="#6d716f" stroke-width="1.5"/><text x="715.0" y="250.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">INTRAgenerational</text><text x="170.0" y="250.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">parent → child  vs.  one career</text><rect x="70" y="272" width="220" height="64" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="180.0" y="310.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">UP</text><rect x="300" y="272" width="270" height="64" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="435.0" y="298.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">the miner&#x27;s daughter</text><text x="435.0" y="314.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">becomes a surgeon</text><rect x="580" y="272" width="270" height="64" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="715.0" y="298.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">the clerk works up</text><text x="715.0" y="314.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">to plant manager</text><rect x="70" y="344" width="220" height="64" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="180.0" y="382.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">DOWN</text><rect x="300" y="344" width="270" height="64" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><text x="435.0" y="370.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">the professor&#x27;s son</text><text x="435.0" y="386.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">ends up in retail</text><rect x="580" y="344" width="270" height="64" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><text x="715.0" y="370.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">the professional is</text><text x="715.0" y="386.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">laid off at fifty</text><text x="460.0" y="424.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:10px">and HORIZONTAL mobility is a move with no change of stratum at all</text><rect x="40" y="446" width="840" height="206" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="474.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">Absolute against relative</text><rect x="70" y="494" width="390" height="136" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="265.0" y="518.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">ABSOLUTE</text><text x="265.0" y="538.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">do you have MORE than your parents had?</text><text x="265.0" y="562.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">rises and falls with economic growth</text><text x="265.0" y="590.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">90% of the 1940 cohort out-earned their parents</text><text x="265.0" y="610.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">about 50% of the 1984 cohort did</text><rect x="490" y="494" width="390" height="136" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="685.0" y="518.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">RELATIVE</text><text x="685.0" y="538.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">do you RANK differently from your parents?</text><text x="685.0" y="562.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">unmoved by growth; it is about position</text><text x="685.0" y="590.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">a country can be richer every decade</text><text x="685.0" y="610.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">and still have the same families on top</text><rect x="40" y="668" width="410" height="276" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="245.0" y="696.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">Born at the bottom, ending where?</text><text x="245.0" y="716.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">United States, by parental income quintile</text><text x="245.0" y="742.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:10px">PERFECTLY MOBILE SOCIETY</text><rect x="76" y="752" width="64" height="30" rx="5" fill="#efede8" stroke="#6d716f" stroke-width="1.4"/><text x="108.0" y="772.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">20%</text><rect x="146" y="752" width="64" height="30" rx="5" fill="#efede8" stroke="#6d716f" stroke-width="1.4"/><text x="178.0" y="772.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">20%</text><rect x="216" y="752" width="64" height="30" rx="5" fill="#efede8" stroke="#6d716f" stroke-width="1.4"/><text x="248.0" y="772.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">20%</text><rect x="286" y="752" width="64" height="30" rx="5" fill="#efede8" stroke="#6d716f" stroke-width="1.4"/><text x="318.0" y="772.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">20%</text><rect x="356" y="752" width="64" height="30" rx="5" fill="#efede8" stroke="#6d716f" stroke-width="1.4"/><text x="388.0" y="772.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">20%</text><text x="245.0" y="812.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10px">WHAT IS ACTUALLY OBSERVED</text><rect x="76" y="822" width="64" height="30" rx="5" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.4"/><text x="108.0" y="842.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10px">33%</text><text x="108.0" y="866.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">bottom</text><rect x="146" y="822" width="64" height="30" rx="5" fill="#f1eadc" stroke="#987740" stroke-width="1.4"/><text x="178.0" y="842.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10px">24%</text><text x="178.0" y="866.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">2nd</text><rect x="216" y="822" width="64" height="30" rx="5" fill="#f1eadc" stroke="#987740" stroke-width="1.4"/><text x="248.0" y="842.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10px">19%</text><text x="248.0" y="866.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">3rd</text><rect x="286" y="822" width="64" height="30" rx="5" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.4"/><text x="318.0" y="842.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10px">16%</text><text x="318.0" y="866.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">4th</text><rect x="356" y="822" width="64" height="30" rx="5" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.4"/><text x="388.0" y="842.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10px">8%</text><text x="388.0" y="866.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">top</text><text x="245.0" y="896.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">a child born in the bottom fifth has about a 1 in 13</text><text x="245.0" y="914.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">chance of reaching the top fifth — not 1 in 5</text><text x="245.0" y="932.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">figures approximate; they vary sharply by region</text><rect x="470" y="668" width="410" height="276" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="675.0" y="696.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">The numbers that summarise it</text><rect x="494" y="718" width="362" height="58" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.6"/><text x="675.0" y="735.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">IGE</text><text x="675.0" y="748.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">how much of a parent&#x27;s income advantage</text><text x="675.0" y="760.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">carries to the child; 0 = free, 1 = fixed</text><text x="675.0" y="770.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">US about 0.45–0.50 · Denmark about 0.15</text><rect x="494" y="781" width="362" height="46" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.6"/><text x="675.0" y="798.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">RANK-RANK SLOPE</text><text x="675.0" y="811.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">percentile gained per parental percentile</text><text x="675.0" y="821.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">US about 0.34</text><rect x="494" y="832" width="362" height="58" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.6"/><text x="675.0" y="849.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10.5px">GINI</text><text x="675.0" y="862.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">income inequality, 0 to 1 — not mobility,</text><text x="675.0" y="874.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">but it tracks with it</text><text x="675.0" y="884.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">US about 0.39–0.41 · Denmark about 0.29</text><rect x="494" y="895" width="362" height="46" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><text x="675.0" y="912.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">GREAT GATSBY CURVE</text><text x="675.0" y="925.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">plot the two against each other and they line up:</text><text x="675.0" y="935.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">more unequal countries are less mobile</text></svg>