<svg xmlns="http://www.w3.org/2000/svg" width="920" height="800" viewBox="0 0 920 800" role="img" aria-labelledby="t d"><title id="t">Narrow means fast, and fast means low pressure</title><desc id="d">Top: a pipe that narrows and widens again, with pressure-tap columns that are tall in the wide sections and short at the constriction, and the worked numbers 0.04 square metres at 2 metres per second and 200 kPa widening to 0.01 square metres at 8 metres per second and 170 kPa. Bottom left: the three Bernoulli terms as stacked bars, showing pressure energy converting into kinetic energy at the constriction while the total stays fixed. Bottom right: the same arithmetic in the circulation, where the capillary bed&#x27;s total cross-section is about a thousand times the aorta&#x27;s and the velocity is a thousand times lower, at the same 5 litres per minute.</desc><defs><marker id="m282" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker><marker id="m6585" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="800" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Narrow means fast, and fast means low pressure</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Continuity sets the speed (A₁v₁ = A₂v₂); Bernoulli then spends the pressure to pay for it</text><rect x="40" y="112" width="840" height="300" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="142.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">One flow rate, two speeds, two pressures</text><path d="M140 286 L360 286 L410 311 L560 311 L610 286 L830 286 L830 366 L610 366 L560 341 L410 341 L360 366 L140 366 Z" stroke="#245574" stroke-width="2.5" fill="#e4edf3"/><rect x="219" y="196" width="22" height="90" rx="3" fill="#e8ecef" stroke="#18364a" stroke-width="1.5"/><rect x="689" y="196" width="22" height="90" rx="3" fill="#e8ecef" stroke="#18364a" stroke-width="1.5"/><rect x="474" y="236" width="22" height="75" rx="3" fill="#e8ecef" stroke="#18364a" stroke-width="1.5"/><text x="230.0" y="186.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">high P</text><text x="485.0" y="226.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">low P</text><text x="700.0" y="186.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">high P again</text><line x1="170" y1="326" x2="240" y2="326" stroke="#18364a" stroke-width="2.5" marker-end="url(#m282)"/><line x1="440" y1="326" x2="540" y2="326" stroke="#a8324a" stroke-width="3" marker-end="url(#m6585)"/><line x1="640" y1="326" x2="710" y2="326" stroke="#18364a" stroke-width="2.5" marker-end="url(#m282)"/><text x="250.0" y="392.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">A₁ = 0.04 m²  •  v₁ = 2 m/s  •  P₁ = 200 kPa</text><text x="700.0" y="392.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">A₂ = 0.01 m²  •  v₂ = 8 m/s  •  P₂ = 170 kPa</text><text x="485.0" y="366.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">4× narrower ⇒ 4× faster</text><rect x="40" y="432" width="416" height="222" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="248.0" y="460.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:17px">The same total, split differently</text><rect x="98" y="496.6" width="104" height="103.39999999999999" rx="4" fill="#e8ecef" stroke="#18364a" stroke-width="1.5"/><text x="150.0" y="553.3" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">P</text><rect x="98" y="490.0" width="104" height="6.6" rx="4" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="150.0" y="498.3" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">½ρv²</text><text x="150.0" y="620.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">wide</text><rect x="296" y="512.0" width="104" height="88.0" rx="4" fill="#e8ecef" stroke="#18364a" stroke-width="1.5"/><text x="348.0" y="561.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">P</text><rect x="296" y="490.0" width="104" height="22.0" rx="4" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="348.0" y="506.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">½ρv²</text><text x="348.0" y="620.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">narrow</text><line x1="80" y1="600" x2="420" y2="600" stroke="#18364a" stroke-width="2"/><line x1="80" y1="490" x2="420" y2="490" stroke="#5b7a64" stroke-width="2" stroke-dasharray="6 5"/><text x="424.0" y="495.0" class="" text-anchor="end" style="fill:#5b7a64;font-weight:bold;font-size:13px">total</text><text x="248.0" y="640.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">P + ½ρv² + ρgh is what stays constant</text><rect x="472" y="432" width="408" height="222" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="676.0" y="460.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">The same sum in the circulation</text><text x="500.0" y="492.0" class="" text-anchor="start" style="fill:#6d716f;font-size:14px"></text><text x="700.0" y="492.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">aorta</text><text x="840.0" y="492.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:bold;font-size:15px">capillaries</text><text x="500.0" y="524.0" class="" text-anchor="start" style="fill:#6d716f;font-size:14px">total area</text><text x="700.0" y="524.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">2.5 cm²</text><text x="840.0" y="524.0" class="" text-anchor="end" style="fill:#18364a;font-size:15px">2,500 cm²</text><text x="500.0" y="556.0" class="" text-anchor="start" style="fill:#6d716f;font-size:14px">velocity</text><text x="700.0" y="556.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">33 cm/s</text><text x="840.0" y="556.0" class="" text-anchor="end" style="fill:#18364a;font-size:15px">0.03 cm/s</text><text x="500.0" y="588.0" class="" text-anchor="start" style="fill:#6d716f;font-size:14px">Q = Av</text><text x="700.0" y="588.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">≈83 cm³/s</text><text x="840.0" y="588.0" class="" text-anchor="end" style="fill:#18364a;font-size:15px">≈75 cm³/s</text><line x1="496" y1="604" x2="856" y2="604" stroke="#5b7a64" stroke-width="2"/><text x="676.0" y="630.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">both ≈ 5 L/min — the resting cardiac output</text><text x="460.0" y="692.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">Torricelli: a hole a height h below the surface empties at v = √(2gh), whatever its size</text><text x="460.0" y="722.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Bernoulli needs ideal flow; where viscosity rules, use Poiseuille&#x27;s Q = πr⁴ΔP/8ηL</text><text x="460.0" y="752.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">In a stenosis: low pressure inside it (Bernoulli), raised pressure upstream (resistance)</text><text x="460.0" y="782.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Re = ρvd/η: below ~2,000 laminar, above ~4,000 turbulent</text></svg>