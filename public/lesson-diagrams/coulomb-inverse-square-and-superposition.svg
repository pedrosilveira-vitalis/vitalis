<svg xmlns="http://www.w3.org/2000/svg" width="920" height="800" viewBox="0 0 920 800" role="img" aria-labelledby="t d"><title id="t">Coulomb&#x27;s law: charges multiply, distance squares, forces add</title><desc id="d">Top left: the inverse-square curve, showing that doubling the separation cuts the force to a quarter and tripling it to a ninth, while halving the separation quadruples it. Top right: the sign rule, with like charges pushed apart and unlike charges pulled together. Middle: a worked three-charge line showing the two forces on the middle charge and their vector sum. Bottom: the equilibrium rule — between two like charges the null point lies between them, and for opposite signs it lies outside, beyond the smaller charge — plus the dielectric factor kappa that weakens every electrostatic force in water.</desc><defs><marker id="m1388" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker><marker id="m4005" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker><marker id="m7347" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="800" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Coulomb&#x27;s law: charges multiply, distance squares, forces add</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">F = k|q₁||q₂|/r²  —  magnitude from the formula, direction from the signs</text><rect x="40" y="112" width="416" height="262" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="248.0" y="140.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">Force falls off as 1/r²</text><line x1="112" y1="306" x2="398" y2="306" stroke="#18364a" stroke-width="2"/><line x1="112" y1="172" x2="112" y2="306" stroke="#18364a" stroke-width="2"/><text x="255.0" y="350.0" class="" text-anchor="middle" style="font-size:17px">separation r (in units of r₀)</text><text x="68" y="239.0" text-anchor="middle" transform="rotate(-90 68 239.0)" style="font-size:17px">F (fraction of F₀)</text><line x1="196.11764705882354" y1="306.0" x2="196.11764705882354" y2="312.0" stroke="#18364a" stroke-width="2"/><text x="196.1" y="328.0" class="" text-anchor="middle" style="font-size:14px">1</text><line x1="280.2352941176471" y1="306.0" x2="280.2352941176471" y2="312.0" stroke="#18364a" stroke-width="2"/><text x="280.2" y="328.0" class="" text-anchor="middle" style="font-size:14px">2</text><line x1="364.3529411764706" y1="306.0" x2="364.3529411764706" y2="312.0" stroke="#18364a" stroke-width="2"/><text x="364.4" y="328.0" class="" text-anchor="middle" style="font-size:14px">3</text><line x1="106.0" y1="275.54545454545456" x2="112.0" y2="275.54545454545456" stroke="#18364a" stroke-width="2"/><text x="102.0" y="280.5" class="" text-anchor="end" style="font-size:14px">1</text><line x1="106.0" y1="245.0909090909091" x2="112.0" y2="245.0909090909091" stroke="#18364a" stroke-width="2"/><text x="102.0" y="250.1" class="" text-anchor="end" style="font-size:14px">2</text><line x1="106.0" y1="214.63636363636363" x2="112.0" y2="214.63636363636363" stroke="#18364a" stroke-width="2"/><text x="102.0" y="219.6" class="" text-anchor="end" style="font-size:14px">3</text><line x1="106.0" y1="184.1818181818182" x2="112.0" y2="184.1818181818182" stroke="#18364a" stroke-width="2"/><text x="102.0" y="189.2" class="" text-anchor="end" style="font-size:14px">4</text><path d="M154.1 184.2 L156.2 195.5 L158.3 205.3 L160.4 213.9 L162.5 221.4 L164.6 228.0 L166.7 233.9 L168.8 239.2 L170.9 243.8 L173.0 248.1 L175.1 251.9 L177.2 255.3 L179.3 258.4 L181.4 261.3 L183.5 263.8 L185.6 266.2 L187.7 268.4 L189.8 270.4 L191.9 272.3 L194.0 274.0 L196.1 275.5 L198.2 277.0 L200.3 278.4 L202.4 279.6 L204.5 280.8 L206.6 281.9 L208.7 283.0 L210.8 283.9 L212.9 284.9 L215.0 285.7 L217.1 286.5 L219.2 287.3 L221.4 288.0 L223.5 288.7 L225.6 289.3 L227.7 289.9 L229.8 290.5 L231.9 291.0 L234.0 291.5 L236.1 292.0 L238.2 292.5 L240.3 292.9 L242.4 293.3 L244.5 293.7 L246.6 294.1 L248.7 294.5 L250.8 294.8 L252.9 295.1 L255.0 295.5 L257.1 295.8 L259.2 296.1 L261.3 296.3 L263.4 296.6 L265.5 296.9 L267.6 297.1 L269.7 297.3 L271.8 297.6 L273.9 297.8 L276.0 298.0 L278.1 298.2 L280.2 298.4 L282.3 298.6 L284.4 298.8 L286.5 298.9 L288.6 299.1 L290.8 299.3 L292.9 299.4 L295.0 299.6 L297.1 299.7 L299.2 299.8 L301.3 300.0 L303.4 300.1 L305.5 300.2 L307.6 300.4 L309.7 300.5 L311.8 300.6 L313.9 300.7 L316.0 300.8 L318.1 300.9 L320.2 301.0 L322.3 301.1 L324.4 301.2 L326.5 301.3 L328.6 301.4 L330.7 301.5 L332.8 301.6 L334.9 301.7 L337.0 301.7 L339.1 301.8 L341.2 301.9 L343.3 302.0 L345.4 302.0 L347.5 302.1 L349.6 302.2 L351.7 302.3 L353.8 302.3 L355.9 302.4 L358.0 302.4 L360.1 302.5 L362.2 302.6 L364.4 302.6 L366.5 302.7 L368.6 302.7 L370.7 302.8 L372.8 302.8 L374.9 302.9 L377.0 302.9 L379.1 303.0 L381.2 303.0 L383.3 303.1 L385.4 303.1 L387.5 303.2 L389.6 303.2 L391.7 303.2 L393.8 303.3 L395.9 303.3 L398.0 303.4" stroke="#245574" stroke-width="2.6" fill="none"/><circle cx="154.05882352941177" cy="184.1818181818182" r="5" fill="#a8324a" stroke="#a8324a" stroke-width="2"/><circle cx="196.11764705882354" cy="275.54545454545456" r="5" fill="#18364a" stroke="#18364a" stroke-width="2"/><circle cx="280.2352941176471" cy="298.3863636363636" r="5" fill="#5b7a64" stroke="#5b7a64" stroke-width="2"/><circle cx="364.3529411764706" cy="302.6161616161616" r="5" fill="#987740" stroke="#987740" stroke-width="2"/><text x="210.1" y="265.5" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">r₀, F₀</text><text x="290.2" y="286.4" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:12px">2r → F/4</text><text x="360.4" y="288.6" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:12px">3r → F/9</text><text x="166.1" y="188.2" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:12px">half r → 4×F</text><rect x="472" y="112" width="408" height="262" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="676.0" y="140.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">Magnitude from the formula, direction from the signs</text><circle cx="576" cy="196" r="20" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="576.0" y="202.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:22px">+</text><circle cx="776" cy="196" r="20" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="776.0" y="202.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:22px">+</text><line x1="552" y1="196" x2="512" y2="196" stroke="#a8324a" stroke-width="2.4" marker-end="url(#m4005)"/><line x1="800" y1="196" x2="840" y2="196" stroke="#a8324a" stroke-width="2.4" marker-end="url(#m4005)"/><text x="676.0" y="234.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">like charges: pushed apart</text><circle cx="576" cy="286" r="20" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="576.0" y="292.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:22px">+</text><circle cx="776" cy="286" r="20" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="776.0" y="293.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:24px">−</text><line x1="600" y1="286" x2="640" y2="286" stroke="#245574" stroke-width="2.4" marker-end="url(#m7347)"/><line x1="752" y1="286" x2="712" y2="286" stroke="#18364a" stroke-width="2.4" marker-end="url(#m1388)"/><text x="676.0" y="324.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">unlike charges: pulled together</text><text x="676.0" y="352.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">the |q| bars mean the formula never gives you a sign</text><rect x="40" y="394" width="840" height="190" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="460.0" y="422.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">Three charges on a line: find each force, then add them with signs</text><line x1="140" y1="480" x2="790" y2="480" stroke="#6d716f" stroke-width="1.6"/><circle cx="180" cy="480" r="19" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="180.0" y="487.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:22px">+</text><text x="180.0" y="450.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">q₁ = +4 µC</text><text x="180.0" y="524.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">x = 0</text><circle cx="440" cy="480" r="19" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="440.0" y="487.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:22px">−</text><text x="440.0" y="450.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">q₂ = −2 µC</text><text x="440.0" y="524.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">x = 3 m</text><circle cx="700" cy="480" r="19" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="700.0" y="487.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:22px">+</text><text x="700.0" y="450.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">q₃ = +3 µC</text><text x="700.0" y="524.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">x = 6 m</text><line x1="420" y1="548" x2="330" y2="548" stroke="#18364a" stroke-width="2.4" marker-end="url(#m1388)"/><text x="375.0" y="538.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">8 mN</text><line x1="460" y1="548" x2="528" y2="548" stroke="#245574" stroke-width="2.4" marker-end="url(#m7347)"/><text x="494.0" y="538.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">6 mN</text><text x="640.0" y="552.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:14px">net on q₂ = 2 mN toward q₁</text><rect x="40" y="604" width="416" height="160" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="248.0" y="632.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">Where is the force zero?</text><text x="248.0" y="660.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">two like charges: the null point sits BETWEEN them,</text><text x="248.0" y="680.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">nearer the smaller charge</text><text x="248.0" y="708.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">opposite signs: it sits OUTSIDE the pair,</text><text x="248.0" y="728.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">beyond the smaller charge</text><text x="248.0" y="752.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">the test charge&#x27;s own sign never moves it</text><rect x="472" y="604" width="408" height="160" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="676.0" y="632.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">The medium matters</text><text x="676.0" y="662.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:18px">F = k|q₁||q₂| / (κ r²)</text><text x="676.0" y="692.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">water: κ ≈ 80, so an ion pair in solution feels a force</text><text x="676.0" y="712.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">about 80 times weaker than the same pair in vacuum</text><text x="676.0" y="744.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">buried salt bridges (κ ≈ 4–10) are far stronger than surface ones</text></svg>