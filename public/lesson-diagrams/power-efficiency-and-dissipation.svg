<svg xmlns="http://www.w3.org/2000/svg" width="920" height="770" viewBox="0 0 920 770" role="img" aria-labelledby="t d"><title id="t">Power, efficiency, and where the missing energy went</title><desc id="d">Left: an energy-flow bar for a muscle at 25 percent efficiency, with 2000 joules of chemical energy entering and splitting into 500 joules of useful work and 1500 joules of heat. Right: the four power formulas, with the note that at constant velocity the applied force equals the opposing force. Bottom: the efficiency equation with the warning to divide rather than multiply, the multiplication rule for stages in series, and the power dissipated by friction together with the terminal-velocity case.</desc><defs><marker id="m2321" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b7a64"/></marker><marker id="m323" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="770" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Power, efficiency, and where the missing energy went</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Efficiency divides: the input is always larger than the useful output</text><rect x="40" y="112" width="430" height="322" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="255.0" y="142.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">Where the input goes:  η = 25% muscle</text><rect x="66" y="214" width="132" height="120" rx="6" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="132.0" y="268.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">2000 J</text><text x="132.0" y="292.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">chemical in</text><text x="132.0" y="200.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">100%</text><line x1="198" y1="240" x2="240" y2="240" stroke="#5b7a64" stroke-width="3" marker-end="url(#m2321)"/><line x1="198" y1="300" x2="240" y2="300" stroke="#a8324a" stroke-width="3" marker-end="url(#m323)"/><rect x="244" y="214" width="186" height="30" rx="6" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="337.0" y="235.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">500 J useful work  —  25%</text><rect x="244" y="256" width="186" height="78" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="337.0" y="288.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">1500 J heat  —  75%</text><text x="337.0" y="312.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">raises body temperature</text><text x="255.0" y="368.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">W_in = W_useful / η = 500 / 0.25 = 2000 J</text><text x="255.0" y="394.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">heat = W_in − W_useful = 1500 J</text><text x="255.0" y="418.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">muscle ≈ 25%  •  heart ≈ 15–25%  •  whole body ≈ 20–25%</text><rect x="486" y="112" width="394" height="322" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="683.0" y="142.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">Four ways to write power</text><rect x="506" y="170" width="356" height="52" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="524.0" y="192.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:17px">P = W / t</text><text x="524.0" y="212.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">work done per second — use for average power</text><rect x="506" y="228" width="356" height="52" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="524.0" y="250.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:17px">P = F v</text><text x="524.0" y="270.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">constant force along the motion — instantaneous</text><rect x="506" y="286" width="356" height="52" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="524.0" y="308.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:17px">P = ΔP · Q</text><text x="524.0" y="328.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">a pump: pressure rise × volume flow rate</text><rect x="506" y="344" width="356" height="52" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="524.0" y="366.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:17px">P = fₖ v</text><text x="524.0" y="386.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">the rate friction turns motion into heat</text><text x="683.0" y="420.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">At constant v the net force is zero, so F_applied = F_opposing</text><rect x="40" y="462" width="280" height="150" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="180.0" y="492.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">Divide, never multiply</text><text x="180.0" y="524.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">η = W_out / W_in = P_out / P_in</text><text x="180.0" y="554.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">so W_in = W_out / η</text><text x="180.0" y="584.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">η &lt; 1 always ⇒ input &gt; output</text><rect x="320" y="462" width="280" height="150" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="460.0" y="492.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">Stages multiply</text><text x="460.0" y="524.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">η_total = η₁ × η₂ × …</text><text x="460.0" y="554.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">0.80 × 0.80 = 0.64</text><text x="460.0" y="584.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">losses compound fast</text><rect x="600" y="462" width="280" height="150" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="740.0" y="492.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">Nothing is destroyed</text><text x="740.0" y="524.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">W_nc = ΔKE + ΔPE</text><text x="740.0" y="554.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">friction → heat in the surfaces</text><text x="740.0" y="584.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">drag → heat in the fluid</text><text x="460.0" y="660.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">At terminal velocity mg = F_drag, so gravity&#x27;s power mgv goes entirely to heating the air</text><text x="460.0" y="692.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Energy is joules, power is joules per second — if a &quot;power&quot; answer comes out in J, a ÷t is missing</text><text x="460.0" y="724.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">1 hp ≈ 746 W   •   1 kWh = 3.6 × 10⁶ J (an energy, not a power)</text></svg>