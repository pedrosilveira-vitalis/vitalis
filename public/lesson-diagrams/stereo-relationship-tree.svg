<svg xmlns="http://www.w3.org/2000/svg" width="900" height="716" viewBox="0 0 900 716" role="img" aria-labelledby="t d"><title id="t">Two structures in front of you: what is their relationship?</title><desc id="d">A decision tree for classifying two structures. Same connectivity or not separates constitutional isomers from stereoisomers; mirror image or not separates enantiomers from diastereomers; and a side branch covers the single molecule that contains stereocentres but has an internal mirror plane, the meso compound. A lower strip lists which cases rotate plane-polarised light.</desc><defs><marker id="m2105" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker><marker id="m4953" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker><marker id="m8624" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b7a64"/></marker><marker id="m8751" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="900" height="716" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Two structures in front of you: what is their relationship?</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Work down the questions in order. The first “no” you hit names the relationship.</text><rect x="332.0" y="77.0" width="236" height="58" rx="10" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="450.0" y="112.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">Same molecular formula?</text><line x1="450" y1="136" x2="450" y2="166" stroke="#18364a" stroke-width="2.5" marker-end="url(#m4953)"/><text x="466.0" y="156.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">yes</text><line x1="568" y1="106" x2="682" y2="106" stroke="#6d716f" stroke-width="2.5" marker-end="url(#m2105)"/><rect x="684" y="72" width="204" height="68" rx="10" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="786.0" y="100.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:16px">Not isomers</text><text x="786.0" y="122.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">different compounds</text><rect x="332.0" y="167.0" width="236" height="58" rx="10" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="450.0" y="202.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">Same connectivity?</text><line x1="332" y1="196" x2="218" y2="196" stroke="#6d716f" stroke-width="2.5" marker-end="url(#m2105)"/><text x="273.0" y="188.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">no</text><rect x="12" y="162" width="204" height="68" rx="10" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="114.0" y="190.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:16px">Constitutional</text><text x="114.0" y="212.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">same formula, different</text><text x="114.0" y="227.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">skeleton</text><line x1="450" y1="226" x2="450" y2="256" stroke="#18364a" stroke-width="2.5" marker-end="url(#m4953)"/><text x="466.0" y="246.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">yes — stereoisomers</text><rect x="332.0" y="257.0" width="236" height="58" rx="10" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="450.0" y="292.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">Mirror images?</text><line x1="332" y1="286" x2="218" y2="286" stroke="#5b7a64" stroke-width="2.5" marker-end="url(#m8624)"/><text x="268.0" y="278.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">no</text><rect x="12" y="266" width="204" height="68" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="114.0" y="294.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">Diastereomers</text><text x="114.0" y="316.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">differ at some centres;</text><text x="114.0" y="331.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">separable</text><line x1="568" y1="286" x2="682" y2="286" stroke="#245574" stroke-width="2.5" marker-end="url(#m8751)"/><text x="620.0" y="278.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">yes</text><rect x="684" y="266" width="204" height="68" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="786.0" y="294.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">Enantiomers</text><text x="786.0" y="316.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">every centre inverted</text><rect x="180" y="388" width="540" height="96" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="450.0" y="412.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">One structure, stereocentres, internal mirror plane</text><text x="450.0" y="436.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:15px">→ meso: achiral, optically inactive, a single compound</text><text x="450.0" y="462.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">Needs matching halves: 2,3-dibromobutane has a meso form, 2-bromo-3-chlorobutane does not.</text><text x="450.0" y="506.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:18px">Does it rotate plane-polarised light?</text><rect x="150" y="532" width="600" height="30" rx="6" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="166.0" y="552.0" class="" text-anchor="start" style="fill:#18364a;font-size:15px">Single enantiomer</text><text x="734.0" y="552.0" class="" text-anchor="end" style="fill:#245574;font-weight:bold;font-size:14px">yes</text><rect x="150" y="566" width="600" height="30" rx="6" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="166.0" y="586.0" class="" text-anchor="start" style="fill:#18364a;font-size:15px">Unequal R / S mix</text><text x="734.0" y="586.0" class="" text-anchor="end" style="fill:#245574;font-weight:bold;font-size:14px">yes</text><rect x="150" y="600" width="600" height="30" rx="6" fill="#efede8" stroke="#6d716f" stroke-width="1.5"/><text x="166.0" y="620.0" class="" text-anchor="start" style="fill:#18364a;font-size:15px">Racemic 50:50</text><text x="734.0" y="620.0" class="" text-anchor="end" style="fill:#6d716f;font-weight:bold;font-size:14px">no — cancels between molecules</text><rect x="150" y="634" width="600" height="30" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="166.0" y="654.0" class="" text-anchor="start" style="fill:#18364a;font-size:15px">Meso compound</text><text x="734.0" y="654.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:bold;font-size:14px">no — cancels within one molecule</text><rect x="150" y="668" width="600" height="30" rx="6" fill="#efede8" stroke="#6d716f" stroke-width="1.5"/><text x="166.0" y="688.0" class="" text-anchor="start" style="fill:#18364a;font-size:15px">Achiral molecule</text><text x="734.0" y="688.0" class="" text-anchor="end" style="fill:#6d716f;font-weight:bold;font-size:14px">no</text></svg>