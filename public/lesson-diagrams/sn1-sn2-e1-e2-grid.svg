<svg xmlns="http://www.w3.org/2000/svg" width="900" height="644" viewBox="0 0 900 644" role="img" aria-labelledby="t d"><title id="t">Substrate class × reagent decides the mechanism</title><desc id="d">A four-by-four grid. Rows are methyl, primary, secondary and tertiary substrates; columns are a weak nucleophile that is also a weak base, a strong nucleophile that is a weak base, a small strong base, and a bulky strong base. Each cell names the mechanism that dominates, from no reaction for methyl and primary substrates with a weak nucleophile, through SN2 for unhindered substrates with strong nucleophiles, to SN1/E1 and E2 for tertiary substrates.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="900" height="644" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Substrate class × reagent decides the mechanism</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Read the substrate down the side and the reagent across the top. Substitution and elimination always compete.</text><text x="255.0" y="100.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">weak Nu,</text><text x="255.0" y="118.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">weak base</text><text x="255.0" y="138.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">H₂O, ROH</text><text x="410.0" y="100.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">strong Nu,</text><text x="410.0" y="118.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">weak base</text><text x="410.0" y="138.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">I⁻, CN⁻, RS⁻, N₃⁻</text><text x="565.0" y="100.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">strong base,</text><text x="565.0" y="118.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">small</text><text x="565.0" y="138.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">RO⁻, HO⁻</text><text x="720.0" y="100.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">strong base,</text><text x="720.0" y="118.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">bulky</text><text x="720.0" y="138.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">t-BuO⁻, LDA</text><text x="150.0" y="192.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:17px">Methyl</text><text x="150.0" y="212.0" class="" text-anchor="end" style="fill:#6d716f;font-size:13px">CH₃–LG</text><rect x="182.0" y="164" width="146" height="60" rx="8" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="255.0" y="201.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:17px">no reaction</text><rect x="337.0" y="164" width="146" height="60" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="410.0" y="201.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">SN2</text><rect x="492.0" y="164" width="146" height="60" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="565.0" y="201.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">SN2</text><rect x="647.0" y="164" width="146" height="60" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="720.0" y="201.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">SN2</text><text x="150.0" y="268.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:17px">Primary</text><text x="150.0" y="288.0" class="" text-anchor="end" style="fill:#6d716f;font-size:13px">RCH₂–LG</text><rect x="182.0" y="240" width="146" height="60" rx="8" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="255.0" y="277.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:17px">no reaction</text><rect x="337.0" y="240" width="146" height="60" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="410.0" y="277.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">SN2</text><rect x="492.0" y="240" width="146" height="60" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="565.0" y="268.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">SN2</text><text x="565.0" y="286.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">(some E2)</text><rect x="647.0" y="240" width="146" height="60" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="720.0" y="277.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">E2</text><text x="150.0" y="344.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:17px">Secondary</text><text x="150.0" y="364.0" class="" text-anchor="end" style="fill:#6d716f;font-size:13px">R₂CH–LG</text><rect x="182.0" y="316" width="146" height="60" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="255.0" y="353.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">SN1 / E1</text><rect x="337.0" y="316" width="146" height="60" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="410.0" y="353.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">SN2</text><rect x="492.0" y="316" width="146" height="60" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="565.0" y="344.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">E2</text><text x="565.0" y="362.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">(some SN2)</text><rect x="647.0" y="316" width="146" height="60" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="720.0" y="353.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">E2</text><text x="150.0" y="420.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:17px">Tertiary</text><text x="150.0" y="440.0" class="" text-anchor="end" style="fill:#6d716f;font-size:13px">R₃C–LG</text><rect x="182.0" y="392" width="146" height="60" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="255.0" y="429.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">SN1 / E1</text><rect x="337.0" y="392" width="146" height="60" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="410.0" y="429.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">SN1 / E1</text><rect x="492.0" y="392" width="146" height="60" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="565.0" y="429.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">E2</text><rect x="647.0" y="392" width="146" height="60" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="720.0" y="429.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">E2</text><rect x="60" y="474" width="780" height="72" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="450.0" y="500.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">Two levers move every cell</text><text x="450.0" y="522.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Heat pushes any box toward elimination.  Polar protic solvent pushes toward SN1/E1, polar aprotic toward SN2.</text><line x1="60" y1="566" x2="96" y2="566" stroke="#245574" stroke-width="3"/><text x="106.0" y="571.0" class="" text-anchor="start" style="font-size:15px">Blue: substitution, concerted</text><line x1="60" y1="592" x2="96" y2="592" stroke="#a8324a" stroke-width="3"/><text x="106.0" y="597.0" class="" text-anchor="start" style="font-size:15px">Red: carbocation route (SN1/E1), rearrangement possible</text><line x1="60" y1="618" x2="96" y2="618" stroke="#5b7a64" stroke-width="3"/><text x="106.0" y="623.0" class="" text-anchor="start" style="font-size:15px">Sage: elimination (E2)</text></svg>