<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">Replication directions and maturation</title><desc id="desc">Both daughter strands grow 5 prime to 3 prime. The leading strand grows toward the fork; lagging fragments grow away. DnaB moves 5 prime to 3 prime on the lagging template while CMG moves 3 prime to 5 prime on the leading template. Primers are extended, processed and ligated. CST Pol alpha primase fills in telomere C strands.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#aa3653;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">Replication: do not confuse the directions</text><rect x="24" y="60" width="752" height="225" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="94" class="h" text-anchor="start">1  Fork movement →</text><text x="55" y="130" class="s" text-anchor="start">Leading template: 3′</text><path d="M250 125 L682 125" class="bond" /><text x="704" y="130" class="s" text-anchor="start">5′</text><path d="M255 160 L640 160" class="bond" /><path d="M630 154 L640 160 L630 166" class="accent"/><text x="255" y="184" class="s" text-anchor="start">New DNA: 5′ → 3′ toward the fork</text><text x="55" y="220" class="s" text-anchor="start">Lagging template: 5′</text><path d="M250 215 L682 215" class="bond" /><text x="704" y="220" class="s" text-anchor="start">3′</text><path d="M320 246 L225 246" class="bond" /><path d="M235 240 L225 246 L235 252" class="accent"/><path d="M480 246 L385 246" class="bond" /><path d="M395 240 L385 246 L395 252" class="accent"/><path d="M640 246 L545 246" class="bond" /><path d="M555 240 L545 246 L555 252" class="accent"/><text x="255" y="273" class="s" text-anchor="start">Each fragment grows 5′ → 3′ away from the fork</text><rect x="24" y="301" width="752" height="125" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="335" class="h" text-anchor="start">2  Helicase polarity is species-specific</text><text x="55" y="373" class="t" text-anchor="start">E. coli DnaB: 5′ → 3′ on the lagging template</text><text x="55" y="407" class="t" text-anchor="start">Eukaryotic CMG: 3′ → 5′ on the leading template</text><rect x="24" y="442" width="752" height="145" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="476" class="h" text-anchor="start">3  Okazaki fragments must mature</text><text x="55" y="516" class="t" text-anchor="start">Primase → polymerase extension → primer processing</text><text x="55" y="551" class="t" text-anchor="start">→ ligatable nick (3′-OH / 5′-phosphate) → ligase</text><text x="55" y="576" class="s" text-anchor="start">A nick has no missing nucleotide; a gap does.</text><rect x="24" y="603" width="752" height="113" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="637" class="h" text-anchor="start">4  Telomeres require two coordinated activities</text><text x="55" y="674" class="s" text-anchor="start">Telomerase extends G strand; CST–Pol α–primase fills C strand.</text><text x="55" y="701" class="s" text-anchor="start">A regulated G-rich 3′ overhang remains.</text></svg>