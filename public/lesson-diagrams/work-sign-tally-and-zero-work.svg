<svg xmlns="http://www.w3.org/2000/svg" width="920" height="780" viewBox="0 0 920 780" role="img" aria-labelledby="t d"><title id="t">Work: the sign comes from the angle, the total comes from every force</title><desc id="d">Top left: three cases showing a force at less than 90 degrees to the displacement doing positive work, at 90 degrees doing zero work, and at more than 90 degrees doing negative work. Top right: a worked tally for a 2 kg object pushed 5 m, with 43.3 joules from the applied force, minus 15 joules from friction and zero from the normal force and gravity, summing to 28.3 joules of net work and the same change in kinetic energy. Bottom: four forces that do no work, and the split between conservative and non-conservative forces.</desc><defs><marker id="m141" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b7a64"/></marker><marker id="m1537" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker><marker id="m7718" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker><marker id="m775" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="780" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Work: the sign comes from the angle, the total comes from every force</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">W = Fd cos θ for each force, then W_net = ΔKE</text><rect x="40" y="112" width="412" height="344" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="246.0" y="142.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">The angle sets the sign</text><rect x="58" y="172" width="376" height="72" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><line x1="92" y1="218" x2="180" y2="218" stroke="#18364a" stroke-width="2.5" marker-end="url(#m1537)"/><text x="114.0" y="237.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">d</text><line x1="136" y1="218" x2="175.83431104218687" y2="184.57504429629995" stroke="#5b7a64" stroke-width="3" marker-end="url(#m141)"/><text x="186.6" y="179.6" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">F</text><text x="240.0" y="196.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:16px">θ &lt; 90°</text><text x="240.0" y="216.0" class="" text-anchor="start" style="fill:#6d716f;font-size:14px">cos θ &gt; 0</text><text x="240.0" y="236.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">W &gt; 0: speeds it up</text><rect x="58" y="254" width="376" height="72" rx="9" fill="#efede8" stroke="#6d716f" stroke-width="2"/><line x1="92" y1="300" x2="180" y2="300" stroke="#18364a" stroke-width="2.5" marker-end="url(#m1537)"/><text x="114.0" y="319.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">d</text><line x1="136" y1="300" x2="136.0" y2="248.0" stroke="#6d716f" stroke-width="3" marker-end="url(#m7718)"/><text x="136.0" y="238.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:15px">F</text><text x="240.0" y="278.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:bold;font-size:16px">θ = 90°</text><text x="240.0" y="298.0" class="" text-anchor="start" style="fill:#6d716f;font-size:14px">cos θ = 0</text><text x="240.0" y="318.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">W = 0: no energy moved</text><rect x="58" y="336" width="376" height="72" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><line x1="92" y1="382" x2="180" y2="382" stroke="#18364a" stroke-width="2.5" marker-end="url(#m1537)"/><text x="114.0" y="401.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">d</text><line x1="136" y1="382" x2="96.16568895781315" y2="348.57504429629995" stroke="#a8324a" stroke-width="3" marker-end="url(#m775)"/><text x="85.4" y="343.6" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">F</text><text x="240.0" y="360.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:16px">θ &gt; 90°</text><text x="240.0" y="380.0" class="" text-anchor="start" style="fill:#6d716f;font-size:14px">cos θ &lt; 0</text><text x="240.0" y="400.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">W &lt; 0: slows it down</text><text x="246.0" y="436.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">W = F d cos θ   — a scalar, in joules</text><rect x="468" y="112" width="412" height="344" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="674.0" y="142.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:17px">Add every force&#x27;s work, then use ΔKE</text><text x="674.0" y="166.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">2 kg object, pushed 5 m: F = 10 N at 30°, fₖ = 3 N</text><text x="492.0" y="210.0" class="" text-anchor="start" style="fill:#18364a;font-size:15px">applied, 10 N at 30°</text><text x="858.0" y="210.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:15px">(10)(5)cos30° = +43.3 J</text><text x="492.0" y="246.0" class="" text-anchor="start" style="fill:#a8324a;font-size:15px">kinetic friction, 3 N</text><text x="858.0" y="246.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:bold;font-size:15px">(3)(5)cos180° = −15.0 J</text><text x="492.0" y="282.0" class="" text-anchor="start" style="fill:#6d716f;font-size:15px">normal force</text><text x="858.0" y="282.0" class="" text-anchor="end" style="fill:#6d716f;font-weight:bold;font-size:15px">θ = 90° ⇒ 0 J</text><text x="492.0" y="318.0" class="" text-anchor="start" style="fill:#6d716f;font-size:15px">gravity</text><text x="858.0" y="318.0" class="" text-anchor="end" style="fill:#6d716f;font-weight:bold;font-size:15px">θ = 90° ⇒ 0 J</text><line x1="492" y1="340" x2="858" y2="340" stroke="#987740" stroke-width="2"/><text x="492.0" y="366.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:16px">W_net</text><text x="858.0" y="366.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:16px">+28.3 J</text><rect x="492" y="384" width="366" height="44" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="675.0" y="412.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">W_net = ΔKE = ½mvᶠ² − ½mvᵢ²</text><text x="60.0" y="486.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:bold;font-size:17px">Four forces that move no energy at all</text><rect x="40" y="508" width="200" height="116" rx="10" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="140.0" y="536.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">normal force</text><text x="140.0" y="566.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">⊥ to the slide, on a flat floor,</text><text x="140.0" y="588.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">an incline or a curved track</text><rect x="253" y="508" width="200" height="116" rx="10" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="353.0" y="536.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">centripetal force</text><text x="353.0" y="566.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">⊥ to v at every instant,</text><text x="353.0" y="588.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">so speed never changes</text><rect x="466" y="508" width="200" height="116" rx="10" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="566.0" y="536.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">holding a weight still</text><text x="566.0" y="566.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">force but no displacement,</text><text x="566.0" y="588.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">so W = 0 however tiring</text><rect x="679" y="508" width="200" height="116" rx="10" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="779.0" y="536.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">magnetic force on a charge</text><text x="779.0" y="566.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">qv × B is ⊥ to v,</text><text x="779.0" y="588.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">so it only turns the path</text><rect x="40" y="646" width="412" height="104" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="246.0" y="674.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">Conservative: path does not matter</text><text x="246.0" y="700.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">gravity, springs, electrostatic</text><text x="246.0" y="728.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">W = −ΔPE, so define U = mgh or ½kx²</text><rect x="468" y="646" width="412" height="104" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="674.0" y="674.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">Non-conservative: path matters</text><text x="674.0" y="700.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">friction, drag, applied pushes</text><text x="674.0" y="728.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">W_nc = ΔKE + ΔPE</text></svg>