<svg xmlns="http://www.w3.org/2000/svg" width="920" height="934" viewBox="0 0 920 934" role="img" aria-labelledby="t d"><title id="t">Three ways a fear comes back after extinction</title><desc id="d">Top: the fear-learning arc that sits under phobias and PTSD alike. Acquisition pairs a neutral cue with something aversive; extinction lays down a competing inhibitory memory rather than deleting the first, which is why the fear can return by three distinct routes that the exam keeps apart. Time brings it back as spontaneous recovery. A new place brings it back as renewal. Meeting the aversive event again brings it back as reinstatement. Bottom left: the circuit that decides whether extinction holds — amygdala up, ventromedial prefrontal cortex down, hippocampus shrunken and no longer tagging which context is safe. Bottom right: the three-question triage for telling these diagnoses apart.</desc><defs><marker id="m4341" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker><marker id="m8595" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="934" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Three ways a fear comes back after extinction</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Extinction writes a second memory; it never erases the first</text><rect x="40" y="180" width="840" height="330" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">Acquisition → extinction → and then what?</text><rect x="70" y="228" width="230" height="62" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="185.0" y="252.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">ACQUISITION</text><text x="185.0" y="272.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">cue (CS) + aversive event (US)</text><line x1="306" y1="259" x2="350" y2="259" stroke="#6d716f" stroke-width="2.5" marker-end="url(#m8595)"/><rect x="356" y="228" width="230" height="62" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="471.0" y="252.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">EXTINCTION</text><text x="471.0" y="272.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">cue alone, again and again</text><line x1="592" y1="259" x2="636" y2="259" stroke="#6d716f" stroke-width="2.5" marker-end="url(#m8595)"/><rect x="642" y="228" width="208" height="62" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="746.0" y="252.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:11px">TWO MEMORIES NOW</text><text x="746.0" y="272.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">the fear one is still there</text><text x="460.0" y="318.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">so the fear can come back three ways — keep the names apart</text><rect x="68" y="336" width="262" height="134" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="199.0" y="362.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">SPONTANEOUS RECOVERY</text><rect x="104" y="376" width="190" height="26" rx="6" fill="none" stroke="#245574" stroke-width="1.6"/><text x="199.0" y="394.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">TIME passes</text><text x="199.0" y="424.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">nothing new happens; the fear simply</text><text x="199.0" y="440.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">returns after a delay</text><rect x="344" y="336" width="262" height="134" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="475.0" y="362.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">RENEWAL</text><rect x="380" y="376" width="190" height="26" rx="6" fill="none" stroke="#987740" stroke-width="1.6"/><text x="475.0" y="394.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10.5px">the PLACE changes</text><text x="475.0" y="424.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">extinguished at home, met again</text><text x="475.0" y="440.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">in the street — fear returns</text><rect x="620" y="336" width="262" height="134" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="751.0" y="362.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">REINSTATEMENT</text><rect x="656" y="376" width="190" height="26" rx="6" fill="none" stroke="#a8324a" stroke-width="1.6"/><text x="751.0" y="394.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">the AVERSIVE EVENT recurs</text><text x="751.0" y="424.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">another bite, or a stressor — the</text><text x="751.0" y="440.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">original memory is re-energised</text><text x="460.0" y="492.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">none of them means the extinction training failed — all three are expected</text><rect x="40" y="526" width="410" height="384" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="245.0" y="554.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">Why extinction fails in PTSD</text><rect x="96" y="578" width="300" height="60" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="246.0" y="602.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">AMYGDALA — overreactive</text><text x="246.0" y="622.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">threshold for threat drops; fear generalises</text><line x1="246" y1="644" x2="246" y2="674" stroke="#245574" stroke-width="2.5" marker-end="url(#m4341)"/><text x="292.0" y="659.0" class="" text-anchor="middle" style="fill:#245574;font-size:9.5px">too weak</text><rect x="96" y="680" width="300" height="60" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="246.0" y="704.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">vmPFC — underactive</text><text x="246.0" y="724.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">cannot deliver the “it is safe now” signal</text><rect x="96" y="756" width="300" height="60" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="246.0" y="780.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:11.5px">HIPPOCAMPUS — reduced volume</text><text x="246.0" y="800.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">no context tag, so no safe places</text><rect x="96" y="832" width="300" height="62" rx="8" fill="#efede8" stroke="#6d716f" stroke-width="1.8"/><text x="246.0" y="856.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:10px">AND THE CORTISOL GOES THE OTHER WAY</text><text x="246.0" y="876.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">PTSD runs LOW cortisol; depression runs high</text><rect x="470" y="526" width="410" height="384" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="675.0" y="554.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">Three questions, in order</text><rect x="494" y="578" width="362" height="100" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="675.0" y="600.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11.5px">1 · Was there a stressor?</text><text x="675.0" y="620.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">none → anxiety disorder or OCD</text><text x="675.0" y="636.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">stressor, not DSM-traumatic → adjustment disorder</text><text x="675.0" y="652.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">traumatic, under 1 month → acute stress disorder</text><text x="675.0" y="668.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">traumatic, over 1 month → PTSD</text><rect x="494" y="688" width="362" height="84" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="675.0" y="710.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:11.5px">2 · Obsessions with rituals?</text><text x="675.0" y="730.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">intrusive thought neutralised by an act → OCD</text><text x="675.0" y="746.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">appearance → body dysmorphic disorder</text><text x="675.0" y="762.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">discarding → hoarding; pulling, picking → the rest</text><rect x="494" y="782" width="362" height="100" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="675.0" y="804.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11.5px">3 · How wide is the fear?</text><text x="675.0" y="824.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">one object or situation → specific phobia</text><text x="675.0" y="840.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">being judged → social anxiety disorder</text><text x="675.0" y="856.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">unexpected attacks → panic disorder</text><text x="675.0" y="872.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">worry about everything → GAD</text></svg>