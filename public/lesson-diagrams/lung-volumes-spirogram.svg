<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="t d"><title id="t">Lung volumes and capacities on a spirogram</title><desc id="d">A spirogram trace shows quiet tidal breaths, a maximal inspiration to total lung capacity and a maximal expiration down to residual volume. Brackets label the four volumes: inspiratory reserve volume 3100 mL, tidal volume 500, expiratory reserve volume 1200 and residual volume 1200. Capacities: total lung capacity 6000, vital capacity 4800, inspiratory capacity 3600 and functional residual capacity 2400. Residual volume and functional residual capacity cannot be measured by spirometry alone.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1100" height="660" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Lung volumes and capacities on a spirogram</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Typical adult values used in this lesson (mL); real values vary with size, age and sex.</text><line x1="90" y1="560" x2="610" y2="560" stroke="#18364a" stroke-width="2"/><line x1="90" y1="110" x2="90" y2="560" stroke="#18364a" stroke-width="2"/><text x="350.0" y="604.0" class="" text-anchor="middle" style="font-size:17px">Time</text><text x="46" y="335.0" text-anchor="middle" transform="rotate(-90 46 335.0)" style="font-size:17px">Lung volume (mL)</text><line x1="84.0" y1="470.0" x2="90.0" y2="470.0" stroke="#18364a" stroke-width="2"/><text x="80.0" y="475.0" class="" text-anchor="end" style="font-size:14px">1200</text><line x1="84.0" y1="380.0" x2="90.0" y2="380.0" stroke="#18364a" stroke-width="2"/><text x="80.0" y="385.0" class="" text-anchor="end" style="font-size:14px">2400</text><line x1="84.0" y1="342.5" x2="90.0" y2="342.5" stroke="#18364a" stroke-width="2"/><text x="80.0" y="347.5" 