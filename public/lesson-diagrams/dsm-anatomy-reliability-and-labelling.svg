<svg xmlns="http://www.w3.org/2000/svg" width="920" height="910" viewBox="0 0 920 910" role="img" aria-labelledby="t d"><title id="t">A manual that had to choose: agreement or truth</title><desc id="d">Top: what every DSM diagnosis is made of, and why it is built that way. Fixed symptom counts, a minimum duration, a requirement of real impairment and a list of things that must be ruled out are all there for one purpose: so that two clinicians looking at the same patient reach the same answer. Before 1980 they often did not. Middle: the cost of that choice. Reliability is agreement; validity is whether the thing agreed upon is real, and the comorbidity and heterogeneity of the categories suggest the joints are not being cut cleanly — which is what the dimensional models and RDoC are responding to. Bottom: the four Ds, with the warnings attached to each, and the social weight a diagnosis carries once it is applied.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="910" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">A manual that had to choose: agreement or truth</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">DSM-III bought reliability with criteria — validity is still outstanding</text><rect x="40" y="180" width="840" height="196" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">What every DSM entry contains — and why</text><rect x="62" y="228" width="198" height="106" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="161.0" y="254.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">CRITERIA</text><text x="161.0" y="280.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">5 of 9, 3 of 6…</text><text x="161.0" y="306.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">counts, not impressions</text><rect x="268" y="228" width="198" height="106" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="367.0" y="254.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">DURATION</text><text x="367.0" y="280.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">2 weeks · 6 months</text><text x="367.0" y="306.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">excludes passing states</text><rect x="474" y="228" width="198" height="106" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="573.0" y="254.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">IMPAIRMENT</text><text x="573.0" y="280.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">distress or dysfunction</text><text x="573.0" y="306.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">suffering is not enough alone</text><rect x="680" y="228" width="198" height="106" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="779.0" y="254.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">EXCLUSIONS</text><text x="779.0" y="280.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">not a drug, not a disease,</text><text x="779.0" y="306.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">not another disorder</text><text x="460.0" y="358.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">all of it exists to make two clinicians agree — that is the DSM-III revolution, in 1980</text><rect x="40" y="396" width="840" height="212" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="460.0" y="424.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">What was bought, and what was not</text><rect x="70" y="444" width="380" height="146" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="260.0" y="468.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">RELIABILITY — bought</text><text x="260.0" y="492.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">do two clinicians agree?</text><text x="260.0" y="516.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">measured with kappa, 0 to 1</text><text x="260.0" y="536.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">PTSD and ADHD score well</text><text x="260.0" y="556.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">some personality disorders do not</text><text x="260.0" y="580.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">agreement is not the same as truth</text><rect x="470" y="444" width="380" height="146" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="660.0" y="468.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">VALIDITY — still owed</text><text x="660.0" y="492.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">is the category a real thing?</text><text x="660.0" y="516.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">comorbidity is the rule, not the exception</text><text x="660.0" y="536.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">two patients, one diagnosis, one shared symptom</text><text x="660.0" y="556.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">no lab test confirms any of it</text><text x="660.0" y="580.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">hence dimensional models, and RDoC</text><rect x="40" y="628" width="450" height="250" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="265.0" y="656.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">The four Ds, with their caveats</text><rect x="66" y="676" width="398" height="42" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="150.0" y="694.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">DEVIANCE</text><text x="150.0" y="710.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">differs from the norm</text><text x="330.0" y="702.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">rare is not disordered — an IQ of 160 is rare</text><rect x="66" y="722" width="398" height="42" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="150.0" y="740.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">DISTRESS</text><text x="150.0" y="756.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">it hurts to live with</text><text x="330.0" y="748.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">not always present, as in antisocial PD</text><rect x="66" y="768" width="398" height="42" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="150.0" y="786.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">DYSFUNCTION</text><text x="150.0" y="802.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">it costs you something real</text><text x="330.0" y="794.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">the most consistent criterion of the four</text><rect x="66" y="814" width="398" height="42" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="150.0" y="832.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">DANGER</text><text x="150.0" y="848.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">risk to self or others</text><text x="330.0" y="840.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">the least common; raises urgency, not diagnosis</text><text x="265.0" y="870.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">a culturally sanctioned response to a common stressor is not a disorder</text><rect x="510" y="628" width="370" height="250" rx="12" fill="none" stroke="#6d716f" stroke-width="2"/><text x="695.0" y="656.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:15px">What a label does next</text><rect x="536" y="676" width="318" height="92" rx="10" fill="#e9e4da" stroke="#6d716f" stroke-width="2"/><text x="695.0" y="700.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">ROSENHAN, 1973</text><text x="695.0" y="722.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">healthy volunteers reported one word: “thud”</text><text x="695.0" y="740.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">all admitted; then normal behaviour was read</text><text x="695.0" y="756.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">through the diagnosis — note-taking became a symptom</text><text x="695.0" y="792.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">public stigma · self-stigma · structural stigma</text><text x="695.0" y="812.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">lowers help-seeking and adherence</text><line x1="560" y1="828" x2="830" y2="828" stroke="#6d716f" stroke-width="1" stroke-dasharray="6 5"/><text x="695.0" y="848.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">and yet: a name gives access to treatment,</text><text x="695.0" y="864.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:11px">accommodation, and other people who have it</text></svg>