<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="t d"><title id="t">Antibody structure and the five classes</title><desc id="d">Left: an IgG monomer drawn as a Y. Two heavy chains (navy) form the stem and inner arms; two light chains (sage) sit on the outer arms. Each arm tip holds variable domains VH and VL whose CDR loops form the antigen-binding site. The arms are the Fab regions (antigen binding); the stem is the Fc region (effector functions: Fc receptors, C1q, FcRn). Papain cuts above the hinge disulfides giving two Fab plus one Fc; pepsin cuts below the hinge giving one F(ab&#x27;)2. Right: a table of the five classes. IgG: monomer, about 75 percent of serum Ig, half-life about 21 days, crosses the placenta, best opsonin. IgA: dimer with J chain and secretory component in secretions, mucosal, breast milk. IgM: pentamer with J chain, first made, best complement activator, agglutinates. IgD: on naive B cells with IgM, trace in serum. IgE: binds FcεRI on mast cells and basophils, allergy and helminths, lowest serum level.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="640" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Antibody structure and the five classes</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Left: an IgG monomer. Right: what sets each class apart.</text><path d="M 217.0 360.0 L 217.0 530.0 L 243.0 530.0 L 243.0 360.0 Z" stroke="#18364a" stroke-width="2" fill="#d9e1e7"/><path d="M 241.1 353.2 L 131.1 173.2 L 108.9 186.8 L 218.9 366.8 Z" stroke="#18364a" stroke-width="2" fill="#d9e1e7"/><path d="M 203.9 331.5 L 90.9 175.5 L 73.1 188.5 L 186.1 344.5 Z" stroke="#5b7a64" stroke-width="2" fill="#e5ece3"/><circle cx="110" cy="164" r="14" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><circle cx="70" cy="172" r="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><path d="M 257.0 360.0 L 257.0 530.0 L 283.0 530.0 L 283.0 360.0 Z" stroke="#18364a" stroke-width="2" fill="#d9e1e7"/><path d="M 281.1 366.8 L 391.1 186.8 L 368.9 173.2 L 258.9 353.2 Z" stroke="#18364a" stroke-width="2" fill="#d9e1e7"/><path d="M 313.9 344.5 L 426.9 188.5 L 409.1 175.5 L 296.1 331.5 Z" stroke="#5b7a64" stroke-width="2" fill="#e5ece3"/><circle cx="390" cy="164" r="14" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><circle cx="430" cy="172" r="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><line x1="243" y1="372" x2="257" y2="372" stroke="#987740" stroke-width="3"/><line x1="243" y1="384" x2="257" y2="384" stroke="#987740" stroke-width="3"/><text x="290.0" y="384.0" class="" text-anchor="start" style="fill:#987740;font-weight:700;font-size:13px">hinge S–S</text><text x="250.0" y="130.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:14px">antigen-binding sites (CDR loops)</text><text x="80.0" y="300.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:18px">Fab</text><text x="420.0" y="300.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:18px">Fab</text><text x="180.0" y="490.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:18px">Fc</text><text x="290.0" y="460.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">Fc = effector end: Fc</text><text x="290.0" y="477.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">receptors, C1q, FcRn</text><line x1="190" y1="352" x2="310" y2="352" stroke="#245574" stroke-width="2" stroke-dasharray="6 5"/><text x="186.0" y="356.0" class="" text-anchor="end" style="fill:#245574;font-weight:700;font-size:13px">papain</text><line x1="190" y1="404" x2="310" y2="404" stroke="#a8324a" stroke-width="2" stroke-dasharray="6 5"/><text x="186.0" y="408.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:700;font-size:13px">pepsin</text><line x1="60" y1="548" x2="96" y2="548" stroke="#18364a" stroke-width="3"/><text x="106.0" y="553.0" class="" text-anchor="start" style="font-size:15px">heavy chain</text><line x1="60" y1="574" x2="96" y2="574" stroke="#5b7a64" stroke-width="3"/><text x="106.0" y="579.0" class="" text-anchor="start" style="font-size:15px">light chain</text><line x1="60" y1="600" x2="96" y2="600" stroke="#a8324a" stroke-width="3"/><text x="106.0" y="605.0" class="" text-anchor="start" style="font-size:15px">CDRs (VH + VL)</text><rect x="500" y="112" width="460" height="84" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="518.0" y="146.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:22px">IgG</text><text x="518.0" y="170.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">monomer</text><text x="650.0" y="140.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">~75% of serum Ig; t½ ~21 d; crosses</text><text x="650.0" y="158.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">placenta (FcRn); best opsonin; ADCC</text><rect x="500" y="206" width="460" height="84" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="518.0" y="240.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:700;font-size:22px">IgA</text><text x="518.0" y="264.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">dimer in secretions</text><text x="650.0" y="234.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">J chain + secretory component; mucosae,</text><text x="650.0" y="252.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">breast milk; neutralizes</text><rect x="500" y="300" width="460" height="84" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="518.0" y="334.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:700;font-size:22px">IgM</text><text x="518.0" y="358.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">pentamer</text><text x="650.0" y="328.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">J chain; first made; best complement</text><text x="650.0" y="346.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">activator; agglutinates</text><rect x="500" y="394" width="460" height="84" rx="10" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="518.0" y="428.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:700;font-size:22px">IgD</text><text x="518.0" y="452.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">monomer</text><text x="650.0" y="422.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">with IgM on naive B cells; trace in</text><text x="650.0" y="440.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">serum</text><rect x="500" y="488" width="460" height="84" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="518.0" y="522.0" class="" text-anchor="start" style="fill:#987740;font-weight:700;font-size:22px">IgE</text><text x="518.0" y="546.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">monomer</text><text x="650.0" y="516.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">binds FcεRI on mast cells/basophils;</text><text x="650.0" y="534.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">allergy, helminths; lowest serum level</text></svg>