310.4 297.8 L312.0 297.0 L313.6 296.2 L315.2 295.3 L316.8 294.5 L318.4 293.6 L320.0 286.8 L321.6 286.8 L323.2 286.8 L324.8 286.8 L326.4 286.8 L328.0 286.8 L329.6 286.8 L331.2 286.8 L332.8 286.0 L334.4 285.1 L336.0 284.3 L337.6 283.5 L339.2 282.6 L340.8 281.8 L342.4 280.9 L344.0 280.1 L345.6 279.2 L347.2 278.4 L348.8 277.5 L350.4 276.7 L352.0 275.8 L353.6 275.0 L355.2 274.1 L356.8 273.3 L358.4 272.5 L360.0 265.7 L361.6 265.7 L363.2 265.7 L364.8 265.7 L366.4 265.7 L368.0 265.7 L369.6 265.7 L371.2 265.7 L372.8 264.8 L374.4 264.0 L376.0 263.1 L377.6 262.3 L379.2 261.4 L380.8 260.6 L382.4 259.8 L384.0 258.9 L385.6 258.1 L387.2 257.2 L388.8 256.4 L390.4 255.5 L392.0 254.7 L393.6 253.8 L395.2 253.0 L396.8 252.1 L398.4 251.3 L400.0 244.5 L401.6 244.5 L403.2 244.5 L404.8 244.5 L406.4 244.5 L408.0 244.5 L409.6 244.5 L411.2 244.5 L412.8 243.7 L414.4 242.8 L416.0 242.0 L417.6 241.1 L419.2 240.3 L420.8 239.4 L422.4 238.6 L424.0 237.7 L425.6 236.9 L427.2 236.1 L428.8 235.2 L430.4 234.4 L432.0 233.5 L433.6 232.7 L435.2 231.8 L436.8 231.0 L438.4 230.1 L440.0 223.4" stroke="#987740" stroke-width="2.6" fill="none"/><text x="360.0" y="342.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">fixed ratio</text><text x="360.0" y="362.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">steep, then a pause</text><rect x="470" y="200" width="180" height="120" rx="8" fill="none" stroke="#6d716f" stroke-width="1.2"/><path d="M480.0 308.0 L481.6 307.5 L483.2 307.0 L484.8 306.5 L486.4 306.0 L488.0 305.5 L489.6 305.0 L491.2 304.5 L492.8 304.0 L494.4 303.4 L496.0 302.9 L497.6 302.4 L499.2 301.9 L500.8 301.4 L502.4 300.9 L504.0 300.4 L505.6 299.9 L507.2 299.4 L508.8 298.9 L510.4 298.4 L512.0 297.9 L513.6 297.4 L515.2 296.9 L516.8 296.4 L518.4 295.9 L520.0 295.4 L521.6 294.8 L523.2 294.3 L524.8 293.8 L526.4 293.3 L528.0 292.8 L529.6 292.3 L531.2 291.8 L532.8 291.3 L534.4 290.8 L536.0 290.3 L537.6 289.8 L539.2 289.3 L540.8 288.8 L542.4 288.3 L544.0 287.8 L545.6 287.3 L547.2 286.7 L548.8 286.2 L550.4 285.7 L552.0 285.2 L553.6 284.7 L555.2 284.2 L556.8 283.7 L558.4 283.2 L560.0 282.7 L561.6 282.2 L563.2 281.7 L564.8 281.2 L566.4 280.7 L568.0 280.2 L569.6 279.7 L571.2 279.2 L572.8 278.7 L574.4 278.1 L576.0 277.6 L577.6 277.1 L579.2 276.6 L580.8 276.1 L582.4 275.6 L584.0 275.1 L585.6 274.6 L587.2 274.1 L588.8 273.6 L590.4 273.1 L592.0 272.6 L593.6 272.1 L595.2 271.6 L596.8 271.1 L598.4 270.6 L600.0 270.1 L601.6 269.5 L603.2 269.0 L604.8 268.5 L606.4 268.0 L608.0 267.5 L609.6 267.0 L611.2 266.5 L612.8 266.0 L614.4 265.5 L616.0 265.0 L617.6 264.5 L619.2 264.0 L620.8 263.5 L622.4 263.0 L624.0 262.5 L625.6 262.0 L627.2 261.4 L628.8 260.9 L630.4 260.4 L632.0 259.9 L633.6 259.4 L635.2 258.9 L636.8 258.4 L638.4 257.9 L640.0 257.4" stroke="#5b7a64" stroke-width="2.6" fill="none"/><text x="560.0" y="342.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">variable interval</text><text x="560.0" y="362.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">gentle and even</text><rect x="670" y="200" width="180" height="120" rx="8" fill="none" stroke="#6d716f" stroke-width="1.2"/><path d="M680.0 308.0 L681.6 308.0 L683.2 308.0 L684.8 308.0 L686.4 307.9 L688.0 307.8 L689.6 307.7 L691.2 307.6 L692.8 307.3 L694.4 307.1 L696.0 306.7 L697.6 306.3 L699.2 305.8 L700.8 305.2 L702.4 304.4 L704.0 303.6 L705.6 302.7 L707.2 301.6 L708.8 300.4 L710.4 299.1 L712.0 297.6 L713.6 296.0 L715.2 294.2 L716.8 292.2 L718.4 290.1 L720.0 287.8 L721.6 287.8 L723.2 287.7 L724.8 287.7 L726.4 287.7 L728.0 287.6 L729.6 287.5 L731.2 287.3 L732.8 287.1 L734.4 286.8 L736.0 286.5 L737.6 286.0 L739.2 285.5 L740.8 284.9 L742.4 284.2 L744.0 283.4 L745.6 282.5 L747.2 281.4 L748.8 280.2 L750.4 278.9 L752.0 277.4 L753.6 275.8 L755.2 274.0 L756.8 272.0 L758.4 269.9 L760.0 267.5 L761.6 267.5 L763.2 267.5 L764.8 267.5 L766.4 267.4 L768.0 267.4 L769.6 267.2 L771.2 267.1 L772.8 266.9 L774.4 266.6 L776.0 266.2 L777.6 265.8 L779.2 265.3 L780.8 264.7 L782.4 264.0 L784.0 263.1 L785.6 262.2 L787.2 261.2 L788.8 260.0 L790.4 258.6 L792.0 257.2 L793.6 255.5 L795.2 253.7 L796.8 251.8 L798.4 249.6 L800.0 247.3 L801.6 247.3 L803.2 247.3 L804.8 247.2 L806.4 247.2 L808.0 247.1 L809.6 247.0 L811.2 246.8 L812.8 246.6 L814.4 246.3 L816.0 246.0 L817.6 245.6 L819.2 245.0 L820.8 244.4 L822.4 243.7 L824.0 242.9 L825.6 242.0 L827.2 240.9 L828.8 239.7 L830.4 238.4 L832.0 236.9 L833.6 235.3 L835.2 233.5 L836.8 231.5 L838.4 229.4 L840.0 227.0" stroke="#245574" stroke-width="2.6" fill="none"/><text x="760.0" y="342.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">fixed interval</text><text x="760.0" y="362.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">scalloped</text><text x="460.0" y="386.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">time runs left to right; a steeper line means a faster rate of responding</text><rect x="40" y="416" width="404" height="230" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="242.0" y="444.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">Two orderings worth memorising</text><text x="140.0" y="476.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">response rate</text><rect x="76" y="490" width="36" height="30" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="94.0" y="511.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">VR</text><rect x="120" y="490" width="36" height="30" rx="6" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="138.0" y="511.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">FR</text><rect x="164" y="490" width="36" height="30" rx="6" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="182.0" y="511.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">VI</text><rect x="208" y="490" width="36" height="30" rx="6" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="226.0" y="511.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">FI</text><text x="242.0" y="540.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">highest → lowest</text><text x="160.0" y="572.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">resistance to extinction</text><rect x="62" y="586" width="54" height="30" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="89.0" y="607.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">VR</text><rect x="126" y="586" width="54" height="30" rx="6" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="153.0" y="607.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">VI</text><rect x="190" y="586" width="54" height="30" rx="6" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="217.0" y="607.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">FR</text><rect x="254" y="586" width="54" height="30" rx="6" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="281.0" y="607.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">FI</text><rect x="318" y="586" width="54" height="30" rx="6" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="345.0" y="607.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">CRF</text><text x="242.0" y="634.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">highest → lowest</text><rect x="466" y="416" width="414" height="230" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="673.0" y="444.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">Why unpredictable schedules hold on</text><text x="673.0" y="474.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">on a FIXED schedule the gap is known,</text><text x="673.0" y="494.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">so a missed payout is obvious at once</text><text x="566.0" y="520.0" class="" text-anchor="end" style="fill:#245574;font-weight:bold;font-size:13px">fixed</text><text x="580.0" y="520.0" class="" text-anchor="start" style="fill:#245574;font-size:15px">● ● ● ● ● ● ●   — — —</text><text x="566.0" y="550.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:bold;font-size:13px">variable</text><text x="580.0" y="550.0" class="" text-anchor="start" style="fill:#a8324a;font-size:15px">●●    ●      ●  ●●   — — —</text><text x="673.0" y="596.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">after a variable schedule stops, the dry spell is</text><text x="673.0" y="616.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">indistinguishable from an ordinary run of bad luck</text><text x="673.0" y="636.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">— this is the partial reinforcement extinction effect</text><rect x="40" y="662" width="840" height="180" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="460.0" y="690.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">Shaping: reinforce what is closer, let the rest extinguish</text><rect x="72" y="714" width="142" height="70" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="143.0" y="742.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">moves toward</text><text x="143.0" y="762.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">that side</text><line x1="218" y1="749" x2="238" y2="749" stroke="#6d716f" stroke-width="2" marker-end="url(#m9254)"/><rect x="242" y="714" width="142" height="70" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="313.0" y="742.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">comes within</text><text x="313.0" y="762.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">an inch</text><line x1="388" y1="749" x2="408" y2="749" stroke="#6d716f" stroke-width="2" marker-end="url(#m9254)"/><rect x="412" y="714" width="142" height="70" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="483.0" y="742.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">touches</text><text x="483.0" y="762.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">the lever</text><line x1="558" y1="749" x2="578" y2="749" stroke="#6d716f" stroke-width="2" marker-end="url(#m9254)"/><rect x="582" y="714" width="142" height="70" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="653.0" y="742.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">presses it</text><text x="653.0" y="762.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">at all</text><line x1="728" y1="749" x2="748" y2="749" stroke="#6d716f" stroke-width="2" marker-end="url(#m9254)"/><rect x="752" y="714" width="142" height="70" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="823.0" y="742.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">presses hard</text><text x="823.0" y="762.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">enough</text><text x="460.0" y="812.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">at every step the previous approximation stops being reinforced — that is what drags the behaviour forward</text></svg>