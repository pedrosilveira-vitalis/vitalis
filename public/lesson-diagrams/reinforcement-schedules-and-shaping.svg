<svg xmlns="http://www.w3.org/2000/svg" width="920" height="858" viewBox="0 0 920 858" role="img" aria-labelledby="t d"><title id="t">Unpredictable pays worst and holds hardest</title><desc id="d">Top: the four schedules as cumulative response records. Variable ratio climbs steepest with no breaks; fixed ratio climbs almost as steeply but stops dead for a moment after each reward; variable interval rises at a gentle, even slope; fixed interval scallops, flat after each reward and accelerating as the next one comes due. Middle left: the two orderings to memorise, response rate highest for variable ratio down to lowest for fixed interval, and resistance to extinction highest for variable ratio down to lowest for continuous reinforcement. Middle right: why unpredictability persists — on a variable schedule a dry spell looks exactly like an ordinary gap, so the organism cannot tell that reinforcement has stopped. Bottom: shaping a lever press by reinforcing successive approximations while each earlier one is allowed to extinguish.</desc><defs><marker id="m9254" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="858" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Unpredictable pays worst and holds hardest</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Ratio or interval decides the rate; fixed or variable decides the persistence</text><rect x="40" y="150" width="840" height="250" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="178.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">The four signatures, drawn as cumulative records</text><rect x="70" y="200" width="180" height="120" rx="8" fill="none" stro