<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800" role="img" aria-labelledby="title desc"><title id="title">X transmission versus X inactivation</title><desc id="desc">A heterozygous mother and an unaffected father have four model offspring combinations. Cellular mosaicism arises separately when alternative X chromosomes are inactivated and each cell lineage preserves its choice.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a;font-size:18px}.h{font-size:27px;font-weight:700}.sub{font-size:22px;font-weight:700}.small{font-size:16px}</style><rect width="900" height="800" fill="#fbf7ef" rx="20"/><text x="35" y="48" class="h" text-anchor="start">Two processes. Two different questions.</text><text x="35" y="92" class="sub" text-anchor="start">1  Which X-linked allele does a child inherit?</text><text x="35" y="128" class="small" text-anchor="start">Mother XᴬXᵃ × father XᴬY; each box has probability ¼</text><text x="275" y="175" class="sub" text-anchor="middle">Xᴬ</text><text x="535" y="175" class="sub" text-anchor="middle">Y</text><text x="100" y="235" class="sub" text-anchor="middle">Xᴬ</text><text x="100" y="335" class="sub" text-anchor="middle">Xᵃ</text><rect x="145" y="195" width="260" height="100" rx="0" fill="#fff" stroke="#245574" stroke-width="2"/><text x="275" y="231" class="sub" text-anchor="middle">XᴬXᴬ</text><text x="275" y="265" class="small" text-anchor="middle">Noncarrier daughter</text><rect x="405" y="195" width="260" height="100" rx="0" fill="#fff" stroke="#245574" stroke-width="2"/><text x="535" y="231" class="sub" text-anchor="middle">XᴬY</text><text x="535" y="265" class="small" text-anchor="middle">Unaffected son</text><rect x="145" y="295" width="260" height="100" rx="0" fill="#eaf0f4" stroke="#245574" stroke-width="2"/><text x="275" y="331" class="sub" text-anchor="middle">XᴬXᵃ</text><text x="275" y="365" class="small" text-anchor="middle">Heterozygous daughter</text><rect x="405" y="295" width="260" height="100" rx="0" fill="#eaf0f4" stroke="#245574" stroke-width="2"/><text x="535" y="331" class="sub" text-anchor="middle">XᵃY</text><text x="535" y="365" class="small" text-anchor="middle">Affected son</text><text x="35" y="435" class="sub" text-anchor="start">½ of sons are affected; ¼ of all children are affected sons.</text><path d="M35 465 H865" stroke="#cbd7df" stroke-width="2" fill="none" stroke-dasharray=""/><text x="35" y="511" class="sub" text-anchor="start">2  Which X remains active in each cell lineage?</text><circle cx="100" cy="585" r="40" fill="white" stroke="#7898aa" stroke-width="2"/><text x="85" y="591" class="" text-anchor="middle">Xᴬ</text><circle cx="120" cy="586" r="9" fill="#245574"/><circle cx="220" cy="585" r="40" fill="white" stroke="#7898aa" stroke-width="2"/><text x="205" y="591" class="" text-anchor="middle">Xᴬ</text><circle cx="240" cy="586" r="9" fill="#245574"/><circle cx="100" cy="695" r="40" fill="white" stroke="#7898aa" stroke-width="2"/><text x="85" y="701" class="" text-anchor="middle">Xᴬ</text><circle cx="120" cy="696" r="9" fill="#245574"/><circle cx="220" cy="695" r="40" fill="white" stroke="#7898aa" stroke-width="2"/><text x="205" y="701" class="" text-anchor="middle">Xᴬ</text><circle cx="240" cy="696" r="9" fill="#245574"/><circle cx="530" cy="585" r="40" fill="white" stroke="#7898aa" stroke-width="2"/><text x="515" y="591" class="" text-anchor="middle">Xᵃ</text><circle cx="550" cy="586" r="9" fill="#245574"/><circle cx="650" cy="585" r="40" fill="white" stroke="#7898aa" stroke-width="2"/><text x="635" y="591" class="" text-anchor="middle">Xᵃ</text><circle cx="670" cy="586" r="9" fill="#245574"/><circle cx="530" cy="695" r="40" fill="white" stroke="#7898aa" stroke-width="2"/><text x="515" y="701" class="" text-anchor="middle">Xᵃ</text><circle cx="550" cy="696" r="9" fill="#245574"/><circle cx="650" cy="695" r="40" fill="white" stroke="#7898aa" stroke-width="2"/><text x="635" y="701" class="" text-anchor="middle">Xᵃ</text><circle cx="670" cy="696" r="9" fill="#245574"/><text x="330" y="606" class="small" text-anchor="start">● = inactive X</text><text x="330" y="636" class="small" text-anchor="start">Illustrative clones,</text><text x="330" y="663" class="small" text-anchor="start">not a fixed 50:50 ratio.</text><text x="35" y="775" class="small" text-anchor="start">Most X genes are silenced on the inactive X; escape and skewing modify outcomes.</text></svg>