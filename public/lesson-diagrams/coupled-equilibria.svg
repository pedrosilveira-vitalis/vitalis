<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="950" viewBox="0 0 1180 950" role="img" aria-labelledby="t d"><title id="t">Add the reactions, multiply the constants</title><desc id="d">Three worked couplings are set out as reaction sums. First, calcium carbonate in acid: the dissolution has a solubility product of 3.4 times ten to the minus nine, and protonating carbonate to bicarbonate contributes the reciprocal of the second acid constant of carbonic acid, 1 over 4.7 times ten to the minus eleven, so the net constant is about 71 and the dissolution is product-favoured, which is why antacid tablets dissolve in stomach acid and marble erodes in acid rain. Second, silver chloride in ammonia: the solubility product of 1.8 times ten to the minus ten multiplied by the formation constant of the diamminesilver ion, 1.7 times ten to the seventh, gives 3.1 times ten to the minus three, still below one but enormously larger than the solubility product alone, so concentrated ammonia dissolves the solid. Third, silver chloride in thiosulfate: the same solubility product multiplied by a formation constant of 2.9 times ten to the thirteenth gives 5.2 times ten to the third, far above one and essentially complete dissolution, which is the chemistry of photographic fixing. A plot shows the solubility of magnesium hydroxide against pH on a logarithmic scale in a buffered solution, where the solubility is the solubility product divided by the square of the hydroxide concentration, so the logarithm of the solubility falls by two for every unit of pH. At pH 9 the solubility is 5.6 times ten to the minus two molar, five hundred times its value in unbuffered water, and by pH 12 it has fallen to 5.6 times ten to the minus eight. The point for pure water is marked at a solubility of 1.1 times ten to the minus four molar and a pH of about 10.3, where the hydroxide released by the salt itself sets the pH. A panel works selective precipitation: with 0.10 molar barium and 0.10 molar calcium, sulfate begins to precipitate barium sulfate at 1.1 times ten to the minus nine molar sulfate and calcium sulfate only at 4.9 times ten to the minus four molar, by which point the barium concentration has fallen to 2.2 times ten to the minus seven molar, a removal of 99.9998 per cent. A footer lists which anions make a salt more soluble in acid, namely carbonate, phosphate, hydroxide, sulfide, fluoride and oxalate, all conjugate bases of weak acids, and notes that chloride, nitrate and sulfate are not, and that a formation constant is the reciprocal of a dissociation constant.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1180" height="950" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Add the reactions, multiply the constants</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Two equilibria that share a species are one equilibrium in disguise. Write the net reaction, multiply the K values, and a salt that “does not dissolve” may dissolve completely.</text><rect x="24" y="160" width="1128" height="254" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="588.0" y="188.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13.5px">THE MULTIPLICATION RULE, WORKED THREE TIMES</text><text x="48.0" y="216.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:700;font-size:12.5px">CaCO₃ in acid</text><text x="48.0" y="242.0" class="" text-anchor="start" style="fill:#18364a;font-size:11px">CaCO₃(s) ⇌ Ca²⁺ + CO₃²⁻</text><text x="48.0" y="256.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">Kₛₚ = 3.4×10⁻⁹</text><text x="48.0" y="274.0" class="" text-anchor="start" style="fill:#18364a;font-size:11px">CO₃²⁻ + H⁺ ⇌ HCO₃⁻</text><text x="48.0" y="288.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">1/Kₐ₂ = 2.1×10¹⁰</text><line x1="48" y1="310" x2="368" y2="310" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="48.0" y="332.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:700;font-size:13.5px">K_net ≈ 71</text><text x="208.0" y="356.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">product-favoured — antacids, acid rain on</text><text x="208.0" y="369.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">marble</text><text x="416.0" y="216.0" class="" text-anchor="start" style="fill:#987740;font-weight:700;font-size:12.5px">AgCl in ammonia</text><text x="416.0" y="242.0" class="" text-anchor="start" style="fill:#18364a;font-size:11px">AgCl(s) ⇌ Ag⁺ + Cl⁻</text><text x="416.0" y="256.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">Kₛₚ = 1.8×10⁻¹⁰</text><text x="416.0" y="274.0" class="" text-anchor="start" style="fill:#18364a;font-size:11px">Ag⁺ + 2NH₃ ⇌ [Ag(NH₃)₂]⁺</text><text x="416.0" y="288.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">K_f = 1.7×10⁷</text><line x1="416" y1="310" x2="736" y2="310" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="416.0" y="332.0" class="" text-anchor="start" style="fill:#987740;font-weight:700;font-size:13.5px">K_net = 3.1×10⁻³</text><text x="576.0" y="356.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">still &lt; 1, but 10⁷× the bare Kₛₚ —</text><text x="576.0" y="369.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">dissolves in conc. NH₃</text><text x="784.0" y="216.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:700;font-size:12.5px">AgCl in thiosulfate</text><text x="784.0" y="242.0" class="" text-anchor="start" style="fill:#18364a;font-size:11px">AgCl(s) ⇌ Ag⁺ + Cl⁻</text><text x="784.0" y="256.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">Kₛₚ = 1.8×10⁻¹⁰</text><text x="784.0" y="274.0" class="" text-anchor="start" style="fill:#18364a;font-size:11px">Ag⁺ + 2S₂O₃²⁻ ⇌ [Ag(S₂O₃)₂]³⁻</text><text x="784.0" y="288.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">K_f = 2.9×10¹³</text><line x1="784" y1="310" x2="1104" y2="310" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="784.0" y="332.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:700;font-size:13.5px">K_net = 5.2×10³</text><text x="944.0" y="356.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">≫ 1 — essentially complete: photographic</text><text x="944.0" y="369.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">fixing</text><line x1="64" y1="702" x2="544" y2="702" stroke="#18364a" stroke-width="2"/><line x1="64" y1="452" x2="64" y2="702" stroke="#18364a" stroke-width="2"/><text x="304.0" y="746.0" class="" text-anchor="middle" style="font-size:17px">pH (buffered)</text><text x="20" y="577.0" text-anchor="middle" transform="rotate(-90 20 577.0)" style="font-size:17px">log₁₀ solubility  (M)</text><line x1="139.78947368421052" y1="702.0" x2="139.78947368421052" y2="708.0" stroke="#18364a" stroke-width="2"/><text x="139.8" y="724.0" class="" text-anchor="middle" style="font-size:14px">9</text><line x1="266.10526315789474" y1="702.0" x2="266.10526315789474" y2="708.0" stroke="#18364a" stroke-width="2"/><text x="266.1" y="724.0" class="" text-anchor="middle" style="font-size:14px">10</text><line x1="392.421052631579" y1="702.0" x2="392.421052631579" y2="708.0" stroke="#18364a" stroke-width="2"/><text x="392.4" y="724.0" class="" text-anchor="middle" style="font-size:14px">11</text><line x1="518.7368421052632" y1="702.0" x2="518.7368421052632" y2="708.0" stroke="#18364a" stroke-width="2"/><text x="518.7" y="724.0" class="" text-anchor="middle" style="font-size:14px">12</text><line x1="58.0" y1="688.1111111111111" x2="64.0" y2="688.1111111111111" stroke="#18364a" stroke-width="2"/><text x="54.0" y="693.1" class="" text-anchor="end" style="font-size:14px">-8</text><line x1="58.0" y1="632.5555555555555" x2="64.0" y2="632.5555555555555" stroke="#18364a" stroke-width="2"/><text x="54.0" y="637.6" class="" text-anchor="end" style="font-size:14px">-6</text><line x1="58.0" y1="577.0" x2="64.0" y2="577.0" stroke="#18364a" stroke-width="2"/><text x="54.0" y="582.0" class="" text-anchor="end" style="font-size:14px">-4</text><line x1="58.0" y1="521.4444444444445" x2="64.0" y2="521.4444444444445" stroke="#18364a" stroke-width="2"/><text x="54.0" y="526.4" class="" text-anchor="end" style="font-size:14px">-2</text><line x1="58.0" y1="465.8888888888889" x2="64.0" y2="465.8888888888889" stroke="#18364a" stroke-width="2"/><text x="54.0" y="470.9" class="" text-anchor="end" style="font-size:14px">0</text><path d="M76.6 472.9 L89.3 478.4 L101.9 484.0 L114.5 489.6 L127.2 495.1 L139.8 500.7 L152.4 506.2 L165.1 511.8 L177.7 517.3 L190.3 522.9 L202.9 528.4 L215.6 534.0 L228.2 539.6 L240.8 545.1 L253.5 550.7 L266.1 556.2 L278.7 561.8 L291.4 567.3 L304.0 572.9 L316.6 578.4 L329.3 584.0 L341.9 589.6 L354.5 595.1 L367.2 600.7 L379.8 606.2 L392.4 611.8 L405.1 617.3 L417.7 622.9 L430.3 628.4 L442.9 634.0 L455.6 639.6 L468.2 645.1 L480.8 650.7 L493.5 656.2 L506.1 661.8 L518.7 667.3 L531.4 672.9 L544.0 678.4" stroke="#18364a" stroke-width="3" fill="none"/><circle cx="309.0526315789474" cy="575.8888888888889" r="5" fill="#a8324a" stroke="#a8324a" stroke-width="0"/><text x="319.1" y="579.9" class="" text-anchor="start" style="fill:#a8324a;font-weight:700;font-size:11px">pure water: 1.1×10⁻⁴ M</text><circle cx="139.78947368421052" cy="500.6111111111111" r="5" fill="#5b7a64" stroke="#5b7a64" stroke-width="0"/><text x="149.8" y="504.6" class="" text-anchor="start" style="fill:#5b7a64;font-weight:700;font-size:11px">pH 9: 5.6×10⁻² M — 500× more</text><text x="304.0" y="768.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:11.5px">Mg(OH)₂,  Kₛₚ = 5.6×10⁻¹².  Buffered, s = Kₛₚ/[OH⁻]², so log s falls by 2 per pH unit.</text><text x="304.0" y="786.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">This is milk of magnesia: insoluble in the gut, freely soluble in stomach acid.</text><rect x="584" y="452" width="568" height="254" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="868.0" y="484.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12.5px">SELECTIVE PRECIPITATION — 0.10 M Ba²⁺ AND 0.10 M Ca²⁺</text><text x="868.0" y="506.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">adding sulfate slowly</text><text x="608.0" y="540.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12px">BaSO₄ begins</text><text x="860.0" y="540.0" class="" text-anchor="end" style="fill:#6d716f;font-size:10.5px">Kₛₚ = 1.1×10⁻¹⁰</text><text x="1128.0" y="540.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:11.5px">[SO₄²⁻] = 1.1×10⁻⁹ M</text><text x="608.0" y="570.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:12px">CaSO₄ begins</text><text x="860.0" y="570.0" class="" text-anchor="end" style="fill:#6d716f;font-size:10.5px">Kₛₚ = 4.9×10⁻⁵</text><text x="1128.0" y="570.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:11.5px">[SO₄²⁻] = 4.9×10⁻⁴ M</text><line x1="608" y1="608" x2="1128" y2="608" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="868.0" y="634.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:11.5px">when CaSO₄ just starts, [Ba²⁺] = 1.1×10⁻¹⁰ / 4.9×10⁻⁴ = 2.2×10⁻⁷ M</text><text x="868.0" y="654.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:11.5px">99.9998% of the barium is already out before any calcium follows</text><text x="868.0" y="676.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">The ion needing the LOWER added-ion concentration goes first —</text><text x="868.0" y="692.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">which depends on its starting concentration as well as its Kₛₚ</text><rect x="24" y="806" width="1128" height="118" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="588.0" y="836.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13.5px">Which salts care about pH, and which do not</text><text x="588.0" y="857.5" class="" text-anchor="middle" style="font-size:12px">MORE SOLUBLE IN ACID — the anion is the conjugate base of a WEAK acid, so H⁺ removes it: CO₃²⁻, PO₄³⁻, OH⁻, S²⁻, F⁻, C₂O₄²⁻. INDIFFERENT — the anion</text><text x="588.0" y="874.5" class="" text-anchor="middle" style="font-size:12px">is the conjugate base of a STRONG acid and is never protonated in water: Cl⁻, Br⁻, I⁻, NO₃⁻. SO₄²⁻ is the near-miss: its parent HSO₄⁻ has pKₐ ≈ 1.9,</text><text x="588.0" y="891.5" class="" text-anchor="middle" style="font-size:12px">so sulfates are pH-indifferent above about pH 4 but not in strong acid. AND NOTE: K_f = 1/K_d. A huge formation constant is a tiny dissociation</text><text x="588.0" y="908.5" class="" text-anchor="middle" style="font-size:12px">constant — the same statement twice.</text></svg>