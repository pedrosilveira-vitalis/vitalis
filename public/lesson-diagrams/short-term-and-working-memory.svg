<svg xmlns="http://www.w3.org/2000/svg" width="920" height="872" viewBox="0 0 920 872" role="img" aria-labelledby="t d"><title id="t">A workspace, not a waiting room</title><desc id="d">Top left: the Peterson and Peterson result, recall of a three-letter trigram plotted against the delay filled with counting backwards, falling from near perfect at three seconds to about a tenth by eighteen — the evidence for a fifteen to thirty second span without rehearsal. Top right: chunking, with twelve loose letters recoded as four familiar acronyms so that the same material costs four slots instead of twelve. Middle: the four experimental effects that reveal the phonological loop — phonological similarity, word length, articulatory suppression and irrelevant speech — each with what it shows. Bottom: short-term memory against working memory, passive store against active workspace, with the capacity and duration figures and the prefrontal involvement that distinguishes them.</desc><defs><marker id="m8359" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="872" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">A workspace, not a waiting room</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Short-term memory holds; working memory holds while you do something to it</text><rect x="40" y="156" width="420" height="262" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="250.0" y="184.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">Block rehearsal and it is gone in 18 s</text><line x1="112" y1="326" x2="412" y2="326" stroke="#18364a" stroke-width="2"/><line x1="112" y1="206" x2="112" y2="326" stroke="#18364a" stroke-width="2"/><text x="262.0" y="370.0" class="" text-anchor="middle" style="font-size:17px">seconds of counting backwards</text><text x="68" y="266.0" text-anchor="middle" transform="rotate(-90 68 266.0)" style="font-size:17px">% recalled</text><line x1="159.36842105263156" y1="326.0" x2="159.36842105263156" y2="332.0" stroke="#18364a" stroke-width="2"/><text x="159.4" y="348.0" class="" text-anchor="middle" style="font-size:14px">3</text><line x1="254.10526315789474" y1="326.0" x2="254.10526315789474" y2="332.0" stroke="#18364a" stroke-width="2"/><text x="254.1" y="348.0" class="" text-anchor="middle" style="font-size:14px">9</text><line x1="348.8421052631579" y1="326.0" x2="348.8421052631579" y2="332.0" stroke="#18364a" stroke-width="2"/><text x="348.8" y="348.0" class="" text-anchor="middle" style="font-size:14px">15</text><line x1="396.2105263157895" y1="326.0" x2="396.2105263157895" y2="332.0" stroke="#18364a" stroke-width="2"/><text x="396.2" y="348.0" class="" text-anchor="middle" style="font-size:14px">18</text><line x1="106.0" y1="314.0" x2="112.0" y2="314.0" stroke="#18364a" stroke-width="2"/><text x="102.0" y="319.0" class="" text-anchor="end" style="font-size:14px">10</text><line x1="106.0" y1="266.0" x2="112.0" y2="266.0" stroke="#18364a" stroke-width="2"/><text x="102.0" y="271.0" class="" text-anchor="end" style="font-size:14px">50</text><line x1="106.0" y1="230.0" x2="112.0" y2="230.0" stroke="#18364a" stroke-width="2"/><text x="102.0" y="235.0" class="" text-anchor="end" style="font-size:14px">80</text><path d="M112.0 209.6 L113.6 211.1 L115.2 212.6 L116.7 214.1 L118.3 215.6 L119.9 217.0 L121.5 218.4 L123.1 219.8 L124.6 221.2 L126.2 222.6 L127.8 223.9 L129.4 225.2 L130.9 226.5 L132.5 227.8 L134.1 229.1 L135.7 230.4 L137.3 231.6 L138.8 232.8 L140.4 234.0 L142.0 235.2 L143.6 236.4 L145.2 237.5 L146.7 238.7 L148.3 239.8 L149.9 240.9 L151.5 242.0 L153.1 243.1 L154.6 244.1 L156.2 245.2 L157.8 246.2 L159.4 247.2 L160.9 248.2 L162.5 249.2 L164.1 250.2 L165.7 251.2 L167.3 252.1 L168.8 253.0 L170.4 254.0 L172.0 254.9 L173.6 255.8 L175.2 256.7 L176.7 257.5 L178.3 258.4 L179.9 259.2 L181.5 260.1 L183.1 260.9 L184.6 261.7 L186.2 262.5 L187.8 263.3 L189.4 264.1 L190.9 264.9 L192.5 265.6 L194.1 266.4 L195.7 267.1 L197.3 267.9 L198.8 268.6 L200.4 269.3 L202.0 270.0 L203.6 270.7 L205.2 271.3 L206.7 272.0 L208.3 272.7 L209.9 273.3 L211.5 274.0 L213.1 274.6 L214.6 275.2 L216.2 275.9 L217.8 276.5 L219.4 277.1 L220.9 277.7 L222.5 278.2 L224.1 278.8 L225.7 279.4 L227.3 279.9 L228.8 280.5 L230.4 281.0 L232.0 281.6 L233.6 282.1 L235.2 282.6 L236.7 283.1 L238.3 283.7 L239.9 284.2 L241.5 284.7 L243.1 285.1 L244.6 285.6 L246.2 286.1 L247.8 286.6 L249.4 287.0 L250.9 287.5 L252.5 287.9 L254.1 288.4 L255.7 288.8 L257.3 289.2 L258.8 289.7 L260.4 290.1 L262.0 290.5 L263.6 290.9 L265.2 291.3 L266.7 291.7 L268.3 292.1 L269.9 292.5 L271.5 292.9 L273.1 293.2 L274.6 293.6 L276.2 294.0 L277.8 294.3 L279.4 294.7 L280.9 295.0 L282.5 295.4 L284.1 295.7 L285.7 296.0 L287.3 296.4 L288.8 296.7 L290.4 297.0 L292.0 297.3 L293.6 297.6 L295.2 298.0 L296.7 298.3 L298.3 298.6 L299.9 298.9 L301.5 299.1 L303.1 299.4 L304.6 299.7 L306.2 300.0 L307.8 300.3 L309.4 300.5 L310.9 300.8 L312.5 301.1 L314.1 301.3 L315.7 301.6 L317.3 301.9 L318.8 302.1 L320.4 302.3 L322.0 302.6 L323.6 302.8 L325.2 303.1 L326.7 303.3 L328.3 303.5 L329.9 303.8 L331.5 304.0 L333.1 304.2 L334.6 304.4 L336.2 304.6 L337.8 304.9 L339.4 305.1 L340.9 305.3 L342.5 305.5 L344.1 305.7 L345.7 305.9 L347.3 306.1 L348.8 306.3 L350.4 306.4 L352.0 306.6 L353.6 306.8 L355.2 307.0 L356.7 307.2 L358.3 307.4 L359.9 307.5 L361.5 307.7 L363.1 307.9 L364.6 308.0 L366.2 308.2 L367.8 308.4 L369.4 308.5 L370.9 308.7 L372.5 308.8 L374.1 309.0 L375.7 309.1 L377.3 309.3 L378.8 309.4 L380.4 309.6 L382.0 309.7 L383.6 309.9 L385.2 310.0 L386.7 310.2 L388.3 310.3 L389.9 310.4 L391.5 310.6 L393.1 310.7 L394.6 310.8 L396.2 310.9 L397.8 311.1 L399.4 311.2 L400.9 311.3 L402.5 311.4 L404.1 311.5 L405.7 311.7 L407.3 311.8 L408.8 311.9 L410.4 312.0 L412.0 312.1" stroke="#245574" stroke-width="2.8" fill="none"/><circle cx="159.36842105263156" cy="247.219834425871" r="4" fill="#18364a" stroke="#18364a" stroke-width="2"/><circle cx="396.2105263157895" cy="310.9378161519216" r="4" fill="#a8324a" stroke="#a8324a" stroke-width="2"/><text x="388.2" y="296.9" class="" text-anchor="end" style="fill:#a8324a;font-weight:bold;font-size:13px">≈ 10%</text><text x="250.0" y="392.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">15–30 s is the span when nothing refreshes it</text><rect x="480" y="156" width="400" height="262" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="680.0" y="184.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">Chunking buys slots, not storage</text><rect x="520" y="206" width="26" height="28" rx="4" fill="#faf6ee" stroke="#6d716f" stroke-width="1.5"/><text x="533.0" y="226.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">F</text><rect x="550" y="206" width="26" height="28" rx="4" fill="#faf6ee" stroke="#6d716f" stroke-width="1.5"/><text x="563.0" y="226.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">B</text><rect x="580" y="206" width="26" height="28" rx="4" fill="#faf6ee" stroke="#6d716f" stroke-width="1.5"/><text x="593.0" y="226.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">I</text><rect x="610" y="206" width="26" height="28" rx="4" fill="#faf6ee" stroke="#6d716f" stroke-width="1.5"/><text x="623.0" y="226.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">C</text><rect x="640" y="206" width="26" height="28" rx="4" fill="#faf6ee" stroke="#6d716f" stroke-width="1.5"/><text x="653.0" y="226.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">I</text><rect x="670" y="206" width="26" height="28" rx="4" fill="#faf6ee" stroke="#6d716f" stroke-width="1.5"/><text x="683.0" y="226.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">A</text><rect x="700" y="206" width="26" height="28" rx="4" fill="#faf6ee" stroke="#6d716f" stroke-width="1.5"/><text x="713.0" y="226.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">N</text><rect x="730" y="206" width="26" height="28" rx="4" fill="#faf6ee" stroke="#6d716f" stroke-width="1.5"/><text x="743.0" y="226.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">F</text><rect x="760" y="206" width="26" height="28" rx="4" fill="#faf6ee" stroke="#6d716f" stroke-width="1.5"/><text x="773.0" y="226.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">L</text><rect x="790" y="206" width="26" height="28" rx="4" fill="#faf6ee" stroke="#6d716f" stroke-width="1.5"/><text x="803.0" y="226.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">N</text><rect x="820" y="206" width="26" height="28" rx="4" fill="#faf6ee" stroke="#6d716f" stroke-width="1.5"/><text x="833.0" y="226.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">B</text><rect x="850" y="206" width="26" height="28" rx="4" fill="#faf6ee" stroke="#6d716f" stroke-width="1.5"/><text x="863.0" y="226.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">A</text><text x="680.0" y="252.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">12 items — over capacity</text><line x1="680" y1="262" x2="680" y2="282" stroke="#18364a" stroke-width="2" marker-end="url(#m8359)"/><rect x="528" y="292" width="76" height="34" rx="7" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="566.0" y="315.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">FBI</text><rect x="612" y="292" width="76" height="34" rx="7" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="650.0" y="315.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">CIA</text><rect x="696" y="292" width="76" height="34" rx="7" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="734.0" y="315.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">NFL</text><rect x="780" y="292" width="76" height="34" rx="7" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="818.0" y="315.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">NBA</text><text x="680.0" y="348.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">4 chunks — comfortably inside it</text><text x="680.0" y="378.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Miller said 7 ± 2; Cowan&#x27;s stricter tests say 4 ± 1</text><text x="680.0" y="400.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">expertise is a library of chunks, not a bigger store</text><rect x="40" y="434" width="840" height="194" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="460.0" y="462.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">Four effects that give the phonological loop away</text><rect x="62" y="480" width="196" height="104" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="160.0" y="506.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">phonological similarity</text><text x="160.0" y="534.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">B C D G P T are hard;</text><text x="160.0" y="552.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">the store codes sound</text><rect x="268" y="480" width="196" height="104" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="366.0" y="506.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">word length</text><text x="366.0" y="534.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">short words beat long ones;</text><text x="366.0" y="552.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">rehearsal runs in real time</text><rect x="474" y="480" width="196" height="104" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="572.0" y="506.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">articulatory suppression</text><text x="572.0" y="534.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">say &quot;the, the, the&quot; and</text><text x="572.0" y="552.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">the length effect vanishes</text><rect x="680" y="480" width="196" height="104" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="778.0" y="506.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">irrelevant speech</text><text x="778.0" y="534.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">background talk intrudes</text><text x="778.0" y="552.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">even when ignored</text><text x="460.0" y="608.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">store ≈ 2 s of sound; the inner voice refreshes it before it fades</text><rect x="40" y="644" width="840" height="204" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="672.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">Same material, two different jobs</text><rect x="70" y="692" width="370" height="134" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="255.0" y="718.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">SHORT-TERM MEMORY</text><text x="255.0" y="744.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">a passive store: hold it as given</text><text x="255.0" y="764.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">7 ± 2 items, or 4 ± 1 chunks</text><text x="255.0" y="784.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">15–30 s without rehearsal</text><text x="255.0" y="804.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">Atkinson and Shiffrin, 1968</text><rect x="480" y="692" width="370" height="134" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="665.0" y="718.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">WORKING MEMORY</text><text x="665.0" y="744.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">an active workspace: hold and transform</text><text x="665.0" y="764.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">executive + loop + sketchpad + buffer</text><text x="665.0" y="784.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">maintained by processing, not repetition</text><text x="665.0" y="804.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">Baddeley and Hitch, 1974; prefrontal</text></svg>