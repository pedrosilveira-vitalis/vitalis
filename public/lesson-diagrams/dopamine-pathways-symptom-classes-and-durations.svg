<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1010" viewBox="0 0 920 1010" role="img" aria-labelledby="t d"><title id="t">Four pathways, two symptom classes, one duration ruler</title><desc id="d">Top: the four dopaminergic pathways. A D2 blocker cannot aim; it hits all four, which is why one drug produces both the therapeutic effect and the classic side effects. Mesolimbic hyperactivity is the target, mesocortical hypoactivity is the one that blockade makes worse, and nigrostriatal and tuberoinfundibular blockade buy the extrapyramidal symptoms and the raised prolactin. Middle: positive versus negative symptoms, the distinction every vignette turns on — excess versus absence, and which class the drugs actually treat. Bottom: the duration ruler that separates brief psychotic disorder from schizophreniform from schizophrenia, with the two diagnoses that are decided by something other than duration.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="1010" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Four pathways, two symptom classes, one duration ruler</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Where the dopamine goes decides whether blocking it helps or hurts</text><rect x="40" y="180" width="840" height="318" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">The four dopamine pathways, and what D2 blockade does to each</text><rect x="66" y="228" width="788" height="54" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="84.0" y="251.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:12px">MESOLIMBIC</text><text x="84.0" y="268.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10px">VTA → nucleus accumbens, amygdala, hippocampus</text><text x="482.0" y="251.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">in schizophrenia: HYPERACTIVE</text><text x="482.0" y="268.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">blocking it → positive symptoms fall</text><rect x="742" y="242" width="98" height="26" rx="6" fill="none" stroke="#a8324a" stroke-width="1.6"/><text x="791.0" y="260.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:9.5px">THE TARGET</text><rect x="66" y="290" width="788" height="54" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="84.0" y="313.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:12px">MESOCORTICAL</text><text x="84.0" y="330.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10px">VTA → prefrontal cortex</text><text x="482.0" y="313.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">in schizophrenia: HYPOACTIVE</text><text x="482.0" y="330.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">blocking it → negative symptoms, cognition worse</text><rect x="742" y="304" width="98" height="26" rx="6" fill="none" stroke="#245574" stroke-width="1.6"/><text x="791.0" y="322.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:9.5px">COLLATERAL</text><rect x="66" y="352" width="788" height="54" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="84.0" y="375.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:12px">NIGROSTRIATAL</text><text x="84.0" y="392.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10px">substantia nigra → striatum</text><text x="482.0" y="375.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">in schizophrenia: normal</text><text x="482.0" y="392.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">blocking it → EPS, tardive dyskinesia</text><rect x="742" y="366" width="98" height="26" rx="6" fill="none" stroke="#987740" stroke-width="1.6"/><text x="791.0" y="384.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:9.5px">SIDE EFFECT</text><rect x="66" y="414" width="788" height="54" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="84.0" y="437.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:12px">TUBEROINFUNDIBULAR</text><text x="84.0" y="454.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10px">hypothalamus → pituitary</text><text x="482.0" y="437.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">in schizophrenia: normal</text><text x="482.0" y="454.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">blocking it → prolactin rises</text><rect x="742" y="428" width="98" height="26" rx="6" fill="none" stroke="#5b7a64" stroke-width="1.6"/><text x="791.0" y="446.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:9.5px">SIDE EFFECT</text><text x="460.0" y="486.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">one drug, four pathways — the side effects are the same mechanism as the cure</text><rect x="40" y="514" width="410" height="268" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="245.0" y="542.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">POSITIVE · something added</text><text x="245.0" y="562.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">excess or distortion of normal function</text><text x="245.0" y="588.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10.5px">delusions — persecutory, grandiose, referential,</text><text x="245.0" y="608.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10.5px">   thought insertion, withdrawal, broadcasting</text><text x="245.0" y="628.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10.5px">hallucinations — auditory above all</text><text x="245.0" y="648.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10.5px">disorganised speech — loose associations,</text><text x="245.0" y="668.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10.5px">   tangentiality, clang, neologisms, word salad</text><text x="245.0" y="688.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10.5px">disorganised or catatonic behaviour</text><line x1="80" y1="718" x2="410" y2="718" stroke="#a8324a" stroke-width="1" stroke-dasharray="6 5"/><text x="245.0" y="740.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11.5px">respond well to antipsychotics</text><text x="245.0" y="762.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">mesolimbic hyperactivity</text><rect x="470" y="514" width="410" height="268" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="675.0" y="542.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">NEGATIVE · something missing</text><text x="675.0" y="562.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">the five A&#x27;s — diminution or absence</text><text x="560.0" y="588.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:11px">Affective flattening</text><text x="560.0" y="604.0" class="" text-anchor="start" style="fill:#6d716f;font-size:9.5px">narrowed expression, monotone</text><text x="560.0" y="614.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:11px">Alogia</text><text x="560.0" y="630.0" class="" text-anchor="start" style="fill:#6d716f;font-size:9.5px">poverty of speech</text><text x="560.0" y="640.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:11px">Avolition</text><text x="560.0" y="656.0" class="" text-anchor="start" style="fill:#6d716f;font-size:9.5px">cannot start or sustain goals</text><text x="560.0" y="666.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:11px">Anhedonia</text><text x="560.0" y="682.0" class="" text-anchor="start" style="fill:#6d716f;font-size:9.5px">no pleasure from what once pleased</text><text x="560.0" y="692.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:11px">Asociality</text><text x="560.0" y="708.0" class="" text-anchor="start" style="fill:#6d716f;font-size:9.5px">withdrawal from others</text><line x1="510" y1="718" x2="840" y2="718" stroke="#245574" stroke-width="1" stroke-dasharray="6 5"/><text x="675.0" y="740.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11.5px">poorly treated, and they drive outcome</text><text x="675.0" y="762.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">mesocortical hypoactivity, hypofrontality</text><rect x="40" y="798" width="840" height="192" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="460.0" y="826.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">The duration ruler</text><line x1="110" y1="872" x2="790" y2="872" stroke="#6d716f" stroke-width="2"/><line x1="110" y1="865" x2="110" y2="879" stroke="#6d716f" stroke-width="2"/><text x="110.0" y="898.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">1 day</text><line x1="310" y1="865" x2="310" y2="879" stroke="#6d716f" stroke-width="2"/><text x="310.0" y="898.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">1 month</text><line x1="560" y1="865" x2="560" y2="879" stroke="#6d716f" stroke-width="2"/><text x="560.0" y="898.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">6 months</text><line x1="790" y1="865" x2="790" y2="879" stroke="#6d716f" stroke-width="2"/><rect x="110" y="838" width="200" height="22" rx="5" fill="#f1eadc" stroke="#987740" stroke-width="1.6"/><text x="210.0" y="853.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10.5px">brief psychotic disorder</text><rect x="310" y="838" width="250" height="22" rx="5" fill="#e4edf3" stroke="#245574" stroke-width="1.6"/><text x="435.0" y="853.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">schizophreniform</text><rect x="560" y="838" width="230" height="22" rx="5" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><text x="675.0" y="853.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">schizophrenia</text><text x="460.0" y="928.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">decided by something other than duration:</text><text x="250.0" y="952.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">DELUSIONAL DISORDER</text><text x="250.0" y="970.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">≥ 1 month of delusions, function otherwise intact</text><text x="670.0" y="952.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">SCHIZOAFFECTIVE</text><text x="670.0" y="970.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">≥ 2 weeks of psychosis with no mood episode</text></svg>