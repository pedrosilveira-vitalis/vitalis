<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1046" viewBox="0 0 920 1046" role="img" aria-labelledby="t d"><title id="t">Five targets a bacterium has that you do not</title><desc id="d">Top: the bacterial cell with the five druggable targets marked, each one a structure or pathway with no close human counterpart. That absence is what makes an antibiotic safe to take, and it is also why the targets are so few. Middle: the drug classes at each target, with the one fact per class that questions turn on. Bottom: resistance read as a reply to each mechanism — destroy the drug, change the lock, pump it out, or shut the door. Pairing a resistance mechanism with the mechanism it defeats is how these are usually tested.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="1046" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Five targets a bacterium has that you do not</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Selective toxicity is the whole story — and resistance answers each target in kind</text><rect x="40" y="180" width="840" height="262" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">Where a drug can attack</text><rect x="300" y="236" width="320" height="180" rx="46" fill="none" stroke="#18364a" stroke-width="2.4"/><rect x="312" y="248" width="296" height="156" rx="38" fill="#efede8" stroke="#6d716f" stroke-width="1.4"/><text x="460.0" y="262.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:9px">PEPTIDOGLYCAN WALL</text><text x="460.0" y="284.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:9px">CELL MEMBRANE</text><circle cx="400" cy="330" r="16" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="400.0" y="334.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:9px">70S</text><circle cx="460" cy="330" r="16" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="460.0" y="334.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:9px">70S</text><text x="430.0" y="356.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:8.5px">RIBOSOMES</text><text x="545.0" y="326.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:9px">DNA</text><text x="545.0" y="342.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:8px">gyrase</text><text x="460.0" y="386.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">FOLATE SYNTHESIS</text><text x="460.0" y="400.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">made here, not eaten</text><text x="150.0" y="262.0" class="" text-anchor="middle" style="fill:#5b7a64;font-size:8.5px">no human equivalent</text><text x="150.0" y="300.0" class="" text-anchor="middle" style="fill:#987740;font-size:8.5px">different lipid make-up</text><text x="150.0" y="338.0" class="" text-anchor="middle" style="fill:#245574;font-size:8.5px">yours are 80S</text><text x="770.0" y="300.0" class="" text-anchor="middle" style="fill:#a8324a;font-size:8.5px">human topoisomerases differ</text><text x="770.0" y="386.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">you get folate from food</text><text x="460.0" y="430.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">every one of these is a structure or pathway you do not have — that absence IS the drug&#x27;s safety margin</text><rect x="40" y="458" width="840" height="268" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="486.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">The classes, and the one fact each is tested on</text><rect x="60" y="506" width="800" height="40" rx="6" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.3"/><text x="122.0" y="531.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:9.5px">WALL</text><text x="300.0" y="531.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:8.5px">beta-lactams · vancomycin</text><text x="660.0" y="521.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:7.5px">beta-lactams block the transpeptidase (PBP);</text><text x="660.0" y="532.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:7.5px">vancomycin caps D-Ala–D-Ala and cannot cross</text><text x="660.0" y="543.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:7.5px">a gram-negative outer membrane</text><rect x="60" y="550" width="800" height="40" rx="6" fill="#e4edf3" stroke="#245574" stroke-width="1.3"/><text x="122.0" y="575.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:9.5px">30S</text><text x="300.0" y="575.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:8.5px">aminoglycosides · tetracyclines</text><text x="660.0" y="565.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:7.5px">aminoglycosides need oxygen to get in, so they</text><text x="660.0" y="576.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:7.5px">fail against anaerobes; tetracyclines are chelated</text><text x="660.0" y="587.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:7.5px">by calcium and are bacteriostatic</text><rect x="60" y="594" width="800" height="40" rx="6" fill="#e4edf3" stroke="#245574" stroke-width="1.3"/><text x="122.0" y="619.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:9.5px">50S</text><text x="300.0" y="619.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:8.5px">macrolides · clindamycin · linezolid</text><text x="660.0" y="609.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:7.5px">macrolides cover the atypicals — Mycoplasma,</text><text x="660.0" y="620.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:7.5px">Chlamydia, Legionella — which is why they are</text><text x="660.0" y="631.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:7.5px">the answer for community-acquired pneumonia</text><rect x="60" y="638" width="800" height="40" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.3"/><text x="122.0" y="663.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:9.5px">DNA / RNA</text><text x="300.0" y="663.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:8.5px">fluoroquinolones · rifampin · metronidazole</text><text x="660.0" y="653.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:7.5px">rifampin resistance appears fast enough that it is</text><text x="660.0" y="664.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:7.5px">never used alone; metronidazole must be reduced</text><text x="660.0" y="675.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:7.5px">by an anaerobe to become toxic</text><rect x="60" y="682" width="800" height="40" rx="6" fill="#e8ecef" stroke="#18364a" stroke-width="1.3"/><text x="122.0" y="707.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">FOLATE</text><text x="300.0" y="707.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:8.5px">sulfonamides · trimethoprim</text><text x="660.0" y="697.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:7.5px">two consecutive steps of one pathway, which is</text><text x="660.0" y="708.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:7.5px">why the combination is synergistic</text><rect x="40" y="742" width="840" height="282" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="460.0" y="770.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">Resistance, read as a reply</text><rect x="60" y="790" width="800" height="46" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.3"/><text x="150.0" y="818.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:9.5px">DESTROY THE DRUG</text><text x="430.0" y="808.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8px">beta-lactamases hydrolyse the ring;</text><text x="430.0" y="821.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8px">carbapenemases take even carbapenems</text><text x="730.0" y="808.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">answered by clavulanate,</text><text x="730.0" y="821.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">sulbactam, tazobactam</text><rect x="60" y="840" width="800" height="46" rx="6" fill="#f1eadc" stroke="#987740" stroke-width="1.3"/><text x="150.0" y="868.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:9.5px">CHANGE THE LOCK</text><text x="430.0" y="858.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8px">MRSA&#x27;s mecA makes PBP2a, which</text><text x="430.0" y="871.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8px">beta-lactams barely bind</text><text x="730.0" y="858.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">VRE swaps D-Ala–D-Ala for</text><text x="730.0" y="871.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">D-Ala–D-Lac: 1,000× weaker</text><rect x="60" y="890" width="800" height="46" rx="6" fill="#e4edf3" stroke="#245574" stroke-width="1.3"/><text x="150.0" y="918.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:9.5px">PUMP IT OUT</text><text x="430.0" y="908.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8px">RND efflux pumps export several</text><text x="430.0" y="921.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8px">classes at once</text><text x="730.0" y="908.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">one pump, multidrug</text><text x="730.0" y="921.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">resistance</text><rect x="60" y="940" width="800" height="46" rx="6" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.3"/><text x="150.0" y="968.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:9.5px">SHUT THE DOOR</text><text x="430.0" y="958.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8px">porins are downregulated so the drug</text><text x="430.0" y="971.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8px">never gets in</text><text x="730.0" y="958.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">with a beta-lactamase,</text><text x="730.0" y="971.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">this gives carbapenem resistance</text><text x="460.0" y="1008.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">and all four spread sideways — conjugation, transformation, transduction — so resistance need not be reinvented</text></svg>