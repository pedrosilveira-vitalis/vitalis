<svg xmlns="http://www.w3.org/2000/svg" width="920" height="830" viewBox="0 0 920 830" role="img" aria-labelledby="t d"><title id="t">Torque: only the perpendicular part counts</title><desc id="d">Left: a beam on a pivot with a force applied at an angle, showing the distance r along the beam, the perpendicular lever arm r sine theta, and the component of the force that produces no torque. Right: the three lever classes drawn with fulcrum, load and effort, with their mechanical advantages and body examples. Bottom: the biceps calculation showing a 700 newton muscle force holding a 100 newton load, the rule for choosing the axis of rotation, and the pulley rule that mechanical advantage equals the number of supporting rope segments.</desc><defs><marker id="m3161" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker><marker id="m5344" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker><marker id="m6620" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker><marker id="m8130" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b7a64"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="830" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Torque: only the perpendicular part counts</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">τ = F · r · sinθ = F · d⊥, and in equilibrium the clockwise and counter-clockwise totals match</text><rect x="40" y="112" width="400" height="316" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="240.0" y="142.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">What makes a torque</text><line x1="92" y1="320" x2="400" y2="320" stroke="#18364a" stroke-width="4"/><path d="M78 350 L106 350 L92 320 Z" stroke="#6d716f" stroke-width="2" fill="#efede8"/><text x="92.0" y="370.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">pivot</text><line x1="334" y1="320" x2="386.94688687800664" y2="252.23107518982192" stroke="#a8324a" stroke-width="3" marker-end="url(#m5344)"/><text x="398.9" y="248.2" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:17px">F</text><line x1="334" y1="320" x2="334" y2="252.23107518982192" stroke="#5b7a64" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#m8130)"/><text x="322.0" y="292.0" class="" text-anchor="end" style="fill:#5b7a64;font-weight:bold;font-size:14px">F sinθ</text><line x1="334" y1="320" x2="386.94688687800664" y2="320" stroke="#6d716f" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#m6620)"/><text x="378.0" y="360.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">F cosθ: no torque</text><line x1="92" y1="256" x2="334" y2="256" stroke="#18364a" stroke-width="1.5" stroke-dasharray="6 5"/><text x="213.0" y="248.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">r</text><text x="364.0" y="306.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:16px">θ</text><text x="240.0" y="382.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">τ = F r sinθ = F · d⊥</text><text x="240.0" y="408.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">θ = 90° gives the most torque; θ = 0° gives none</text><rect x="456" y="112" width="424" height="316" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="668.0" y="142.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">The three lever classes</text><line x1="486" y1="210" x2="700" y2="210" stroke="#18364a" stroke-width="3"/><path d="M582 234 L606 234 L594 210 Z" stroke="#6d716f" stroke-width="2" fill="#efede8"/><line x1="512" y1="174" x2="512" y2="204" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m5344)"/><text x="512.0" y="166.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">load</text><line x1="676" y1="174" x2="676" y2="204" stroke="#245574" stroke-width="2.5" marker-end="url(#m3161)"/><text x="676.0" y="166.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">effort</text><text x="716.0" y="202.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:14px">1st class</text><text x="716.0" y="222.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:14px">MA ≷ 1</text><text x="716.0" y="242.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">seesaw, skull on spine</text><line x1="486" y1="300" x2="700" y2="300" stroke="#18364a" stroke-width="3"/><path d="M500 324 L524 324 L512 300 Z" stroke="#6d716f" stroke-width="2" fill="#efede8"/><line x1="594" y1="264" x2="594" y2="294" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m5344)"/><text x="594.0" y="256.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">load</text><line x1="676" y1="264" x2="676" y2="294" stroke="#245574" stroke-width="2.5" marker-end="url(#m3161)"/><text x="676.0" y="256.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">effort</text><text x="716.0" y="292.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:14px">2nd class</text><text x="716.0" y="312.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:14px">MA &gt; 1</text><text x="716.0" y="332.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">wheelbarrow, tiptoe</text><line x1="486" y1="390" x2="700" y2="390" stroke="#18364a" stroke-width="3"/><path d="M500 414 L524 414 L512 390 Z" stroke="#6d716f" stroke-width="2" fill="#efede8"/><line x1="676" y1="354" x2="676" y2="384" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m5344)"/><text x="676.0" y="346.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">load</text><line x1="594" y1="354" x2="594" y2="384" stroke="#245574" stroke-width="2.5" marker-end="url(#m3161)"/><text x="594.0" y="346.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">effort</text><text x="716.0" y="382.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:14px">3rd class</text><text x="716.0" y="402.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:14px">MA &lt; 1</text><text x="716.0" y="422.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">tweezers, biceps</text><rect x="40" y="452" width="400" height="176" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="240.0" y="480.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">Why muscles pull so hard</text><text x="240.0" y="512.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">biceps inserts 5 cm from the elbow;</text><text x="240.0" y="536.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">the load sits 35 cm away</text><text x="240.0" y="566.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">F × 0.05 = 100 × 0.35  ⇒  F = 700 N</text><text x="240.0" y="598.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">MA = 0.05/0.35 ≈ 0.14: force traded for speed</text><rect x="456" y="452" width="424" height="176" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="668.0" y="480.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:17px">Two habits that save the most time</text><text x="668.0" y="512.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">1. Put the axis where the unknowns are:</text><text x="668.0" y="536.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">a force through the axis has r = 0, so it drops out</text><text x="668.0" y="566.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">2. Pulley MA = supporting rope segments</text><text x="668.0" y="590.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">one movable pulley ⇒ MA = 2; a fixed pulley only</text><text x="668.0" y="612.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">turns the force around</text><text x="460.0" y="672.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">Equilibrium needs both: ΣF = 0 and Στ = 0, about any axis you like</text><text x="460.0" y="704.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Ideal machines conserve work: a bigger MA always costs a longer pull</text><text x="460.0" y="734.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">An object tips when its centre of mass leaves the base of support</text><text x="460.0" y="764.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">On an incline: N = mg cosθ and F = mg sinθ, with MA = L/h = 1/sinθ</text><text x="460.0" y="798.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">Pick counter-clockwise as positive once, and never switch mid-problem</text></svg>