<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="t d"><title id="t">The four hypersensitivity types (Gell and Coombs)</title><desc id="d">Four columns. Type I, immediate: IgE on mast cells is cross-linked by allergen; histamine within minutes, leukotrienes and prostaglandin D2, late phase hours later; examples anaphylaxis, hay fever, allergic asthma; clue raised IgE, eosinophils. Type II, antibody against cell or matrix antigens: IgG or IgM binds a cell surface; complement lysis, phagocytosis, ADCC, or receptor blocking or stimulating; examples transfusion reaction, hemolytic disease of the newborn, Goodpasture, myasthenia gravis, Graves; clue positive Coombs test. Type III, immune complexes: soluble antigen plus IgG forms small complexes in slight antigen excess that deposit in vessels, glomeruli and joints, activate complement and attract neutrophils; examples serum sickness, Arthus reaction, lupus, post-streptococcal glomerulonephritis; clue low C3 and C4. Type IV, delayed T-cell mediated: Th1 cells activate macrophages via IFN-gamma, or CD8 T cells kill; 48 to 72 hours; examples tuberculin test, contact dermatitis, granulomas; no antibody.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="640" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">The four hypersensitivity types (Gell and Coombs)</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Types I–III are antibody-mediated; type IV is mediated by T cells.</text><rect x="30" y="100" width="225" height="510" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="142.5" y="132.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:22px">Type I</text><text x="142.5" y="156.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:14px">Immediate (IgE)</text><rect x="42" y="186" width="201" height="78" rx="8" fill="#ffffff" stroke="#a8324a" stroke-width="1.5"/><text x="142.5" y="210.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">Allergen cross-links IgE</text><text x="142.5" y="227.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">on mast cells/basophils</text><rect x="42" y="276" width="201" height="78" rx="8" fill="#ffffff" stroke="#a8324a" stroke-width="1.5"/><text x="142.5" y="300.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">Minutes: histamine;</text><text x="142.5" y="317.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">leukotrienes, PGD2</text><rect x="42" y="366" width="201" height="78" rx="8" fill="#ffffff" stroke="#a8324a" stroke-width="1.5"/><text x="142.5" y="390.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">Late phase hours later:</text><text x="142.5" y="407.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">eosinophils, Th2</text><text x="142.5" y="472.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:13px">Examples</text><text x="142.5" y="492.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">Anaphylaxis, hay fever,</text><text x="142.5" y="509.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">allergic asthma</text><text x="142.5" y="560.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:13px">Clue</text><text x="142.5" y="582.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:14px">↑ IgE, eosinophils</text><rect x="268" y="100" width="225" height="510" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="380.5" y="132.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:22px">Type II</text><text x="380.5" y="156.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:14px">Antibody vs. cell/matrix</text><rect x="280" y="186" width="201" height="78" rx="8" fill="#ffffff" stroke="#987740" stroke-width="1.5"/><text x="380.5" y="210.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">IgG/IgM bind antigens</text><text x="380.5" y="227.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">fixed on cells or basement</text><text x="380.5" y="244.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">membrane</text><rect x="280" y="276" width="201" height="78" rx="8" fill="#ffffff" stroke="#987740" stroke-width="1.5"/><text x="380.5" y="300.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">Complement lysis,</text><text x="380.5" y="317.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">phagocytosis, ADCC</text><rect x="280" y="366" width="201" height="78" rx="8" fill="#ffffff" stroke="#987740" stroke-width="1.5"/><text x="380.5" y="390.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">Or block/stimulate a</text><text x="380.5" y="407.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">receptor</text><text x="380.5" y="472.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:13px">Examples</text><text x="380.5" y="492.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">Transfusion reaction, HDN,</text><text x="380.5" y="509.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">Goodpasture, myasthenia,</text><text x="380.5" y="526.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">Graves</text><text x="380.5" y="560.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:13px">Clue</text><text x="380.5" y="582.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:14px">Positive Coombs test</text><rect x="506" y="100" width="225" height="510" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="618.5" y="132.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:22px">Type III</text><text x="618.5" y="156.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:14px">Immune complexes</text><rect x="518" y="186" width="201" height="78" rx="8" fill="#ffffff" stroke="#245574" stroke-width="1.5"/><text x="618.5" y="210.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">Soluble antigen + IgG →</text><text x="618.5" y="227.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">small complexes (slight</text><text x="618.5" y="244.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">antigen excess)</text><rect x="518" y="276" width="201" height="78" rx="8" fill="#ffffff" stroke="#245574" stroke-width="1.5"/><text x="618.5" y="300.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">Deposit in vessels,</text><text x="618.5" y="317.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">glomeruli, joints</text><rect x="518" y="366" width="201" height="78" rx="8" fill="#ffffff" stroke="#245574" stroke-width="1.5"/><text x="618.5" y="390.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">Complement (C3a, C5a) →</text><text x="618.5" y="407.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">neutrophils</text><text x="618.5" y="472.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:13px">Examples</text><text x="618.5" y="492.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">Serum sickness, Arthus, SLE,</text><text x="618.5" y="509.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">post-strep GN</text><text x="618.5" y="560.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:13px">Clue</text><text x="618.5" y="582.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:14px">↓ C3 and C4</text><rect x="744" y="100" width="225" height="510" rx="12" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="856.5" y="132.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:22px">Type IV</text><text x="856.5" y="156.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:14px">Delayed (T cells)</text><rect x="756" y="186" width="201" height="78" rx="8" fill="#ffffff" stroke="#5b7a64" stroke-width="1.5"/><text x="856.5" y="210.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">Memory Th1 cells → IFN-γ →</text><text x="856.5" y="227.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">macrophages</text><rect x="756" y="276" width="201" height="78" rx="8" fill="#ffffff" stroke="#5b7a64" stroke-width="1.5"/><text x="856.5" y="300.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">or CD8⁺ T cells kill</text><text x="856.5" y="317.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">directly</text><rect x="756" y="366" width="201" height="78" rx="8" fill="#ffffff" stroke="#5b7a64" stroke-width="1.5"/><text x="856.5" y="390.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">Peaks 48–72 h; no antibody</text><text x="856.5" y="472.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:13px">Examples</text><text x="856.5" y="492.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">PPD test, contact</text><text x="856.5" y="509.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">dermatitis, granulomas</text><text x="856.5" y="560.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:13px">Clue</text><text x="856.5" y="582.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:14px">Induration, granulomas</text></svg>