<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1006" viewBox="0 0 920 1006" role="img" aria-labelledby="t d"><title id="t">Which way does the study run?</title><desc id="d">Top: the three observational designs drawn on a single time axis. A cohort study starts at the exposure and runs forward; a case-control study starts at the outcome and runs backward; a cross-sectional study takes one vertical slice and so has no direction at all. Everything else about them follows from that — which measure you can compute, which bias dominates, and whether you can say what came first. Middle: the signature bias of each design. Bottom: the Bradford Hill considerations, which are how observational evidence is argued up toward causation when a trial is impossible.</desc><defs><marker id="m3495" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker><marker id="m7445" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="1006" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Which way does the study run?</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Cohort, case-control and cross-sectional differ only in where they start</text><rect x="40" y="180" width="840" height="320" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">The same timeline, entered from three places</text><line x1="140" y1="460" x2="820" y2="460" stroke="#6d716f" stroke-width="2"/><text x="140.0" y="480.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:bold;font-size:9px">PAST</text><text x="820.0" y="480.0" class="" text-anchor="end" style="fill:#6d716f;font-weight:bold;font-size:9px">FUTURE</text><line x1="250" y1="452" x2="250" y2="468" stroke="#6d716f" stroke-width="1.5"/><text x="250.0" y="446.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">exposure</text><line x1="640" y1="452" x2="640" y2="468" stroke="#6d716f" stroke-width="1.5"/><text x="640.0" y="446.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">outcome</text><rect x="140" y="228" width="290" height="62" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="285.0" y="248.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">COHORT</text><text x="285.0" y="266.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">start at the EXPOSURE, follow forward</text><text x="285.0" y="282.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:8.5px">who develops the outcome?</text><line x1="250" y1="302" x2="640" y2="302" stroke="#245574" stroke-width="2" marker-end="url(#m3495)"/><rect x="500" y="316" width="330" height="62" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="665.0" y="336.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">CASE-CONTROL</text><text x="665.0" y="354.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">start at the OUTCOME, look backward</text><text x="665.0" y="370.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:8.5px">what were they exposed to?</text><line x1="640" y1="390" x2="250" y2="390" stroke="#a8324a" stroke-width="2" marker-end="url(#m7445)"/><line x1="440" y1="410" x2="440" y2="460" stroke="#18364a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="440.0" y="404.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">CROSS-SECTIONAL — one slice, no direction</text><rect x="40" y="516" width="840" height="212" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="544.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">What each one yields, and what it suffers from</text><rect x="60" y="566" width="800" height="48" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="146.0" y="593.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">COHORT</text><text x="344.0" y="585.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">RELATIVE RISK</text><text x="344.0" y="599.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">and true INCIDENCE</text><text x="520.0" y="593.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:9.5px">LOSS TO FOLLOW-UP</text><text x="718.0" y="585.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">if dropouts differ from stayers,</text><text x="718.0" y="599.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">the remaining sample is no longer the cohort</text><rect x="60" y="620" width="800" height="48" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="146.0" y="647.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">CASE-CONTROL</text><text x="344.0" y="639.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">ODDS RATIO only</text><text x="344.0" y="653.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">(≈ RR when disease is rare)</text><text x="520.0" y="647.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:9.5px">RECALL BIAS</text><text x="718.0" y="639.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">people who are ill search their past harder</text><text x="718.0" y="653.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">than the healthy controls do</text><rect x="60" y="674" width="800" height="48" rx="7" fill="#e8ecef" stroke="#18364a" stroke-width="1.5"/><text x="146.0" y="701.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10.5px">CROSS-SECTIONAL</text><text x="344.0" y="693.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">PREVALENCE</text><text x="344.0" y="707.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">(≈ incidence × duration)</text><text x="520.0" y="701.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">NEYMAN BIAS</text><text x="718.0" y="693.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">a quickly fatal or quickly cured disease is</text><text x="718.0" y="707.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">under-represented: you only ever see survivors</text><rect x="40" y="744" width="840" height="246" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="460.0" y="772.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">Arguing from association toward causation</text><text x="460.0" y="792.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">the Bradford Hill considerations — a checklist, never a proof</text><rect x="60" y="810" width="390" height="52" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.4"/><text x="160.0" y="832.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10px">TEMPORALITY</text><text x="160.0" y="848.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">the exposure came FIRST</text><text x="345.0" y="840.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">the only one that is strictly required</text><rect x="60" y="868" width="390" height="52" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.4"/><text x="160.0" y="890.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10px">STRENGTH</text><text x="160.0" y="906.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">a large RR or OR</text><text x="345.0" y="898.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">a weak one is easier for a confounder to fake</text><rect x="60" y="926" width="390" height="52" rx="7" fill="#f1eadc" stroke="#987740" stroke-width="1.4"/><text x="160.0" y="948.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10px">DOSE-RESPONSE</text><text x="160.0" y="964.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">more exposure, more disease</text><text x="345.0" y="956.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">also called a biological gradient</text><rect x="470" y="810" width="390" height="52" rx="7" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.4"/><text x="570.0" y="832.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10px">CONSISTENCY</text><text x="570.0" y="848.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">found again elsewhere</text><text x="755.0" y="840.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">different populations, different designs</text><rect x="470" y="868" width="390" height="52" rx="7" fill="#e8ecef" stroke="#18364a" stroke-width="1.4"/><text x="570.0" y="890.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">PLAUSIBILITY</text><text x="570.0" y="906.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">a mechanism that makes sense</text><text x="755.0" y="898.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">and coherence with what else is known</text><rect x="470" y="926" width="390" height="52" rx="7" fill="#efede8" stroke="#6d716f" stroke-width="1.4"/><text x="570.0" y="948.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:10px">REVERSIBILITY</text><text x="570.0" y="964.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">remove it and risk falls</text><text x="755.0" y="956.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8px">the experimental hint inside observation</text></svg>