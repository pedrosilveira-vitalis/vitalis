<svg xmlns="http://www.w3.org/2000/svg" width="920" height="884" viewBox="0 0 920 884" role="img" aria-labelledby="t d"><title id="t">The illusions are the rules showing their working</title><desc id="d">Top: the Müller-Lyer figure, which is the one students most often memorise backwards. Both shafts are the same length. The one whose fins splay outward reads as the inside corner of a room, which is farther from you, and since the brain scales a retinal image up with distance, that line looks longer. The one with arrowheads closing inward reads as the near, outside corner of a building, so it looks shorter. That is size constancy, correctly applied to a flat drawing that does not deserve it — and people raised where buildings are not full of right angles are measurably less fooled. Bottom left: the five constancies. Bottom right: the direction of influence that each illusion exposes.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="884" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">The illusions are the rules showing their working</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Constancy is useful almost always; an illusion is what it costs the rest of the time</text><rect x="40" y="176" width="840" height="272" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="204.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">Same length. Not the same percept.</text><line x1="140" y1="290" x2="360" y2="290" stroke="#5b7a64" stroke-width="3"/><line x1="140" y1="290" x2="110" y2="269.0" stroke="#5b7a64" stroke-width="2.6"/><line x1="140" y1="290" x2="110" y2="311.0" stroke="#5b7a64" stroke-width="2.6"/><line x1="360" y1="290" x2="390" y2="269.0" stroke="#5b7a64" stroke-width="2.6"/><line x1="360" y1="290" x2="390" y2="311.0" stroke="#5b7a64" stroke-width="2.6"/><text x="250.0" y="232.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">fins splay OUTWARD</text><text x="250.0" y="346.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">reads as an inside corner — farther</text><text x="250.0" y="366.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">so it looks LONGER</text><line x1="560" y1="290" x2="780" y2="290" stroke="#a8324a" stroke-width="3"/><line x1="560" y1="290" x2="590" y2="269.0" stroke="#a8324a" stroke-width="2.6"/><line x1="560" y1="290" x2="590" y2="311.0" stroke="#a8324a" stroke-width="2.6"/><line x1="780" y1="290" x2="750" y2="269.0" stroke="#a8324a" stroke-width="2.6"/><line x1="780" y1="290" x2="750" y2="311.0" stroke="#a8324a" stroke-width="2.6"/><text x="670.0" y="232.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">arrowheads close INWARD</text><text x="670.0" y="346.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">reads as an outside corner — nearer</text><text x="670.0" y="366.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">so it looks SHORTER</text><line x1="460" y1="240" x2="460" y2="400" stroke="#6d716f" stroke-width="1.4" stroke-dasharray="6 5"/><text x="460.0" y="424.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">both shafts are 220 px · measure them · the depth story is what differs</text><rect x="40" y="464" width="420" height="390" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="250.0" y="492.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">The five constancies</text><rect x="66" y="514" width="368" height="56" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="250.0" y="534.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">SIZE</text><text x="250.0" y="550.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">retinal image shrinks</text><text x="250.0" y="564.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">scaled by perceived distance</text><rect x="66" y="576" width="368" height="56" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="250.0" y="596.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">SHAPE</text><text x="250.0" y="612.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">a tilted plate is an ellipse</text><text x="250.0" y="626.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">still perceived as a circle</text><rect x="66" y="638" width="368" height="56" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="250.0" y="658.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">LIGHTNESS</text><text x="250.0" y="674.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">sunlight or candlelight</text><text x="250.0" y="688.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">ratios to neighbours stay fixed</text><rect x="66" y="700" width="368" height="56" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="250.0" y="720.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">COLOUR</text><text x="250.0" y="736.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">the illuminant changes</text><text x="250.0" y="750.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">the brain discounts it</text><rect x="66" y="762" width="368" height="56" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="250.0" y="782.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">POSITION</text><text x="250.0" y="798.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">every saccade shifts the image</text><text x="250.0" y="812.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">corollary discharge cancels it</text><text x="250.0" y="842.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">push your own eyeball and the world jumps — no motor command, no cancellation</text><rect x="480" y="464" width="400" height="390" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="680.0" y="492.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">What each one exposes</text><text x="500.0" y="516.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:12px">Müller-Lyer · Ponzo</text><text x="500.0" y="532.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">size constancy misapplied to depth cues</text><text x="500.0" y="560.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:12px">Mach bands</text><text x="500.0" y="576.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">lateral inhibition at a border</text><text x="500.0" y="604.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:12px">Checker shadow</text><text x="500.0" y="620.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">lightness constancy discounting a shadow</text><text x="500.0" y="648.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:bold;font-size:12px">Necker cube · Rubin vase</text><text x="500.0" y="664.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">two readings, neither preferred</text><text x="500.0" y="692.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:12px">Phi phenomenon</text><text x="500.0" y="708.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">motion built from still frames</text><text x="500.0" y="736.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:12px">Waterfall aftereffect</text><text x="500.0" y="752.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">fatigue in direction-tuned neurons</text><text x="500.0" y="780.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:bold;font-size:12px">Autokinetic effect</text><text x="500.0" y="796.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">no frame of reference to anchor to</text><text x="680.0" y="824.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">none of them go away when you are told</text><text x="680.0" y="842.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">knowing is top-down; the assumption sits lower</text></svg>