<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="t d"><title id="t">Five ways a Foundations answer goes wrong</title><desc id="d">Five wrong-answer patterns, each with what the passage said, what the wrong answer says, and the defence. Distortion: the passage says the policy was reversed within two years, the wrong answer says it was reversed after two years; defence, compare the choice against the sentence word by word, not against your memory. Half-right: the passage says the reform cut costs in rural districts, the wrong answer says it cut costs and raised attendance; defence, check the whole choice, not just the half you recognise. Extreme claim: the passage says the approach is often effective in cities, the wrong answer says it is the most effective method available; defence, match the strength of the answer to the strength of the claim, and watch for always, never, all, proves. Plausible extension: the passage says critics called the account idealised, the wrong answer says critics proved the account factually false; defence, a near-surface inference is one step from the text, so if you need a chain of steps it is the wrong category. Out of scope: the passage discusses urban housing policy, the wrong answer makes a true statement about rural housing that the passage never makes; defence, closed-world thinking, since the passage is the only valid source. A footer gives the process: classify the question, locate the text before evaluating, predict the answer, then test each choice against the passage, and notes that Foundations is about 30 percent of the section, roughly 16 of 53 questions.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="660" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Five ways a Foundations answer goes wrong</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">All five contain real passage content. That is what makes them attractive.</text><text x="40.0" y="124.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:700;font-size:11px">pattern</text><text x="230.0" y="124.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:700;font-size:11px">what the passage said</text><text x="500.0" y="124.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:700;font-size:11px">what the wrong answer says</text><rect x="30" y="136" width="940" height="86" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="46.0" y="166.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:700;font-size:15px">Distortion</text><rect x="220" y="148" width="260" height="34" rx="7" fill="#ffffff" stroke="#6d716f" stroke-width="1.5"/><text x="350.0" y="164.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">&quot;reversed within two years&quot;</text><text x="490.0" y="170.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:18px">→</text><rect x="508" y="148" width="290" height="34" rx="7" fill="#ffffff" stroke="#a8324a" stroke-width="1.5"/><text x="653.0" y="164.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">&quot;reversed after two years&quot;</text><text x="46.0" y="200.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">Defence: Compare the choice against the sentence, word by word.</text><rect x="30" y="232" width="940" height="86" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="46.0" y="262.0" class="" text-anchor="start" style="fill:#987740;font-weight:700;font-size:15px">Half-right</text><rect x="220" y="244" width="260" height="34" rx="7" fill="#ffffff" stroke="#6d716f" stroke-width="1.5"/><text x="350.0" y="260.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">&quot;cut costs in rural districts&quot;</text><text x="490.0" y="266.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:18px">→</text><rect x="508" y="244" width="290" height="34" rx="7" fill="#ffffff" stroke="#987740" stroke-width="1.5"/><text x="653.0" y="260.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:12px">&quot;cut costs AND raised attendance&quot;</text><text x="46.0" y="296.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">Defence: Check the whole choice, not just the half you recognise.</text><rect x="30" y="328" width="940" height="86" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="46.0" y="358.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:15px">Extreme claim</text><rect x="220" y="340" width="260" height="34" rx="7" fill="#ffffff" stroke="#6d716f" stroke-width="1.5"/><text x="350.0" y="356.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">&quot;often effective in cities&quot;</text><text x="490.0" y="362.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:18px">→</text><rect x="508" y="340" width="290" height="34" rx="7" fill="#ffffff" stroke="#245574" stroke-width="1.5"/><text x="653.0" y="356.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12px">&quot;the most effective method available&quot;</text><text x="46.0" y="392.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">Defence: Match answer strength to claim strength. Watch always / never / proves.</text><rect x="30" y="424" width="940" height="86" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="46.0" y="454.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:700;font-size:15px">Plausible extension</text><rect x="220" y="436" width="260" height="34" rx="7" fill="#ffffff" stroke="#6d716f" stroke-width="1.5"/><text x="350.0" y="452.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">&quot;critics called it idealised&quot;</text><text x="490.0" y="458.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:18px">→</text><rect x="508" y="436" width="290" height="34" rx="7" fill="#ffffff" stroke="#5b7a64" stroke-width="1.5"/><text x="653.0" y="452.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:12px">&quot;critics proved it factually false&quot;</text><text x="46.0" y="488.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">Defence: A near-surface inference is ONE step from the text.</text><rect x="30" y="520" width="940" height="86" rx="10" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="46.0" y="550.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:700;font-size:15px">Out of scope</text><rect x="220" y="532" width="260" height="34" rx="7" fill="#ffffff" stroke="#6d716f" stroke-width="1.5"/><text x="350.0" y="548.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">passage is about urban housing</text><text x="490.0" y="554.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:700;font-size:18px">→</text><rect x="508" y="532" width="290" height="34" rx="7" fill="#ffffff" stroke="#6d716f" stroke-width="1.5"/><text x="653.0" y="548.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:700;font-size:12px">a true claim about rural housing</text><text x="46.0" y="584.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">Defence: Closed world: the passage is the only valid source.</text><text x="500.0" y="628.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:14px">Classify → locate the text → predict → test each choice against the passage.</text><text x="500.0" y="650.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">Foundations of Comprehension is ~30% of the section — about 16 of the 53 questions.</text></svg>