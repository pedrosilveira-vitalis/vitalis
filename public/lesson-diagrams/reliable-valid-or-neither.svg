<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1000" viewBox="0 0 920 1000" role="img" aria-labelledby="t d"><title id="t">Reliable, valid, or neither</title><desc id="d">Top: the target picture, because it settles the relationship in one look. Reliability is how tightly the shots cluster; validity is whether the cluster sits on the bullseye. A measure can be reliable and wrong, but it cannot be valid and inconsistent — which is why reliability is necessary for validity and never sufficient. Middle: the four reliabilities, each with the statistic that reports it and the question it answers. Bottom: what breaks a group comparison from the inside, including the three threats that arise because the control group knows it is a control group.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="1000" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Reliable, valid, or neither</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Consistency is not accuracy — and one of them comes first</text><rect x="40" y="180" width="840" height="306" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">The target picture</text><circle cx="160" cy="290" r="52" fill="none" stroke="#6d716f" stroke-width="1.2"/><circle cx="160" cy="290" r="34" fill="none" stroke="#6d716f" stroke-width="1.2"/><circle cx="160" cy="290" r="17" fill="none" stroke="#6d716f" stroke-width="1.2"/><circle cx="160" cy="290" r="4" fill="#18364a" stroke="#18364a" stroke-width="2"/><circle cx="189" cy="259" r="5" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><circle cx="198" cy="265" r="5" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><circle cx="193" cy="272" r="5" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><circle cx="185" cy="266" r="5" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><text x="160.0" y="366.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">RELIABLE, NOT VALID</text><text x="160.0" y="382.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">consistent and consistently wrong</text><circle cx="365" cy="290" r="52" fill="none" stroke="#6d716f" stroke-width="1.2"/><circle cx="365" cy="290" r="34" fill="none" stroke="#6d716f" stroke-width="1.2"/><circle cx="365" cy="290" r="17" fill="none" stroke="#6d716f" stroke-width="1.2"/><circle cx="365" cy="290" r="4" fill="#18364a" stroke="#18364a" stroke-width="2"/><circle cx="335" cy="276" r="5" fill="#f1eadc" stroke="#987740" stroke-width="1.6"/><circle cx="391" cy="270" r="5" fill="#f1eadc" stroke="#987740" stroke-width="1.6"/><circle cx="352" cy="319" r="5" fill="#f1eadc" stroke="#987740" stroke-width="1.6"/><circle cx="387" cy="304" r="5" fill="#f1eadc" stroke="#987740" stroke-width="1.6"/><text x="365.0" y="366.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10.5px">VALID-ISH, NOT RELIABLE</text><text x="365.0" y="382.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">centred on average, useless per shot</text><circle cx="570" cy="290" r="52" fill="none" stroke="#6d716f" stroke-width="1.2"/><circle cx="570" cy="290" r="34" fill="none" stroke="#6d716f" stroke-width="1.2"/><circle cx="570" cy="290" r="17" fill="none" stroke="#6d716f" stroke-width="1.2"/><circle cx="570" cy="290" r="4" fill="#18364a" stroke="#18364a" stroke-width="2"/><circle cx="532" cy="268" r="5" fill="#efede8" stroke="#6d716f" stroke-width="1.6"/><circle cx="603" cy="281" r="5" fill="#efede8" stroke="#6d716f" stroke-width="1.6"/><circle cx="559" cy="326" r="5" fill="#efede8" stroke="#6d716f" stroke-width="1.6"/><circle cx="594" cy="318" r="5" fill="#efede8" stroke="#6d716f" stroke-width="1.6"/><text x="570.0" y="366.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:10.5px">NEITHER</text><text x="570.0" y="382.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">no pattern, no accuracy</text><circle cx="775" cy="290" r="52" fill="none" stroke="#6d716f" stroke-width="1.2"/><circle cx="775" cy="290" r="34" fill="none" stroke="#6d716f" stroke-width="1.2"/><circle cx="775" cy="290" r="17" fill="none" stroke="#6d716f" stroke-width="1.2"/><circle cx="775" cy="290" r="4" fill="#18364a" stroke="#18364a" stroke-width="2"/><circle cx="768" cy="285" r="5" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><circle cx="777" cy="281" r="5" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><circle cx="781" cy="293" r="5" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><circle cx="772" cy="297" r="5" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="775.0" y="366.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">RELIABLE AND VALID</text><text x="775.0" y="382.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">the only one worth having</text><text x="460.0" y="432.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">a bathroom scale that reads ten pounds heavy every time is perfectly RELIABLE and completely INVALID</text><text x="460.0" y="454.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">reliability is NECESSARY for validity and never SUFFICIENT — a measure that cannot repeat itself cannot be right twice</text><rect x="40" y="502" width="840" height="198" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="530.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">Four reliabilities, four questions</text><rect x="60" y="550" width="200" height="134" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="160.0" y="572.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:9.5px">TEST-RETEST</text><text x="160.0" y="594.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">same test, same people,</text><text x="160.0" y="608.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">later</text><line x1="86" y1="630" x2="234" y2="630" stroke="#245574" stroke-width="1" stroke-dasharray="6 5"/><text x="160.0" y="650.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:8.5px">correlation</text><text x="160.0" y="664.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:8.5px">r &gt; 0.80</text><rect x="265" y="550" width="200" height="134" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="365.0" y="572.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:9.5px">INTER-RATER</text><text x="365.0" y="594.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">two observers,</text><text x="365.0" y="608.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">same event</text><line x1="291" y1="630" x2="439" y2="630" stroke="#a8324a" stroke-width="1" stroke-dasharray="6 5"/><text x="365.0" y="650.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:8.5px">Cohen&#x27;s kappa</text><text x="365.0" y="664.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:8.5px">or ICC</text><rect x="470" y="550" width="200" height="134" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="570.0" y="572.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:9.5px">INTERNAL CONSISTENCY</text><text x="570.0" y="594.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">do the items hang</text><text x="570.0" y="608.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">together?</text><line x1="496" y1="630" x2="644" y2="630" stroke="#5b7a64" stroke-width="1" stroke-dasharray="6 5"/><text x="570.0" y="650.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:8.5px">Cronbach&#x27;s alpha</text><text x="570.0" y="664.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:8.5px">≥ 0.70</text><rect x="675" y="550" width="200" height="134" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="775.0" y="572.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:9.5px">PARALLEL FORMS</text><text x="775.0" y="594.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">two versions of</text><text x="775.0" y="608.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">the same test</text><line x1="701" y1="630" x2="849" y2="630" stroke="#987740" stroke-width="1" stroke-dasharray="6 5"/><text x="775.0" y="650.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:8.5px">correlation between</text><text x="775.0" y="664.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:8.5px">the forms</text><rect x="40" y="716" width="840" height="268" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="744.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">What breaks the comparison from the inside</text><rect x="60" y="766" width="390" height="32" rx="6" fill="#e8ecef" stroke="#18364a" stroke-width="1.3"/><text x="160.0" y="787.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">HISTORY</text><text x="350.0" y="787.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">something happened outside the study</text><rect x="60" y="802" width="390" height="32" rx="6" fill="#e8ecef" stroke="#18364a" stroke-width="1.3"/><text x="160.0" y="823.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">MATURATION</text><text x="350.0" y="823.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">they changed on their own</text><rect x="60" y="838" width="390" height="32" rx="6" fill="#e8ecef" stroke="#18364a" stroke-width="1.3"/><text x="160.0" y="859.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">TESTING</text><text x="350.0" y="859.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">they got better at the test itself</text><rect x="60" y="874" width="390" height="32" rx="6" fill="#e8ecef" stroke="#18364a" stroke-width="1.3"/><text x="160.0" y="895.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">INSTRUMENTATION</text><text x="350.0" y="895.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">the ruler changed, not the thing</text><rect x="60" y="910" width="390" height="32" rx="6" fill="#e8ecef" stroke="#18364a" stroke-width="1.3"/><text x="160.0" y="931.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">REGRESSION TO THE MEAN</text><text x="350.0" y="931.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">extreme scorers drift back</text><rect x="60" y="946" width="390" height="32" rx="6" fill="#e8ecef" stroke="#18364a" stroke-width="1.3"/><text x="160.0" y="967.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">ATTRITION</text><text x="350.0" y="967.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">and worse, differential dropout</text><text x="665.0" y="766.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">AND BECAUSE THE CONTROL GROUP KNOWS</text><rect x="470" y="782" width="390" height="60" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="665.0" y="802.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:9.5px">DIFFUSION OF TREATMENT</text><text x="665.0" y="818.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">controls get hold of the treatment</text><text x="665.0" y="831.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">anyway, so the groups converge</text><rect x="470" y="848" width="390" height="60" rx="7" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="665.0" y="868.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:9.5px">COMPENSATORY RIVALRY</text><text x="665.0" y="884.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">controls try harder because they</text><text x="665.0" y="897.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">know what they were denied</text><rect x="470" y="914" width="390" height="60" rx="7" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="665.0" y="934.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:9.5px">RESENTFUL DEMORALIZATION</text><text x="665.0" y="950.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">or give up for the same reason,</text><text x="665.0" y="963.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">flattering the treatment group</text></svg>