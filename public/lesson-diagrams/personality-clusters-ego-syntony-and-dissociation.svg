<svg xmlns="http://www.w3.org/2000/svg" width="920" height="962" viewBox="0 0 920 962" role="img" aria-labelledby="t d"><title id="t">Ten personality disorders, and one question that sorts them</title><desc id="d">Top: the three clusters, with the signature feature that identifies each disorder in a vignette, and the pairs the exam deliberately confuses. Avoidant and schizoid both end up alone; only one of them wants company. Obsessive-compulsive personality disorder and obsessive-compulsive disorder share a name and almost nothing else. Bottom left: ego-syntonic against ego-dystonic, the distinction that explains who walks into a clinic voluntarily and who is brought in. Bottom right: the dissociation continuum, from ordinary daydreaming to dissociative identity disorder, with the point where reality testing is still intact marked, because that is what separates these disorders from psychosis.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="962" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Ten personality disorders, and one question that sorts them</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Does the trait feel right to the person, or wrong? That is where to start</text><rect x="40" y="180" width="840" height="300" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">Three clusters · weird, wild, worried</text><rect x="68" y="228" width="262" height="234" rx="10" fill="none" stroke="#245574" stroke-width="2"/><text x="199.0" y="252.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">A · ODD</text><text x="199.0" y="270.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">weird</text><rect x="82" y="282" width="234" height="38" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.4"/><text x="199.0" y="298.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">PARANOID</text><text x="199.0" y="312.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">reads malice into harmless remarks</text><rect x="82" y="325" width="234" height="38" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.4"/><text x="199.0" y="341.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">SCHIZOID</text><text x="199.0" y="355.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">does not want company at all</text><rect x="82" y="368" width="234" height="51" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.4"/><text x="199.0" y="384.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">SCHIZOTYPAL</text><text x="199.0" y="398.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">magical thinking, odd speech;</text><text x="199.0" y="410.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">runs in schizophrenia families</text><rect x="344" y="228" width="262" height="234" rx="10" fill="none" stroke="#a8324a" stroke-width="2"/><text x="475.0" y="252.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">B · DRAMATIC</text><text x="475.0" y="270.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">wild</text><rect x="358" y="282" width="234" height="51" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.4"/><text x="475.0" y="298.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">ANTISOCIAL</text><text x="475.0" y="312.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">violates rights; conduct disorder</text><text x="475.0" y="324.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">before 15, diagnosed at 18+</text><rect x="358" y="338" width="234" height="38" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.4"/><text x="475.0" y="354.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">BORDERLINE</text><text x="475.0" y="368.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">splitting, abandonment, self-harm</text><rect x="358" y="381" width="234" height="38" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.4"/><text x="475.0" y="397.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">HISTRIONIC</text><text x="475.0" y="411.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">must be the centre of attention</text><rect x="358" y="424" width="234" height="38" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.4"/><text x="475.0" y="440.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">NARCISSISTIC</text><text x="475.0" y="454.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">grandiose, entitled, no empathy</text><rect x="620" y="228" width="262" height="234" rx="10" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="751.0" y="252.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">C · ANXIOUS</text><text x="751.0" y="270.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">worried</text><rect x="634" y="282" width="234" height="38" rx="7" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.4"/><text x="751.0" y="298.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">AVOIDANT</text><text x="751.0" y="312.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">wants company, fears rejection</text><rect x="634" y="325" width="234" height="38" rx="7" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.4"/><text x="751.0" y="341.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">DEPENDENT</text><text x="751.0" y="355.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">needs others to decide for them</text><rect x="634" y="368" width="234" height="51" rx="7" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.4"/><text x="751.0" y="384.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">OCPD</text><text x="751.0" y="398.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">perfectionism and control;</text><text x="751.0" y="410.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">feels right to them</text><rect x="40" y="496" width="410" height="444" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="245.0" y="524.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">The question to ask first</text><rect x="64" y="548" width="362" height="170" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="245.0" y="574.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">EGO-SYNTONIC</text><text x="245.0" y="594.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">“this is simply who I am”</text><text x="245.0" y="618.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">the trait fits the self-image and causes</text><text x="245.0" y="636.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">the person no distress of its own</text><text x="245.0" y="654.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">→ all ten personality disorders, and OCPD</text><text x="245.0" y="672.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">→ brought in by someone else, if at all</text><text x="245.0" y="690.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">→ low motivation, hard to treat</text><rect x="64" y="732" width="362" height="170" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="245.0" y="758.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">EGO-DYSTONIC</text><text x="245.0" y="778.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">“this is not me, and I want it gone”</text><text x="245.0" y="802.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">the symptom feels alien and unwanted,</text><text x="245.0" y="820.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">and the distress is about the symptom itself</text><text x="245.0" y="838.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">→ OCD obsessions, depression, panic</text><text x="245.0" y="856.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">→ walks into the clinic on their own</text><text x="245.0" y="874.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">→ motivation is already there</text><text x="245.0" y="924.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:11px">OCPD and OCD share a name, not a mechanism</text><rect x="470" y="496" width="410" height="444" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="675.0" y="524.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">The dissociation continuum</text><rect x="494" y="548" width="362" height="44" rx="8" fill="#efede8" stroke="#6d716f" stroke-width="1.6"/><text x="675.0" y="566.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:10.5px">DAYDREAMING, HIGHWAY HYPNOSIS</text><text x="675.0" y="581.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">normal; most people, most weeks</text><rect x="494" y="600" width="362" height="58" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.6"/><text x="675.0" y="618.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">DEPERSONALIZATION / DEREALIZATION</text><text x="675.0" y="633.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">detached from self or surroundings;</text><text x="675.0" y="647.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">reality testing INTACT — not psychosis</text><rect x="494" y="666" width="362" height="58" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.6"/><text x="675.0" y="684.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10.5px">DISSOCIATIVE AMNESIA</text><text x="675.0" y="699.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">cannot recall personal history;</text><text x="675.0" y="713.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">new memories still form normally</text><rect x="494" y="732" width="362" height="58" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.6"/><text x="675.0" y="750.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10.5px">… with FUGUE</text><text x="675.0" y="765.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">travel or wandering, sometimes a new</text><text x="675.0" y="779.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">identity; a specifier, not its own diagnosis</text><rect x="494" y="798" width="362" height="58" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><text x="675.0" y="816.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">DISSOCIATIVE IDENTITY DISORDER</text><text x="675.0" y="831.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">two or more identity states with</text><text x="675.0" y="845.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">amnesia between them</text><text x="675.0" y="912.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">severity rises; what is lost is integration —</text><text x="675.0" y="930.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">of memory, identity, perception and sense of self</text></svg>