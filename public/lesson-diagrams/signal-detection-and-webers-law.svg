0.5 389.9 L404.0 388.5 L407.5 387.0 L411.0 385.3 L414.5 383.4 L418.0 381.5 L421.5 379.3 L425.0 377.0 L428.5 374.6 L432.0 372.0 L435.5 369.2 L439.0 366.2 L442.5 363.1 L446.0 359.8 L449.5 356.3 L453.0 352.7 L456.5 349.0 L460.0 345.0 L463.5 341.0 L467.0 336.8 L470.5 332.5 L474.0 328.1 L477.5 323.6 L481.0 319.1 L484.5 314.5 L488.0 309.9 L491.5 305.3 L495.0 300.8 L498.5 296.2 L502.0 291.8 L505.5 287.4 L509.0 283.2 L512.5 279.1 L516.0 275.2 L519.5 271.5 L523.0 268.0 L526.5 264.8 L530.0 261.9 L533.5 259.2 L537.0 256.9 L540.5 254.9 L544.0 253.2 L547.5 251.9 L551.0 251.0 L554.5 250.4 L558.0 250.2 L561.5 250.4 L565.0 251.0 L568.5 251.9 L572.0 253.2 L575.5 254.9 L579.0 256.9 L582.5 259.2 L586.0 261.9 L589.5 264.8 L593.0 268.0 L596.5 271.5 L600.0 275.2 L603.5 279.1 L607.0 283.2 L610.5 287.4 L614.0 291.8 L617.5 296.2 L621.0 300.8 L624.5 305.3 L628.0 309.9 L631.5 314.5 L635.0 319.1 L638.5 323.6 L642.0 328.1 L645.5 332.5 L649.0 336.8 L652.5 341.0 L656.0 345.0 L659.5 349.0 L663.0 352.7 L666.5 356.3 L670.0 359.8 L673.5 363.1 L677.0 366.2 L680.5 369.2 L684.0 372.0 L687.5 374.6 L691.0 377.0 L694.5 379.3 L698.0 381.5 L701.5 383.4 L705.0 385.3 L708.5 387.0 L712.0 388.5 L715.5 389.9 L719.0 391.2 L722.5 392.4 L726.0 393.5 L729.5 394.5 L733.0 395.3 L736.5 396.1 L740.0 396.8 L743.5 397.5 L747.0 398.0 L750.5 398.5 L754.0 399.0 L757.5 399.4 L761.0 399.7 L764.5 400.0 L768.0 400.3 L771.5 400.6 L775.0 400.8 L778.5 400.9 L782.0 401.1 L785.5 401.2 L789.0 401.3 L792.5 401.4 L796.0 401.5 L799.5 401.6 L803.0 401.7 L806.5 401.7 L810.0 401.8" stroke="#5b7a64" stroke-width="2.8" fill="none"/><text x="362.0" y="244.1" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:12px">NOISE alone</text><text x="558.0" y="244.1" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">SIGNAL + NOISE</text><line x1="362.0" y1="338.25" x2="558.0" y2="338.25" stroke="#245574" stroke-width="2" marker-end="url(#m8232)"/><text x="460.0" y="328.2" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">d′ = the distance between the peaks</text><line x1="495.00000000000006" y1="402.0" x2="495.00000000000006" y2="250.21428571428572" stroke="#a8324a" stroke-width="2.4"/><text x="485.0" y="266.2" class="" text-anchor="end" style="fill:#a8324a;font-weight:bold;font-size:12px">criterion →</text><text x="240.0" y="424.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">← move it left: LIBERAL</text><text x="240.0" y="444.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">more hits AND more false alarms</text><text x="700.0" y="424.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">move it right: CONSERVATIVE →</text><text x="700.0" y="444.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">fewer false alarms AND fewer hits</text><text x="460.0" y="478.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">payoffs, expectations and base rates move the line — they never change d′</text><rect x="40" y="512" width="420" height="376" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="250.0" y="540.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">The four outcomes</text><text x="196.0" y="580.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:11px">signal PRESENT</text><text x="346.0" y="580.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:11px">signal ABSENT</text><text x="96.0" y="626.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:11px">said</text><text x="96.0" y="642.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:11px">&quot;yes&quot;</text><text x="96.0" y="736.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:11px">said</text><text x="96.0" y="752.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:11px">&quot;no&quot;</text><rect x="134" y="592" width="142" height="96" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="205.0" y="632.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">HIT</text><text x="205.0" y="654.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">sensitivity</text><text x="205.0" y="668.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">in clinic</text><rect x="284" y="592" width="142" height="96" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="355.0" y="632.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">FALSE ALARM</text><text x="355.0" y="654.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">costs: the unnecessary biopsy</text><rect x="134" y="702" width="142" height="96" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="205.0" y="742.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">MISS</text><text x="205.0" y="764.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">the cancer sent home</text><rect x="284" y="702" width="142" height="96" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="355.0" y="742.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">CORRECT REJECTION</text><text x="355.0" y="764.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">specificity</text><text x="355.0" y="778.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">in clinic</text><text x="250.0" y="830.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">hit rate and false alarm rate are the two numbers</text><text x="250.0" y="848.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">you need; d′ = z(hit) − z(false alarm)</text><text x="250.0" y="872.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:11px">high hits AND high false alarms = liberal, not sharp</text><rect x="480" y="512" width="400" height="376" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="680.0" y="540.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">Weber&#x27;s law is a proportion</text><rect x="512" y="560" width="336" height="72" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="680.0" y="594.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:22px">ΔI / I = k</text><text x="680.0" y="618.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">the change you can just detect, over what you started with</text><text x="680.0" y="660.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">smaller k = finer discrimination</text><text x="596.0" y="695.0" class="" text-anchor="end" style="fill:#18364a;font-size:11px">heaviness</text><rect x="608" y="686" width="36.0" height="13" rx="3" fill="#f1eadc" stroke="#987740" stroke-width="1.4"/><text x="652.0" y="695.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10px">2%</text><text x="596.0" y="719.0" class="" text-anchor="end" style="fill:#18364a;font-size:11px">brightness</text><rect x="608" y="710" width="36.0" height="13" rx="3" fill="#f1eadc" stroke="#987740" stroke-width="1.4"/><text x="652.0" y="719.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10px">2%</text><text x="596.0" y="743.0" class="" text-anchor="end" style="fill:#18364a;font-size:11px">smell</text><rect x="608" y="734" width="108.0" height="13" rx="3" fill="#f1eadc" stroke="#987740" stroke-width="1.4"/><text x="724.0" y="743.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10px">6%</text><text x="596.0" y="767.0" class="" text-anchor="end" style="fill:#18364a;font-size:11px">pain</text><rect x="608" y="758" width="126.00000000000001" height="13" rx="3" fill="#f1eadc" stroke="#987740" stroke-width="1.4"/><text x="742.0" y="767.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10px">7%</text><text x="596.0" y="791.0" class="" text-anchor="end" style="fill:#18364a;font-size:11px">salt taste</text><rect x="608" y="782" width="144.0" height="13" rx="3" fill="#f1eadc" stroke="#987740" stroke-width="1.4"/><text x="760.0" y="791.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10px">8%</text><text x="596.0" y="815.0" class="" text-anchor="end" style="fill:#18364a;font-size:11px">loudness</text><rect x="608" y="806" width="180.0" height="13" rx="3" fill="#f1eadc" stroke="#987740" stroke-width="1.4"/><text x="796.0" y="815.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10px">10%</text><text x="680.0" y="848.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">100 g → 2 g JND means 500 g → 10 g JND</text><text x="680.0" y="868.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">the same proportion, never the same amount</text></svg>