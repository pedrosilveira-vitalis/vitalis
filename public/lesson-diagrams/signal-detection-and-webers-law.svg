<svg xmlns="http://www.w3.org/2000/svg" width="920" height="916" viewBox="0 0 920 916" role="img" aria-labelledby="t d"><title id="t">Two distributions, one movable line</title><desc id="d">Top: the whole of signal detection theory in one picture. Noise alone produces some internal activation; a signal adds to it. The two bell curves overlap, and the observer has to place a line somewhere and say yes above it. The distance between the peaks is d′, the sensitivity, and it is fixed by the stimulus and the senses. The line is the criterion, and it is set by payoffs, expectations and base rates. Move the line left and hits and false alarms both rise together; that is a liberal criterion, not better eyesight. Bottom left: the four outcomes those two things produce, with their clinical names. Bottom right: Weber&#x27;s law, where the just noticeable difference is a fixed proportion of what you started with, so the smaller the Weber fraction the finer the discrimination.</desc><defs><marker id="m8232" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="916" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Two distributions, one movable line</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Every detection question asks the same thing: did sensitivity change, or did the criterion move?</text><rect x="40" y="176" width="840" height="318" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="204.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">Sensitivity is the gap; bias is the line</text><line x1="110" y1="402" x2="810" y2="402" stroke="#18364a" stroke-width="2"/><line x1="110" y1="232" x2="110" y2="402" stroke="#18364a" stroke-width="2"/><text x="460.0" y="446.0" class="" text-anchor="middle" style="font-size:17px"></text><text x="66" y="317.0" text-anchor="middle" transform="rotate(-90 66 317.0)" style="font-size:17px">internal activation</text><path d="M110.0 401.8 L113.5 401.7 L117.0 401.7 L120.5 401.6 L124.0 401.5 L127.5 401.4 L131.0 401.3 L134.5 401.2 L138.0 401.1 L141.5 400.9 L145.0 400.8 L148.5 400.6 L152.0 400.3 L155.5 400.0 L159.0 399.7 L162.5 399.4 L166.0 399.0 L169.5 398.5 L173.0 398.0 L176.5 397.5 L180.0 396.8 L183.5 396.1 L187.0 395.3 L190.5 394.5 L194.0 393.5 L197.5 392.4 L201.0 391.2 L204.5 389.9 L208.0 388.5 L211.5 387.0 L215.0 385.3 L218.5 383.4 L222.0 381.5 L225.5 379.3 L229.0 377.0 L232.5 374.6 L236.0 372.0 L239.5 369.2 L243.0 366.2 L246.5 363.1 L250.0 359.8 L253.5 356.3 L257.0 352.7 L260.5 349.0 L264.0 345.0 L267.5 341.0 L271.0 336.8 L274.5 332.5 L278.0 328.1 L281.5 323.6 L285.0 319.1 L288.5 314.5 L292.0 309.9 L295.5 305.3 L299.0 300.8 L302.5 296.2 L306.0 291.8 L309.5 287.4 L313.0 283.2 L316.5 279.1 L320.0 275.2 L323.5 271.5 L327.0 268.0 L330.5 264.8 L334.0 261.9 L337.5 259.2 L341.0 256.9 L344.5 254.9 L348.0 253.2 L351.5 251.9 L355.0 251.0 L358.5 250.4 L362.0 250.2 L365.5 250.4 L369.0 251.0 L372.5 251.9 L376.0 253.2 L379.5 254.9 L383.0 256.9 L386.5 259.2 L390.0 261.9 L393.5 264.8 L397.0 268.0 L400.5 271.5 L404.0 275.2 L407.5 279.1 L411.0 283.2 L414.5 287.4 L418.0 291.8 L421.5 296.2 L425.0 300.8 L428.5 305.3 L432.0 309.9 L435.5 314.5 L439.0 319.1 L442.5 323.6 L446.0 328.1 L449.5 332.5 L453.0 336.8 L456.5 341.0 L460.0 345.0 L463.5 349.0 L467.0 352.7 L470.5 356.3 L474.0 359.8 L477.5 363.1 L481.0 366.2 L484.5 369.2 L488.0 372.0 L491.5 374.6 L495.0 377.0 L498.5 379.3 L502.0 381.5 L505.5 383.4 L509.0 385.3 L512.5 387.0 L516.0 388.5 L519.5 389.9 L523.0 391.2 L526.5 392.4 L530.0 393.5 L533.5 394.5 L537.0 395.3 L540.5 396.1 L544.0 396.8 L547.5 397.5 L551.0 398.0 L554.5 398.5 L558.0 399.0 L561.5 399.4 L565.0 399.7 L568.5 400.0 L572.0 400.3 L575.5 400.6 L579.0 400.8