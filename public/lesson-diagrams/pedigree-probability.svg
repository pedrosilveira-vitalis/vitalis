<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800" role="img" aria-labelledby="title desc"><title id="title">Pedigree probabilities depend on what is known</title><desc id="desc">Two autosomal recessive carriers have AA, Aa, Aa and aa possible offspring genotypes. Among the unaffected possibilities, two of three are carriers. A separate known X-linked carrier has affected-son probability one quarter per pregnancy.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a;font-size:18px}.h{font-size:27px;font-weight:700}.sub{font-size:22px;font-weight:700}.small{font-size:16px}</style><rect width="900" height="800" fill="#fbf7ef" rx="20"/><text x="35" y="48" class="h" text-anchor="start">What is the question conditioning on?</text><text x="35" y="94" class="sub" text-anchor="start">Autosomal recessive model: Aa × Aa</text><rect x="290" y="125" width="50" height="50" rx="0" fill="#fff" stroke="#245574" stroke-width="2"/><circle cx="550" cy="150" r="25" fill="white" stroke="#245574" stroke-width="2"/><path d="M340 150 H525 M432 150 V215 M130 215 H760" stroke="#245574" stroke-width="3" fill="none" stroke-dasharray=""/><text x="315" y="112" class="" text-anchor="middle">Aa</text><text x="550" y="112" class="" text-anchor="middle">Aa</text><path d="M130 215 V260" stroke="#245574" stroke-width="3" fill="none" stroke-dasharray=""/><rect x="105" y="260" width="50" height="50" rx="0" fill="#fff" stroke="#245574" stroke-width="2"/><text x="130" y="345" class="sub" text-anchor="middle">AA</text><text x="130" y="375" class="small" text-anchor="middle">Unaffected</text><path d="M340 215 V260" stroke="#245574" stroke-width="3" fill="none" stroke-dasharray=""/><rect x="315" y="260" width="50" height="50" rx="0" fill="#fff" stroke="#245574" stroke-width="2"/><text x="340" y="345" class="sub" text-anchor="middle">Aa</text><text x="340" y="375" class="small" text-anchor="middle">Unaffected</text><path d="M550 215 V260" stroke="#245574" stroke-width="3" fill="none" stroke-dasharray=""/><rect x="525" y="260" width="50" height="50" rx="0" fill="#fff" stroke="#245574" stroke-width="2"/><text x="550" y="345" class="sub" text-anchor="middle">Aa</text><text x="550" y="375" class="small" text-anchor="middle">Unaffected</text><path d="M760 215 V260" stroke="#245574" stroke-width="3" fill="none" stroke-dasharray=""/><rect x="735" y="260" width="50" height="50" rx="0" fill="#245574" stroke="#245574" stroke-width="2"/><text x="760" y="345" class="sub" text-anchor="middle">aa</text><text x="760" y="375" class="small" text-anchor="middle">Affected</text><text x="35" y="422" class="small" text-anchor="start">Schematic offspring possibilities—not four required children.</text><rect x="35" y="450" width="830" height="90" rx="10" fill="#eaf0f4" stroke="#245574" stroke-width="2"/><text x="60" y="486" class="sub" text-anchor="start">Given unaffected: keep AA, Aa and Aa.</text><text x="60" y="518" class="sub" text-anchor="start">P(carrier | unaffected) = 2 / 3</text><text x="35" y="589" class="sub" text-anchor="start">A different question: X-linked recessive inheritance</text><text x="35" y="626" class="small" text-anchor="start">Known carrier mother × unaffected father; assume equal sex probabilities.</text><rect x="35" y="650" width="390" height="90" rx="10" fill="#fff" stroke="#245574" stroke-width="2"/><rect x="455" y="650" width="410" height="90" rx="10" fill="#fff" stroke="#245574" stroke-width="2"/><text x="230" y="686" class="" text-anchor="middle">Given that the child is a son</text><text x="230" y="720" class="sub" text-anchor="middle">P(affected | son) = ½</text><text x="660" y="686" class="" text-anchor="middle">Next child is an affected son</text><text x="660" y="720" class="sub" text-anchor="middle">½ × ½ = ¼</text><text x="35" y="778" class="small" text-anchor="start">These calculations assume the stated inheritance model and full penetrance.</text></svg>