<svg xmlns="http://www.w3.org/2000/svg" width="920" height="846" viewBox="0 0 920 846" role="img" aria-labelledby="t d"><title id="t">Learning is a lasting change that experience produced</title><desc id="d">Top: the definition broken into its three tests, with examples of what each one excludes — a deepening voice is maturation, tiredness is a temporary state, and a surgeon who has only read the textbook has learned even though nothing is visible yet. Middle left: the ladder of learning types, from the non-associative pair habituation and sensitisation, through the two associative kinds, to observational and insight learning, with innate behaviour marked off below as not learning at all. Middle right: the four theoretical frameworks side by side with their central claim, their key names and the finding each struggles with. Bottom: the brain structures, with the hippocampus for new declarative memory, the amygdala for fear conditioning, the cerebellum for conditioned motor responses and the basal ganglia for habits, and the Hebbian rule underneath.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="846" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Learning is a lasting change that experience produced</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Not maturation, not fatigue, not a drug — and it need not show up in behaviour straight away</text><rect x="40" y="136" width="840" height="150" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="164.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">&quot;A relatively permanent change in behaviour, or in the capacity for it, from experience&quot;</text><rect x="70" y="192" width="256" height="76" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="198.0" y="214.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">relatively permanent</text><text x="198.0" y="238.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">so not fatigue,</text><text x="198.0" y="256.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">a drug, or adaptation</text><rect x="340" y="192" width="256" height="76" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="468.0" y="214.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">behaviour OR capacity</text><text x="468.0" y="238.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">so it counts even if</text><text x="468.0" y="256.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">nothing is acted out yet</text><rect x="610" y="192" width="256" height="76" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="738.0" y="214.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">from experience</text><text x="738.0" y="238.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">so not maturation:</text><text x="738.0" y="256.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">a voice deepening is not learning</text><rect x="40" y="302" width="404" height="318" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="242.0" y="330.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">What counts as learning</text><text x="70.0" y="348.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:13px">non-associative</text><text x="84.0" y="366.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">habituation — less response to</text><text x="84.0" y="381.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">a harmless repeated stimulus</text><text x="84.0" y="404.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">sensitisation — more response</text><text x="84.0" y="419.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">after something noxious</text><text x="70.0" y="442.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:13px">associative</text><text x="84.0" y="460.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">classical: stimulus with stimulus</text><text x="84.0" y="475.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">operant: behaviour with consequence</text><text x="70.0" y="498.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:13px">cognitive / social</text><text x="84.0" y="516.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">observational learning, modelling,</text><text x="84.0" y="531.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">latent learning, insight</text><rect x="62" y="548" width="360" height="58" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="242.0" y="570.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">NOT learning: reflexes, fixed action patterns</text><text x="242.0" y="584.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">— these come built in, not from experience</text><rect x="466" y="302" width="414" height="318" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="673.0" y="330.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">Four frameworks, four blind spots</text><text x="492.0" y="356.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:14px">Behaviourism</text><text x="492.0" y="374.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">S–R bonds and reinforcement</text><text x="492.0" y="391.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">Watson, Skinner, Pavlov  •  stuck on latent learning</text><text x="492.0" y="418.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:14px">Cognitive</text><text x="492.0" y="436.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">mental maps and expectancies</text><text x="492.0" y="453.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">Tolman  •  harder to operationalise</text><text x="492.0" y="480.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:14px">Biological</text><text x="492.0" y="498.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">evolution constrains what is learnable</text><text x="492.0" y="515.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">Lorenz, Tinbergen, Seligman  •  underrates flexibility</text><text x="492.0" y="542.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:14px">Social learning</text><text x="492.0" y="560.0" class="" text-anchor="start" style="fill:#18364a;font-size:12px">watching others is enough</text><text x="492.0" y="577.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">Bandura  •  underrates biology</text><rect x="40" y="636" width="840" height="190" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="664.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">Different kinds of learning, different structures</text><rect x="70" y="684" width="192" height="64" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="166.0" y="708.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">hippocampus</text><text x="166.0" y="732.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">new declarative memories</text><rect x="270" y="684" width="192" height="64" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="366.0" y="708.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">amygdala</text><text x="366.0" y="732.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">fear conditioning</text><rect x="470" y="684" width="192" height="64" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="566.0" y="708.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">cerebellum</text><text x="566.0" y="732.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">conditioned motor responses</text><rect x="670" y="684" width="192" height="64" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="766.0" y="708.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">basal ganglia</text><text x="766.0" y="732.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">habits and skills</text><text x="460.0" y="778.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">H.M. lost the first and kept the rest — which is how we know they are separate systems</text><text x="460.0" y="808.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">Underneath all of it: neurons that fire together wire together (LTP at the synapse)</text></svg>