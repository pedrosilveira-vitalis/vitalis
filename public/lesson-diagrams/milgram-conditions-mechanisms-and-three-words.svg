<svg xmlns="http://www.w3.org/2000/svg" width="920" height="884" viewBox="0 0 920 884" role="img" aria-labelledby="t d"><title id="t">What Milgram actually varied, and which way it moved</title><desc id="d">Top: the obedience rate across Milgram&#x27;s conditions, drawn against the baseline of 65 per cent that came from the original study. The two proximity series are the ones to keep straight, because they move in opposite directions: putting the victim closer lowers obedience, putting the authority further away also lowers it. Everything else on the chart is a variation on legitimacy or on social support. Bottom left: the four mechanisms that hold a reluctant person in place. Bottom right: the three words that are constantly confused, separated by where the pressure comes from and whether anything was actually asked.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="884" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">What Milgram actually varied, and which way it moved</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Distance from the victim and distance from the authority push in opposite directions</text><rect x="40" y="180" width="840" height="400" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">Obedience by condition (% reaching 450 volts)</text><text x="316.0" y="251.0" class="" text-anchor="end" style="fill:#18364a;font-size:10px">BASELINE · Yale, learner unseen</text><rect x="330" y="236" width="481.0" height="22" rx="4" fill="#efede8" stroke="#6d716f" stroke-width="1.6"/><text x="821.0" y="252.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:bold;font-size:11px">65.0%</text><text x="316.0" y="281.0" class="" text-anchor="end" style="fill:#18364a;font-size:10px">voice feedback through the wall</text><rect x="330" y="266" width="462.5" height="22" rx="4" fill="#efede8" stroke="#6d716f" stroke-width="1.6"/><text x="802.5" y="282.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:bold;font-size:11px">62.5%</text><text x="316.0" y="311.0" class="" text-anchor="end" style="fill:#18364a;font-size:10px">learner in the SAME ROOM</text><rect x="330" y="296" width="296.0" height="22" rx="4" fill="#e4edf3" stroke="#245574" stroke-width="1.6"/><text x="636.0" y="312.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:11px">40.0%</text><text x="316.0" y="341.0" class="" text-anchor="end" style="fill:#18364a;font-size:10px">hand forced onto the shock plate</text><rect x="330" y="326" width="222.0" height="22" rx="4" fill="#e4edf3" stroke="#245574" stroke-width="1.6"/><text x="562.0" y="342.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:11px">30.0%</text><text x="316.0" y="371.0" class="" text-anchor="end" style="fill:#18364a;font-size:10px">moved to a run-down office</text><rect x="330" y="356" width="351.5" height="22" rx="4" fill="#f1eadc" stroke="#987740" stroke-width="1.6"/><text x="691.5" y="372.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:11px">47.5%</text><text x="316.0" y="401.0" class="" text-anchor="end" style="fill:#18364a;font-size:10px">orders given by TELEPHONE</text><rect x="330" y="386" width="151.70000000000002" height="22" rx="4" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><text x="491.7" y="402.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:11px">20.5%</text><text x="316.0" y="431.0" class="" text-anchor="end" style="fill:#18364a;font-size:10px">an ordinary man gives the orders</text><rect x="330" y="416" width="148.0" height="22" rx="4" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><text x="488.0" y="432.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:11px">20.0%</text><text x="316.0" y="461.0" class="" text-anchor="end" style="fill:#18364a;font-size:10px">two peers REFUSE and walk out</text><rect x="330" y="446" width="74.0" height="22" rx="4" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="414.0" y="462.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:11px">10.0%</text><line x1="330" y1="230" x2="330" y2="472" stroke="#6d716f" stroke-width="1.4"/><text x="460.0" y="522.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11.5px">VICTIM closer → obedience falls.  AUTHORITY further away → obedience falls.</text><text x="460.0" y="544.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">and all 40 of the original participants went to at least 300 volts before anyone stopped</text><text x="460.0" y="564.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">psychiatrists asked beforehand predicted that barely one in a hundred would reach 450</text><rect x="40" y="596" width="410" height="266" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="245.0" y="624.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">What holds them in the chair</text><rect x="64" y="644" width="362" height="40" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><text x="245.0" y="661.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">AGENTIC STATE</text><text x="245.0" y="675.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">“I am not doing this — I am carrying it out”</text><rect x="64" y="691" width="362" height="40" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.6"/><text x="245.0" y="708.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10.5px">DIFFUSED RESPONSIBILITY</text><text x="245.0" y="722.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">the scientist is accountable, not me</text><rect x="64" y="738" width="362" height="52" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.6"/><text x="245.0" y="755.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">INCREMENTAL COMMITMENT</text><text x="245.0" y="769.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">15 volts at a time; stopping now admits</text><text x="245.0" y="782.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">the last nineteen were wrong</text><rect x="64" y="797" width="362" height="52" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="245.0" y="814.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">BINDING FACTORS</text><text x="245.0" y="828.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">politeness, momentum, and no script</text><text x="245.0" y="841.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">for how to walk out</text><rect x="470" y="596" width="410" height="266" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="675.0" y="624.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">Three words, kept apart</text><rect x="494" y="646" width="362" height="58" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="675.0" y="666.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">OBEDIENCE</text><text x="675.0" y="682.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">an ORDER, from someone ABOVE you</text><text x="675.0" y="697.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">Milgram</text><rect x="494" y="710" width="362" height="58" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="675.0" y="730.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">COMPLIANCE</text><text x="675.0" y="746.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">a REQUEST, from anyone at all</text><text x="675.0" y="761.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">foot-in-the-door</text><rect x="494" y="774" width="362" height="58" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="675.0" y="794.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">CONFORMITY</text><text x="675.0" y="810.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">NO request — just what others are doing</text><text x="675.0" y="825.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">Asch</text><text x="675.0" y="852.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">none of them requires believing it — that would be internalisation</text></svg>