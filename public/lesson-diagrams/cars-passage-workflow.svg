<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Working a CARS passage in about ten minutes</title><desc id="d">A time bar splits the ten minutes into about four minutes of reading and about six minutes of questions. Six numbered steps run across the reading half: a 15-second preview of the title and first sentence; read paragraph one carefully to find the thesis; read body paragraphs analytically, adding a 3-to-5-word function note after each; read counterarguments and qualifications critically; read the final paragraph carefully for the refined thesis; and take a 15-second review to state the main argument in one sentence. Below, two columns: annotate the thesis, each paragraph&#x27;s function, tone words, transition words, and spots where you lost the thread; do not annotate names, dates, statistics or examples, and do not write full sentences. A closing strip maps the habits to question types: main idea, tone, function, inference, strengthen and weaken.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="620" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Working a CARS passage in about ten minutes</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">The CARS section is 53 questions across 9 passage sets in 90 minutes — roughly 10 minutes each.</text><rect x="50" y="112" width="378.0" height="40" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><rect x="428.0" y="112" width="522.0" height="40" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="239.0" y="138.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:15px">READING  ~4 min</text><text x="689.0" y="138.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:15px">QUESTIONS  ~6 min</text><text x="50.0" y="176.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12px">0 min</text><text x="428.0" y="176.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">~4 min</text><text x="950.0" y="176.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:12px">~10 min</text><rect x="50" y="206" width="290" height="88" rx="12" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="195.0" y="236.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:700;font-size:15px">1 Preview</text><text x="195.0" y="259.0" class="" text-anchor="middle" style="font-size:13px">15 s: title, first and last sentence</text><rect x="360" y="206" width="290" height="88" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="505.0" y="236.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:15px">2 First ¶</text><text x="505.0" y="259.0" class="" text-anchor="middle" style="font-size:13px">carefully — find the thesis and mark it</text><rect x="670" y="206" width="290" height="88" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="815.0" y="236.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:15px">3 Body ¶s</text><text x="815.0" y="259.0" class="" text-anchor="middle" style="font-size:13px">a 3–5 word note on what each one does</text><rect x="50" y="310" width="290" height="88" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="195.0" y="340.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:15px">4 Counterarguments</text><text x="195.0" y="363.0" class="" text-anchor="middle" style="font-size:13px">critically — does the author agree?</text><rect x="360" y="310" width="290" height="88" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="505.0" y="340.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:15px">5 Final ¶</text><text x="505.0" y="363.0" class="" text-anchor="middle" style="font-size:13px">carefully — the thesis, refined</text><rect x="670" y="310" width="290" height="88" rx="12" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="815.0" y="340.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:700;font-size:15px">6 Review</text><text x="815.0" y="363.0" class="" text-anchor="middle" style="font-size:13px">15 s: the argument in one sentence</text><rect x="50" y="424" width="430" height="112" rx="12" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="265.0" y="454.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:15px">Annotate — lean and fast</text><text x="265.0" y="477.0" class="" text-anchor="middle" style="font-size:13px">the thesis · what each ¶ does · tone words (merely, remarkably)</text><text x="265.0" y="495.0" class="" text-anchor="middle" style="font-size:13px">· transitions (however, therefore) · a &quot;?&quot; where you lost the</text><text x="265.0" y="513.0" class="" text-anchor="middle" style="font-size:13px">thread</text><rect x="520" y="424" width="430" height="112" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="735.0" y="454.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:15px">Don&#x27;t annotate</text><text x="735.0" y="477.0" class="" text-anchor="middle" style="font-size:13px">names, dates, statistics, examples — questions ask why they are</text><text x="735.0" y="495.0" class="" text-anchor="middle" style="font-size:13px">there, not what they were · full sentences: that is</text><text x="735.0" y="513.0" class="" text-anchor="middle" style="font-size:13px">summarizing, and it costs question time</text><rect x="50" y="552" width="900" height="54" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="500.0" y="582.0" class="" text-anchor="middle" style="font-size:13px">Main idea ← the thesis you marked. Tone ← the evaluative words. Function ← your paragraph notes. Inference,</text><text x="500.0" y="600.0" class="" text-anchor="middle" style="font-size:13px">strengthen/weaken ← the assumptions you questioned while reading.</text></svg>