<svg xmlns="http://www.w3.org/2000/svg" width="920" height="906" viewBox="0 0 920 906" role="img" aria-labelledby="t d"><title id="t">Where the lesion is, and what the patient loses</title><desc id="d">The visual pathway, drawn from above, with the five lesion sites the exam uses and the field defect each one produces. Before the chiasm a lesion takes one eye. At the chiasm it takes the crossing nasal fibres, which carry the two outer fields, so both temporal fields go — bitemporal hemianopia, classically from a pituitary adenoma pressing up on the chiasm from below. Behind the chiasm every lesion is homonymous and contralateral, because from there on each side carries the opposite half of the world. Meyer&#x27;s loop swings through the temporal lobe carrying the lower radiation, so a temporal lesion costs the upper quadrant; the parietal radiation costs the lower one. At the occipital pole the macula is often spared, since it sits on a watershed between two arterial supplies.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="906" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Where the lesion is, and what the patient loses</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Field defects are read backwards: the pattern names the site</text><rect x="40" y="164" width="840" height="420" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="192.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">The pathway from above, left eye on the left</text><circle cx="150" cy="268" r="34" fill="#efe9df" stroke="#6d716f" stroke-width="2.4"/><text x="150.0" y="218.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:12px">LEFT eye</text><circle cx="150" cy="420" r="34" fill="#efe9df" stroke="#6d716f" stroke-width="2.4"/><text x="150.0" y="476.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:12px">RIGHT eye</text><line x1="184" y1="268" x2="300" y2="320" stroke="#5b7a64" stroke-width="2.6"/><line x1="184" y1="268" x2="300" y2="368" stroke="#a8324a" stroke-width="2.6"/><line x1="184" y1="420" x2="300" y2="368" stroke="#5b7a64" stroke-width="2.6"/><line x1="184" y1="420" x2="300" y2="320" stroke="#a8324a" stroke-width="2.6"/><circle cx="318" cy="344" r="22" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="318.0" y="349.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">X</text><text x="318.0" y="392.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">chiasm</text><line x1="340" y1="326" x2="470" y2="300" stroke="#245574" stroke-width="2.8"/><line x1="340" y1="362" x2="470" y2="390" stroke="#245574" stroke-width="2.8"/><text x="404.0" y="286.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">tract</text><rect x="470" y="278" width="92" height="44" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="516.0" y="306.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">LGN</text><rect x="470" y="368" width="92" height="44" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="516.0" y="396.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">LGN</text><path d="M562 292 q70 -40 130 -8" stroke="#5b7a64" stroke-width="2.6" fill="none"/><text x="636.0" y="262.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">parietal radiation</text><path d="M562 404 q70 44 130 10" stroke="#a8324a" stroke-width="2.6" fill="none"/><text x="628.0" y="470.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">Meyer&#x27;s loop (temporal)</text><rect x="692" y="300" width="104" height="100" rx="10" fill="#dde4ea" stroke="#18364a" stroke-width="2"/><text x="744.0" y="344.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">V1</text><text x="744.0" y="366.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">occipital</text><text x="744.0" y="420.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">macula at the pole</text><circle cx="214" cy="292" r="13" fill="#ffffff" stroke="#a8324a" stroke-width="2.4"/><text x="214.0" y="297.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">1</text><circle cx="318" cy="344" r="13" fill="#ffffff" stroke="#a8324a" stroke-width="2.4"/><text x="318.0" y="349.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">2</text><circle cx="452" cy="300" r="13" fill="#ffffff" stroke="#a8324a" stroke-width="2.4"/><text x="452.0" y="305.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">3</text><circle cx="676" cy="428" r="13" fill="#ffffff" stroke="#a8324a" stroke-width="2.4"/><text x="676.0" y="433.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">4</text><circle cx="744" cy="288" r="13" fill="#ffffff" stroke="#a8324a" stroke-width="2.4"/><text x="744.0" y="293.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">5</text><text x="460.0" y="540.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">crossing fibres are nasal · nasal retina sees the TEMPORAL field · so the chiasm lesion costs both outer fields</text><text x="460.0" y="562.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">everything behind the chiasm is homonymous and on the opposite side</text><rect x="40" y="600" width="840" height="282" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="460.0" y="628.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">The five defects</text><circle cx="92" cy="664" r="13" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="92.0" y="669.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:12px">1</text><text x="122.0" y="660.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:bold;font-size:12px">optic nerve</text><text x="122.0" y="676.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">optic neuritis in MS</text><text x="420.0" y="668.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">monocular blindness — that eye only</text><circle cx="92" cy="706" r="13" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="92.0" y="711.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">2</text><text x="122.0" y="702.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:12px">optic chiasm</text><text x="122.0" y="718.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">pituitary adenoma</text><text x="420.0" y="710.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">bitemporal hemianopia — both outer fields</text><circle cx="92" cy="748" r="13" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="92.0" y="753.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">3</text><text x="122.0" y="744.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:12px">optic tract or LGN</text><text x="122.0" y="760.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">same half lost in both eyes</text><text x="420.0" y="752.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">contralateral homonymous hemianopia</text><circle cx="92" cy="790" r="13" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="92.0" y="795.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">4</text><text x="122.0" y="786.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:12px">Meyer&#x27;s loop, temporal</text><text x="122.0" y="802.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">&quot;pie in the sky&quot;</text><text x="420.0" y="794.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">contralateral superior quadrantanopia</text><circle cx="92" cy="832" r="13" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="92.0" y="837.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">5</text><text x="122.0" y="828.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:12px">occipital cortex</text><text x="122.0" y="844.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">PCA stroke</text><text x="420.0" y="836.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">homonymous hemianopia, macula spared</text><text x="460.0" y="872.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">tunnel vision is something else entirely — a concentric loss from glaucoma or retinitis pigmentosa, not a chiasmal lesion</text></svg>