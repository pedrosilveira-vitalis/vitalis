<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="940" viewBox="0 0 1180 940" role="img" aria-labelledby="t d"><title id="t">Why anything dissolves</title><desc id="d">An enthalpy ladder for sodium chloride dissolving in water. Starting from solid sodium chloride and water at zero, separating the lattice into gaseous ions costs plus 788 kilojoules per mole, taking the system to the top of the diagram. Hydrating those ions releases 784, bringing the system back down to plus 4. The net enthalpy of solution is therefore plus 4 kilojoules per mole, slightly endothermic, and sodium chloride dissolves anyway because the entropy term carries it. A note records that tabulated hydration enthalpies already include the cost of opening a cavity in the solvent, so the three conceptual steps collapse to two numbers. Beside it, three salts compared: lithium chloride at minus 37 kilojoules per mole is exothermic and very soluble, sodium chloride at plus 4 is nearly thermoneutral and soluble because of entropy, and silver chloride at plus 65 is strongly endothermic, lattice dominated, and insoluble. A panel ranks the intermolecular forces that a solvent can offer a solute, from ion-dipole, the strongest, through hydrogen bonding, dipole-dipole, and finally London dispersion, the weakest, with the rule that like dissolves like meaning the solute-solvent interactions must be comparable in kind and strength to the solute-solute and solvent-solvent interactions they replace. A Henry&#x27;s law panel gives concentration equals the Henry constant times partial pressure, with constants in water at 25 degrees of 3.4 times ten to the minus two for carbon dioxide, 1.3 times ten to the minus three for oxygen, 6.1 times ten to the minus four for nitrogen and 3.7 times ten to the minus four for helium, and notes that raising the partial pressure raises the dissolved concentration proportionally while raising the temperature lowers it, because dissolving a gas is exothermic. A solubility product panel gives the molar solubility of a one-to-one salt as the square root of the solubility product and of a one-to-two salt as the cube root of the solubility product over four, worked for barium sulfate and magnesium hydroxide, and shows the common ion effect dropping barium ion concentration from about ten to the minus five molar in pure water to about ten to the minus nine molar in 0.10 molar sulfate. A footer states that the hydrophobic effect is entropic, that a nonpolar solute forces water into ordered cages so the cost is paid in solvent entropy, and that ionising a weak acid or base raises its water solubility while its neutral form is the one that crosses membranes.</desc><defs><marker id="m8790" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker><marker id="m9963" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b7a64"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1180" height="940" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Why anything dissolves</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Pull the lattice apart, then let the solvent wrap the pieces. Solubility is whether the second step pays for the first — or whether entropy covers the shortfall.</text><line x1="56" y1="464" x2="576" y2="464" stroke="#18364a" stroke-width="2"/><line x1="56" y1="164" x2="56" y2="464" stroke="#18364a" stroke-width="2"/><text x="316.0" y="508.0" class="" text-anchor="middle" style="font-size:17px"></text><text x="12" y="314.0" text-anchor="middle" transform="rotate(-90 12 314.0)" style="font-size:17px">ΔH  (kJ/mol)</text><line x1="50.0" y1="439.0" x2="56.0" y2="439.0" stroke="#18364a" stroke-width="2"/><text x="46.0" y="444.0" class="" text-anchor="end" style="font-size:14px">0</text><line x1="50.0" y1="376.5" x2="56.0" y2="376.5" stroke="#18364a" stroke-width="2"/><text x="46.0" y="381.5" class="" text-anchor="end" style="font-size:14px">200</text><line x1="50.0" y1="314.0" x2="56.0" y2="314.0" stroke="#18364a" stroke-width="2"/><text x="46.0" y="319.0" class="" text-anchor="end" style="font-size:14px">400</text><line x1="50.0" y1="251.5" x2="56.0" y2="251.5" stroke="#18364a" stroke-width="2"/><text x="46.0" y="256.5" class="" text-anchor="end" style="font-size:14px">600</text><line x1="50.0" y1="189.0" x2="56.0" y2="189.0" stroke="#18364a" stroke-width="2"/><text x="46.0" y="194.0" class="" text-anchor="end" style="font-size:14px">800</text><line x1="80.375" y1="439.0" x2="210.37499999999997" y2="439.0" stroke="#18364a" stroke-width="3"/><text x="145.4" y="427.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:11px">NaCl(s) + H₂O</text><line x1="259.125" y1="192.75" x2="389.12499999999994" y2="192.75" stroke="#18364a" stroke-width="3"/><text x="324.1" y="180.8" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:11px">Na⁺(g) + Cl⁻(g)</text><line x1="437.875" y1="437.75" x2="559.75" y2="437.75" stroke="#18364a" stroke-width="3"/><text x="498.8" y="425.8" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:11px">Na⁺(aq) + Cl⁻(aq)</text><line x1="210.37499999999997" y1="439.0" x2="259.125" y2="192.75" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m8790)"/><text x="253.1" y="315.9" class="" text-anchor="end" style="fill:#a8324a;font-weight:700;font-size:13px">+788</text><text x="253.1" y="333.9" class="" text-anchor="end" style="fill:#a8324a;font-size:10.5px">break the lattice</text><line x1="389.12499999999994" y1="192.75" x2="437.875" y2="437.75" stroke="#5b7a64" stroke-width="2.5" marker-end="url(#m9963)"/><text x="397.1" y="315.2" class="" text-anchor="start" style="fill:#5b7a64;font-weight:700;font-size:13px">−784</text><text x="397.1" y="333.2" class="" text-anchor="start" style="fill:#5b7a64;font-size:10.5px">hydrate the ions</text><text x="316.0" y="492.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12.5px">net ΔH_soln = +4 kJ/mol — slightly ENDOthermic, and NaCl dissolves anyway: TΔS carries it</text><text x="316.0" y="516.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">Tabulated hydration enthalpies already include the cost of opening a cavity in the solvent — three conceptual steps, two numbers.</text><rect x="604" y="164" width="548" height="150" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="878.0" y="192.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">SAME PICTURE, THREE OUTCOMES</text><text x="628.0" y="222.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:13px">LiCl</text><text x="800.0" y="222.0" class="" text-anchor="end" style="fill:#5b7a64;font-weight:700;font-size:12px">ΔH_soln ≈ −37</text><text x="1128.0" y="222.0" class="" text-anchor="end" style="fill:#6d716f;font-size:11px">hydration beats the lattice — very soluble</text><text x="628.0" y="252.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:13px">NaCl</text><text x="800.0" y="252.0" class="" text-anchor="end" style="fill:#987740;font-weight:700;font-size:12px">ΔH_soln ≈ +4</text><text x="1128.0" y="252.0" class="" text-anchor="end" style="fill:#6d716f;font-size:11px">a near tie — soluble on entropy alone</text><text x="628.0" y="282.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:13px">AgCl</text><text x="800.0" y="282.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:700;font-size:12px">ΔH_soln ≈ +65</text><text x="1128.0" y="282.0" class="" text-anchor="end" style="fill:#6d716f;font-size:11px">lattice wins — entropy cannot cover it</text><rect x="604" y="330" width="548" height="134" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="878.0" y="358.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12.5px">WHAT THE SOLVENT CAN OFFER — STRONGEST FIRST</text><text x="628.0" y="384.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:11.5px">ion–dipole</text><text x="1128.0" y="384.0" class="" text-anchor="end" style="fill:#6d716f;font-size:10.5px">Na⁺ with water — the strongest solvent–solute interaction</text><text x="628.0" y="404.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:11.5px">hydrogen bond</text><text x="1128.0" y="404.0" class="" text-anchor="end" style="fill:#6d716f;font-size:10.5px">ethanol, glucose, ammonia in water</text><text x="628.0" y="424.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:11.5px">dipole–dipole</text><text x="1128.0" y="424.0" class="" text-anchor="end" style="fill:#6d716f;font-size:10.5px">polar but no O–H or N–H; weaker</text><text x="628.0" y="444.0" class="" text-anchor="start" style="fill:#245574;font-weight:700;font-size:11.5px">London dispersion</text><text x="1128.0" y="444.0" class="" text-anchor="end" style="fill:#6d716f;font-size:10.5px">hexane in benzene — weak, but all that nonpolar pairs need</text><rect x="24" y="530" width="560" height="206" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="304.0" y="558.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:13px">GASES — HENRY&#x27;S LAW   C = kₕ × P</text><text x="60.0" y="590.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12px">CO₂</text><text x="250.0" y="590.0" class="" text-anchor="end" style="fill:#18364a;font-size:12px">3.4 × 10⁻²</text><text x="60.0" y="614.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12px">O₂</text><text x="250.0" y="614.0" class="" text-anchor="end" style="fill:#18364a;font-size:12px">1.3 × 10⁻³</text><text x="60.0" y="638.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12px">N₂</text><text x="250.0" y="638.0" class="" text-anchor="end" style="fill:#18364a;font-size:12px">6.1 × 10⁻⁴</text><text x="60.0" y="662.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12px">He</text><text x="250.0" y="662.0" class="" text-anchor="end" style="fill:#18364a;font-size:12px">3.7 × 10⁻⁴</text><text x="155.0" y="690.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">kₕ in water at 25 °C, mol/(L·atm)</text><line x1="290" y1="578" x2="290" y2="700" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="312.0" y="586.0" class="" text-anchor="start" style="fill:#987740;font-weight:700;font-size:11.5px">↑ partial pressure</text><text x="312.0" y="602.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">↑ dissolved, proportionally</text><text x="312.0" y="620.0" class="" text-anchor="start" style="fill:#987740;font-weight:700;font-size:11.5px">↑ temperature</text><text x="312.0" y="636.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">↓ dissolved — dissolving a gas is exothermic</text><text x="312.0" y="654.0" class="" text-anchor="start" style="fill:#987740;font-weight:700;font-size:11.5px">the bends</text><text x="312.0" y="670.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">ascend fast → P falls → N₂ leaves solution as bubbles</text><text x="312.0" y="688.0" class="" text-anchor="start" style="fill:#987740;font-weight:700;font-size:11.5px">hyperbaric O₂</text><text x="312.0" y="704.0" class="" text-anchor="start" style="fill:#6d716f;font-size:10.5px">3 atm of O₂ → 3× the dissolved fraction</text><rect x="604" y="530" width="548" height="206" rx="12" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="878.0" y="558.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:13px">SPARINGLY SOLUBLE SALTS — Kₛₚ</text><text x="628.0" y="590.0" class="" text-anchor="start" style="fill:#18364a;font-size:11.5px">MA  ⇌  M⁺ + A⁻</text><text x="950.0" y="590.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:11.5px">Kₛₚ = s²</text><text x="1128.0" y="590.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:11.5px">s = √Kₛₚ</text><text x="628.0" y="616.0" class="" text-anchor="start" style="fill:#18364a;font-size:11.5px">MA₂ ⇌ M²⁺ + 2A⁻</text><text x="950.0" y="616.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:11.5px">Kₛₚ = 4s³</text><text x="1128.0" y="616.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:11.5px">s = ∛(Kₛₚ/4)</text><line x1="628" y1="632" x2="1128" y2="632" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="628.0" y="654.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:700;font-size:11.5px">BaSO₄, Kₛₚ = 1.1×10⁻¹⁰</text><text x="1128.0" y="654.0" class="" text-anchor="end" style="fill:#18364a;font-size:11.5px">s = 1.05×10⁻⁵ M in pure water</text><text x="628.0" y="678.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:700;font-size:11.5px">… in 0.10 M SO₄²⁻</text><text x="1128.0" y="678.0" class="" text-anchor="end" style="fill:#18364a;font-size:11.5px">[Ba²⁺] = 1.1×10⁻⁹ M — 10,000× lower</text><text x="878.0" y="712.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:11px">Q &lt; Kₛₚ unsaturated  ·  Q = Kₛₚ saturated  ·  Q &gt; Kₛₚ precipitates</text><rect x="24" y="756" width="1128" height="104" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="588.0" y="786.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13.5px">Two things the exam asks about that are not in the numbers above</text><text x="588.0" y="807.5" class="" text-anchor="middle" style="font-size:12px">THE HYDROPHOBIC EFFECT IS ENTROPIC. A nonpolar solute does not repel water; it forces water into ordered cages around itself, and the cost is paid in</text><text x="588.0" y="824.5" class="" text-anchor="middle" style="font-size:12px">solvent entropy. · pH CHANGES SOLUBILITY, AND PERMEABILITY THE OTHER WAY. Ionising a weak acid or base makes it far more water-soluble — but the</text><text x="588.0" y="841.5" class="" text-anchor="middle" style="font-size:12px">NEUTRAL form is the one that crosses membranes.</text></svg>