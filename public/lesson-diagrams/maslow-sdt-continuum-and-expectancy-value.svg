<svg xmlns="http://www.w3.org/2000/svg" width="920" height="920" viewBox="0 0 920 920" role="img" aria-labelledby="t d"><title id="t">Not how much motivation, but what kind</title><desc id="d">Top: Maslow&#x27;s ladder, which answers &quot;which need is in charge right now&quot; and is the right tool for any vignette about deprivation — a patient who is food-insecure is not going to be moved by a lecture on long-term risk. Middle: the self-determination continuum, which is the real contribution of the theory. Motivation is not a switch between intrinsic and extrinsic; there are degrees of taking a reason inside yourself, and the two middle grades — doing it because you value the result, or because it is simply who you are — behave far more like intrinsic motivation than like being paid. Bottom left: why paying someone for something they already loved can backfire. Bottom right: the expectancy-value product, which is the tool for asking why someone capable does not even try.</desc><defs><marker id="m6280" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="920" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Not how much motivation, but what kind</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">The exam asks which theory explains a vignette — so learn what each one is for</text><rect x="40" y="178" width="420" height="322" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="250.0" y="206.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">Maslow: which need is in charge</text><rect x="190.0" y="232" width="120" height="44" rx="7" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="250.0" y="252.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">SELF-ACTUALISATION</text><text x="250.0" y="268.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">growth · becoming</text><rect x="160.0" y="280" width="180" height="44" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="250.0" y="300.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">ESTEEM</text><text x="250.0" y="316.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">mastery, recognition</text><rect x="130.0" y="328" width="240" height="44" rx="7" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="250.0" y="348.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:11px">LOVE AND BELONGING</text><text x="250.0" y="364.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">connection</text><rect x="100.0" y="376" width="300" height="44" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="250.0" y="396.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">SAFETY</text><text x="250.0" y="412.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">security, stability</text><rect x="70.0" y="424" width="360" height="44" rx="7" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="250.0" y="444.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:11px">PHYSIOLOGICAL</text><text x="250.0" y="460.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">food, water, sleep</text><text x="250.0" y="490.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">the bottom four are deficiency needs — they push from lack</text><rect x="480" y="178" width="400" height="322" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="680.0" y="206.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">Self-determination: degrees of owning it</text><rect x="508" y="230" width="344" height="36" rx="7" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="680.0" y="246.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:11px">AMOTIVATION</text><text x="680.0" y="260.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">why bother; nothing I do matters</text><rect x="508" y="270" width="344" height="36" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="680.0" y="286.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">EXTERNAL</text><text x="680.0" y="300.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">for the reward, or to dodge the punishment</text><rect x="508" y="310" width="344" height="36" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="680.0" y="326.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">INTROJECTED</text><text x="680.0" y="340.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">to avoid guilt or protect my pride</text><rect x="508" y="350" width="344" height="36" rx="7" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="680.0" y="366.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">IDENTIFIED</text><text x="680.0" y="380.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">I don&#x27;t enjoy it, but I value what it gets me</text><rect x="508" y="390" width="344" height="36" rx="7" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="680.0" y="406.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">INTEGRATED</text><text x="680.0" y="420.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">it is simply part of who I am</text><rect x="508" y="430" width="344" height="36" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="680.0" y="446.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">INTRINSIC</text><text x="680.0" y="460.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">the doing is the reward</text><line x1="494" y1="450" x2="494" y2="236" stroke="#6d716f" stroke-width="2" marker-end="url(#m6280)"/><text x="680.0" y="486.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">the two green bands are extrinsic — and behave almost like intrinsic</text><rect x="40" y="520" width="420" height="360" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="250.0" y="548.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">Why paying can backfire</text><rect x="66" y="572" width="368" height="52" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="250.0" y="594.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">the child draws for fun</text><text x="250.0" y="612.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">internal reason</text><line x1="250" y1="624" x2="250" y2="632" stroke="#6d716f" stroke-width="1.6" marker-end="url(#m6280)"/><rect x="66" y="634" width="368" height="52" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="250.0" y="656.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">a prize is promised for drawing</text><text x="250.0" y="674.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">an external reason appears</text><line x1="250" y1="686" x2="250" y2="694" stroke="#6d716f" stroke-width="1.6" marker-end="url(#m6280)"/><rect x="66" y="696" width="368" height="52" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="250.0" y="718.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">“I draw to get prizes”</text><text x="250.0" y="736.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">the perceived cause moves outward</text><line x1="250" y1="748" x2="250" y2="756" stroke="#6d716f" stroke-width="1.6" marker-end="url(#m6280)"/><rect x="66" y="758" width="368" height="52" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="250.0" y="780.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">prize withdrawn → less drawing</text><text x="250.0" y="798.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">than children never rewarded</text><text x="250.0" y="836.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">what decides it is whether the reward feels CONTROLLING</text><text x="250.0" y="854.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">or merely INFORMATIVE about how well you did</text><text x="250.0" y="872.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">unexpected rewards and honest praise rarely hurt</text><rect x="480" y="520" width="400" height="360" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="680.0" y="548.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">Expectancy × Value</text><rect x="508" y="568" width="344" height="56" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="680.0" y="604.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">zero in either → zero motivation</text><text x="680.0" y="650.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">EXPECTANCY — can I do it?</text><text x="680.0" y="672.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">self-efficacy, built mainly by past mastery</text><text x="680.0" y="690.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">then by seeing people like you succeed</text><text x="680.0" y="724.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">VALUE — is it worth it?</text><text x="672.0" y="748.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:11px">interest</text><text x="682.0" y="748.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">do I enjoy it</text><text x="672.0" y="768.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:11px">attainment</text><text x="682.0" y="768.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">does it fit who I am</text><text x="672.0" y="788.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:11px">utility</text><text x="682.0" y="788.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">will it get me somewhere</text><text x="672.0" y="808.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:11px">cost</text><text x="682.0" y="808.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">subtract time, effort, dread</text><text x="680.0" y="848.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">capable but not trying → look at value</text><text x="680.0" y="866.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">willing but not starting → look at expectancy</text></svg>