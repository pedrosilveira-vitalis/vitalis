<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="t d"><title id="t">Two antigen-presentation pathways</title><desc id="d">Left column, MHC class I pathway in any nucleated cell: a cytosolic protein such as a viral protein is tagged with ubiquitin and cut by the proteasome; TAP pumps peptides of 8 to 10 amino acids into the ER; they load onto MHC class I (alpha chain plus beta-2 microglobulin); the complex goes via the Golgi to the surface, where a CD8 cytotoxic T cell recognizes it and kills the cell. Right column, MHC class II pathway in professional APCs (dendritic cells, macrophages, B cells): extracellular material is endocytosed or phagocytosed and cut by lysosomal proteases; MHC class II made in the ER carries the invariant chain in its groove to the endosome; the invariant chain is cut to CLIP, which HLA-DM swaps for a peptide of about 13 to 25 amino acids; the complex goes to the surface, where a CD4 helper T cell recognizes it. A note says dendritic cells can cross-present exogenous antigen on MHC class I.</desc><defs><marker id="m1365" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker><marker id="m3485" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="640" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Two antigen-presentation pathways</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">MHC class I shows what a cell makes; MHC class II shows what an APC has eaten.</text><text x="250.0" y="120.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:17px">MHC class I (endogenous)</text><rect x="40" y="140" width="420" height="62" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="250.0" y="170.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:14px">Source: proteins made inside the cell</text><text x="250.0" y="192.0" class="" text-anchor="middle" style="font-size:13px">self, viral or tumor proteins in the cytosol</text><line x1="250" y1="202" x2="250" y2="216" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m1365)"/><rect x="40" y="216" width="420" height="62" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="250.0" y="246.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:14px">Proteasome</text><text x="250.0" y="268.0" class="" text-anchor="middle" style="font-size:13px">ubiquitin-tagged proteins cut into peptides</text><line x1="250" y1="278" x2="250" y2="292" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m1365)"/><rect x="40" y="292" width="420" height="62" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="250.0" y="322.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:14px">TAP transporter</text><text x="250.0" y="344.0" class="" text-anchor="middle" style="font-size:13px">pumps peptides into the ER; trimmed to 8–10 aa</text><line x1="250" y1="354" x2="250" y2="368" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m1365)"/><rect x="40" y="368" width="420" height="62" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="250.0" y="398.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:14px">Load onto MHC I in the ER</text><text x="250.0" y="420.0" class="" text-anchor="middle" style="font-size:13px">α chain + β2-microglobulin; closed groove</text><line x1="250" y1="430" x2="250" y2="444" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m1365)"/><rect x="40" y="444" width="420" height="62" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="250.0" y="474.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:14px">Golgi → surface</text><text x="250.0" y="496.0" class="" text-anchor="middle" style="font-size:13px">on all nucleated cells</text><text x="750.0" y="120.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:17px">MHC class II (exogenous)</text><rect x="540" y="140" width="420" height="62" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="750.0" y="170.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:14px">Source: material taken up from outside</text><text x="750.0" y="192.0" class="" text-anchor="middle" style="font-size:13px">phagocytosis / endocytosis by an APC</text><line x1="750" y1="202" x2="750" y2="216" stroke="#245574" stroke-width="2.5" marker-end="url(#m3485)"/><rect x="540" y="216" width="420" height="62" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="750.0" y="246.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:14px">Endolysosome</text><text x="750.0" y="268.0" class="" text-anchor="middle" style="font-size:13px">proteases cut proteins into peptides</text><line x1="750" y1="278" x2="750" y2="292" stroke="#245574" stroke-width="2.5" marker-end="url(#m3485)"/><rect x="540" y="292" width="420" height="62" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="750.0" y="322.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:14px">MHC II leaves ER with invariant chain</text><text x="750.0" y="344.0" class="" text-anchor="middle" style="font-size:13px">Ii blocks the groove and targets endosomes</text><line x1="750" y1="354" x2="750" y2="368" stroke="#245574" stroke-width="2.5" marker-end="url(#m3485)"/><rect x="540" y="368" width="420" height="62" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="750.0" y="398.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:14px">Ii → CLIP; HLA-DM swaps in peptide</text><text x="750.0" y="420.0" class="" text-anchor="middle" style="font-size:13px">~13–25 aa; groove open at both ends</text><line x1="750" y1="430" x2="750" y2="444" stroke="#245574" stroke-width="2.5" marker-end="url(#m3485)"/><rect x="540" y="444" width="420" height="62" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="750.0" y="474.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:14px">Surface of dendritic cell, macrophage, B cell</text><text x="750.0" y="496.0" class="" text-anchor="middle" style="font-size:13px">professional APCs</text><rect x="40" y="526" width="420" height="64" rx="12" fill="#f0d5da" stroke="#a8324a" stroke-width="2"/><text x="250.0" y="556.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:15px">→ CD8⁺ cytotoxic T cell</text><text x="250.0" y="579.0" class="" text-anchor="middle" style="font-size:13px">kills the presenting cell (perforin/granzyme, FasL)</text><rect x="540" y="526" width="420" height="64" rx="12" fill="#d3e2ec" stroke="#245574" stroke-width="2"/><text x="750.0" y="556.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:15px">→ CD4⁺ helper T cell</text><text x="750.0" y="579.0" class="" text-anchor="middle" style="font-size:13px">cytokines that direct B cells, macrophages, CTLs</text><text x="500.0" y="632.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">Rule of 8: CD8 × MHC I = 8; CD4 × MHC II = 8.  Exception: dendritic cells cross-present exogenous antigen on MHC I.</text></svg>