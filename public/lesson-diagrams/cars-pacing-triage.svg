<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="t d"><title id="t">Spending 90 minutes on 9 passages</title><desc id="d">A 90-minute bar divided into four stretches: minutes 0 to 3, a triage sprint previewing all nine passages at roughly 20 seconds each and labelling them green, yellow or red; minutes 3 to 60, working the green then yellow passages; minutes 60 to 85, the red passages; and minutes 85 to 90, filling every blank. Two checkpoints are marked: at 30 minutes you should have finished about 3 passages and 17 to 20 questions, and at 60 minutes about 6 passages and 35 to 38 questions. Three triage buckets are described: green, immediately accessible, do first while you are sharpest; yellow, manageable but denser, do second; red, your personal nightmare, do last so that if time runs out you are guessing where you were least likely to score anyway. Four elimination filters are listed for stuck questions: unsupported by the text, too extreme, out of scope, and true but irrelevant. Rules of thumb: triage is personal, not an objective difficulty rating; a 7-question set is worth more than a 5-question set; past 90 seconds on one question, eliminate, guess, flag and move; and never leave a blank, since there is no penalty for guessing.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="640" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Spending 90 minutes on 9 passages</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">53 questions, 9 passage sets, 90 minutes — about 10 minutes each, but not spent equally.</text><rect x="40.0" y="112" width="30.66666666666667" height="52" rx="8" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="55.3" y="186.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:700;font-size:11px">0–3</text><text x="55.3" y="202.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:700;font-size:11px">triage sprint</text><rect x="70.66666666666667" y="112" width="582.6666666666667" height="52" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="362.0" y="144.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:13px">3–60   green, then yellow</text><rect x="653.3333333333334" y="112" width="255.55555555555554" height="52" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="781.1" y="144.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:13px">60–85   red</text><rect x="908.8888888888889" y="112" width="51.111111111111086" height="52" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="934.4" y="186.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:11px">85–90</text><text x="934.4" y="202.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:11px">fill blanks</text><line x1="346.6666666666667" y1="164" x2="346.6666666666667" y2="186" stroke="#18364a" stroke-width="2.5"/><text x="346.7" y="202.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">30 min · ~3 passages · 17–20 Qs</text><line x1="653.3333333333334" y1="164" x2="653.3333333333334" y2="186" stroke="#18364a" stroke-width="2.5"/><text x="653.3" y="202.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">60 min · ~6 passages · 35–38 Qs</text><text x="40.0" y="104.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">0</text><text x="960.0" y="104.0" class="" text-anchor="end" style="fill:#6d716f;font-size:11px">90 min</text><text x="40.0" y="250.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:16px">Triage buckets</text><rect x="40" y="268" width="470" height="86" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="60.0" y="298.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:700;font-size:17px">GREEN</text><text x="140.0" y="298.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:13px">immediately accessible</text><text x="60.0" y="324.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">do first — you are sharpest now</text><rect x="40" y="364" width="470" height="86" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="60.0" y="394.0" class="" text-anchor="start" style="fill:#987740;font-weight:700;font-size:17px">YELLOW</text><text x="140.0" y="394.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:13px">manageable but denser</text><text x="60.0" y="420.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">do second</text><rect x="40" y="460" width="470" height="86" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="60.0" y="490.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:700;font-size:17px">RED</text><text x="140.0" y="490.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:13px">your personal nightmare</text><text x="60.0" y="516.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">do last — if time runs out, you guess where you&#x27;d</text><text x="60.0" y="532.0" class="" text-anchor="start" style="fill:#6d716f;font-size:12px">score least anyway</text><text x="545.0" y="250.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:16px">Stuck? Run the four filters</text><rect x="545" y="272" width="415" height="44" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="566.0" y="300.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">unsupported by the text</text><rect x="545" y="324" width="415" height="44" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="566.0" y="352.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">too extreme (always, never, all)</text><rect x="545" y="376" width="415" height="44" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="566.0" y="404.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">out of scope (new ideas)</text><rect x="545" y="428" width="415" height="44" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="566.0" y="456.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">true but irrelevant to the stem</text><rect x="545" y="482" width="415" height="72" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="752.5" y="512.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:14px">Past 90 seconds on one question</text><text x="752.5" y="534.0" class="" text-anchor="middle" style="font-size:13px">eliminate · guess · flag · move on</text><text x="500.0" y="592.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">Triage is personal, not an objective difficulty rating.  A 7-question set is worth more than a 5-question set.</text><text x="500.0" y="614.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">Never leave a blank — there is no penalty for guessing.</text></svg>