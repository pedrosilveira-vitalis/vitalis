<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="t d"><title id="t">Why a substituent directs: where the arenium ion puts its charge</title><desc id="d">Three benzene rings show attack at the ortho, meta and para positions relative to a substituent G. In each the three carbons that carry positive charge in the arenium ion are marked. For ortho and para attack the carbon bearing G is one of them; for meta attack it is not. Two panels below read off the consequence: a lone-pair donor stabilises that contributor so it directs ortho and para, while a resonance withdrawer destabilises it so ortho and para are suppressed and meta is what is left.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="900" height="640" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Why a substituent directs: where the arenium ion puts its charge</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Ortho or para attack puts positive charge on the carbon bearing the substituent. Meta attack does not.</text><line x1="190.0" y1="160.0" x2="235.03332099679082" y2="186.0" stroke="#18364a" stroke-width="2.2"/><line x1="235.03332099679082" y1="186.0" x2="235.03332099679082" y2="238.0" stroke="#18364a" stroke-width="2.2"/><line x1="235.03332099679082" y1="238.0" x2="190.0" y2="264.0" stroke="#18364a" stroke-width="2.2"/><line x1="190.0" y1="264.0" x2="144.96667900320918" y2="238.0" stroke="#18364a" stroke-width="2.2"/><line x1="144.96667900320918" y1="238.0" x2="144.96667900320918" y2="186.0" stroke="#18364a" stroke-width="2.2"/><line x1="144.96667900320918" y1="186.0" x2="190.0" y2="160.0" stroke="#18364a" stroke-width="2.2"/><circle cx="190.0" cy="160.0" r="15" fill="#e5ece3" stroke="#5b7a64" stroke-width="2.5"/><text x="190.0" y="166.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">G</text><text x="214.0" y="148.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:19px">+</text><circle cx="235.03332099679082" cy="186.0" r="15" fill="#ffffff" stroke="#18364a" stroke-width="2.5"/><text x="235.0" y="192.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">E</text><circle cx="235.03332099679082" cy="238.0" r="13" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="235.0" y="244.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:17px">+</text><circle cx="190.0" cy="264.0" r="5" fill="#18364a" stroke="#18364a" stroke-width="0"/><circle cx="144.96667900320918" cy="238.0" r="13" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="145.0" y="244.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:17px">+</text><circle cx="144.96667900320918" cy="186.0" r="5" fill="#18364a" stroke="#18364a" stroke-width="0"/><text x="190.0" y="118.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">E attacks ortho</text><text x="190.0" y="300.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">carbon bearing G carries +</text><line x1="450.0" y1="160.0" x2="495.0333209967908" y2="186.0" stroke="#18364a" stroke-width="2.2"/><line x1="495.0333209967908" y1="186.0" x2="495.0333209967908" y2="238.0" stroke="#18364a" stroke-width="2.2"/><line x1="495.0333209967908" y1="238.0" x2="450.0" y2="264.0" stroke="#18364a" stroke-width="2.2"/><line x1="450.0" y1="264.0" x2="404.9666790032092" y2="238.0" stroke="#18364a" stroke-width="2.2"/><line x1="404.9666790032092" y1="238.0" x2="404.9666790032092" y2="186.0" stroke="#18364a" stroke-width="2.2"/><line x1="404.9666790032092" y1="186.0" x2="450.0" y2="160.0" stroke="#18364a" stroke-width="2.2"/><circle cx="450.0" cy="160.0" r="15" fill="#f5e6e8" stroke="#a8324a" stroke-width="2.5"/><text x="450.0" y="166.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">G</text><circle cx="495.0333209967908" cy="186.0" r="13" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="495.0" y="192.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:17px">+</text><circle cx="495.0333209967908" cy="238.0" r="15" fill="#ffffff" stroke="#18364a" stroke-width="2.5"/><text x="495.0" y="244.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">E</text><circle cx="450.0" cy="264.0" r="13" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="450.0" y="270.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:17px">+</text><circle cx="404.9666790032092" cy="238.0" r="5" fill="#18364a" stroke="#18364a" stroke-width="0"/><circle cx="404.9666790032092" cy="186.0" r="13" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="405.0" y="192.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:17px">+</text><text x="450.0" y="118.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">E attacks meta</text><text x="450.0" y="300.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">carbon bearing G is untouched</text><line x1="710.0" y1="160.0" x2="755.0333209967908" y2="186.0" stroke="#18364a" stroke-width="2.2"/><line x1="755.0333209967908" y1="186.0" x2="755.0333209967908" y2="238.0" stroke="#18364a" stroke-width="2.2"/><line x1="755.0333209967908" y1="238.0" x2="710.0" y2="264.0" stroke="#18364a" stroke-width="2.2"/><line x1="710.0" y1="264.0" x2="664.9666790032092" y2="238.0" stroke="#18364a" stroke-width="2.2"/><line x1="664.9666790032092" y1="238.0" x2="664.9666790032092" y2="186.0" stroke="#18364a" stroke-width="2.2"/><line x1="664.9666790032092" y1="186.0" x2="710.0" y2="160.0" stroke="#18364a" stroke-width="2.2"/><circle cx="710.0" cy="160.0" r="15" fill="#e5ece3" stroke="#5b7a64" stroke-width="2.5"/><text x="710.0" y="166.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">G</text><text x="734.0" y="148.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:19px">+</text><circle cx="755.0333209967908" cy="186.0" r="5" fill="#18364a" stroke="#18364a" stroke-width="0"/><circle cx="755.0333209967908" cy="238.0" r="13" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="755.0" y="244.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:17px">+</text><circle cx="710.0" cy="264.0" r="15" fill="#ffffff" stroke="#18364a" stroke-width="2.5"/><text x="710.0" y="270.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">E</text><circle cx="664.9666790032092" cy="238.0" r="13" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="665.0" y="244.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:17px">+</text><circle cx="664.9666790032092" cy="186.0" r="5" fill="#18364a" stroke="#18364a" stroke-width="0"/><text x="710.0" y="118.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">E attacks para</text><text x="710.0" y="300.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">carbon bearing G carries +</text><text x="450.0" y="318.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">The three charged carbons are always ortho and para to the carbon the electrophile hit.</text><rect x="60" y="346" width="780" height="116" rx="12" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="450.0" y="376.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">G donates a lone pair  (–OH, –NH₂, –OR, and the halogens)</text><text x="450.0" y="404.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">That extra contributor is the one where G can push electron density onto the + carbon.</text><text x="450.0" y="428.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">It exists only for ortho and para attack → ortho/para director.</text><text x="450.0" y="450.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">Halogens are the split case: they donate by resonance (ortho/para) but withdraw inductively (deactivating).</text><rect x="60" y="478" width="780" height="116" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="450.0" y="508.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">G withdraws by resonance  (–NO₂, –C≡N, C=O, –SO₃H)</text><text x="450.0" y="536.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">The same contributor puts + next to a carbon already starved of electrons.</text><text x="450.0" y="560.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">Ortho and para are the ones punished → meta wins by default, not by merit.</text><text x="450.0" y="582.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">Deactivating and meta-directing always travel together.</text></svg>