<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="t d"><title id="t">Starling forces, lymph and the four routes to edema</title><desc id="d">A capillary runs from arteriole to venule. At the arteriolar end, capillary hydrostatic pressure of 35 mmHg pushes fluid out; at the venular end it is 15 mmHg. Plasma oncotic pressure of about 25 mmHg pulls fluid in along the whole length. Net filtration is largest at the arteriolar end and near zero at the venular end; a blind-ended lymphatic capillary collects excess fluid and leaked protein. Four boxes list causes of edema: raised capillary hydrostatic pressure, lowered plasma oncotic pressure, increased permeability, and lymphatic obstruction.</desc><defs><marker id="m1378" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker><marker id="m6595" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b7a64"/></marker><marker id="m9742" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1000" height="680" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Starling forces, lymph and the four routes to edema</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Values from this lesson (mmHg). Arrows show the direction each force pushes water.</text><rect x="60" y="100" width="880" height="330" rx="14" fill="#f4f1ea" stroke="#6d716f" stroke-width="1"/><text x="80.0" y="128.0" class="" text-anchor="start" style="fill:#6d716f;font-size:15px">Interstitium (Pi ≈ −3, πi ≈ 5–8)</text><rect x="110" y="250" width="780" height="70" rx="35" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="150.0" y="292.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:16px">Arteriole</text><text x="850.0" y="292.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:16px">Venule</text><text x="500.0" y="292.0" class="" text-anchor="middle" style="font-size:16px">Capillary (πc ≈ 25 all along)</text><line x1="260" y1="250" x2="260" y2="160" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m9742)"/><text x="250.0" y="200.0" class="" text-anchor="end" style="fill:#a8324a;font-size:15px">Pc 35 out</text><line x1="320" y1="165" x2="320" y2="245" stroke="#245574" stroke-width="2.5" marker-end="url(#m1378)"/><text x="330.0" y="200.0" class="" text-anchor="start" style="fill:#245574;font-size:15px">πc 25 in</text><line x1="700" y1="250" x2="700" y2="208" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m9742)"/><text x="690.0" y="228.0" class="" text-anchor="end" style="fill:#a8324a;font-size:15px">Pc 15 out</text><line x1="760" y1="185" x2="760" y2="245" stroke="#245574" stroke-width="2.5" marker-end="url(#m1378)"/><text x="770.0" y="220.0" class="" text-anchor="start" style="fill:#245574;font-size:15px">πc 25 in</text><text x="295.0" y="360.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:15px">Net filtration (largest here)</text><text x="735.0" y="360.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:15px">Net flux near zero</text><path d="M470 150 L470 200 Q500 222 530 200 L530 150" stroke="#5b7a64" stroke-width="3" fill="none"/><line x1="500" y1="175" x2="500" y2="112" stroke="#5b7a64" stroke-width="2.5" marker-end="url(#m6595)"/><text x="548.0" y="128.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:700;font-size:15px">Lymphatic capillary returns</text><text x="548.0" y="148.0" class="" text-anchor="start" style="fill:#5b7a64;font-size:15px">excess fluid + leaked protein (~2–4 L/day)</text><text x="60.0" y="470.0" class="" text-anchor="start" style="font-weight:700;font-size:18px">Edema results from:</text><rect x="60" y="490" width="205" height="120" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="162.5" y="520.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:19px">↑ Pc</text><text x="162.5" y="547.0" class="" text-anchor="middle" style="font-size:15px">heart failure, venous</text><text x="162.5" y="567.0" class="" text-anchor="middle" style="font-size:15px">obstruction</text><rect x="285" y="490" width="205" height="120" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="387.5" y="520.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:19px">↓ πc</text><text x="387.5" y="547.0" class="" text-anchor="middle" style="font-size:15px">nephrotic syndrome, liver</text><text x="387.5" y="567.0" class="" text-anchor="middle" style="font-size:15px">failure</text><rect x="510" y="490" width="205" height="120" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="612.5" y="520.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:19px">↑ Permeability</text><text x="612.5" y="547.0" class="" text-anchor="middle" style="font-size:15px">inflammation, burns,</text><text x="612.5" y="567.0" class="" text-anchor="middle" style="font-size:15px">sepsis</text><rect x="735" y="490" width="205" height="120" rx="12" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="837.5" y="520.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:19px">Lymph blocked</text><text x="837.5" y="547.0" class="" text-anchor="middle" style="font-size:15px">filariasis, node removal</text><text x="500.0" y="650.0" class="" text-anchor="middle" style="font-size:15px">Transudate (low protein): pressure causes.  Exudate (high protein): permeability causes.</text></svg>