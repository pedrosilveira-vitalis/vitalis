<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="t d"><title id="t">Acyl reactivity is set by two things, and they point the same way</title><desc id="d">A ladder of carboxylic acid derivatives from acyl chloride at the top to amide at the bottom. For each row the table gives the leaving group with the pKa of its conjugate acid, how strongly that group donates electron density into the carbonyl, and the infrared carbonyl stretch. An arrow down the side marks that interconversion runs downhill only: any derivative can be converted into one below it, but going back up needs an activating reagent.</desc><defs><marker id="m945" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="900" height="600" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Acyl reactivity is set by two things, and they point the same way</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">A good leaving group and a heteroatom that donates little into the carbonyl both make the acyl carbon easier to attack.</text><text x="310.0" y="108.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">leaving group (conj. acid pKₐ)</text><text x="575.0" y="108.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">donation into C=O</text><text x="778.0" y="108.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">IR C=O stretch</text><rect x="96" y="124" width="748" height="58" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="112.0" y="150.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:16px">Acyl chloride</text><text x="112.0" y="169.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">RCOCl</text><text x="310.0" y="160.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">Cl⁻   pKₐ ≈ −7</text><text x="575.0" y="160.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">minimal (3p/2p mismatch)</text><text x="778.0" y="160.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">~1800</text><rect x="96" y="192" width="748" height="58" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="112.0" y="218.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:16px">Anhydride</text><text x="112.0" y="237.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">(RCO)₂O</text><text x="310.0" y="228.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">RCOO⁻   pKₐ ≈ 4.8</text><text x="575.0" y="228.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">moderate</text><text x="778.0" y="228.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">~1820 and ~1760</text><rect x="96" y="260" width="748" height="58" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="112.0" y="286.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:16px">Thioester</text><text x="112.0" y="305.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">RCOSR&#x27;</text><text x="310.0" y="296.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">RS⁻   pKₐ ≈ 10</text><text x="575.0" y="296.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">weak (3p/2p mismatch)</text><text x="778.0" y="296.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">—</text><rect x="96" y="328" width="748" height="58" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="112.0" y="354.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:16px">Ester</text><text x="112.0" y="373.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">RCOOR&#x27;</text><text x="310.0" y="364.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">RO⁻   pKₐ ≈ 16</text><text x="575.0" y="364.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">significant</text><text x="778.0" y="364.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">~1735</text><rect x="96" y="396" width="748" height="58" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="112.0" y="422.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:16px">Amide</text><text x="112.0" y="441.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">RCONR₂</text><text x="310.0" y="432.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">R₂N⁻   pKₐ ≈ 38</text><text x="575.0" y="432.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">strongest</text><text x="778.0" y="432.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">~1650–1690</text><line x1="72" y1="130" x2="72" y2="446" stroke="#18364a" stroke-width="3" marker-end="url(#m945)"/><text x="56.0" y="150.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">more</text><text x="56.0" y="166.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">reactive</text><rect x="60" y="470" width="780" height="86" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="450.0" y="498.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:18px">Interconversion runs downhill only</text><text x="450.0" y="522.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">acyl chloride → anhydride → ester → amide happens on contact with the right nucleophile.</text><text x="450.0" y="544.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Climbing back up needs an activating reagent such as SOCl₂ or PCl₅ — or, in a cell, ATP.</text></svg>