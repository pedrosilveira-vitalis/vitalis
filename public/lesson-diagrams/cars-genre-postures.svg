<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="776" viewBox="0 0 1120 776" role="img" aria-labelledby="t d"><title id="t">Four genres, four postures — decided in the first thirty seconds</title><desc id="d">Four columns, one per CARS genre. Humanities, covering philosophy, ethics, literary criticism, art history and the history of ideas: recognised by names of thinkers appearing early, heavy qualification, and a thesis that may wait until the second or third paragraph; the posture is to map the argument&#x27;s skeleton, labelling each paragraph as thesis, counterargument, rebuttal, evidence or qualification; expect main idea, attitude, strengthen and weaken, application and inference questions; the trap is choosing what is true in the world over what the author argues. Social science, covering sociology, economics, psychology, anthropology and political science: recognised by clear topic sentences, studies and statistics, causal language and hedged conclusions; the posture is to find the phenomenon and the explanatory framework and to watch the difference between associated with and causes; expect causal reasoning, comparison, evidence evaluation and extrapolation questions; the trap is over-inferring, since an answer stronger than the author&#x27;s own claim is wrong. Writing about science, covering the history and philosophy of science, science policy and technology and culture, and still humanities or social science rather than a science passage: recognised by an account of a theory&#x27;s development or challenge, ethical or epistemic implications, and no data to analyse; the posture is to suppress the science brain and read the author&#x27;s interpretation rather than the science; expect perspective, assumption, application and implication questions; the trap is using outside science knowledge, because an answer can be scientifically accurate and still unsupported and therefore wrong. Narrative or personal essay, covering memoir, creative nonfiction and literary journalism: recognised by first person, sensory detail and scene, short paragraphs and no stated thesis; the posture is to read inference-forward because the claim is implicit and usually lands in the last paragraph; expect implicit argument, function of a detail, tone, and inference about values; the trap is reading the story as only a story rather than as the vehicle for a claim. A footer gives the loop, which runs the same whatever the genre: orient for about thirty seconds, read strategically for four to five minutes, consolidate for about thirty seconds by saying the author&#x27;s argument in one sentence, and answer for three to four minutes, returning to the passage rather than to memory whenever two choices remain.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1120" height="776" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Four genres, four postures — decided in the first thirty seconds</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Identifying the genre is worth nothing by itself. It is worth a great deal because it tells you how to read what follows.</text><rect x="20" y="106" width="266" height="536" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="153.0" y="132.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:13.5px">HUMANITIES</text><text x="153.0" y="156.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">philosophy, ethics, literary</text><text x="153.0" y="169.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">criticism, art history, the history of</text><text x="153.0" y="182.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">ideas</text><text x="153.0" y="228.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">the tell, in 30 seconds</text><text x="153.0" y="248.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">names of thinkers early · heavy</text><text x="153.0" y="262.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">qualification · thesis may wait</text><text x="153.0" y="276.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">until ¶2 or ¶3</text><line x1="44" y1="330" x2="262" y2="330" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="153.0" y="352.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:10.5px">the posture</text><text x="153.0" y="372.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">Map the argument&#x27;s skeleton.</text><text x="153.0" y="387.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">Label each paragraph T / CA / R</text><text x="153.0" y="402.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">/ E / Q.</text><line x1="44" y1="452" x2="262" y2="452" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="153.0" y="474.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">what the questions ask</text><text x="153.0" y="494.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">main idea · attitude ·</text><text x="153.0" y="508.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">strengthen–weaken · application ·</text><text x="153.0" y="522.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">inference</text><line x1="44" y1="554" x2="262" y2="554" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="153.0" y="576.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:10.5px">the trap</text><text x="153.0" y="596.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">Choosing what is true in the world</text><text x="153.0" y="610.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">over what the author argues.</text><rect x="296" y="106" width="266" height="536" rx="12" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="429.0" y="132.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:13.5px">SOCIAL SCIENCE</text><text x="429.0" y="156.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">sociology, economics, psychology,</text><text x="429.0" y="169.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">anthropology, political science</text><text x="429.0" y="228.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">the tell, in 30 seconds</text><text x="429.0" y="248.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">clear topic sentences · studies</text><text x="429.0" y="262.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">and statistics · causal language ·</text><text x="429.0" y="276.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">hedged conclusions</text><line x1="320" y1="330" x2="538" y2="330" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="429.0" y="352.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:10.5px">the posture</text><text x="429.0" y="372.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">Find the phenomenon and the</text><text x="429.0" y="387.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">explanatory framework. Watch</text><text x="429.0" y="402.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">“associated with” vs “causes”.</text><line x1="320" y1="452" x2="538" y2="452" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="429.0" y="474.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">what the questions ask</text><text x="429.0" y="494.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">causal reasoning · comparison ·</text><text x="429.0" y="508.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">evidence evaluation ·</text><text x="429.0" y="522.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">extrapolation</text><line x1="320" y1="554" x2="538" y2="554" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="429.0" y="576.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:10.5px">the trap</text><text x="429.0" y="596.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">Over-inferring. An answer stronger</text><text x="429.0" y="610.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">than the author&#x27;s own claim is</text><text x="429.0" y="624.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">wrong.</text><rect x="572" y="106" width="266" height="536" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="705.0" y="132.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:13.5px">WRITING ABOUT SCIENCE</text><text x="705.0" y="156.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">history and philosophy of science,</text><text x="705.0" y="169.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">science policy, technology and culture</text><text x="705.0" y="182.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">— still humanities or social science</text><text x="705.0" y="228.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">the tell, in 30 seconds</text><text x="705.0" y="248.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">a theory&#x27;s development or</text><text x="705.0" y="262.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">challenge · ethical or epistemic</text><text x="705.0" y="276.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">implications · no data to analyse</text><line x1="596" y1="330" x2="814" y2="330" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="705.0" y="352.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:10.5px">the posture</text><text x="705.0" y="372.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">Suppress the science brain. Read</text><text x="705.0" y="387.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">the author&#x27;s interpretation, not</text><text x="705.0" y="402.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">the science.</text><line x1="596" y1="452" x2="814" y2="452" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="705.0" y="474.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">what the questions ask</text><text x="705.0" y="494.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">perspective · assumption ·</text><text x="705.0" y="508.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">application · implication</text><line x1="596" y1="554" x2="814" y2="554" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="705.0" y="576.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:10.5px">the trap</text><text x="705.0" y="596.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">Using outside science knowledge.</text><text x="705.0" y="610.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">Accurate but unsupported is still</text><text x="705.0" y="624.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">wrong.</text><rect x="848" y="106" width="266" height="536" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="981.0" y="132.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:13.5px">NARRATIVE / ESSAY</text><text x="981.0" y="156.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">memoir, personal essay, creative</text><text x="981.0" y="169.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">nonfiction, literary journalism</text><text x="981.0" y="228.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">the tell, in 30 seconds</text><text x="981.0" y="248.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">first person · sensory detail and</text><text x="981.0" y="262.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">scene · short paragraphs · no</text><text x="981.0" y="276.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">stated thesis</text><line x1="872" y1="330" x2="1090" y2="330" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="981.0" y="352.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:10.5px">the posture</text><text x="981.0" y="372.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">Read inference-forward. The</text><text x="981.0" y="387.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">claim is implicit — and usually</text><text x="981.0" y="402.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">lands in the last paragraph.</text><line x1="872" y1="452" x2="1090" y2="452" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="981.0" y="474.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">what the questions ask</text><text x="981.0" y="494.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">implicit argument · function of a</text><text x="981.0" y="508.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">detail · tone · inference about</text><text x="981.0" y="522.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">values</text><line x1="872" y1="554" x2="1090" y2="554" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="981.0" y="576.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:10.5px">the trap</text><text x="981.0" y="596.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">Reading the story as only a story,</text><text x="981.0" y="610.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">rather than as the vehicle for a</text><text x="981.0" y="624.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11.5px">claim.</text><rect x="20" y="662" width="1080" height="100" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="560.0" y="692.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13.5px">The loop runs the same whatever the genre</text><text x="560.0" y="713.5" class="" text-anchor="middle" style="font-size:12px">Orient ~30 s — first sentence, last sentence of ¶1, scan, label the genre. Read ~4–5 min with that lens, annotating function</text><text x="560.0" y="730.5" class="" text-anchor="middle" style="font-size:12px">rather than content. Consolidate ~30 s — say the argument in one sentence. Answer 3–4 min, and when two choices remain, go</text><text x="560.0" y="747.5" class="" text-anchor="middle" style="font-size:12px">back to the passage rather than to memory.</text></svg>