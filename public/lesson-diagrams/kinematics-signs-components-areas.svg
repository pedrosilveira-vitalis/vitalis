<svg xmlns="http://www.w3.org/2000/svg" width="920" height="850" viewBox="0 0 920 850" role="img" aria-labelledby="t d"><title id="t">Kinematics: signs, projectile components, and graph areas</title><desc id="d">Four panels. Top left: g equals 9.8 metres per second squared as a positive magnitude, with a equal to minus g when up is positive and plus g when down is positive, and a note that acceleration is still minus g at the peak. Top right: a projectile parabola showing that the horizontal velocity arrows stay the same length while the vertical arrow shrinks to zero at the peak and grows downward after it. Middle: the symmetric-flight formulas for time of flight, range and maximum height. Bottom: a velocity-versus-time graph in three phases whose slopes give accelerations of 5, 0 and minus 10 metres per second squared and whose areas give displacements of 40, 80 and 20 metres, totalling 140 metres.</desc><defs><marker id="m3701" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker><marker id="m7647" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b7a64"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="850" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Kinematics: signs, projectile components, and graph areas</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">g is a positive magnitude; the sign comes from the axis you choose</text><rect x="40" y="112" width="258" height="306" rx="12" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="169.0" y="142.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:17px">Signs come from your axis</text><rect x="58" y="160" width="222" height="48" rx="9" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="169.0" y="190.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">g = 9.8 ≈ 10 m/s²</text><text x="169.0" y="228.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">always a positive magnitude</text><text x="169.0" y="262.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">up positive:</text><text x="169.0" y="286.0" class="" text-anchor="middle" style="fill:#18364a;font-size:17px">a = −g = −10 m/s²</text><text x="169.0" y="316.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">down positive:</text><text x="169.0" y="340.0" class="" text-anchor="middle" style="fill:#18364a;font-size:17px">a = +g = +10 m/s²</text><rect x="58" y="356" width="222" height="48" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="169.0" y="386.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">At the peak v = 0, a = −10</text><rect x="318" y="112" width="562" height="306" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="599.0" y="142.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">Horizontal and vertical motion are independent</text><line x1="348" y1="330" x2="852" y2="330" stroke="#6d716f" stroke-width="2"/><path d="M380 330.0 L390 316.4 L400 303.4 L410 291.1 L420 279.6 L430 268.8 L440 258.6 L450 249.2 L460 240.4 L470 232.3 L480 225.0 L490 218.4 L500 212.4 L510 207.1 L520 202.6 L530 198.8 L540 195.6 L550 193.2 L560 191.4 L570 190.3 L580 190.0 L590 190.3 L600 191.4 L610 193.2 L620 195.6 L630 198.8 L640 202.6 L650 207.1 L660 212.4 L670 218.4 L680 225.0 L690 232.3 L700 240.4 L710 249.2 L720 258.6 L730 268.8 L740 279.6 L750 291.1 L760 303.4 L770 316.4 L780 330.0" stroke="#18364a" stroke-width="3" fill="none"/><line x1="380" y1="328" x2="436" y2="328" stroke="#245574" stroke-width="2.5" marker-end="url(#m3701)"/><line x1="580" y1="188" x2="636" y2="188" stroke="#245574" stroke-width="2.5" marker-end="url(#m3701)"/><line x1="780" y1="328" x2="836" y2="328" stroke="#245574" stroke-width="2.5" marker-end="url(#m3701)"/><text x="408.0" y="316.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">vₓ</text><text x="608.0" y="176.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">vₓ</text><text x="808.0" y="316.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">vₓ</text><line x1="380" y1="330" x2="380" y2="264" stroke="#5b7a64" stroke-width="2.5" marker-end="url(#m7647)"/><text x="366.0" y="294.0" class="" text-anchor="end" style="fill:#5b7a64;font-weight:bold;font-size:15px">vᵧ</text><circle cx="580" cy="190" r="6" fill="#5b7a64" stroke="#5b7a64" stroke-width="2"/><text x="580.0" y="166.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">vᵧ = 0</text><line x1="780" y1="264" x2="780" y2="330" stroke="#5b7a64" stroke-width="2.5" marker-end="url(#m7647)"/><text x="766.0" y="294.0" class="" text-anchor="end" style="fill:#5b7a64;font-weight:bold;font-size:15px">vᵧ</text><text x="380.0" y="352.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">launch</text><text x="580.0" y="352.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">peak</text><text x="780.0" y="352.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">landing</text><line x1="348" y1="378" x2="384" y2="378" stroke="#245574" stroke-width="3"/><text x="394.0" y="383.0" class="" text-anchor="start" style="font-size:15px">vₓ = v₀cosθ  — never changes, aₓ = 0</text><line x1="348" y1="404" x2="384" y2="404" stroke="#5b7a64" stroke-width="3"/><text x="394.0" y="409.0" class="" text-anchor="start" style="font-size:15px">vᵧ = v₀sinθ − gt  — changes at −g</text><rect x="40" y="436" width="840" height="76" rx="12" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="460.0" y="464.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">Equal launch and landing height only</text><text x="174.0" y="492.0" class="" text-anchor="middle" style="fill:#18364a;font-size:16px">T = 2v₀sinθ / g</text><text x="460.0" y="492.0" class="" text-anchor="middle" style="fill:#18364a;font-size:16px">R = v₀² sin2θ / g</text><text x="746.0" y="492.0" class="" text-anchor="middle" style="fill:#18364a;font-size:16px">H = (v₀sinθ)² / 2g</text><text x="60.0" y="548.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:17px">Slope of a v–t graph = acceleration;  area under it = displacement</text><line x1="108" y1="774" x2="508" y2="774" stroke="#18364a" stroke-width="2"/><line x1="108" y1="578" x2="108" y2="774" stroke="#18364a" stroke-width="2"/><text x="308.0" y="818.0" class="" text-anchor="middle" style="font-size:17px">time t (s)</text><text x="64" y="676.0" text-anchor="middle" transform="rotate(-90 64 676.0)" style="font-size:17px">velocity v (m/s)</text><line x1="108.0" y1="774.0" x2="108.0" y2="780.0" stroke="#18364a" stroke-width="2"/><text x="108.0" y="796.0" class="" text-anchor="middle" style="font-size:14px">0</text><line x1="188.0" y1="774.0" x2="188.0" y2="780.0" stroke="#18364a" stroke-width="2"/><text x="188.0" y="796.0" class="" text-anchor="middle" style="font-size:14px">2</text><line x1="268.0" y1="774.0" x2="268.0" y2="780.0" stroke="#18364a" stroke-width="2"/><text x="268.0" y="796.0" class="" text-anchor="middle" style="font-size:14px">4</text><line x1="348.0" y1="774.0" x2="348.0" y2="780.0" stroke="#18364a" stroke-width="2"/><text x="348.0" y="796.0" class="" text-anchor="middle" style="font-size:14px">6</text><line x1="428.0" y1="774.0" x2="428.0" y2="780.0" stroke="#18364a" stroke-width="2"/><text x="428.0" y="796.0" class="" text-anchor="middle" style="font-size:14px">8</text><line x1="508.0" y1="774.0" x2="508.0" y2="780.0" stroke="#18364a" stroke-width="2"/><text x="508.0" y="796.0" class="" text-anchor="middle" style="font-size:14px">10</text><line x1="102.0" y1="774.0" x2="108.0" y2="774.0" stroke="#18364a" stroke-width="2"/><text x="98.0" y="779.0" class="" text-anchor="end" style="font-size:14px">0</text><line x1="102.0" y1="692.3333333333334" x2="108.0" y2="692.3333333333334" stroke="#18364a" stroke-width="2"/><text x="98.0" y="697.3" class="" text-anchor="end" style="font-size:14px">10</text><line x1="102.0" y1="610.6666666666666" x2="108.0" y2="610.6666666666666" stroke="#18364a" stroke-width="2"/><text x="98.0" y="615.7" class="" text-anchor="end" style="font-size:14px">20</text><path d="M108.0 774.0 L268.0 610.7 L428.0 610.7 L508.0 774.0 Z" stroke="#987740" stroke-width="0" fill="#f1eadc"/><path d="M108.0 774.0 L268.0 610.7 L428.0 610.7 L508.0 774.0" stroke="#987740" stroke-width="3" fill="none"/><line x1="268.0" y1="774.0" x2="268.0" y2="610.6666666666666" stroke="#6d716f" stroke-width="1" stroke-dasharray="6 5"/><line x1="428.0" y1="774.0" x2="428.0" y2="610.6666666666666" stroke="#6d716f" stroke-width="1" stroke-dasharray="6 5"/><text x="188.0" y="716.8" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">40 m</text><text x="348.0" y="700.5" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">80 m</text><text x="468.0" y="737.2" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">20 m</text><rect x="556" y="578" width="324" height="196" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="574.0" y="604.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:15px">0 – 4 s</text><text x="862.0" y="604.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:15px">½·4·20 = 40 m</text><text x="574.0" y="626.0" class="" text-anchor="start" style="fill:#6d716f;font-size:14px">a = (20−0)/4 = +5 m/s²</text><text x="574.0" y="652.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:15px">4 – 8 s</text><text x="862.0" y="652.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:15px">4·20 = 80 m</text><text x="574.0" y="674.0" class="" text-anchor="start" style="fill:#6d716f;font-size:14px">a = 0 m/s²</text><text x="574.0" y="700.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:15px">8 – 10 s</text><text x="862.0" y="700.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:15px">½·2·20 = 20 m</text><text x="574.0" y="722.0" class="" text-anchor="start" style="fill:#6d716f;font-size:14px">a = (0−20)/2 = −10 m/s²</text><line x1="574" y1="738" x2="862" y2="738" stroke="#987740" stroke-width="2"/><text x="574.0" y="762.0" class="" text-anchor="start" style="fill:#18364a;font-size:15px">total displacement</text><text x="862.0" y="762.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:16px">140 m</text></svg>