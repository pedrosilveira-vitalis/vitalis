<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="940" viewBox="0 0 1180 940" role="img" aria-labelledby="t d"><title id="t">One basis, every concentration unit</title><desc id="d">A conversion chart. Across the top, five concentration units as cards. Molarity: moles of solute over litres of solution, units molar, temperature dependent because volume expands, and the unit required by equilibrium constants, Beer-Lambert and osmotic pressure. Molality: moles of solute over kilograms of solvent, units molal, temperature independent, and the unit required by boiling point elevation and freezing point depression. Mole fraction: moles of one component over total moles, dimensionless, temperature independent, and the unit required by Raoult&#x27;s law and Dalton&#x27;s law. Mass percent: mass of solute over mass of solution times one hundred, temperature independent, and how concentrated laboratory acids are labelled. Parts per million: for aqueous solutions one part per million is one milligram per litre, used for trace contaminants. In the middle, the master strategy: choose a basis, either one hundred grams of solution when a mass percent is given, or one litre of solution when a molarity is given, then fill in six quantities — mass of solution, mass of solute, mass of solvent, moles of solute, moles of solvent and volume of solution — using density to move between mass and volume and molar mass to move between mass and moles. Every unit is then a ratio of two of those six numbers. A worked example takes twenty per cent by mass ethanol of density 0.968 grams per millilitre on a basis of one hundred grams: twenty grams of ethanol is 0.434 moles, eighty grams of water is 4.44 moles, the volume is 103.3 millilitres, so the molarity is 4.20, the molality is 5.43 and the mole fraction of ethanol is 0.0891. The molarity and the molality differ by nearly thirty per cent, and the reason is that the solute carries 194 grams of every litre, not that the density differs from one. A final panel matches each formula to the unit it requires.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1180" height="940" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">One basis, every concentration unit</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Pick 100 g of solution or 1 L of solution, fill in six numbers, and read any unit straight off. Density bridges mass to volume; molar mass bridges mass to moles.</text><rect x="24" y="142" width="212" height="180" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="130.0" y="168.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12.5px">MOLARITY  M</text><text x="130.0" y="200.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">mol solute</text><line x1="60" y1="208" x2="200" y2="208" stroke="#18364a" stroke-width="1.5"/><text x="130.0" y="226.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">L SOLUTION</text><text x="130.0" y="250.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">mol/L</text><text x="130.0" y="272.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:11px">changes with T</text><text x="130.0" y="292.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">Kₑq · Beer-Lambert · π = iMRT</text><text x="130.0" y="305.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">· M₁V₁ = M₂V₂</text><rect x="254" y="142" width="212" height="180" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="360.0" y="168.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12.5px">MOLALITY  m</text><text x="360.0" y="200.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">mol solute</text><line x1="290" y1="208" x2="430" y2="208" stroke="#18364a" stroke-width="1.5"/><text x="360.0" y="226.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">kg SOLVENT</text><text x="360.0" y="250.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">mol/kg</text><text x="360.0" y="272.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:11px">T-independent</text><text x="360.0" y="292.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">ΔTᵇ = iKᵇm · ΔTᶠ = iKᶠm</text><rect x="484" y="142" width="212" height="180" rx="12" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="590.0" y="168.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:12.5px">MOLE FRACTION  χ</text><text x="590.0" y="200.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">mol of one part</text><line x1="520" y1="208" x2="660" y2="208" stroke="#18364a" stroke-width="1.5"/><text x="590.0" y="226.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">mol TOTAL</text><text x="590.0" y="250.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">none</text><text x="590.0" y="272.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:11px">T-independent</text><text x="590.0" y="292.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">Raoult · Dalton · sums to 1</text><rect x="714" y="142" width="212" height="180" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="820.0" y="168.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:12.5px">MASS PERCENT  % w/w</text><text x="820.0" y="200.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">mass solute</text><line x1="750" y1="208" x2="890" y2="208" stroke="#18364a" stroke-width="1.5"/><text x="820.0" y="226.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">mass SOLUTION</text><text x="820.0" y="250.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">× 100</text><text x="820.0" y="272.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:11px">T-independent</text><text x="820.0" y="292.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">how bottled acids are labelled</text><rect x="944" y="142" width="212" height="180" rx="12" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="1050.0" y="168.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:700;font-size:12.5px">ppm / ppb</text><text x="1050.0" y="200.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">mass solute</text><line x1="980" y1="208" x2="1120" y2="208" stroke="#18364a" stroke-width="1.5"/><text x="1050.0" y="226.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">mass SOLUTION</text><text x="1050.0" y="250.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">×10⁶ / ×10⁹</text><text x="1050.0" y="272.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:700;font-size:11px">T-independent</text><text x="1050.0" y="292.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">aqueous: 1 ppm = 1 mg/L</text><rect x="24" y="346" width="1128" height="196" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="588.0" y="374.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13.5px">THE MASTER STRATEGY — PICK A BASIS, FILL IN SIX NUMBERS</text><text x="588.0" y="396.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11.5px">given a mass percent → take 100 g of SOLUTION    ·    given a molarity → take 1 L of SOLUTION</text><text x="56.0" y="432.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">□  mass of solution</text><text x="78.0" y="452.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">basis, or d × V</text><text x="424.0" y="432.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">□  mass of solute</text><text x="446.0" y="452.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">from % w/w</text><text x="792.0" y="432.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">□  mass of solvent</text><text x="814.0" y="452.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">solution − solute</text><text x="56.0" y="486.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">□  moles of solute</text><text x="78.0" y="506.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">÷ molar mass</text><text x="424.0" y="486.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">□  moles of solvent</text><text x="446.0" y="506.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">÷ molar mass</text><text x="792.0" y="486.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12.5px">□  volume of solution</text><text x="814.0" y="506.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">mass ÷ density</text><text x="588.0" y="528.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">every unit above is a ratio of two of these six — nothing else is needed</text><rect x="24" y="566" width="660" height="244" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="354.0" y="594.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:12.5px">WORKED — 20.0% w/w ETHANOL, d = 0.968 g/mL, basis 100 g</text><text x="50.0" y="626.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11.5px">ethanol</text><text x="210.0" y="626.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:12px">20.0 g</text><text x="330.0" y="626.0" class="" text-anchor="end" style="fill:#6d716f;font-size:11px">÷ 46.07</text><text x="470.0" y="626.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:12px">0.434 mol</text><text x="50.0" y="652.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11.5px">water</text><text x="210.0" y="652.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:12px">80.0 g</text><text x="330.0" y="652.0" class="" text-anchor="end" style="fill:#6d716f;font-size:11px">÷ 18.02</text><text x="470.0" y="652.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:12px">4.440 mol</text><text x="50.0" y="678.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11.5px">solution</text><text x="210.0" y="678.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:12px">100 g</text><text x="330.0" y="678.0" class="" text-anchor="end" style="fill:#6d716f;font-size:11px">÷ 0.968</text><text x="470.0" y="678.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:12px">103.3 mL</text><line x1="50" y1="712" x2="658" y2="712" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="50.0" y="730.0" class="" text-anchor="start" style="fill:#987740;font-weight:700;font-size:12px">M</text><text x="86.0" y="730.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12px">0.434 / 0.1033 L  =  4.20 M</text><text x="50.0" y="751.0" class="" text-anchor="start" style="fill:#987740;font-weight:700;font-size:12px">m</text><text x="86.0" y="751.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12px">0.434 / 0.0800 kg  =  5.43 m</text><text x="50.0" y="772.0" class="" text-anchor="start" style="fill:#987740;font-weight:700;font-size:12px">χ</text><text x="86.0" y="772.0" class="" text-anchor="start" style="fill:#18364a;font-weight:700;font-size:12px">0.434 / 4.874  =  0.0891</text><text x="354.0" y="796.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:11px">M and m differ by 29% because the solute is 194 g of every litre — not because d ≠ 1</text><rect x="708" y="566" width="444" height="244" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="930.0" y="594.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12.5px">WHICH FORMULA WANTS WHICH UNIT</text><text x="732.0" y="622.0" class="" text-anchor="start" style="fill:#18364a;font-size:11.5px">ΔTᵇ, ΔTᶠ  (bp, fp)</text><text x="1128.0" y="622.0" class="" text-anchor="end" style="fill:#245574;font-weight:700;font-size:11.5px">molality</text><text x="732.0" y="646.0" class="" text-anchor="start" style="fill:#18364a;font-size:11.5px">π = iMRT</text><text x="1128.0" y="646.0" class="" text-anchor="end" style="fill:#245574;font-weight:700;font-size:11.5px">molarity</text><text x="732.0" y="670.0" class="" text-anchor="start" style="fill:#18364a;font-size:11.5px">Raoult, Dalton</text><text x="1128.0" y="670.0" class="" text-anchor="end" style="fill:#245574;font-weight:700;font-size:11.5px">mole fraction</text><text x="732.0" y="694.0" class="" text-anchor="start" style="fill:#18364a;font-size:11.5px">A = εlc</text><text x="1128.0" y="694.0" class="" text-anchor="end" style="fill:#245574;font-weight:700;font-size:11.5px">molarity</text><text x="732.0" y="718.0" class="" text-anchor="start" style="fill:#18364a;font-size:11.5px">Kₐ, Kᵇ, Kₛₚ, Kᴄ</text><text x="1128.0" y="718.0" class="" text-anchor="end" style="fill:#245574;font-weight:700;font-size:11.5px">molarity</text><text x="732.0" y="742.0" class="" text-anchor="start" style="fill:#18364a;font-size:11.5px">M₁V₁ = M₂V₂</text><text x="1128.0" y="742.0" class="" text-anchor="end" style="fill:#245574;font-weight:700;font-size:11.5px">molarity</text><text x="732.0" y="766.0" class="" text-anchor="start" style="fill:#18364a;font-size:11.5px">Henderson–Hasselbalch</text><text x="1128.0" y="766.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:700;font-size:11.5px">a MOLE ratio</text><text x="930.0" y="796.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:10.5px">volume cancels in H–H, so moles work — masses do not</text><rect x="24" y="832" width="1128" height="92" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="588.0" y="862.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13.5px">The two bridges, and the one that gets forgotten</text><text x="588.0" y="883.5" class="" text-anchor="middle" style="font-size:12px">DENSITY moves mass ↔ volume (g/mL = kg/L). MOLAR MASS moves mass ↔ moles. Everything else is bookkeeping. The forgotten one: molality is per kilogram</text><text x="588.0" y="900.5" class="" text-anchor="middle" style="font-size:12px">of SOLVENT, molarity per litre of SOLUTION — in a concentrated solution those are very different denominators.</text></svg>