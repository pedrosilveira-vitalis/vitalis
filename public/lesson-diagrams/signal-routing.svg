<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820" role="img" aria-labelledby="title desc"><title id="title">One lipid splits into two messages</title><desc id="desc">PLC beta cleaves PIP2. DAG stays in the plasma membrane and IP3 travels to the ER calcium channel. Released calcium and membrane DAG activate conventional PKC, while calcium-calmodulin has other targets.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#245574"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#18364a;font-size:18px}.h{font-size:25px;font-weight:700}.s{font-size:15px}.label{font-size:20px;font-weight:600}.line{stroke:#245574;stroke-width:3;fill:none}.arrow{stroke:#245574;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect width="900" height="820" rx="22" fill="#fbf7ef"/><text x="32" y="45" class="h" text-anchor="start">One lipid, two different destinations</text><text x="32" y="75" class="label" text-anchor="start">Gq → PLCβ → IP₃ + DAG</text><rect x="35" y="145" width="830" height="55" rx="5" fill="#c6d9e5" stroke="#b6cbd8"/><text x="290" y="123" class="s" text-anchor="start">EXTRACELLULAR SPACE</text><text x="45" y="233" class="s" text-anchor="start">CYTOSOL</text><rect x="100" y="135" width="12" height="75" rx="6" fill="#245574" stroke="#b6cbd8"/><rect x="123" y="135" width="12" height="75" rx="6" fill="#245574" stroke="#b6cbd8"/><rect x="146" y="135" width="12" height="75" rx="6" fill="#245574" stroke="#b6cbd8"/><rect x="169" y="135" width="12" height="75" rx="6" fill="#245574" stroke="#b6cbd8"/><rect x="192" y="135" width="12" height="75" rx="6" fill="#245574" stroke="#b6cbd8"/><rect x="215" y="135" width="12" height="75" rx="6" fill="#245574" stroke="#b6cbd8"/><rect x="238" y="135" width="12" height="75" rx="6" fill="#245574" stroke="#b6cbd8"/><path d="M106 135 Q117 110 129 135 M129 210 Q140 235 152 210 M152 135 Q163 110 175 135 M175 210 Q186 235 198 210 M198 135 Q209 110 221 135 M221 210 Q232 235 244 210" class="line"/><circle cx="165" cy="104" r="13" fill="#e4eef3" stroke="#245574" stroke-width="2"/><text x="165" y="262" class="s" text-anchor="middle">Gq receptor</text><rect x="110" y="290" width="120" height="45" rx="12" fill="#e4eef3" stroke="#b6cbd8"/><text x="170" y="319" class="" text-anchor="middle">Gαq–GTP</text><path d="M170 269 V284" class="arrow"/><rect x="295" y="290" width="120" height="45" rx="12" fill="#e4eef3" stroke="#b6cbd8"/><text x="355" y="319" class="" text-anchor="middle">PLCβ</text><path d="M237 312 H289" class="arrow"/><circle cx="490" cy="173" r="27" fill="#e4eef3" stroke="#245574" stroke-width="2"/><text x="490" y="180" class="s" text-anchor="middle">PIP₂</text><path d="M405 290 L465 205" class="arrow"/><circle cx="710" cy="173" r="28" fill="#e4eef3" stroke="#245574" stroke-width="2"/><text x="710" y="180" class="" text-anchor="middle">DAG</text><path d="M525 173 H671" class="arrow"/><text x="710" y="240" class="s" text-anchor="middle">Stays in membrane</text><path d="M495 205 V352" class="arrow"/><circle cx="495" cy="389" r="28" fill="#e4eef3" stroke="#245574" stroke-width="2"/><text x="495" y="396" class="" text-anchor="middle">IP₃</text><text x="495" y="436" class="s" text-anchor="middle">Diffuses in cytosol</text><rect x="60" y="490" width="490" height="125" rx="24" fill="#e4eef3" stroke="#b6cbd8"/><text x="88" y="534" class="label" text-anchor="start">ER lumen</text><text x="88" y="565" class="" text-anchor="start">Ca²⁺ store</text><rect x="440" y="478" width="46" height="50" rx="5" fill="#245574" stroke="#b6cbd8"/><path d="M495 421 L466 470" class="arrow"/><text x="550" y="500" class="s" text-anchor="start">IP₃ receptor</text><text x="550" y="522" class="s" text-anchor="start">opens ER channel</text><path d="M465 537 V663" class="arrow"/><text x="486" y="638" class="label" text-anchor="start">Ca²⁺</text><rect x="670" y="300" width="160" height="60" rx="12" fill="#e4eef3" stroke="#b6cbd8"/><text x="750" y="326" class="" text-anchor="middle">Conventional</text><text x="750" y="350" class="" text-anchor="middle">PKC</text><path d="M710 208 V290" class="arrow"/><path d="M490 650 H740 V370" class="arrow"/><text x="803" y="414" class="s" text-anchor="middle">DAG + Ca²⁺</text><path d="M450 666 H260" class="arrow"/><rect x="80" y="651" width="170" height="60" rx="12" fill="#e4eef3" stroke="#b6cbd8"/><text x="165" y="678" class="" text-anchor="middle">Ca²⁺–calmodulin</text><text x="165" y="700" class="s" text-anchor="middle">→ CaMK / MLCK</text><text x="32" y="763" class="s" text-anchor="start">Conventional PKC needs Ca²⁺ and DAG. Novel PKC needs DAG, not Ca²⁺.</text><text x="32" y="792" class="s" text-anchor="start">Atypical PKC responds to neither. Diagram shows selected branches, not all regulation.</text></svg>