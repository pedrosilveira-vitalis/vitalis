<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">Read a Mendelian cross</title><desc id="desc">A two by two Punnett square combines equally probable T and t gametes. TT, Tt, Tt and tt produce an expected three to one phenotype ratio. Independent phenotype probabilities multiply in a dihybrid cross.</desc><rect width="800" height="740" rx="20" fill="#fbf7ef"/><style>text{font-family:Arial,sans-serif;fill:#18364a;font-size:18px}.h{font-size:25px;font-weight:700}.small{font-size:16px}</style><text x="32" y="44" class="h" text-anchor="start">One cross. Four possible gamete pairs.</text><text x="32" y="76" class="small" text-anchor="start">Tt × Tt • complete dominance • equal viability</text><text x="200" y="115" class="" text-anchor="middle">T (½)</text><text x="90" y="180" class="" text-anchor="middle">T (½)</text><text x="310" y="115" class="" text-anchor="middle">t (½)</text><text x="90" y="270" class="" text-anchor="middle">t (½)</text><rect x="145" y="135" width="110" height="90" fill="#dce9f0" stroke="#245574" stroke-width="2"/><text x="200" y="173" class="h" text-anchor="middle">TT</text><text x="200" y="201" class="small" text-anchor="middle">¼</text><rect x="255" y="135" width="110" height="90" fill="#dce9f0" stroke="#245574" stroke-width="2"/><text x="310" y="173" class="h" text-anchor="middle">Tt</text><text x="310" y="201" class="small" text-anchor="middle">¼</text><rect x="145" y="225" width="110" height="90" fill="#dce9f0" stroke="#245574" stroke-width="2"/><text x="200" y="263" class="h" text-anchor="middle">Tt</text><text x="200" y="291" class="small" text-anchor="middle">¼</text><rect x="255" y="225" width="110" height="90" fill="#ffffff" stroke="#245574" stroke-width="2"/><text x="310" y="263" class="h" text-anchor="middle">tt</text><text x="310" y="291" class="small" text-anchor="middle">¼</text><text x="415" y="165" class="h" text-anchor="start">Genotypes</text><text x="415" y="199" class="" text-anchor="start">¼ TT + ½ Tt + ¼ tt</text><text x="415" y="247" class="h" text-anchor="start">Phenotypes</text><text x="415" y="281" class="" text-anchor="start">¾ tall + ¼ short</text><text x="40" y="352" class="small" text-anchor="start">Four offspring need not include exactly one short plant.</text><path d="M32 378 H768" stroke="#245574" stroke-width="2" fill="none"/><text x="32" y="417" class="h" text-anchor="start">Two independent traits: follow each branch</text><text x="45" y="464" class="" text-anchor="start">Shape</text><text x="280" y="464" class="" text-anchor="start">Color</text><text x="555" y="464" class="" text-anchor="start">Combined probability</text><text x="45" y="515" class="" text-anchor="start">Round (¾)</text><path d="M175 510 L250 490" stroke="#245574" stroke-width="2" fill="none"/><text x="265" y="495" class="" text-anchor="start">Yellow (¾)</text><path d="M390 490 H530" stroke="#245574" stroke-width="2" fill="none"/><text x="560" y="495" class="" text-anchor="start">9/16</text><path d="M175 510 L250 545" stroke="#245574" stroke-width="2" fill="none"/><text x="265" y="550" class="" text-anchor="start">Green (¼)</text><path d="M390 545 H530" stroke="#245574" stroke-width="2" fill="none"/><text x="560" y="550" class="" text-anchor="start">3/16</text><text x="45" y="635" class="" text-anchor="start">Wrinkled (¼)</text><path d="M175 630 L250 610" stroke="#245574" stroke-width="2" fill="none"/><text x="265" y="615" class="" text-anchor="start">Yellow (¾)</text><path d="M390 610 H530" stroke="#245574" stroke-width="2" fill="none"/><text x="560" y="615" class="" text-anchor="start">3/16</text><path d="M175 630 L250 665" stroke="#245574" stroke-width="2" fill="none"/><text x="265" y="670" class="" text-anchor="start">Green (¼)</text><path d="M390 665 H530" stroke="#245574" stroke-width="2" fill="none"/><text x="560" y="670" class="" text-anchor="start">1/16</text><text x="32" y="718" class="small" text-anchor="start">Assumes independent assortment, complete dominance, no epistasis and equal viability.</text></svg>