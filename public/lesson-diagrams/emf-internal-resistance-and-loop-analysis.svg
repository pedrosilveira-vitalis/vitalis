<svg xmlns="http://www.w3.org/2000/svg" width="920" height="800" viewBox="0 0 920 800" role="img" aria-labelledby="t d"><title id="t">A real battery keeps part of its voltage for itself</title><desc id="d">Top left: a battery drawn as an ideal EMF in series with its internal resistance, feeding an external resistor; the terminal voltage is measured across the terminals and is less than the EMF whenever current flows. Top right: terminal voltage plotted against current, a straight line starting at the EMF when no current is drawn and falling with slope minus r until it reaches zero at the short-circuit current epsilon over r. Middle: the worked twelve volt example with half an ohm internal and five and a half ohms external, giving two amps, eleven volts at the terminals, twenty-two watts delivered and two watts wasted inside. Bottom: the two-loop recipe — name a current in every branch, write the junction rule, walk each loop with consistent signs, and read a negative answer as a direction guessed backwards.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="800" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">A real battery keeps part of its voltage for itself</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">V_terminal = ε − Ir when discharging, ε + Ir when charging</text><rect x="40" y="118" width="420" height="258" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="250.0" y="146.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">Inside the case: an ideal source plus r</text><rect x="90" y="180" width="200" height="118" rx="6" fill="none" stroke="#6d716f" stroke-width="2"/><text x="190.0" y="198.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:12px">the battery</text><line x1="120" y1="250" x2="148" y2="250" stroke="#18364a" stroke-width="4"/><line x1="126" y1="262" x2="142" y2="262" stroke="#18364a" stroke-width="1.8"/><text x="134.0" y="232.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">ε</text><rect x="196" y="240" width="54" height="16" rx="3" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="223.0" y="230.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">r</text><line x1="290" y1="248" x2="380" y2="248" stroke="#6d716f" stroke-width="2"/><line x1="380" y1="248" x2="380" y2="320" stroke="#6d716f" stroke-width="2"/><line x1="290" y1="320" x2="380" y2="320" stroke="#6d716f" stroke-width="2"/><line x1="90" y1="320" x2="290" y2="320" stroke="#6d716f" stroke-width="2"/><line x1="290" y1="248" x2="290" y2="320" stroke="#6d716f" stroke-width="2"/><rect x="368" y="262" width="20" height="44" rx="3" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="404.0" y="288.0" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:15px">R</text><circle cx="290" cy="248" r="5" fill="#18364a" stroke="#18364a" stroke-width="2"/><circle cx="290" cy="320" r="5" fill="#18364a" stroke="#18364a" stroke-width="2"/><text x="300.0" y="290.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:14px">V_T</text><text x="250.0" y="346.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">the Ir drop happens inside, so you never see it on a meter</text><text x="250.0" y="368.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">no current ⇒ V_T = ε</text><rect x="476" y="118" width="404" height="258" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="678.0" y="146.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">Draw more current, get less voltage</text><line x1="548" y1="286" x2="816" y2="286" stroke="#18364a" stroke-width="2"/><line x1="548" y1="168" x2="548" y2="286" stroke="#18364a" stroke-width="2"/><text x="682.0" y="330.0" class="" text-anchor="middle" style="font-size:17px">current drawn I</text><text x="504" y="227.0" text-anchor="middle" transform="rotate(-90 504 227.0)" style="font-size:17px">terminal voltage</text><path d="M548.0 183.4 L550.3 184.4 L552.7 185.4 L555.0 186.5 L557.3 187.5 L559.7 188.5 L562.0 189.5 L564.3 190.6 L566.6 191.6 L569.0 192.6 L571.3 193.7 L573.6 194.7 L576.0 195.7 L578.3 196.7 L580.6 197.8 L583.0 198.8 L585.3 199.8 L587.6 200.8 L589.9 201.9 L592.3 202.9 L594.6 203.9 L596.9 204.9 L599.3 206.0 L601.6 207.0 L603.9 208.0 L606.3 209.0 L608.6 210.1 L610.9 211.1 L613.3 212.1 L615.6 213.1 L617.9 214.2 L620.2 215.2 L622.6 216.2 L624.9 217.3 L627.2 218.3 L629.6 219.3 L631.9 220.3 L634.2 221.4 L636.6 222.4 L638.9 223.4 L641.2 224.4 L643.5 225.5 L645.9 226.5 L648.2 227.5 L650.5 228.5 L652.9 229.6 L655.2 230.6 L657.5 231.6 L659.9 232.6 L662.2 233.7 L664.5 234.7 L666.9 235.7 L669.2 236.7 L671.5 237.8 L673.8 238.8 L676.2 239.8 L678.5 240.9 L680.8 241.9 L683.2 242.9 L685.5 243.9 L687.8 245.0 L690.2 246.0 L692.5 247.0 L694.8 248.0 L697.1 249.1 L699.5 250.1 L701.8 251.1 L704.1 252.1 L706.5 253.2 L708.8 254.2 L711.1 255.2 L713.5 256.2 L715.8 257.3 L718.1 258.3 L720.5 259.3 L722.8 260.3 L725.1 261.4 L727.4 262.4 L729.8 263.4 L732.1 264.5 L734.4 265.5 L736.8 266.5 L739.1 267.5 L741.4 268.6 L743.8 269.6 L746.1 270.6 L748.4 271.6 L750.7 272.7 L753.1 273.7 L755.4 274.7 L757.7 275.7 L760.1 276.8 L762.4 277.8 L764.7 278.8 L767.1 279.8 L769.4 280.9 L771.7 281.9 L774.1 282.9 L776.4 283.9 L778.7 285.0 L781.0 286.0" stroke="#5b7a64" stroke-width="2.8" fill="none"/><circle cx="548.0" cy="183.39130434782606" r="5" fill="#18364a" stroke="#18364a" stroke-width="2"/><text x="558.0" y="175.4" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:13px">ε at I = 0</text><circle cx="781.0434782608696" cy="286.0" r="5" fill="#a8324a" stroke="#a8324a" stroke-width="2"/><text x="769.0" y="279.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:bold;font-size:13px">short circuit: I = ε/r</text><text x="676.5" y="236.7" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:13px">slope = −r</text><text x="678.0" y="362.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">a tired battery is one whose r has grown</text><rect x="40" y="396" width="840" height="150" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="424.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">ε = 12 V, r = 0.5 Ω, R = 5.5 Ω</text><rect x="80" y="444" width="190" height="68" rx="10" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="175.0" y="468.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">I = ε/(R+r)</text><text x="175.0" y="494.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">12/6.0 = 2.0 A</text><rect x="280" y="444" width="190" height="68" rx="10" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="375.0" y="468.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">V_T = ε − Ir</text><text x="375.0" y="494.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">12 − 1.0 = 11.0 V</text><rect x="480" y="444" width="190" height="68" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="575.0" y="468.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">to the resistor</text><text x="575.0" y="494.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">I²R = 22 W</text><rect x="680" y="444" width="190" height="68" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="775.0" y="468.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">wasted inside</text><text x="775.0" y="494.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">I²r = 2 W</text><text x="460.0" y="532.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">and εI = 24 W accounts for both — always check the power balance</text><rect x="40" y="566" width="840" height="204" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="594.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">When it will not reduce to series and parallel</text><circle cx="92" cy="619" r="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="92.0" y="624.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">1</text><text x="116.0" y="624.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">name a current, with a guessed direction, in every branch</text><circle cx="92" cy="647" r="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="92.0" y="652.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">2</text><text x="116.0" y="652.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">junction rule: what flows in flows out (conservation of charge)</text><circle cx="92" cy="675" r="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="92.0" y="680.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">3</text><text x="116.0" y="680.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">loop rule: walk each loop one way and set ΣΔV = 0 (conservation of energy)</text><circle cx="92" cy="703" r="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="92.0" y="708.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">4</text><text x="116.0" y="708.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">−IR going with your current, +IR against it; +ε from − to +, −ε from + to −</text><circle cx="92" cy="731" r="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="92.0" y="736.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">5</text><text x="116.0" y="736.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">solve; a negative current just means that branch runs the other way</text></svg>