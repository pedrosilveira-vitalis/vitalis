<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">Reciprocal enzyme kinetic plots</title><desc id="desc">Four plots compare competitive, pure noncompetitive and uncompetitive inhibition with doubled active enzyme concentration. Baseline is navy and changed condition is red. Intercepts and slopes follow the idealized rate equation.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#245574;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">Read intercepts and compare lines</text><rect x="24" y="60" width="364" height="275" rx="16" fill="white" stroke="#ded5c8"/><text x="44" y="92" class="h" text-anchor="start">Competitive</text><path d="M34 273 L354 273" class="bond" /><path d="M174 120 L174 285" class="bond" /><path d="M104.0 273 L314 138" stroke="#24495c" stroke-width="3"/><path d="M139.0 273 L254.5 124.5" stroke="#a8324a" stroke-width="3"/><text x="44" y="124" class="s" text-anchor="start">1/v</text><text x="292" y="302" class="s" text-anchor="start">1/[S]</text><text x="178" y="297" class="s" text-anchor="start">0</text><rect x="412" y="60" width="364" height="275" rx="16" fill="white" stroke="#ded5c8"/><text x="432" y="92" class="h" text-anchor="start">Pure noncompetitive</text><path d="M422 273 L742 273" class="bond" /><path d="M562 120 L562 285" class="bond" /><path d="M492.0 273 L702 138" stroke="#24495c" stroke-width="3"/><path d="M492.0 273 L607.5 124.5" stroke="#a8324a" stroke-width="3"/><text x="432" y="124" class="s" text-anchor="start">1/v</text><text x="680" y="302" class="s" text-anchor="start">1/[S]</text><text x="566" y="297" class="s" text-anchor="start">0</text><rect x="24" y="355" width="364" height="275" rx="16" fill="white" stroke="#ded5c8"/><text x="44" y="387" class="h" text-anchor="start">Uncompetitive</text><path d="M34 568 L354 568" class="bond" /><path d="M174 415 L174 580" class="bond" /><path d="M104.0 568 L314 433" stroke="#24495c" stroke-width="3"/><path d="M34.0 568 L265.0 419.5" stroke="#a8324a" stroke-width="3"/><text x="44" y="419" class="s" text-anchor="start">1/v</text><text x="292" y="597" class="s" text-anchor="start">1/[S]</text><text x="178" y="592" class="s" text-anchor="start">0</text><rect x="412" y="355" width="364" height="275" rx="16" fill="white" stroke="#ded5c8"/><text x="432" y="387" class="h" text-anchor="start">2× active enzyme</text><path d="M422 568 L742 568" class="bond" /><path d="M562 415 L562 580" class="bond" /><path d="M492.0 568 L702 433" stroke="#24495c" stroke-width="3"/><path d="M492.0 568 L702 500.5" stroke="#a8324a" stroke-width="3"/><text x="432" y="419" class="s" text-anchor="start">1/v</text><text x="680" y="597" class="s" text-anchor="start">1/[S]</text><text x="566" y="592" class="s" text-anchor="start">0</text><text x="42" y="669" class="t" text-anchor="start">Navy: baseline • Red: changed condition</text><text x="42" y="704" class="s" text-anchor="start">Same x-intercept can reflect inhibitor OR changed active enzyme amount.</text></svg>