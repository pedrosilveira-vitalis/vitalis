<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">Fermentation redox and ATP accounting</title><desc id="desc">Glycolysis yields two net ATP and two NADH per glucose. Lactate dehydrogenase regenerates NAD by reducing pyruvate and consuming a proton. Yeast releases carbon dioxide before reducing acetaldehyde to ethanol. In the Cori cycle two ATP gained in muscle are offset by four ATP plus two GTP spent in liver.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#245574;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">Fermentation: recycle NAD⁺, retain glycolytic ATP</text><rect x="24" y="60" width="752" height="133" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="94" class="h" text-anchor="start">1  ATP is made in glycolysis</text><text x="55" y="132" class="t" text-anchor="start">Glucose → 2 pyruvate + 2 net ATP + 2 NADH</text><text x="55" y="169" class="s" text-anchor="start">GAPDH needs NAD⁺ again for glycolysis to continue.</text><rect x="24" y="209" width="752" height="143" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="243" class="h" text-anchor="start">2  Lactate pathway: one redox step</text><text x="55" y="281" class="t" text-anchor="start">Pyruvate + NADH + H⁺ ⇌ Lactate + NAD⁺</text><text x="55" y="319" class="s" text-anchor="start">LDH consumes H⁺ in this direction; no extra ATP is formed.</text><rect x="24" y="368" width="752" height="145" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="402" class="h" text-anchor="start">3  Yeast ethanol pathway: two steps</text><text x="55" y="439" class="s" text-anchor="start">Pyruvate → Acetaldehyde + CO₂  (TPP required)</text><text x="55" y="478" class="s" text-anchor="start">Acetaldehyde + NADH + H⁺ → Ethanol + NAD⁺</text><rect x="24" y="529" width="752" height="187" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="563" class="h" text-anchor="start">4  Cori cycle: compare the two tissues</text><text x="55" y="600" class="t" text-anchor="start">Muscle: glucose → 2 lactate; gains 2 ATP</text><text x="55" y="634" class="t" text-anchor="start">Liver: 2 lactate → glucose; spends 4 ATP + 2 GTP</text><text x="55" y="668" class="s" text-anchor="start">Whole-body net cost: 4 ATP equivalents per cycle</text><text x="55" y="698" class="s" text-anchor="start">Other tissues can also oxidize lactate directly as fuel.</text></svg>