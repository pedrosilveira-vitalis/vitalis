<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1004" viewBox="0 0 920 1004" role="img" aria-labelledby="t d"><title id="t">One constant holds the whole scale together</title><desc id="d">Top: the two scales as mirror images. Fix [H⁺] anywhere on the line and [OH⁻] is determined, because their product is pinned at 1.0 × 10⁻¹⁴ at 25 °C. That is why pH and pOH must sum to 14 and why one step along the scale is a tenfold change in concentration, not a small one. Middle: the arithmetic without a calculator, which comes down to splitting a concentration into a power of ten and a coefficient you know the log of. Bottom: the two traps — neutrality is not pH 7 except at 25 °C, and a very dilute acid approaches pH 7 from below without ever crossing it.</desc><defs><marker id="m7194" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="1004" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">One constant holds the whole scale together</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Kᵥᵥ = [H⁺][OH⁻], and everything else is a logarithm of it</text><rect x="40" y="180" width="840" height="262" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">Two scales, one constant</text><line x1="110" y1="268" x2="830" y2="268" stroke="#6d716f" stroke-width="2"/><line x1="110" y1="348" x2="830" y2="348" stroke="#6d716f" stroke-width="2"/><line x1="110.0" y1="262" x2="110.0" y2="274" stroke="#6d716f" stroke-width="1.4"/><text x="110.0" y="256.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">0</text><line x1="110.0" y1="342" x2="110.0" y2="354" stroke="#6d716f" stroke-width="1.4"/><text x="110.0" y="368.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">14</text><line x1="212.85714285714286" y1="262" x2="212.85714285714286" y2="274" stroke="#6d716f" stroke-width="1.4"/><text x="212.9" y="256.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">2</text><line x1="212.85714285714286" y1="342" x2="212.85714285714286" y2="354" stroke="#6d716f" stroke-width="1.4"/><text x="212.9" y="368.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">12</text><line x1="315.7142857142857" y1="262" x2="315.7142857142857" y2="274" stroke="#6d716f" stroke-width="1.4"/><text x="315.7" y="256.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">4</text><line x1="315.7142857142857" y1="342" x2="315.7142857142857" y2="354" stroke="#6d716f" stroke-width="1.4"/><text x="315.7" y="368.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">10</text><line x1="418.57142857142856" y1="262" x2="418.57142857142856" y2="274" stroke="#6d716f" stroke-width="1.4"/><text x="418.6" y="256.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">6</text><line x1="418.57142857142856" y1="342" x2="418.57142857142856" y2="354" stroke="#6d716f" stroke-width="1.4"/><text x="418.6" y="368.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">8</text><line x1="521.4285714285714" y1="262" x2="521.4285714285714" y2="274" stroke="#6d716f" stroke-width="1.4"/><text x="521.4" y="256.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">8</text><line x1="521.4285714285714" y1="342" x2="521.4285714285714" y2="354" stroke="#6d716f" stroke-width="1.4"/><text x="521.4" y="368.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">6</text><line x1="624.2857142857143" y1="262" x2="624.2857142857143" y2="274" stroke="#6d716f" stroke-width="1.4"/><text x="624.3" y="256.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">10</text><line x1="624.2857142857143" y1="342" x2="624.2857142857143" y2="354" stroke="#6d716f" stroke-width="1.4"/><text x="624.3" y="368.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">4</text><line x1="727.1428571428571" y1="262" x2="727.1428571428571" y2="274" stroke="#6d716f" stroke-width="1.4"/><text x="727.1" y="256.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">12</text><line x1="727.1428571428571" y1="342" x2="727.1428571428571" y2="354" stroke="#6d716f" stroke-width="1.4"/><text x="727.1" y="368.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">2</text><line x1="830.0" y1="262" x2="830.0" y2="274" stroke="#6d716f" stroke-width="1.4"/><text x="830.0" y="256.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">14</text><line x1="830.0" y1="342" x2="830.0" y2="354" stroke="#6d716f" stroke-width="1.4"/><text x="830.0" y="368.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">0</text><text x="94.0" y="272.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:10px">pH</text><text x="94.0" y="352.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:10px">pOH</text><text x="264.3" y="300.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">ACIDIC</text><text x="264.3" y="318.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">[H⁺] &gt; [OH⁻]</text><text x="470.0" y="300.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">NEUTRAL</text><text x="470.0" y="318.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">[H⁺] = [OH⁻]</text><text x="675.7" y="300.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">BASIC</text><text x="675.7" y="318.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">[H⁺] &lt; [OH⁻]</text><line x1="470.0" y1="262" x2="470.0" y2="288" stroke="#18364a" stroke-width="1.6" stroke-dasharray="6 5"/><line x1="470.0" y1="326" x2="470.0" y2="354" stroke="#18364a" stroke-width="1.6" stroke-dasharray="6 5"/><text x="460.0" y="400.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">pH + pOH = pKᵥᵥ = 14.00 at 25 °C · one unit of pH = a TENFOLD change in [H⁺] · 0.30 units = twofold</text><text x="460.0" y="422.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">blood at 7.40 falling to 7.10 doubles [H⁺] — which is why a tenth of a pH unit is a clinical emergency</text><rect x="40" y="458" width="840" height="234" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="486.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">Doing it without a calculator</text><rect x="60" y="506" width="390" height="166" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="255.0" y="528.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">SPLIT, THEN SUBTRACT</text><text x="255.0" y="552.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:8.5px">[H⁺] = A × 10⁻ⁿ, with 1 ≤ A &lt; 10</text><text x="255.0" y="567.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:8.5px">pH = n − log A</text><text x="255.0" y="597.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:8.5px">[H⁺] = 4.0 × 10⁻⁵</text><text x="255.0" y="612.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:8.5px">pH = 5 − log 4 = 5 − 0.60 = 4.40</text><text x="255.0" y="642.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:8.5px">so the answer always lands between</text><text x="255.0" y="657.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:8.5px">n − 1 and n, nearer n for small A</text><rect x="470" y="506" width="390" height="166" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="665.0" y="528.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">THE LOGS TO KNOW</text><text x="530.0" y="554.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">log 2</text><text x="530.0" y="568.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">0.30</text><text x="620.0" y="554.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">log 3</text><text x="620.0" y="568.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">0.48</text><text x="710.0" y="554.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">log 4</text><text x="710.0" y="568.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">0.60</text><text x="800.0" y="554.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">log 5</text><text x="800.0" y="568.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">0.70</text><text x="530.0" y="584.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">log 6</text><text x="530.0" y="598.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">0.78</text><text x="620.0" y="584.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">log 7</text><text x="620.0" y="598.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">0.85</text><text x="710.0" y="584.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">log 8</text><text x="710.0" y="598.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">0.90</text><text x="800.0" y="584.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">log 9</text><text x="800.0" y="598.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">0.95</text><text x="665.0" y="630.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:8.5px">log 2 = 0.30 is the one that earns its keep:</text><text x="665.0" y="646.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">any 0.30 shift in pH is a factor of two in [H⁺],</text><text x="665.0" y="660.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">and log 4 = 2 log 2, log 5 = 1 − log 2</text><rect x="40" y="708" width="840" height="276" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="460.0" y="736.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">The two traps</text><rect x="60" y="756" width="390" height="212" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="255.0" y="778.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:11px">NEUTRAL IS NOT “pH 7”</text><text x="255.0" y="796.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">neutral means [H⁺] = [OH⁻], i.e. pH = ½ pKᵥᵥ</text><text x="255.0" y="812.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">autoionization is endothermic, so heating</text><text x="255.0" y="826.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">raises Kᵥᵥ and lowers neutral pH</text><text x="120.0" y="850.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:8.5px">T</text><text x="260.0" y="850.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:8.5px">Kᵥᵥ</text><text x="390.0" y="850.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:8.5px">neutral pH</text><text x="120.0" y="868.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">0 °C</text><text x="260.0" y="868.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">0.11 × 10⁻¹⁴</text><text x="390.0" y="868.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:8.5px">7.47</text><text x="120.0" y="885.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">25 °C</text><text x="260.0" y="885.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">1.00 × 10⁻¹⁴</text><text x="390.0" y="885.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:8.5px">7.00</text><text x="120.0" y="902.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">37 °C</text><text x="260.0" y="902.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">2.42 × 10⁻¹⁴</text><text x="390.0" y="902.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:8.5px">6.81</text><text x="120.0" y="919.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">100 °C</text><text x="260.0" y="919.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">51.3 × 10⁻¹⁴</text><text x="390.0" y="919.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:8.5px">6.14</text><text x="255.0" y="952.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:9px">at body temperature, neutral is about 6.81</text><rect x="470" y="756" width="390" height="212" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="665.0" y="778.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">VERY DILUTE ACID NEVER GOES BASIC</text><text x="665.0" y="796.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">1.0 × 10⁻⁸ M HCl is NOT pH 8</text><rect x="500" y="812" width="330" height="46" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.4"/><text x="665.0" y="830.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:9px">naive: [H⁺] = C → pH 8</text><text x="665.0" y="846.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">an acid that made the water basic</text><line x1="665" y1="860" x2="665" y2="878" stroke="#6d716f" stroke-width="2.5" marker-end="url(#m7194)"/><rect x="500" y="882" width="330" height="62" rx="7" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.4"/><text x="665.0" y="902.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:9px">water still supplies about 10⁻⁷ M</text><text x="665.0" y="920.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">total [H⁺] sits just above 10⁻⁷, so the pH</text><text x="665.0" y="934.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">is just BELOW 7 — acidic, but barely</text><text x="665.0" y="960.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:9px">dilution drives any solution toward 7 and never past it</text></svg>