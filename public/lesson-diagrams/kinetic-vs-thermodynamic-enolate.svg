<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="t d"><title id="t">Two alpha positions, two enolates: speed or stability</title><desc id="d">2-Methylcyclohexanone is drawn in the centre with its two different alpha carbons marked. On the left, LDA at minus 78 degrees removes the more accessible hydrogen on the unsubstituted side to give the kinetic enolate with the less substituted double bond. On the right, a weaker base under equilibrating conditions gives the thermodynamic enolate with the more substituted, more stable double bond. A lower band lists the pKa values that decide which base is needed.</desc><defs><marker id="m1089" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker><marker id="m1524" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="900" height="640" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Two alpha positions, two enolates: speed or stability</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Which enolate you get is decided by the base and the temperature, not by the ketone.</text><line x1="450.0" y1="152.0" x2="488.1051177665153" y2="174.0" stroke="#18364a" stroke-width="2.2"/><line x1="488.1051177665153" y1="174.0" x2="488.1051177665153" y2="218.0" stroke="#18364a" stroke-width="2.2"/><line x1="488.1051177665153" y1="218.0" x2="450.0" y2="240.0" stroke="#18364a" stroke-width="2.2"/><line x1="450.0" y1="240.0" x2="411.8948822334847" y2="218.0" stroke="#18364a" stroke-width="2.2"/><line x1="411.8948822334847" y1="218.0" x2="411.8948822334847" y2="174.0" stroke="#18364a" stroke-width="2.2"/><line x1="411.8948822334847" y1="174.0" x2="450.0" y2="152.0" stroke="#18364a" stroke-width="2.2"/><line x1="447.0" y1="152.0" x2="447.0" y2="126.0" stroke="#18364a" stroke-width="2.2"/><line x1="453.0" y1="152.0" x2="453.0" y2="126.0" stroke="#18364a" stroke-width="2.2"/><text x="450.0" y="120.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">O</text><line x1="488.1051177665153" y1="174.0" x2="518.1051177665154" y2="164.0" stroke="#18364a" stroke-width="2.2"/><text x="532.1" y="166.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">CH₃</text><circle cx="488.1051177665153" cy="174.0" r="13" fill="#f1eadc" stroke="#987740" stroke-width="2.5"/><text x="488.1" y="179.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">α</text><circle cx="411.8948822334847" cy="174.0" r="13" fill="#f1eadc" stroke="#987740" stroke-width="2.5"/><text x="411.9" y="179.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">α</text><text x="450.0" y="268.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">2-methylcyclohexanone</text><text x="450.0" y="288.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">two different α carbons: one CH₂, one CH with a methyl</text><line x1="380" y1="196" x2="258" y2="196" stroke="#245574" stroke-width="2.5" marker-end="url(#m1089)"/><line x1="520" y1="196" x2="642" y2="196" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m1524)"/><rect x="60" y="318" width="370" height="170" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="245.0" y="344.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:19px">Kinetic enolate</text><text x="245.0" y="368.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">LDA, −78 °C, THF</text><text x="245.0" y="394.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">Bulky and non-nucleophilic, and the</text><text x="245.0" y="413.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">deprotonation is complete and irreversible,</text><text x="245.0" y="432.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">so the proton removed fastest — on the open</text><text x="245.0" y="451.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">CH₂ side — is the one you keep.</text><text x="245.0" y="472.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">→ less substituted C=C</text><rect x="470" y="318" width="370" height="170" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="655.0" y="344.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:19px">Thermodynamic enolate</text><text x="655.0" y="368.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">NaOEt in EtOH, room temperature</text><text x="655.0" y="394.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">A weaker base deprotonates reversibly, so</text><text x="655.0" y="413.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">the two enolates equilibrate and the more</text><text x="655.0" y="432.0" class="" text-anchor="middle" style="fill:#18364a;font-size:14px">substituted, more stable one wins.</text><text x="655.0" y="472.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">→ more substituted C=C</text><rect x="60" y="506" width="780" height="118" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="450.0" y="532.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">Which base can do the job?</text><text x="118.0" y="564.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">aldehyde α-H</text><text x="118.0" y="586.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:14px">pKₐ 17</text><text x="251.0" y="564.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">ketone α-H</text><text x="251.0" y="586.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:14px">pKₐ 20</text><text x="384.0" y="564.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">ester α-H</text><text x="384.0" y="586.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:14px">pKₐ 25</text><text x="517.0" y="564.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">β-ketoester</text><text x="517.0" y="586.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:14px">pKₐ 11</text><text x="650.0" y="564.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">EtOH</text><text x="650.0" y="586.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:14px">pKₐ 16</text><text x="783.0" y="564.0" class="" text-anchor="middle" style="fill:#18364a;font-size:13px">iPr₂NH (LDA)</text><text x="783.0" y="586.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:14px">pKₐ 36</text><text x="450.0" y="610.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">A base works only if its conjugate acid is the weaker acid: NaOEt (16) handles a β-ketoester (11) but not a plain ketone (20).</text></svg>