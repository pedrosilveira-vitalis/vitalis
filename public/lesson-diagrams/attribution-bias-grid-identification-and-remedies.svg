<svg xmlns="http://www.w3.org/2000/svg" width="920" height="930" viewBox="0 0 920 930" role="img" aria-labelledby="t d"><title id="t">Four biases, two axes, one grid</title><desc id="d">Top: the four attribution biases laid out on the two axes that actually distinguish them. Across the top, whose behaviour is being explained; down the side, how it turned out. The fundamental attribution error lives in the “other person” column and does not care about the outcome. The actor-observer bias is the contrast between the two columns. The self-serving bias is the contrast between the two rows within the self column. The ultimate attribution error is the same grid re-drawn with in-group and out-group in place of self and other, which is what makes it the socially dangerous one. Bottom: the single question that identifies which bias a vignette is testing, and what reliably weakens each.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="930" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Four biases, two axes, one grid</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Whose behaviour, and whether it went well — that is all that separates them</text><rect x="40" y="180" width="840" height="372" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">The grid that separates them</text><rect x="300" y="228" width="270" height="34" rx="7" fill="#efede8" stroke="#6d716f" stroke-width="1.5"/><text x="435.0" y="250.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11.5px">MY OWN behaviour</text><rect x="580" y="228" width="270" height="34" rx="7" fill="#efede8" stroke="#6d716f" stroke-width="1.5"/><text x="715.0" y="250.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11.5px">SOMEONE ELSE&#x27;S</text><rect x="70" y="272" width="220" height="108" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="180.0" y="332.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12.5px">IT WENT WELL</text><rect x="300" y="272" width="270" height="108" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="435.0" y="314.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">“I am skilled”</text><rect x="370" y="330" width="130" height="26" rx="5" fill="none" stroke="#5b7a64" stroke-width="1.5"/><text x="435.0" y="348.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10px">DISPOSITIONAL</text><rect x="580" y="272" width="270" height="108" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="715.0" y="314.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">“they got lucky”</text><rect x="650" y="330" width="130" height="26" rx="5" fill="none" stroke="#987740" stroke-width="1.5"/><text x="715.0" y="348.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10px">SITUATIONAL</text><rect x="70" y="390" width="220" height="108" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="180.0" y="450.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12.5px">IT WENT BADLY</text><rect x="300" y="390" width="270" height="108" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="435.0" y="432.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">“the situation was against me”</text><rect x="370" y="448" width="130" height="26" rx="5" fill="none" stroke="#245574" stroke-width="1.5"/><text x="435.0" y="466.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10px">SITUATIONAL</text><rect x="580" y="390" width="270" height="108" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="715.0" y="432.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">“that is who they are”</text><rect x="650" y="448" width="130" height="26" rx="5" fill="none" stroke="#a8324a" stroke-width="1.5"/><text x="715.0" y="466.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10px">DISPOSITIONAL</text><text x="460.0" y="518.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10.5px">left column vs right column = ACTOR-OBSERVER · top row vs bottom row on the left = SELF-SERVING</text><text x="460.0" y="538.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">the right column on its own = FUNDAMENTAL ATTRIBUTION ERROR · swap self and other for in-group and out-group = ULTIMATE</text><rect x="40" y="568" width="410" height="346" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="245.0" y="596.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">Which one is the vignette testing?</text><rect x="64" y="618" width="362" height="68" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><text x="245.0" y="638.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">Is a GROUP named,</text><text x="245.0" y="652.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">and treated as a group?</text><text x="245.0" y="676.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10px">YES → ULTIMATE ATTRIBUTION ERROR</text><rect x="64" y="692" width="362" height="68" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="245.0" y="712.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">Is the SAME person&#x27;s success</text><text x="245.0" y="726.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">and failure both described?</text><text x="245.0" y="750.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10px">YES → SELF-SERVING BIAS</text><rect x="64" y="766" width="362" height="68" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.6"/><text x="245.0" y="786.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">Are self and other</text><text x="245.0" y="800.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">explained SIDE BY SIDE?</text><text x="245.0" y="824.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10px">YES → ACTOR-OBSERVER BIAS</text><rect x="64" y="840" width="362" height="68" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.6"/><text x="245.0" y="860.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">Only one person judged,</text><text x="245.0" y="874.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">situation ignored?</text><text x="245.0" y="898.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10px">YES → FUNDAMENTAL ATTRIBUTION ERROR</text><rect x="470" y="568" width="410" height="346" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="675.0" y="596.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">What actually weakens them</text><rect x="494" y="618" width="362" height="60" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.6"/><text x="675.0" y="638.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">PERSPECTIVE-TAKING</text><text x="675.0" y="654.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">deliberately occupying the other person&#x27;s</text><text x="675.0" y="667.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">position; Storms reversed the bias with a camera</text><rect x="494" y="684" width="362" height="60" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.6"/><text x="675.0" y="704.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10.5px">ACCOUNTABILITY · TIME</text><text x="675.0" y="720.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">the correction step is effortful, so it fails</text><text x="675.0" y="733.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">under load and returns when resources allow</text><rect x="494" y="750" width="362" height="60" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="675.0" y="770.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">INDIVIDUATING INFORMATION</text><text x="675.0" y="786.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">specific facts about the person crowd out</text><text x="675.0" y="799.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">the category-based reading</text><rect x="494" y="816" width="362" height="60" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><text x="675.0" y="836.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">INTERGROUP CONTACT</text><text x="675.0" y="852.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">Allport&#x27;s conditions: equal status, common</text><text x="675.0" y="865.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">goals, cooperation, institutional support</text><text x="675.0" y="892.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">knowing about a bias does not remove it — that is the bias blind spot</text></svg>