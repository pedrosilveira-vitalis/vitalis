<svg xmlns="http://www.w3.org/2000/svg" width="920" height="946" viewBox="0 0 920 946" role="img" aria-labelledby="t d"><title id="t">One fact, three explanations</title><desc id="d">Top: the same observation — surgeons are paid far more than nurses — run through all three lenses. Functionalism asks what the arrangement does for the system and answers that unequal rewards staff the demanding posts. Conflict theory asks who set the rates and answers that those with power write the rules that keep them on top. Symbolic interactionism does not explain the origin at all; it asks how the difference is lived, in titles, deference and who gets interrupted on a ward round. Bottom left: the three-question triage that identifies which lens a passage is using. Bottom right: the vocabulary that belongs to each, which is how most questions are actually marked.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="946" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">One fact, three explanations</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">The frameworks differ in what they look at, not only in what they conclude</text><rect x="40" y="180" width="840" height="330" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">Why does the surgeon earn more than the nurse?</text><rect x="68" y="228" width="262" height="266" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="199.0" y="252.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11.5px">FUNCTIONALISM</text><text x="199.0" y="270.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">MACRO · stability</text><text x="199.0" y="292.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">“the post is harder to fill”</text><line x1="98" y1="302" x2="300" y2="302" stroke="#5b7a64" stroke-width="1" stroke-dasharray="6 5"/><text x="199.0" y="322.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9px">unequal rewards draw talent into</text><text x="199.0" y="341.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9px">the demanding positions</text><text x="199.0" y="360.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9px">Davis and Moore, 1945</text><text x="199.0" y="398.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">CRITIQUE: who decides which</text><text x="199.0" y="417.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:normal;font-size:9px">posts are important? It reads</text><text x="199.0" y="436.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:normal;font-size:9px">today&#x27;s pay as proof of worth,</text><text x="199.0" y="455.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:normal;font-size:9px">and ignores inherited advantage</text><rect x="344" y="228" width="262" height="266" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="475.0" y="252.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11.5px">CONFLICT THEORY</text><text x="475.0" y="270.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">MACRO · power</text><text x="475.0" y="292.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">“the powerful set the rates”</text><line x1="374" y1="302" x2="576" y2="302" stroke="#a8324a" stroke-width="1" stroke-dasharray="6 5"/><text x="475.0" y="322.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9px">inequality is an outcome of</text><text x="475.0" y="341.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9px">domination, not a solution</text><text x="475.0" y="360.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9px">Marx, Weber, Mills, Gramsci</text><text x="475.0" y="398.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">CRITIQUE: not every arrangement</text><text x="475.0" y="417.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:normal;font-size:9px">is exploitation, and if conflict</text><text x="475.0" y="436.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:normal;font-size:9px">runs that deep it is hard to</text><text x="475.0" y="455.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:normal;font-size:9px">explain why societies hold together</text><rect x="620" y="228" width="262" height="266" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="751.0" y="252.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11.5px">SYMBOLIC INTERACTIONISM</text><text x="751.0" y="270.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">MICRO · meaning</text><text x="751.0" y="292.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">“watch the ward round”</text><line x1="650" y1="302" x2="852" y2="302" stroke="#245574" stroke-width="1" stroke-dasharray="6 5"/><text x="751.0" y="322.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9px">who is addressed by title, who is</text><text x="751.0" y="341.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9px">interrupted, who is believed</text><text x="751.0" y="360.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:normal;font-size:9px">Mead, Cooley, Blumer, Goffman</text><text x="751.0" y="398.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9px">CRITIQUE: explains how it is</text><text x="751.0" y="417.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:normal;font-size:9px">lived, not where it came from;</text><text x="751.0" y="436.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:normal;font-size:9px">cannot by itself account for a</text><text x="751.0" y="455.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:normal;font-size:9px">population-wide disparity</text><rect x="40" y="526" width="410" height="398" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="245.0" y="554.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">Which lens is the passage using?</text><rect x="64" y="578" width="362" height="86" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="245.0" y="602.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">Does it say the arrangement</text><text x="245.0" y="618.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">SERVES a need or keeps order?</text><text x="245.0" y="648.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">→ FUNCTIONALISM</text><rect x="64" y="672" width="362" height="86" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="245.0" y="696.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">Does it name POWER, interests,</text><text x="245.0" y="712.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">exploitation or who benefits?</text><text x="245.0" y="742.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">→ CONFLICT THEORY</text><rect x="64" y="766" width="362" height="86" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="245.0" y="790.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">Is it about MEANING, labels,</text><text x="245.0" y="806.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">identity, or two people talking?</text><text x="245.0" y="836.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">→ SYMBOLIC INTERACTIONISM</text><rect x="64" y="858" width="362" height="58" rx="9" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="245.0" y="879.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">AND THE LEVEL GIVES IT AWAY</text><text x="245.0" y="899.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">institutions and populations = macro · a conversation = micro</text><rect x="470" y="526" width="410" height="398" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="675.0" y="554.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">The words that mark each one</text><rect x="494" y="576" width="362" height="105" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.6"/><text x="675.0" y="595.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">FUNCTIONALISM</text><text x="675.0" y="612.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">manifest and latent function</text><text x="675.0" y="627.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">dysfunction</text><text x="675.0" y="642.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">mechanical and organic solidarity</text><text x="675.0" y="657.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">anomie</text><text x="675.0" y="672.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">the sick role</text><rect x="494" y="689" width="362" height="105" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><text x="675.0" y="708.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">CONFLICT THEORY</text><text x="675.0" y="725.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">bourgeoisie and proletariat</text><text x="675.0" y="740.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">surplus value</text><text x="675.0" y="755.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">false consciousness, hegemony</text><text x="675.0" y="770.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">power elite</text><text x="675.0" y="785.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">structural racism, intersectionality</text><rect x="494" y="802" width="362" height="105" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.6"/><text x="675.0" y="821.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">SYMBOLIC INTERACTIONISM</text><text x="675.0" y="838.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">looking-glass self</text><text x="675.0" y="853.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">generalized other</text><text x="675.0" y="868.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">master status, labelling</text><text x="675.0" y="883.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">stigma: passing and covering</text><text x="675.0" y="898.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">dramaturgy, medicalization</text></svg>