<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="t d"><title id="t">The Nernst equation is a straight line in log Q</title><desc id="d">A plot of cell potential against log Q. The line starts high on the left where reactants dominate, passes through E standard at log Q equal to zero, and crosses zero at log Q equal to log K, beyond which the potential is negative and the reverse reaction is spontaneous. The slope is minus 0.0592 over n volts per decade. A panel below lists what each region means and the two special points.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="900" height="640" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">The Nernst equation is a straight line in log Q</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Start at E°cell when Q = 1, slide down by 0.0592/n for every tenfold rise in Q, and hit zero when Q reaches K.</text><line x1="150" y1="296.1538461538462" x2="820" y2="296.1538461538462" stroke="#6d716f" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="253.0769230769231" y1="130" x2="253.0769230769231" y2="400" stroke="#6d716f" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="150" y1="400" x2="820" y2="400" stroke="#18364a" stroke-width="2"/><line x1="150" y1="130" x2="150" y2="400" stroke="#18364a" stroke-width="2"/><line x1="150.0" y1="400" x2="150.0" y2="406" stroke="#18364a" stroke-width="1.2"/><text x="150.0" y="424.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">-8</text><line x1="253.0769230769231" y1="400" x2="253.0769230769231" y2="406" stroke="#18364a" stroke-width="1.2"/><text x="253.1" y="424.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">0</text><line x1="356.1538461538462" y1="400" x2="356.1538461538462" y2="406" stroke="#18364a" stroke-width="1.2"/><text x="356.2" y="424.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">8</text><line x1="459.2307692307692" y1="400" x2="459.2307692307692" y2="406" stroke="#18364a" stroke-width="1.2"/><text x="459.2" y="424.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">16</text><line x1="562.3076923076924" y1="400" x2="562.3076923076924" y2="406" stroke="#18364a" stroke-width="1.2"/><text x="562.3" y="424.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">24</text><line x1="665.3846153846154" y1="400" x2="665.3846153846154" y2="406" stroke="#18364a" stroke-width="1.2"/><text x="665.4" y="424.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">32</text><line x1="768.4615384615385" y1="400" x2="768.4615384615385" y2="406" stroke="#18364a" stroke-width="1.2"/><text x="768.5" y="424.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">40</text><text x="485.0" y="448.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">log Q</text><text x="138.0" y="405.0" class="" text-anchor="end" style="fill:#6d716f;font-size:12px">-1.0</text><text x="138.0" y="301.2" class="" text-anchor="end" style="fill:#6d716f;font-size:12px">0.0</text><text x="138.0" y="197.3" class="" text-anchor="end" style="fill:#6d716f;font-size:12px">1.0</text><text x="138.0" y="116.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:14px">E (V)</text><line x1="150.0" y1="157.3323076923077" x2="820.0" y2="317.1723076923077" stroke="#245574" stroke-width="3"/><circle cx="253.0769230769231" cy="181.92307692307693" r="8" fill="#5b7a64" stroke="#5b7a64" stroke-width="0"/><text x="253.1" y="227.9" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:16px">Q = 1</text><text x="253.1" y="247.9" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">E = E°cell = +1.10 V</text><circle cx="731.8970893970893" cy="296.1538461538462" r="8" fill="#a8324a" stroke="#a8324a" stroke-width="0"/><text x="731.9" y="342.2" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:16px">Q = K</text><text x="731.9" y="362.2" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">E = 0, the battery is flat</text><text x="169.3" y="339.8" class="" text-anchor="start" style="fill:#245574;font-weight:bold;font-size:14px">reactants dominate:</text><text x="169.3" y="356.4" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">E sits above E°cell</text><text x="472.1" y="197.5" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">slope = −0.0592 / n</text><text x="472.1" y="212.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">volts per decade of Q</text><rect x="60" y="466" width="780" height="160" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="450.0" y="494.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:18px">E = E°cell − (0.0592 / n) log Q      at 298 K</text><text x="196.0" y="524.0" class="" text-anchor="end" style="fill:#5b7a64;font-weight:bold;font-size:15px">Q &lt; 1</text><text x="216.0" y="524.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">products scarce</text><text x="812.0" y="524.0" class="" text-anchor="end" style="fill:#5b7a64;font-size:14px">E above E°cell</text><text x="196.0" y="550.0" class="" text-anchor="end" style="fill:#245574;font-weight:bold;font-size:15px">Q = 1</text><text x="216.0" y="550.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">standard conditions</text><text x="812.0" y="550.0" class="" text-anchor="end" style="fill:#245574;font-size:14px">E equals E°cell</text><text x="196.0" y="576.0" class="" text-anchor="end" style="fill:#987740;font-weight:bold;font-size:15px">1 &lt; Q &lt; K</text><text x="216.0" y="576.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">running down</text><text x="812.0" y="576.0" class="" text-anchor="end" style="fill:#987740;font-size:14px">E below E°cell, still positive</text><text x="196.0" y="602.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:bold;font-size:15px">Q = K</text><text x="216.0" y="602.0" class="" text-anchor="start" style="fill:#18364a;font-size:14px">equilibrium</text><text x="812.0" y="602.0" class="" text-anchor="end" style="fill:#a8324a;font-size:14px">E = 0 — no work left</text><text x="450.0" y="614.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Solids, pure liquids and the solvent never appear in Q.</text></svg>