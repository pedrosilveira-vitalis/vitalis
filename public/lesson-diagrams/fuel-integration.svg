<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">Fuel entry and net glucose carbon</title><desc id="desc">Glucose forms pyruvate which can enter as acetyl-CoA or OAA. Even-chain fatty acids provide acetyl units and oxidative energy but not net glucose carbon through conventional TCA metabolism. Glycerol provides DHAP and odd-chain propionyl-CoA provides succinyl-CoA. Amino acids have distinct entry points.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#aa3653;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">Fuel integration: follow carbon and energy</text><rect x="24" y="60" width="752" height="292" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="94" class="h" text-anchor="start">1  The entry point determines the carbon options</text><text x="55" y="135" class="s" text-anchor="start">Glucose</text><path d="M290 130 L365 130" class="bond" /><path d="M357 125 L365 130 L357 135" class="bond"/><text x="390" y="135" class="s" text-anchor="start">Pyruvate → acetyl-CoA or OAA</text><text x="55" y="185" class="s" text-anchor="start">Even-chain fatty acids</text><path d="M290 180 L365 180" class="bond" /><path d="M357 175 L365 180 L357 185" class="bond"/><text x="390" y="185" class="s" text-anchor="start">Acetyl-CoA</text><text x="55" y="235" class="s" text-anchor="start">Glycerol</text><path d="M290 230 L365 230" class="bond" /><path d="M357 225 L365 230 L357 235" class="bond"/><text x="390" y="235" class="s" text-anchor="start">DHAP → glucose pathway</text><text x="55" y="285" class="s" text-anchor="start">Odd-chain propionyl unit</text><path d="M290 280 L365 280" class="bond" /><path d="M357 275 L365 280 L357 285" class="bond"/><text x="390" y="285" class="s" text-anchor="start">Succinyl-CoA → OAA</text><text x="55" y="330" class="s" text-anchor="start">Amino acids: entry varies; leucine and lysine are purely ketogenic.</text><rect x="24" y="368" width="752" height="167" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="402" class="h" text-anchor="start">2  Fat oxidation can power glucose production</text><text x="55" y="444" class="t" text-anchor="start">Fat oxidation → reducing equivalents → ATP</text><text x="55" y="478" class="s" text-anchor="start">ATP supports gluconeogenesis from other carbon sources.</text><text x="55" y="512" class="t" text-anchor="start">Energetic support ≠ net donation of glucose carbon.</text><rect x="24" y="551" width="752" height="165" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="585" class="h" text-anchor="start">3  Check the tissue and chain length</text><text x="55" y="625" class="s" text-anchor="start">Long-chain mitochondrial entry: CPT-I → shuttle → CPT-II</text><text x="55" y="659" class="s" text-anchor="start">Malonyl-CoA inhibits CPT-I; not every fatty acid uses this route.</text><text x="55" y="693" class="s" text-anchor="start">Liver exports ketones; mature RBCs cannot oxidize them.</text></svg>