<svg xmlns="http://www.w3.org/2000/svg" width="920" height="898" viewBox="0 0 920 898" role="img" aria-labelledby="t d"><title id="t">Two domains, two settings, one age cut-off</title><desc id="d">Top: ADHD and autism side by side, in the terms the criteria actually use. ADHD needs symptoms before age twelve and in two or more settings — that second requirement is what separates a disorder from a classroom problem, and vignettes almost always say it explicitly. Autism needs both of its domains, social communication and restricted repetitive behaviour; one alone is not enough, which is what the separate diagnosis of social pragmatic communication disorder exists for. Bottom left: the cognitive profile of autism as actually measured, which is a three-way split rather than the common assumption. Bottom right: the comorbidities, which are the rule here rather than the exception, with the rates the exam quotes.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="898" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Two domains, two settings, one age cut-off</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Most of these diagnoses hinge on a threshold the vignette states outright</text><rect x="40" y="180" width="840" height="298" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">The two that get compared</text><rect x="70" y="228" width="380" height="232" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="260.0" y="254.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">ADHD</text><text x="260.0" y="280.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">INATTENTION and/or HYPERACTIVITY-IMPULSIVITY</text><line x1="110" y1="292" x2="410" y2="292" stroke="#245574" stroke-width="1" stroke-dasharray="6 5"/><text x="260.0" y="314.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">onset before age 12  (it was 7 in DSM-IV)</text><text x="260.0" y="336.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">present in TWO or more settings</text><text x="260.0" y="358.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">out of step with developmental level</text><text x="260.0" y="380.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">real impairment, not just noise</text><text x="260.0" y="416.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">stimulants work by raising dopamine</text><text x="260.0" y="434.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">and noradrenaline in frontostriatal circuits</text><rect x="470" y="228" width="380" height="232" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="660.0" y="254.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">AUTISM SPECTRUM DISORDER</text><text x="660.0" y="280.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">BOTH domains are required</text><line x1="510" y1="292" x2="810" y2="292" stroke="#5b7a64" stroke-width="1" stroke-dasharray="6 5"/><text x="660.0" y="314.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">A · social communication and interaction</text><text x="660.0" y="332.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">reciprocity, nonverbal signals, relationships</text><text x="660.0" y="356.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">B · restricted, repetitive behaviour</text><text x="660.0" y="374.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">stereotypies, sameness, fixated interests, sensory</text><text x="660.0" y="404.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">domain A alone → social pragmatic</text><text x="660.0" y="422.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">communication disorder, not autism</text><text x="660.0" y="444.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">severity is rated per domain, 1 to 3</text><rect x="40" y="494" width="420" height="380" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="250.0" y="522.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">Autism and measured ability</text><text x="250.0" y="552.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">intellectual disability</text><text x="250.0" y="569.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">IQ ≤ 70</text><rect x="66" y="580" width="280.46" height="22" rx="5" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="354.5" y="596.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:12px">37.9%</text><text x="250.0" y="626.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">borderline</text><text x="250.0" y="643.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">IQ 71–85</text><rect x="66" y="654" width="173.9" height="22" rx="5" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="247.9" y="670.0" class="" text-anchor="start" style="fill:#987740;font-weight:bold;font-size:12px">23.5%</text><text x="250.0" y="700.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">average or above</text><text x="250.0" y="717.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">IQ &gt; 85</text><rect x="66" y="728" width="285.64000000000004" height="22" rx="5" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="359.6" y="744.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:12px">38.6%</text><text x="250.0" y="790.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">a three-way split, not a majority either way</text><text x="250.0" y="812.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">CDC ADDM, 8-year-olds, 2020 surveillance</text><line x1="80" y1="828" x2="420" y2="828" stroke="#6d716f" stroke-width="1" stroke-dasharray="6 5"/><text x="250.0" y="848.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">prevalence about 1 in 36 · boys about 4× girls</text><text x="250.0" y="866.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">girls are probably under-identified</text><rect x="480" y="494" width="400" height="380" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="680.0" y="522.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">Comorbidity is the rule</text><rect x="506" y="548" width="348" height="56" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="640.0" y="570.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">ASD + ADHD</text><text x="810.0" y="570.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:12px">30–50%</text><text x="680.0" y="590.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">DSM-5 allows both at once; DSM-IV did not</text><rect x="506" y="610" width="348" height="56" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="640.0" y="632.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:11px">ASD + intellectual disability</text><text x="810.0" y="632.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:12px">about 38%</text><text x="680.0" y="652.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">rate it separately from the autism</text><rect x="506" y="672" width="348" height="56" rx="8" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="640.0" y="694.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">learning disorder + ADHD</text><text x="810.0" y="694.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:12px">30–50%</text><text x="680.0" y="714.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">different mechanisms, same report card</text><rect x="506" y="734" width="348" height="56" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="640.0" y="756.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">Tourette&#x27;s + ADHD</text><text x="810.0" y="756.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:12px">about 50%</text><text x="680.0" y="776.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">and about 40% with OCD</text><rect x="506" y="796" width="348" height="56" rx="8" fill="#efede8" stroke="#6d716f" stroke-width="1.8"/><text x="640.0" y="818.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:11px">anxiety + any of them</text><text x="810.0" y="818.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:12px">very high</text><text x="680.0" y="838.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">often the reason they present at all</text><text x="680.0" y="866.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">a child who meets two sets of criteria gets two diagnoses</text></svg>