<svg xmlns="http://www.w3.org/2000/svg" width="920" height="902" viewBox="0 0 920 902" role="img" aria-labelledby="t d"><title id="t">Air to bone to fluid, and then to a nerve</title><desc id="d">Top: the journey, and the problem the middle ear exists to solve. Sound crossing straight from air into fluid would lose about 99.9 per cent of its energy, roughly 30 decibels. The ossicles recover almost all of it by collecting force over the wide eardrum and delivering it to the much smaller oval window, with a small extra lever advantage — together about a twenty-two-fold pressure gain. Middle: the basilar membrane unrolled. It is narrow and stiff at the base and wide and floppy at the apex, so high notes peak near the oval window and low notes near the helicotrema. That map is tonotopy, and it is kept all the way to the cortex. Bottom: what a hair cell does, and why a lesion before the cochlea is a different diagnosis from one inside it.</desc><defs><marker id="m3207" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="902" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Air to bone to fluid, and then to a nerve</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">The cochlea is a frequency analyser: where it moves is which note you hear</text><rect x="40" y="166" width="840" height="182" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="194.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">Three divisions, one impedance problem</text><rect x="66" y="214" width="170" height="104" rx="10" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="151.0" y="240.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">OUTER</text><text x="151.0" y="262.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">pinna · canal</text><text x="151.0" y="288.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">collects; the canal</text><text x="151.0" y="304.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">resonates at 3–4 kHz</text><rect x="246" y="214" width="170" height="104" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="331.0" y="240.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">MIDDLE</text><text x="331.0" y="262.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">malleus · incus · stapes</text><text x="331.0" y="288.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">air → fluid:</text><text x="331.0" y="304.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">the gain happens here</text><rect x="426" y="214" width="170" height="104" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="511.0" y="240.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">INNER</text><text x="511.0" y="262.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">cochlea</text><text x="511.0" y="288.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">transduction on the</text><text x="511.0" y="304.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">basilar membrane</text><line x1="240" y1="266" x2="262" y2="266" stroke="#6d716f" stroke-width="2" marker-end="url(#m3207)"/><line x1="420" y1="266" x2="442" y2="266" stroke="#6d716f" stroke-width="2" marker-end="url(#m3207)"/><rect x="616" y="214" width="234" height="104" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="733.0" y="238.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:13px">WHY IT WORKS</text><text x="733.0" y="260.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">eardrum 55 mm² → oval window 3.2 mm²</text><text x="733.0" y="278.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">≈ 17–20×, plus a 1.3× lever</text><text x="733.0" y="302.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:11px">≈ 22× pressure · about 25–30 dB back</text><rect x="40" y="364" width="840" height="236" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="392.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">The basilar membrane, unrolled</text><path d="M110 436 L810 418 L810 500 L110 466 z" stroke="#987740" stroke-width="2" fill="#f1eadc"/><text x="110.0" y="420.0" class="" text-anchor="start" style="fill:#18364a;font-weight:bold;font-size:12px">BASE</text><text x="110.0" y="528.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">oval window</text><text x="110.0" y="544.0" class="" text-anchor="start" style="fill:#6d716f;font-size:11px">narrow · stiff</text><text x="810.0" y="404.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:12px">APEX</text><text x="810.0" y="528.0" class="" text-anchor="end" style="fill:#6d716f;font-size:11px">helicotrema</text><text x="810.0" y="544.0" class="" text-anchor="end" style="fill:#6d716f;font-size:11px">wide · floppy</text><line x1="138.0" y1="429.6" x2="138.0" y2="470.96" stroke="#18364a" stroke-width="1.4" stroke-dasharray="6 5"/><text x="138.0" y="506.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">20 kHz</text><line x1="320.0" y1="427.0" x2="320.0" y2="477.2" stroke="#18364a" stroke-width="1.4" stroke-dasharray="6 5"/><text x="320.0" y="506.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">4 kHz</text><line x1="502.00000000000006" y1="424.4" x2="502.00000000000006" y2="483.44" stroke="#18364a" stroke-width="1.4" stroke-dasharray="6 5"/><text x="502.0" y="506.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">1 kHz</text><line x1="684.0" y1="421.8" x2="684.0" y2="489.68" stroke="#18364a" stroke-width="1.4" stroke-dasharray="6 5"/><text x="684.0" y="506.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">100 Hz</text><line x1="782.0" y1="420.4" x2="782.0" y2="493.04" stroke="#18364a" stroke-width="1.4" stroke-dasharray="6 5"/><text x="782.0" y="506.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">20 Hz</text><text x="460.0" y="572.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">high notes at the base, low notes at the apex — and this map is preserved right through to the auditory cortex</text><rect x="40" y="616" width="470" height="256" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="275.0" y="644.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">What a hair cell does</text><circle cx="82" cy="678" r="11" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="82.0" y="682.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">1</text><text x="104.0" y="682.0" class="" text-anchor="start" style="fill:#18364a;font-size:11px">shear bends the stereocilia toward the tallest</text><circle cx="82" cy="708" r="11" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="82.0" y="712.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">2</text><text x="104.0" y="712.0" class="" text-anchor="start" style="fill:#18364a;font-size:11px">tip links pull open K⁺ channels</text><circle cx="82" cy="738" r="11" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="82.0" y="742.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">3</text><text x="104.0" y="742.0" class="" text-anchor="start" style="fill:#18364a;font-size:11px">K⁺ flows IN — endolymph is K⁺-rich, +80 mV</text><circle cx="82" cy="768" r="11" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="82.0" y="772.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">4</text><text x="104.0" y="772.0" class="" text-anchor="start" style="fill:#18364a;font-size:11px">depolarisation opens Ca²⁺ channels</text><circle cx="82" cy="798" r="11" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="82.0" y="802.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">5</text><text x="104.0" y="802.0" class="" text-anchor="start" style="fill:#18364a;font-size:11px">glutamate released onto the cochlear nerve</text><text x="275.0" y="848.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:11px">inner hair cells report · outer hair cells amplify, by changing length</text><rect x="530" y="616" width="350" height="256" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="705.0" y="644.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">Two kinds of deafness</text><rect x="556" y="662" width="298" height="92" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="705.0" y="686.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">CONDUCTIVE</text><text x="705.0" y="708.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">outer or middle ear: wax, effusion,</text><text x="705.0" y="724.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">perforation, otosclerosis</text><text x="705.0" y="744.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:11px">bone conduction still works</text><rect x="556" y="766" width="298" height="92" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="705.0" y="790.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">SENSORINEURAL</text><text x="705.0" y="812.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">cochlea or nerve: noise, ageing,</text><text x="705.0" y="828.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">aminoglycosides, acoustic neuroma</text><text x="705.0" y="848.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:11px">air AND bone both impaired</text></svg>