<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc"><title id="title">Cardiac pressure-volume loop</title><desc id="desc">A counterclockwise left ventricular pressure-volume loop with four valve transitions. Volume stays constant on vertical segments. Stroke volume equals end-diastolic minus end-systolic volume.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#245574"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#18364a;font-size:18px}.h{font-size:25px;font-weight:700}.small{font-size:15px}.label{font-size:20px;font-weight:700}</style><rect width="900" height="760" rx="20" fill="#fbf7ef"/><text x="32" y="43" class="h" text-anchor="start">Read the loop from lower right</text><text x="32" y="75" class="small" text-anchor="start">Left ventricle • competent valves • schematic, not patient data</text><path d="M130 590 V130" stroke="#245574" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M130 590 H760" stroke="#245574" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="42" y="124" class="label" text-anchor="start">Pressure</text><text x="680" y="624" class="label" text-anchor="start">Volume</text><path d="M650 540 L650 275 C570 130 420 135 300 230 L300 550 C400 550 540 550 650 540" stroke="#245574" stroke-width="5" fill="none"/><path d="M650 450 V355" stroke="#245574" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M515 164 Q455 161 405 177" stroke="#245574" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M300 300 V460" stroke="#245574" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M410 550 H530" stroke="#245574" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="650" cy="540" r="17" fill="#fff" stroke="#245574" stroke-width="2"/><text x="650" y="546" class="" text-anchor="middle">1</text><circle cx="650" cy="275" r="17" fill="#fff" stroke="#245574" stroke-width="2"/><text x="650" y="281" class="" text-anchor="middle">2</text><circle cx="300" cy="230" r="17" fill="#fff" stroke="#245574" stroke-width="2"/><text x="300" y="236" class="" text-anchor="middle">3</text><circle cx="300" cy="550" r="17" fill="#fff" stroke="#245574" stroke-width="2"/><text x="300" y="556" class="" text-anchor="middle">4</text><text x="690" y="412" class="small" text-anchor="start">Pressure ↑</text><text x="690" y="434" class="small" text-anchor="start">Volume fixed</text><text x="335" y="121" class="label" text-anchor="start">Ejection: volume ↓</text><text x="145" y="360" class="small" text-anchor="start">Pressure ↓</text><text x="145" y="382" class="small" text-anchor="start">Volume fixed</text><text x="420" y="520" class="small" text-anchor="start">Filling: volume ↑</text><text x="300" y="620" class="" text-anchor="middle">ESV</text><text x="650" y="620" class="" text-anchor="middle">EDV</text><path d="M300 650 H650" stroke="#245574" stroke-width="2" fill="none"/><path d="M300 642 V658 M650 642 V658" stroke="#245574" stroke-width="2" fill="none"/><text x="475" y="675" class="" text-anchor="middle">Stroke volume = EDV − ESV</text><text x="32" y="714" class="small" text-anchor="start">1  Mitral closes (S1)     2  Aortic opens     3  Aortic closes (S2)     4  Mitral opens</text><text x="32" y="739" class="small" text-anchor="start">Higher acute afterload at fixed EDV/contractility → higher ESV, narrower loop.</text></svg>