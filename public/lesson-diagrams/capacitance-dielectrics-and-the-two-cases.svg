<svg xmlns="http://www.w3.org/2000/svg" width="920" height="846" viewBox="0 0 920 846" role="img" aria-labelledby="t d"><title id="t">A capacitor stores charge; what changes depends on what is held fixed</title><desc id="d">Top: the parallel-plate capacitor with its definition C = Q/V, the geometry formula, the uniform field E = V/d and the three energy expressions. Middle: the two dielectric scenarios side by side — still connected to the battery, where V and E hold still while C, Q and U all rise by kappa; and disconnected, where Q holds still while V, E and U all fall by kappa. Lower middle: capacitors combine the opposite way to resistors, adding directly in parallel and reciprocally in series, with a worked four and twelve microfarad pair. Bottom: the membrane as a capacitor, where the insulating gap is the two to three nanometre hydrophobic core, giving about one microfarad per square centimetre, and myelin lowers the capacitance by thickening that gap.</desc><defs><marker id="m4795" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="846" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">A capacitor stores charge; what changes depends on what is held fixed</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">C = κε₀A/d is pure geometry — the battery decides whether Q or V is the constant</text><rect x="40" y="126" width="840" height="190" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="154.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">The parallel-plate capacitor</text><rect x="110" y="188" width="280" height="10" rx="2" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><rect x="110" y="282" width="280" height="10" rx="2" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="98.0" y="200.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:bold;font-size:14px">+Q</text><text x="98.0" y="296.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:14px">−Q</text><line x1="142" y1="204" x2="142" y2="278" stroke="#245574" stroke-width="1.6" marker-end="url(#m4795)"/><line x1="190" y1="204" x2="190" y2="278" stroke="#245574" stroke-width="1.6" marker-end="url(#m4795)"/><line x1="238" y1="204" x2="238" y2="278" stroke="#245574" stroke-width="1.6" marker-end="url(#m4795)"/><line x1="286" y1="204" x2="286" y2="278" stroke="#245574" stroke-width="1.6" marker-end="url(#m4795)"/><line x1="334" y1="204" x2="334" y2="278" stroke="#245574" stroke-width="1.6" marker-end="url(#m4795)"/><line x1="382" y1="204" x2="382" y2="278" stroke="#245574" stroke-width="1.6" marker-end="url(#m4795)"/><text x="406.0" y="226.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:bold;font-size:13px">area A</text><text x="406.0" y="250.0" class="" text-anchor="start" style="fill:#6d716f;font-weight:bold;font-size:13px">gap d</text><text x="700.0" y="192.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:20px">C = Q/V = κε₀A/d</text><text x="700.0" y="222.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">E = V/d = σ/ε₀ (uniform)</text><text x="700.0" y="252.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">U = ½QV = ½CV² = Q²/2C</text><text x="700.0" y="282.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">C is geometry: it does not depend on Q or V</text><text x="460.0" y="352.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:17px">Insert a dielectric: which column applies?</text><rect x="50" y="368" width="400" height="182" rx="11" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="250.0" y="394.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">STILL ON THE BATTERY</text><text x="250.0" y="414.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">V is held fixed</text><text x="160.0" y="440.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:14px">V</text><text x="196.0" y="440.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:14px">same</text><text x="160.0" y="462.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:14px">E = V/d</text><text x="196.0" y="462.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:14px">same</text><text x="160.0" y="484.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:14px">C</text><text x="196.0" y="484.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:14px">× κ</text><text x="160.0" y="506.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:14px">Q = CV</text><text x="196.0" y="506.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:14px">× κ</text><text x="160.0" y="528.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:14px">U = ½CV²</text><text x="196.0" y="528.0" class="" text-anchor="start" style="fill:#5b7a64;font-weight:bold;font-size:14px">× κ</text><rect x="470" y="368" width="400" height="182" rx="11" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="670.0" y="394.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">DISCONNECTED</text><text x="670.0" y="414.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">Q is held fixed</text><text x="580.0" y="440.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:14px">Q</text><text x="616.0" y="440.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:14px">same</text><text x="580.0" y="462.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:14px">C</text><text x="616.0" y="462.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:14px">× κ</text><text x="580.0" y="484.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:14px">V = Q/C</text><text x="616.0" y="484.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:14px">÷ κ</text><text x="580.0" y="506.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:14px">E = V/d</text><text x="616.0" y="506.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:14px">÷ κ</text><text x="580.0" y="528.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:14px">U = Q²/2C</text><text x="616.0" y="528.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:bold;font-size:14px">÷ κ</text><text x="460.0" y="572.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">κ &gt; 1 always, so C always rises — but the energy rises only if a battery is there to supply it</text><rect x="40" y="596" width="400" height="150" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="240.0" y="624.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">Backwards from resistors</text><text x="240.0" y="654.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">parallel: C = C₁ + C₂</text><text x="240.0" y="680.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">series: 1/C = 1/C₁ + 1/C₂</text><text x="240.0" y="712.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">4 µF with 12 µF → 16 µF parallel, 3 µF series</text><text x="240.0" y="734.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">series capacitors all carry the same Q</text><rect x="466" y="596" width="414" height="150" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="673.0" y="624.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">The membrane capacitor</text><rect x="506" y="640" width="334" height="13" rx="3" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><rect x="506" y="653" width="334" height="22" rx="0" fill="#e9e4da" stroke="#6d716f" stroke-width="1.5"/><rect x="506" y="675" width="334" height="13" rx="3" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="673.0" y="669.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">hydrophobic core ≈ 2–3 nm, κ ≈ 2–3</text><text x="673.0" y="708.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">C/A ≈ 1 µF/cm²  •  70 mV across it ≈ 10⁷ V/m</text><text x="673.0" y="732.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">myelin thickens the gap, so C falls and signals travel faster</text><text x="460.0" y="790.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:16px">Charge is what is conserved when charged capacitors are disconnected and rewired</text><text x="460.0" y="820.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:14px">— voltage is not, so find the total Q first, then divide by the new total C</text></svg>