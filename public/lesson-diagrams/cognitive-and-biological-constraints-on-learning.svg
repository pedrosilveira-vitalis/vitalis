 y1="402" x2="130" y2="402" stroke="#6d716f" stroke-width="3"/><text x="140.0" y="407.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">never rewarded</text><line x1="96" y1="424" x2="130" y2="424" stroke="#a8324a" stroke-width="3"/><text x="140.0" y="429.0" class="" text-anchor="start" style="fill:#18364a;font-size:13px">reward from day 11</text><rect x="480" y="156" width="400" height="288" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="680.0" y="184.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">Garcia: what goes with what</text><rect x="510" y="206" width="340" height="44" rx="8" fill="#e9e4da" stroke="#6d716f" stroke-width="2"/><text x="680.0" y="234.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:14px">taste  +  light and noise  (both present)</text><line x1="600" y1="254" x2="570" y2="288" stroke="#987740" stroke-width="2.2" marker-end="url(#m1603)"/><line x1="760" y1="254" x2="790" y2="288" stroke="#245574" stroke-width="2.2" marker-end="url(#m574)"/><rect x="492" y="292" width="178" height="62" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="581.0" y="316.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">then: illness</text><text x="581.0" y="340.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">⇒ avoids the TASTE</text><rect x="690" y="292" width="178" height="62" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="779.0" y="316.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">then: shock</text><text x="779.0" y="340.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">⇒ avoids the LIGHT</text><text x="680.0" y="386.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">illness comes from what you ate;</text><text x="680.0" y="406.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">pain comes from what is around you</text><text x="680.0" y="430.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">equipotentiality is simply false</text><rect x="40" y="460" width="840" height="172" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="488.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:16px">Taste aversion breaks four rules of conditioning — and each break pays off</text><rect x="62" y="506" width="196" height="96" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="160.0" y="532.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">one trial</text><text x="160.0" y="556.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">normally many pairings</text><text x="160.0" y="582.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">one bad meal is all you get</text><rect x="268" y="506" width="196" height="96" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="366.0" y="532.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">hours of delay</text><text x="366.0" y="556.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">normally seconds</text><text x="366.0" y="582.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">poison acts slowly</text><rect x="474" y="506" width="196" height="96" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="572.0" y="532.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">taste only</text><text x="572.0" y="556.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">normally everything present</text><text x="572.0" y="582.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">food is the likely culprit</text><rect x="680" y="506" width="196" height="96" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="778.0" y="532.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">barely extinguishes</text><text x="778.0" y="556.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:12px">normally fades</text><text x="778.0" y="582.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">a second test could kill you</text><rect x="40" y="648" width="404" height="200" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="242.0" y="676.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">Two different ways a trained act dies</text><rect x="62" y="696" width="360" height="64" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="242.0" y="718.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">INSTINCTIVE DRIFT</text><text x="242.0" y="742.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">reward keeps coming, but the instinct wins</text><rect x="62" y="770" width="360" height="64" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="242.0" y="792.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">EXTINCTION</text><text x="242.0" y="816.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">the reward stopped, so the act fades</text><rect x="466" y="648" width="414" height="200" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="673.0" y="676.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">Name to phenomenon</text><text x="672.0" y="702.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:13px">Tolman</text><text x="684.0" y="702.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">latent learning, cognitive maps</text><text x="672.0" y="726.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:13px">Köhler</text><text x="684.0" y="726.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">insight in chimpanzees</text><text x="672.0" y="750.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:13px">Bandura</text><text x="684.0" y="750.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">observational learning</text><text x="672.0" y="774.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:13px">Seligman</text><text x="684.0" y="774.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">biological preparedness</text><text x="672.0" y="798.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:13px">Garcia &amp; Koelling</text><text x="684.0" y="798.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">taste aversion</text><text x="672.0" y="822.0" class="" text-anchor="end" style="fill:#18364a;font-weight:bold;font-size:13px">Breland &amp; Breland</text><text x="684.0" y="822.0" class="" text-anchor="start" style="fill:#6d716f;font-size:13px">instinctive drift</text></svg>