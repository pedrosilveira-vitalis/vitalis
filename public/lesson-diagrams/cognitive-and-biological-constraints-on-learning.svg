<svg xmlns="http://www.w3.org/2000/svg" width="920" height="880" viewBox="0 0 920 880" role="img" aria-labelledby="t d"><title id="t">Not every association is equally learnable</title><desc id="d">Top left: Tolman&#x27;s three groups of rats plotted as errors against days. The always-rewarded group improves steadily, the never-rewarded group barely improves, and the group switched to reward on day eleven drops almost at once to the level of the rewarded group — the map had been built all along and only the reason to use it was missing. Top right: Garcia and Koelling&#x27;s result, in which a compound of taste plus light and noise is followed either by illness or by shock; illness attaches to the taste and shock attaches to the light and noise, and not the other way round. Middle: the four ways taste aversion breaks the ordinary rules of conditioning, with the adaptive reason for each. Bottom: instinctive drift against extinction, and a list of which researcher goes with which phenomenon.</desc><defs><marker id="m1603" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#987740"/></marker><marker id="m574" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#245574"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="880" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Not every association is equally learnable</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Cognition fills in what reinforcement cannot explain; evolution decides what is easy to learn</text><rect x="40" y="156" width="420" height="288" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="250.0" y="184.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">Tolman: learning you cannot see</text><line x1="110" y1="316" x2="406" y2="316" stroke="#18364a" stroke-width="2"/><line x1="110" y1="196" x2="110" y2="316" stroke="#18364a" stroke-width="2"/><text x="258.0" y="360.0" class="" text-anchor="middle" style="font-size:17px">days in the maze</text><text x="66" y="256.0" text-anchor="middle" transform="rotate(-90 66 256.0)" style="font-size:17px">errors</text><line x1="110.0" y1="316.0" x2="110.0" y2="322.0" stroke="#18364a" stroke-width="2"/><text x="110.0" y="338.0" class="" text-anchor="middle" style="font-size:14px">1</text><line x1="184.0" y1="316.0" x2="184.0" y2="322.0" stroke="#18364a" stroke-width="2"/><text x="184.0" y="338.0" class="" text-anchor="middle" style="font-size:14px">5</text><line x1="295.0" y1="316.0" x2="295.0" y2="322.0" stroke="#18364a" stroke-width="2"/><text x="295.0" y="338.0" class="" text-anchor="middle" style="font-size:14px">11</text><line x1="406.0" y1="316.0" x2="406.0" y2="322.0" stroke="#18364a" stroke-width="2"/><text x="406.0" y="338.0" class="" text-anchor="middle" style="font-size:14px">17</text><path d="M110.0 208.0 L111.9 210.6 L113.7 213.1 L115.5 215.5 L117.4 217.9 L119.2 220.1 L121.1 222.4 L123.0 224.5 L124.8 226.6 L126.7 228.7 L128.5 230.6 L130.3 232.5 L132.2 234.4 L134.1 236.2 L135.9 238.0 L137.8 239.7 L139.6 241.3 L141.4 242.9 L143.3 244.5 L145.2 246.0 L147.0 247.5 L148.8 248.9 L150.7 250.3 L152.6 251.7 L154.4 253.0 L156.2 254.2 L158.1 255.5 L159.9 256.7 L161.8 257.8 L163.7 259.0 L165.5 260.1 L167.3 261.1 L169.2 262.2 L171.1 263.2 L172.9 264.1 L174.8 265.1 L176.6 266.0 L178.4 266.9 L180.3 267.8 L182.2 268.6 L184.0 269.4 L185.8 270.2 L187.7 271.0 L189.6 271.7 L191.4 272.5 L193.2 273.2 L195.1 273.8 L196.9 274.5 L198.8 275.2 L200.7 275.8 L202.5 276.4 L204.3 277.0 L206.2 277.6 L208.1 278.1 L209.9 278.7 L211.8 279.2 L213.6 279.7 L215.4 280.2 L217.3 280.7 L219.2 281.1 L221.0 281.6 L222.8 282.0 L224.7 282.5 L226.6 282.9 L228.4 283.3 L230.2 283.7 L232.1 284.1 L233.9 284.4 L235.8 284.8 L237.7