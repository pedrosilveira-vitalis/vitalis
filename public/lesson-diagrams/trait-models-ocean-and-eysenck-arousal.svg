<svg xmlns="http://www.w3.org/2000/svg" width="920" height="906" viewBox="0 0 920 906" role="img" aria-labelledby="t d"><title id="t">Four men, four answers to “how many traits are there?”</title><desc id="d">Top: the lineage. Allport opened a dictionary and sorted words by how much of a life they explained; Cattell put the same words through factor analysis and got sixteen; Eysenck said sixteen was too many and factored again to three, which he tried to tie to the nervous system; the Big Five landed in between and has stayed there because it keeps replicating. Bottom left: OCEAN, with what each dimension actually predicts — which is what vignette questions test, not the definitions. Bottom right: the two biological claims Eysenck made that the exam still asks about, drawn the right way round. Introverts start from higher cortical arousal, which is why the quiet room suits them and why reversing this is the commonest error on the topic.</desc><defs><marker id="m4469" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="906" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Four men, four answers to “how many traits are there?”</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">The question that separates them is how they counted, and whether they asked why</text><rect x="40" y="178" width="840" height="212" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="206.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:16px">From 18,000 words to five dimensions</text><rect x="62" y="226" width="198" height="144" rx="10" fill="#efede8" stroke="#6d716f" stroke-width="2"/><text x="161.0" y="252.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:13px">ALLPORT</text><text x="161.0" y="274.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">~4,500 trait words</text><text x="161.0" y="296.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">cardinal · central · secondary</text><text x="161.0" y="326.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">sorted by how much of a life</text><text x="161.0" y="342.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">each one explains</text><line x1="260" y1="298" x2="268" y2="298" stroke="#6d716f" stroke-width="1.8" marker-end="url(#m4469)"/><rect x="268" y="226" width="198" height="144" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="367.0" y="252.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:13px">CATTELL</text><text x="367.0" y="274.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">16 source traits</text><text x="367.0" y="296.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">factor analysis of the words</text><text x="367.0" y="326.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">surface traits are what you see;</text><text x="367.0" y="342.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">source traits cause them</text><line x1="466" y1="298" x2="474" y2="298" stroke="#6d716f" stroke-width="1.8" marker-end="url(#m4469)"/><rect x="474" y="226" width="198" height="144" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="573.0" y="252.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">EYSENCK</text><text x="573.0" y="274.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">3 supertraits</text><text x="573.0" y="296.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">P · E · N</text><text x="573.0" y="326.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">factored again, and asked</text><text x="573.0" y="342.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">what the brain was doing</text><line x1="672" y1="298" x2="680" y2="298" stroke="#6d716f" stroke-width="1.8" marker-end="url(#m4469)"/><rect x="680" y="226" width="198" height="144" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="779.0" y="252.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">BIG FIVE</text><text x="779.0" y="274.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">5 factors</text><text x="779.0" y="296.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">O · C · E · A · N</text><text x="779.0" y="326.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">replicates across languages;</text><text x="779.0" y="342.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">strong at predicting</text><rect x="40" y="410" width="470" height="466" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="275.0" y="438.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">OCEAN, and what each one predicts</text><rect x="66" y="460" width="418" height="72" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="2"/><circle cx="100" cy="496" r="19" fill="#ffffff" stroke="#987740" stroke-width="2"/><text x="100.0" y="502.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:17px">O</text><text x="300.0" y="482.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">OPENNESS</text><text x="300.0" y="502.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">curious, imaginative, likes the new</text><text x="300.0" y="520.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">predicts: creative achievement</text><rect x="66" y="538" width="418" height="72" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><circle cx="100" cy="574" r="19" fill="#ffffff" stroke="#5b7a64" stroke-width="2"/><text x="100.0" y="580.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">C</text><text x="300.0" y="560.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:12px">CONSCIENTIOUSNESS</text><text x="300.0" y="580.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">organised, dependable, deliberate</text><text x="300.0" y="598.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">predicts: job performance · adherence · longevity</text><rect x="66" y="616" width="418" height="72" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="2"/><circle cx="100" cy="652" r="19" fill="#ffffff" stroke="#245574" stroke-width="2"/><text x="100.0" y="658.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:17px">E</text><text x="300.0" y="638.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">EXTRAVERSION</text><text x="300.0" y="658.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">sociable, assertive, seeks stimulation</text><text x="300.0" y="676.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">predicts: positive affect and well-being</text><rect x="66" y="694" width="418" height="72" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="2"/><circle cx="100" cy="730" r="19" fill="#ffffff" stroke="#987740" stroke-width="2"/><text x="100.0" y="736.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:17px">A</text><text x="300.0" y="716.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12px">AGREEABLENESS</text><text x="300.0" y="736.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">cooperative, trusting, harmony-seeking</text><text x="300.0" y="754.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">predicts: relationship satisfaction</text><rect x="66" y="772" width="418" height="72" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><circle cx="100" cy="808" r="19" fill="#ffffff" stroke="#a8324a" stroke-width="2"/><text x="100.0" y="814.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">N</text><text x="300.0" y="794.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">NEUROTICISM</text><text x="300.0" y="814.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">reactive, anxious, slow to settle</text><text x="300.0" y="832.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">predicts: depression, anxiety, poorer health</text><text x="275.0" y="862.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">heritability runs about 40–60% for every one of them</text><rect x="530" y="410" width="350" height="466" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="705.0" y="438.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">Eysenck&#x27;s two claims</text><rect x="556" y="458" width="298" height="190" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="705.0" y="482.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12px">EXTRAVERSION ← cortical arousal</text><text x="705.0" y="508.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">INTROVERT</text><text x="705.0" y="528.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">starts HIGH on the dial</text><text x="705.0" y="546.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">so added noise overshoots</text><text x="705.0" y="564.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">→ prefers the quiet room</text><line x1="596" y1="580" x2="814" y2="580" stroke="#6d716f" stroke-width="1" stroke-dasharray="6 5"/><text x="705.0" y="600.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:13px">EXTRAVERT</text><text x="705.0" y="618.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">starts LOW — goes looking for input</text><text x="705.0" y="636.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">→ bored by the quiet room</text><rect x="556" y="666" width="298" height="118" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="705.0" y="690.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12px">NEUROTICISM ← limbic reactivity</text><text x="705.0" y="716.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">the alarm trips more easily</text><text x="705.0" y="734.0" class="" text-anchor="middle" style="fill:#18364a;font-size:11px">and takes longer to switch off</text><text x="705.0" y="762.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">the modern version: HPA reactivity</text><text x="705.0" y="812.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">P · E · N is only three because he</text><text x="705.0" y="830.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">factor-analysed Cattell&#x27;s sixteen again</text><text x="705.0" y="858.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">reversing the arousal claim is the classic slip</text></svg>