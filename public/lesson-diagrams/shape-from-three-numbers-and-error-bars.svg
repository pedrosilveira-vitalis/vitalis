<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1070" viewBox="0 0 920 1070" role="img" aria-labelledby="t d"><title id="t">Reading a distribution from three numbers</title><desc id="d">Top: the three shapes and the ordering of mean, median and mode in each. The mode is always at the peak and the mean is always dragged toward the long tail, so the median ends up between them — which is why a mean far above a median is the signature of a right tail, and why the median is what you quote for income. Middle: the empirical rule, the one piece of arithmetic on this topic the exam expects you to do in your head. Bottom: standard deviation against standard error, and what error bars do and do not let you conclude — a question that depends entirely on which of the two is drawn.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="1070" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Reading a distribution from three numbers</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Where the mean sits relative to the median tells you the shape</text><rect x="40" y="180" width="840" height="290" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">Mean, median and mode in three shapes</text><line x1="70" y1="356" x2="310" y2="356" stroke="#18364a" stroke-width="2"/><line x1="70" y1="236" x2="70" y2="356" stroke="#18364a" stroke-width="2"/><text x="190.0" y="400.0" class="" text-anchor="middle" style="font-size:17px"></text><text x="26" y="296.0" text-anchor="middle" transform="rotate(-90 26 296.0)" style="font-size:17px"></text><path d="M74.8 355.6 L76.7 355.6 L78.6 355.5 L80.6 355.4 L82.5 355.2 L84.4 355.1 L86.3 354.9 L88.2 354.7 L90.2 354.5 L92.1 354.2 L94.0 353.9 L