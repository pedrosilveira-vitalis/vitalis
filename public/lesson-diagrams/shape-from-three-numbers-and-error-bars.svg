" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">mean = median = mode</text><text x="190.0" y="414.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">all three coincide</text><line x1="340" y1="356" x2="580" y2="356" stroke="#18364a" stroke-width="2"/><line x1="340" y1="236" x2="340" y2="356" stroke="#18364a" stroke-width="2"/><text x="460.0" y="400.0" class="" text-anchor="middle" style="font-size:17px"></text><text x="296" y="296.0" text-anchor="middle" transform="rotate(-90 296 296.0)" style="font-size:17px"></text><path d="M344.8 353.1 L346.7 352.5 L348.6 351.8 L350.6 351.0 L352.5 350.1 L354.4 349.0 L356.3 347.7 L358.2 346.3 L360.2 344.6 L362.1 342.8 L364.0 340.7 L365.9 338.3 L367.8 335.7 L369.8 332.9 L371.7 329.8 L373.6 326.4 L375.5 322.7 L377.4 318.8 L379.4 314.6 L381.3 310.2 L383.2 305.6 L385.1 300.8 L387.0 296.0 L389.0 291.0 L390.9 286.0 L392.8 281.0 L394.7 276.0 L396.6 271.2 L398.6 266.6 L400.5 262.3 L402.4 258.2 L404.3 254.5 L406.2 251.2 L408.2 248.3 L410.1 246.0 L412.0 244.1 L413.9 242.8 L415.8 242.0 L417.8 241.7 L419.7 242.0 L421.6 242.8 L423.5 244.0 L425.4 245.7 L427.4 247.8 L429.3 250.3 L431.2 253.0 L433.1 256.1 L435.0 259.3 L437.0 262.6 L438.9 266.1 L440.8 269.6 L442.7 273.1 L444.6 276.5 L446.6 279.9 L448.5 283.1 L450.4 286.2 L452.3 289.1 L454.2 291.9 L456.2 294.5 L458.1 296.8 L460.0 299.0 L461.9 301.0 L463.8 302.8 L465.8 304.4 L467.7 305.9 L469.6 307.2 L471.5 308.5 L473.4 309.6 L475.4 310.6 L477.3 311.5 L479.2 312.4 L481.1 313.3 L483.0 314.1 L485.0 314.8 L486.9 315.6 L488.8 316.4 L490.7 317.1 L492.6 317.9 L494.6 318.7 L496.5 319.5 L498.4 320.4 L500.3 321.2 L502.2 322.1 L504.2 323.0 L506.1 323.9 L508.0 324.9 L509.9 325.8 L511.8 326.8 L513.8 327.8 L515.7 328.8 L517.6 329.8 L519.5 330.8 L521.4 331.8 L523.4 332.9 L525.3 333.9 L527.2 334.9 L529.1 335.8 L531.0 336.8 L533.0 337.8 L534.9 338.7 L536.8 339.6 L538.7 340.5 L540.6 341.4 L542.6 342.3 L544.5 343.1 L546.4 343.9 L548.3 344.6 L550.2 345.4 L552.2 346.1 L554.1 346.7 L556.0 347.4 L557.9 348.0 L559.8 348.6 L561.8 349.1 L563.7 349.6 L565.6 350.1 L567.5 350.6 L569.4 351.0 L571.4 351.4 L573.3 351.8 L575.2 352.2" stroke="#a8324a" stroke-width="2.6" fill="none"/><line x1="414.4" y1="356.0" x2="414.4" y2="251.6043643685955" stroke="#987740" stroke-width="1.6" stroke-dasharray="6 5"/><line x1="433.6" y1="356.0" x2="433.6" y2="264.7806956349332" stroke="#5b7a64" stroke-width="1.6" stroke-dasharray="6 5"/><line x1="452.8" y1="356.0" x2="452.8" y2="295.142979044517" stroke="#a8324a" stroke-width="1.6" stroke-dasharray="6 5"/><text x="460.0" y="378.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">POSITIVE / RIGHT SKEW</text><text x="460.0" y="396.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">mean &gt; median &gt; mode</text><text x="460.0" y="414.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">the tail is where the mean goes</text><line x1="610" y1="356" x2="850" y2="356" stroke="#18364a" stroke-width="2"/><line x1="610" y1="236" x2="610" y2="356" stroke="#18364a" stroke-width="2"/><text x="730.0" y="400.0" class="" text-anchor="middle" style="font-size:17px"></text><text x="566" y="296.0" text-anchor="middle" transform="rotate(-90 566 296.0)" style="font-size:17px"></text><path d="M614.8 352.2 L616.7 351.8 L618.6 351.4 L620.6 351.0 L622.5 350.6 L624.4 350.1 L626.3 349.6 L628.2 349.1 L630.2 348.6 L632.1 348.0 L634.0 347.4 L635.9 346.7 L637.8 346.1 L639.8 345.4 L641.7 344.6 L643.6 343.9 L645.5 343.1 L647.4 342.3 L649.4 341.4 L651.3 340.5 L653.2 339.6 L655.1 338.7 L657.0 337.8 L659.0 336.8 L660.9 335.8 L662.8 334.9 L664.7 333.9 L666.6 332.9 L668.6 331.8 L670.5 330.8 L672.4 329.8 L674.3 328.8 L676.2 327.8 L678.2 326.8 L680.1 325.8 L682.0 324.9 L683.9 323.9 L685.8 323.0 L687.8 322.1 L689.7 321.2 L691.6 320.4 L693.5 319.5 L695.4 318.7 L697.4 317.9 L699.3 317.1 L701.2 316.4 L703.1 315.6 L705.0 314.8 L707.0 314.1 L708.9 313.3 L710.8 312.4 L7