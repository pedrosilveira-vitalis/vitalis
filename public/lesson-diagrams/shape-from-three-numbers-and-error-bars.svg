class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:9px">mean</text><text x="460.0" y="458.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">a mean of $85k against a median of $52k is a right tail, which is why incomes are quoted as medians</text><rect x="40" y="486" width="840" height="214" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="514.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">The 68–95–99.7 rule</text><line x1="170" y1="644" x2="750" y2="644" stroke="#18364a" stroke-width="2"/><line x1="170" y1="534" x2="170" y2="644" stroke="#18364a" stroke-width="2"/><text x="460.0" y="688.0" class="" text-anchor="middle" style="font-size:17px"></text><text x="126" y="589.0" text-anchor="middle" transform="rotate(-90 126 589.0)" style="font-size:17px"></text><path d="M170.0 644.0 L174.8 644.0 L179.7 643.9 L184.5 643.9 L189.3 643.9 L194.2 643.9 L199.0 643.8 L203.8 643.8 L208.7 643.7 L213.5 643.7 L218.3 643.6 L223.2 643.5 L228.0 643.4 L232.8 643.2 L237.7 643.0 L242.5 642.8 L247.3 642.6 L252.2 642.3 L257.0 641.9 L261.8 641.5 L266.7 641.0 L271.5 640.4 L276.3 639.8 L281.2 639.0 L286.0 638.1 L290.8 637.1 L295.7 636.0 L300.5 634.7 L305.3 633.2 L310.2 631.6 L315.0 629.8 L319.8 627.8 L324.7 625.7 L329.5 623.3 L334.3 620.7 L339.2 617.9 L344.0 614.9 L348.8 611.7 L353.7 608.3 L358.5 604.7 L363.3 600.9 L368.2 597.0 L373.0 593.0 L377.8 588.9 L382.7 584.7 L387.5 580.5 L392.3 576.2 L397.2 572.0 L402.0 567.9 L406.8 563.9 L411.7 560.1 L416.5 556.5 L421.3 553.1 L426.2 550.0 L431.0 547.3 L435.8 544.9 L440.7 542.9 L445.5 541.3 L450.3 540.2 L455.2 539.5 L460.0 539.2 L464.8 539.5 L469.7 540.2 L474.5 541.3 L479.3 542.9 L484.2 544.9 L489.0 547.3 L493.8 550.0 L498.7 553.1 L503.5 556.5 L508.3 560.1 L513.2 563.9 L518.0 567.9 L522.8 572.0 L527.7 576.2 L532.5 580.5 L537.3 584.7 L542.2 588.9 L547.0 593.0 L551.8 597.0 L556.7 600.9 L561.5 604.7 L566.3 608.3 L571.2 611.7 L576.0 614.9 L580.8 617.9 L585.7 620.7 L590.5 623.3 L595.3 625.7 L600.2 627.8 L605.0 629.8 L609.8 631.6 L614.7 633.2 L619.5 634.7 L624.3 636.0 L629.2 637.1 L634.0 638.1 L638.8 639.0 L643.7 639.8 L648.5 640.4 L653.3 641.0 L658.2 641.5 L663.0 641.9 L667.8 642.3 L672.7 642.6 L677.5 642.8 L682.3 643.0 L687.2 643.2 L692.0 643.4 L696.8 643.5 L701.7 643.6 L706.5 643.7 L711.3 643.7 L716.2 643.8 L721.0 643.8 L725.8 643.9 L730.7 643.9 L735.5 643.9 L740.3 643.9 L745.2 644.0 L750.0 644.0" stroke="#18364a" stroke-width="2.6" fill="none"/><line x1="387.5" y1="644.0" x2="387.5" y2="580.4586927920099" stroke="#5b7a64" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="532.5" y1="644.0" x2="532.5" y2="580.4586927920099" stroke="#5b7a64" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="315.0" y1="644.0" x2="315.0" y2="629.8220179466406" stroke="#987740" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="605.0" y1="644.0" x2="605.0" y2="629.8220179466406" stroke="#987740" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="242.5" y1="644.0" x2="242.5" y2="642.8362003626603" stroke="#a8324a" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="677.5" y1="644.0" x2="677.5" y2="642.8362003626603" stroke="#a8324a" stroke-width="1.5" stroke-dasharray="6 5"/><text x="242.5" y="662.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">−3</text><text x="315.0" y="662.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">−2</text><text x="387.5" y="662.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">−1</text><text x="460.0" y="662.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">mean</text><text x="532.5" y="662.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">+1</text><text x="605.0" y="662.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">+2</text><text x="677.5" y="662.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">+3</text><text x="460.0" y="684.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">±1 SD ≈ 68% · ±2 SD ≈ 95% · ±3 SD ≈ 99.7%</text><rect x="40" y="716" width="840" height="330" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="744.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">SD, SEM, and what error bars let you say</text><rect x="60" y="764" width="390" height="92" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="255.0" y="786.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11px">STANDARD DEVIATION</text><text x="255.0" y="806.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">how spread out the INDIVIDUALS are</text><text x="255.0" y="824.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">does not shrink as you collect more data —</text><text x="255.0" y="840.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">it is a fact about the population</text><rect x="470" y="764" width="390" height="92" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="665.0" y="786.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11px">STANDARD ERROR  =  SD ÷ √N</text><text x="665.0" y="806.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">how precisely you know the MEAN</text><text x="665.0" y="824.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">shrinks as N grows — it is a fact about</text><text x="665.0" y="840.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">your estimate, not about the people</text><text x="460.0" y="882.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">SO ERROR BARS MEAN DIFFERENT THINGS DEPENDING ON WHICH ONE IS DRAWN</text><rect x="60" y="898" width="800" height="26" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.3"/><text x="140.0" y="915.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:9.5px">SD bars</text><text x="560.0" y="915.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">overlap or gap tells you almost nothing about significance</text><rect x="60" y="930" width="800" height="36" rx="6" fill="#f1eadc" stroke="#987740" stroke-width="1.3"/><text x="140.0" y="952.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:9.5px">SEM bars</text><text x="560.0" y="945.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">if they OVERLAP (and N is similar), p is well above 0.05;</text><text x="560.0" y="959.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">a gap of about one SEM is where p reaches 0.05</text><rect x="60" y="972" width="800" height="36" rx="6" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.3"/><text x="140.0" y="994.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:9.5px">95% CI bars</text><text x="560.0" y="987.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">may overlap by up to about half an arm and still be significant;</text><text x="560.0" y="1001.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">if they merely touch, the difference is already highly significant</text></svg>