<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1000" viewBox="0 0 920 1000" role="img" aria-labelledby="t d"><title id="t">One behaviour, four different explanations</title><desc id="d">Top: the same lateness, explained four ways. The fundamental attribution error, the actor-observer asymmetry and the self-serving bias are not separate facts to memorise — they are the same tilt seen from different seats. Watching someone else, the person is what you see, so the cause lands on their character. Being the person, the situation is what you see, so the cause lands on circumstance. Add the motive to protect self-esteem and the actor&#x27;s own successes come back inside while their failures stay outside. Bottom left: Kelley&#x27;s three dials, with the combinations that point each way. Bottom right: the inference biases that all run on one principle — what arrives first, or comes to mind easiest, counts for too much.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="1000" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">One behaviour, four different explanations</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Who is judging whom decides which way the attribution falls</text><rect x="40" y="180" width="840" height="318" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">“They arrived late.” Now explain it.</text><rect x="70" y="228" width="780" height="44" rx="8" fill="#efede8" stroke="#6d716f" stroke-width="1.6"/><text x="460.0" y="256.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:12px">THE BEHAVIOUR: someone shows up twenty minutes late to a meeting</text><rect x="70" y="286" width="186" height="150" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="163.0" y="310.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10px">YOU, watching THEM</text><text x="163.0" y="336.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10.5px">“they are disorganised”</text><rect x="98" y="350" width="130" height="24" rx="5" fill="none" stroke="#a8324a" stroke-width="1.4"/><text x="163.0" y="366.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:9.5px">DISPOSITIONAL</text><text x="163.0" y="394.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">fundamental attribution error</text><rect x="268" y="286" width="186" height="150" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="361.0" y="310.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10px">YOU, explaining YOU</text><text x="361.0" y="336.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10.5px">“the train was delayed”</text><rect x="296" y="350" width="130" height="24" rx="5" fill="none" stroke="#245574" stroke-width="1.4"/><text x="361.0" y="366.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:9.5px">SITUATIONAL</text><text x="361.0" y="394.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">the actor half of actor-observer</text><rect x="466" y="286" width="186" height="150" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="559.0" y="310.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10px">YOU, after SUCCEEDING</text><text x="559.0" y="336.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10.5px">“I prepared well”</text><rect x="494" y="350" width="130" height="24" rx="5" fill="none" stroke="#5b7a64" stroke-width="1.4"/><text x="559.0" y="366.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:9.5px">DISPOSITIONAL</text><text x="559.0" y="394.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">self-serving bias</text><text x="559.0" y="408.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">esteem up</text><rect x="664" y="286" width="186" height="150" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="757.0" y="310.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10px">YOU, after FAILING</text><text x="757.0" y="336.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10.5px">“the test was unfair”</text><rect x="692" y="350" width="130" height="24" rx="5" fill="none" stroke="#987740" stroke-width="1.4"/><text x="757.0" y="366.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:9.5px">SITUATIONAL</text><text x="757.0" y="394.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">self-serving bias</text><text x="757.0" y="408.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">esteem defended</text><text x="460.0" y="466.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11.5px">the person is salient when you watch; the situation is salient when you live it</text><text x="460.0" y="486.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10px">collectivist cultures show the tilt more weakly, and sometimes reverse the self-serving half</text><rect x="40" y="514" width="410" height="464" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="245.0" y="542.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:15px">Kelley&#x27;s three dials</text><rect x="64" y="566" width="362" height="44" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="245.0" y="586.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">CONSENSUS</text><text x="245.0" y="602.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">do OTHERS do it too?</text><rect x="64" y="616" width="362" height="44" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="245.0" y="636.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">DISTINCTIVENESS</text><text x="245.0" y="652.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">do they do it ONLY here?</text><rect x="64" y="666" width="362" height="44" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="245.0" y="686.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11px">CONSISTENCY</text><text x="245.0" y="702.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">do they do it EVERY time?</text><rect x="64" y="724" width="362" height="108" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="245.0" y="748.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">HIGH · HIGH · HIGH</text><text x="245.0" y="768.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">everyone does it, only here, every time</text><text x="245.0" y="794.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:13px">→ SITUATIONAL</text><text x="245.0" y="814.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">the cause is the thing, not the person</text><rect x="64" y="844" width="362" height="108" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="245.0" y="868.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">LOW · LOW · HIGH</text><text x="245.0" y="888.0" class="" text-anchor="middle" style="fill:#18364a;font-size:10px">only they do it, everywhere, every time</text><text x="245.0" y="914.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:13px">→ DISPOSITIONAL</text><text x="245.0" y="934.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">the cause is the person</text><rect x="470" y="514" width="410" height="464" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="675.0" y="542.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">What counts for too much</text><rect x="494" y="566" width="362" height="49" rx="7" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="675.0" y="583.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10.5px">PRIMACY</text><text x="675.0" y="598.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">what came FIRST</text><text x="675.0" y="612.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">early traits set the lens the rest is read through</text><rect x="494" y="622" width="362" height="62" rx="7" fill="#f1eadc" stroke="#987740" stroke-width="1.5"/><text x="675.0" y="639.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10.5px">ANCHORING</text><text x="675.0" y="654.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">the FIRST number or impression</text><text x="675.0" y="668.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">later information adjusts it, never enough — which is</text><text x="675.0" y="681.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">why a first impression survives contrary evidence</text><rect x="494" y="691" width="362" height="49" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="675.0" y="708.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">AVAILABILITY</text><text x="675.0" y="723.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">what comes to MIND easiest</text><text x="675.0" y="737.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">vivid and recent feels frequent</text><rect x="494" y="747" width="362" height="49" rx="7" fill="#e4edf3" stroke="#245574" stroke-width="1.5"/><text x="675.0" y="764.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">REPRESENTATIVENESS</text><text x="675.0" y="779.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">what RESEMBLES the prototype</text><text x="675.0" y="793.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">fits the picture, so base rates get ignored</text><rect x="494" y="803" width="362" height="49" rx="7" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="675.0" y="820.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">HALO</text><text x="675.0" y="835.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">one GOOD thing, globally</text><text x="675.0" y="849.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">a positive evaluation spills into unrelated domains</text><rect x="494" y="859" width="362" height="49" rx="7" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="675.0" y="876.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10.5px">IMPLICIT PERSONALITY THEORY</text><text x="675.0" y="891.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">which traits you think TRAVEL together</text><text x="675.0" y="905.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">the lay belief that warm people are also generous</text><rect x="494" y="915" width="362" height="49" rx="7" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.5"/><text x="675.0" y="932.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">CONFIRMATION</text><text x="675.0" y="947.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9.5px">what AGREES with you already</text><text x="675.0" y="961.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">and acting on it makes others confirm it</text></svg>