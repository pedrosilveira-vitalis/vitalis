<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="634" viewBox="0 0 1060 634" role="img" aria-labelledby="t d"><title id="t">Four architectures — and where the author&#x27;s own voice actually sits</title><desc id="d">Four passage architectures shown as stacks of paragraph blocks, with the blocks in which the author speaks in their own voice shaded and the rest left pale. Thesis-first, common in academic prose: thesis stated, support, support, then a restatement with implications; the author&#x27;s voice is in the first and last. The note says the position is there from the start, so the job in paragraph one is to make it precise. Problem-solution, common in social science: problem established, why earlier attempts failed, a pivot to what is needed instead, then the proposal; the author&#x27;s voice begins at the pivot. The note says find the pivot, because everything before it is diagnosis rather than the author&#x27;s own claim. Dialectical, the pattern that catches people: view A presented, view B presented, the strengths and weaknesses of each, then a synthesis or a third position; only the last block is the author. The note says three paragraphs can pass before the author speaks for themselves. Narrative to argument, common in humanities: a case, anecdote or episode, then what it is being used to show, then the general claim, then elaboration; the author&#x27;s voice starts from the second block. The note says the story is the illustration and never the point, so ask what claim it serves. A footer gives the question to ask at every paragraph break: is this the author speaking, or a view the author is about to complicate, qualify or reject? It adds that a contrast word such as however, yet or nevertheless often marks the sentence where that answer changes.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1060" height="634" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Four architectures — and where the author&#x27;s own voice actually sits</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Shaded blocks are the author speaking for themselves. Reading the wrong block as the author&#x27;s view is the most expensive error in CARS.</text><text x="147.0" y="126.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:14.5px">THESIS-FIRST</text><text x="147.0" y="144.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">common in academic prose</text><rect x="24" y="158" width="246" height="56" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="147.0" y="184.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">Thesis stated</text><rect x="24" y="222" width="246" height="56" rx="8" fill="#ffffff" stroke="#c9c2b4" stroke-width="1"/><text x="147.0" y="248.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:400;font-size:12px">Support</text><rect x="24" y="286" width="246" height="56" rx="8" fill="#ffffff" stroke="#c9c2b4" stroke-width="1"/><text x="147.0" y="312.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:400;font-size:12px">Support</text><rect x="24" y="350" width="246" height="56" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="147.0" y="376.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">Restated, with implications</text><line x1="44" y1="416" x2="250" y2="416" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="147.0" y="440.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">The position is there from the</text><text x="147.0" y="455.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">start. Your job in ¶1 is to</text><text x="147.0" y="470.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">make it precise.</text><text x="403.0" y="126.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:14.5px">PROBLEM–SOLUTION</text><text x="403.0" y="144.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">common in social science</text><rect x="280" y="158" width="246" height="56" rx="8" fill="#ffffff" stroke="#c9c2b4" stroke-width="1"/><text x="403.0" y="184.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:400;font-size:12px">Problem established</text><rect x="280" y="222" width="246" height="56" rx="8" fill="#ffffff" stroke="#c9c2b4" stroke-width="1"/><text x="403.0" y="248.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:400;font-size:12px">Why earlier attempts failed</text><rect x="280" y="286" width="246" height="56" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="403.0" y="312.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">PIVOT → what is needed</text><text x="403.0" y="326.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">instead</text><rect x="280" y="350" width="246" height="56" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="403.0" y="376.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">The proposal</text><line x1="300" y1="416" x2="506" y2="416" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="403.0" y="440.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">Find the pivot. Everything</text><text x="403.0" y="455.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">before it is diagnosis, not</text><text x="403.0" y="470.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">the author&#x27;s claim.</text><text x="659.0" y="126.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:14.5px">DIALECTICAL</text><text x="659.0" y="144.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">the one that catches people</text><rect x="536" y="158" width="246" height="56" rx="8" fill="#ffffff" stroke="#c9c2b4" stroke-width="1"/><text x="659.0" y="184.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:400;font-size:12px">View A, presented</text><rect x="536" y="222" width="246" height="56" rx="8" fill="#ffffff" stroke="#c9c2b4" stroke-width="1"/><text x="659.0" y="248.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:400;font-size:12px">View B, presented</text><rect x="536" y="286" width="246" height="56" rx="8" fill="#ffffff" stroke="#c9c2b4" stroke-width="1"/><text x="659.0" y="312.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:400;font-size:12px">Strengths and weaknesses of</text><text x="659.0" y="326.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:400;font-size:12px">each</text><rect x="536" y="350" width="246" height="56" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="659.0" y="376.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">Synthesis — or a third</text><text x="659.0" y="390.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">position</text><line x1="556" y1="416" x2="762" y2="416" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="659.0" y="440.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">Three paragraphs can pass</text><text x="659.0" y="455.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">before the author speaks for</text><text x="659.0" y="470.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">themselves.</text><text x="915.0" y="126.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:14.5px">NARRATIVE → ARGUMENT</text><text x="915.0" y="144.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">common in humanities</text><rect x="792" y="158" width="246" height="56" rx="8" fill="#ffffff" stroke="#c9c2b4" stroke-width="1"/><text x="915.0" y="184.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:400;font-size:12px">A case, anecdote or episode</text><rect x="792" y="222" width="246" height="56" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="915.0" y="248.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">What it is being used to</text><text x="915.0" y="262.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">show</text><rect x="792" y="286" width="246" height="56" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="915.0" y="312.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">The general claim</text><rect x="792" y="350" width="246" height="56" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="915.0" y="376.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:12px">Elaboration</text><line x1="812" y1="416" x2="1018" y2="416" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="915.0" y="440.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">The story is the illustration,</text><text x="915.0" y="455.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">never the point. Ask what</text><text x="915.0" y="470.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">claim it serves.</text><rect x="24" y="488" width="1012" height="122" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="530.0" y="518.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:14px">Ask this at every paragraph break</text><text x="530.0" y="540.0" class="" text-anchor="middle" style="font-size:12.5px">Is this the author speaking — or a view the author is about to complicate, qualify or reject? A contrast word</text><text x="530.0" y="557.5" class="" text-anchor="middle" style="font-size:12.5px">(however, yet, nevertheless, and yet) very often marks the sentence where the answer to that question changes.</text><text x="530.0" y="575.0" class="" text-anchor="middle" style="font-size:12.5px">Concession words (admittedly, granted, to be sure, one might argue) mark a view being granted before it is countered,</text><text x="530.0" y="592.5" class="" text-anchor="middle" style="font-size:12.5px">not a view being adopted.</text></svg>