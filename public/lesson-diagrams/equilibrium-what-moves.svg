<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="916" viewBox="0 0 1180 916" role="img" aria-labelledby="t d"><title id="t">What moves, and what does not</title><desc id="d">A number line places the reaction quotient against the equilibrium constant. Where the quotient is below the constant there is too little product, so the reaction runs forward; where they are equal the system is at equilibrium and nothing changes on balance; where the quotient is above the constant there is too much product, so the reaction runs in reverse. A worked clinical case follows: hyperventilation blows off carbon dioxide, which is a reactant in the carbonic acid equilibrium, so removing it shrinks the denominator and the quotient rises above the constant, and the reaction runs left, consuming hydrogen ions and raising blood pH, which is respiratory alkalosis. A table of stresses records, for each, which way the system shifts and whether the equilibrium constant itself changes. Adding a reactant or removing a product shifts the system right and leaves the constant unchanged. Compressing a gas mixture shifts it toward whichever side has fewer moles of gas and leaves the constant unchanged. Adding an inert gas at constant volume does nothing at all, because no partial pressure changes. Adding a catalyst does nothing to the position either; it only shortens the time taken to arrive. Changing the temperature is the only stress that changes the constant: for an exothermic reaction, heating lowers it, and for an endothermic reaction, heating raises it. A panel gives the algebra of manipulating equilibrium constants: reversing a reaction inverts the constant, multiplying all coefficients by a number raises the constant to that power, and adding two reactions multiplies their constants, which is the equilibrium counterpart of Hess&#x27;s law. These are worked on a chain where A to B has a constant of 4.0 and B to C has 0.50, so A to C has 2.0, and where reversing and doubling A to B gives 0.0625. A final panel covers converting between the concentration and pressure forms of the constant: the pressure form equals the concentration form times the gas constant times temperature raised to the change in gaseous moles, worked for three reactions with changes of minus two, minus one and zero, and notes that the two constants describe the same equilibrium in different units, so the numerical difference between them is the conversion factor alone and says nothing about which side is favoured.</desc><defs><marker id="m338" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8324a"/></marker><marker id="m8436" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b7a64"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1180" height="916" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">What moves, and what does not</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Every equilibrium question is one of three things: which way does it run, what happens to K, or what does the algebra do to K. Only one stress on this page changes K at all.</text><rect x="24" y="150" width="700" height="200" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="374.0" y="178.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">WHICH WAY DOES IT RUN? COMPARE Q WITH K</text><line x1="70" y1="250" x2="678" y2="250" stroke="#18364a" stroke-width="2.5"/><line x1="374.0" y1="234" x2="374.0" y2="266" stroke="#18364a" stroke-width="2.5"/><text x="374.0" y="284.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13px">Q = K</text><text x="374.0" y="302.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">at equilibrium · no net change</text><line x1="144.0" y1="210" x2="284.0" y2="210" stroke="#5b7a64" stroke-width="2.5" marker-end="url(#m8436)"/><text x="214.0" y="198.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:12px">runs FORWARD</text><text x="214.0" y="284.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:13px">Q &lt; K</text><text x="214.0" y="302.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">too little product yet</text><line x1="604.0" y1="210" x2="464.0" y2="210" stroke="#a8324a" stroke-width="2.5" marker-end="url(#m338)"/><text x="534.0" y="198.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12px">runs in REVERSE</text><text x="534.0" y="284.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:13px">Q &gt; K</text><text x="534.0" y="302.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:10.5px">too much product</text><text x="374.0" y="326.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:11.5px">Q has the same form as K — it just uses the concentrations you have right now</text><rect x="744" y="150" width="408" height="200" rx="12" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="948.0" y="178.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:12.5px">WORKED — HYPERVENTILATION</text><text x="948.0" y="210.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:11.5px">CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻</text><text x="948.0" y="248.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:400;font-size:11.5px">blow off CO₂ → a REACTANT is removed</text><text x="948.0" y="267.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:400;font-size:11.5px">the denominator shrinks → Q RISES</text><text x="948.0" y="286.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:400;font-size:11.5px">Q &gt; K → the reaction runs LEFT</text><text x="948.0" y="305.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:400;font-size:11.5px">H⁺ is consumed → pH rises</text><text x="948.0" y="343.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:11.5px">respiratory alkalosis</text><rect x="24" y="374" width="700" height="230" rx="12" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="374.0" y="402.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:12.5px">STRESS → WHICH WAY IT SHIFTS, AND WHETHER K CHANGES</text><text x="700.0" y="426.0" class="" text-anchor="end" style="fill:#6d716f;font-size:9.5px">does K change?</text><text x="48.0" y="452.0" class="" text-anchor="start" style="fill:#18364a;font-weight:400;font-size:11.5px">add a reactant / remove a product</text><text x="600.0" y="452.0" class="" text-anchor="end" style="fill:#6d716f;font-size:11px">shifts right</text><text x="700.0" y="452.0" class="" text-anchor="end" style="fill:#6d716f;font-weight:400;font-size:11px">no</text><text x="48.0" y="476.0" class="" text-anchor="start" style="fill:#18364a;font-weight:400;font-size:11.5px">compress the gas (raise P)</text><text x="600.0" y="476.0" class="" text-anchor="end" style="fill:#6d716f;font-size:11px">toward fewer moles of gas</text><text x="700.0" y="476.0" class="" text-anchor="end" style="fill:#6d716f;font-weight:400;font-size:11px">no</text><text x="48.0" y="500.0" class="" text-anchor="start" style="fill:#18364a;font-weight:400;font-size:11.5px">add inert gas at constant V</text><text x="600.0" y="500.0" class="" text-anchor="end" style="fill:#6d716f;font-size:11px">no shift at all</text><text x="700.0" y="500.0" class="" text-anchor="end" style="fill:#6d716f;font-weight:400;font-size:11px">no</text><text x="48.0" y="524.0" class="" text-anchor="start" style="fill:#18364a;font-weight:400;font-size:11.5px">add a catalyst</text><text x="600.0" y="524.0" class="" text-anchor="end" style="fill:#6d716f;font-size:11px">no shift — just gets there sooner</text><text x="700.0" y="524.0" class="" text-anchor="end" style="fill:#6d716f;font-weight:400;font-size:11px">no</text><text x="48.0" y="548.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:700;font-size:11.5px">RAISE T, exothermic</text><text x="600.0" y="548.0" class="" text-anchor="end" style="fill:#6d716f;font-size:11px">shifts left</text><text x="700.0" y="548.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:700;font-size:11px">YES — K falls</text><text x="48.0" y="572.0" class="" text-anchor="start" style="fill:#a8324a;font-weight:700;font-size:11.5px">RAISE T, endothermic</text><text x="600.0" y="572.0" class="" text-anchor="end" style="fill:#6d716f;font-size:11px">shifts right</text><text x="700.0" y="572.0" class="" text-anchor="end" style="fill:#a8324a;font-weight:700;font-size:11px">YES — K rises</text><text x="374.0" y="590.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:11.5px">Temperature is the ONLY stress that changes K — everything else just moves the mixture along a fixed K</text><rect x="744" y="374" width="408" height="230" rx="12" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="948.0" y="402.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:12.5px">THE ALGEBRA OF K</text><text x="768.0" y="434.0" class="" text-anchor="start" style="fill:#18364a;font-size:11.5px">reverse the reaction</text><text x="1128.0" y="434.0" class="" text-anchor="end" style="fill:#5b7a64;font-weight:700;font-size:12px">K → 1/K</text><text x="768.0" y="460.0" class="" text-anchor="start" style="fill:#18364a;font-size:11.5px">multiply coefficients by n</text><text x="1128.0" y="460.0" class="" text-anchor="end" style="fill:#5b7a64;font-weight:700;font-size:12px">K → Kⁿ</text><text x="768.0" y="486.0" class="" text-anchor="start" style="fill:#18364a;font-size:11.5px">add two reactions</text><text x="1128.0" y="486.0" class="" text-anchor="end" style="fill:#5b7a64;font-weight:700;font-size:12px">K → K₁ × K₂</text><line x1="768" y1="516" x2="1128" y2="516" stroke="#d9d2c4" stroke-width="1" stroke-dasharray="6 5"/><text x="948.0" y="538.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:400;font-size:11.5px">A ⇌ B  K = 4.0     B ⇌ C  K = 0.50</text><text x="948.0" y="559.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:11.5px">A ⇌ C   →   4.0 × 0.50 = 2.0</text><text x="948.0" y="580.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:11.5px">2B ⇌ 2A  →  (1/4.0)² = 0.0625</text><rect x="24" y="628" width="1128" height="160" rx="12" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="588.0" y="656.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:13px">Kₚ = Kᴄ (RT)^Δn     Δn = moles of GASEOUS products − moles of GASEOUS reactants</text><text x="60.0" y="690.0" class="" text-anchor="start" style="fill:#18364a;font-size:11.5px">N₂ + 3H₂ ⇌ 2NH₃</text><text x="520.0" y="690.0" class="" text-anchor="end" style="fill:#987740;font-weight:700;font-size:11.5px">Δn = 2 − 4 = −2</text><text x="800.0" y="690.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:11.5px">Kₚ = Kᴄ / (RT)²</text><text x="1140.0" y="690.0" class="" text-anchor="end" style="fill:#6d716f;font-size:11px">Kₚ &lt; Kᴄ</text><text x="60.0" y="716.0" class="" text-anchor="start" style="fill:#18364a;font-size:11.5px">2SO₂ + O₂ ⇌ 2SO₃</text><text x="520.0" y="716.0" class="" text-anchor="end" style="fill:#987740;font-weight:700;font-size:11.5px">Δn = 2 − 3 = −1</text><text x="800.0" y="716.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:11.5px">Kₚ = Kᴄ / RT</text><text x="1140.0" y="716.0" class="" text-anchor="end" style="fill:#6d716f;font-size:11px">Kₚ &lt; Kᴄ</text><text x="60.0" y="742.0" class="" text-anchor="start" style="fill:#18364a;font-size:11.5px">H₂ + I₂ ⇌ 2HI</text><text x="520.0" y="742.0" class="" text-anchor="end" style="fill:#987740;font-weight:700;font-size:11.5px">Δn = 2 − 2 = 0</text><text x="800.0" y="742.0" class="" text-anchor="end" style="fill:#18364a;font-weight:700;font-size:11.5px">Kₚ = Kᴄ</text><text x="1140.0" y="742.0" class="" text-anchor="end" style="fill:#6d716f;font-size:11px">identical</text><text x="588.0" y="772.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:11.5px">Solids and liquids are not counted in Δn — and Kₚ ≠ Kᴄ is a change of UNITS, not of which side is favoured</text><rect x="24" y="806" width="1128" height="88" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="588.0" y="836.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:13.5px">The one that is not about equilibrium at all</text><text x="588.0" y="857.5" class="" text-anchor="middle" style="font-size:12px">A large K says the products win at equilibrium; it says nothing about how long that takes. Diamond is thermodynamically unstable with respect to</text><text x="588.0" y="874.5" class="" text-anchor="middle" style="font-size:12px">graphite and sits on your finger for a lifetime. Kinetics and thermodynamics answer different questions.</text></svg>