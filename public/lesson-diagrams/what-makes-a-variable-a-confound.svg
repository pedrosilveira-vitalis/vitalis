<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1004" viewBox="0 0 920 1004" role="img" aria-labelledby="t d"><title id="t">What makes a variable a confound</title><desc id="d">Top: the test that decides it. A variable outside the manipulation has to do two things at once to be a confound: affect the outcome AND vary with the group. Hold it constant across groups and it is merely extraneous; it adds noise and costs power, but it cannot create a false result. Let it track the independent variable and it becomes a rival explanation for the finding, which is what internal validity means. Middle: the four defences, and what each one actually buys. Bottom: the blinding ladder, with the specific bias each level removes — passages routinely describe one level and ask which bias remains.</desc><defs><marker id="m5214" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker><marker id="m7518" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#18364a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="1004" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">What makes a variable a confound</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Not every nuisance is a confound — only the ones that travel with the IV</text><rect x="40" y="180" width="840" height="274" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">The two-part test</text><rect x="300" y="228" width="320" height="44" rx="9" fill="#efede8" stroke="#6d716f" stroke-width="1.8"/><text x="460.0" y="254.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:11px">a variable you did not manipulate</text><line x1="460" y1="274" x2="460" y2="298" stroke="#6d716f" stroke-width="2.5" marker-end="url(#m5214)"/><rect x="270" y="302" width="380" height="40" rx="8" fill="#e8ecef" stroke="#18364a" stroke-width="1.6"/><text x="460.0" y="327.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10.5px">does it affect the DEPENDENT variable?</text><line x1="370" y1="344" x2="250" y2="374" stroke="#6d716f" stroke-width="1.4" marker-end="url(#m5214)"/><text x="298.0" y="353.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">no</text><line x1="550" y1="344" x2="640" y2="374" stroke="#18364a" stroke-width="1.4" marker-end="url(#m7518)"/><text x="609.0" y="353.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">yes</text><rect x="72" y="378" width="300" height="54" rx="8" fill="#efede8" stroke="#6d716f" stroke-width="1.6"/><text x="222.0" y="400.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:10.5px">IRRELEVANT</text><text x="222.0" y="418.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">ignore it</text><rect x="496" y="378" width="380" height="40" rx="8" fill="#e8ecef" stroke="#18364a" stroke-width="1.6"/><text x="686.0" y="403.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">does it VARY WITH the independent variable?</text><text x="460.0" y="466.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px"> </text><rect x="40" y="470" width="410" height="116" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="245.0" y="496.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11.5px">NO — held constant across groups</text><text x="245.0" y="518.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10.5px">EXTRANEOUS / NUISANCE VARIABLE</text><text x="245.0" y="538.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">adds random noise, widens the spread,</text><text x="245.0" y="554.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">costs statistical power — but it pushes</text><text x="245.0" y="570.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">neither group&#x27;s result in either direction</text><rect x="470" y="470" width="410" height="116" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="675.0" y="496.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11.5px">YES — it tracks the groups</text><text x="675.0" y="518.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">CONFOUNDING VARIABLE</text><text x="675.0" y="538.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">a rival explanation for the finding: the</text><text x="675.0" y="554.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">difference may be its doing, not the IV&#x27;s.</text><text x="675.0" y="570.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">This is the threat to INTERNAL VALIDITY</text><rect x="40" y="602" width="840" height="180" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="630.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:14px">Four defences, and what each buys</text><rect x="60" y="648" width="200" height="118" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="160.0" y="670.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:9.5px">RANDOM ASSIGNMENT</text><text x="160.0" y="690.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">balances KNOWN and</text><text x="160.0" y="704.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">UNKNOWN confounds</text><text x="160.0" y="728.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">the only one that</text><text x="160.0" y="742.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">handles the unknown</text><rect x="265" y="648" width="200" height="118" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="365.0" y="670.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:9.5px">HOLDING CONSTANT</text><text x="365.0" y="690.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">same room, same time,</text><text x="365.0" y="704.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">same instructions</text><text x="365.0" y="728.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">turns a confound into</text><text x="365.0" y="742.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">an extraneous variable</text><rect x="470" y="648" width="200" height="118" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="570.0" y="670.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:9.5px">MATCHING / STRATIFYING</text><text x="570.0" y="690.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">balance one named</text><text x="570.0" y="704.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">variable on purpose</text><text x="570.0" y="728.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">protects against bad</text><text x="570.0" y="742.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">luck in small samples</text><rect x="675" y="648" width="200" height="118" rx="9" fill="#e8ecef" stroke="#18364a" stroke-width="1.8"/><text x="775.0" y="670.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:9.5px">COUNTERBALANCING</text><text x="775.0" y="690.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">vary the ORDER of</text><text x="775.0" y="704.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">conditions</text><text x="775.0" y="728.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">for within-subjects</text><text x="775.0" y="742.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">order effects only</text><rect x="40" y="798" width="840" height="184" rx="12" fill="none" stroke="#245574" stroke-width="2"/><text x="460.0" y="826.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:14px">The blinding ladder: which bias each rung removes</text><rect x="60" y="846" width="800" height="30" rx="6" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.4"/><text x="150.0" y="865.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10px">NONE</text><text x="330.0" y="865.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">everyone knows</text><text x="660.0" y="859.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">placebo effect, demand characteristics,</text><text x="660.0" y="871.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">experimenter bias all live here</text><rect x="60" y="879" width="800" height="30" rx="6" fill="#f1eadc" stroke="#987740" stroke-width="1.4"/><text x="150.0" y="898.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10px">SINGLE-BLIND</text><text x="330.0" y="898.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">participants do not know</text><text x="660.0" y="892.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">removes the PLACEBO EFFECT and</text><text x="660.0" y="904.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">DEMAND CHARACTERISTICS</text><rect x="60" y="912" width="800" height="30" rx="6" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.4"/><text x="150.0" y="931.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:10px">DOUBLE-BLIND</text><text x="330.0" y="925.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">participants and the staff</text><text x="330.0" y="937.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">who treat and assess</text><text x="660.0" y="925.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">adds EXPERIMENTER / OBSERVER BIAS —</text><text x="660.0" y="937.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">the standard for a drug trial</text><rect x="60" y="945" width="800" height="30" rx="6" fill="#e4edf3" stroke="#245574" stroke-width="1.4"/><text x="150.0" y="964.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10px">TRIPLE-BLIND</text><text x="330.0" y="964.0" class="" text-anchor="middle" style="fill:#18364a;font-size:8.5px">the data analysts too</text><text x="660.0" y="958.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">guards against selective analysis</text><text x="660.0" y="970.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:8.5px">and framing of the results</text></svg>