<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc"><title id="title">Tissue-specific control of fuel use</title><desc id="desc">Insulin supports hepatic storage and muscle and adipose GLUT4 glucose uptake. Fasting glucagon supports liver glucose output; low insulin and catecholamines support adipose lipolysis. AMPK senses local energy stress. AMP directly activates AMPK; ADP can protect its activating phosphorylation.</desc><style>text{font-family:Arial,sans-serif;fill:#18364a}.h{font-size:22px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.bond{stroke:#18364a;stroke-width:3;fill:none}.accent{stroke:#aa3653;stroke-width:4;fill:none}</style><rect width="800" height="740" fill="#fbf7ef" rx="20"/><text x="32" y="40" class="h" text-anchor="start">Predict metabolism: signal → tissue → response</text><rect x="24" y="60" width="752" height="186" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="94" class="h" text-anchor="start">FED: insulin-dominant signaling</text><text x="55" y="133" class="t" text-anchor="start">Liver</text><path d="M165 127 L245 127" class="bond" /><text x="270" y="133" class="t" text-anchor="start">Glycogen storage ↑; glucose output ↓</text><text x="55" y="172" class="t" text-anchor="start">Muscle</text><path d="M165 166 L245 166" class="bond" /><text x="270" y="172" class="t" text-anchor="start">GLUT4 uptake ↑; glycogen storage ↑</text><text x="55" y="211" class="t" text-anchor="start">Adipose</text><path d="M165 205 L245 205" class="bond" /><text x="270" y="211" class="t" text-anchor="start">GLUT4 uptake ↑; lipolysis ↓</text><rect x="24" y="262" width="752" height="186" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="296" class="h" text-anchor="start">FASTING: coordinate different organs</text><text x="55" y="335" class="t" text-anchor="start">Glucagon → liver → glycogenolysis + gluconeogenesis</text><text x="55" y="374" class="t" text-anchor="start">Low insulin + catecholamines → adipose fuel release</text><text x="55" y="413" class="s" text-anchor="start">Skeletal muscle does not use glucagon as its direct signal.</text><rect x="24" y="464" width="752" height="159" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="498" class="h" text-anchor="start">LOCAL: AMPK responds to energy stress</text><text x="55" y="537" class="s" text-anchor="start">AMP: direct allosteric activation + phosphorylation protection</text><text x="55" y="574" class="s" text-anchor="start">ADP: phosphorylation protection, not direct AMP-like allostery</text><text x="55" y="606" class="s" text-anchor="start">Common response: ACC inhibition → malonyl-CoA production ↓</text><rect x="24" y="639" width="752" height="77" rx="16" fill="white" stroke="#d9d2c6"/><text x="44" y="671" class="h" text-anchor="start">Check the isoform</text><text x="55" y="699" class="s" text-anchor="start">Liver PFK-2 is favored by dephosphorylation; heart regulation differs.</text></svg>