<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="716" viewBox="0 0 1060 716" role="img" aria-labelledby="t d"><title id="t">The same four traps, wearing three different costumes</title><desc id="d">A four-row matrix. Each row is a wrong-answer category and each of the three columns shows how that category appears in Foundations of Comprehension, Reasoning Within the Text and Reasoning Beyond the Text questions. Out of scope: in Foundations, a related idea the passage never mentions, often something true in the world; in Within, a premise the argument never actually relies on offered as the author&#x27;s assumption; in Beyond, an extension so distant the passage gives no basis for it. Too extreme: in Foundations, caused where the author wrote contributed to; in Within, to prove the critics wrong where the author only acknowledged complexity; in Beyond, the argument completely undermined or definitively proven by one new fact. Opposite: in Foundations, a stated relationship flipped; in Within, the denial of the assumption rather than the assumption; in Beyond, a weakener offered to a strengthen stem or the reverse. Half-right: in Foundations, right subject and wrong predicate or the reverse; in Within, names the evidence correctly but misnames why the author uses it; in Beyond, finds the right principle then misapplies its condition. A footer gives the four-step protocol: classify the question before reading any choice, predict directionally, name the pathology out loud when eliminating rather than cutting on feel, and then verify that the survivor is positively supported rather than merely last standing.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="1060" height="716" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">The same four traps, wearing three different costumes</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">A trap category is not a fixed sentence. It changes shape with the job the question is asking you to do.</text><text x="349.0" y="118.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:14px">FOUNDATIONS</text><text x="619.0" y="118.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:14px">WITHIN</text><text x="889.0" y="118.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:14px">BEYOND</text><rect x="28" y="128" width="176" height="114" rx="10" fill="#e5ece3" stroke="#5b7a64" stroke-width="2"/><text x="116.0" y="160.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:700;font-size:14px">OUT OF SCOPE</text><text x="116.0" y="180.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">content the passage</text><text x="116.0" y="194.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">never raises</text><rect x="214" y="128" width="260" height="114" rx="10" fill="#ffffff" stroke="#d9d2c4" stroke-width="1"/><text x="344.0" y="156.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">a related idea the passage never</text><text x="344.0" y="171.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">mentions — often something you know</text><text x="344.0" y="186.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">is true in the world</text><rect x="484" y="128" width="260" height="114" rx="10" fill="#ffffff" stroke="#d9d2c4" stroke-width="1"/><text x="614.0" y="156.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">a premise the argument never</text><text x="614.0" y="171.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">actually relies on, offered as the</text><text x="614.0" y="186.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">author&#x27;s assumption</text><rect x="754" y="128" width="260" height="114" rx="10" fill="#ffffff" stroke="#d9d2c4" stroke-width="1"/><text x="884.0" y="156.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">an extension so distant the passage</text><text x="884.0" y="171.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">gives no basis for it — a different</text><text x="884.0" y="186.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">logic, not the author&#x27;s</text><rect x="28" y="252" width="176" height="114" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="116.0" y="284.0" class="" text-anchor="middle" style="fill:#245574;font-weight:700;font-size:14px">TOO EXTREME</text><text x="116.0" y="304.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">stronger than the author</text><text x="116.0" y="318.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">committed to</text><rect x="214" y="252" width="260" height="114" rx="10" fill="#ffffff" stroke="#d9d2c4" stroke-width="1"/><text x="344.0" y="280.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">“caused” where the author wrote</text><text x="344.0" y="295.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">“contributed to” — the qualifier</text><text x="344.0" y="310.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">quietly erased</text><rect x="484" y="252" width="260" height="114" rx="10" fill="#ffffff" stroke="#d9d2c4" stroke-width="1"/><text x="614.0" y="280.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">“to prove the critics wrong” where</text><text x="614.0" y="295.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">the author only acknowledged</text><text x="614.0" y="310.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">complexity</text><rect x="754" y="252" width="260" height="114" rx="10" fill="#ffffff" stroke="#d9d2c4" stroke-width="1"/><text x="884.0" y="280.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">the argument “completely undermined”</text><text x="884.0" y="295.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">or “definitively proven” by one new</text><text x="884.0" y="310.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">fact</text><rect x="28" y="376" width="176" height="114" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="116.0" y="408.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:700;font-size:14px">OPPOSITE</text><text x="116.0" y="428.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">right vocabulary,</text><text x="116.0" y="442.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">reversed direction</text><rect x="214" y="376" width="260" height="114" rx="10" fill="#ffffff" stroke="#d9d2c4" stroke-width="1"/><text x="344.0" y="404.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">a stated relationship flipped:</text><text x="344.0" y="419.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">increases becomes decreases</text><rect x="484" y="376" width="260" height="114" rx="10" fill="#ffffff" stroke="#d9d2c4" stroke-width="1"/><text x="614.0" y="404.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">the denial of the assumption — the</text><text x="614.0" y="419.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">claim that would destroy the</text><text x="614.0" y="434.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">argument, not sustain it</text><rect x="754" y="376" width="260" height="114" rx="10" fill="#ffffff" stroke="#d9d2c4" stroke-width="1"/><text x="884.0" y="404.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">a weakener offered to a strengthen</text><text x="884.0" y="419.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">stem, or the reverse; re-read the</text><text x="884.0" y="434.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">stem first</text><rect x="28" y="500" width="176" height="114" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="116.0" y="532.0" class="" text-anchor="middle" style="fill:#987740;font-weight:700;font-size:14px">HALF-RIGHT</text><text x="116.0" y="552.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">one true clause carrying</text><text x="116.0" y="566.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:11px">one false one</text><rect x="214" y="500" width="260" height="114" rx="10" fill="#ffffff" stroke="#d9d2c4" stroke-width="1"/><text x="344.0" y="528.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">right subject, wrong predicate — or</text><text x="344.0" y="543.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">right predicate, wrong subject</text><rect x="484" y="500" width="260" height="114" rx="10" fill="#ffffff" stroke="#d9d2c4" stroke-width="1"/><text x="614.0" y="528.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">names the evidence correctly, but</text><text x="614.0" y="543.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">misnames why the author uses it</text><rect x="754" y="500" width="260" height="114" rx="10" fill="#ffffff" stroke="#d9d2c4" stroke-width="1"/><text x="884.0" y="528.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">finds the right passage principle,</text><text x="884.0" y="543.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">then misapplies its condition to the</text><text x="884.0" y="558.0" class="" text-anchor="middle" style="fill:#18364a;font-size:12px">new case</text><rect x="28" y="624" width="1004" height="80" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="530.0" y="654.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:700;font-size:14px">Eliminate by diagnosis, not by feel</text><text x="530.0" y="676.0" class="" text-anchor="middle" style="font-size:12.5px">Classify the question before you read a single choice · predict directionally · name the pathology out loud as you cut ·</text><text x="530.0" y="693.5" class="" text-anchor="middle" style="font-size:12.5px">then check the survivor is positively supported, not merely last standing.</text></svg>