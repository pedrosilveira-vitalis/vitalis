<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img" aria-labelledby="t d"><title id="t">E2 needs the beta-H and the leaving group antiperiplanar</title><desc id="d">Two Newman projections compare a 180 degree dihedral between the beta hydrogen and the leaving group, which reacts, with a 60 degree gauche arrangement, which does not. A cyclohexane chair below shows that the same requirement forces both the leaving group and the beta hydrogen onto adjacent axial positions, so an equatorial leaving group must ring-flip before E2 can occur.</desc><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="900" height="660" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">E2 needs the beta-H and the leaving group antiperiplanar</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">A 180 degree H-C-C-LG dihedral lets the breaking C-H bond overlap with the back lobe of the C-LG bond. Nothing else works.</text><circle cx="210" cy="240" r="46" fill="#ffffff" stroke="#18364a" stroke-width="2.5"/><line x1="249.8371685740842" y1="217.0" x2="275.8179306876174" y2="202.0" stroke="#6d716f" stroke-width="2.5"/><text x="288.8" y="199.5" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">R</text><line x1="170.1628314259158" y1="217.0" x2="144.18206931238265" y2="202.0" stroke="#6d716f" stroke-width="2.5"/><text x="131.2" y="199.5" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">R</text><line x1="210.0" y1="286.0" x2="210.0" y2="316.0" stroke="#5b7a64" stroke-width="2.5"/><text x="210.0" y="336.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">LG</text><line x1="210" y1="240" x2="210.0" y2="164.0" stroke="#5b7a64" stroke-width="2.5"/><text x="210.0" y="154.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:15px">H</text><line x1="210" y1="240" x2="144.18206931238268" y2="278.0" stroke="#18364a" stroke-width="2.5"/><text x="131.2" y="290.5" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">R</text><line x1="210" y1="240" x2="275.8179306876173" y2="278.00000000000006" stroke="#18364a" stroke-width="2.5"/><text x="288.8" y="290.5" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">R</text><circle cx="210" cy="240" r="4" fill="#18364a" stroke="#18364a" stroke-width="0"/><text x="210.0" y="114.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:19px">180° — antiperiplanar</text><text x="210.0" y="360.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:17px">E2 proceeds</text><text x="210.0" y="382.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">C–H breaks into the back lobe of C–LG</text><circle cx="660" cy="240" r="46" fill="#ffffff" stroke="#18364a" stroke-width="2.5"/><line x1="699.8371685740842" y1="217.0" x2="725.8179306876174" y2="202.0" stroke="#a8324a" stroke-width="2.5"/><text x="738.8" y="199.5" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">LG</text><line x1="620.1628314259158" y1="217.0" x2="594.1820693123826" y2="202.0" stroke="#6d716f" stroke-width="2.5"/><text x="581.2" y="199.5" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">R</text><line x1="660.0" y1="286.0" x2="660.0" y2="316.0" stroke="#6d716f" stroke-width="2.5"/><text x="660.0" y="336.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:15px">R</text><line x1="660" y1="240" x2="660.0" y2="164.0" stroke="#a8324a" stroke-width="2.5"/><text x="660.0" y="154.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:15px">H</text><line x1="660" y1="240" x2="594.1820693123826" y2="278.0" stroke="#18364a" stroke-width="2.5"/><text x="581.2" y="290.5" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">R</text><line x1="660" y1="240" x2="725.8179306876173" y2="278.00000000000006" stroke="#18364a" stroke-width="2.5"/><text x="738.8" y="290.5" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">R</text><circle cx="660" cy="240" r="4" fill="#18364a" stroke="#18364a" stroke-width="0"/><text x="660.0" y="114.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:19px">60° — gauche</text><text x="660.0" y="360.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:17px">no E2 from this rotamer</text><text x="660.0" y="382.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:13px">orbitals cannot align; rotate first</text><text x="435.0" y="240.0" class="" text-anchor="middle" style="fill:#6d716f;font-weight:bold;font-size:20px">vs</text><rect x="60" y="404" width="780" height="206" rx="12" fill="#e8ecef" stroke="#18364a" stroke-width="2"/><text x="450.0" y="432.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:18px">In a cyclohexane the only 180° pairs are adjacent axial bonds</text><line x1="200.0" y1="505.0" x2="240.0" y2="533.0" stroke="#18364a" stroke-width="2.5"/><line x1="240.0" y1="533.0" x2="300.0" y2="519.0" stroke="#18364a" stroke-width="2.5"/><line x1="300.0" y1="519.0" x2="340.0" y2="491.0" stroke="#18364a" stroke-width="2.5"/><line x1="340.0" y1="491.0" x2="300.0" y2="463.0" stroke="#18364a" stroke-width="2.5"/><line x1="300.0" y1="463.0" x2="240.0" y2="477.0" stroke="#18364a" stroke-width="2.5"/><line x1="240.0" y1="477.0" x2="200.0" y2="505.0" stroke="#18364a" stroke-width="2.5"/><line x1="240.0" y1="533.0" x2="240.0" y2="567.0" stroke="#5b7a64" stroke-width="2.5"/><text x="240.0" y="585.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">LG, axial</text><line x1="200.0" y1="505.0" x2="200.0" y2="471.0" stroke="#5b7a64" stroke-width="2.5"/><text x="200.0" y="463.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">β-H, axial</text><text x="646.0" y="472.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">Adjacent axial bonds point in opposite</text><text x="646.0" y="493.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">directions, so they are the only 180°</text><text x="646.0" y="514.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">pair on the ring. An equatorial leaving</text><text x="646.0" y="535.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">group must ring-flip to axial first, and</text><text x="646.0" y="556.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">if the flipped chair offers no adjacent</text><text x="646.0" y="577.0" class="" text-anchor="middle" style="fill:#18364a;font-size:15px">axial β-H, E2 is shut down altogether.</text></svg>