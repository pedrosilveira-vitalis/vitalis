<svg xmlns="http://www.w3.org/2000/svg" width="920" height="960" viewBox="0 0 920 960" role="img" aria-labelledby="t d"><title id="t">Three words, four levels, one set of defences</title><desc id="d">Top: the tripartite structure the exam insists on. A stereotype is the belief, prejudice is the feeling, discrimination is the act, and the links between them are loose in both directions: someone can be prejudiced without discriminating, and an institution can discriminate with nobody in it prejudiced. Middle: the four levels at which an explanation can sit. A question is usually asking you to pick the level, not just the term — cognitive shortcuts, the need for a good group to belong to, personality and ideology, or structure and policy. Bottom: why counter-evidence so rarely lands. Subtyping files the exception away, the ultimate attribution error explains it away, and contact only works under Allport&#x27;s four conditions.</desc><defs><marker id="m9404" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6d716f"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364a;font-size:18px}.h{font-size:26px;font-weight:700}.small{font-size:15px}</style><rect width="920" height="960" rx="20" fill="#fbf7ef"/><text x="32.0" y="44.0" class="h" text-anchor="start">Three words, four levels, one set of defences</text><text x="32.0" y="74.0" class="small" text-anchor="start" style="fill:#6d716f">Thought, feeling, action — and the machinery that keeps all three in place</text><rect x="40" y="180" width="840" height="182" rx="12" fill="none" stroke="#18364a" stroke-width="2"/><text x="460.0" y="208.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:15px">Belief, feeling, act</text><rect x="70" y="228" width="230" height="100" rx="10" fill="#e4edf3" stroke="#245574" stroke-width="2"/><text x="185.0" y="252.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:12.5px">STEREOTYPE</text><text x="185.0" y="270.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">COGNITIVE</text><text x="185.0" y="292.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">a belief about what</text><text x="185.0" y="306.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">members of a group are like</text><rect x="330" y="228" width="230" height="100" rx="10" fill="#f1eadc" stroke="#987740" stroke-width="2"/><text x="445.0" y="252.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:12.5px">PREJUDICE</text><text x="445.0" y="270.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">AFFECTIVE</text><text x="445.0" y="292.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">an attitude — how you feel</text><text x="445.0" y="306.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">about them, before meeting one</text><rect x="590" y="228" width="230" height="100" rx="10" fill="#f5e6e8" stroke="#a8324a" stroke-width="2"/><text x="705.0" y="252.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:12.5px">DISCRIMINATION</text><text x="705.0" y="270.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">BEHAVIOURAL</text><text x="705.0" y="292.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">treating someone differently</text><text x="705.0" y="306.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">because of their group</text><line x1="306" y1="278" x2="326" y2="278" stroke="#6d716f" stroke-width="2.5" marker-end="url(#m9404)"/><line x1="566" y1="278" x2="586" y2="278" stroke="#6d716f" stroke-width="2.5" marker-end="url(#m9404)"/><text x="460.0" y="350.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">the arrows are weak both ways: prejudice without discrimination, and discrimination without prejudice</text><rect x="40" y="378" width="840" height="288" rx="12" fill="none" stroke="#987740" stroke-width="2"/><text x="460.0" y="406.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:15px">Four levels an explanation can sit at</text><rect x="60" y="426" width="200" height="220" rx="9" fill="#e4edf3" stroke="#245574" stroke-width="1.8"/><text x="160.0" y="450.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:11.5px">COGNITIVE</text><text x="160.0" y="468.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">the mind takes shortcuts</text><line x1="82" y1="480" x2="238" y2="480" stroke="#245574" stroke-width="1" stroke-dasharray="6 5"/><text x="160.0" y="502.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">social categorisation</text><text x="160.0" y="520.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">accentuation and out-group</text><text x="160.0" y="538.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">homogeneity</text><text x="160.0" y="556.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">illusory correlation</text><text x="160.0" y="574.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">schemas, availability</text><rect x="265" y="426" width="200" height="220" rx="9" fill="#f1eadc" stroke="#987740" stroke-width="1.8"/><text x="365.0" y="450.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:11.5px">MOTIVATIONAL</text><text x="365.0" y="468.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">the group props up the self</text><line x1="287" y1="480" x2="443" y2="480" stroke="#987740" stroke-width="1" stroke-dasharray="6 5"/><text x="365.0" y="502.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">social identity theory</text><text x="365.0" y="520.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">minimal group paradigm</text><text x="365.0" y="538.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">realistic group conflict</text><text x="365.0" y="556.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">terror management</text><text x="365.0" y="574.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">scapegoating under frustration</text><rect x="470" y="426" width="200" height="220" rx="9" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.8"/><text x="570.0" y="450.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:11.5px">PERSONALITY</text><text x="570.0" y="468.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">some people more than others</text><line x1="492" y1="480" x2="648" y2="480" stroke="#5b7a64" stroke-width="1" stroke-dasharray="6 5"/><text x="570.0" y="502.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">right-wing authoritarianism</text><text x="570.0" y="520.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">social dominance orientation</text><text x="570.0" y="538.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">legitimising myths</text><text x="570.0" y="556.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">just-world belief</text><text x="570.0" y="574.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">and the victim-blaming it brings</text><rect x="675" y="426" width="200" height="220" rx="9" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.8"/><text x="775.0" y="450.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:11.5px">STRUCTURAL</text><text x="775.0" y="468.0" class="" text-anchor="middle" style="fill:#18364a;font-size:9px">nobody has to be a bigot</text><line x1="697" y1="480" x2="853" y2="480" stroke="#a8324a" stroke-width="1" stroke-dasharray="6 5"/><text x="775.0" y="502.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">institutional discrimination</text><text x="775.0" y="520.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">neutral policy, disparate impact</text><text x="775.0" y="538.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">sentencing, school funding,</text><text x="775.0" y="556.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">algorithms trained on old data</text><text x="775.0" y="574.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">intersectional compounding</text><rect x="40" y="682" width="410" height="258" rx="12" fill="none" stroke="#a8324a" stroke-width="2"/><text x="245.0" y="710.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:14px">Why counter-evidence bounces off</text><rect x="64" y="730" width="362" height="62" rx="8" fill="#f5e6e8" stroke="#a8324a" stroke-width="1.6"/><text x="245.0" y="751.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10.5px">SUBTYPING</text><text x="245.0" y="768.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">the exception gets its own box — “she&#x27;s not</text><text x="245.0" y="781.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">like the others” — and the rule survives</text><rect x="64" y="798" width="362" height="62" rx="8" fill="#f1eadc" stroke="#987740" stroke-width="1.6"/><text x="245.0" y="819.0" class="" text-anchor="middle" style="fill:#987740;font-weight:bold;font-size:10.5px">ULTIMATE ATTRIBUTION ERROR</text><text x="245.0" y="836.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">out-group success is luck, out-group failure</text><text x="245.0" y="849.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">is character; reversed for the in-group</text><rect x="64" y="866" width="362" height="62" rx="8" fill="#e4edf3" stroke="#245574" stroke-width="1.6"/><text x="245.0" y="887.0" class="" text-anchor="middle" style="fill:#245574;font-weight:bold;font-size:10.5px">CONFIRMATION BIAS</text><text x="245.0" y="904.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">the fitting case is noticed and remembered,</text><text x="245.0" y="917.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9px">the misfitting one is not</text><rect x="470" y="682" width="410" height="258" rx="12" fill="none" stroke="#5b7a64" stroke-width="2"/><text x="675.0" y="710.0" class="" text-anchor="middle" style="fill:#5b7a64;font-weight:bold;font-size:14px">Contact, but only on four conditions</text><rect x="494" y="732" width="362" height="36" rx="7" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="675.0" y="755.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">EQUAL STATUS inside the contact situation</text><rect x="494" y="774" width="362" height="36" rx="7" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="675.0" y="797.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">COMMON GOALS that neither group reaches alone</text><rect x="494" y="816" width="362" height="36" rx="7" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="675.0" y="839.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">COOPERATION, not competition</text><rect x="494" y="858" width="362" height="36" rx="7" fill="#e5ece3" stroke="#5b7a64" stroke-width="1.5"/><text x="675.0" y="881.0" class="" text-anchor="middle" style="fill:#18364a;font-weight:bold;font-size:10px">INSTITUTIONAL SUPPORT from those in charge</text><text x="675.0" y="906.0" class="" text-anchor="middle" style="fill:#a8324a;font-weight:bold;font-size:10px">without them, contact can entrench the stereotype instead</text><text x="675.0" y="926.0" class="" text-anchor="middle" style="fill:#6d716f;font-size:9.5px">superordinate goals work by recategorising: one group, not two</text></svg>