<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc"><title id="title">Water follows chemical potential</title><desc id="desc">A water-only membrane separates glucose from sodium chloride. Equal molarity does not imply equal particle concentration. Cell sketches compare hypertonic, isotonic and hypotonic conditions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245574"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#18364a;font-size:19px}.h{font-size:27px;font-weight:700}.sub{font-size:22px;font-weight:700}.s{font-size:16px}.tiny{font-size:14px}</style><rect width="900" height="760" rx="20" fill="#fbf7ef"/><text x="32" y="43" class="h" text-anchor="start">Count particles, then ask which can cross</text><text x="32" y="77" class="s" text-anchor="start">Ideal solutions • equal initial pressure • only water crosses</text><rect x="75" y="120" width="750" height="255" rx="14" fill="white" stroke="#245574" stroke-width="2"/><path d="M450 120V375" fill="none" stroke="#245574" stroke-width="3" stroke-dasharray="6 5"/><text x="260" y="152" class="" text-anchor="middle">0.1 M glucose</text><text x="640" y="152" class="" text-anchor="middle">0.1 M NaCl</text><rect x="121" y="196" width="18" height="18" rx="2" fill="#bdd0dc" stroke="#245574" stroke-width="2"/><rect x="241" y="226" width="18" height="18" rx="2" fill="#bdd0dc" stroke="#245574" stroke-width="2"/><rect x="361" y="186" width="18" height="18" rx="2" fill="#bdd0dc" stroke="#245574" stroke-width="2"/><rect x="161" y="286" width="18" height="18" rx="2" fill="#bdd0dc" stroke="#245574" stroke-width="2"/><rect x="321" y="316" width="18" height="18" rx="2" fill="#bdd0dc" stroke="#245574" stroke-width="2"/><circle cx="530" cy="205" r="10" fill="#bdd0dc" stroke="#245574" stroke-width="2"/><text x="530" y="210" class="tiny" text-anchor="middle">+</text><circle cx="554" cy="232" r="10" fill="white" stroke="#245574" stroke-width="2"/><text x="554" y="237" class="tiny" text-anchor="middle">−</text><circle cx="650" cy="235" r="10" fill="#bdd0dc" stroke="#245574" stroke-width="2"/><text x="650" y="240" class="tiny" text-anchor="middle">+</text><circle cx="674" cy="262" r="10" fill="white" stroke="#245574" stroke-width="2"/><text x="674" y="267" class="tiny" text-anchor="middle">−</text><circle cx="770" cy="195" r="10" fill="#bdd0dc" stroke="#245574" stroke-width="2"/><text x="770" y="200" class="tiny" text-anchor="middle">+</text><circle cx="794" cy="222" r="10" fill="white" stroke="#245574" stroke-width="2"/><text x="794" y="227" class="tiny" text-anchor="middle">−</text><circle cx="570" cy="295" r="10" fill="#bdd0dc" stroke="#245574" stroke-width="2"/><text x="570" y="300" class="tiny" text-anchor="middle">+</text><circle cx="594" cy="322" r="10" fill="white" stroke="#245574" stroke-width="2"/><text x="594" y="327" class="tiny" text-anchor="middle">−</text><circle cx="730" cy="325" r="10" fill="#bdd0dc" stroke="#245574" stroke-width="2"/><text x="730" y="330" class="tiny" text-anchor="middle">+</text><circle cx="754" cy="352" r="10" fill="white" stroke="#245574" stroke-width="2"/><text x="754" y="357" class="tiny" text-anchor="middle">−</text><text x="250" y="404" class="" text-anchor="middle">≈ 0.1 Osm/L</text><text x="650" y="404" class="" text-anchor="middle">≈ 0.2 Osm/L</text><path d="M350 445H550" fill="none" stroke="#245574" stroke-width="3" marker-end="url(#arrow)"/><text x="450" y="435" class="s" text-anchor="middle">Initial net H₂O flow</text><text x="32" y="500" class="sub" text-anchor="start">Tonicity predicts cell volume</text><circle cx="160" cy="595" r="31" fill="#e5eef2" stroke="#245574" stroke-width="2"/><circle cx="160" cy="595" r="12" fill="#bdd0dc" stroke="#245574" stroke-width="2"/><text x="160" y="692" class="sub" text-anchor="middle">Hypertonic</text><circle cx="450" cy="595" r="43" fill="#e5eef2" stroke="#245574" stroke-width="2"/><circle cx="450" cy="595" r="12" fill="#bdd0dc" stroke="#245574" stroke-width="2"/><text x="450" y="692" class="sub" text-anchor="middle">Isotonic</text><circle cx="740" cy="595" r="59" fill="#e5eef2" stroke="#245574" stroke-width="2"/><circle cx="740" cy="595" r="12" fill="#bdd0dc" stroke="#245574" stroke-width="2"/><text x="740" y="692" class="sub" text-anchor="middle">Hypotonic</text><path d="M115 595H74" fill="none" stroke="#245574" stroke-width="3" marker-end="url(#arrow)"/><path d="M205 595H246" fill="none" stroke="#245574" stroke-width="3" marker-end="url(#arrow)"/><path d="M393 577H359" fill="none" stroke="#245574" stroke-width="3" marker-end="url(#arrow)"/><path d="M360 616H394" fill="none" stroke="#245574" stroke-width="3" marker-end="url(#arrow)"/><path d="M508 577H541" fill="none" stroke="#245574" stroke-width="3" marker-end="url(#arrow)"/><path d="M541 616H507" fill="none" stroke="#245574" stroke-width="3" marker-end="url(#arrow)"/><path d="M637 595H674" fill="none" stroke="#245574" stroke-width="3" marker-end="url(#arrow)"/><path d="M843 595H806" fill="none" stroke="#245574" stroke-width="3" marker-end="url(#arrow)"/><text x="160" y="719" class="s" text-anchor="middle">Net water out</text><text x="450" y="719" class="s" text-anchor="middle">No net flow</text><text x="740" y="719" class="s" text-anchor="middle">Net water in</text></svg>